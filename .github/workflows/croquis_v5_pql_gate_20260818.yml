name: Croquis V5 PQL Gate 20260818

on:
  pull_request:
    branches:
      - house-step-v3-render-20260818

permissions:
  contents: read

jobs:
  pql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build and compile V5
        run: |
          set -euo pipefail
          python tools/croquis/build_house_v5.py
          python -m py_compile render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V5_CLOSED_CROQUIS_LATEX.py

      - name: Literal PQL render
        run: |
          set -euo pipefail
          mkdir -p media
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/preview-bin /tmp/manim-home
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/preview-bin/xdg-open
              chmod +x /tmp/preview-bin/xdg-open
              export PATH="/tmp/preview-bin:$PATH"
              manim -pql render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V5_CLOSED_CROQUIS_LATEX.py HouseExtrusion3D --format=mp4 --disable_caching
            '

      - name: Ensure FFmpeg verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: PQL technical and visual QA package
        run: |
          set -euo pipefail
          MP4=$(find media -type f -name '*.mp4' | grep 'HouseExtrusion3D' | grep -v 'partial_movie_files' | head -n 1)
          test -n "$MP4"
          test -s "$MP4"
          echo "PQL=$MP4"
          mkdir -p delivery/v5_pql/frames
          cp "$MP4" delivery/v5_pql/House_Extrusion_3D_STEP_BY_STEP_V5_PQL.mp4
          cp render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V5_CLOSED_CROQUIS_LATEX.py delivery/v5_pql/
          ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate -show_entries format=duration,size -of default=noprint_wrappers=1 "$MP4" > delivery/v5_pql/FFPROBE.txt
          ffmpeg -v error -i "$MP4" -f null -
          python - <<'PY'
          import subprocess, pathlib
          mp4=pathlib.Path('delivery/v5_pql/House_Extrusion_3D_STEP_BY_STEP_V5_PQL.mp4')
          dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(mp4)], text=True).strip())
          out=pathlib.Path('delivery/v5_pql/frames')
          for i in range(40):
              t=dur*i/39
              subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',str(mp4),'-frames:v','1','-vf','scale=640:-1',str(out/f'frame_{i:02d}_{t:07.2f}.jpg')],check=True)
          PY
          sha256sum "$MP4" render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V5_CLOSED_CROQUIS_LATEX.py > delivery/v5_pql/SHA256SUMS.txt

      - name: Upload PQL gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: House-Croquis-V5-PQL-Gate
          path: delivery/v5_pql
          retention-days: 7
