name: Diedric ISO NTC1777 V5 Final FrameQA PQH 20260909

on:
  push:
    branches:
      - manim/diedric-iso-ntc1777-v5-frameqa-20260909
    paths:
      - .github/workflows/diedric_iso_ntc1777_v5_final_frameqa_pqh_20260909.yml
      - render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5.py
      - render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5_final.py
      - Core/technical_drawing_tools.py

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout V5 branch
        uses: actions/checkout@v4
        with:
          ref: manim/diedric-iso-ntc1777-v5-frameqa-20260909
          fetch-depth: 0

      - name: Validate corrected V5 source
        shell: bash
        run: |
          set -euo pipefail
          BASE=render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5.py
          SRC=render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5_final.py
          LIB=Core/technical_drawing_tools.py
          python -m py_compile "$BASE" "$SRC" "$LIB"
          grep -q 'class DiedricISOProjectionV5SeniorFinal' "$SRC"
          grep -q 'Circumscribe(card\[3\]' "$SRC"
          grep -q 'base.PAUSE_OBSERVER = 4.00' "$SRC"
          grep -q 'def algorithm' "$SRC"
          grep -q 'def challenge' "$SRC"
          ! grep -Eq '[A-Za-z]:\\|/Users/|/home/[^/]+/' "$BASE" "$SRC" "$LIB"

      - name: Install render and QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip zip
          python -m pip install --quiet pillow numpy
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL QA render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5_final.py
          SCENE=DiedricISOProjectionV5SeniorFinal
          rm -rf media_pql qa_pql
          mkdir -p qa_pql
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.032 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pql $SRC $SCENE --fps 15 --format=mp4 --media_dir media_pql --disable_caching" \
            2>&1 | tee qa_pql/pql.log
          PQL="$(find media_pql -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$PQL" && test -s "$PQL"
          ffmpeg -nostdin -v error -i "$PQL" -f null - 2> qa_pql/pql_decode.log

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5_final.py
          SCENE=DiedricISOProjectionV5SeniorFinal
          OUT=deliverables/technical_drawing_diedric_iso_v5_20260909
          rm -rf media "$OUT"
          mkdir -p "$OUT"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pqh $SRC $SCENE --fps 30 --format=mp4 --media_dir media --disable_caching" \
            2>&1 | tee "$OUT/pqh.log"
          FINAL="$(find media -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_SENIOR_FRAMEQA_FINAL_pqh.mp4"

      - name: Dense technical and visual frame QA
        shell: bash
        run: |
          set -euo pipefail
          OUT=deliverables/technical_drawing_diedric_iso_v5_20260909
          F="$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_SENIOR_FRAMEQA_FINAL_pqh.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"
          echo "Rendered duration: $DUR s"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          awk -v d="$DUR" 'BEGIN { if (d < 300 || d > 650) exit 1; }'
          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/decode.log"

          mkdir -p "$OUT/qa_scan"
          ffmpeg -y -i "$F" -vf fps=1/2 "$OUT/qa_scan/frame_%04d.png" >/dev/null 2>&1

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math, subprocess

          root=Path('deliverables/technical_drawing_diedric_iso_v5_20260909')
          video=root/'TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_SENIOR_FRAMEQA_FINAL_pqh.mp4'
          duration=float(subprocess.check_output([
              'ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(video)
          ], text=True).strip())
          frames=sorted((root/'qa_scan').glob('frame_*.png'))
          expected=max(1, int(duration/2)-3)
          if len(frames) < expected:
              raise SystemExit(f'Temporal scan incomplete: expected >= {expected}, found {len(frames)}')

          rows=[]; blank=0; dark=0
          for i,p in enumerate(frames):
              im=Image.open(p).convert('RGB').resize((320,180))
              pix=list(im.getdata())
              nonbg=sum(1 for r,g,b in pix if abs(r-246)+abs(g-248)+abs(b-251)>38)/len(pix)
              mean=sum((r+g+b)/3 for r,g,b in pix)/len(pix)
              if nonbg < 0.012: blank += 1
              if mean < 75: dark += 1
              rows.append((i*2.0,p.name,nonbg,mean))
          (root/'FRAME_SCAN_QA.tsv').write_text(
              'time_s\tframe\tnonbackground_ratio\tmean_luma\n' +
              '\n'.join(f'{t:.1f}\t{n}\t{r:.6f}\t{m:.2f}' for t,n,r,m in rows) + '\n',
              encoding='utf-8')
          # Up to a handful of full-background frames are legitimate scene cuts;
          # larger runs indicate a choreography/render problem.
          if blank > 8:
              raise SystemExit(f'Too many nearly blank sampled frames: {blank}')

          per_sheet=30; cols=5; tw,th=320,180; cell_w,cell_h=332,206
          sheets=[]
          for bi in range(math.ceil(len(frames)/per_sheet)):
              batch=frames[bi*per_sheet:(bi+1)*per_sheet]
              rows_n=math.ceil(len(batch)/cols)
              sheet=Image.new('RGB',(cols*cell_w,rows_n*cell_h),'white')
              draw=ImageDraw.Draw(sheet)
              for j,p in enumerate(batch):
                  im=Image.open(p).convert('RGB'); im.thumbnail((tw,th))
                  x=(j%cols)*cell_w+6; y=(j//cols)*cell_h+5
                  sheet.paste(im,(x,y))
                  absolute=bi*per_sheet+j
                  draw.text((x,y+184),f't={absolute*2:04d}s',fill=(35,45,58))
              out=root/f'qa_contact_sheet_{bi+1:02d}.jpg'
              sheet.save(out,quality=91)
              sheets.append(out)

          (root/'FRAME_SCAN_SUMMARY.txt').write_text(
              f'duration_seconds={duration:.3f}\n'
              f'samples={len(frames)}\ninterval_seconds=2\n'
              f'nearly_blank_samples={blank}\ndark_transition_samples={dark}\n'
              f'contact_sheets={len(sheets)}\n', encoding='utf-8')
          print('Frame QA:', 'samples=',len(frames),'blank=',blank,'dark=',dark,'sheets=',len(sheets))
          PY

          rm -rf "$OUT/qa_scan"
          sha256sum "$F" > "$OUT/SHA256SUMS.txt"
          cp render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5.py "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_base_source.py"
          cp render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5_final.py "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_final_source.py"
          cp Core/technical_drawing_tools.py "$OUT/technical_drawing_tools.py"
          cat > "$OUT/RENDER_INFO.txt" <<'EOF'
          Diedric ISO E / ISO A V5 Senior Frame-QA Final.
          Built from the successful V5 structure after visual inspection of chronological rendered frames.
          Corrections include: larger isolated orthographic projections; clean Circumscribe highlight instead of recolouring the entire view card; longer observer holds; slower/smoother camera movement; deliberate symbol reveal; genuinely sequential six-step reading algorithm; staged guided challenge; maintained safe header/content/footer separation.
          QA: compile + PQL + full PQH; 1920x1080; 30 fps; H.264 yuv420p; full ffmpeg decode; chronological frame sample every 2 s; blank-frame guard; persisted contact sheets and SHA-256.
          EOF
          (cd "$OUT" && zip -9 -r TechnicalDrawing_Diedric_V5_SENIOR_FRAMEQA_FULL_TOTAL_PACKAGE.zip \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_SENIOR_FRAMEQA_FINAL_pqh.mp4 \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_base_source.py \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_final_source.py technical_drawing_tools.py \
            VIDEO_TECHNICAL.tsv FRAME_SCAN_QA.tsv FRAME_SCAN_SUMMARY.txt SHA256SUMS.txt RENDER_INFO.txt decode.log pqh.log \
            qa_contact_sheet_*.jpg)
          test -s "$OUT/TechnicalDrawing_Diedric_V5_SENIOR_FRAMEQA_FULL_TOTAL_PACKAGE.zip"

      - name: Persist corrected V5 delivery to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/technical_drawing_diedric_iso_v5_20260909
          if ! git diff --cached --quiet; then
            git commit -m "render: persist corrected diedric V5 FrameQA final [skip ci]"
            git push origin HEAD:manim/diedric-iso-ntc1777-v5-frameqa-20260909
          fi

      - name: Upload corrected V5 delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIEDRIC-ISO-V5-SENIOR-FRAMEQA-FINAL
          path: deliverables/technical_drawing_diedric_iso_v5_20260909/
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DIEDRIC-ISO-V5-FINAL-DIAGNOSTICS
          path: |
            qa_pql/
            deliverables/technical_drawing_diedric_iso_v5_20260909/
          if-no-files-found: ignore
          retention-days: 3
