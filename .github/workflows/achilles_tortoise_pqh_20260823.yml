name: Achilles Tortoise V6 FINAL PQH 20260823

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/achilles-tortoise-pqh-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and validate V6 sources
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/achilles_tortoise_20260823
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          job = Path('render_jobs/achilles_tortoise_20260823')
          for src, dst in (
              ('a.gz.b64', 'achilles_tortoise.py'),
              ('s.gz.b64', 'jp_classroom_style.py'),
          ):
              encoded = (job / src).read_text(encoding='utf-8').strip()
              encoded += '=' * (-len(encoded) % 4)
              payload = base64.b64decode(encoded, validate=False)
              (job / dst).write_bytes(gzip.decompress(payload))
          PY
          (cd "$JOB" && printf '%s  %s\n' \
            '2ac74fb113af1b92d053b96c0ec0171e1142691c7432f0123ade84b717f1aa8b' 'achilles_tortoise.py' \
            '6ae7884ca21aa88ad6c82bf39cee08057c6d7be2fc03de10b25ee7c842b35703' 'jp_classroom_style.py' | sha256sum -c -)
          python -m py_compile "$JOB/achilles_tortoise.py" "$JOB/jp_classroom_style.py"
          grep -q "class AchillesTortoise" "$JOB/achilles_tortoise.py"
          grep -q "solve_meeting_step_by_step" "$JOB/achilles_tortoise.py"
          grep -q "paradox_zoom" "$JOB/achilles_tortoise.py"
          grep -q "config.pixel_width = 1920" "$JOB/jp_classroom_style.py"
          grep -q "config.pixel_height = 1080" "$JOB/jp_classroom_style.py"
          grep -q "config.frame_rate = 30" "$JOB/jp_classroom_style.py"

      - name: Install verification tools and ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL runtime QA V6
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/achilles_tortoise_20260823
          rm -rf media_pql qa_out && mkdir -p qa_out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" -w "/manim/$JOB" --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql achilles_tortoise.py AchillesTortoise --fps 15 --format=mp4 --media_dir /manim/media_pql --disable_caching
            ' 2>&1 | tee qa_out/render_pql.log
          PREVIEW="$(find media_pql -type f -name 'AchillesTortoise.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          cp "$PREVIEW" qa_out/AchillesTortoise_V6_QA_pql.mp4

      - name: Literal PQH final render V6
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/achilles_tortoise_20260823
          rm -rf media out && mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB" --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh achilles_tortoise.py AchillesTortoise --fps 30 --format=mp4 --media_dir /manim/media --disable_caching
            ' 2>&1 | tee out/render_pqh.log
          FINAL="$(find media -type f -name 'AchillesTortoise.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Achilles_and_Tortoise_Zeno_V6_FINAL_pqh.mp4

      - name: Strictly verify V6 MP4
        shell: bash
        run: |
          set -euo pipefail
          F=out/Achilles_and_Tortoise_Zeno_V6_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          python - <<'PY'
          dur=float(open('out/VIDEO_TECHNICAL.tsv').read().splitlines()[1].split('\t')[-1])
          assert 120 <= dur <= 420, f'Unexpected V6 duration: {dur}'
          print('duration_gate_pass', dur)
          PY
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          sha256sum "$F" > out/SHA256SUMS.txt

      - name: Export dense V6 audit frames
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/achilles_tortoise_20260823
          F=out/Achilles_and_Tortoise_Zeno_V6_FINAL_pqh.mp4
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          mkdir -p out/audit_frames
          for P in 0.03 0.08 0.14 0.20 0.28 0.36 0.44 0.52 0.60 0.68 0.76 0.84 0.92 0.98; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_${TAG}.png"
          done
          cp "$JOB/achilles_tortoise.py" out/achilles_tortoise_v6.py

      - uses: actions/upload-artifact@v4
        with:
          name: Achilles-Tortoise-Zeno-V6-FINAL-PQH
          path: |
            out/Achilles_and_Tortoise_Zeno_V6_FINAL_pqh.mp4
            out/achilles_tortoise_v6.py
            out/VIDEO_TECHNICAL.tsv
            out/SHA256SUMS.txt
            out/render_pqh.log
            out/full_decode.log
            out/audit_frames/
            qa_out/render_pql.log
          if-no-files-found: error
          retention-days: 7
