name: Achilles Tortoise SENIOR V8 FLUID PQH 20260823

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/achilles-tortoise-pqh-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Validate V8 source and reconstruct classroom style
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/achilles_tortoise_20260823
          SRC="$JOB/achilles_tortoise_senior_v8.py"
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          job = Path('render_jobs/achilles_tortoise_20260823')
          for payload_name, output_name in [
              ('v8.gz.b64', 'achilles_tortoise_senior_v8.py'),
              ('s.gz.b64', 'jp_classroom_style.py'),
          ]:
              encoded = (job / payload_name).read_text(encoding='utf-8').strip()
              encoded += '=' * (-len(encoded) % 4)
              (job / output_name).write_bytes(
                  gzip.decompress(base64.b64decode(encoded, validate=False))
              )
          PY
          (cd "$JOB" && printf '%s  %s\n' \
            'fb15625ac873947d41263b35e34e41d2665546c915f395947e77ad717017f4e6' 'achilles_tortoise_senior_v8.py' \
            '6ae7884ca21aa88ad6c82bf39cee08057c6d7be2fc03de10b25ee7c842b35703' 'jp_classroom_style.py' | sha256sum -c -)
          python -m py_compile "$SRC" "$JOB/jp_classroom_style.py"
          grep -q "class AchillesTortoiseSeniorV8" "$SRC"
          grep -q "def recursive_zoom" "$SRC"
          grep -q "def convergence_timeline" "$SRC"
          grep -q "config.pixel_width = 1920" "$JOB/jp_classroom_style.py"
          grep -q "config.pixel_height = 1080" "$JOB/jp_classroom_style.py"
          grep -q "config.frame_rate = 30" "$JOB/jp_classroom_style.py"

      - name: Install verification tools and ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL runtime QA V8
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/achilles_tortoise_20260823
          rm -rf media_pql qa_out && mkdir -p qa_out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.12 \
            -v "$PWD:/manim" -w "/manim/$JOB" --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql achilles_tortoise_senior_v8.py AchillesTortoiseSeniorV8 --fps 15 --format=mp4 --media_dir /manim/media_pql --disable_caching
            ' 2>&1 | tee qa_out/render_pql.log
          PREVIEW="$(find media_pql -type f -name 'AchillesTortoiseSeniorV8.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          cp "$PREVIEW" qa_out/AchillesTortoiseSeniorV8_QA_pql.mp4

      - name: Literal PQH final render V8
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/achilles_tortoise_20260823
          rm -rf media out && mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB" --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh achilles_tortoise_senior_v8.py AchillesTortoiseSeniorV8 --fps 30 --format=mp4 --media_dir /manim/media --disable_caching
            ' 2>&1 | tee out/render_pqh.log
          FINAL="$(find media -type f -name 'AchillesTortoiseSeniorV8.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Achilles_and_Tortoise_Zeno_SENIOR_V8_FLUID_FINAL_pqh.mp4

      - name: Strictly verify V8 MP4
        shell: bash
        run: |
          set -euo pipefail
          F=out/Achilles_and_Tortoise_Zeno_SENIOR_V8_FLUID_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          python - <<'PY'
          dur=float(open('out/VIDEO_TECHNICAL.tsv').read().splitlines()[1].split('\t')[-1])
          assert 70 <= dur <= 240, f'Unexpected V8 duration: {dur}'
          print('duration_gate_pass', dur)
          PY
          set +e
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          DEC=$?
          set -e
          test "$DEC" -eq 0
          test ! -s out/full_decode.log
          sha256sum "$F" > out/SHA256SUMS.txt
          cat out/VIDEO_TECHNICAL.tsv
          cat out/SHA256SUMS.txt
          echo "STRICT_VIDEO_QA_PASS"

      - name: Export dense audit frames V8
        shell: bash
        run: |
          set -euo pipefail
          F=out/Achilles_and_Tortoise_Zeno_SENIOR_V8_FLUID_FINAL_pqh.mp4
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          mkdir -p out/audit_frames
          for P in 0.03 0.08 0.13 0.18 0.23 0.28 0.33 0.38 0.43 0.48 0.53 0.58 0.63 0.68 0.73 0.78 0.83 0.88 0.93 0.98; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_${TAG}.png"
          done
          cp render_jobs/achilles_tortoise_20260823/achilles_tortoise_senior_v8.py out/

      - uses: actions/upload-artifact@v4
        with:
          name: Achilles-Tortoise-Zeno-SENIOR-V8-FLUID-FINAL-PQH
          path: |
            out/Achilles_and_Tortoise_Zeno_SENIOR_V8_FLUID_FINAL_pqh.mp4
            out/achilles_tortoise_senior_v8.py
            out/VIDEO_TECHNICAL.tsv
            out/SHA256SUMS.txt
            out/render_pqh.log
            out/full_decode.log
            out/audit_frames/
            qa_out/render_pql.log
          if-no-files-found: error
          retention-days: 7
