name: Render HTML Colab Visual Library V2

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "html_colab_visual_library/**"
      - ".github/workflows/render_html_colab_library.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and validate source
        shell: bash
        run: |
          set -euo pipefail
          python html_colab_visual_library/build_source.py
          python -m py_compile html_colab_visual_library/html_colab_visual_library.py

      - name: Pull pinned ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Native ManimCE PQL and PQH renders
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin /tmp/manim-home
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"

              SOURCE="html_colab_visual_library/html_colab_visual_library.py"
              SCENES=(
                HTML01WhatIsHTML
                HTML02HeadAndBody
                HTML03SemanticText
                HTML04LinksListsImages
                HTML05LayoutAndForms
              )

              for scene in "${SCENES[@]}"; do
                manim -pql "$SOURCE" "$scene" --format=mp4 --disable_caching
              done

              for scene in "${SCENES[@]}"; do
                manim -pqh "$SOURCE" "$scene" --format=mp4 --disable_caching
              done
            ' 2>&1 | tee html_colab_render.log

      - name: Verify and stage delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          scenes=(
            HTML01WhatIsHTML
            HTML02HeadAndBody
            HTML03SemanticText
            HTML04LinksListsImages
            HTML05LayoutAndForms
          )

          index=1
          for scene in "${scenes[@]}"; do
            video="$(find media -type f -path '*1080p*' -name "${scene}.mp4" -print -quit)"
            test -n "$video"
            test -s "$video"
            output="delivery/$(printf '%02d' "$index")_${scene}_pqh.mp4"
            cp "$video" "$output"
            ffprobe -v error \
              -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 \
              "$output" | tee "delivery/$(printf '%02d' "$index")_${scene}_ffprobe.txt"
            ffmpeg -v error -i "$output" -f null -
            index=$((index + 1))
          done

          cp html_colab_visual_library/html_colab_visual_library.py delivery/
          cp html_colab_visual_library/README.md delivery/
          cp html_colab_render.log delivery/
          sha256sum delivery/* > delivery/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Colab-Visual-Library-V2-pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7
