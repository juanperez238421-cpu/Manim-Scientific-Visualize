name: Valentina FINAL TOTAL V3 PQH

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/valentina-final-total-v3-20260814'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include:
          - { q: Q01, file: Q01_Dominio_Vectorial_FINAL.py, scene: Q01Final }
          - { q: Q02, file: Q02_Limites_Vectoriales_FINAL.py, scene: Q02Final }
          - { q: Q03, file: Q03_Recta_Tangente_FINAL.py, scene: Q03Final }
          - { q: Q04, file: Q04_Cinematica_Vectorial_FINAL.py, scene: Q04Final }
          - { q: Q05, file: Q05_Cruce_Plano_XY_FINAL.py, scene: Q05Final }
          - { q: Q06, file: Q06_Cruce_Plano_XZ_FINAL.py, scene: Q06Final }
          - { q: Q07, file: Q07_Integrales_Vectoriales_FINAL.py, scene: Q07Final }
          - { q: Q08, file: Q08_Superficies_Cuadricas_FINAL.py, scene: Q08Final }
          - { q: Q09, file: Q09_Hiperboloide_Trazas_FINAL.py, scene: Q09Final }
          - { q: Q10, file: Q10_Paraboloide_Eliptico_FINAL.py, scene: Q10Final }
          - { q: Q11, file: Q11_Hiperboloide_Cortes_FINAL.py, scene: Q11Final }
          - { q: Q12, file: Q12_Relacion_Dominios_FINAL.py, scene: Q12Final }
          - { q: Q13, file: Q13_Graficar_Dominios_FINAL.py, scene: Q13Final }
          - { q: Q14, file: Q14_Limites_Dos_Variables_FINAL.py, scene: Q14Final }
          - { q: Q15, file: Q15_Primeras_Parciales_FINAL.py, scene: Q15Final }
          - { q: Q16, file: Q16_Sensibilidad_Cilindro_FINAL.py, scene: Q16Final }
          - { q: Q17, file: Q17_Produccion_Marginal_FINAL.py, scene: Q17Final }
          - { q: Q18, file: Q18_Segundas_Parciales_FINAL.py, scene: Q18Final }

    steps:
      - uses: actions/checkout@v4

      - name: Recover exact V3 source package
        shell: bash
        run: |
          set -euo pipefail
          cat render_jobs/valentina_final_v3/source_*.b64 | base64 -d > /tmp/valentina_v3.tar.xz
          echo 'fc2e2bc2ef7fb6716c8d18404fef62a2c57382012aec5b0d39d3c695282283d3  /tmp/valentina_v3.tar.xz' | sha256sum -c -
          mkdir -p work
          tar -xJf /tmp/valentina_v3.tar.xz -C work
          cd work/codes
          python -m py_compile *.py
          grep -Eq '^class ${{ matrix.scene }}\\b' '${{ matrix.file }}'

      - name: Install FFmpeg verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Pull ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1

      - name: PQL validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/codes/media
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD/work:/manim" -w /manim/codes \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql '${{ matrix.file }}' '${{ matrix.scene }}' --format=mp4 --disable_caching
            "
          TEST="$(find work/codes/media -type f -name '${{ matrix.scene }}.mp4' | head -1)"
          test -n "$TEST" && test -s "$TEST"

      - name: Render literal PQH 1920x1080 30fps
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/codes/media delivery
          mkdir -p delivery/videos delivery/logs delivery/technical delivery/qa
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD/work:/manim" -w /manim/codes \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh '${{ matrix.file }}' '${{ matrix.scene }}' --format=mp4 --disable_caching
            " 2>&1 | tee "delivery/logs/${{ matrix.q }}_pqh.log"
          FINAL="$(find work/codes/media -type f -name '${{ matrix.scene }}.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" "delivery/videos/Valentina_FINAL_TOTAL_V3_${{ matrix.q }}_pqh.mp4"

      - name: Verify stream full decode and QA frames
        shell: bash
        run: |
          set -euo pipefail
          F="delivery/videos/Valentina_FINAL_TOTAL_V3_${{ matrix.q }}_pqh.mp4"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")" = 1920
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")" = 1080
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")" = 30/1
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")" = h264
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null -
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -of json "$F" > "delivery/technical/${{ matrix.q }}.json"
          D="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          for P in 25 50 75; do
            T="$(awk -v d="$D" -v p="$P" 'BEGIN { printf "%.3f", d*p/100 }')"
            ffmpeg -nostdin -y -v error -ss "$T" -i "$F" -frames:v 1 "delivery/qa/${{ matrix.q }}_${P}.png"
          done
          mkdir -p delivery/code
          cp "work/codes/${{ matrix.file }}" delivery/code/

      - name: Upload verified question unit
        uses: actions/upload-artifact@v4
        with:
          name: valentina-final-v3-${{ matrix.q }}
          path: delivery/
          retention-days: 7
          if-no-files-found: error

  assemble:
    if: github.event.pull_request.head.ref == 'agent/valentina-final-total-v3-20260814'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Recover exact source package
        shell: bash
        run: |
          set -euo pipefail
          cat render_jobs/valentina_final_v3/source_*.b64 | base64 -d > /tmp/valentina_v3.tar.xz
          echo 'fc2e2bc2ef7fb6716c8d18404fef62a2c57382012aec5b0d39d3c695282283d3  /tmp/valentina_v3.tar.xz' | sha256sum -c -
          mkdir -p work
          tar -xJf /tmp/valentina_v3.tar.xz -C work

      - name: Install packaging and verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip

      - name: Download all 18 verified units
        uses: actions/download-artifact@v4
        with:
          pattern: valentina-final-v3-*
          path: all
          merge-multiple: true

      - name: Build auditable final package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="package/Valentina_Taller_Calculo_Varias_Variables_FINAL_TOTAL_V3"
          mkdir -p "$ROOT"/{codes,videos,qa,logs,technical}
          cp work/codes/*.py "$ROOT/codes/"
          cp work/README.md "$ROOT/README.md"
          cp work/VIDEO_INDEX.txt "$ROOT/VIDEO_INDEX.txt"
          cp all/videos/*.mp4 "$ROOT/videos/"
          cp all/qa/*.png "$ROOT/qa/"
          cp all/logs/*.log "$ROOT/logs/"
          cp all/technical/*.json "$ROOT/technical/"
          COUNT="$(find "$ROOT/videos" -type f -name '*.mp4' | wc -l | tr -d ' ')"
          test "$COUNT" = 18

          cat > "$ROOT/PROTOCOL_COMPLIANCE.md" <<'EOF'
          # ManimCE PQH protocol compliance
          - Runtime: manimcommunity/manim:v0.20.1
          - Each question is an independent Python scene file.
          - Python `py_compile` validation was executed before rendering.
          - Every scene passed a `-pql` validation render.
          - Every final scene was rendered with literal ManimCE `-pqh`.
          - Expected video mode: 1920x1080, 30 fps, H.264, yuv420p.
          - Every MP4 passed FFmpeg full-stream decode with no reported errors.
          - QA stills were exported at 25%, 50%, and 75% duration for every question.
          - Exact final source, render commands, technical metadata, logs, and checksums are retained in this package.
          EOF

          cat > "$ROOT/RENDER_COMMANDS.txt" <<'EOF'
          manim -pqh Q01_Dominio_Vectorial_FINAL.py Q01Final --format=mp4 --disable_caching
          manim -pqh Q02_Limites_Vectoriales_FINAL.py Q02Final --format=mp4 --disable_caching
          manim -pqh Q03_Recta_Tangente_FINAL.py Q03Final --format=mp4 --disable_caching
          manim -pqh Q04_Cinematica_Vectorial_FINAL.py Q04Final --format=mp4 --disable_caching
          manim -pqh Q05_Cruce_Plano_XY_FINAL.py Q05Final --format=mp4 --disable_caching
          manim -pqh Q06_Cruce_Plano_XZ_FINAL.py Q06Final --format=mp4 --disable_caching
          manim -pqh Q07_Integrales_Vectoriales_FINAL.py Q07Final --format=mp4 --disable_caching
          manim -pqh Q08_Superficies_Cuadricas_FINAL.py Q08Final --format=mp4 --disable_caching
          manim -pqh Q09_Hiperboloide_Trazas_FINAL.py Q09Final --format=mp4 --disable_caching
          manim -pqh Q10_Paraboloide_Eliptico_FINAL.py Q10Final --format=mp4 --disable_caching
          manim -pqh Q11_Hiperboloide_Cortes_FINAL.py Q11Final --format=mp4 --disable_caching
          manim -pqh Q12_Relacion_Dominios_FINAL.py Q12Final --format=mp4 --disable_caching
          manim -pqh Q13_Graficar_Dominios_FINAL.py Q13Final --format=mp4 --disable_caching
          manim -pqh Q14_Limites_Dos_Variables_FINAL.py Q14Final --format=mp4 --disable_caching
          manim -pqh Q15_Primeras_Parciales_FINAL.py Q15Final --format=mp4 --disable_caching
          manim -pqh Q16_Sensibilidad_Cilindro_FINAL.py Q16Final --format=mp4 --disable_caching
          manim -pqh Q17_Produccion_Marginal_FINAL.py Q17Final --format=mp4 --disable_caching
          manim -pqh Q18_Segundas_Parciales_FINAL.py Q18Final --format=mp4 --disable_caching
          EOF

          printf '%s\n' 'Source package SHA256: fc2e2bc2ef7fb6716c8d18404fef62a2c57382012aec5b0d39d3c695282283d3' > "$ROOT/SOURCE_BUNDLE_SHA256.txt"
          printf 'video\tduration_s\tsize_bytes\tcodec\twidth\theight\tfps\tpix_fmt\n' > "$ROOT/VIDEO_TECHNICAL_ALL.tsv"
          for F in $(find "$ROOT/videos" -type f -name '*.mp4' | sort); do
            B="$(basename "$F")"
            D="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
            S="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
            C="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
            W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
            H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
            R="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
            P="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$B" "$D" "$S" "$C" "$W" "$H" "$R" "$P" >> "$ROOT/VIDEO_TECHNICAL_ALL.tsv"
          done
          (cd "$ROOT" && find codes videos -type f -print0 | sort -z | xargs -0 sha256sum) > "$ROOT/SHA256SUMS.txt"
          cd package
          zip -qr ../Valentina_Taller_Calculo_Varias_Variables_FINAL_TOTAL_V3_PQH.zip Valentina_Taller_Calculo_Varias_Variables_FINAL_TOTAL_V3

      - name: Upload final total ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Valentina_FINAL_TOTAL_V3_PQH_ZIP
          path: Valentina_Taller_Calculo_Varias_Variables_FINAL_TOTAL_V3_PQH.zip
          retention-days: 7
          if-no-files-found: error
