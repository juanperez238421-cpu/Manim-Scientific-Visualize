name: Bootstrap Geometry 8 Week 3 Split Senior Push Render

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Recover render payload from temporary branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=render/geometry8-week3-split-senior-v1-20260810
          JOB=render_jobs/geometry8_week3_split_senior_v1_20260810
          git fetch --depth=1 origin "$BRANCH"
          git checkout FETCH_HEAD -- "$JOB"
          rm -rf /tmp/week3_split && mkdir -p /tmp/week3_split
          cat "$JOB"/payload_00.b64 "$JOB"/payload_01.b64 "$JOB"/payload_02.b64 "$JOB"/payload_03.b64 > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.xz
          tar -xJf /tmp/payload.tar.xz -C /tmp/week3_split
          cd /tmp/week3_split
          python -m py_compile Geometry8_Week3_Class1_CircleTheory_Senior_V1.py Geometry8_Week3_Class2_ShadedAreas_Senior_V1.py jp_classroom_style.py
          python check_manim_style.py Geometry8_Week3_Class1_CircleTheory_Senior_V1.py
          python check_manim_style.py Geometry8_Week3_Class2_ShadedAreas_Senior_V1.py

      - name: Install FFmpeg and pull ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1

      - name: Render both lessons PQL and literal PQH
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=manimcommunity/manim:v0.20.1
          rm -rf delivery_geometry8_week3_split_v1 qa_geometry8_week3_split_v1 media
          mkdir -p delivery_geometry8_week3_split_v1/circle_theory delivery_geometry8_week3_split_v1/shaded_areas
          mkdir -p qa_geometry8_week3_split_v1/circle_theory qa_geometry8_week3_split_v1/shaded_areas
          cp /tmp/week3_split/* .

          render_one() {
            FILE="$1"; SCENE="$2"; SLUG="$3"; OUTDIR="$4"; QADIR="$5"
            rm -rf media
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.12 -v "$PWD:/manim" -w /manim --entrypoint bash "$IMAGE" -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql "'"$FILE"'" "'"$SCENE"'" --format=mp4 --disable_caching
            ' 2>&1 | tee "$OUTDIR/render_pql.log"
            PREVIEW="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            test -s "$PREVIEW"
            cp "$PREVIEW" "$OUTDIR/${SLUG}_pql.mp4"

            rm -rf media
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 -v "$PWD:/manim" -w /manim --entrypoint bash "$IMAGE" -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh "'"$FILE"'" "'"$SCENE"'" --format=mp4 --disable_caching
            ' 2>&1 | tee "$OUTDIR/render_pqh.log"
            FINAL="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            test -s "$FINAL"
            OUT="$OUTDIR/${SLUG}_pqh.mp4"
            cp "$FINAL" "$OUT"
            cp "$FILE" "$OUTDIR/"
            ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 "$OUT" > "$OUTDIR/ffprobe.txt"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$OUT")" = 1920
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT")" = 1080
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$OUT")" = 30/1
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$OUT")" = h264
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$OUT")" = yuv420p
            ffmpeg -nostdin -v error -i "$OUT" -f null - 2> "$OUTDIR/full_decode.log"
            DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT")"
            FPS="$(python -c "d=float('$DUR'); print(max(0.001,36.0/max(d,0.001)))")"
            ffmpeg -nostdin -y -v error -i "$OUT" -vf "fps=$FPS,scale=480:-1,tile=6x6:padding=8:margin=8" -frames:v 1 "$QADIR/contact_sheet.jpg"
            python - <<PY
import subprocess
D=float('$DUR')
for i,p in enumerate([0.14,0.28,0.42,0.56,0.70,0.84,0.94],1):
    t=D*p
    subprocess.run(['ffmpeg','-nostdin','-y','-v','error','-ss',f'{t:.3f}','-i','$OUT','-frames:v','1',f'$QADIR/critical_{i:02d}.png'],check=True)
PY
            sha256sum "$OUT" > "$OUTDIR/SHA256SUMS.txt"
          }

          render_one Geometry8_Week3_Class1_CircleTheory_Senior_V1.py Geometry8Week3CircleTheorySeniorV1 Geometry8_Week3_Class1_CircleTheory_Senior_V1 delivery_geometry8_week3_split_v1/circle_theory qa_geometry8_week3_split_v1/circle_theory
          render_one Geometry8_Week3_Class2_ShadedAreas_Senior_V1.py Geometry8Week3ShadedAreasSeniorV1 Geometry8_Week3_Class2_ShadedAreas_Senior_V1 delivery_geometry8_week3_split_v1/shaded_areas qa_geometry8_week3_split_v1/shaded_areas
          cp jp_classroom_style.py check_manim_style.py delivery_geometry8_week3_split_v1/

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: Geometry8_Period3_Week3_Split_Senior_V1_PQH
          path: |
            delivery_geometry8_week3_split_v1/
            qa_geometry8_week3_split_v1/
          retention-days: 7
