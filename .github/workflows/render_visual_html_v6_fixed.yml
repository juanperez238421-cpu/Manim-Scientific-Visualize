name: Render Visual HTML Basics V6 Fixed

on:
  pull_request:
    branches:
      - main
    paths:
      - "render_jobs/visual_html_v6_fixed/**"
      - ".github/workflows/render_visual_html_v6_fixed.yml"

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render/visual-html-v6-fixed-pqh-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: python -m py_compile render_jobs/visual_html_v6_fixed/visual_html_basics_v6.py
      - name: Pull pinned ManimCE
        run: docker pull manimcommunity/manim:v0.20.1
      - name: Native PQL test and literal PQH render
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c '
            set -euo pipefail
            mkdir -p /tmp/vscode-bin /tmp/manim-home
            printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/vscode-bin/xdg-open
            chmod +x /tmp/vscode-bin/xdg-open
            export PATH="/tmp/vscode-bin:$PATH"
            SOURCE="render_jobs/visual_html_v6_fixed/visual_html_basics_v6.py"
            manim -pql "$SOURCE" VisualHTMLBasicsV6 --format=mp4 --disable_caching
            manim -pqh "$SOURCE" VisualHTMLBasicsV6 --format=mp4 --disable_caching
          ' 2>&1 | tee render_visual_html_v6_fixed.log
      - name: Verify and stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          input="$(find media -type f -name 'VisualHTMLBasicsV6.mp4' ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$input" && test -s "$input"
          output="delivery/Visual_HTML_Basics_V6_Senior_Revised_pqh.mp4"
          cp "$input" "$output"
          docker run --rm -e OUTPUT="$output" -v "$PWD:/manim" -w /manim --entrypoint python manimcommunity/manim:v0.20.1 -c 'import av,os; p=os.environ["OUTPUT"]; c=av.open(p); s=[x for x in c.streams if x.type=="video"][0]; codec=s.codec_context.name; w=s.codec_context.width; h=s.codec_context.height; fps=float(s.average_rate); pix=s.codec_context.format.name if s.codec_context.format else "unknown"; duration=float(c.duration/av.time_base); frames=sum(1 for _ in c.decode(video=0)); assert codec=="h264"; assert (w,h)==(1920,1080); assert abs(fps-30)<=0.05; assert duration>=420; assert frames>0; print(f"codec_name={codec}\nwidth={w}\nheight={h}\nfps={fps}\npix_fmt={pix}\nduration={duration}\ndecoded_frames={frames}\nfull_decode=success")' | tee delivery/VIDEO_VERIFICATION.txt
          cp -R render_jobs/visual_html_v6_fixed delivery/source
          cp render_visual_html_v6_fixed.log delivery/
          sha256sum delivery/* 2>/dev/null > delivery/SHA256SUMS_NATIVE.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: Visual-HTML-Basics-V6-Fixed-PQH
          path: delivery/
          if-no-files-found: error
          retention-days: 7
