name: Geometry 8 Composite + Simple Shaded Areas V3 SENIOR FINAL PQH

on:
  push:
    branches:
      - render/geometry8-composite-simple-shaded-v3-senior-20260902
    paths:
      - 'render_jobs/geometry8_composite_simple_shaded_20260901/**'
      - '.github/workflows/geometry8_composite_simple_shaded_v3_senior_pqh_20260902.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  render-composite-simple-shaded-v3-senior:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Static mathematics and V3 collision-fix gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=render_jobs/geometry8_2d_areas_masterclass_20260831
          JOB=render_jobs/geometry8_composite_simple_shaded_20260901
          SCENE="$JOB/Geometry8_Composite_Simple_Shaded_Areas_V3_SENIOR.py"
          mkdir -p out qa_out media pql_media /tmp/manim-bin /tmp/manim-home
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          python -m py_compile "$BASE"/*.py "$JOB"/*.py
          grep -q 'FadeOut(VGroup(relation, rule, radius_note))' "$SCENE"
          grep -q 'FadeOut(VGroup(radius_step, structure, internal_note))' "$SCENE"
          grep -q 'window.get_left()' "$SCENE"
          grep -q 'roof.get_center()+RIGHT' "$SCENE"
          python - <<'PY'
          import math
          assert 9*7-4*3 == 51
          assert 5*7+4*4 == 51
          assert abs(12*10-math.pi*3**2-91.7256661177) < 1e-8
          assert abs(8**2-math.pi*8**2/4-13.7345175426) < 1e-8
          assert abs(10*6+0.5*math.pi*5**2-99.2699081699) < 1e-8
          assert abs(8*5+0.5*8*3-math.pi-48.8584073464) < 1e-8
          print('V3 static + math + collision-fix gate: PASS')
          PY

      - name: PQL complete timeline gate
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=0.05
          export PYTHONPATH="$GITHUB_WORKSPACE/render_jobs/geometry8_2d_areas_masterclass_20260831:${PYTHONPATH:-}"
          cd render_jobs/geometry8_composite_simple_shaded_20260901
          manim -pql Geometry8_Composite_Simple_Shaded_Areas_V3_SENIOR.py \
            Geometry8CompositeSimpleShadedAreasV3Senior \
            --fps 15 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/pql_media" \
            2>&1 | tee "$GITHUB_WORKSPACE/qa_out/PQL.log"
          cd "$GITHUB_WORKSPACE"
          PQL="$(find pql_media -type f -name 'Geometry8CompositeSimpleShadedAreasV3Senior.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" qa_out/Geometry8_Composite_Simple_Shaded_Areas_V3_SENIOR_pql.mp4

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=1.0
          export PYTHONPATH="$GITHUB_WORKSPACE/render_jobs/geometry8_2d_areas_masterclass_20260831:${PYTHONPATH:-}"
          cd render_jobs/geometry8_composite_simple_shaded_20260901
          manim -pqh Geometry8_Composite_Simple_Shaded_Areas_V3_SENIOR.py \
            Geometry8CompositeSimpleShadedAreasV3Senior \
            --fps 30 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/media" \
            2>&1 | tee "$GITHUB_WORKSPACE/out/PQH.log"
          cd "$GITHUB_WORKSPACE"
          VIDEO="$(find media -type f -name 'Geometry8CompositeSimpleShadedAreasV3Senior.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"
          cp "$VIDEO" out/Geometry8_Composite_Simple_Shaded_Areas_V3_SENIOR_FINAL_pqh.mp4
          cp render_jobs/geometry8_composite_simple_shaded_20260901/Geometry8_Composite_Simple_Shaded_Areas_V3_SENIOR.py out/

      - name: Technical full-decode QA
        id: tech
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Geometry8_Composite_Simple_Shaded_Areas_V3_SENIOR_FINAL_pqh.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/VIDEO_TECHNICAL_QA.txt
          import av, os, sys
          p=sys.argv[1]; frames=0; last_pts=None
          with av.open(p) as c:
              s=c.streams.video[0]
              codec=s.codec_context.name; width=s.codec_context.width; height=s.codec_context.height
              fmt=s.codec_context.format.name if s.codec_context.format else ''
              fps=float(s.average_rate) if s.average_rate else 0.0
              duration=float(c.duration)/float(av.time_base) if c.duration else 0.0
              for frame in c.decode(s): frames += 1; last_pts=frame.pts
          size=os.path.getsize(p)
          for k,v in [('codec_name',codec),('width',width),('height',height),('pix_fmt',fmt),('average_fps',f'{fps:.6f}'),('duration',f'{duration:.6f}'),('frames_decoded',frames),('last_pts',last_pts),('size',size)]: print(f'{k}={v}')
          assert codec=='h264' and (width,height)==(1920,1080) and fmt=='yuv420p'
          assert 29.8 <= fps <= 30.2 and duration > 75 and frames > 2200 and size > 1_000_000
          PY
          SHA="$(sha256sum "$VIDEO" | awk '{print $1}')"
          SIZE="$(stat -c%s "$VIDEO")"
          echo "$SHA  $VIDEO" | tee qa_out/SHA256SUMS.txt
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: 108-frame final visual audit contact sheet
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Geometry8_Composite_Simple_Shaded_Areas_V3_SENIOR_FINAL_pqh.mp4
          mkdir -p qa_out/audit_frames
          python - "$VIDEO" <<'PY' | tee qa_out/VISUAL_AUDIT.txt
          import av, math, os, sys
          from PIL import Image, ImageDraw
          p=sys.argv[1]; count=108; saved=[]
          with av.open(p) as c:
              s=c.streams.video[0]; duration=float(c.duration)/float(av.time_base)
              targets=[duration*i/(count+1) for i in range(1,count+1)]; ti=0
              for frame in c.decode(s):
                  if ti >= len(targets): break
                  t=float(frame.pts*frame.time_base) if frame.pts is not None else 0.0
                  if t >= targets[ti]:
                      im=Image.fromarray(frame.to_ndarray(format='rgb24'))
                      fp=f'qa_out/audit_frames/frame_{ti+1:03d}_{targets[ti]:07.2f}.jpg'
                      im.save(fp,quality=93); saved.append(fp); ti += 1
          assert len(saved) >= 104
          cards=[]
          for fp in saved:
              im=Image.open(fp).convert('RGB'); im.thumbnail((480,270))
              card=Image.new('RGB',(500,300),'white'); card.paste(im,((500-im.width)//2,8))
              ImageDraw.Draw(card).text((10,280),os.path.basename(fp),fill='black'); cards.append(card)
          cols=4; rows=math.ceil(len(cards)/cols); sheet=Image.new('RGB',(cols*500,rows*300),'white')
          for i,im in enumerate(cards): sheet.paste(im,((i%cols)*500,(i//cols)*300))
          sheet.save('qa_out/Geometry8_Composite_Simple_Shaded_Areas_V3_SENIOR_FINAL_contact_sheet.jpg',quality=93)
          print('audit_frames=',len(saved)); print('contact_sheet=PASS')
          PY

      - name: Publish validated V3 MP4 directly to GitHub
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.tech.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.tech.outputs.size }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.parse, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']; parent=os.environ['GITHUB_SHA']; branch=os.environ['GITHUB_REF_NAME']
          source='out/Geometry8_Composite_Simple_Shaded_Areas_V3_SENIOR_FINAL_pqh.mp4'
          target='published_renders/Geometry8_Composite_Simple_Shaded_Areas_V3_SENIOR_FINAL_pqh.mp4'
          expected_sha=os.environ['EXPECTED_SHA']; expected_size=int(os.environ['EXPECTED_SIZE']); api=f'https://api.github.com/repos/{repo}'
          raw=open(source,'rb').read(); assert hashlib.sha256(raw).hexdigest()==expected_sha; assert len(raw)==expected_size; assert len(raw)<100_000_000
          def request(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode(); req=urllib.request.Request(url,data=data,method=method)
              req.add_header('Authorization',f'Bearer {token}'); req.add_header('Accept','application/vnd.github+json'); req.add_header('X-GitHub-Api-Version','2022-11-28')
              if data is not None: req.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(req,timeout=180) as r: body=r.read(); return json.loads(body) if body else {}
              except urllib.error.HTTPError as e: print(e.read().decode(errors='replace')); raise
          base_commit=request('GET',f'{api}/git/commits/{parent}')
          blob=request('POST',f'{api}/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
          tree=request('POST',f'{api}/git/trees',{'base_tree':base_commit['tree']['sha'],'tree':[{'path':target,'mode':'100644','type':'blob','sha':blob['sha']}]})
          commit=request('POST',f'{api}/git/commits',{'message':'Publish Geometry 8 composite shaded V3 senior PQH [skip ci]','tree':tree['sha'],'parents':[parent]})
          ref=urllib.parse.quote(branch,safe='/'); request('PATCH',f'{api}/git/refs/heads/{ref}',{'sha':commit['sha'],'force':False})
          direct=f'https://raw.githubusercontent.com/{repo}/{branch}/{target}'
          print('published_commit=',commit['sha']); print('published_blob=',blob['sha']); print('published_size=',len(raw)); print('published_sha256=',expected_sha); print('direct_download=',direct)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'direct_url={direct}\n')
          PY

      - name: Verify direct GitHub V3 MP4 publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SIZE: ${{ steps.tech.outputs.size }}
        run: |
          set -euo pipefail
          sleep 2
          python - <<'PY' | tee qa_out/DIRECT_GITHUB_PUBLICATION.txt
          import json, os, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; branch=os.environ['GITHUB_REF_NAME']; target='published_renders/Geometry8_Composite_Simple_Shaded_Areas_V3_SENIOR_FINAL_pqh.mp4'; expected=int(os.environ['EXPECTED_SIZE'])
          url=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(target,safe="/")}?ref={urllib.parse.quote(branch,safe="/")}'
          req=urllib.request.Request(url); req.add_header('Authorization',f'Bearer {os.environ["GH_TOKEN"]}'); req.add_header('Accept','application/vnd.github+json'); req.add_header('X-GitHub-Api-Version','2022-11-28')
          with urllib.request.urlopen(req,timeout=60) as r: obj=json.load(r)
          print('path=',obj['path']); print('size=',obj['size']); print('download_url=',obj['download_url']); assert obj['size']==expected; assert obj['download_url'].endswith('.mp4'); print('DIRECT_GITHUB_DELIVERY=PASS')
          PY

      - name: Upload V3 senior render and QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Geometry8-Composite-Simple-Shaded-Areas-V3-SENIOR-FINAL-PQH-20260902
          path: |
            out/
            qa_out/
          if-no-files-found: warn
          retention-days: 14
