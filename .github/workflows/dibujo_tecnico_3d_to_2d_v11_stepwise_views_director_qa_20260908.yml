name: Dibujo Tecnico 3D to 2D V11 STEPWISE VIEWS DIRECTOR QA

on:
  push:
    branches:
      - render/dibujo-tecnico-3d-to-2d-v11-stepwise-views-director-qa-20260908
    paths:
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/build_v11_stepwise_views.py'
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/QA_V10_TO_V11_STEPWISE_VIEW_DIRECTOR_REVIEW.md'
      - '.github/workflows/dibujo_tecnico_3d_to_2d_v11_stepwise_views_director_qa_20260908.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  render-v11-stepwise-views:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Generate complete V11 source and static QA
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          python "$JOB/build_v11_stepwise_views.py"
          V11="$JOB/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V11_STEPWISE_VIEWS_DIRECTOR_QA.py"
          test -s "$V11"
          python -m py_compile "$V11"
          python - <<'PY'
          from pathlib import Path
          p=Path('render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V11_STEPWISE_VIEWS_DIRECTOR_QA.py')
          s=p.read_text(encoding='utf-8')
          required=[
              'class Projection3Dto2DV11StepwiseViewsDirectorQA',
              'V11_GLOBAL_PACE = 1.25',
              'FOLD_EXTRA_UPSHIFT = 1.20',
              'CONSTRUCCIÓN 2D · UNA VISTA A LA VEZ',
              'ALZADO · PASO 1/3',
              'PLANTA · PASO 3/3',
              'PERFIL · PASO 3/3',
              'front_card.animate.scale(0.50).move_to',
              'top_card.animate.scale(0.50).move_to',
              'right_card.animate.scale(0.50).move_to',
              'angle=-PI / 2',
              'run_time=T(4.80)',
              'UN OBJETO · TRES DESCRIPCIONES 2D',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          print('V11_STATIC_QA=PASS')
          PY
          mkdir -p /tmp/manim-bin /tmp/manim-home pql_media media out qa_out qa_out/audit_frames package
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open

      - name: Full-timeline PQL smoke render
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH HOME=/tmp/manim-home LESSON_TIME_SCALE=0.08
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pql Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V11_STEPWISE_VIEWS_DIRECTOR_QA.py \
            Projection3Dto2DV11StepwiseViewsDirectorQA --fps 15 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/pql_media" 2>&1 | tee "$GITHUB_WORKSPACE/qa_out/PQL.log"
          cd "$GITHUB_WORKSPACE"
          PQL="$(find pql_media -type f -name 'Projection3Dto2DV11StepwiseViewsDirectorQA.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" qa_out/Diedrico_3D_to_2D_V11_pql.mp4

      - name: Literal PQH final render 1920x1080 30fps
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH HOME=/tmp/manim-home LESSON_TIME_SCALE=1.0
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pqh Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V11_STEPWISE_VIEWS_DIRECTOR_QA.py \
            Projection3Dto2DV11StepwiseViewsDirectorQA --fps 30 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/media" 2>&1 | tee "$GITHUB_WORKSPACE/out/PQH.log"
          cd "$GITHUB_WORKSPACE"
          VIDEO="$(find media -type f -name 'Projection3Dto2DV11StepwiseViewsDirectorQA.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"
          cp "$VIDEO" out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V11_STEPWISE_VIEWS_DIRECTOR_QA_FINAL_pqh.mp4
          cp "$VIDEO" out/Diedrico_3D_to_2D_V11.mp4
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V11_STEPWISE_VIEWS_DIRECTOR_QA.py out/
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/QA_V10_TO_V11_STEPWISE_VIEW_DIRECTOR_REVIEW.md out/

      - name: Full decode and frame-distribution QA
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Diedrico_3D_to_2D_V11.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/FULL_TOTAL_QA.txt
          import av, numpy as np, statistics, os, sys
          p=sys.argv[1]
          widths=[]; heights=[]; content_fracs=[]; centers=[]
          frames=0; audited=0; near_blank=0; edge_hits=0
          with av.open(p) as c:
              stream=c.streams.video[0]
              codec=stream.codec_context.name
              width=stream.codec_context.width; height=stream.codec_context.height
              pix=stream.codec_context.format.name if stream.codec_context.format else ''
              fps=float(stream.average_rate) if stream.average_rate else 0.0
              duration=float(c.duration)/float(av.time_base) if c.duration else 0.0
              for frame in c.decode(stream):
                  frames += 1
                  if frames % 6:
                      continue
                  audited += 1
                  arr=frame.to_ndarray(format='gray')
                  mask=arr < 242
                  ys,xs=np.where(mask)
                  frac=float(mask.mean()); content_fracs.append(frac)
                  if len(xs):
                      widths.append(int(xs.max()-xs.min()+1)); heights.append(int(ys.max()-ys.min()+1))
                      centers.append(float((ys.min()+ys.max())/2))
                  else:
                      widths.append(0); heights.append(0); centers.append(540.0)
                  if frac < 0.0014:
                      near_blank += 1
                  border=int((arr[:5,:] < 220).sum() + (arr[-5:,:] < 220).sum() + (arr[:, :5] < 220).sum() + (arr[:, -5:] < 220).sum())
                  if border > 180:
                      edge_hits += 1
          size=os.path.getsize(p)
          medw=float(statistics.median(widths)); p10w=float(np.percentile(widths,10)); medh=float(statistics.median(heights))
          medfrac=float(statistics.median(content_fracs)); medcy=float(statistics.median(centers))
          print(f'codec_name={codec}')
          print(f'width={width}')
          print(f'height={height}')
          print(f'pix_fmt={pix}')
          print(f'average_fps={fps:.6f}')
          print(f'duration={duration:.6f}')
          print(f'frames_decoded={frames}')
          print(f'file_size={size}')
          print(f'audited_samples={audited}')
          print(f'median_bbox_width={medw}')
          print(f'p10_bbox_width={p10w}')
          print(f'median_bbox_height={medh}')
          print(f'median_content_fraction={medfrac}')
          print(f'median_content_center_y={medcy}')
          print(f'near_blank_samples={near_blank}')
          print(f'edge_hit_samples={edge_hits}')
          assert codec=='h264' and (width,height)==(1920,1080) and pix=='yuv420p'
          assert 29.8 <= fps <= 30.2
          assert duration > 140.0, duration
          assert frames > 4200, frames
          assert size > 2_500_000, size
          assert audited > 700, audited
          assert medw > 750 and p10w > 360 and medh > 250
          assert medfrac > 0.015
          assert near_blank < 45
          assert edge_hits < 30
          print('TECHNICAL_QA=PASS')
          print('FULL_TIMELINE_FRAME_QA=PASS')
          PY
          SHA="$(sha256sum "$VIDEO" | awk '{print $1}')"
          SIZE="$(stat -c%s "$VIDEO")"
          echo "$SHA  $VIDEO" | tee qa_out/SHA256SUMS.txt
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Generate 144-frame visual contact sheet
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Diedrico_3D_to_2D_V11.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/VISUAL_AUDIT.txt
          import av, math, os, sys
          from PIL import Image, ImageDraw
          p=sys.argv[1]; count=144; saved=[]
          with av.open(p) as c:
              s=c.streams.video[0]; duration=float(c.duration)/float(av.time_base)
              targets=[duration*i/(count+1) for i in range(1,count+1)]; ti=0
              for frame in c.decode(s):
                  if ti>=len(targets): break
                  t=float(frame.pts*frame.time_base) if frame.pts is not None else 0.0
                  if t>=targets[ti]:
                      im=Image.fromarray(frame.to_ndarray(format='rgb24'))
                      fp=f'qa_out/audit_frames/frame_{ti+1:03d}_{targets[ti]:07.2f}.jpg'
                      im.save(fp,quality=90); saved.append(fp); ti+=1
          assert len(saved)>=140
          cards=[]
          for fp in saved:
              im=Image.open(fp).convert('RGB'); im.thumbnail((480,270))
              card=Image.new('RGB',(500,300),'white'); card.paste(im,((500-im.width)//2,8))
              ImageDraw.Draw(card).text((10,280),os.path.basename(fp),fill='black'); cards.append(card)
          cols=4; rows=math.ceil(len(cards)/cols); sheet=Image.new('RGB',(cols*500,rows*300),'white')
          for i,im in enumerate(cards): sheet.paste(im,((i%cols)*500,(i//cols)*300))
          sheet.save('qa_out/Diedrico_3D_to_2D_V11_contact_sheet.jpg',quality=90)
          print('audit_frames=',len(saved)); print('duration=',duration); print('contact_sheet=PASS')
          PY

      - name: Prepare deterministic deliverable package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package
          cp out/Diedrico_3D_to_2D_V11.mp4 package/
          cp out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V11_STEPWISE_VIEWS_DIRECTOR_QA_FINAL_pqh.mp4 package/
          cp out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V11_STEPWISE_VIEWS_DIRECTOR_QA.py package/
          cp out/QA_V10_TO_V11_STEPWISE_VIEW_DIRECTOR_REVIEW.md package/
          cp qa_out/FULL_TOTAL_QA.txt package/
          cp qa_out/SHA256SUMS.txt package/
          cp qa_out/VISUAL_AUDIT.txt package/
          cp qa_out/Diedrico_3D_to_2D_V11_contact_sheet.jpg package/
          cp out/PQH.log package/
          test "$(sha256sum package/Diedrico_3D_to_2D_V11.mp4 | awk '{print $1}')" = "${{ steps.qa.outputs.sha256 }}"

      - name: Upload validated V11 MP4 artifact before publication
        uses: actions/upload-artifact@v4
        with:
          name: Diedrico_3D_to_2D_V11_STEPWISE_VIEWS_REAL_MP4
          path: package/
          if-no-files-found: error
          retention-days: 7

      - name: Publish exact validated V11 MP4 from latest branch head
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.qa.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.qa.outputs.size }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, time, urllib.error, urllib.parse, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']; branch=os.environ['GITHUB_REF_NAME']
          expected_sha=os.environ['EXPECTED_SHA']; expected_size=int(os.environ['EXPECTED_SIZE'])
          video=open('out/Diedrico_3D_to_2D_V11.mp4','rb').read()
          assert hashlib.sha256(video).hexdigest()==expected_sha and len(video)==expected_size
          source_path='render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V11_STEPWISE_VIEWS_DIRECTOR_QA.py'
          source=open(source_path,'rb').read()
          api=f'https://api.github.com/repos/{repo}'
          def req(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(url,data=data,method=method)
              r.add_header('Authorization',f'Bearer {token}')
              r.add_header('Accept','application/vnd.github+json')
              r.add_header('X-GitHub-Api-Version','2022-11-28')
              if data is not None: r.add_header('Content-Type','application/json')
              with urllib.request.urlopen(r,timeout=180) as f:
                  b=f.read(); return json.loads(b) if b else {}
          vblob=req('POST',f'{api}/git/blobs',{'content':base64.b64encode(video).decode(),'encoding':'base64'})
          sblob=req('POST',f'{api}/git/blobs',{'content':base64.b64encode(source).decode(),'encoding':'base64'})
          entries=[
              {'path':'published_renders/Diedrico_3D_to_2D_V11.mp4','mode':'100644','type':'blob','sha':vblob['sha']},
              {'path':'published_renders/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V11_STEPWISE_VIEWS_DIRECTOR_QA_FINAL_pqh.mp4','mode':'100644','type':'blob','sha':vblob['sha']},
              {'path':source_path,'mode':'100644','type':'blob','sha':sblob['sha']},
          ]
          ref_path=urllib.parse.quote(branch,safe='/')
          last=None
          for attempt in range(1,5):
              try:
                  ref=req('GET',f'{api}/git/ref/heads/{ref_path}')
                  parent=ref['object']['sha']
                  base=req('GET',f'{api}/git/commits/{parent}')
                  tree=req('POST',f'{api}/git/trees',{'base_tree':base['tree']['sha'],'tree':entries})
                  commit=req('POST',f'{api}/git/commits',{'message':'Publish Dibujo Tecnico V11 stepwise views [skip ci]','tree':tree['sha'],'parents':[parent]})
                  req('PATCH',f'{api}/git/refs/heads/{ref_path}',{'sha':commit['sha'],'force':False})
                  open('qa_out/PUBLISHED_COMMIT.txt','w').write(commit['sha']+'\n')
                  print('published_commit=',commit['sha'])
                  break
              except urllib.error.HTTPError as e:
                  last=e
                  print('publish_attempt_failed',attempt,'status',e.code)
                  if attempt==4: raise
                  time.sleep(3)
          else:
              raise last or RuntimeError('publication failed')
          PY
          echo "commit_sha=$(cat qa_out/PUBLISHED_COMMIT.txt)" >> "$GITHUB_OUTPUT"

      - name: Verify commit-pinned raw GitHub MP4 byte-for-byte
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.qa.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.qa.outputs.size }}
          PUB_COMMIT: ${{ steps.publish.outputs.commit_sha }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee qa_out/DIRECT_REDOWNLOAD_QA.txt
          import hashlib, os, time, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; commit=os.environ['PUB_COMMIT']
          sha0=os.environ['EXPECTED_SHA']; size0=int(os.environ['EXPECTED_SIZE'])
          targets=[
              'published_renders/Diedrico_3D_to_2D_V11.mp4',
              'published_renders/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V11_STEPWISE_VIEWS_DIRECTOR_QA_FINAL_pqh.mp4',
          ]
          for target in targets:
              url=f'https://raw.githubusercontent.com/{repo}/{commit}/{target}'
              data=None
              for _ in range(10):
                  try:
                      with urllib.request.urlopen(url,timeout=120) as r: data=r.read()
                      break
                  except Exception:
                      time.sleep(3)
              assert data is not None
              sha=hashlib.sha256(data).hexdigest()
              print(target,'size=',len(data),'sha256=',sha)
              assert len(data)==size0 and sha==sha0
          print('DIRECT_REDOWNLOAD=PASS')
          PY
