name: Inventor Fillet Redondeo Senior V5 QA FINAL PQH 20260826

on:
  push:
    branches:
      - render-inventor-dedicated-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventor-fillet-redondeo-senior-v5-20260826
  cancel-in-progress: true

env:
  JOB_ROOT: render_jobs/fillet_redondeo_senior_v5_20260826
  MANIM_IMAGE: manimcommunity/manim:v0.20.1

jobs:
  render_fillet_v5:
    name: Render Fillet Redondeo Senior V5 QA
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout exact render branch
        uses: actions/checkout@v4
        with:
          ref: render-inventor-dedicated-20260826

      - name: Static Python and lesson-contract QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$JOB_ROOT/fillet_redondeo_senior_v5.py"
          grep -q 'class InventorFilletRedondeoSeniorV5' "$JOB_ROOT/fillet_redondeo_senior_v5.py"
          grep -q 'Sketch1' "$JOB_ROOT/fillet_redondeo_senior_v5.py"
          grep -q 'Extrusion1' "$JOB_ROOT/fillet_redondeo_senior_v5.py"
          grep -q 'Edge1' "$JOB_ROOT/fillet_redondeo_senior_v5.py"
          grep -q 'R = 8 mm' "$JOB_ROOT/fillet_redondeo_senior_v5.py"
          grep -q 'Fillet1' "$JOB_ROOT/fillet_redondeo_senior_v5.py"
          grep -q 'assert_safe' "$JOB_ROOT/fillet_redondeo_senior_v5.py"

      - name: Prepare ManimCE 0.20.1 and QA tools
        shell: bash
        run: |
          set -euo pipefail
          command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          command -v zip >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zip >/dev/null)
          docker pull "$MANIM_IMAGE" >/dev/null

      - name: Literal PQL smoke render
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          rm -rf media_pql media delivery
          mkdir -p delivery/audit_frames
          chmod -R a+rwX .
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$GITHUB_WORKSPACE:/manim" \
            -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql fillet_redondeo_senior_v5.py InventorFilletRedondeoSeniorV5 \
                --fps 15 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee delivery/render_pql.log
          PQL="$(find media_pql -type f -name 'InventorFilletRedondeoSeniorV5.mp4' ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$GITHUB_WORKSPACE:/manim" \
            -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh fillet_redondeo_senior_v5.py InventorFilletRedondeoSeniorV5 \
                --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee delivery/render_pqh.log
          FINAL="$(find media -type f -name 'InventorFilletRedondeoSeniorV5.mp4' ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" delivery/Inventor_Fillet_Redondeo_Senior_V5_FINAL_PQH.mp4
          cp fillet_redondeo_senior_v5.py delivery/Inventor_Fillet_Redondeo_Senior_V5.py

      - name: Senior automated technical QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          F=delivery/Inventor_Fillet_Redondeo_Senior_V5_FINAL_PQH.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F" | tr -d '[:space:]')"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F" | tr -d '[:space:]')"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F" | tr -d '[:space:]')"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F" | tr -d '[:space:]')"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F" | tr -d '[:space:]')"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F" | tr -d '[:space:]')"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F" | tr -d '[:space:]')"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          python - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert 105 <= d <= 220, f"Unexpected lesson duration: {d}"
          PY
          ffmpeg -nostdin -v error -i "$F" -f null - 2> delivery/full_decode.log
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of json "$F" > delivery/VIDEO_TECHNICAL.json
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > delivery/VIDEO_TECHNICAL.tsv
          for P in 0.04 0.10 0.16 0.22 0.28 0.34 0.40 0.46 0.52 0.58 0.64 0.70 0.76 0.82 0.89 0.96; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "delivery/audit_frames/frame_${TAG}.png"
          done
          ffmpeg -y -loglevel error -pattern_type glob -i 'delivery/audit_frames/*.png' -vf 'scale=480:-1,tile=4x4' -frames:v 1 delivery/QA_CONTACT_SHEET.jpg
          sha256sum "$F" delivery/Inventor_Fillet_Redondeo_Senior_V5.py > delivery/SHA256SUMS.txt
          cat > delivery/QA_AUTOMATED_REPORT.txt <<EOF
          FILLET / REDONDEO SENIOR V5 — AUTOMATED QA PASS
          ManimCE: 0.20.1
          Final render: literal -pqh
          Resolution: $W x $H
          Frame rate: $FPS
          Codec: $CODEC
          Pixel format: $PIX
          Duration: $DUR s
          Full FFmpeg decode: PASS
          Static Python compile: PASS
          Safe-area assertions embedded in scene: PASS at render time
          Audit frames: 16
          Contact sheet: generated
          Source pedagogy contract: Sketch1 -> constraints -> Extrusion1 -> Edge1 -> Fillet parameters -> radius/tangency -> preview -> validation -> Fillet1 -> parametric edit -> final orbit
          EOF
          zip -9 -j delivery/Inventor_Fillet_Redondeo_Senior_V5_FULL_PACKAGE.zip \
            delivery/Inventor_Fillet_Redondeo_Senior_V5_FINAL_PQH.mp4 \
            delivery/Inventor_Fillet_Redondeo_Senior_V5.py \
            delivery/VIDEO_TECHNICAL.json delivery/VIDEO_TECHNICAL.tsv \
            delivery/QA_AUTOMATED_REPORT.txt delivery/QA_CONTACT_SHEET.jpg \
            delivery/SHA256SUMS.txt delivery/render_pql.log delivery/render_pqh.log delivery/full_decode.log

      - name: Upload verified V5 package
        uses: actions/upload-artifact@v4
        with:
          name: Inventor-Fillet-Redondeo-Senior-V5-QA-FINAL-PQH
          path: |
            ${{ env.JOB_ROOT }}/delivery/Inventor_Fillet_Redondeo_Senior_V5_FINAL_PQH.mp4
            ${{ env.JOB_ROOT }}/delivery/Inventor_Fillet_Redondeo_Senior_V5.py
            ${{ env.JOB_ROOT }}/delivery/Inventor_Fillet_Redondeo_Senior_V5_FULL_PACKAGE.zip
            ${{ env.JOB_ROOT }}/delivery/VIDEO_TECHNICAL.json
            ${{ env.JOB_ROOT }}/delivery/VIDEO_TECHNICAL.tsv
            ${{ env.JOB_ROOT }}/delivery/QA_AUTOMATED_REPORT.txt
            ${{ env.JOB_ROOT }}/delivery/QA_CONTACT_SHEET.jpg
            ${{ env.JOB_ROOT }}/delivery/SHA256SUMS.txt
            ${{ env.JOB_ROOT }}/delivery/audit_frames/
          if-no-files-found: error
          retention-days: 7
