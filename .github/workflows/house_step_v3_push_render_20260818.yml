name: Inventor Fillet Redondeo Senior V4 FINAL PQH 20260826

on:
  push:
    branches:
      - render-inventor-dedicated-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventor-fillet-redondeo-senior-v4-20260826
  cancel-in-progress: true

env:
  JOB_ROOT: render_jobs/fillet_redondeo_senior_v4_20260826
  MANIM_IMAGE: manimcommunity/manim:v0.20.1

jobs:
  render_fillet:
    name: Render Fillet Redondeo Senior V4
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact render branch
        uses: actions/checkout@v4
        with:
          ref: render-inventor-dedicated-20260826

      - name: Static Python QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$JOB_ROOT/fillet_redondeo_senior_v4.py"
          grep -q 'class InventorFilletRedondeoSeniorV4' "$JOB_ROOT/fillet_redondeo_senior_v4.py"
          grep -q 'Sketch1' "$JOB_ROOT/fillet_redondeo_senior_v4_20260826/fillet_redondeo_senior_v4.py" || true
          grep -q 'Sketch1' "$JOB_ROOT/fillet_redondeo_senior_v4.py"
          grep -q 'Extrusion1' "$JOB_ROOT/fillet_redondeo_senior_v4.py"
          grep -q 'Fillet1' "$JOB_ROOT/fillet_redondeo_senior_v4.py"
          grep -q 'R = 8 mm' "$JOB_ROOT/fillet_redondeo_senior_v4.py"

      - name: Prepare ManimCE 0.20.1 and QA tools
        shell: bash
        run: |
          set -euo pipefail
          command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          command -v zip >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zip >/dev/null)
          docker pull "$MANIM_IMAGE" >/dev/null
          ffprobe -version | head -1

      - name: Literal PQL smoke render
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          rm -rf media_pql delivery
          mkdir -p delivery
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$GITHUB_WORKSPACE:/manim" \
            -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql fillet_redondeo_senior_v4.py InventorFilletRedondeoSeniorV4 \
                --fps 15 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee delivery/render_pql.log
          PQL="$(find media_pql -type f -name 'InventorFilletRedondeoSeniorV4.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          rm -rf media
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$GITHUB_WORKSPACE:/manim" \
            -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh fillet_redondeo_senior_v4.py InventorFilletRedondeoSeniorV4 \
                --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee delivery/render_pqh.log
          FINAL="$(find media -type f -name 'InventorFilletRedondeoSeniorV4.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" delivery/Inventor_Fillet_Redondeo_Senior_V4_FINAL_PQH.mp4
          cp fillet_redondeo_senior_v4.py delivery/Inventor_Fillet_Redondeo_Senior_V4.py

      - name: Senior automated video QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          OUT=delivery
          F="$OUT/Inventor_Fillet_Redondeo_Senior_V4_FINAL_PQH.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          python -c "import sys; sys.exit(0 if float('$DUR') >= 55.0 else 1)"
          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/full_decode.log"

          mkdir -p "$OUT/audit_frames"
          for P in 0.03 0.10 0.18 0.27 0.36 0.45 0.54 0.63 0.72 0.81 0.90 0.97; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "$OUT/audit_frames/frame_${TAG}.png"
          done

          sha256sum "$F" "$OUT/Inventor_Fillet_Redondeo_Senior_V4.py" > "$OUT/SHA256SUMS.txt"
          cat > "$OUT/QA_REPORT.md" <<EOF
          # Senior QA — Fillet / Redondeo V4

          Automated gates passed by this step:
          - Python syntax / class contract
          - literal ManimCE -pql smoke render
          - literal ManimCE -pqh final render
          - 1920x1080 output
          - 30 fps
          - H.264 / yuv420p
          - duration >= 55 s
          - full FFmpeg decode without errors
          - 12 audit frames extracted across the full timeline
          - SHA-256 generated

          Pedagogical contract audited in source:
          2D fillet geometry -> constrained Sketch1 -> Extrusion1 -> Edge1 selection ->
          Constant Radius R=8 mm -> tangent preview -> material removal -> Fillet1 ->
          parametric radius edit -> final 3D orbit.
          EOF

          cat > "$OUT/RENDER_INFO.txt" <<EOF
          Scene: InventorFilletRedondeoSeniorV4
          Tool: Autodesk Inventor Fillet / Redondeo
          Style reference: House Extrusion + Barrido/Sweep + Solevacion/Loft + Revolucion/Revolve classroom grammar
          ManimCE: 0.20.1
          Final: literal -pqh, 1920x1080, 30 fps, H.264/yuv420p
          Workflow: 2D geometry -> Sketch1 -> Extrusion1 -> Edge1 -> Radius -> Preview -> Fillet1 -> Edit -> Orbit
          EOF

          (
            cd "$OUT"
            zip -9 -r Inventor_Fillet_Redondeo_Senior_V4_FULL_PACKAGE.zip \
              Inventor_Fillet_Redondeo_Senior_V4_FINAL_PQH.mp4 \
              Inventor_Fillet_Redondeo_Senior_V4.py \
              VIDEO_TECHNICAL.tsv QA_REPORT.md RENDER_INFO.txt SHA256SUMS.txt \
              render_pql.log render_pqh.log full_decode.log audit_frames/ >/dev/null
          )

      - name: Upload verified full package
        uses: actions/upload-artifact@v4
        with:
          name: Inventor-Fillet-Redondeo-Senior-V4-FINAL-PQH
          path: |
            ${{ env.JOB_ROOT }}/delivery/Inventor_Fillet_Redondeo_Senior_V4_FINAL_PQH.mp4
            ${{ env.JOB_ROOT }}/delivery/Inventor_Fillet_Redondeo_Senior_V4.py
            ${{ env.JOB_ROOT }}/delivery/Inventor_Fillet_Redondeo_Senior_V4_FULL_PACKAGE.zip
            ${{ env.JOB_ROOT }}/delivery/VIDEO_TECHNICAL.tsv
            ${{ env.JOB_ROOT }}/delivery/QA_REPORT.md
            ${{ env.JOB_ROOT }}/delivery/RENDER_INFO.txt
            ${{ env.JOB_ROOT }}/delivery/SHA256SUMS.txt
            ${{ env.JOB_ROOT }}/delivery/audit_frames/
          if-no-files-found: error
          retention-days: 7
