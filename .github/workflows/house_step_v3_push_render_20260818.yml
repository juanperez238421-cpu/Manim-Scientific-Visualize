name: Inventor Emboss Repujado Senior V1 FINAL QA PQH 20260826

on:
  push:
    branches:
      - render-inventor-dedicated-20260826
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inventor-emboss-repujado-senior-v1-20260826
  cancel-in-progress: true

env:
  JOB_ROOT: render_jobs/fillet_redondeo_senior_v5_20260826
  MANIM_IMAGE: manimcommunity/manim:v0.20.1

jobs:
  render_emboss_v1:
    if: github.actor != 'github-actions[bot]'
    name: Render Emboss Repujado Senior V1 Final QA
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout exact render branch
        uses: actions/checkout@v4
        with:
          ref: render-inventor-dedicated-20260826

      - name: Static Python and senior lesson-contract QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            "$JOB_ROOT/fillet_redondeo_senior_v5.py" \
            "$JOB_ROOT/hole_agujero_senior_v1.py" \
            "$JOB_ROOT/hole_agujero_senior_v2.py" \
            "$JOB_ROOT/hole_agujero_senior_v3.py" \
            "$JOB_ROOT/emboss_repujado_senior_v1.py"
          grep -q 'class InventorEmbossRepujadoSeniorV1' "$JOB_ROOT/emboss_repujado_senior_v1.py"
          grep -q 'Sketch2 Region' "$JOB_ROOT/emboss_repujado_senior_v1.py"
          grep -q 'Emboss from Face' "$JOB_ROOT/emboss_repujado_senior_v1.py"
          grep -q 'Depth.*3 mm' "$JOB_ROOT/emboss_repujado_senior_v1.py"
          grep -q 'Emboss1' "$JOB_ROOT/emboss_repujado_senior_v1.py"
          grep -q 'ENGRAVE' "$JOB_ROOT/emboss_repujado_senior_v1.py"
          grep -q 'parametric_edit' "$JOB_ROOT/emboss_repujado_senior_v1.py"

      - name: Prepare ManimCE 0.20.1 and QA tools
        shell: bash
        run: |
          set -euo pipefail
          command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          command -v zip >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zip >/dev/null)
          docker pull "$MANIM_IMAGE" >/dev/null

      - name: Literal PQL smoke render
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          rm -rf media_pql_emboss_v1 media_emboss_v1 delivery_emboss_v1
          mkdir -p delivery_emboss_v1/audit_frames
          chmod -R a+rwX .
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home \
            -v "$GITHUB_WORKSPACE:/manim" -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql emboss_repujado_senior_v1.py InventorEmbossRepujadoSeniorV1 \
                --fps 15 --format=mp4 --media_dir media_pql_emboss_v1 --disable_caching
            " 2>&1 | tee delivery_emboss_v1/render_pql.log
          PQL="$(find media_pql_emboss_v1 -type f -name 'InventorEmbossRepujadoSeniorV1.mp4' ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home \
            -v "$GITHUB_WORKSPACE:/manim" -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh emboss_repujado_senior_v1.py InventorEmbossRepujadoSeniorV1 \
                --fps 30 --format=mp4 --media_dir media_emboss_v1 --disable_caching
            " 2>&1 | tee delivery_emboss_v1/render_pqh.log
          FINAL="$(find media_emboss_v1 -type f -name 'InventorEmbossRepujadoSeniorV1.mp4' ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" delivery_emboss_v1/05_emboss_repujado.mp4
          cp emboss_repujado_senior_v1.py delivery_emboss_v1/05_emboss_repujado_V1.py
          cp hole_agujero_senior_v3.py delivery_emboss_v1/hole_agujero_V3_reference.py
          cp fillet_redondeo_senior_v5.py delivery_emboss_v1/jp_cad_senior_base.py

      - name: Senior automated technical and frame QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          F=delivery_emboss_v1/05_emboss_repujado.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F" | tr -d '[:space:]')"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F" | tr -d '[:space:]')"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F" | tr -d '[:space:]')"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F" | tr -d '[:space:]')"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F" | tr -d '[:space:]')"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F" | tr -d '[:space:]')"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F" | tr -d '[:space:]')"

          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          python - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert 95 <= d <= 360, f"Unexpected lesson duration: {d}"
          PY

          ffmpeg -nostdin -v error -i "$F" -f null - 2> delivery_emboss_v1/full_decode.log
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size -of json "$F" \
            > delivery_emboss_v1/VIDEO_TECHNICAL.json
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" \
            > delivery_emboss_v1/VIDEO_TECHNICAL.tsv

          for P in 0.02 0.06 0.10 0.14 0.18 0.22 0.26 0.30 0.34 0.38 0.42 0.46 0.50 0.54 0.58 0.62 0.66 0.70 0.74 0.78 0.82 0.86 0.91 0.96; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 \
              "delivery_emboss_v1/audit_frames/frame_${TAG}.png"
          done
          ffmpeg -y -loglevel error -pattern_type glob \
            -i 'delivery_emboss_v1/audit_frames/*.png' \
            -vf 'scale=384:-1,tile=6x4' -frames:v 1 \
            delivery_emboss_v1/QA_CONTACT_SHEET.jpg

          sha256sum "$F" \
            delivery_emboss_v1/05_emboss_repujado_V1.py \
            delivery_emboss_v1/hole_agujero_V3_reference.py \
            > delivery_emboss_v1/SHA256SUMS.txt

          cat > delivery_emboss_v1/QA_AUTOMATED_REPORT.txt <<EOF
          EMBOSS / REPUJADO SENIOR V1 — AUTOMATED QA PASS
          ManimCE: 0.20.1
          Final render: literal -pqh
          Resolution: $W x $H
          Frame rate: $FPS
          Codec: $CODEC
          Pixel format: $PIX
          Duration: $DUR s
          Full FFmpeg decode: PASS
          Static Python compile: PASS
          HUD no-overlap assertion: PASS at render time
          Parameter-card right safe-area assertion: PASS at render time
          Profile-fit and shallow-depth assertions: PASS at render time
          Consolidated style source: latest Fillet / Chamfer / Hole senior family.
          Pedagogy: Sketch1 -> Extrusion1 -> Top Face -> Sketch2 closed hexagon -> Emboss parameters -> 3D +3 mm preview -> Emboss vs Engrave -> validation -> Emboss1 -> 3-to-5 mm parametric edit -> applications -> final orbit.
          Audit frames: 24
          Contact sheet: generated
          EOF

          zip -9 -j delivery_emboss_v1/05_emboss_repujado_FULL_PACKAGE_V1.zip \
            delivery_emboss_v1/05_emboss_repujado.mp4 \
            delivery_emboss_v1/05_emboss_repujado_V1.py \
            delivery_emboss_v1/hole_agujero_V3_reference.py \
            delivery_emboss_v1/jp_cad_senior_base.py \
            delivery_emboss_v1/VIDEO_TECHNICAL.json \
            delivery_emboss_v1/VIDEO_TECHNICAL.tsv \
            delivery_emboss_v1/QA_AUTOMATED_REPORT.txt \
            delivery_emboss_v1/QA_CONTACT_SHEET.jpg \
            delivery_emboss_v1/SHA256SUMS.txt \
            delivery_emboss_v1/render_pql.log \
            delivery_emboss_v1/render_pqh.log \
            delivery_emboss_v1/full_decode.log

      - name: Persist verified PQH delivery on render branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$JOB_ROOT/delivery_emboss_v1"
          git commit -m 'Persist Emboss Repujado V1 PQH delivery' || true
          git push origin HEAD:render-inventor-dedicated-20260826

      - name: Upload verified Emboss V1 package
        uses: actions/upload-artifact@v4
        with:
          name: 05-emboss-repujado-Senior-V1-FINAL-QA-PQH
          path: |
            ${{ env.JOB_ROOT }}/delivery_emboss_v1/05_emboss_repujado.mp4
            ${{ env.JOB_ROOT }}/delivery_emboss_v1/05_emboss_repujado_V1.py
            ${{ env.JOB_ROOT }}/delivery_emboss_v1/hole_agujero_V3_reference.py
            ${{ env.JOB_ROOT }}/delivery_emboss_v1/jp_cad_senior_base.py
            ${{ env.JOB_ROOT }}/delivery_emboss_v1/05_emboss_repujado_FULL_PACKAGE_V1.zip
            ${{ env.JOB_ROOT }}/delivery_emboss_v1/VIDEO_TECHNICAL.json
            ${{ env.JOB_ROOT }}/delivery_emboss_v1/VIDEO_TECHNICAL.tsv
            ${{ env.JOB_ROOT }}/delivery_emboss_v1/QA_AUTOMATED_REPORT.txt
            ${{ env.JOB_ROOT }}/delivery_emboss_v1/QA_CONTACT_SHEET.jpg
            ${{ env.JOB_ROOT }}/delivery_emboss_v1/SHA256SUMS.txt
            ${{ env.JOB_ROOT }}/delivery_emboss_v1/audit_frames/
          if-no-files-found: error
          retention-days: 7
