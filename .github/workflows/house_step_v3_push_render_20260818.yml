name: House Step V3 Push Render 20260818

on:
  push:
    branches:
      - house-step-v3-render-20260818

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4
        with:
          ref: house-step-v3-render-20260818

      - name: Persist STARTED
        shell: bash
        run: |
          set -euo pipefail
          OUT=render_jobs/house_step_v3/delivery
          mkdir -p "$OUT"
          printf 'STARTED\n' > "$OUT/STATUS.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT/STATUS.txt"
          git commit -m 'House Step V3 render started' || true
          git push origin HEAD:house-step-v3-render-20260818

      - name: Render PQL and PQH, verify, commit delivery
        shell: bash
        run: |
          set -uo pipefail
          JOB=render_jobs/house_step_v3
          SRC="$JOB/House_Extrusion_3D_ManimCE.py"
          OUT="$JOB/delivery"
          rm -rf media_pql media "$OUT/audit_frames"
          mkdir -p "$OUT/audit_frames"

          persist_fail() {
            CODE="$1"
            printf 'FAILED\ncode=%s\n' "$CODE" > "$OUT/STATUS.txt"
            git add "$OUT" || true
            git commit -m "House Step V3 render failed $CODE" || true
            git push origin HEAD:house-step-v3-render-20260818 || true
            exit 1
          }

          python -m py_compile "$SRC" > "$OUT/py_compile.log" 2>&1 || persist_fail PY_COMPILE
          docker pull manimcommunity/manim:v0.20.1 > "$OUT/docker_pull.log" 2>&1 || persist_fail DOCKER_PULL

          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $SRC HouseExtrusion3D --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee "$OUT/render_pql.log"
          PQL=${PIPESTATUS[0]}
          set -e
          [ "$PQL" -eq 0 ] || persist_fail PQL_RENDER

          PREVIEW="$(find media_pql -type f -name 'HouseExtrusion3D.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          [ -n "$PREVIEW" ] && [ -s "$PREVIEW" ] || persist_fail PQL_OUTPUT

          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $SRC HouseExtrusion3D --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee "$OUT/render_pqh.log"
          PQH=${PIPESTATUS[0]}
          set -e
          [ "$PQH" -eq 0 ] || persist_fail PQH_RENDER

          FINAL="$(find media -type f -name 'HouseExtrusion3D.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          [ -n "$FINAL" ] && [ -s "$FINAL" ] || persist_fail PQH_OUTPUT
          cp "$FINAL" "$OUT/House_Extrusion_3D_STEP_BY_STEP_V3_PQH.mp4"
          cp "$SRC" "$OUT/House_Extrusion_3D_ManimCE.py"

          F="$OUT/House_Extrusion_3D_STEP_BY_STEP_V3_PQH.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"
          [ "$W" = 1920 ] || persist_fail WIDTH
          [ "$H" = 1080 ] || persist_fail HEIGHT
          [ "$FPS" = 30/1 ] || persist_fail FPS
          [ "$CODEC" = h264 ] || persist_fail CODEC
          [ "$PIX" = yuv420p ] || persist_fail PIX_FMT
          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/full_decode.log" || persist_fail FULL_DECODE

          for P in 0.05 0.15 0.25 0.35 0.45 0.55 0.65 0.75 0.85 0.95; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "$OUT/audit_frames/frame_${TAG}.png" || persist_fail QA_FRAME
          done

          sha256sum "$F" "$SRC" > "$OUT/SHA256SUMS.txt"
          cat > "$OUT/RENDER_INFO.txt" <<'EOF'
Scene: HouseExtrusion3D
Version: Senior Step-by-Step V3
ManimCE: 0.20.1
Preview: literal -pql
Final: literal -pqh, 1920x1080, 30 fps, H.264/yuv420p
Sequence: terrain -> slab sketch -> slab extrusion -> sketch walls/columns on slab -> columns -> perimeter walls -> interior walls -> negative door/window cuts -> roof -> orbit
QA: py_compile + PQL + PQH + ffprobe + full decode + 10 audit frames + SHA-256
EOF
          printf 'SUCCESS\n' > "$OUT/STATUS.txt"

          git add "$OUT"
          git commit -m 'House Step V3 verified PQH delivery'
          git push origin HEAD:house-step-v3-render-20260818
