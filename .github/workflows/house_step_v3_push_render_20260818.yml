name: Inventor Misc House Style V3 TOTAL PQH 20260826

on:
  push:
    branches:
      - house-step-v3-render-20260818

permissions:
  contents: read

concurrency:
  group: inventor-misc-house-style-v3-total-20260826
  cancel-in-progress: true

jobs:
  render-total-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout House-style source branch
        uses: actions/checkout@v4
        with:
          ref: render-inventor-misc-house-style-v3-20260826

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          cd render_jobs/inventor_misc_house_style_v3_20260826
          python -m py_compile library/jp_misc_cad_style.py scenes/*.py
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1 || ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg zip
          fi
          rm -rf preview hq FINAL_PACKAGE
          mkdir -p preview hq FINAL_PACKAGE/individual_videos FINAL_PACKAGE/sources FINAL_PACKAGE/qa/logs FINAL_PACKAGE/qa/frames
          chmod -R a+rwX .

      - name: Pull ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Render PQL and PQH for all eight lessons
        shell: bash
        run: |
          set -euo pipefail
          cd render_jobs/inventor_misc_house_style_v3_20260826
          SLUGS=(01_fillet_redondeo 02_chamfer_chaflan 03_mirror_simetria 04_rib_nervio 05_emboss_repujado 06_coil_bobina 07_rectangular_pattern_lineal 08_circular_pattern)
          FILES=(scenes/01_fillet_redondeo.py scenes/02_chamfer_chaflan.py scenes/03_mirror_simetria.py scenes/04_rib_nervio.py scenes/05_emboss_repujado.py scenes/06_coil_bobina.py scenes/07_rectangular_pattern_lineal.py scenes/08_circular_pattern.py)
          SCENES=(InventorFilletHouseStyle InventorChamferHouseStyle InventorMirrorHouseStyle InventorRibHouseStyle InventorEmbossHouseStyle InventorCoilHouseStyle InventorRectPatternHouseStyle InventorCircularPatternHouseStyle)
          : > FINAL_PACKAGE/qa/concat.txt
          for i in "${!SLUGS[@]}"; do
            slug="${SLUGS[$i]}"; file="${FILES[$i]}"; scene="${SCENES[$i]}"
            mkdir -p "preview/${slug}" "hq/${slug}"
            docker run --rm -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.18 -e FILE="$file" -e SCENE="$scene" -e MEDIA_DIR="/manim/preview/${slug}" -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'set -euo pipefail; mkdir -p /tmp/bin; printf "#!/bin/sh\nexit 0\n" > /tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH="/tmp/bin:$PATH"; manim -pql "$FILE" "$SCENE" --media_dir "$MEDIA_DIR" --format=mp4 --disable_caching' 2>&1 | tee "FINAL_PACKAGE/qa/logs/${slug}_pql.log"
            docker run --rm -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 -e FILE="$file" -e SCENE="$scene" -e MEDIA_DIR="/manim/hq/${slug}" -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'set -euo pipefail; mkdir -p /tmp/bin; printf "#!/bin/sh\nexit 0\n" > /tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH="/tmp/bin:$PATH"; manim -pqh "$FILE" "$SCENE" --media_dir "$MEDIA_DIR" --format=mp4 --disable_caching' 2>&1 | tee "FINAL_PACKAGE/qa/logs/${slug}_pqh.log"
            mapfile -t candidates < <(find "hq/${slug}" -type f -name '*.mp4' ! -path '*/partial_movie_files/*' | sort)
            printf '%s\n' "${candidates[@]}" > "FINAL_PACKAGE/qa/${slug}_final_candidates.txt"
            test "${#candidates[@]}" -eq 1
            video="FINAL_PACKAGE/individual_videos/${slug}_PQH.mp4"
            cp "${candidates[0]}" "$video"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$video" | tr -d '[:space:]')" = 1920
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$video" | tr -d '[:space:]')" = 1080
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$video" | tr -d '[:space:]')" = 30/1
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$video" | tr -d '[:space:]')" = h264
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$video" | tr -d '[:space:]')" = yuv420p
            ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of json "$video" > "FINAL_PACKAGE/qa/${slug}_ffprobe.json"
            ffmpeg -v error -i "$video" -f null -
            sha256sum "$video" > "FINAL_PACKAGE/qa/${slug}_sha256.txt"
            ffmpeg -y -i "$video" -vf 'fps=1/8,scale=640:-1,tile=3x3' -frames:v 1 "FINAL_PACKAGE/qa/frames/${slug}_control_sheet.jpg"
            printf "file '%s'\n" "$PWD/$video" >> FINAL_PACKAGE/qa/concat.txt
          done

      - name: Assemble master video and total ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd render_jobs/inventor_misc_house_style_v3_20260826
          ffmpeg -y -f concat -safe 0 -i FINAL_PACKAGE/qa/concat.txt -c copy FINAL_PACKAGE/Inventor_Misc_Tools_HouseStyle_V3_MASTER_PQH.mp4
          ffmpeg -v error -i FINAL_PACKAGE/Inventor_Misc_Tools_HouseStyle_V3_MASTER_PQH.mp4 -f null -
          cp README.md FINAL_PACKAGE/
          cp -R library scenes FINAL_PACKAGE/sources/
          printf 'PASS — 8 independent literal PQH renders\nStyle: House + Sweep + Loft + Revolve\n1920x1080 30fps H.264 yuv420p\n' > FINAL_PACKAGE/QA_TOTAL_PASS.txt
          sha256sum FINAL_PACKAGE/Inventor_Misc_Tools_HouseStyle_V3_MASTER_PQH.mp4 > FINAL_PACKAGE/MASTER_SHA256.txt
          zip -r Inventor_Misc_Tools_HouseStyle_V3_TOTAL_PACKAGE_20260826.zip FINAL_PACKAGE >/dev/null
          sha256sum Inventor_Misc_Tools_HouseStyle_V3_TOTAL_PACKAGE_20260826.zip > PACKAGE_SHA256.txt

      - name: Upload total package
        uses: actions/upload-artifact@v4
        with:
          name: Inventor_Misc_Tools_HouseStyle_V3_TOTAL_PACKAGE_20260826
          path: |
            render_jobs/inventor_misc_house_style_v3_20260826/Inventor_Misc_Tools_HouseStyle_V3_TOTAL_PACKAGE_20260826.zip
            render_jobs/inventor_misc_house_style_v3_20260826/PACKAGE_SHA256.txt
            render_jobs/inventor_misc_house_style_v3_20260826/FINAL_PACKAGE/
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Inventor_Misc_Tools_HouseStyle_V3_DEBUG_20260826
          path: render_jobs/inventor_misc_house_style_v3_20260826/FINAL_PACKAGE/
          if-no-files-found: warn
          retention-days: 2
