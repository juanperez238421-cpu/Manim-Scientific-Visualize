name: OpenAI Asset Manim PQH 2026-08-16

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-asset-pqh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/openai-asset-pqh-downloadable-20260816-real'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage exact render sources
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/openai_asset_pqh_20260816
          test -s "$JOB/OpenAIAssetInclinedPlane.py.gz.b64"
          test -s "$JOB/jp_classroom_style.py.gz.b64"
          test -s "$JOB/openai_inclined_plane_block.jpg.b64"
          base64 -d "$JOB/OpenAIAssetInclinedPlane.py.gz.b64" | gzip -dc > main.py
          base64 -d "$JOB/jp_classroom_style.py.gz.b64" | gzip -dc > jp_classroom_style.py
          rm -rf assets
          mkdir -p assets/images
          base64 -d "$JOB/openai_inclined_plane_block.jpg.b64" > assets/images/openai_inclined_plane_block.jpg
          python -m py_compile main.py jp_classroom_style.py
          sha256sum main.py jp_classroom_style.py assets/images/openai_inclined_plane_block.jpg | tee SOURCE_SHA256.txt
          grep -q '3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d  jp_classroom_style.py' SOURCE_SHA256.txt
          grep -q 'dd9236789e2e6815c3a2beae8b7636ed8f4ff6ed47b371ed08d012d43b1c7197  assets/images/openai_inclined_plane_block.jpg' SOURCE_SHA256.txt

      - name: Install verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1

      - name: Pull fixed ManimCE runtime
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Preview validation (-pql)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media_preview
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.08 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql main.py OpenAIAssetInclinedPlane --format=mp4 --disable_caching --media_dir media_preview
            ' 2>&1 | tee preview_pql.log
          PREVIEW="$(find media_preview -type f -name 'OpenAIAssetInclinedPlane.mp4' -print -quit)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          ffmpeg -nostdin -v error -i "$PREVIEW" -f null -

      - name: Final literal PQH render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media out
          mkdir -p out
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh main.py OpenAIAssetInclinedPlane --format=mp4 --disable_caching
            ' 2>&1 | tee out/render_pqh.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          FINAL="$(find media -type f -name 'OpenAIAssetInclinedPlane.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/OpenAIAssetInclinedPlane_pqh.mp4
          cp main.py jp_classroom_style.py SOURCE_SHA256.txt out/
          mkdir -p out/assets/images
          cp assets/images/openai_inclined_plane_block.jpg out/assets/images/

      - name: Strict technical verification
        shell: bash
        run: |
          set -euo pipefail
          F=out/OpenAIAssetInclinedPlane_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          awk -v d="$DUR" 'BEGIN { exit !(d > 0) }'
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          sha256sum "$F" > out/VIDEO_SHA256.txt
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > out/VIDEO_TECHNICAL.tsv
          printf 'Scene: OpenAIAssetInclinedPlane\nRuntime: ManimCE 0.20.1\nCommand: manim -pqh main.py OpenAIAssetInclinedPlane --format=mp4 --disable_caching\nResolution: %sx%s\nFPS: %s\nCodec: %s\nPixel format: %s\nDuration: %s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > out/RENDER_INFO.txt

      - name: Extract visual QA frames
        shell: bash
        run: |
          set -euo pipefail
          F=out/OpenAIAssetInclinedPlane_pqh.mp4
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          mkdir -p out/qa_frames
          for P in 0.05 0.25 0.50 0.75 0.95; do
            T="$(awk -v d="$DUR" -v p="$P" 'BEGIN { printf "%.3f", d*p }')"
            NAME="$(printf '%s' "$P" | tr -d '.')"
            ffmpeg -y -v error -ss "$T" -i "$F" -frames:v 1 "out/qa_frames/qa_${NAME}.png"
          done
          test "$(find out/qa_frames -name 'qa_*.png' | wc -l)" -eq 5

      - name: Upload verified delivery
        uses: actions/upload-artifact@v4
        with:
          name: OpenAIAssetInclinedPlane-PQH-VERIFIED
          path: out/
          if-no-files-found: error
          retention-days: 7
