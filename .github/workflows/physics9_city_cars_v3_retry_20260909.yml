name: Physics 9 City Cars V3 Retry PQH 20260909

on:
  push:
    branches:
      - manim/physics9-city-cars-position-velocity-20260908
    paths-ignore:
      - 'published_renders/**'
      - 'render_jobs/physics9_city_cars_20260908/physics9_city_cars_position_velocity_v3.py'

permissions:
  contents: write
  actions: read

jobs:
  render_publish_v3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB: render_jobs/physics9_city_cars_20260908
      SOURCE: physics9_city_cars_position_velocity_v3.py
      SOURCE_BUNDLE: physics9_city_cars_position_velocity_v3.py.gz.b64
      SCENE: Physics9CityCarsV3
      FINAL_NAME: Physics9_City_Cars_Position_Velocity_V3_SENIOR_FINAL_pqh.mp4
      ARTIFACT_NAME: Physics9-City-Cars-Position-Velocity-V3-SENIOR-FINAL-PQH

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate V3 source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d "$JOB/$SOURCE_BUNDLE" | gzip -dc > "$JOB/$SOURCE"
          python -m py_compile "$JOB/$SOURCE"
          grep -q 'class Physics9CityCarsV3' "$JOB/$SOURCE"
          grep -q 'def directional_car' "$JOB/$SOURCE"
          grep -q 'directional_car(RED,-1' "$JOB/$SOURCE"
          grep -q 'ValueTracker' "$JOB/$SOURCE"
          echo 'V3 source reconstruction: PASS'

      - name: Pull ManimCE 0.20.1 container
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Accelerated full-timeline smoke render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media_pql qa_pql && mkdir -p qa_pql
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.08 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              manim -pql $JOB/$SOURCE $SCENE --fps 15 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee qa_pql/render_pql.log
          PREVIEW="$(find media_pql -type f -name "$SCENE.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          cp "$PREVIEW" qa_pql/Physics9_City_Cars_V3_FULL_TIMELINE_QA_pql.mp4

      - name: Render literal PQH V3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media_v3 out && mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              manim -pqh $JOB/$SOURCE $SCENE --fps 30 --format=mp4 --media_dir media_v3 --disable_caching
            " 2>&1 | tee out/render_pqh.log
          FINAL="$(find media_v3 -type f -name "$SCENE.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" "out/$FINAL_NAME"

      - name: Containerized technical QA and visual evidence
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          F="out/$FINAL_NAME"
          probe() {
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
              --entrypoint ffprobe manimcommunity/manim:v0.20.1 "$@"
          }
          W="$(probe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(probe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(probe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(probe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(probe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(probe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          python - <<PY
          d=float('$DUR')
          assert 60 <= d <= 200, f'Unexpected V3 duration: {d}'
          print('duration_pass', d)
          PY
          test "$SIZE" -gt 1000000
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            --entrypoint ffmpeg manimcommunity/manim:v0.20.1 \
            -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          test ! -s out/full_decode.log
          INTERVAL="$(python -c "print(max(float('$DUR')/20.0,1.0))")"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            --entrypoint ffmpeg manimcommunity/manim:v0.20.1 \
            -nostdin -loglevel error -i "$F" \
            -vf "fps=1/$INTERVAL,scale=384:-1,tile=5x4:padding=5:margin=5" \
            -frames:v 1 -q:v 2 out/contact_sheet.jpg
          sha256sum "$F" | tee out/SHA256SUMS.txt
          SHA="$(awk '{print $1}' out/SHA256SUMS.txt)"
          {
            echo "file=$FINAL_NAME"
            echo "width=$W"
            echo "height=$H"
            echo "fps=$FPS"
            echo "codec=$CODEC"
            echo "pix_fmt=$PIX"
            echo "duration=$DUR"
            echo "size_bytes=$SIZE"
            echo "sha256=$SHA"
            echo "full_decode=PASS"
            echo "directional_geometry=V3 mirrored car bodies and explicit motion arrows"
            echo "visual_evidence=5x4 distributed contact sheet"
          } > out/VIDEO_QA_V3.txt
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload V3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            out/${{ env.FINAL_NAME }}
            out/VIDEO_QA_V3.txt
            out/SHA256SUMS.txt
            out/contact_sheet.jpg
            out/full_decode.log
            out/render_pqh.log
            qa_pql/render_pql.log
            qa_pql/Physics9_City_Cars_V3_FULL_TIMELINE_QA_pql.mp4
            ${{ env.JOB }}/${{ env.SOURCE }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish exact V3 MP4 and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published_renders
          cp "out/$FINAL_NAME" "published_renders/$FINAL_NAME"
          cp out/VIDEO_QA_V3.txt published_renders/Physics9_City_Cars_Position_Velocity_V3_QA.txt
          cp out/contact_sheet.jpg published_renders/Physics9_City_Cars_Position_Velocity_V3_contact_sheet.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "published_renders/$FINAL_NAME" \
                  published_renders/Physics9_City_Cars_Position_Velocity_V3_QA.txt \
                  published_renders/Physics9_City_Cars_Position_Velocity_V3_contact_sheet.jpg \
                  "$JOB/$SOURCE"
          git commit -m "Publish Physics 9 city cars V3 PQH [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Verify real GitHub raw download
        shell: bash
        run: |
          set -euo pipefail
          DIRECT="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/${GITHUB_REF_NAME}/published_renders/${FINAL_NAME}"
          curl -L --fail --retry 8 --retry-delay 2 -o /tmp/verified_v3.mp4 "$DIRECT"
          EXPECTED="${{ steps.qa.outputs.sha }}"
          ACTUAL="$(sha256sum /tmp/verified_v3.mp4 | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          echo "DIRECT_URL=$DIRECT"
          echo "SHA256=$ACTUAL"
