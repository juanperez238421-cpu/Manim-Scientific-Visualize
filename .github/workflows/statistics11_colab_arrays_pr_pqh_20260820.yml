# Registry refresh: 2026-08-20 10:40 America/Bogota
name: Statistics 11 Colab Arrays PR PQH 20260820

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    if: github.event.pull_request.head.ref == 'statistics11-colab-arrays-render-20260820' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact render branch
        uses: actions/checkout@v4
        with:
          ref: statistics11-colab-arrays-render-20260820

      - name: Persist STARTED
        shell: bash
        run: |
          set -euo pipefail
          OUT=render_jobs/statistics11_colab_arrays/delivery
          mkdir -p "$OUT"
          printf 'STARTED\n' > "$OUT/STATUS.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT/STATUS.txt"
          git commit -m 'Statistics11 Colab arrays render started' || true
          git push origin HEAD:statistics11-colab-arrays-render-20260820

      - name: Render PQL and PQH, verify, persist delivery
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics11_colab_arrays
          SRC="$JOB/Statistics11_Colab_Arrays_Senior.py"
          OUT="$JOB/delivery"
          rm -rf media_pql media "$OUT/audit_frames"
          mkdir -p "$OUT/audit_frames"
          python -m py_compile "$SRC"
          docker pull manimcommunity/manim:v0.20.1

          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
            set -euo pipefail
            mkdir -p /tmp/manim-bin
            printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
            chmod +x /tmp/manim-bin/xdg-open
            export PATH=/tmp/manim-bin:\$PATH
            manim -pql $SRC Statistics11ColabArrays --format=mp4 --media_dir media_pql --disable_caching
          " 2>&1 | tee "$OUT/render_pql.log"
          P="$(find media_pql -type f -name 'Statistics11ColabArrays.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$P" && test -s "$P"

          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
            set -euo pipefail
            mkdir -p /tmp/manim-bin
            printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
            chmod +x /tmp/manim-bin/xdg-open
            export PATH=/tmp/manim-bin:\$PATH
            manim -pqh $SRC Statistics11ColabArrays --fps 30 --format=mp4 --media_dir media --disable_caching
          " 2>&1 | tee "$OUT/render_pqh.log"
          F="$(find media -type f -name 'Statistics11ColabArrays.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$F" && test -s "$F"
          cp "$F" "$OUT/Statistics11_Colab_Arrays_SENIOR_PQH.mp4"
          cp "$SRC" "$OUT/Statistics11_Colab_Arrays_Senior.py"

          V="$OUT/Statistics11_Colab_Arrays_SENIOR_PQH.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$V")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$V")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$V")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$V")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$V")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$V")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$V")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"
          test "$W" = 1920; test "$H" = 1080; test "$FPS" = 30/1; test "$CODEC" = h264; test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$V" -f null - 2> "$OUT/full_decode.log"
          for PCT in 0.08 0.20 0.32 0.44 0.56 0.68 0.80 0.92; do
            T="$(python -c "print(float('$DUR')*float('$PCT'))")"
            TAG="$(printf '%03d' "$(python -c "print(int(float('$PCT')*100))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$V" -frames:v 1 "$OUT/audit_frames/frame_${TAG}.png"
          done
          ffmpeg -nostdin -loglevel error -i "$V" -vf "fps=1/8,scale=640:-1,tile=4x3:padding=6:margin=8" -frames:v 1 "$OUT/QA_CONTACT_SHEET.jpg" || true
          sha256sum "$V" "$SRC" > "$OUT/SHA256SUMS.txt"
          cat > "$OUT/RENDER_INFO.txt" <<'EOF'
Scene: Statistics11ColabArrays
Topic: Statistics 11 — Google Colab arrays
ManimCE: 0.20.1
Preview: literal -pql
Final: literal -pqh, 1920x1080, 30 fps, H.264/yuv420p
Style: JP Classroom monochrome 16:9, white background, black text, structured section headers, safe margins
Content: array meaning; list vs ndarray; shape/dtype/size; positive and negative indexing; slicing; 2D row/column indexing; descriptive statistics; population vs sample standard deviation; Boolean filtering; final workflow
QA: py_compile + PQL + PQH + ffprobe + full decode + audit frames + contact sheet + SHA-256
EOF
          printf 'SUCCESS\n' > "$OUT/STATUS.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'Render Statistics 11 Colab arrays verified PQH delivery'
          git push origin HEAD:statistics11-colab-arrays-render-20260820

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11-Colab-Arrays-PQH-20260820
          path: render_jobs/statistics11_colab_arrays/delivery/
          if-no-files-found: error
          retention-days: 30
