name: History of Velocity V5 Final PQH

on:
  push:
    branches: [agent/history-of-velocity-pqh-20260816]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact sources and validate V5
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/history_velocity_20260816
          cat "$JOB"/h_*.b64 | base64 -d | gzip -dc > "$JOB/history_of_velocity.py"
          cat "$JOB"/s_*.b64 | base64 -d | gzip -dc > "$JOB/jp_classroom_style.py"
          if [ -f "$JOB/apply_v3_final_layout_patch.py" ]; then
            (cd "$JOB" && python apply_v3_final_layout_patch.py history_of_velocity.py)
          fi
          cp "$JOB/history_of_velocity.py" "$JOB/history_of_velocity_FINAL_V3.py"
          python -m py_compile "$JOB/history_of_velocity_FINAL_V3.py" "$JOB/history_of_velocity_FINAL_V4.py" "$JOB/history_of_velocity_FINAL_V5.py" "$JOB/jp_classroom_style.py"

      - name: Install render tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Accelerated full-timeline PQL runtime QA
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/history_velocity_20260816
          rm -rf media_pql qa && mkdir -p qa
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.15 \
            -v "$PWD:/manim" -w "/manim/$JOB" --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql history_of_velocity_FINAL_V5.py HistoryOfVelocityV5 --fps 15 --format=mp4 --media_dir /manim/media_pql --disable_caching
            ' 2>&1 | tee qa/render_pql.log
          P="$(find media_pql -type f -name 'HistoryOfVelocityV5.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$P" && test -s "$P"

      - name: Literal PQH final V5 render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/history_velocity_20260816
          rm -rf media out && mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.65 \
            -v "$PWD:/manim" -w "/manim/$JOB" --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh history_of_velocity_FINAL_V5.py HistoryOfVelocityV5 --fps 30 --format=mp4 --media_dir /manim/media --disable_caching
            ' 2>&1 | tee out/render_pqh.log
          F="$(find media -type f -name 'HistoryOfVelocityV5.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$F" && test -s "$F"
          cp "$F" out/HistoryOfVelocity_Senior_FINAL_V5_pqh.mp4

      - name: Strict technical and motion audit
        shell: bash
        run: |
          set -euo pipefail
          F=out/HistoryOfVelocity_Senior_FINAL_V5_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          C="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          P="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          D="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$C" "$P" "$D" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$C" = h264
          test "$P" = yuv420p
          python - <<'PY'
          d=float(open('out/VIDEO_TECHNICAL.tsv').read().splitlines()[1].split('\t')[-1])
          assert 450 <= d <= 600, f'V5 duration outside 7:30–10:00 target: {d}'
          PY
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          ffmpeg -nostdin -hide_banner -i "$F" -vf 'freezedetect=n=0.002:d=1.2' -an -f null - 2> out/freezedetect.log || true
          python - <<'PY'
          import re
          txt=open('out/freezedetect.log',errors='ignore').read()
          ds=[float(x) for x in re.findall(r'freeze_duration: ([0-9.]+)',txt)]
          d=float(open('out/VIDEO_TECHNICAL.tsv').read().splitlines()[1].split('\t')[-1])
          f=sum(ds); longest=max(ds) if ds else 0.0
          open('out/MOTION_AUDIT.tsv','w').write(
              'duration\tfrozen_ge_1p2s\tfrozen_ratio\tfreeze_intervals\tlongest_freeze\n'
              f'{d:.3f}\t{f:.3f}\t{f/d:.4f}\t{len(ds)}\t{longest:.3f}\n')
          print('motion_audit',d,f,f/d,longest)
          PY
          mkdir -p out/audit_frames
          ffmpeg -nostdin -hide_banner -loglevel error -i "$F" -vf 'fps=1/3,scale=960:-2' -q:v 4 out/audit_frames/%04d.jpg
          sha256sum "$F" > out/SHA256SUMS.txt
          cp qa/render_pql.log out/

      - name: Package V5 verified delivery
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/history_velocity_20260816
          cp "$JOB/history_of_velocity_FINAL_V5.py" "$JOB/history_of_velocity_FINAL_V4.py" "$JOB/history_of_velocity_FINAL_V3.py" "$JOB/jp_classroom_style.py" out/
          printf 'History of Velocity Senior V5\nManimCE 0.20.1\nFinal render: literal -pqh, 1920x1080, 30fps\nLESSON_TIME_SCALE=1.65\nAudit: full decode + freezedetect + frames every 3 s\nV5 changes: Zeno rebuild; Newton-Leibniz band separation; x-v-a frame-safe labels; larger vector scene; Einstein/Minkowski separation; final-discussion collision fix; animated reflection beats.\n' > out/RENDER_INFO.txt
          cd out
          zip -9 -r HistoryOfVelocity_Senior_FINAL_V5_PQH_Package.zip \
            HistoryOfVelocity_Senior_FINAL_V5_pqh.mp4 history_of_velocity_FINAL_V5.py history_of_velocity_FINAL_V4.py history_of_velocity_FINAL_V3.py jp_classroom_style.py \
            VIDEO_TECHNICAL.tsv MOTION_AUDIT.tsv SHA256SUMS.txt RENDER_INFO.txt render_pqh.log render_pql.log full_decode.log freezedetect.log audit_frames/

      - uses: actions/upload-artifact@v4
        with:
          name: HistoryOfVelocity-Senior-FINAL-V5-PQH
          path: out/
          if-no-files-found: error
          retention-days: 7
