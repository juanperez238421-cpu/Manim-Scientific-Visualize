name: Physics9 Vertical FreeFall Theory V2 Motion First PQH

on:
  pull_request:
    branches:
      - main
    paths:
      - render_jobs/physics9_vertical_freefall_theory_v2_motion_first_20260929/physics9_vertical_freefall_theory_v2_motion_first.py
      - .github/workflows/physics9_vertical_freefall_theory_v2_motion_first_pqh.yml

  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render and QA motion-first vertical/free-fall theory
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: physics9-vertical-freefall-theory-v2-motion-first-20260929
          fetch-depth: 0

      - name: Static physics and source gate
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/physics9_vertical_freefall_theory_v2_motion_first_20260929/physics9_vertical_freefall_theory_v2_motion_first.py
          python -m py_compile "$SRC"
          grep -q "class Physics9VerticalFreeFallTheoryV2" "$SRC"
          grep -q "verify_physics" "$SRC"
          grep -q "d\\propto t\^2" "$SRC" || true
          grep -q "g=2m" "$SRC"
          grep -q "MovingCameraScene" "$SRC"
          grep -q "always_redraw" "$SRC"

      - name: Prepare ManimCE and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Full-timeline PQL runtime gate
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/physics9_vertical_freefall_theory_v2_motion_first_20260929/physics9_vertical_freefall_theory_v2_motion_first.py
          SCENE=Physics9VerticalFreeFallTheoryV2
          rm -rf media_pql qa_smoke
          mkdir -p qa_smoke
          docker run --rm             --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -e LESSON_TIME_SCALE=0.06             -v "$PWD:/manim" -w /manim             --entrypoint bash manimcommunity/manim:v0.20.1             -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pql $SRC $SCENE --fps 15 --format=mp4 --media_dir media_pql --disable_caching"             2>&1 | tee qa_smoke/pql.log
          PQL="$(find media_pql -type f -name "$SCENE.mp4" | head -1)"
          test -n "$PQL"
          test -s "$PQL"

      - name: Literal PQH 1080p final render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/physics9_vertical_freefall_theory_v2_motion_first_20260929/physics9_vertical_freefall_theory_v2_motion_first.py
          SCENE=Physics9VerticalFreeFallTheoryV2
          OUT=deliveries/physics9/vertical_freefall_theory_v2_motion_first_20260929
          rm -rf media_final "$OUT"
          mkdir -p "$OUT"

          docker run --rm             --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -e LESSON_TIME_SCALE=1.0             -v "$PWD:/manim" -w /manim             --entrypoint bash manimcommunity/manim:v0.20.1             -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pqh $SRC $SCENE --fps 30 --format=mp4 --media_dir media_final --disable_caching"             2>&1 | tee "$OUT/pqh.log"

          FINAL="$(find media_final -type f -name "$SCENE.mp4" | head -1)"
          test -n "$FINAL"
          test -s "$FINAL"

          ffmpeg -y -v error -i "$FINAL"             -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -r 30             -movflags +faststart -an             "$OUT/Physics9_VerticalMotion_FreeFall_THEORY_V2_MOTION_FIRST_FULL_FINAL_pqh.mp4"

          cp "$SRC" "$OUT/Physics9_VerticalMotion_FreeFall_THEORY_V2_source.py"

      - name: Technical and visual QA
        shell: bash
        run: |
          set -euo pipefail
          OUT=deliveries/physics9/vertical_freefall_theory_v2_motion_first_20260929
          F="$OUT/Physics9_VerticalMotion_FreeFall_THEORY_V2_MOTION_FIRST_FULL_FINAL_pqh.mp4"

          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"

          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration_s\tsize_bytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n'             "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"

          test "$W" = "1920"
          test "$H" = "1080"
          test "$FPS" = "30/1"
          test "$CODEC" = "h264"
          test "$PIX" = "yuv420p"
          awk -v d="$DUR" 'BEGIN { exit !(d > 120) }'
          test "$SIZE" -gt 1500000

          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/full_decode.log"

          mkdir -p "$OUT/qa_frames"
          i=0
          for FRC in 0.02 0.06 0.10 0.14 0.18 0.22 0.26 0.30 0.34 0.38 0.42 0.46 0.50 0.54 0.58 0.62 0.66 0.70 0.74 0.78 0.82 0.86 0.90 0.94 0.98; do
            T="$(awk -v d="$DUR" -v f="$FRC" 'BEGIN{printf "%.3f",d*f}')"
            printf -v TAG "%02d" "$i"
            ffmpeg -y -ss "$T" -i "$F" -frames:v 1 "$OUT/qa_frames/frame_$TAG.png" >/dev/null 2>&1
            i=$((i+1))
          done

          ffmpeg -y -pattern_type glob -i "$OUT/qa_frames/frame_*.png"             -vf 'scale=384:-1,tile=5x5:padding=7:margin=7:color=black'             -frames:v 1 "$OUT/Physics9_VerticalMotion_FreeFall_THEORY_V2_QA_CONTACT_SHEET_25.png" >/dev/null 2>&1

          sha256sum "$F" > "$OUT/SHA256SUMS.txt"
          cp qa_smoke/pql.log "$OUT/pql.log"

          {
            echo "# Physics 9 — Vertical Motion + Free Fall THEORY V2 MOTION-FIRST"
            echo
            echo "- ManimCE: 0.20.1"
            echo "- Resolution: $W x $H"
            echo "- FPS: $FPS"
            echo "- Codec: $CODEC"
            echo "- Pixel format: $PIX"
            echo "- Duration: $DUR s"
            echo "- Bytes: $SIZE"
            echo "- Full sequential decode: PASS"
            echo "- PQL runtime gate: PASS"
            echo "- PQH final render: PASS"
            echo
            echo "Animation upgrades:"
            echo "- continuous object motion and live vectors"
            echo "- camera zoom at apex"
            echo "- live physics HUDs"
            echo "- transform-based derivation chain"
            echo "- simultaneous three-case motion"
            echo "- synchronized object + y(t) + v(t) + a(t)"
            echo "- true quadratic 20 m drop"
            echo "- equal-time stroboscopic free-fall sequence"
            echo "- 1:3:5:7 interval growth and 1:4:9:16 cumulative-distance logic"
            echo "- animated d-vs-t to d-vs-t^2 linearization"
            echo "- explicit laboratory pipeline"
          } > "$OUT/QA_REPORT.md"

      - name: Persist validated V2 delivery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliveries/physics9/vertical_freefall_theory_v2_motion_first_20260929
          if ! git diff --cached --quiet; then
            git commit -m "render: publish Physics9 vertical/free-fall theory V2 motion-first [skip ci]"
            git pull --rebase origin physics9-vertical-freefall-theory-v2-motion-first-20260929
            git push origin HEAD:physics9-vertical-freefall-theory-v2-motion-first-20260929
          fi

      - name: Upload complete V2 QA package
        uses: actions/upload-artifact@v4
        with:
          name: Physics9-Vertical-FreeFall-Theory-V2-Motion-First
          path: deliveries/physics9/vertical_freefall_theory_v2_motion_first_20260929
          if-no-files-found: error
