name: Bootstrap Geometry 8 Week 2 Render

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render/geometry8-week2-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4

      - name: Install FFmpeg verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Recover Week 2 source package
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_week2_20260809
          mkdir -p "$JOB/project"
          cat "$JOB/payload.part00" "$JOB/payload.part01" > /tmp/week2_payload.b64
          test "$(wc -c < /tmp/week2_payload.b64)" -eq 22908
          base64 -d /tmp/week2_payload.b64 > /tmp/week2_payload.tar.gz
          tar -xzf /tmp/week2_payload.tar.gz -C "$JOB/project"
          find "$JOB/project" -maxdepth 2 -type f -print

      - name: Validate Python sources
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_week2_20260809/project
          python -m py_compile \
            "$JOB/geometry8_period3_week2_class1_concepts.py" \
            "$JOB/geometry8_period3_week2_class2_exercises.py" \
            "$JOB/jp_classroom_style.py"
          ! grep -nE '([A-Za-z]:\\\\|/Users/|/home/[^/]+/Desktop)' "$JOB"/*.py

      - name: Pull official ManimCE 0.20.1 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Render PQL then literal PQH
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          JOB=render_jobs/geometry8_week2_20260809/project
          IMAGE=manimcommunity/manim:v0.20.1
          rm -rf delivery_geometry8_week2 qa_geometry8_week2 media
          mkdir -p delivery_geometry8_week2 qa_geometry8_week2

          ENTRIES=(
            'geometry8_period3_week2_class1_concepts.py|Geometry8Week2Concepts|week2_class1_concepts'
            'geometry8_period3_week2_class2_exercises.py|Geometry8Week2Exercises|week2_class2_exercises'
          )

          for ENTRY in "${ENTRIES[@]}"; do
            IFS='|' read -r FILE SCENE SLUG <<< "$ENTRY"
            mkdir -p "delivery_geometry8_week2/$SLUG" "qa_geometry8_week2/$SLUG"

            echo "===== $SLUG PREVIEW -pql ====="
            set +e
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/manim-home \
              -e LESSON_TIME_SCALE=0.12 \
              -e JOB="$JOB" -e FILE="$FILE" -e SCENE="$SCENE" \
              -v "$PWD:/manim" -w /manim \
              --entrypoint bash "$IMAGE" \
              -c '
                set -euo pipefail
                mkdir -p /tmp/manim-bin
                printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
                chmod +x /tmp/manim-bin/xdg-open
                export PATH="/tmp/manim-bin:$PATH"
                manim -pql "$JOB/$FILE" "$SCENE" --format=mp4 --disable_caching
              ' 2>&1 | tee "delivery_geometry8_week2/$SLUG/render_pql.log"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -ne 0 ]; then
              echo "PQL render failed for $SLUG" >&2
              exit "$STATUS"
            fi
            PREVIEW="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            test -n "$PREVIEW" && test -s "$PREVIEW"
            cp "$PREVIEW" "delivery_geometry8_week2/$SLUG/${SLUG}_pql.mp4"

            echo "===== $SLUG FINAL literal -pqh ====="
            set +e
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/manim-home \
              -e LESSON_TIME_SCALE=1.0 \
              -e JOB="$JOB" -e FILE="$FILE" -e SCENE="$SCENE" \
              -v "$PWD:/manim" -w /manim \
              --entrypoint bash "$IMAGE" \
              -c '
                set -euo pipefail
                mkdir -p /tmp/manim-bin
                printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
                chmod +x /tmp/manim-bin/xdg-open
                export PATH="/tmp/manim-bin:$PATH"
                manim -pqh "$JOB/$FILE" "$SCENE" --format=mp4 --disable_caching
              ' 2>&1 | tee "delivery_geometry8_week2/$SLUG/render_pqh.log"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -ne 0 ]; then
              echo "PQH render failed for $SLUG" >&2
              exit "$STATUS"
            fi

            FINAL="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            test -n "$FINAL" && test -s "$FINAL"
            cp "$FINAL" "delivery_geometry8_week2/$SLUG/${SLUG}_pqh.mp4"
            cp "$JOB/$FILE" "delivery_geometry8_week2/$SLUG/"
            cp "$JOB/jp_classroom_style.py" "delivery_geometry8_week2/$SLUG/"

            OUT="delivery_geometry8_week2/$SLUG/${SLUG}_pqh.mp4"
            ffprobe -v error \
              -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 "$OUT" \
              > "delivery_geometry8_week2/$SLUG/ffprobe.txt"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$OUT")" = 1920
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT")" = 1080
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$OUT")" = 30/1
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$OUT")" = h264

            ffmpeg -nostdin -v error -i "$OUT" -f null - 2> "delivery_geometry8_week2/$SLUG/full_decode.log"
            DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT")"
            SAMPLE="$(python -c "d=float('$DUR'); print(max(0.001,12.0/max(d,0.001)))")"
            ffmpeg -nostdin -y -v error -i "$OUT" \
              -vf "fps=$SAMPLE,scale=480:-1,tile=4x3:padding=8:margin=8" \
              -frames:v 1 "qa_geometry8_week2/$SLUG/contact_sheet.jpg" || true
            sha256sum "$OUT" > "delivery_geometry8_week2/$SLUG/SHA256SUMS.txt"

            printf 'Scene: %s\nSource: %s\nManimCE: 0.20.1\nPreview: manim -pql %s %s --format=mp4 --disable_caching\nFinal: manim -pqh %s %s --format=mp4 --disable_caching\n' \
              "$SCENE" "$FILE" "$FILE" "$SCENE" "$FILE" "$SCENE" \
              > "delivery_geometry8_week2/$SLUG/RENDER_INFO.txt"
          done

          sha256sum delivery_geometry8_week2/*/*_pqh.mp4 > delivery_geometry8_week2/ALL_FINAL_VIDEOS_SHA256.txt

      - name: Upload package and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Geometry8_Period3_Week2_ManimCE_PQH
          path: |
            delivery_geometry8_week2/
            qa_geometry8_week2/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve failure status
        if: steps.render.outcome != 'success'
        shell: bash
        run: exit 1
