name: Render HTML GitHub CSS Masterclasses V5

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "vscode_html_tutorial/**"
      - ".github/workflows/render_html_github_css_masterclasses_v5.yml"

permissions:
  contents: read

jobs:
  render-masterclass:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: "01"
            scene: VisualHTMLBasicsV5
          - index: "02"
            scene: GitHubImprovedV5
          - index: "03"
            scene: CSSHTMLVisualInterfaceV5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and validate source syntax
        shell: bash
        run: |
          set -euo pipefail
          python vscode_html_tutorial/build_source.py
          python -m py_compile vscode_html_tutorial/vscode_html_tutorial.py
          python -m py_compile vscode_html_tutorial/masterclass_v4.py
          python -m py_compile vscode_html_tutorial/masterclass_v5.py

      - name: Pull pinned ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Native PQL test and literal PQH render
        shell: bash
        env:
          SCENE: ${{ matrix.scene }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e SCENE="$SCENE" \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/vscode-bin /tmp/manim-home
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/vscode-bin/xdg-open
              chmod +x /tmp/vscode-bin/xdg-open
              export PATH="/tmp/vscode-bin:$PATH"
              python vscode_html_tutorial/build_source.py
              SOURCE="vscode_html_tutorial/masterclass_v5.py"
              manim -pql "$SOURCE" "$SCENE" --format=mp4 --disable_caching
              manim -pqh "$SOURCE" "$SCENE" --format=mp4 --disable_caching
            ' 2>&1 | tee "${SCENE}_render.log"

      - name: Stage and fully decode rendered masterclass
        shell: bash
        env:
          SCENE: ${{ matrix.scene }}
          INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          mkdir -p scene_delivery
          input="$(find media -type f -name "${SCENE}.mp4" ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$input"
          test -s "$input"
          output="scene_delivery/${INDEX}_${SCENE}_pqh.mp4"
          cp "$input" "$output"
          docker run --rm \
            -e OUTPUT="$output" \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint python \
            manimcommunity/manim:v0.20.1 \
            -c 'import av, os; p=os.environ["OUTPUT"]; c=av.open(p); ss=[s for s in c.streams if s.type=="video"]; assert len(ss)==1, len(ss); s=ss[0]; codec=s.codec_context.name; width=s.codec_context.width; height=s.codec_context.height; rate=s.average_rate; fps=float(rate) if rate is not None else 0.0; pix=s.codec_context.format.name if s.codec_context.format else "unknown"; duration=float(c.duration/av.time_base) if c.duration is not None else 0.0; frames=sum(1 for _ in c.decode(video=0)); assert codec=="h264", codec; assert (width,height)==(1920,1080), (width,height); assert abs(fps-30.0)<=0.05, fps; assert duration>=300.0, duration; assert frames>0, frames; print(f"file={p}\ncodec_name={codec}\nwidth={width}\nheight={height}\nr_frame_rate={rate}\nfps={fps}\npix_fmt={pix}\nduration={duration}\nsize={os.path.getsize(p)}\ndecoded_frames={frames}\nfull_decode=success")' \
            | tee "scene_delivery/${INDEX}_${SCENE}_verification.txt"
          cp "${SCENE}_render.log" scene_delivery/

      - name: Upload verified masterclass
        uses: actions/upload-artifact@v4
        with:
          name: v5-${{ matrix.index }}-${{ matrix.scene }}
          path: scene_delivery/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: render-masterclass
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble exact source
        shell: bash
        run: |
          set -euo pipefail
          python vscode_html_tutorial/build_source.py
          python -m py_compile vscode_html_tutorial/masterclass_v5.py

      - name: Download verified masterclasses
        uses: actions/download-artifact@v4
        with:
          pattern: v5-*
          path: delivery
          merge-multiple: true

      - name: Complete native delivery package
        shell: bash
        run: |
          set -euo pipefail
          test "$(find delivery -maxdepth 1 -name '*_pqh.mp4' | wc -l)" -eq 3
          cp vscode_html_tutorial/masterclass_v5.py delivery/
          cp -R vscode_html_tutorial/masterclass_v5_parts delivery/
          sha256sum delivery/* > delivery/SHA256SUMS_NATIVE.txt

      - name: Upload complete native package
        uses: actions/upload-artifact@v4
        with:
          name: HTML-GitHub-CSS-Masterclasses-V5-Native-PQH
          path: delivery/
          if-no-files-found: error
          retention-days: 7
