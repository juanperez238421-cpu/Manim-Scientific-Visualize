name: Inventor Thread Profile PRO V2 PQH 20260930

on:
  push:
    branches:
      - render/inventor-thread-profile-pro-v2-pqh-20260930

permissions:
  contents: write

env:
  BASE_JOB: render_jobs/inventor_dedicated_20260826
  JOB_ROOT: render_jobs/inventor_thread_profile_20260930
  MANIM_IMAGE: manimcommunity/manim:v0.20.1
  SCENE_FILE: thread_profile_coil_triangle_pro_v2.py
  SCENE_NAME: InventorThreadProfileTriangleProV2
  OUTPUT_NAME: Inventor_Thread_Profile_PRO_V2_FINAL_PQH.mp4
  PUBLISHED_PATH: published_renders/Inventor_Thread_Profile_PRO_V2_FINAL_PQH.mp4

concurrency:
  group: inventor-thread-profile-pro-v2-pqh-20260930
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout exact render branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Static Python and lesson-contract QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            "$BASE_JOB/library/inventor_pro_ui.py" \
            "$JOB_ROOT/thread_profile_coil_triangle_senior.py" \
            "$JOB_ROOT/$SCENE_FILE"
          grep -q 'class InventorThreadProfileTriangleProV2' "$JOB_ROOT/$SCENE_FILE"
          grep -q 'PERFIL TRIANGULAR PARA COIL' "$JOB_ROOT/$SCENE_FILE"
          grep -q 'EDICIÓN PARAMÉTRICA' "$JOB_ROOT/$SCENE_FILE"
          grep -q 'SECTION A–A' "$JOB_ROOT/$SCENE_FILE"
          grep -q 'AXIAL VIEW' "$JOB_ROOT/$SCENE_FILE"
          grep -q 'LaggedStart' "$JOB_ROOT/$SCENE_FILE"

      - name: Prepare ManimCE 0.20.1 and QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip >/dev/null
          docker pull "$MANIM_IMAGE" >/dev/null
          ffprobe -version | head -1

      - name: Literal PQL smoke render with accelerated timing
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          rm -rf media_pql media_v2 delivery_v2
          mkdir -p delivery_v2/logs delivery_v2/qa/audit_frames delivery_v2/final delivery_v2/source
          chmod -R a+rwX .

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.10 \
            -e PYTHONPATH="/manim/$BASE_JOB:/manim/$JOB_ROOT" \
            -v "$GITHUB_WORKSPACE:/manim" \
            -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql '$SCENE_FILE' '$SCENE_NAME' \
                --fps 15 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee delivery_v2/logs/render_pql.log

          PREVIEW="$(find media_pql -type f -name "${SCENE_NAME}.mp4" ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          cp "$PREVIEW" delivery_v2/qa/Inventor_Thread_Profile_PRO_V2_QA_PQL.mp4

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -e PYTHONPATH="/manim/$BASE_JOB:/manim/$JOB_ROOT" \
            -v "$GITHUB_WORKSPACE:/manim" \
            -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh '$SCENE_FILE' '$SCENE_NAME' \
                --fps 30 --format=mp4 --media_dir media_v2 --disable_caching
            " 2>&1 | tee delivery_v2/logs/render_pqh.log

          FINAL="$(find media_v2 -type f -name "${SCENE_NAME}.mp4" ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" "delivery_v2/final/$OUTPUT_NAME"
          cp "$SCENE_FILE" delivery_v2/source/
          cp thread_profile_coil_triangle_senior.py delivery_v2/source/
          cp "$BASE_JOB/library/inventor_pro_ui.py" delivery_v2/source/

      - name: Senior technical QA and dense visual frame audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          F="delivery_v2/final/$OUTPUT_NAME"
          OUT="delivery_v2/qa"

          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F" | tr -d '[:space:]')"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F" | tr -d '[:space:]')"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F" | tr -d '[:space:]')"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F" | tr -d '[:space:]')"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F" | tr -d '[:space:]')"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F" | tr -d '[:space:]')"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F" | tr -d '[:space:]')"

          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"

          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p

          python - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert 70 <= d <= 170, f"Unexpected V2 lesson duration: {d}"
          print("duration QA PASS", d)
          PY

          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/full_decode.log"
          test ! -s "$OUT/full_decode.log"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of json "$F" > "$OUT/VIDEO_TECHNICAL.json"

          for P in 0.025 0.075 0.125 0.175 0.225 0.275 0.325 0.375 0.425 0.475 0.525 0.575 0.625 0.675 0.725 0.775 0.825 0.875 0.925 0.975; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -y -v error -ss "$T" -i "$F" -frames:v 1 "$OUT/audit_frames/frame_${TAG}.png"
          done

          ffmpeg -nostdin -y -v error \
            -pattern_type glob -i "$OUT/audit_frames/frame_*.png" \
            -vf "scale=480:-1,tile=5x4" -frames:v 1 "$OUT/QA_CONTACT_SHEET.jpg"

          sha256sum "$F" delivery_v2/source/*.py > "$OUT/SHA256SUMS.txt"
          cat > "$OUT/QA_AUTOMATED_REPORT.txt" <<EOF
          INVENTOR THREAD PROFILE PRO V2 — QA PASS
          ManimCE: 0.20.1
          Protocol: py_compile -> literal -pql -> literal -pqh -> ffprobe -> full decode -> 20-frame audit
          Resolution: $W x $H
          Frame rate: $FPS
          Codec: $CODEC
          Pixel format: $PIX
          Duration: $DUR s
          Full FFmpeg decode: PASS
          Interface refinements:
          - professional title/tabs/ribbon
          - dynamic active-tool highlight
          - dynamic model-browser selection
          - Coil property panel with animated fields
          - view cube + nav bar + status bar
          - six-stage progress navigator
          Motion refinements:
          - animated parameter acquisition
          - radial-depth construction
          - drafting-grid sketch build
          - flank-by-flank triangle construction
          - pitch duplication
          - helix trace
          - progressive profile slices
          - sweep preview
          - section and axial validation
          - parametric pitch edit
          EOF

      - name: Build V2 full delivery package
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          cat > delivery_v2/README_DELIVERY.md <<'EOF'
          # Inventor Thread Profile / Coil — Professional V2

          V2 refines the established CAD format rather than replacing it.

          Main changes:
          - more faithful professional Inventor-style interface;
          - shorter and more readable instructional text;
          - dynamic active tool, feature-tree, property fields, status, and stage navigator;
          - substantially more geometry animation;
          - explicit distinction between pitch P and triangle base b;
          - section, axial, isometric, and parametric-edit validation;
          - 20-frame visual audit plus full decode.

          Core geometry:
          h = (Dmajor - Dminor)/2
          b = 2 h tan(30 deg)
          P controls helical axial repetition.
          EOF
          rm -f Inventor_Thread_Profile_PRO_V2_FINAL_PQH_PACKAGE.zip
          zip -9 -r Inventor_Thread_Profile_PRO_V2_FINAL_PQH_PACKAGE.zip delivery_v2 >/dev/null

      - name: Publish QA-approved V2 MP4 and canonical source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PUBLISHED_PATH")"
          cp "$JOB_ROOT/delivery_v2/final/$OUTPUT_NAME" "$PUBLISHED_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PUBLISHED_PATH" "$JOB_ROOT/$SCENE_FILE"
          if git diff --cached --quiet; then
            echo "Nothing new to publish"
          else
            git commit -m "Publish validated Inventor thread-profile PRO V2 render [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Upload verified V2 package
        uses: actions/upload-artifact@v4
        with:
          name: Inventor-Thread-Profile-PRO-V2-FINAL-PQH
          path: |
            ${{ env.JOB_ROOT }}/delivery_v2
            ${{ env.JOB_ROOT }}/Inventor_Thread_Profile_PRO_V2_FINAL_PQH_PACKAGE.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
