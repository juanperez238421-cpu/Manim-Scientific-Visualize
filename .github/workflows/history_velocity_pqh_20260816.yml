name: House Extrusion 3D Verified PQH 20260818

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'runner-house-extrusion-20260818-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact house source, patch facade axis, and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p job out qa_out
          curl -fsSL 'https://raw.githubusercontent.com/juanperez238421-cpu/Manim-Scientific-Visualize/render-house-extrusion-20260818/render_jobs/house_extrusion/House_Extrusion_3D_ManimCE.py' -o job/House_Extrusion_3D_ManimCE.py
          sed -i 's/door_cutter.shift(IN \* 0.75)/door_cutter.shift(DOWN * 0.75)/' job/House_Extrusion_3D_ManimCE.py
          sed -i 's/door_cutter.animate.shift(OUT \* 0.75)/door_cutter.animate.shift(UP * 0.75)/' job/House_Extrusion_3D_ManimCE.py
          sed -i 's/win_cutter.shift(IN \* 0.75)/win_cutter.shift(DOWN * 0.75)/' job/House_Extrusion_3D_ManimCE.py
          sed -i 's/win_cutter.animate.shift(OUT \* 0.75)/win_cutter.animate.shift(UP * 0.75)/' job/House_Extrusion_3D_ManimCE.py
          python -m py_compile job/House_Extrusion_3D_ManimCE.py
          grep -n 'cutter.shift\|cutter.animate' job/House_Extrusion_3D_ManimCE.py | tee out/AXIS_QA.txt

      - name: Install verification tools and ManimCE 0.20.1 image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL runtime QA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql job/House_Extrusion_3D_ManimCE.py HouseExtrusion3D \
                --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee qa_out/render_pql.log
          PREVIEW="$(find media_pql -type f -name 'HouseExtrusion3D.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          cp "$PREVIEW" qa_out/HouseExtrusion3D_QA_pql.mp4

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh job/House_Extrusion_3D_ManimCE.py HouseExtrusion3D \
                --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee out/render_pqh.log
          FINAL="$(find media -type f -name 'HouseExtrusion3D.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/House_Extrusion_3D_PQH.mp4
          cp job/House_Extrusion_3D_ManimCE.py out/
          cp qa_out/render_pql.log out/

      - name: Strict technical verification and dense audit frames
        shell: bash
        run: |
          set -euo pipefail
          F=out/House_Extrusion_3D_PQH.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          mkdir -p out/audit_frames
          for P in 0.03 0.10 0.18 0.28 0.38 0.48 0.58 0.68 0.78 0.88 0.96; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_${TAG}.png"
          done
          sha256sum "$F" out/House_Extrusion_3D_ManimCE.py > out/SHA256SUMS.txt
          cat > out/RENDER_INFO.txt <<'EOF'
Scene: HouseExtrusion3D
ManimCE: 0.20.1
Preview: literal -pql
Final: literal -pqh
Output target: 1920x1080, 30 fps, H.264, yuv420p
Sequence: terrain -> 2D plan -> positive slab -> positive columns -> positive walls -> negative door cut -> negative window cut -> positive roof -> camera orbit.
QA: py_compile + PQL runtime + PQH + ffprobe + full FFmpeg decode + 11 audit frames + SHA-256
EOF

      - name: Package verified delivery
        shell: bash
        run: |
          set -euo pipefail
          cd out
          zip -9 -r House_Extrusion_3D_PQH_Package.zip \
            House_Extrusion_3D_PQH.mp4 House_Extrusion_3D_ManimCE.py VIDEO_TECHNICAL.tsv \
            SHA256SUMS.txt RENDER_INFO.txt AXIS_QA.txt render_pql.log render_pqh.log full_decode.log audit_frames/

      - uses: actions/upload-artifact@v4
        with:
          name: House-Extrusion-3D-PQH-20260818-FINAL
          path: |
            out/House_Extrusion_3D_PQH.mp4
            out/House_Extrusion_3D_PQH_Package.zip
            out/House_Extrusion_3D_ManimCE.py
            out/VIDEO_TECHNICAL.tsv
            out/SHA256SUMS.txt
            out/RENDER_INFO.txt
            out/AXIS_QA.txt
            out/audit_frames/
          if-no-files-found: error
          retention-days: 7
