name: Statistics10 IQR Class02 Compare Boxplots FINAL PQH 20260831

on:
  push:
    branches:
      - render/statistics10-iqr-class02-compare-boxplots-20260831
    paths:
      - 'render_jobs/statistics10_iqr_class02_compare_boxplots_20260831/**'
      - '.github/workflows/statistics10_iqr_class02_compare_boxplots_pqh_20260831.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout exact render branch
        uses: actions/checkout@v4
        with:
          ref: render/statistics10-iqr-class02-compare-boxplots-20260831

      - name: Reconstruct exact lesson sources from committed bootstrap payloads
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics10_iqr_class02_compare_boxplots_20260831
          python "$JOB/bootstrap/decode_payloads.py" "$JOB"
          test -s "$JOB/Statistics10_IQR_Class02_Compare_Boxplots_FINAL.py"
          test -s "$JOB/jp_classroom_style.py"

      - name: Validate source audit, scene contract and style architecture
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics10_iqr_class02_compare_boxplots_20260831
          SRC="$JOB/Statistics10_IQR_Class02_Compare_Boxplots_FINAL.py"
          STYLE="$JOB/jp_classroom_style.py"
          CHECK="$JOB/check_manim_style.py"
          STORY="$JOB/STORYBOARD.md"
          AUDIT="$JOB/SOURCE_AUDIT_CLASS1.md"
          PROTOCOL="$JOB/RENDER_PROTOCOL.md"
          PDF_BUILDER="$JOB/build_presentation_pdf.py"

          for f in "$SRC" "$STYLE" "$CHECK" "$STORY" "$AUDIT" "$PROTOCOL" "$PDF_BUILDER"; do
            test -s "$f"
          done
          python -m py_compile "$SRC" "$STYLE" "$CHECK" "$PDF_BUILDER"
          python "$CHECK" "$SRC" | tee static_style_qa.txt

          grep -q '^class Statistics10IQRClass02CompareBoxplotsFinal' "$SRC"
          grep -q '^def quartiles_class1' "$SRC"
          grep -q '20>13.5' "$SRC"
          grep -q 'upper whisker ends at 58' "$SRC"
          grep -q 'Group B has a smaller IQR' "$SRC"
          grep -q 'Q_1=P_{25}' "$SRC"

          for method in \
            opening bridge_from_class1 fences_meaning correct_whiskers \
            outlier_worked_example read_a_boxplot compare_two_groups compare_center \
            compare_iqr compare_whiskers inspect_asymmetry inspect_outliers \
            contextual_conclusion common_mistakes student_challenge exit_ticket \
            next_lesson_bridge; do
            grep -q "def ${method}" "$SRC"
          done

          if grep -Eq '([A-Za-z]:\\\\|/Users/|/home/[^/]+/Desktop)' "$SRC"; then
            echo 'FAIL: non-portable absolute path found'; exit 1
          fi
          mkdir -p qa_preview final_out final_out/audit_frames final_out/pdf_slides package
          sha256sum "$SRC" "$STYLE" "$STORY" "$AUDIT" "$PROTOCOL" > qa_preview/SOURCE_SHA256SUMS.txt

      - name: Prepare pinned render and QA environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip imagemagick poppler-utils
          python -m pip install --disable-pip-version-check --quiet pillow reportlab
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          ffmpeg -version | head -n 1
          pdfinfo -v 2>&1 | head -n 1 || true

      - name: Literal PQL full-timeline runtime gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics10_iqr_class02_compare_boxplots_20260831
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.07 \
            -v "$PWD:/manim" \
            -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql \
                Statistics10_IQR_Class02_Compare_Boxplots_FINAL.py \
                Statistics10IQRClass02CompareBoxplotsFinal \
                --format=mp4 \
                --media_dir=/manim/media_pql \
                --disable_caching
            ' 2>&1 | tee qa_preview/render_pql.log
          PQL="$(find media_pql -type f -name 'Statistics10IQRClass02CompareBoxplotsFinal.mp4' -print -quit)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics10_iqr_class02_compare_boxplots_20260831
          rm -rf media_pqh
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh \
                Statistics10_IQR_Class02_Compare_Boxplots_FINAL.py \
                Statistics10IQRClass02CompareBoxplotsFinal \
                --format=mp4 \
                --media_dir=/manim/media_pqh \
                --disable_caching
            ' 2>&1 | tee final_out/render_pqh.log
          FINAL="$(find media_pqh -type f -name 'Statistics10IQRClass02CompareBoxplotsFinal.mp4' -print -quit)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" final_out/Statistics10_IQR_Class02_Compare_Boxplots_FINAL_pqh.mp4

      - name: Strict technical media QA and complete decode
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Statistics10_IQR_Class02_Compare_Boxplots_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tframes\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$FRAMES" "$SIZE" > final_out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> final_out/full_decode.log
          test ! -s final_out/full_decode.log

      - name: Every-frame blank, sparse and border/cropping scan
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Statistics10_IQR_Class02_Compare_Boxplots_FINAL_pqh.mp4
          ffmpeg -nostdin -v error -i "$F" -vf scale=320:180 -pix_fmt gray -f rawvideo final_out/all_frames_gray.raw
          python - <<'PY'
          from pathlib import Path
          import csv
          W,H=320,180
          B=W*H
          raw=Path('final_out/all_frames_gray.raw').read_bytes()
          assert len(raw)%B==0
          n=len(raw)//B
          border_idx=[y*W+x for y in range(H) for x in range(W) if x<5 or x>=W-5 or y<5 or y>=H-5]
          blank=sparse=border_heavy=0
          rows=[]
          for i in range(n):
              fr=raw[i*B:(i+1)*B]
              dark_n=sum(p<245 for p in fr)
              dark_frac=dark_n/B
              if dark_n==0:
                  blank += 1
              if dark_frac < 0.004:
                  sparse += 1
              border_dark=sum(fr[j]<235 for j in border_idx)
              border_frac=border_dark/max(dark_n,1)
              if border_frac>0.20 and dark_n>200:
                  border_heavy += 1
              rows.append((i,dark_frac,border_frac))
          with open('final_out/FRAME_BY_FRAME_SCAN.csv','w',newline='') as f:
              w=csv.writer(f)
              w.writerow(['frame','dark_fraction','border_dark_fraction'])
              w.writerows(rows)
          Path('final_out/FRAME_SCAN_SUMMARY.txt').write_text(
              f'frames_scanned={n}\nblank_frames={blank}\nvery_sparse_frames={sparse}\nborder_heavy_frames={border_heavy}\n'
          )
          assert blank < n*0.10
          assert sparse < n*0.16
          assert border_heavy < n*0.02
          PY
          rm final_out/all_frames_gray.raw

      - name: Dense 96-frame senior visual audit and contact sheet
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Statistics10_IQR_Class02_Compare_Boxplots_FINAL_pqh.mp4
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          rm -rf final_out/audit_frames
          mkdir -p final_out/audit_frames
          for INDEX in $(seq -w 0 95); do
            T="$(python -c "print(float('$DUR')*(int('$INDEX')+0.5)/96.0)")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "final_out/audit_frames/frame_${INDEX}.png"
          done
          test "$(find final_out/audit_frames -type f -name '*.png' | wc -l)" -eq 96
          montage final_out/audit_frames/*.png \
            -thumbnail 384x216 -tile 6x16 -geometry +8+14 -background white -quality 90 \
            final_out/CONTACT_SHEET_96.jpg
          test -s final_out/CONTACT_SHEET_96.jpg

      - name: Build and verify presentation PDF + representative PNG
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics10_iqr_class02_compare_boxplots_20260831
          python "$JOB/build_presentation_pdf.py" \
            final_out/audit_frames \
            final_out/Statistics10_IQR_Class02_Compare_Boxplots_PRESENTATION.pdf \
            final_out/Statistics10_IQR_Class02_Compare_Boxplots_COVER.png \
            final_out/pdf_slides \
            --pages 16
          PDF=final_out/Statistics10_IQR_Class02_Compare_Boxplots_PRESENTATION.pdf
          PNG=final_out/Statistics10_IQR_Class02_Compare_Boxplots_COVER.png
          test -s "$PDF" && test -s "$PNG"
          PAGES="$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')"
          test "$PAGES" = 16
          mkdir -p final_out/pdf_verify
          pdftoppm -f 1 -singlefile -png -r 120 "$PDF" final_out/pdf_verify/page_first >/dev/null 2>&1
          pdftoppm -f 16 -singlefile -png -r 120 "$PDF" final_out/pdf_verify/page_last >/dev/null 2>&1
          test -s final_out/pdf_verify/page_first.png
          test -s final_out/pdf_verify/page_last.png
          printf 'pages=%s\nfirst_page_render=PASS\nlast_page_render=PASS\n' "$PAGES" > final_out/PDF_QA.txt

      - name: Assemble senior QA report and SHA-256 evidence
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Statistics10_IQR_Class02_Compare_Boxplots_FINAL_pqh.mp4
          PDF=final_out/Statistics10_IQR_Class02_Compare_Boxplots_PRESENTATION.pdf
          PNG=final_out/Statistics10_IQR_Class02_Compare_Boxplots_COVER.png
          JOB=render_jobs/statistics10_iqr_class02_compare_boxplots_20260831
          sha256sum \
            "$F" "$PDF" "$PNG" \
            "$JOB/Statistics10_IQR_Class02_Compare_Boxplots_FINAL.py" \
            "$JOB/jp_classroom_style.py" \
            > final_out/SHA256SUMS.txt
          {
            echo '# Statistics 10 IQR Class 2 - Senior QA result'
            echo
            echo '- Python compile: PASS'
            echo '- Static JP classroom style QA: PASS'
            echo '- Literal PQL full-timeline gate: PASS'
            echo '- Literal PQH render: PASS'
            echo '- H.264 / 1920x1080 / 30 fps / yuv420p: PASS'
            echo '- Full FFmpeg decode: PASS'
            echo '- Every-frame blank/sparse/border scan: PASS'
            echo '- 96-frame distributed visual audit: generated'
            echo '- 16-page PDF from audited render frames: PASS'
            echo '- Representative PNG cover: PASS'
            echo '- SHA-256 manifest: generated'
            echo
            cat final_out/VIDEO_TECHNICAL.tsv
            echo
            cat final_out/FRAME_SCAN_SUMMARY.txt
            echo
            cat final_out/PDF_QA.txt
          } > final_out/SENIOR_QA_RESULT.md

      - name: Build reproducible full package
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics10_iqr_class02_compare_boxplots_20260831
          ROOT=package/Statistics10_IQR_Class02_Compare_Boxplots_FINAL_PQH_PROJECT
          mkdir -p "$ROOT/src" "$ROOT/docs" "$ROOT/qa/audit_frames" "$ROOT/qa/pdf_verify" "$ROOT/render" "$ROOT/workflow"
          cp "$JOB/Statistics10_IQR_Class02_Compare_Boxplots_FINAL.py" "$ROOT/src/"
          cp "$JOB/jp_classroom_style.py" "$JOB/check_manim_style.py" "$JOB/build_presentation_pdf.py" "$ROOT/src/"
          cp "$JOB/STORYBOARD.md" "$JOB/SOURCE_AUDIT_CLASS1.md" "$JOB/RENDER_PROTOCOL.md" "$ROOT/docs/"
          cp final_out/Statistics10_IQR_Class02_Compare_Boxplots_FINAL_pqh.mp4 "$ROOT/render/"
          cp final_out/Statistics10_IQR_Class02_Compare_Boxplots_PRESENTATION.pdf "$ROOT/render/"
          cp final_out/Statistics10_IQR_Class02_Compare_Boxplots_COVER.png "$ROOT/render/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/FRAME_SCAN_SUMMARY.txt final_out/FRAME_BY_FRAME_SCAN.csv \
             final_out/CONTACT_SHEET_96.jpg final_out/PDF_QA.txt final_out/SENIOR_QA_RESULT.md \
             final_out/SHA256SUMS.txt final_out/full_decode.log final_out/render_pqh.log "$ROOT/qa/"
          cp qa_preview/render_pql.log qa_preview/SOURCE_SHA256SUMS.txt static_style_qa.txt "$ROOT/qa/"
          cp final_out/audit_frames/*.png "$ROOT/qa/audit_frames/"
          cp final_out/pdf_verify/*.png "$ROOT/qa/pdf_verify/"
          cp .github/workflows/statistics10_iqr_class02_compare_boxplots_pqh_20260831.yml "$ROOT/workflow/"
          cp protocols/PROTOCOL_MANIMCE_PQH_PROJECT_PACKAGE_STANDARD.md "$ROOT/docs/" 2>/dev/null || true
          (cd package && zip -qr Statistics10_IQR_Class02_Compare_Boxplots_FULL_PACKAGE.zip Statistics10_IQR_Class02_Compare_Boxplots_FINAL_PQH_PROJECT)
          sha256sum package/Statistics10_IQR_Class02_Compare_Boxplots_FULL_PACKAGE.zip > package/PACKAGE_SHA256.txt

      - name: Persist final classroom delivery to render branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          DEST=deliveries/statistics10_iqr_class02_compare_boxplots_20260831
          mkdir -p "$DEST"
          cp final_out/Statistics10_IQR_Class02_Compare_Boxplots_FINAL_pqh.mp4 "$DEST/"
          cp final_out/Statistics10_IQR_Class02_Compare_Boxplots_PRESENTATION.pdf "$DEST/"
          cp final_out/Statistics10_IQR_Class02_Compare_Boxplots_COVER.png "$DEST/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/FRAME_SCAN_SUMMARY.txt final_out/CONTACT_SHEET_96.jpg \
             final_out/SENIOR_QA_RESULT.md final_out/SHA256SUMS.txt "$DEST/"
          cp package/Statistics10_IQR_Class02_Compare_Boxplots_FULL_PACKAGE.zip "$DEST/"
          cp package/PACKAGE_SHA256.txt "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          JOB=render_jobs/statistics10_iqr_class02_compare_boxplots_20260831
          git add "$DEST" \
            "$JOB/Statistics10_IQR_Class02_Compare_Boxplots_FINAL.py" \
            "$JOB/jp_classroom_style.py" \
            "$JOB/check_manim_style.py" \
            "$JOB/build_presentation_pdf.py" \
            "$JOB/STORYBOARD.md" \
            "$JOB/SOURCE_AUDIT_CLASS1.md" \
            "$JOB/RENDER_PROTOCOL.md"
          if ! git diff --cached --quiet; then
            git commit -m "render: publish Statistics 10 IQR Class 2 final PQH package"
            git push origin HEAD:render/statistics10-iqr-class02-compare-boxplots-20260831
          fi

      - name: Upload final package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10-IQR-Class02-Compare-Boxplots-FINAL-PQH-20260831
          path: |
            package/Statistics10_IQR_Class02_Compare_Boxplots_FULL_PACKAGE.zip
            package/PACKAGE_SHA256.txt
            final_out/Statistics10_IQR_Class02_Compare_Boxplots_FINAL_pqh.mp4
            final_out/Statistics10_IQR_Class02_Compare_Boxplots_PRESENTATION.pdf
            final_out/Statistics10_IQR_Class02_Compare_Boxplots_COVER.png
            final_out/VIDEO_TECHNICAL.tsv
            final_out/FRAME_SCAN_SUMMARY.txt
            final_out/FRAME_BY_FRAME_SCAN.csv
            final_out/CONTACT_SHEET_96.jpg
            final_out/PDF_QA.txt
            final_out/SENIOR_QA_RESULT.md
            final_out/SHA256SUMS.txt
            final_out/audit_frames/
          if-no-files-found: error
          retention-days: 14
