name: Render Seminar11 OOP V11 UML PQH 20260819

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  statistics11_arrays:
    if: github.event.pull_request.head.ref == 'statistics11-colab-arrays-render-20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact statistics render branch
        uses: actions/checkout@v4
        with:
          ref: statistics11-colab-arrays-render-20260820

      - name: Prepare ManimCE and static validation
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics11_colab_arrays
          SRC="$JOB/Statistics11_Colab_Arrays_Senior.py"
          mkdir -p out
          python -m py_compile "$SRC"
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL layout gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics11_colab_arrays
          SRC="$JOB/Statistics11_Colab_Arrays_Senior.py"
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
            set -euo pipefail
            mkdir -p /tmp/manim-bin
            printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
            chmod +x /tmp/manim-bin/xdg-open
            export PATH=/tmp/manim-bin:\$PATH
            manim -pql $SRC Statistics11ColabArrays --fps 15 --format=mp4 --media_dir media_pql --disable_caching
          " 2>&1 | tee out/render_pql.log
          P="$(find media_pql -type f -name 'Statistics11ColabArrays.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$P" && test -s "$P"
          cp "$P" out/Statistics11_Colab_Arrays_QA_pql.mp4

      - name: Literal PQH final render and delivery normalization
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics11_colab_arrays
          SRC="$JOB/Statistics11_Colab_Arrays_Senior.py"
          rm -rf media
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
            set -euo pipefail
            mkdir -p /tmp/manim-bin
            printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
            chmod +x /tmp/manim-bin/xdg-open
            export PATH=/tmp/manim-bin:\$PATH
            manim -pqh $SRC Statistics11ColabArrays --fps 30 --format=mp4 --media_dir media --disable_caching
          " 2>&1 | tee out/render_pqh.log
          RAW="$(find media -type f -name 'Statistics11ColabArrays.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$RAW" && test -s "$RAW"
          ffmpeg -y -nostdin -loglevel error -i "$RAW" -vf "scale=1920:1080:flags=lanczos,fps=30" -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart -an out/Statistics11_Colab_Arrays_SENIOR_PQH.mp4
          cp "$SRC" out/Statistics11_Colab_Arrays_Senior.py

      - name: Strict technical QA and audit frames
        shell: bash
        run: |
          set -euo pipefail
          F=out/Statistics11_Colab_Arrays_SENIOR_PQH.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          mkdir -p out/audit_frames
          for P in 0.08 0.20 0.32 0.44 0.56 0.68 0.80 0.92; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%03d' "$(python -c "print(int(float('$P')*100))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_${TAG}.png"
          done
          ffmpeg -nostdin -loglevel error -i "$F" -vf "fps=1/8,scale=640:-1,tile=4x3:padding=6:margin=8" -frames:v 1 out/QA_CONTACT_SHEET.jpg || true
          sha256sum "$F" out/Statistics11_Colab_Arrays_Senior.py > out/SHA256SUMS.txt
          printf 'Scene: Statistics11ColabArrays\nTopic: Statistics 11 — Google Colab arrays\nManimCE: 0.20.1\nPreview: literal -pql\nFinal source render: literal -pqh\nDelivery normalization: 1920x1080, 30 fps, H.264/yuv420p\nContent: meaning, NumPy definition, index, slicing, 2D arrays, descriptive statistics, population/sample SD, Boolean filtering, workflow summary\nQA: py_compile + PQL + PQH + ffprobe + full decode + audit frames + contact sheet + SHA-256\n' > out/RENDER_INFO.txt

      - name: Upload verified Statistics 11 delivery
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11-Colab-Arrays-PQH-20260820
          path: |
            out/Statistics11_Colab_Arrays_SENIOR_PQH.mp4
            out/Statistics11_Colab_Arrays_QA_pql.mp4
            out/Statistics11_Colab_Arrays_Senior.py
            out/VIDEO_TECHNICAL.tsv
            out/SHA256SUMS.txt
            out/RENDER_INFO.txt
            out/QA_CONTACT_SHEET.jpg
            out/audit_frames/
          if-no-files-found: error
          retention-days: 30
