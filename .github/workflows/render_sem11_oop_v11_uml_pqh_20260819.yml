name: Render Seminar11 OOP V11 UML PQH 20260819

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render/sem11-oop-v11-uml-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact V11 source and JP style
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/sem11_oop_v11
          mkdir -p "$JOB/style_chunks" out
          cat "$JOB"/chunks/scene_*.pyfrag > "$JOB/Seminar11_OOP_UML_SENIOR_V11.py"
          STYLE_BASE='https://raw.githubusercontent.com/juanperez238421-cpu/IJR---Seminario/render-sem11-oop-v10-20260818/render_jobs/sem11_oop_v10/chunks'
          for I in 00 01 02 03 04; do
            curl -fsSL "$STYLE_BASE/style_$I" -o "$JOB/style_chunks/style_$I"
          done
          cat "$JOB"/style_chunks/style_* > "$JOB/jp_classroom_style.py"
          python -m py_compile "$JOB/Seminar11_OOP_UML_SENIOR_V11.py" "$JOB/jp_classroom_style.py"
          python - <<'PY'
          from pathlib import Path
          p=Path('render_jobs/sem11_oop_v11/Seminar11_OOP_UML_SENIOR_V11.py')
          s=p.read_text()
          required=['class Seminar11OOPUMLV11', 'def uml_class(', 'def uml_generalization(', 'def uml_realization(', 'def uml_composition(', 'def assert_no_overlap(']
          missing=[x for x in required if x not in s]
          assert not missing, f'missing V11 architecture: {missing}'
          print('STATIC_V11_QA=PASS')
          PY
          sha256sum "$JOB/Seminar11_OOP_UML_SENIOR_V11.py" "$JOB/jp_classroom_style.py" > out/SOURCE_SHA256.txt

      - name: Prepare ManimCE 0.20.1 and verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Accelerated literal PQL layout gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/sem11_oop_v11
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.14 \
            -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $JOB/Seminar11_OOP_UML_SENIOR_V11.py Seminar11OOPUMLV11 \
                --fps 15 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee out/render_pql.log
          P="$(find media_pql -type f -name 'Seminar11OOPUMLV11.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$P" && test -s "$P"
          cp "$P" out/Seminar11_OOP_UML_SENIOR_V11_QA_pql.mp4

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/sem11_oop_v11
          rm -rf media
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $JOB/Seminar11_OOP_UML_SENIOR_V11.py Seminar11OOPUMLV11 \
                --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee out/render_pqh.log
          F="$(find media -type f -name 'Seminar11OOPUMLV11.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$F" && test -s "$F"
          cp "$F" out/Seminar11_OOP_UML_SENIOR_V11_pqh.mp4
          cp "$JOB/Seminar11_OOP_UML_SENIOR_V11.py" out/
          cp "$JOB/jp_classroom_style.py" out/

      - name: Strict technical and visual QA
        shell: bash
        run: |
          set -euo pipefail
          F=out/Seminar11_OOP_UML_SENIOR_V11_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          mkdir -p out/audit_frames
          for P in 0.025 0.075 0.125 0.18 0.235 0.29 0.345 0.40 0.455 0.51 0.565 0.62 0.675 0.73 0.785 0.84 0.90 0.965; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_${TAG}.png"
          done
          ffmpeg -nostdin -loglevel error -i "$F" -vf "fps=1/8,scale=560:-1,tile=4x4:padding=6:margin=8" -frames:v 1 out/QA_CONTACT_SHEET.jpg
          sha256sum "$F" out/Seminar11_OOP_UML_SENIOR_V11.py out/jp_classroom_style.py > out/SHA256SUMS.txt
          printf 'Scene: Seminar11OOPUMLV11\nVersion: Senior QA V11 UML\nManimCE: 0.20.1\nPreview: literal -pql with runtime safe-frame and no-overlap assertions\nFinal: literal -pqh, 1920x1080, 30 fps, H.264/yuv420p\nArchitecture: classic UML class/object boxes, generalization, realization, composition\nQA: py_compile + PQL + PQH + ffprobe + full decode + 18 audit frames + contact sheet + SHA-256\n' > out/RENDER_INFO.txt
          cd out
          zip -9 -r Seminar11_OOP_UML_SENIOR_V11_PQH_Package.zip \
            Seminar11_OOP_UML_SENIOR_V11_pqh.mp4 Seminar11_OOP_UML_SENIOR_V11.py jp_classroom_style.py \
            VIDEO_TECHNICAL.tsv SOURCE_SHA256.txt SHA256SUMS.txt RENDER_INFO.txt render_pql.log render_pqh.log full_decode.log QA_CONTACT_SHEET.jpg audit_frames/

      - uses: actions/upload-artifact@v4
        with:
          name: Seminar11-OOP-V11-UML-PQH-20260819
          path: |
            out/Seminar11_OOP_UML_SENIOR_V11_pqh.mp4
            out/Seminar11_OOP_UML_SENIOR_V11_PQH_Package.zip
            out/Seminar11_OOP_UML_SENIOR_V11.py
            out/jp_classroom_style.py
            out/VIDEO_TECHNICAL.tsv
            out/SOURCE_SHA256.txt
            out/SHA256SUMS.txt
            out/RENDER_INFO.txt
            out/QA_CONTACT_SHEET.jpg
            out/audit_frames/
          if-no-files-found: error
          retention-days: 7
