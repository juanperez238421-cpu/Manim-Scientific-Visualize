name: Isolated House Extrusion PQH 20260818

on:
  pull_request:
    branches:
      - render-base-house-extrusion-20260818

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render-house-extrusion-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Patch axis and validate source
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/house_extrusion
          SRC="$JOB/House_Extrusion_3D_ManimCE.py"
          sed -i 's/door_cutter.shift(IN \* 0.75)/door_cutter.shift(DOWN * 0.75)/' "$SRC"
          sed -i 's/door_cutter.animate.shift(OUT \* 0.75)/door_cutter.animate.shift(UP * 0.75)/' "$SRC"
          sed -i 's/win_cutter.shift(IN \* 0.75)/win_cutter.shift(DOWN * 0.75)/' "$SRC"
          sed -i 's/win_cutter.animate.shift(OUT \* 0.75)/win_cutter.animate.shift(UP * 0.75)/' "$SRC"
          python -m py_compile "$SRC"
          grep -n 'cutter.shift\|cutter.animate' "$SRC" | tee axis_qa.txt

      - name: Install ffmpeg and pull ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL preview validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media_pql out && mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql render_jobs/house_extrusion/House_Extrusion_3D_ManimCE.py HouseExtrusion3D \
                --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee out/render_pql.log
          PREVIEW="$(find media_pql -type f -name 'HouseExtrusion3D.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh render_jobs/house_extrusion/House_Extrusion_3D_ManimCE.py HouseExtrusion3D \
                --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee out/render_pqh.log
          FINAL="$(find media -type f -name 'HouseExtrusion3D.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/House_Extrusion_3D_PQH.mp4

      - name: Strict verification and audit frames
        shell: bash
        run: |
          set -euo pipefail
          F=out/House_Extrusion_3D_PQH.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          mkdir -p out/audit_frames
          for P in 0.04 0.16 0.30 0.44 0.58 0.72 0.86 0.97; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_${TAG}.png"
          done
          cp render_jobs/house_extrusion/House_Extrusion_3D_ManimCE.py out/
          cp axis_qa.txt out/
          sha256sum out/House_Extrusion_3D_PQH.mp4 out/House_Extrusion_3D_ManimCE.py > out/SHA256SUMS.txt
          cat > out/RENDER_INFO.txt <<'EOF'
Scene: HouseExtrusion3D
ManimCE: 0.20.1
Preview: literal -pql
Final: literal -pqh, 1920x1080, 30 fps
QA: py_compile + axis QA + PQL + PQH + ffprobe + full FFmpeg decode + 8 audit frames + SHA-256
EOF

      - name: Package delivery
        shell: bash
        run: |
          set -euo pipefail
          cd out
          zip -9 -r House_Extrusion_3D_PQH_Package.zip \
            House_Extrusion_3D_PQH.mp4 House_Extrusion_3D_ManimCE.py VIDEO_TECHNICAL.tsv \
            SHA256SUMS.txt RENDER_INFO.txt axis_qa.txt render_pql.log render_pqh.log full_decode.log audit_frames/

      - uses: actions/upload-artifact@v4
        with:
          name: House-Extrusion-3D-PQH-20260818-Isolated
          path: |
            out/House_Extrusion_3D_PQH.mp4
            out/House_Extrusion_3D_PQH_Package.zip
            out/House_Extrusion_3D_ManimCE.py
            out/VIDEO_TECHNICAL.tsv
            out/SHA256SUMS.txt
            out/RENDER_INFO.txt
            out/audit_frames/
          if-no-files-found: error
          retention-days: 7
