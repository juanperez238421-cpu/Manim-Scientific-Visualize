name: Render HTML Colab Visual Library V2 Parallel

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "html_colab_visual_library/**"
      - ".github/workflows/render_html_colab_library_parallel.yml"

permissions:
  contents: read

jobs:
  render-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: "01"
            scene: HTML01WhatIsHTML
          - index: "02"
            scene: HTML02HeadAndBody
          - index: "03"
            scene: HTML03SemanticText
          - index: "04"
            scene: HTML04LinksListsImages
          - index: "05"
            scene: HTML05LayoutAndForms

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and validate source
        shell: bash
        run: |
          set -euo pipefail
          python html_colab_visual_library/build_source.py
          python -m py_compile html_colab_visual_library/html_colab_visual_library.py

      - name: Pull pinned ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Native PQL test and PQH render
        shell: bash
        env:
          SCENE: ${{ matrix.scene }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e SCENE="$SCENE" \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin /tmp/manim-home
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              SOURCE="html_colab_visual_library/html_colab_visual_library.py"
              manim -pql "$SOURCE" "$SCENE" --format=mp4 --disable_caching
              manim -pqh "$SOURCE" "$SCENE" --format=mp4 --disable_caching
            ' 2>&1 | tee "${SCENE}_render.log"

      - name: Verify scene with full PyAV decode
        shell: bash
        env:
          SCENE: ${{ matrix.scene }}
          INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          mkdir -p scene_delivery
          video="$(
            find media -type f -name "${SCENE}.mp4" ! -path '*/partial_movie_files/*' \
              -printf '%T@ %p\n' \
            | sort -nr \
            | head -1 \
            | cut -d' ' -f2-
          )"
          test -n "$video"
          test -s "$video"
          output="scene_delivery/${INDEX}_${SCENE}_pqh.mp4"
          cp "$video" "$output"

          docker run --rm \
            -e OUTPUT="$output" \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint python \
            manimcommunity/manim:v0.20.1 \
            -c 'import av, os
from fractions import Fraction
path = os.environ["OUTPUT"]
container = av.open(path)
streams = [stream for stream in container.streams if stream.type == "video"]
assert len(streams) == 1, f"video_streams={len(streams)}"
stream = streams[0]
codec = stream.codec_context.name
width = stream.codec_context.width
height = stream.codec_context.height
rate = stream.average_rate
pixel_format = stream.codec_context.format.name if stream.codec_context.format else "unknown"
duration = float(container.duration / av.time_base) if container.duration is not None else None
assert codec == "h264", codec
assert (width, height) == (1920, 1080), (width, height)
assert rate is not None and Fraction(rate) == Fraction(30, 1), rate
assert pixel_format == "yuv420p", pixel_format
frames = sum(1 for _ in container.decode(video=0))
assert frames > 0, frames
print(f"file={path}")
print(f"codec_name={codec}")
print(f"width={width}")
print(f"height={height}")
print(f"r_frame_rate={rate}")
print(f"pix_fmt={pixel_format}")
print(f"duration={duration}")
print(f"size={os.path.getsize(path)}")
print(f"decoded_frames={frames}")
print("full_decode=success")' \
            | tee "scene_delivery/${INDEX}_${SCENE}_verification.txt"

          cp "${SCENE}_render.log" scene_delivery/

      - name: Upload verified scene
        uses: actions/upload-artifact@v4
        with:
          name: html-colab-${{ matrix.index }}-${{ matrix.scene }}
          path: scene_delivery/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: render-scene
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble source
        shell: bash
        run: |
          set -euo pipefail
          python html_colab_visual_library/build_source.py
          python -m py_compile html_colab_visual_library/html_colab_visual_library.py

      - name: Download verified scenes
        uses: actions/download-artifact@v4
        with:
          pattern: html-colab-*
          path: delivery
          merge-multiple: true

      - name: Complete delivery package
        shell: bash
        run: |
          set -euo pipefail
          cp html_colab_visual_library/html_colab_visual_library.py delivery/
          cp html_colab_visual_library/README.md delivery/
          test "$(find delivery -maxdepth 1 -name '*_pqh.mp4' | wc -l)" -eq 5
          sha256sum delivery/* > delivery/SHA256SUMS.txt

      - name: Upload complete library
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Colab-Visual-Library-V2-Final
          path: delivery/
          if-no-files-found: error
          retention-days: 7
