name: Geometry 8 2D Areas FINAL TOTAL PQH 20260831

on:
  push:
    branches: [render/geometry8-2d-areas-masterclass-20260831]
    paths:
      - 'render_jobs/geometry8_2d_areas_masterclass_20260831/**'
      - '.github/workflows/geometry8_2d_areas_masterclass_full_total_20260831.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-full-total-package:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap protocol and render full package
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_2d_areas_masterclass_20260831
          P="$JOB/payloads/run_geometry8_2d_areas_full_protocol.sh.gz.b64"
          base64 -d "$P" | gzip -dc > "$JOB/run_geometry8_2d_areas_full_protocol.sh"
          chmod +x "$JOB/run_geometry8_2d_areas_full_protocol.sh"
          bash "$JOB/run_geometry8_2d_areas_full_protocol.sh"

      - name: Persist exact reconstructed sources on render branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_2d_areas_masterclass_20260831
          rm -rf "$JOB/payloads"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$JOB"
          if ! git diff --cached --quiet; then
            git commit -m 'Persist Geometry 8 2D areas final rendered sources [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Geometry8-2D-Areas-FINAL-TOTAL-20260831-PQH
          path: |
            out/
            qa_out/
          if-no-files-found: warn
          retention-days: 14
