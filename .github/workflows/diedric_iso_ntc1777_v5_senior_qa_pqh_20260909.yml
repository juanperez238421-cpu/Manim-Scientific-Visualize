name: Diedric ISO NTC1777 V5 Senior QA PQH 20260909

on:
  push:
    branches:
      - manim/diedric-iso-ntc1777-v5-senior-qa-20260909
    paths:
      - .github/workflows/diedric_iso_ntc1777_v5_senior_qa_pqh_20260909.yml
      - render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5.py
      - Core/technical_drawing_tools.py
      - Core/technical_drawing_tools_v5.py

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout V5 branch
        uses: actions/checkout@v4
        with:
          ref: manim/diedric-iso-ntc1777-v5-senior-qa-20260909
          fetch-depth: 0

      - name: Validate V5 source and safe-layout library
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5.py
          LIB=Core/technical_drawing_tools_v5.py
          python -m py_compile "$SRC" "$LIB" Core/technical_drawing_tools.py
          grep -q 'class DiedricISOProjectionV5SeniorQA' "$SRC"
          grep -q 'PAUSE_VIEW = 3.25' "$SRC"
          grep -q 'large_view_card' "$SRC"
          grep -q 'safe_bottom_callout' "$SRC"
          grep -q 'observer_sequence_strip' "$SRC"
          grep -q 'move_camera' "$SRC"
          grep -q 'PRIMER DIEDRO' "$SRC"
          grep -q 'TERCER DIEDRO' "$SRC"
          grep -q 'NTC 1777:2001' "$SRC"
          grep -q 'SAFE_TOP_Y' "$LIB"
          ! grep -Eq '[A-Za-z]:\\|/Users/|/home/[^/]+/' "$SRC" "$LIB"

      - name: Install render and QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip zip
          python -m pip install --quiet pillow
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL QA render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5.py
          SCENE=DiedricISOProjectionV5SeniorQA
          rm -rf media_pql qa_pql
          mkdir -p qa_pql
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.035 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pql $SRC $SCENE --fps 15 --format=mp4 --media_dir media_pql --disable_caching" \
            2>&1 | tee qa_pql/pql.log
          PQL="$(find media_pql -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$PQL"
          test -s "$PQL"
          ffmpeg -nostdin -v error -i "$PQL" -f null - 2> qa_pql/pql_decode.log

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5.py
          SCENE=DiedricISOProjectionV5SeniorQA
          OUT=deliverables/technical_drawing_diedric_iso_v5_20260909
          rm -rf media "$OUT"
          mkdir -p "$OUT"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pqh $SRC $SCENE --fps 30 --format=mp4 --media_dir media --disable_caching" \
            2>&1 | tee "$OUT/pqh.log"
          FINAL="$(find media -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$FINAL"
          test -s "$FINAL"
          cp "$FINAL" "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_SENIOR_QA_FINAL_pqh.mp4"

      - name: Senior technical QA and distributed visual inspection
        shell: bash
        run: |
          set -euo pipefail
          OUT=deliverables/technical_drawing_diedric_iso_v5_20260909
          F="$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_SENIOR_QA_FINAL_pqh.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          awk -v d="$DUR" 'BEGIN { if (d < 300 || d > 520) exit 1; }'
          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/decode.log"

          mkdir -p "$OUT/qa_frames"
          for FRAC in 0.015 0.045 0.075 0.105 0.135 0.165 0.195 0.225 0.255 0.285 0.315 0.345 0.375 0.405 0.435 0.465 0.495 0.525 0.555 0.585 0.615 0.645 0.675 0.705 0.735 0.765 0.795 0.825 0.855 0.885 0.915 0.945 0.975; do
            T="$(awk -v d="$DUR" -v f="$FRAC" 'BEGIN{printf "%.2f",d*f}')"
            TAG="$(printf '%s' "$FRAC" | tr -d '.')"
            ffmpeg -y -ss "$T" -i "$F" -frames:v 1 "$OUT/qa_frames/frame_${TAG}.png" >/dev/null 2>&1
          done

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path('deliverables/technical_drawing_diedric_iso_v5_20260909')
          frames = sorted((root/'qa_frames').glob('*.png'))
          if len(frames) != 33:
              raise SystemExit(f'Expected 33 QA frames, found {len(frames)}')

          rows=[]
          populated=0
          very_dense=0
          for p in frames:
              im=Image.open(p).convert('RGB').resize((320,180))
              pix=list(im.getdata())
              changed=sum(1 for r,g,b in pix if abs(r-246)+abs(g-248)+abs(b-251) > 42)
              ratio=changed/len(pix)
              rows.append((p.name,ratio))
              if ratio > 0.025:
                  populated += 1
              if ratio > 0.62:
                  very_dense += 1
          (root/'VISUAL_DENSITY_QA.tsv').write_text(
              'frame\tnonbackground_ratio\n'+'\n'.join(f'{n}\t{r:.6f}' for n,r in rows)+'\n',
              encoding='utf-8')
          if populated < 30:
              raise SystemExit(f'Too many nearly blank samples: populated={populated}/33')
          if very_dense > 8:
              raise SystemExit(f'Too many visually overcrowded samples: {very_dense}/33')

          thumbs=[]
          for p in frames:
              im=Image.open(p).convert('RGB')
              im.thumbnail((384,216))
              canvas=Image.new('RGB',(400,246),'white')
              x=(400-im.width)//2
              canvas.paste(im,(x,8))
              d=ImageDraw.Draw(canvas)
              d.text((12,224),p.stem,fill=(35,45,58))
              thumbs.append(canvas)
          cols=4
          rows_n=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(400*cols,246*rows_n),'white')
          for i,im in enumerate(thumbs):
              sheet.paste(im,((i%cols)*400,(i//cols)*246))
          sheet.save(root/'qa_contact_sheet.jpg',quality=92)
          PY

          sha256sum "$F" > "$OUT/SHA256SUMS.txt"
          cp render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5.py "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_source.py"
          cp Core/technical_drawing_tools_v5.py "$OUT/technical_drawing_tools_v5.py"
          cat > "$OUT/RENDER_INFO.txt" <<'EOF'
          V5 Senior QA rebuild of the Sistema Diedrico lesson.
          Base: technically correct V4, reworked for classroom legibility.
          Main changes: explicit safe zones, larger one-view-at-a-time orthographic reveals, slower smooth camera moves, 3.25 s holds after every principal observer direction, animated 3D-to-2D bridges, separated first-angle/third-angle teaching stages, larger symbols, less crowded comparison layouts, and longer reading pauses.
          Terminology: Primer diedro / First-angle / ISO E; Tercer diedro / Third-angle / ISO A.
          Colombia wording: NTC 1777:2001 is described as a technical standard, not legislation by itself.
          ManimCE: 0.20.1
          Pipeline: compile -> PQL QA -> PQH final -> full decode -> ffprobe gates -> 33 distributed visual samples -> density/crowding gate -> contact sheet.
          Output: 1920x1080, 30 fps, H.264, yuv420p.
          EOF
          (cd "$OUT" && zip -9 -r TechnicalDrawing_Diedric_V5_SENIOR_QA_FULL_PACKAGE.zip \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_SENIOR_QA_FINAL_pqh.mp4 \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_source.py \
            technical_drawing_tools_v5.py VIDEO_TECHNICAL.tsv VISUAL_DENSITY_QA.tsv \
            SHA256SUMS.txt RENDER_INFO.txt decode.log pqh.log qa_contact_sheet.jpg qa_frames)
          test -s "$OUT/TechnicalDrawing_Diedric_V5_SENIOR_QA_FULL_PACKAGE.zip"

      - name: Persist final V5 delivery to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/technical_drawing_diedric_iso_v5_20260909
          if ! git diff --cached --quiet; then
            git commit -m "render: persist diedric V5 senior QA PQH [skip ci]"
            git push origin HEAD:manim/diedric-iso-ntc1777-v5-senior-qa-20260909
          fi

      - name: Upload V5 delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIEDRIC-ISO-V5-SENIOR-QA-PQH
          path: deliverables/technical_drawing_diedric_iso_v5_20260909/
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DIEDRIC-ISO-V5-DIAGNOSTICS
          path: |
            qa_pql/
            deliverables/technical_drawing_diedric_iso_v5_20260909/
          if-no-files-found: ignore
          retention-days: 3
