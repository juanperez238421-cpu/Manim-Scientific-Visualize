name: Render CSS HTML Masterclass V6

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "css_html_masterclass_v6/**"
      - "vscode_html_tutorial/**"
      - ".github/workflows/render_css_html_masterclass_v6.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble dependencies and validate syntax
        shell: bash
        run: |
          set -euo pipefail
          python vscode_html_tutorial/build_source.py
          python -m py_compile vscode_html_tutorial/vscode_html_tutorial.py
          python -m py_compile vscode_html_tutorial/masterclass_v4.py
          python -m py_compile vscode_html_tutorial/masterclass_v5.py
          python -m py_compile css_html_masterclass_v6/css_html_masterclass_v6.py

      - name: Pull pinned ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Native PQL test and literal PQH render
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/vscode-bin /tmp/manim-home
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/vscode-bin/xdg-open
              chmod +x /tmp/vscode-bin/xdg-open
              export PATH="/tmp/vscode-bin:$PATH"
              python vscode_html_tutorial/build_source.py
              SOURCE="css_html_masterclass_v6/css_html_masterclass_v6.py"
              SCENE="CSSHTMLVisualInterfaceV6"
              manim -pql "$SOURCE" "$SCENE" --format=mp4 --disable_caching
              manim -pqh "$SOURCE" "$SCENE" --format=mp4 --disable_caching
            ' 2>&1 | tee CSSHTMLVisualInterfaceV6_render.log

      - name: Stage and fully decode video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          input="$(find media -type f -name 'CSSHTMLVisualInterfaceV6.mp4' ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$input"
          test -s "$input"
          output="delivery/CSS_and_HTML_Visual_Interface_V6_pqh.mp4"
          cp "$input" "$output"
          docker run --rm \
            -e OUTPUT="$output" \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint python \
            manimcommunity/manim:v0.20.1 \
            -c 'import av, os; p=os.environ["OUTPUT"]; c=av.open(p); ss=[s for s in c.streams if s.type=="video"]; assert len(ss)==1, len(ss); s=ss[0]; codec=s.codec_context.name; width=s.codec_context.width; height=s.codec_context.height; rate=s.average_rate; fps=float(rate) if rate is not None else 0.0; pix=s.codec_context.format.name if s.codec_context.format else "unknown"; duration=float(c.duration/av.time_base) if c.duration is not None else 0.0; frames=sum(1 for _ in c.decode(video=0)); assert codec=="h264", codec; assert (width,height)==(1920,1080), (width,height); assert abs(fps-30.0)<=0.05, fps; assert duration>=300.0, duration; assert frames>0, frames; print(f"file={p}\ncodec_name={codec}\nwidth={width}\nheight={height}\nr_frame_rate={rate}\nfps={fps}\npix_fmt={pix}\nduration={duration}\nsize={os.path.getsize(p)}\ndecoded_frames={frames}\nfull_decode=success")' \
            | tee delivery/CSS_and_HTML_Visual_Interface_V6_verification.txt
          cp CSSHTMLVisualInterfaceV6_render.log delivery/
          cp css_html_masterclass_v6/css_html_masterclass_v6.py delivery/
          cp css_html_masterclass_v6/parts/source.part_00 delivery/
          sha256sum delivery/* > delivery/SHA256SUMS.txt

      - name: Upload verified V6 delivery
        uses: actions/upload-artifact@v4
        with:
          name: CSS-HTML-Visual-Interface-V6-PQH
          path: delivery/
          if-no-files-found: error
          retention-days: 7
