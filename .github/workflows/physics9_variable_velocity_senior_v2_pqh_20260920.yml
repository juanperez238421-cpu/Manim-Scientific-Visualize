name: Physics9 Variable Velocity SENIOR V2 PQH 20260920

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    if: github.event.pull_request.head.ref == 'physics9-variable-velocity-senior-v2-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: physics9-variable-velocity-senior-v2-20260920

      - name: Validate source and classroom style
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_variable_velocity_senior_v2_20260920
          FILE="$JOB/physics9_variable_velocity_senior_v2.py"
          LIB="$JOB/library/jp_classroom_style.py"
          python -m py_compile "$FILE" "$LIB"
          python "$JOB/tools/check_manim_style.py" "$FILE" | tee style_qa.log
          grep -q "PASS: no structural/style issues detected." style_qa.log
          python - <<'PY'
          from pathlib import Path
          p = Path('render_jobs/physics9_variable_velocity_senior_v2_20260920/physics9_variable_velocity_senior_v2.py')
          s = p.read_text(encoding='utf-8')
          required = [
              'class Physics9VariableVelocitySeniorV2(JPMathClassroomScene)',
              'standard_opening(', 'set_header(', 'clear_stage(',
              'assert_content_safe(', 'validate_lesson_data',
              'a_{\\mathrm{prom}}'
          ]
          missing = [item for item in required if item not in s]
          assert not missing, missing
          print('source_contract_pass')
          PY

      - name: Install verification tools and pull ManimCE
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          ffprobe -version | head -1

      - name: Fast PQL runtime and safe-layout QA
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_variable_velocity_senior_v2_20260920
          rm -rf media_pql qa_out
          mkdir -p qa_out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.18 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $JOB/physics9_variable_velocity_senior_v2.py Physics9VariableVelocitySeniorV2 \
                --fps 15 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee qa_out/render_pql.log
          PREVIEW="$(find media_pql -type f -name 'Physics9VariableVelocitySeniorV2.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          cp "$PREVIEW" qa_out/Physics9_VariableVelocity_SENIOR_V2_QA_pql.mp4

      - name: Final literal PQH render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_variable_velocity_senior_v2_20260920
          rm -rf media out
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $JOB/physics9_variable_velocity_senior_v2.py Physics9VariableVelocitySeniorV2 \
                --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee out/render_pqh.log
          FINAL="$(find media -type f -name 'Physics9VariableVelocitySeniorV2.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Physics9_VariableVelocity_SENIOR_V2_FULL_FINAL_pqh.mp4

      - name: Technical QA, full decode and audit contact sheet
        shell: bash
        run: |
          set -euo pipefail
          F=out/Physics9_VariableVelocity_SENIOR_V2_FULL_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          mkdir -p out/audit_frames
          for P in 0.04 0.15 0.27 0.39 0.51 0.63 0.75 0.87 0.96; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%03d' "$(python -c "print(int(float('$P')*100))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_$TAG.png"
          done
          ffmpeg -nostdin -loglevel error -framerate 1 -pattern_type glob -i 'out/audit_frames/frame_*.png' \
            -vf 'scale=640:-1,tile=3x3' -frames:v 1 out/QA_CONTACT_SHEET.png
          sha256sum "$F" > out/SHA256SUMS.txt

      - name: Package source and QA evidence
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_variable_velocity_senior_v2_20260920
          cp "$JOB/physics9_variable_velocity_senior_v2.py" out/
          cp "$JOB/QA_REVIEW_V1_TO_V2.md" out/
          cp style_qa.log out/
          cp qa_out/render_pql.log out/
          cat > out/RENDER_INFO.txt <<'EOF'
          Physics 9 — Variable Velocity SENIOR V2
          ManimCE: 0.20.1
          Format: JP Classroom standard, white/black/gray hierarchy
          Preview: literal -pql, LESSON_TIME_SCALE=0.18
          Final: literal -pqh, LESSON_TIME_SCALE=1.0
          Resolution: 1920x1080
          FPS: 30
          QA: py_compile + JP style checker + runtime safe-layout assertions + PQL + PQH + ffprobe + full decode + 9 audit frames + contact sheet + SHA-256
          Pedagogy: MRU baseline -> realistic route -> x(t) -> v(t) -> average acceleration -> synthesis
          EOF
          cd out
          zip -9 -r Physics9_VariableVelocity_SENIOR_V2_FULL_FINAL_PQH_Package.zip \
            Physics9_VariableVelocity_SENIOR_V2_FULL_FINAL_pqh.mp4 \
            physics9_variable_velocity_senior_v2.py QA_REVIEW_V1_TO_V2.md \
            VIDEO_TECHNICAL.tsv SHA256SUMS.txt RENDER_INFO.txt style_qa.log \
            render_pqh.log render_pql.log full_decode.log QA_CONTACT_SHEET.png audit_frames/

      - name: Publish verified V2 delivery to branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliveries/physics9
          cp out/Physics9_VariableVelocity_SENIOR_V2_FULL_FINAL_pqh.mp4 deliveries/physics9/
          cp out/Physics9_VariableVelocity_SENIOR_V2_FULL_FINAL_PQH_Package.zip deliveries/physics9/
          cp out/QA_CONTACT_SHEET.png deliveries/physics9/Physics9_VariableVelocity_SENIOR_V2_QA_CONTACT_SHEET.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliveries/physics9/
          if git diff --cached --quiet; then
            echo "No delivery changes to publish"
          else
            git commit -m "render: publish Physics9 variable velocity senior V2 PQH [skip ci]"
            git push origin HEAD:physics9-variable-velocity-senior-v2-20260920
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Physics9-VariableVelocity-SENIOR-V2-FULL-FINAL-PQH
          path: |
            out/Physics9_VariableVelocity_SENIOR_V2_FULL_FINAL_pqh.mp4
            out/Physics9_VariableVelocity_SENIOR_V2_FULL_FINAL_PQH_Package.zip
            out/physics9_variable_velocity_senior_v2.py
            out/QA_REVIEW_V1_TO_V2.md
            out/VIDEO_TECHNICAL.tsv
            out/SHA256SUMS.txt
            out/RENDER_INFO.txt
            out/style_qa.log
            out/QA_CONTACT_SHEET.png
            out/audit_frames/
          if-no-files-found: error
          retention-days: 14
