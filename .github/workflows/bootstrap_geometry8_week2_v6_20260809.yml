name: Bootstrap Geometry 8 Week 2 V6 Render

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render/geometry8-week2-v6-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4

      - name: Install FFmpeg verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Rebuild V5 base and apply V6 focus-first patch
        shell: bash
        run: |
          set -euo pipefail
          BASE=render_jobs/geometry8_week2_v4_20260809
          V6=render_jobs/geometry8_week2_v6_20260809
          rm -rf "$BASE/project"
          mkdir -p "$BASE/project"
          cat "$BASE/payload.part00" "$BASE/payload.part01" > /tmp/week2_v5_payload.b64
          base64 -d /tmp/week2_v5_payload.b64 > /tmp/week2_v5_payload.tar.xz
          tar -xJf /tmp/week2_v5_payload.tar.xz -C "$BASE/project"
          patch -d "$BASE/project" -p0 < "$BASE/v4_final.patch"
          python "$BASE/v5_patch.py" "$BASE/project/Geometry8_Week2_Class1_Senior_V4_Final.py"
          mv "$BASE/project/Geometry8_Week2_Class1_Senior_V4_Final.py" "$BASE/project/Geometry8_Week2_Class1_Senior_V5_Final.py"
          patch -d "$BASE/project" -p0 < "$BASE/v5_labels.patch"
          mv "$BASE/project/Geometry8_Week2_Class1_Senior_V5_Final.py" "$BASE/project/Geometry8_Week2_Class1_Senior_V5_FINAL.py"
          cat "$V6/v6_patch.part00" "$V6/v6_patch.part01" > /tmp/v6_patch.b64
          base64 -d /tmp/v6_patch.b64 > /tmp/v6_patch.xz
          xz -dc /tmp/v6_patch.xz > /tmp/v6_update.patch
          patch -d "$BASE/project" -p0 < /tmp/v6_update.patch
          mv "$BASE/project/Geometry8_Week2_Class1_Senior_V5_FINAL.py" "$BASE/project/Geometry8_Week2_Class1_Senior_V6_FINAL.py"
          find "$BASE/project" -maxdepth 1 -type f -print

      - name: Validate Python sources and JP style
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_week2_v4_20260809/project
          python -m py_compile \
            "$JOB/Geometry8_Week2_Class1_Senior_V6_FINAL.py" \
            "$JOB/jp_classroom_style.py"
          python "$JOB/check_manim_style.py" "$JOB/Geometry8_Week2_Class1_Senior_V6_FINAL.py"
          ! grep -nE '([A-Za-z]:\\\\|/Users/|/home/[^/]+/Desktop)' "$JOB/Geometry8_Week2_Class1_Senior_V6_FINAL.py" "$JOB/jp_classroom_style.py"

      - name: Pull official ManimCE 0.20.1 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Render PQL then literal PQH
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          JOB=render_jobs/geometry8_week2_v4_20260809/project
          FILE=Geometry8_Week2_Class1_Senior_V6_FINAL.py
          SCENE=Geometry8Week2SeniorV6
          SLUG=Geometry8_Week2_Class1_Senior_V6_FINAL
          IMAGE=manimcommunity/manim:v0.20.1
          rm -rf delivery_geometry8_week2_v6 qa_geometry8_week2_v6 media
          mkdir -p delivery_geometry8_week2_v6 qa_geometry8_week2_v6

          echo '===== PREVIEW -pql ====='
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash "$IMAGE" \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql "'$JOB'/'$FILE'" "'$SCENE'" --format=mp4 --disable_caching
            ' 2>&1 | tee delivery_geometry8_week2_v6/render_pql.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi
          PREVIEW="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          cp "$PREVIEW" "delivery_geometry8_week2_v6/${SLUG}_pql.mp4"

          echo '===== FINAL literal -pqh ====='
          rm -rf media
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash "$IMAGE" \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh "'$JOB'/'$FILE'" "'$SCENE'" --format=mp4 --disable_caching
            ' 2>&1 | tee delivery_geometry8_week2_v6/render_pqh.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi

          FINAL="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" "delivery_geometry8_week2_v6/${SLUG}_pqh.mp4"
          cp "$JOB/$FILE" delivery_geometry8_week2_v6/
          cp "$JOB/jp_classroom_style.py" delivery_geometry8_week2_v6/
          cp "$JOB/check_manim_style.py" delivery_geometry8_week2_v6/

          OUT="delivery_geometry8_week2_v6/${SLUG}_pqh.mp4"
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 "$OUT" \
            > delivery_geometry8_week2_v6/ffprobe.txt
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$OUT")" = 1920
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT")" = 1080
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$OUT")" = 30/1
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$OUT")" = h264
          ffmpeg -nostdin -v error -i "$OUT" -f null - 2> delivery_geometry8_week2_v6/full_decode.log

          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT")"
          SAMPLE="$(python -c "d=float('$DUR'); print(max(0.001,36.0/max(d,0.001)))")"
          ffmpeg -nostdin -y -v error -i "$OUT" \
            -vf "fps=$SAMPLE,scale=480:-1,tile=6x6:padding=8:margin=8" \
            -frames:v 1 qa_geometry8_week2_v6/contact_sheet.jpg || true
          sha256sum "$OUT" > delivery_geometry8_week2_v6/SHA256SUMS.txt
          printf 'Scene: %s\nSource: %s\nManimCE: 0.20.1\nPreview: manim -pql %s %s --format=mp4 --disable_caching\nFinal: manim -pqh %s %s --format=mp4 --disable_caching\n' \
            "$SCENE" "$FILE" "$FILE" "$SCENE" "$FILE" "$SCENE" \
            > delivery_geometry8_week2_v6/RENDER_INFO.txt

      - name: Upload package and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Geometry8_Period3_Week2_V6_Senior_Final_PQH
          path: |
            delivery_geometry8_week2_v6/
            qa_geometry8_week2_v6/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve failure status
        if: steps.render.outcome != 'success'
        shell: bash
        run: exit 1
