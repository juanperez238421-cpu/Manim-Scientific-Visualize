name: Render Statics PQH

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Reconstruct and validate source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            render_jobs/statics_source.py.gz.b64.part1 \
            render_jobs/statics_source.py.gz.b64.part2 \
            | base64 --decode \
            | gzip --decompress \
            > Statics_Week_VectorDecomposition_RightTriangles_Fixed.py
          python -m py_compile Statics_Week_VectorDecomposition_RightTriangles_Fixed.py
          test -s Statics_Week_VectorDecomposition_RightTriangles_Fixed.py
          mkdir -p media
          wc -c Statics_Week_VectorDecomposition_RightTriangles_Fixed.py

      - name: Pull official ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --quiet manimcommunity/manim:v0.20.1

      - name: Render full scene with literal -pqh
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e JR_REAL_TIMER=0 \
            -e JR_SHOW_ANSWER_KEY=0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c 'set -euo pipefail; mkdir -p "$HOME" /tmp/colab-bin; echo "Manim binary: $(command -v manim)"; manim --version; printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open; chmod +x /tmp/colab-bin/xdg-open; export PATH="/tmp/colab-bin:$PATH"; manim -pqh Statics_Week_VectorDecomposition_RightTriangles_Fixed.py Statics_Week_VectorDecomposition_Full --format=mp4 --disable_caching' \
            > render.log 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Manim exit code: $STATUS"
          exit "$STATUS"

      - name: Prepare render diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          if [[ -f render.log ]]; then
            cp render.log diagnostics/render.log
            grep -nE 'Traceback|Error|Exception|File ".*\.py"|TypeError|ValueError|AttributeError|IndexError|KeyError|RuntimeError|PermissionError' render.log \
              | tail -n 120 > diagnostics/error_summary.txt || true
            tail -n 160 render.log > diagnostics/render_tail.txt
            echo '--- ERROR SUMMARY ---'
            cat diagnostics/error_summary.txt || true
            echo '--- RENDER TAIL ---'
            cat diagnostics/render_tail.txt || true
          else
            echo 'render.log was not created' > diagnostics/error_summary.txt
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Statics_PQH_diagnostics
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7

      - name: Verify rendered MP4
        if: steps.render.outcome == 'success'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find media -type f -name 'Statics_Week_VectorDecomposition_Full.mp4' -print -quit)"
          test -n "$VIDEO"
          test -s "$VIDEO"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          ls -lh "$VIDEO"
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

      - name: Stage final delivery
        if: steps.render.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp "${{ steps.verify.outputs.video }}" delivery/Statics_Week_VectorDecomposition_Full_pqh.mp4
          cp Statics_Week_VectorDecomposition_RightTriangles_Fixed.py delivery/
          sha256sum delivery/* > delivery/SHA256SUMS.txt

      - name: Upload PQH video artifact
        if: steps.render.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Statics_Week_VectorDecomposition_Full_pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7

      - name: Fail job when render failed
        if: steps.render.outcome == 'failure'
        shell: bash
        run: exit 1
