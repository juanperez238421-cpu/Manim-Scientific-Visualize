name: Diedric ISO NTC1777 V2 Senior PQH 20260908

on:
  push:
    branches:
      - manim/diedric-iso-ntc1777-v2-senior-20260908
    paths:
      - .github/workflows/diedric_iso_ntc1777_v2_senior_pqh_20260908.yml
      - render_jobs/technical_drawing_diedric_iso_v2_20260908/diedric_iso_ntc1777_v2.py

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: manim/diedric-iso-ntc1777-v2-senior-20260908
          fetch-depth: 0

      - name: Validate senior source
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v2_20260908/diedric_iso_ntc1777_v2.py
          python -m py_compile "$SRC"
          grep -q 'class DiedricISOProjectionV2Senior' "$SRC"
          grep -q 'FIRST-ANGLE PROJECTION' "$SRC"
          grep -q 'THIRD-ANGLE PROJECTION' "$SRC"
          grep -q 'NTC 1777:2001' "$SRC"
          grep -q 'NTC 1915:1984' "$SRC"
          grep -q 'QUICK CHECK' "$SRC"
          grep -q 'TransformFromCopy' "$SRC"
          ! grep -Eq '[A-Za-z]:\\|/Users/|/home/[^/]+/' "$SRC"

      - name: Install render and QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip zip
          python -m pip install --quiet pillow numpy
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL QA render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v2_20260908/diedric_iso_ntc1777_v2.py
          SCENE=DiedricISOProjectionV2Senior
          rm -rf media_pql qa_pql
          mkdir -p qa_pql
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.045 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pql $SRC $SCENE --fps 15 --format=mp4 --media_dir media_pql --disable_caching" \
            2>&1 | tee qa_pql/pql.log
          PQL="$(find media_pql -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$PQL"
          test -s "$PQL"
          ffmpeg -nostdin -v error -i "$PQL" -f null - 2> qa_pql/pql_decode.log

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v2_20260908/diedric_iso_ntc1777_v2.py
          SCENE=DiedricISOProjectionV2Senior
          OUT=deliverables/technical_drawing_diedric_iso_v2_20260908
          rm -rf media "$OUT"
          mkdir -p "$OUT"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.25 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pqh $SRC $SCENE --fps 30 --format=mp4 --media_dir media --disable_caching" \
            2>&1 | tee "$OUT/pqh.log"
          FINAL="$(find media -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$FINAL"
          test -s "$FINAL"
          cp "$FINAL" "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V2_SENIOR_QA_FINAL_pqh.mp4"

      - name: Senior technical QA and visual sampling
        shell: bash
        run: |
          set -euo pipefail
          OUT=deliverables/technical_drawing_diedric_iso_v2_20260908
          F="$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V2_SENIOR_QA_FINAL_pqh.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          awk -v d="$DUR" 'BEGIN { if (d < 190 || d > 380) exit 1; }'
          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/decode.log"

          mkdir -p "$OUT/qa_frames"
          for FRAC in 0.025 0.075 0.125 0.175 0.225 0.275 0.325 0.375 0.425 0.475 0.525 0.575 0.625 0.675 0.725 0.775 0.825 0.875 0.925 0.975; do
            T="$(awk -v d="$DUR" -v f="$FRAC" 'BEGIN{printf "%.2f",d*f}')"
            TAG="$(printf '%s' "$FRAC" | tr -d '.')"
            ffmpeg -y -ss "$T" -i "$F" -frames:v 1 "$OUT/qa_frames/frame_${TAG}.png" >/dev/null 2>&1
          done
          ffmpeg -y -pattern_type glob -i "$OUT/qa_frames/frame_*.png" \
            -vf 'scale=384:-1,tile=5x4:padding=8:margin=8:color=white' \
            -frames:v 1 "$OUT/qa_contact_sheet.jpg" >/dev/null 2>&1

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          frames=sorted(Path('deliverables/technical_drawing_diedric_iso_v2_20260908/qa_frames').glob('*.png'))
          rows=[]
          nonblank=0
          for p in frames:
              a=np.asarray(Image.open(p).convert('RGB'),dtype=np.int16)
              delta=np.abs(255-a).mean(axis=2)
              ratio=float((delta>12).mean())
              rows.append((p.name,ratio))
              if ratio>0.008:
                  nonblank+=1
          out=Path('deliverables/technical_drawing_diedric_iso_v2_20260908/VISUAL_DENSITY_QA.tsv')
          out.write_text('frame\tnonwhite_ratio\n'+'\n'.join(f'{n}\t{r:.6f}' for n,r in rows)+'\n',encoding='utf-8')
          print('Nonblank sampled frames:',nonblank,'/',len(frames))
          if nonblank < 16:
              raise SystemExit('Too many nearly blank sampled frames')
          PY

          sha256sum "$F" > "$OUT/SHA256SUMS.txt"
          cp render_jobs/technical_drawing_diedric_iso_v2_20260908/diedric_iso_ntc1777_v2.py "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V2_source.py"
          cat > "$OUT/RENDER_INFO.txt" <<'EOF'
          V2 Senior QA revision of the Sistema diedrico lesson.
          Improvements over V1: richer pseudo-3D stepped part, color-coded projection planes, animated projection rays, explicit plane-to-sheet transfer, six-view walkaround, step-by-step first/third-angle pipelines, large view layouts, dynamic comparison, projection symbols, Colombia normative context, 6-step reading method, and an 8-second student prediction challenge.
          Terminology: ISO E / first-angle; ISO A / third-angle as classroom labels.
          Normative wording: NTC 1777 is a Colombian technical standard, not legislation by itself. NTC 1777:2001 recognizes first-angle and third-angle methods. The lesson also retains the prior 2026 ICONTEC catalog cross-check for NTC 1915:1984 Building drawing - Projection methods.
          ManimCE: 0.20.1
          Pipeline: literal -pql QA then literal -pqh final
          Final pedagogical timing scale: 1.25 (expanded pauses and transitions).
          Output: 1920x1080, 30 fps, H.264, yuv420p
          QA: full decode + 20 evenly distributed frame samples + contact sheet + visual-density gate.
          EOF
          (cd "$OUT" && zip -9 -r TechnicalDrawing_Diedric_V2_SENIOR_FULL_TOTAL_PACKAGE.zip \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V2_SENIOR_QA_FINAL_pqh.mp4 \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V2_source.py \
            VIDEO_TECHNICAL.tsv VISUAL_DENSITY_QA.tsv SHA256SUMS.txt RENDER_INFO.txt decode.log pqh.log qa_contact_sheet.jpg qa_frames)
          test -s "$OUT/TechnicalDrawing_Diedric_V2_SENIOR_FULL_TOTAL_PACKAGE.zip"

      - name: Persist final V2 delivery to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/technical_drawing_diedric_iso_v2_20260908
          if ! git diff --cached --quiet; then
            git commit -m "render: persist diedric V2 senior QA PQH delivery [skip ci]"
            git push origin HEAD:manim/diedric-iso-ntc1777-v2-senior-20260908
          fi

      - name: Upload V2 delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIEDRIC-ISO-V2-SENIOR-QA-PQH
          path: deliverables/technical_drawing_diedric_iso_v2_20260908/
          if-no-files-found: error
          retention-days: 7
