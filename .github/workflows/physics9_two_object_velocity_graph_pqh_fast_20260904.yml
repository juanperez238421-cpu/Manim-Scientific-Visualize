name: Physics 9 Two-Object Velocity Graph FAST SENIOR PQH 20260904

on:
  push:
    branches:
      - render/physics9-two-object-velocity-graph-fast-20260904
    paths:
      - 'render_jobs/physics9_two_object_velocity_graph_20260904/**'
      - '.github/workflows/physics9_two_object_velocity_graph_pqh_fast_20260904.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render/physics9-two-object-velocity-graph-fast-20260904

      - name: Validate source and exact exercise values
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_two_object_velocity_graph_20260904
          SRC="$JOB/physics9_two_object_velocity_graph.py"
          BASE2=render_jobs/physics9_two_object_meeting_xt_v2_20260831/two_object_meeting_xt_v2.py
          BASE1=render_jobs/physics9_two_object_meeting_xt_20260831/two_object_meeting_xt.py
          STYLE=render_jobs/physics9_position_time_velocity_workshop_20260824/jp_classroom_style.py
          test -s "$SRC"; test -s "$BASE2"; test -s "$BASE1"; test -s "$STYLE"
          python -m py_compile "$SRC" "$BASE2" "$BASE1" "$STYLE"
          grep -q 'class Physics9TwoObjectVelocityGraph' "$SRC"
          grep -q 'v_A=+2' "$SRC"
          grep -q 'v_B=-1' "$SRC"
          grep -q 'x: 1, 3, 5, 7, 9, 11 m' "$SRC"
          grep -q 'x: 13, 12, 11, 10, 9, 8 m' "$SRC"
          mkdir -p qa_preview
          sha256sum "$SRC" "$BASE2" "$BASE1" "$STYLE" > qa_preview/SOURCE_SHA256SUMS.txt

      - name: Check host tools and pull pinned ManimCE image with visible progress
        shell: bash
        run: |
          set -euo pipefail
          echo 'Host tool check:'
          missing=0
          for cmd in docker ffmpeg ffprobe zip montage; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "  OK: $cmd -> $(command -v "$cmd")"
            else
              echo "  MISSING: $cmd"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'Installing only missing QA dependencies with hard timeouts...'
            timeout 5m sudo apt-get update -qq
            timeout 5m sudo apt-get install -y -qq ffmpeg zip imagemagick
          fi
          docker --version
          echo 'Pulling manimcommunity/manim:v0.20.1 (progress intentionally visible)...'
          timeout 15m docker pull manimcommunity/manim:v0.20.1

      - name: Literal PQL runtime gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_two_object_velocity_graph_20260904
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.06 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql physics9_two_object_velocity_graph.py Physics9TwoObjectVelocityGraph \
                --format=mp4 --media_dir=/manim/media_pql --disable_caching
            ' 2>&1 | tee qa_preview/render_pql.log
          PQL="$(find media_pql -type f -name 'Physics9TwoObjectVelocityGraph.mp4' -print -quit)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_two_object_velocity_graph_20260904
          rm -rf media_pqh final_out package
          mkdir -p final_out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh physics9_two_object_velocity_graph.py Physics9TwoObjectVelocityGraph \
                --format=mp4 --media_dir=/manim/media_pqh --disable_caching
            ' 2>&1 | tee final_out/render_pqh.log
          FINAL="$(find media_pqh -type f -name 'Physics9TwoObjectVelocityGraph.mp4' -print -quit)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" final_out/Physics9_Two_Object_Velocity_Graph_SENIOR_FINAL_pqh.mp4

      - name: Technical QA and full decode
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Two_Object_Velocity_Graph_SENIOR_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tframes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$FRAMES" > final_out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920; test "$H" = 1080; test "$FPS" = 30/1; test "$CODEC" = h264; test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> final_out/full_decode.log
          test ! -s final_out/full_decode.log
          sha256sum "$F" > final_out/SHA256SUMS.txt

      - name: Every-frame density and border scan
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Two_Object_Velocity_Graph_SENIOR_FINAL_pqh.mp4
          ffmpeg -nostdin -v error -i "$F" -vf scale=320:180 -pix_fmt gray -f rawvideo final_out/all_frames_gray.raw
          python - <<'PY'
          from pathlib import Path
          W,H=320,180; B=W*H
          raw=Path('final_out/all_frames_gray.raw').read_bytes(); assert len(raw)%B==0
          n=len(raw)//B; blank=sparse=border_heavy=0
          border_idx=[y*W+x for y in range(H) for x in range(W) if x<5 or x>=W-5 or y<5 or y>=H-5]
          for i in range(n):
              fr=raw[i*B:(i+1)*B]
              dark_n=sum(p<245 for p in fr); frac=dark_n/B
              if dark_n==0: blank+=1
              if frac<0.004: sparse+=1
              border=sum(fr[j]<235 for j in border_idx)
              if border/max(dark_n,1)>0.20 and dark_n>200: border_heavy+=1
          Path('final_out/FRAME_SCAN_SUMMARY.txt').write_text(
              f'frames_scanned={n}\nblank_frames={blank}\nvery_sparse_frames={sparse}\nborder_heavy_frames={border_heavy}\n')
          assert blank < n*0.10
          assert sparse < n*0.15
          assert border_heavy < n*0.03
          PY
          rm final_out/all_frames_gray.raw

      - name: 72-frame visual audit contact sheet
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Two_Object_Velocity_Graph_SENIOR_FINAL_pqh.mp4
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          mkdir -p final_out/audit_frames
          for INDEX in $(seq -w 0 71); do
            T="$(python -c "print(float('$DUR')*(int('$INDEX')+0.5)/72.0)")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "final_out/audit_frames/frame_${INDEX}.png"
          done
          montage final_out/audit_frames/*.png \
            -thumbnail 384x216 -tile 6x12 -geometry +8+14 -background white -quality 90 final_out/CONTACT_SHEET_72.jpg
          test -s final_out/CONTACT_SHEET_72.jpg

      - name: Package and publish direct GitHub delivery
        shell: bash
        run: |
          set -euo pipefail
          ROOT=package/Physics9_Two_Object_Velocity_Graph_SENIOR_FINAL_PQH_PROJECT
          mkdir -p "$ROOT/src" "$ROOT/qa" "$ROOT/workflow"
          cp render_jobs/physics9_two_object_velocity_graph_20260904/physics9_two_object_velocity_graph.py "$ROOT/src/"
          cp render_jobs/physics9_two_object_meeting_xt_v2_20260831/two_object_meeting_xt_v2.py "$ROOT/src/"
          cp render_jobs/physics9_two_object_meeting_xt_20260831/two_object_meeting_xt.py "$ROOT/src/"
          cp render_jobs/physics9_position_time_velocity_workshop_20260824/jp_classroom_style.py "$ROOT/src/"
          cp final_out/Physics9_Two_Object_Velocity_Graph_SENIOR_FINAL_pqh.mp4 "$ROOT/render.mp4"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/SHA256SUMS.txt final_out/full_decode.log \
             final_out/render_pqh.log final_out/FRAME_SCAN_SUMMARY.txt final_out/CONTACT_SHEET_72.jpg "$ROOT/qa/"
          cp .github/workflows/physics9_two_object_velocity_graph_pqh_fast_20260904.yml "$ROOT/workflow/"
          (cd package && zip -qr Physics9_Two_Object_Velocity_Graph_SENIOR_FINAL_PQH_PROJECT.zip Physics9_Two_Object_Velocity_Graph_SENIOR_FINAL_PQH_PROJECT)
          sha256sum package/Physics9_Two_Object_Velocity_Graph_SENIOR_FINAL_PQH_PROJECT.zip > package/PACKAGE_SHA256.txt

          DEST=deliveries/physics9_two_object_velocity_graph_fast_20260904
          mkdir -p "$DEST"
          cp final_out/Physics9_Two_Object_Velocity_Graph_SENIOR_FINAL_pqh.mp4 "$DEST/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/SHA256SUMS.txt final_out/FRAME_SCAN_SUMMARY.txt final_out/CONTACT_SHEET_72.jpg "$DEST/"
          cp package/Physics9_Two_Object_Velocity_Graph_SENIOR_FINAL_PQH_PROJECT.zip "$DEST/"
          cp package/PACKAGE_SHA256.txt "$DEST/"

          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m 'render: publish Physics 9 two-object velocity graph fast senior PQH'
            git push origin HEAD:render/physics9-two-object-velocity-graph-fast-20260904
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Physics9-Two-Object-Velocity-Graph-FAST-SENIOR-FINAL-PQH
          path: |
            final_out/Physics9_Two_Object_Velocity_Graph_SENIOR_FINAL_pqh.mp4
            package/Physics9_Two_Object_Velocity_Graph_SENIOR_FINAL_PQH_PROJECT.zip
            package/PACKAGE_SHA256.txt
            final_out/VIDEO_TECHNICAL.tsv
            final_out/SHA256SUMS.txt
            final_out/FRAME_SCAN_SUMMARY.txt
            final_out/CONTACT_SHEET_72.jpg
          if-no-files-found: error
          retention-days: 14
