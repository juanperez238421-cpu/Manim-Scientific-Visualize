name: Dibujo Tecnico V13 PUBLISH RECOVERY

on:
  push:
    branches:
      - render/dibujo-tecnico-3d-to-2d-v13-fluid-stepwise-pauses-20260909
    paths:
      - '.github/workflows/dibujo_tecnico_3d_to_2d_v13_publish_recovery_20260909.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-validated-v13:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Recover already-rendered and QA-passed V13 artifact
        uses: actions/download-artifact@v4
        with:
          name: Diedrico_3D_to_2D_V13_FLUID_STEPWISE_FULL_TOTAL
          path: recovered
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34390647703

      - name: Locate and verify recovered PQH MP4
        id: tech
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find recovered -type f -name 'Diedrico_3D_to_2D_V13_FLUID_STEPWISE.mp4' -print -quit)"
          test -n "$VIDEO" && test -s "$VIDEO"
          echo "Recovered: $VIDEO"
          python - "$VIDEO" <<'PY' | tee V13_RECOVERY_QA.txt
          import os, subprocess, sys
          p=sys.argv[1]
          probe=subprocess.check_output([
              'ffprobe','-v','error','-select_streams','v:0',
              '-show_entries','stream=codec_name,width,height,pix_fmt,avg_frame_rate:format=duration',
              '-of','default=noprint_wrappers=1',p
          ], text=True)
          print(probe)
          size=os.path.getsize(p)
          assert 'codec_name=h264' in probe
          assert 'width=1920' in probe and 'height=1080' in probe
          assert 'pix_fmt=yuv420p' in probe
          assert 'avg_frame_rate=30/1' in probe
          duration=float([x.split('=',1)[1] for x in probe.splitlines() if x.startswith('duration=')][0])
          assert duration > 150.0, duration
          assert size > 2_000_000, size
          subprocess.check_call(['ffmpeg','-v','error','-i',p,'-f','null','-'])
          print(f'bytes={size}')
          print('V13_RECOVERED_FULL_DECODE=PASS')
          PY
          SHA="$(sha256sum "$VIDEO" | awk '{print $1}')"
          SIZE="$(stat -c%s "$VIDEO")"
          echo "$SHA  $VIDEO" | tee V13_RECOVERY_SHA256.txt
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Publish exact validated V13 MP4 through GitHub Git Data API
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_PATH: ${{ steps.tech.outputs.video }}
          EXPECTED_SHA: ${{ steps.tech.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.tech.outputs.size }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.parse, urllib.request
          token=os.environ['GH_TOKEN']
          repo=os.environ['GITHUB_REPOSITORY']
          branch=os.environ['GITHUB_REF_NAME']
          expected_sha=os.environ['EXPECTED_SHA']
          expected_size=int(os.environ['EXPECTED_SIZE'])
          video=open(os.environ['VIDEO_PATH'],'rb').read()
          source_path='render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V13_FLUID_STEPWISE.py'
          source=open(source_path,'rb').read()
          assert len(video)==expected_size
          assert hashlib.sha256(video).hexdigest()==expected_sha
          api=f'https://api.github.com/repos/{repo}'
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
          }
          def req(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(url,data=data,method=method,headers=headers)
              if data is not None:
                  r.add_header('Content-Type','application/json')
              with urllib.request.urlopen(r,timeout=180) as f:
                  body=f.read()
                  return json.loads(body) if body else {}
          vblob=req('POST',f'{api}/git/blobs',{'content':base64.b64encode(video).decode(),'encoding':'base64'})
          sblob=req('POST',f'{api}/git/blobs',{'content':base64.b64encode(source).decode(),'encoding':'base64'})
          ref_path=urllib.parse.quote(branch,safe='/')
          ref=req('GET',f'{api}/git/ref/heads/{ref_path}')
          parent=ref['object']['sha']
          base=req('GET',f'{api}/git/commits/{parent}')
          entries=[
              {'path':'published_renders/Diedrico_3D_to_2D_V13_FLUID_STEPWISE.mp4','mode':'100644','type':'blob','sha':vblob['sha']},
              {'path':'published_renders/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V13_FLUID_STEPWISE_FINAL_pqh.mp4','mode':'100644','type':'blob','sha':vblob['sha']},
              {'path':source_path,'mode':'100644','type':'blob','sha':sblob['sha']},
          ]
          tree=req('POST',f'{api}/git/trees',{'base_tree':base['tree']['sha'],'tree':entries})
          commit=req('POST',f'{api}/git/commits',{
              'message':'Publish validated V13 fluid stepwise PQH render',
              'tree':tree['sha'],
              'parents':[parent],
          })
          req('PATCH',f'{api}/git/refs/heads/{ref_path}',{'sha':commit['sha'],'force':False})
          open('V13_PUBLISHED_COMMIT.txt','w').write(commit['sha']+'\n')
          print('PUBLISHED_COMMIT='+commit['sha'])
          print('V13_GITHUB_PUBLICATION=PASS')
          PY
          PUB="$(cat V13_PUBLISHED_COMMIT.txt)"
          echo "commit=$PUB" >> "$GITHUB_OUTPUT"

      - name: Verify commit-pinned GitHub MP4 byte-for-byte
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.tech.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.tech.outputs.size }}
          PUB_COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee V13_DIRECT_REDOWNLOAD_QA.txt
          import hashlib, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          commit=os.environ['PUB_COMMIT']
          sha=os.environ['EXPECTED_SHA']
          size=int(os.environ['EXPECTED_SIZE'])
          paths=[
              'published_renders/Diedrico_3D_to_2D_V13_FLUID_STEPWISE.mp4',
              'published_renders/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V13_FLUID_STEPWISE_FINAL_pqh.mp4',
          ]
          for path in paths:
              url=f'https://raw.githubusercontent.com/{repo}/{commit}/{path}'
              with urllib.request.urlopen(url,timeout=180) as r:
                  data=r.read()
              got=hashlib.sha256(data).hexdigest()
              print(url)
              print(f'bytes={len(data)} sha256={got}')
              assert len(data)==size, (len(data),size)
              assert got==sha, (got,sha)
          dl=f'https://github.com/{repo}/raw/{commit}/published_renders/Diedrico_3D_to_2D_V13_FLUID_STEPWISE.mp4?download=1'
          open('V13_DIRECT_DOWNLOAD_URL.txt','w').write(dl+'\n')
          print('DOWNLOAD_URL='+dl)
          print('V13_DIRECT_REDOWNLOAD=PASS')
          PY

      - name: Upload V13 publication proof
        uses: actions/upload-artifact@v4
        with:
          name: Diedrico_3D_to_2D_V13_PUBLICATION_PROOF
          path: |
            V13_RECOVERY_QA.txt
            V13_RECOVERY_SHA256.txt
            V13_PUBLISHED_COMMIT.txt
            V13_DIRECT_REDOWNLOAD_QA.txt
            V13_DIRECT_DOWNLOAD_URL.txt
          if-no-files-found: error
          retention-days: 7
