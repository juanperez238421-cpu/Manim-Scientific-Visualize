name: Geometry 8 Circle Exercises Workshop V5 Large Text Diagnostic 20260824

on:
  pull_request:
    branches: [agent/geometry8-circle-measurement-area-20260823]
    paths:
      - 'render_jobs/geometry8_circle_exercises_20260824/diagnose_v5_large_text.sh'
      - 'render_jobs/geometry8_circle_exercises_20260824/Geometry8_Circle_Exercises_Workshop_20260824_V5_LargeText_QA.py'
      - '.github/workflows/geometry8_circle_exercises_workshop_v5_large_text_diag_20260824.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-v5-large-text:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Concise PQL diagnostic
        shell: bash
        run: bash render_jobs/geometry8_circle_exercises_20260824/diagnose_v5_large_text.sh
