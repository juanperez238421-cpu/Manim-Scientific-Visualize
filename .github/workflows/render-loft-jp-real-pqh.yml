name: Render Loft JP Real PQH

on:
  push:
    branches:
      - 'render/loft-jp-real-pqh-20260812'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Decode exact source and JP style
        shell: bash
        run: |
          set -euo pipefail
          base64 -d render_payload/loft_render_payload.b64 | tar -xzf -
          ls -lh Inventor_Solevacion_Loft_JP_REAL_PQH.py jp_classroom_style.py

      - name: Protocol preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile Inventor_Solevacion_Loft_JP_REAL_PQH.py jp_classroom_style.py
          grep -nE '^class .*(JPMathClassroomScene|JPThreeDClassroomScene|JPStyledThreeDScene)' Inventor_Solevacion_Loft_JP_REAL_PQH.py
          if grep -nE '([A-Za-z]:\\|/Users/|/home/[^/]+/Desktop)' Inventor_Solevacion_Loft_JP_REAL_PQH.py; then
            echo 'Absolute path detected' >&2
            exit 1
          fi
          mkdir -p delivery/logs delivery/frames
          chmod -R a+rwX .

      - name: Pull exact ManimCE 0.20.1 image
        shell: bash
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Protocol PQL validation — all scenes
        shell: bash
        run: |
          set -euo pipefail
          SCENES=(LoftTheoryJP LoftSimpleJP3D LoftExercise1JP3D LoftExercise2JP3D LoftSummaryJP)
          for scene in "${SCENES[@]}"; do
            echo "=== PQL ${scene} ==="
            docker run --rm \
              -e HOME=/tmp/manim-home \
              -e LESSON_TIME_SCALE=0.20 \
              -v "$PWD:/manim" -w /manim \
              --entrypoint bash \
              manimcommunity/manim:v0.20.1 \
              -c 'set -euo pipefail; mkdir -p /tmp/bin; printf "#!/bin/sh\nexit 0\n" > /tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH="/tmp/bin:$PATH"; manim -pql Inventor_Solevacion_Loft_JP_REAL_PQH.py '"${scene}"' --format=mp4 --disable_caching' \
              2>&1 | tee "delivery/logs/pql_${scene}.log"
          done

      - name: Protocol PQH final — all scenes
        shell: bash
        run: |
          set -euo pipefail
          SCENES=(LoftTheoryJP LoftSimpleJP3D LoftExercise1JP3D LoftExercise2JP3D LoftSummaryJP)
          for scene in "${SCENES[@]}"; do
            echo "=== PQH ${scene} ==="
            docker run --rm \
              -e HOME=/tmp/manim-home \
              -e LESSON_TIME_SCALE=1.0 \
              -v "$PWD:/manim" -w /manim \
              --entrypoint bash \
              manimcommunity/manim:v0.20.1 \
              -c 'set -euo pipefail; mkdir -p /tmp/bin; printf "#!/bin/sh\nexit 0\n" > /tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH="/tmp/bin:$PATH"; manim -pqh Inventor_Solevacion_Loft_JP_REAL_PQH.py '"${scene}"' --format=mp4 --disable_caching' \
              2>&1 | tee "delivery/logs/pqh_${scene}.log"
          done

      - name: Locate verified PQH scene videos and assemble
        shell: bash
        run: |
          set -euo pipefail
          SCENES=(LoftTheoryJP LoftSimpleJP3D LoftExercise1JP3D LoftExercise2JP3D LoftSummaryJP)
          find media -type f -name '*.mp4' -print | sort | tee delivery/all_mp4_files.txt
          : > delivery/concat.txt
          for scene in "${SCENES[@]}"; do
            video=""
            while IFS= read -r candidate; do
              test -s "$candidate" || continue
              width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$candidate" || true)"
              height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$candidate" || true)"
              if [ "$width" = "1920" ] && [ "$height" = "1080" ]; then
                video="$candidate"
                break
              fi
            done < <(find media -type f -name "${scene}.mp4" | sort -r)
            if [ -z "$video" ]; then
              video="$(find media -type f -name "${scene}.mp4" | sort -r | head -n 1)"
            fi
            test -n "$video"
            test -s "$video"
            echo "Selected ${scene}: ${video}"
            echo "file '$PWD/$video'" >> delivery/concat.txt
            ffprobe -v error \
              -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 "$video" \
              > "delivery/${scene}_ffprobe.txt"
          done
          ffmpeg -y -f concat -safe 0 -i delivery/concat.txt \
            -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -r 30 -an \
            delivery/Inventor_Solevacion_Loft_JP_REAL_PQH.mp4

      - name: Final protocol verification
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=delivery/Inventor_Solevacion_Loft_JP_REAL_PQH.mp4
          test -s "$VIDEO"
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of json "$VIDEO" > delivery/ffprobe.json
          ffmpeg -v error -i "$VIDEO" -f null -
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO")"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$VIDEO")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$VIDEO")"
          test "$WIDTH" = 1920
          test "$HEIGHT" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          sha256sum "$VIDEO" > delivery/sha256.txt
          cp Inventor_Solevacion_Loft_JP_REAL_PQH.py jp_classroom_style.py delivery/
          ffmpeg -y -i "$VIDEO" -vf 'fps=1/20,scale=640:-1,tile=3x3' -frames:v 1 delivery/frames/control_sheet.jpg
          {
            echo 'Render completed correctly.'
            echo
            echo 'Source: Inventor_Solevacion_Loft_JP_REAL_PQH.py'
            echo 'Style: exact jp_classroom_style.py from supplied file'
            echo 'ManimCE: 0.20.1 official Docker image'
            echo 'PQL: executed successfully for all five scenes'
            echo 'PQH: executed literally and successfully for all five scenes'
            echo 'Assembly: only genuine PQH scene outputs'
            echo 'Final: 1920x1080, 30 fps, H.264, yuv420p'
            echo
            cat delivery/sha256.txt
          } > delivery/RENDER_SUCCESS.txt

      - name: Upload verified delivery
        uses: actions/upload-artifact@v4
        with:
          name: Inventor_Solevacion_Loft_JP_REAL_PQH_delivery
          path: delivery/
          if-no-files-found: error
          retention-days: 7
