name: Render Loft JP Real PQH

on:
  push:
    branches:
      - 'render/loft-jp-real-pqh-20260812'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Decode exact source and JP style
        shell: bash
        run: |
          set -euo pipefail
          base64 -d render_payload/loft_render_payload.b64 | tar -xzf -
          ls -lh Inventor_Solevacion_Loft_JP_REAL_PQH.py jp_classroom_style.py

      - name: Protocol preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile Inventor_Solevacion_Loft_JP_REAL_PQH.py jp_classroom_style.py
          grep -nE '^class .*(JPMathClassroomScene|JPThreeDClassroomScene|JPStyledThreeDScene)' Inventor_Solevacion_Loft_JP_REAL_PQH.py
          if grep -nE '([A-Za-z]:\\|/Users/|/home/[^/]+/Desktop)' Inventor_Solevacion_Loft_JP_REAL_PQH.py; then
            echo 'Absolute path detected' >&2
            exit 1
          fi
          rm -rf preview hq delivery
          mkdir -p preview hq delivery/logs delivery/frames
          chmod -R a+rwX .

      - name: Pull exact ManimCE 0.20.1 image
        shell: bash
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Protocol PQL validation — all scenes
        shell: bash
        run: |
          set -euo pipefail
          SCENES=(LoftTheoryJP LoftSimpleJP3D LoftExercise1JP3D LoftExercise2JP3D LoftSummaryJP)
          for scene in "${SCENES[@]}"; do
            echo "=== PQL ${scene} ==="
            mkdir -p "preview/${scene}"
            chmod -R a+rwX "preview/${scene}"
            docker run --rm \
              -e HOME=/tmp/manim-home \
              -e LESSON_TIME_SCALE=0.20 \
              -e SCENE="${scene}" \
              -e MEDIA_DIR="/manim/preview/${scene}" \
              -v "$PWD:/manim" -w /manim \
              --entrypoint bash \
              manimcommunity/manim:v0.20.1 \
              -c 'set -euo pipefail; mkdir -p /tmp/bin; printf "#!/bin/sh\nexit 0\n" > /tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH="/tmp/bin:$PATH"; manim -pql Inventor_Solevacion_Loft_JP_REAL_PQH.py "$SCENE" --media_dir "$MEDIA_DIR" --format=mp4 --disable_caching' \
              2>&1 | tee "delivery/logs/pql_${scene}.log"
          done

      - name: Protocol PQH final — all scenes
        shell: bash
        run: |
          set -euo pipefail
          SCENES=(LoftTheoryJP LoftSimpleJP3D LoftExercise1JP3D LoftExercise2JP3D LoftSummaryJP)
          for scene in "${SCENES[@]}"; do
            echo "=== PQH ${scene} ==="
            mkdir -p "hq/${scene}"
            chmod -R a+rwX "hq/${scene}"
            docker run --rm \
              -e HOME=/tmp/manim-home \
              -e LESSON_TIME_SCALE=1.0 \
              -e SCENE="${scene}" \
              -e MEDIA_DIR="/manim/hq/${scene}" \
              -v "$PWD:/manim" -w /manim \
              --entrypoint bash \
              manimcommunity/manim:v0.20.1 \
              -c 'set -euo pipefail; mkdir -p /tmp/bin; printf "#!/bin/sh\nexit 0\n" > /tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH="/tmp/bin:$PATH"; manim -pqh Inventor_Solevacion_Loft_JP_REAL_PQH.py "$SCENE" --media_dir "$MEDIA_DIR" --format=mp4 --disable_caching' \
              2>&1 | tee "delivery/logs/pqh_${scene}.log"
          done

      - name: Locate verified HQ scene videos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          scenes = [
              "LoftTheoryJP",
              "LoftSimpleJP3D",
              "LoftExercise1JP3D",
              "LoftExercise2JP3D",
              "LoftSummaryJP",
          ]
          selected = []
          inventory = []
          for scene in scenes:
              root = Path("hq") / scene
              candidates = sorted(root.rglob(f"{scene}.mp4"))
              if not candidates:
                  raise SystemExit(f"No HQ MP4 found for {scene} under {root}")
              valid = []
              for candidate in candidates:
                  if not candidate.is_file() or candidate.stat().st_size == 0:
                      continue
                  probe = subprocess.run(
                      [
                          "ffprobe", "-v", "error", "-select_streams", "v:0",
                          "-show_entries", "stream=codec_name,width,height,r_frame_rate,pix_fmt",
                          "-show_entries", "format=duration,size",
                          "-of", "json", str(candidate),
                      ],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  info = json.loads(probe.stdout)
                  stream = info["streams"][0]
                  inventory.append(f"{candidate} :: {stream['width']}x{stream['height']} :: {info['format'].get('duration','?')}s")
                  if int(stream["width"]) == 1920 and int(stream["height"]) == 1080:
                      valid.append((candidate, info))
              if not valid:
                  raise SystemExit(f"No 1920x1080 HQ output found for {scene}")
              chosen, info = max(valid, key=lambda item: item[0].stat().st_mtime_ns)
              selected.append(chosen)
              Path(f"delivery/{scene}_ffprobe.json").write_text(
                  json.dumps(info, indent=2), encoding="utf-8"
              )
              print(f"Selected {scene}: {chosen}")
          Path("delivery/hq_inventory.txt").write_text("\n".join(inventory) + "\n", encoding="utf-8")
          # Use paths relative to /manim so the same official container can assemble them.
          Path("delivery/concat.txt").write_text(
              "\n".join(f"file '/manim/{p.as_posix()}'" for p in selected) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Assemble only genuine PQH outputs
        shell: bash
        run: |
          set -euo pipefail
          chmod -R a+rwX delivery
          docker run --rm \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c 'set -euo pipefail; ffmpeg -y -f concat -safe 0 -i /manim/delivery/concat.txt -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -r 30 -an /manim/delivery/Inventor_Solevacion_Loft_JP_REAL_PQH.mp4'

      - name: Final protocol verification
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=delivery/Inventor_Solevacion_Loft_JP_REAL_PQH.mp4
          test -s "$VIDEO"
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of json "$VIDEO" > delivery/ffprobe.json
          ffmpeg -v error -i "$VIDEO" -f null -
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO")"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$VIDEO")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$VIDEO")"
          test "$WIDTH" = 1920
          test "$HEIGHT" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          sha256sum "$VIDEO" > delivery/sha256.txt
          cp Inventor_Solevacion_Loft_JP_REAL_PQH.py jp_classroom_style.py delivery/
          ffmpeg -y -i "$VIDEO" -vf 'fps=1/20,scale=640:-1,tile=3x3' -frames:v 1 delivery/frames/control_sheet.jpg
          {
            echo 'Render completed correctly.'
            echo
            echo 'Source: Inventor_Solevacion_Loft_JP_REAL_PQH.py'
            echo 'Style: exact jp_classroom_style.py from supplied file'
            echo 'ManimCE: 0.20.1 official Docker image'
            echo 'PQL: executed successfully for all five scenes in isolated preview directories'
            echo 'PQH: executed literally and successfully for all five scenes in isolated HQ directories'
            echo 'Assembly: only genuine 1920x1080 PQH scene outputs'
            echo 'Final: 1920x1080, 30 fps, H.264, yuv420p'
            echo
            cat delivery/sha256.txt
          } > delivery/RENDER_SUCCESS.txt

      - name: Upload verified delivery
        uses: actions/upload-artifact@v4
        with:
          name: Inventor_Solevacion_Loft_JP_REAL_PQH_delivery
          path: delivery/
          if-no-files-found: error
          retention-days: 7
