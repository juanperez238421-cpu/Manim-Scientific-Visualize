name: Render Loft JP Real PQH

on:
  push:
    branches:
      - 'render/loft-jp-real-pqh-20260812'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Decode exact source and JP style
        shell: bash
        run: |
          set -euo pipefail
          base64 -d render_payload/loft_render_payload.b64 | tar -xzf -
          ls -lh Inventor_Solevacion_Loft_JP_REAL_PQH.py jp_classroom_style.py

      - name: Protocol preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile Inventor_Solevacion_Loft_JP_REAL_PQH.py jp_classroom_style.py
          grep -nE '^class .*(JPMathClassroomScene|JPThreeDClassroomScene|JPStyledThreeDScene)' Inventor_Solevacion_Loft_JP_REAL_PQH.py
          if grep -nE '([A-Za-z]:\\|/Users/|/home/[^/]+/Desktop)' Inventor_Solevacion_Loft_JP_REAL_PQH.py; then
            echo 'Absolute path detected' >&2
            exit 1
          fi
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          rm -rf preview hq delivery
          mkdir -p preview hq delivery/logs delivery/frames delivery/scenes
          chmod -R a+rwX .

      - name: Pull exact ManimCE 0.20.1 image
        shell: bash
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Protocol PQL validation — all scenes
        shell: bash
        run: |
          set -euo pipefail
          SCENES=(LoftTheoryJP LoftSimpleJP3D LoftExercise1JP3D LoftExercise2JP3D LoftSummaryJP)
          for scene in "${SCENES[@]}"; do
            echo "=== PQL ${scene} ==="
            mkdir -p "preview/${scene}"
            chmod -R a+rwX "preview/${scene}"
            docker run --rm \
              -e HOME=/tmp/manim-home \
              -e LESSON_TIME_SCALE=0.20 \
              -e SCENE="${scene}" \
              -e MEDIA_DIR="/manim/preview/${scene}" \
              -v "$PWD:/manim" -w /manim \
              --entrypoint bash \
              manimcommunity/manim:v0.20.1 \
              -c 'set -euo pipefail; mkdir -p /tmp/bin; printf "#!/bin/sh\nexit 0\n" > /tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH="/tmp/bin:$PATH"; manim -pql Inventor_Solevacion_Loft_JP_REAL_PQH.py "$SCENE" --media_dir "$MEDIA_DIR" --format=mp4 --disable_caching' \
              2>&1 | tee "delivery/logs/pql_${scene}.log"
          done

      - name: Protocol PQH final — all scenes and canonicalize outputs
        shell: bash
        run: |
          set -euo pipefail
          SCENES=(LoftTheoryJP LoftSimpleJP3D LoftExercise1JP3D LoftExercise2JP3D LoftSummaryJP)
          for scene in "${SCENES[@]}"; do
            echo "=== PQH ${scene} ==="
            mkdir -p "hq/${scene}"
            chmod -R a+rwX "hq/${scene}"
            docker run --rm \
              -e HOME=/tmp/manim-home \
              -e LESSON_TIME_SCALE=1.0 \
              -e SCENE="${scene}" \
              -e MEDIA_DIR="/manim/hq/${scene}" \
              -v "$PWD:/manim" -w /manim \
              --entrypoint bash \
              manimcommunity/manim:v0.20.1 \
              -c 'set -euo pipefail; mkdir -p /tmp/bin; printf "#!/bin/sh\nexit 0\n" > /tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH="/tmp/bin:$PATH"; manim -pqh Inventor_Solevacion_Loft_JP_REAL_PQH.py "$SCENE" --media_dir "$MEDIA_DIR" --format=mp4 --disable_caching' \
              2>&1 | tee "delivery/logs/pqh_${scene}.log"

            mapfile -t final_candidates < <(find "hq/${scene}" -type f -name '*.mp4' ! -path '*/partial_movie_files/*' | sort)
            printf '%s\n' "${final_candidates[@]}" > "delivery/${scene}_final_candidates.txt"
            if [ "${#final_candidates[@]}" -ne 1 ]; then
              echo "Expected exactly one final MP4 for ${scene}; found ${#final_candidates[@]}" >&2
              find "hq/${scene}" -type f -print | sort >&2
              exit 1
            fi
            cp "${final_candidates[0]}" "delivery/scenes/${scene}.mp4"
            test -s "delivery/scenes/${scene}.mp4"
          done

      - name: Verify canonical PQH scene outputs on runner
        shell: bash
        run: |
          set -euo pipefail
          SCENES=(LoftTheoryJP LoftSimpleJP3D LoftExercise1JP3D LoftExercise2JP3D LoftSummaryJP)
          : > delivery/concat.txt
          for scene in "${SCENES[@]}"; do
            VIDEO="$PWD/delivery/scenes/${scene}.mp4"
            test -s "$VIDEO"
            ffprobe -v error \
              -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
              -show_entries format=duration,size \
              -of json "$VIDEO" > "delivery/${scene}_ffprobe.json"
            WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO" | tr -d '[:space:]')"
            HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO" | tr -d '[:space:]')"
            echo "${scene}: ${WIDTH}x${HEIGHT}"
            test "$WIDTH" = 1920
            test "$HEIGHT" = 1080
            ffmpeg -v error -i "$VIDEO" -f null -
            printf "file '%s'\n" "$VIDEO" >> delivery/concat.txt
          done

      - name: Assemble only genuine PQH outputs
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -f concat -safe 0 -i delivery/concat.txt \
            -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -r 30 -an \
            delivery/Inventor_Solevacion_Loft_JP_REAL_PQH.mp4

      - name: Final protocol verification
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=delivery/Inventor_Solevacion_Loft_JP_REAL_PQH.mp4
          test -s "$VIDEO"
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of json "$VIDEO" > delivery/ffprobe.json
          ffmpeg -v error -i "$VIDEO" -f null -
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO" | tr -d '[:space:]')"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO" | tr -d '[:space:]')"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$VIDEO" | tr -d '[:space:]')"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO" | tr -d '[:space:]')"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$VIDEO" | tr -d '[:space:]')"
          test "$WIDTH" = 1920
          test "$HEIGHT" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          sha256sum "$VIDEO" > delivery/sha256.txt
          cp Inventor_Solevacion_Loft_JP_REAL_PQH.py jp_classroom_style.py delivery/
          ffmpeg -y -i "$VIDEO" -vf 'fps=1/20,scale=640:-1,tile=3x3' -frames:v 1 delivery/frames/control_sheet.jpg
          {
            echo 'Render completed correctly.'
            echo
            echo 'Source: Inventor_Solevacion_Loft_JP_REAL_PQH.py'
            echo 'Style: exact jp_classroom_style.py from supplied file'
            echo 'ManimCE: 0.20.1 official Docker image'
            echo 'PQL: executed successfully for all five scenes in isolated preview directories'
            echo 'PQH: executed literally and successfully for all five scenes in isolated HQ directories'
            echo 'Assembly: canonical final MP4 from each HQ scene; partial_movie_files explicitly excluded'
            echo 'Final: 1920x1080, 30 fps, H.264, yuv420p'
            echo
            cat delivery/sha256.txt
          } > delivery/RENDER_SUCCESS.txt

      - name: Upload verified delivery
        uses: actions/upload-artifact@v4
        with:
          name: Inventor_Solevacion_Loft_JP_REAL_PQH_delivery
          path: delivery/
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug delivery on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Inventor_Solevacion_Loft_JP_REAL_PQH_debug
          path: delivery/
          if-no-files-found: warn
          retention-days: 2
