name: Render Calculus V3 Fix
on:
  push:
    branches: [chatgpt/calc-workshop-auditable-v5-20260813]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg curl
          mkdir -p work delivery qa logs
          cat renders/calc_workshop_auditable_v5/main_part_*.frag > work/main.py
          curl -fsSL 'https://raw.githubusercontent.com/juanperez238421-cpu/Manim-Scientific-Visualize/15ab18494a763e2fc7494aed6cf48743e248bd72/renders/calc_workshop_v4/jp_classroom_style_exact.py' -o work/jp_classroom_style.py
          python -m py_compile work/main.py work/jp_classroom_style.py
          grep -n 'SENIOR QA PATCH V5.1' work/main.py
          cp work/main.py work/jp_classroom_style.py .
      - name: Pull ManimCE
        run: docker pull manimcommunity/manim:v0.20.1
      - name: Preview and final PQH
        run: |
          set -euo pipefail
          IMAGE=manimcommunity/manim:v0.20.1
          SCENE=Video03_Tangentes_Auditable
          for QUALITY in pql pqh; do
            rm -rf media
            SCALE=1.0; [ "$QUALITY" = pql ] && SCALE=0.12
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=$SCALE -v "$PWD:/manim" -w /manim --entrypoint bash "$IMAGE" -c "mkdir -p /tmp/bin; printf '#!/bin/sh\\nexit 0\\n' >/tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH=/tmp/bin:\$PATH; manim -$QUALITY main.py $SCENE --format=mp4 --disable_caching" 2>&1 | tee "logs/${QUALITY}.log"
            FILE="$(find media -type f -name "${SCENE}.mp4" | head -1)"
            test -s "$FILE"
            if [ "$QUALITY" = pql ]; then
              cp "$FILE" delivery/V3FIX_preview_pql.mp4
            else
              cp "$FILE" delivery/03_recta_tangente_curva_vectorial_AUDITABLE_V51_pqh.mp4
            fi
          done
      - name: Verify and QA
        run: |
          set -euo pipefail
          F=delivery/03_recta_tangente_curva_vectorial_AUDITABLE_V51_pqh.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 "$F" | tee logs/ffprobe.txt
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")" = 1920
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")" = 1080
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")" = 30/1
          ffmpeg -nostdin -v error -i "$F" -f null -
          D="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          for P in 35 55 70 85; do T="$(python -c "d=float('$D'); print(d*$P/100)")"; ffmpeg -nostdin -y -v error -ss "$T" -i "$F" -frames:v 1 "qa/${P}.png"; done
          cp work/main.py work/jp_classroom_style.py delivery/
          cp -r qa logs delivery/
          sha256sum delivery/*.mp4 delivery/main.py delivery/jp_classroom_style.py > delivery/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: calc-workshop-v3fix-v51
          path: delivery/
          retention-days: 7
