name: Statistics10 Normal Distribution Detailed V2 FINAL PQH 20260922

on:
  push:
    branches:
      - render/stat10-normal-distribution-detailed-v2-20260922
    paths:
      - 'render_jobs/stat10_normal_distribution_detailed_v2_20260922/**'
      - '.github/workflows/stat10_normal_distribution_detailed_v2_pqh_20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout V2 render branch
        uses: actions/checkout@v4
        with:
          ref: render/stat10-normal-distribution-detailed-v2-20260922

      - name: Reconstruct V2 source and shared classroom style
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/stat10_normal_distribution_detailed_v2_20260922
          python "$JOB/bootstrap/decode_source.py" "$JOB"
          git fetch --depth=1 origin render/statistics10-iqr-class02-compare-boxplots-20260831
          git show FETCH_HEAD:render_jobs/statistics10_iqr_class02_compare_boxplots_20260831/jp_classroom_style.py > "$JOB/jp_classroom_style.py"
          git show FETCH_HEAD:render_jobs/statistics10_iqr_class02_compare_boxplots_20260831/check_manim_style.py > "$JOB/check_manim_style.py"

      - name: Validate source and architecture
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/stat10_normal_distribution_detailed_v2_20260922
          SRC="$JOB/stat10_normal_distribution_class1_detailed_v2.py"
          python -m py_compile "$SRC" "$JOB/jp_classroom_style.py" "$JOB/check_manim_style.py"
          python "$JOB/check_manim_style.py" "$SRC" | tee static_style_qa.txt
          grep -q '^class Statistics10NormalDistributionClass1DetailedV2' "$SRC"
          for method in             opening_v2 roadmap_v2 step1_collect step2_list_plot step3_group_intervals             step4_histogram step5_shape step6_normal_curve step7_center step8_spread_rule             glossary_a glossary_b normal_or_not_v2 summary_v2 exit_v2; do
            grep -q "def ${method}" "$SRC"
          done
          if grep -Eq '([A-Za-z]:\\|/Users/|/home/[^/]+/Desktop)' "$SRC"; then
            echo 'FAIL: non-portable absolute path found'; exit 1
          fi
          mkdir -p qa_preview final_out/qa package

      - name: Install dependencies and pinned ManimCE
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip imagemagick
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          ffmpeg -version | head -n 1

      - name: Literal PQL complete-timeline gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/stat10_normal_distribution_detailed_v2_20260922
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -e LESSON_TIME_SCALE=0.05             -v "$PWD:/manim"             -w "/manim/$JOB"             --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql                 stat10_normal_distribution_class1_detailed_v2.py                 Statistics10NormalDistributionClass1DetailedV2                 --format=mp4                 --media_dir=/manim/media_pql                 --disable_caching
            ' 2>&1 | tee qa_preview/render_pql.log
          PQL="$(find media_pql -type f -name 'Statistics10NormalDistributionClass1DetailedV2.mp4' -print -quit)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render 1080p60
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/stat10_normal_distribution_detailed_v2_20260922
          rm -rf media_pqh
          docker run --rm --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -e LESSON_TIME_SCALE=1.25             -v "$PWD:/manim"             -w "/manim/$JOB"             --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh                 stat10_normal_distribution_class1_detailed_v2.py                 Statistics10NormalDistributionClass1DetailedV2                 --format=mp4                 --media_dir=/manim/media_pqh                 --disable_caching
            ' 2>&1 | tee final_out/render_pqh.log
          FINAL="$(find media_pqh -type f -name 'Statistics10NormalDistributionClass1DetailedV2.mp4' -print -quit)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" final_out/Stat10_Normal_Distribution_Class1_DETAILED_V2_FINAL_1080p60.mp4

      - name: Strict media QA
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Stat10_Normal_Distribution_Class1_DETAILED_V2_FINAL_1080p60.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tframes\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n'             "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$FRAMES" "$SIZE" > final_out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 60/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> final_out/full_decode.log
          test ! -s final_out/full_decode.log

      - name: Distributed visual QA frames
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Stat10_Normal_Distribution_Class1_DETAILED_V2_FINAL_1080p60.mp4
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          mkdir -p final_out/qa
          for I in $(seq -w 1 18); do
            T="$(python -c "print(float('$DUR')*(int('$I')-0.5)/18.0)")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "final_out/qa/frame_${I}.png"
          done
          test "$(find final_out/qa -name 'frame_*.png' | wc -l)" -eq 18
          montage final_out/qa/frame_*.png             -thumbnail 384x216 -tile 3x6 -geometry +8+10 -background white -quality 90             final_out/CONTACT_SHEET_18.jpg
          test -s final_out/CONTACT_SHEET_18.jpg

      - name: Build QA report and package
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/stat10_normal_distribution_detailed_v2_20260922
          F=final_out/Stat10_Normal_Distribution_Class1_DETAILED_V2_FINAL_1080p60.mp4
          sha256sum "$F" "$JOB/stat10_normal_distribution_class1_detailed_v2.py" > final_out/SHA256SUMS.txt
          {
            echo '# Statistics 10 Normal Distribution Detailed V2 — QA'
            echo
            echo '- Python compile: PASS'
            echo '- JP classroom static style check: PASS / warnings reviewed'
            echo '- Literal PQL full-timeline gate: PASS'
            echo '- Literal PQH render: PASS'
            echo '- 1920x1080 / 60 fps / H.264 / yuv420p: PASS'
            echo '- Complete FFmpeg decode: PASS'
            echo '- 18 distributed visual QA frames: generated'
            echo '- 18-frame contact sheet: generated'
            echo
            cat final_out/VIDEO_TECHNICAL.tsv
          } > final_out/SENIOR_QA_RESULT.md

          ROOT=package/Stat10_Normal_Distribution_Detailed_V2_FINAL_PROJECT
          mkdir -p "$ROOT/qa" "$ROOT/render"
          cp "$JOB/stat10_normal_distribution_class1_detailed_v2.py" "$ROOT/"
          cp "$JOB/jp_classroom_style.py" "$JOB/check_manim_style.py" "$ROOT/"
          cp "$F" "$ROOT/render/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/SENIOR_QA_RESULT.md final_out/SHA256SUMS.txt              final_out/CONTACT_SHEET_18.jpg final_out/full_decode.log "$ROOT/qa/"
          cp final_out/qa/frame_*.png "$ROOT/qa/"
          (cd package && zip -qr Stat10_Normal_Distribution_Detailed_V2_FULL_PACKAGE.zip Stat10_Normal_Distribution_Detailed_V2_FINAL_PROJECT)
          sha256sum package/Stat10_Normal_Distribution_Detailed_V2_FULL_PACKAGE.zip > package/PACKAGE_SHA256.txt

      - name: Upload V2 final artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stat10-Normal-Distribution-Detailed-V2-FINAL-1080p60-20260922
          path: |
            final_out/Stat10_Normal_Distribution_Class1_DETAILED_V2_FINAL_1080p60.mp4
            final_out/VIDEO_TECHNICAL.tsv
            final_out/SENIOR_QA_RESULT.md
            final_out/SHA256SUMS.txt
            final_out/CONTACT_SHEET_18.jpg
            final_out/qa/
            package/Stat10_Normal_Distribution_Detailed_V2_FULL_PACKAGE.zip
            package/PACKAGE_SHA256.txt
            render_jobs/stat10_normal_distribution_detailed_v2_20260922/stat10_normal_distribution_class1_detailed_v2.py
          if-no-files-found: error
          retention-days: 14
