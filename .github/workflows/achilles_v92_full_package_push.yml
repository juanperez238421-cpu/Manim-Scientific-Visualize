name: Achilles V9.2 Full PQH Package Test

on:
  push:
    branches:
      - 'agent/achilles-tortoise-pqh-20260823'

permissions:
  contents: read

jobs:
  render_package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact sources
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/achilles_tortoise_20260823
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          job = Path('render_jobs/achilles_tortoise_20260823')
          encoded = ''.join((job / f'v92_part_{i:02d}.txt').read_text().strip() for i in range(5))
          encoded += '=' * (-len(encoded) % 4)
          (job / 'achilles_tortoise_senior_v9_2.py').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          style = (job / 's.gz.b64').read_text().strip()
          style += '=' * (-len(style) % 4)
          (job / 'jp_classroom_style.py').write_bytes(gzip.decompress(base64.b64decode(style, validate=False)))
          PY
          (cd "$JOB" && printf '%s  %s\n' \
            'fd152a7c92296ecf8c9218b9e2f43221e7c4a20cb7ca857486935f0ef52e553c' 'achilles_tortoise_senior_v9_2.py' \
            '6ae7884ca21aa88ad6c82bf39cee08057c6d7be2fc03de10b25ee7c842b35703' 'jp_classroom_style.py' | sha256sum -c -)
          test -s "$JOB/STORYBOARD_V9_EN_CONTINUOUS.md"
          test -s protocols/PROTOCOL_MANIMCE_PQH_PROJECT_PACKAGE_STANDARD.md
          python -m py_compile "$JOB/achilles_tortoise_senior_v9_2.py" "$JOB/jp_classroom_style.py"

      - name: Prepare ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/achilles_tortoise_20260823
          rm -rf media_pql qa_out && mkdir -p qa_out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.12 \
            -v "$PWD:/manim" -w "/manim/$JOB" --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql achilles_tortoise_senior_v9_2.py AchillesTortoiseSeniorV9 --fps 15 --format=mp4 --media_dir /manim/media_pql --disable_caching
            ' 2>&1 | tee qa_out/render_pql.log
          test -n "$(find media_pql -type f -name 'AchillesTortoiseSeniorV9.mp4' -print -quit)"

      - name: Literal PQH
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/achilles_tortoise_20260823
          rm -rf media out package && mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB" --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh achilles_tortoise_senior_v9_2.py AchillesTortoiseSeniorV9 --fps 30 --format=mp4 --media_dir /manim/media --disable_caching
            ' 2>&1 | tee out/render_pqh.log
          FINAL="$(find media -type f -name 'AchillesTortoiseSeniorV9.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Achilles_and_Tortoise_Zeno_SENIOR_V9_2_CONTINUOUS_EN_FINAL_pqh.mp4

      - name: Strict QA and audit frames
        shell: bash
        run: |
          set -euo pipefail
          F=out/Achilles_and_Tortoise_Zeno_SENIOR_V9_2_CONTINUOUS_EN_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          test ! -s out/full_decode.log
          sha256sum "$F" > out/SHA256SUMS.txt
          mkdir -p out/audit_frames
          for P in 0.02 0.06 0.10 0.14 0.18 0.22 0.26 0.30 0.34 0.38 0.42 0.46 0.50 0.54 0.58 0.62 0.66 0.70 0.74 0.78 0.82 0.86 0.90 0.94 0.98; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_${TAG}.png"
          done

      - name: Build full project ZIP
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/achilles_tortoise_20260823
          ROOT=package/Achilles_Tortoise_Zeno_V9_2_FINAL_PQH_PROJECT
          mkdir -p "$ROOT/src" "$ROOT/storyboard" "$ROOT/render" "$ROOT/qa/audit_frames" "$ROOT/protocol" "$ROOT/workflow"
          cp "$JOB/achilles_tortoise_senior_v9_2.py" "$ROOT/src/"
          cp "$JOB/jp_classroom_style.py" "$ROOT/src/"
          cp "$JOB/STORYBOARD_V9_EN_CONTINUOUS.md" "$ROOT/storyboard/STORYBOARD.md"
          cp out/Achilles_and_Tortoise_Zeno_SENIOR_V9_2_CONTINUOUS_EN_FINAL_pqh.mp4 "$ROOT/render/"
          cp out/VIDEO_TECHNICAL.tsv out/SHA256SUMS.txt out/full_decode.log out/render_pqh.log "$ROOT/qa/"
          cp qa_out/render_pql.log "$ROOT/qa/"
          cp out/audit_frames/*.png "$ROOT/qa/audit_frames/"
          cp protocols/PROTOCOL_MANIMCE_PQH_PROJECT_PACKAGE_STANDARD.md "$ROOT/protocol/"
          cp .github/workflows/achilles_v92_full_package_push.yml "$ROOT/workflow/"
          python - <<'PY'
          from pathlib import Path
          root=Path('package/Achilles_Tortoise_Zeno_V9_2_FINAL_PQH_PROJECT')
          tech=Path('out/VIDEO_TECHNICAL.tsv').read_text().strip()
          sha=Path('out/SHA256SUMS.txt').read_text().strip()
          root.joinpath('README.md').write_text(f'''# Achilles and the Tortoise — V9.2 Continuous English\n\nComplete ManimCE PQH project package.\n\n## Exact project inputs\n- Scene: `src/achilles_tortoise_senior_v9_2.py`\n- Style: `src/jp_classroom_style.py`\n- Storyboard: `storyboard/STORYBOARD.md`\n- ManimCE: `0.20.1`\n- Scene class: `AchillesTortoiseSeniorV9`\n\n## Render commands\n```bash\nmanim -pql achilles_tortoise_senior_v9_2.py AchillesTortoiseSeniorV9 --fps 15 --format=mp4 --disable_caching\nmanim -pqh achilles_tortoise_senior_v9_2.py AchillesTortoiseSeniorV9 --fps 30 --format=mp4 --disable_caching\n```\n\n## Technical QA\n```text\n{tech}\n```\n\n## MP4 SHA-256\n```text\n{sha}\n```\n\n`qa/full_decode.log` is required to be empty. Audit frames document the final rendered layout.\n''', encoding='utf-8')
          import shutil
          shutil.make_archive('package/Achilles_Tortoise_Zeno_V9_2_FINAL_PQH_PROJECT','zip','package','Achilles_Tortoise_Zeno_V9_2_FINAL_PQH_PROJECT')
          PY
          test -s package/Achilles_Tortoise_Zeno_V9_2_FINAL_PQH_PROJECT.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Achilles-Tortoise-Zeno-V9-2-FULL-PROJECT-PACKAGE-PQH
          path: |
            package/Achilles_Tortoise_Zeno_V9_2_FINAL_PQH_PROJECT.zip
            package/Achilles_Tortoise_Zeno_V9_2_FINAL_PQH_PROJECT/
          if-no-files-found: error
          retention-days: 7
