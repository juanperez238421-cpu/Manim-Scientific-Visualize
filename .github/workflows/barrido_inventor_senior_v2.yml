name: Barrido Inventor Senior V2 Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'render/barrido-inventor-senior-v2-20260812'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Recover V2 source and validate Python
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg patch
          OLD=render_jobs/barrido_inventor_senior_20260811
          NEW=render_jobs/barrido_inventor_senior_v2_20260812
          FILE=Barrido_InventorProfessional_SENIOR_V2_FINAL.py
          cat "$OLD/payload_00.pyfrag" "$OLD/payload_01.pyfrag" "$OLD/payload_02.pyfrag" > "$FILE"
          patch "$FILE" < "$NEW/barrido_v2.patch"
          cp render_jobs/solids_revolution_inventor_senior_v2_20260811/jp_classroom_style.py .
          test "$(wc -l < "$FILE")" -eq 624
          python -m py_compile "$FILE" jp_classroom_style.py
          ! grep -nE '([A-Za-z]:\\|/Users/|/home/[^/]+/Desktop)' "$FILE"
          sha256sum "$FILE" > SOURCE_SHA256.txt

      - name: Pull ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Render mandatory PQL preview
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=manimcommunity/manim:v0.20.1
          FILE=Barrido_InventorProfessional_SENIOR_V2_FINAL.py
          SCENE=BarridoInventorProfessionalSeniorV2
          rm -rf media preview_v2
          mkdir -p preview_v2
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.16 \
            -v "$PWD:/manim" -w /manim --entrypoint bash "$IMAGE" -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql Barrido_InventorProfessional_SENIOR_V2_FINAL.py BarridoInventorProfessionalSeniorV2 --format=mp4 --disable_caching
            ' 2>&1 | tee preview_v2/render_pql.log
          VIDEO="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"
          cp "$VIDEO" preview_v2/Barrido_InventorProfessional_SENIOR_V2_PREVIEW_pql.mp4
          cp "$FILE" jp_classroom_style.py SOURCE_SHA256.txt preview_v2/
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 "$VIDEO" > preview_v2/ffprobe.txt
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
          RATE="$(python -c "d=float('$DUR'); print(max(0.001,36.0/max(d,0.001)))")"
          ffmpeg -nostdin -y -v error -i "$VIDEO" -vf "fps=$RATE,scale=480:-1,tile=6x6:padding=8:margin=8" -frames:v 1 preview_v2/contact_sheet.jpg
          for P in 10 20 30 40 50 60 70 80 90; do
            T="$(python -c "d=float('$DUR'); print(d*$P/100.0)")"
            ffmpeg -nostdin -y -v error -ss "$T" -i "$VIDEO" -frames:v 1 "preview_v2/frame_${P}pct.png"
          done

      - name: Upload PQL QA preview
        uses: actions/upload-artifact@v4
        with:
          name: Barrido_InventorProfessional_SENIOR_V2_PQL_QA
          path: preview_v2/
          if-no-files-found: error
          retention-days: 7
