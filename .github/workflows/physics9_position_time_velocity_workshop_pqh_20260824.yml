name: Physics 9 Position-Time Velocity Workshop FINAL PQH 20260824

on:
  pull_request:
    branches: [render/physics9-vt-displacement-20260824-v1]
    paths:
      - 'render_jobs/physics9_position_time_velocity_workshop_20260824/**'
      - 'protocols/PROTOCOL_MANIMCE_PQH_PROJECT_PACKAGE_STANDARD.md'
      - '.github/workflows/physics9_position_time_velocity_workshop_pqh_20260824.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact project sources
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_position_time_velocity_workshop_20260824
          SRC="$JOB/position_time_velocity_workshop.py"
          STYLE="$JOB/jp_classroom_style.py"
          test -s "$SRC"
          test -s "$STYLE"
          test -s "$JOB/STORYBOARD.md"
          test -s "$JOB/README.md"
          test -s "$JOB/pdfs/source/build_physics9_pdfs.py"
          test -s protocols/PROTOCOL_MANIMCE_PQH_PROJECT_PACKAGE_STANDARD.md
          python -m py_compile "$SRC" "$STYLE" "$JOB/pdfs/source/build_physics9_pdfs.py"
          grep -q 'class Physics9PositionTimeVelocityWorkshop' "$SRC"
          grep -q 'config.pixel_width = 1920' "$STYLE"
          grep -q 'config.pixel_height = 1080' "$STYLE"
          grep -q 'config.frame_rate = 30' "$STYLE"
          mkdir -p qa_preview
          sha256sum "$SRC" "$STYLE" "$JOB/STORYBOARD.md" "$JOB/pdfs/source/build_physics9_pdfs.py" > qa_preview/SOURCE_SHA256SUMS.txt

      - name: Restore and verify both PDF companions
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_position_time_velocity_workshop_20260824
          mkdir -p final_out/pdfs
          base64 -d "$JOB/pdfs/encoded/Physics9_Position_Time_Velocity_Workshop.pdf.gz.b64" | gzip -dc > final_out/pdfs/Physics9_Position_Time_Velocity_Workshop.pdf
          base64 -d "$JOB/pdfs/encoded/Physics9_Velocity_Time_Displacement_Companion.pdf.gz.b64" | gzip -dc > final_out/pdfs/Physics9_Velocity_Time_Displacement_Companion.pdf
          (cd final_out/pdfs && sha256sum -c "$GITHUB_WORKSPACE/$JOB/pdfs/PDF_SHA256SUMS.txt") | tee final_out/PDF_CHECKSUM_QA.log

      - name: Prepare pinned render environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip imagemagick
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL runtime gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_position_time_velocity_workshop_20260824
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.08 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql position_time_velocity_workshop.py Physics9PositionTimeVelocityWorkshop \
                --format=mp4 --media_dir=/manim/media_pql --disable_caching
            ' 2>&1 | tee qa_preview/render_pql.log
          PQL="$(find media_pql -type f -name 'Physics9PositionTimeVelocityWorkshop.mp4' -print -quit)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_position_time_velocity_workshop_20260824
          rm -rf media_pqh package
          mkdir -p final_out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.35 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh position_time_velocity_workshop.py Physics9PositionTimeVelocityWorkshop \
                --format=mp4 --media_dir=/manim/media_pqh --disable_caching
            ' 2>&1 | tee final_out/render_pqh.log
          FINAL="$(find media_pqh -type f -name 'Physics9PositionTimeVelocityWorkshop.mp4' -print -quit)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" final_out/Physics9_Position_Time_Velocity_Workshop_FINAL_pqh.mp4

      - name: Strict technical QA and full decode
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Position_Time_Velocity_Workshop_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > final_out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          python - <<'PY'
          from pathlib import Path
          duration = float(Path('final_out/VIDEO_TECHNICAL.tsv').read_text().splitlines()[1].split('\t')[-1])
          assert 180 <= duration <= 1200, duration
          PY
          ffmpeg -nostdin -v error -i "$F" -f null - 2> final_out/full_decode.log
          test ! -s final_out/full_decode.log
          sha256sum "$F" > final_out/SHA256SUMS.txt

      - name: Dense frame audit set and contact sheet
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Position_Time_Velocity_Workshop_FINAL_pqh.mp4
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          mkdir -p final_out/audit_frames
          for INDEX in $(seq -w 0 47); do
            T="$(python -c "print(float('$DUR')*(int('$INDEX')+0.5)/48.0)")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 \
              "final_out/audit_frames/frame_${INDEX}.png"
          done
          montage final_out/audit_frames/*.png \
            -thumbnail 480x270 -tile 4x12 -geometry +10+20 \
            -background white -quality 90 final_out/CONTACT_SHEET.jpg
          test -s final_out/CONTACT_SHEET.jpg

      - name: Build reproducible project ZIP
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_position_time_velocity_workshop_20260824
          ROOT=package/Physics9_Position_Time_Velocity_Workshop_V1_FINAL_PQH_PROJECT
          mkdir -p "$ROOT/src" "$ROOT/storyboard" "$ROOT/render" "$ROOT/pdfs/source" "$ROOT/qa/audit_frames" "$ROOT/protocol" "$ROOT/workflow"
          cp "$JOB/position_time_velocity_workshop.py" "$ROOT/src/"
          cp "$JOB/jp_classroom_style.py" "$ROOT/src/"
          cp "$JOB/STORYBOARD.md" "$ROOT/storyboard/"
          cp "$JOB/README.md" "$ROOT/README.md"
          cp "$JOB/pdfs/source/build_physics9_pdfs.py" "$ROOT/pdfs/source/"
          cp final_out/pdfs/*.pdf "$ROOT/pdfs/"
          cp final_out/Physics9_Position_Time_Velocity_Workshop_FINAL_pqh.mp4 "$ROOT/render/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/SHA256SUMS.txt final_out/full_decode.log final_out/render_pqh.log final_out/CONTACT_SHEET.jpg final_out/PDF_CHECKSUM_QA.log "$ROOT/qa/"
          cp qa_preview/render_pql.log qa_preview/SOURCE_SHA256SUMS.txt "$ROOT/qa/"
          cp final_out/audit_frames/*.png "$ROOT/qa/audit_frames/"
          cp protocols/PROTOCOL_MANIMCE_PQH_PROJECT_PACKAGE_STANDARD.md "$ROOT/protocol/"
          cp .github/workflows/physics9_position_time_velocity_workshop_pqh_20260824.yml "$ROOT/workflow/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/SHA256SUMS.txt "$ROOT/"
          (cd package && zip -qr Physics9_Position_Time_Velocity_Workshop_V1_FINAL_PQH_PROJECT.zip Physics9_Position_Time_Velocity_Workshop_V1_FINAL_PQH_PROJECT)
          test -s package/Physics9_Position_Time_Velocity_Workshop_V1_FINAL_PQH_PROJECT.zip
          sha256sum package/Physics9_Position_Time_Velocity_Workshop_V1_FINAL_PQH_PROJECT.zip > package/PACKAGE_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Physics9-Position-Time-Velocity-Workshop-V1-FINAL-PQH-PROJECT
          path: |
            package/Physics9_Position_Time_Velocity_Workshop_V1_FINAL_PQH_PROJECT.zip
            package/PACKAGE_SHA256.txt
            final_out/Physics9_Position_Time_Velocity_Workshop_FINAL_pqh.mp4
            final_out/pdfs/
            final_out/VIDEO_TECHNICAL.tsv
            final_out/SHA256SUMS.txt
            final_out/CONTACT_SHEET.jpg
            final_out/audit_frames/
          if-no-files-found: error
          retention-days: 14
