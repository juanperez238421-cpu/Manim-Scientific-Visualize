name: Statistics 11 Colab Arrays PQH 20260820

on:
  push:
    branches:
      - statistics11-colab-arrays-render-20260820

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact render branch
        uses: actions/checkout@v4
        with:
          ref: statistics11-colab-arrays-render-20260820

      - name: Persist STARTED state
        shell: bash
        run: |
          set -euo pipefail
          OUT=render_jobs/statistics11_colab_arrays/delivery
          mkdir -p "$OUT"
          printf 'STARTED\n' > "$OUT/STATUS.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT/STATUS.txt"
          git commit -m 'Statistics11 PQH render STARTED' || true
          git push origin HEAD:statistics11-colab-arrays-render-20260820

      - name: Render literal PQL and PQH with protocol QA
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics11_colab_arrays
          SRC="$JOB/Statistics11_Colab_Arrays_Senior.py"
          OUT="$JOB/delivery"
          rm -rf media_pql media
          rm -f "$OUT/render_pql.log" "$OUT/render_pqh.log" "$OUT/full_decode.log" "$OUT/VIDEO_TECHNICAL.tsv" "$OUT/SHA256SUMS.txt" "$OUT/RENDER_INFO.txt" "$OUT/Statistics11_Colab_Arrays_SENIOR_PQH.mp4"
          python -m py_compile "$SRC" 2>&1 | tee "$OUT/py_compile.log"
          docker pull manimcommunity/manim:v0.20.1 2>&1 | tee "$OUT/docker_pull.log"

          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
            set -euo pipefail
            mkdir -p /tmp/manim-bin
            printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
            chmod +x /tmp/manim-bin/xdg-open
            export PATH=/tmp/manim-bin:\$PATH
            manim -pql $SRC Statistics11ColabArrays --format=mp4 --media_dir media_pql --disable_caching
          " 2>&1 | tee "$OUT/render_pql.log"
          PREVIEW="$(find media_pql -type f -name 'Statistics11ColabArrays.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"

          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
            set -euo pipefail
            mkdir -p /tmp/manim-bin
            printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
            chmod +x /tmp/manim-bin/xdg-open
            export PATH=/tmp/manim-bin:\$PATH
            manim -pqh $SRC Statistics11ColabArrays --fps 30 --format=mp4 --media_dir media --disable_caching
          " 2>&1 | tee "$OUT/render_pqh.log"

          FINAL="$(find media -type f -name 'Statistics11ColabArrays.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" "$OUT/Statistics11_Colab_Arrays_SENIOR_PQH.mp4"
          cp "$SRC" "$OUT/Statistics11_Colab_Arrays_Senior.py"

          V="$OUT/Statistics11_Colab_Arrays_SENIOR_PQH.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$V")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$V")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$V")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$V")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$V")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$V")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$V")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$V" -f null - 2> "$OUT/full_decode.log"
          sha256sum "$V" "$SRC" > "$OUT/SHA256SUMS.txt"
          printf '%s\n' \
            'Scene: Statistics11ColabArrays' \
            'Topic: Statistics 11 — Google Colab arrays' \
            'ManimCE: 0.20.1' \
            'Preview: literal -pql' \
            'Final: literal -pqh, 1920x1080, 30 fps, H.264/yuv420p' \
            'QA: py_compile + PQL + PQH + ffprobe + full decode + SHA-256' \
            > "$OUT/RENDER_INFO.txt"

      - name: Persist final state and logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=render_jobs/statistics11_colab_arrays/delivery
          if [ "${{ steps.render.outcome }}" = "success" ]; then
            printf 'SUCCESS\n' > "$OUT/STATUS.txt"
          else
            printf 'FAILURE\n' > "$OUT/STATUS.txt"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m "Statistics11 PQH render ${{ steps.render.outcome }}" || true
          git push origin HEAD:statistics11-colab-arrays-render-20260820

      - name: Upload successful delivery artifact
        if: steps.render.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11-Colab-Arrays-PQH-20260820
          path: render_jobs/statistics11_colab_arrays/delivery/
          if-no-files-found: error
          retention-days: 30

      - name: Fail workflow if render failed
        if: steps.render.outcome != 'success'
        shell: bash
        run: exit 1
