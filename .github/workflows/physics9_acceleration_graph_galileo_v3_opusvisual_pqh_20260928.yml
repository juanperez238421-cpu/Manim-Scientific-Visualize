name: Physics9 Acceleration Graph Galileo V3 OPUS VISUAL PQH 20260928

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    if: github.event.pull_request.head.ref == 'physics9-acceleration-graph-galileo-v3-opusvisual-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: physics9-acceleration-graph-galileo-v3-opusvisual-20260928

      - name: Validate source, physics contract and classroom style
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_acceleration_graph_galileo_v3_opusvisual_20260928
          FILE="$JOB/physics9_acceleration_graph_galileo_v3_opusvisual.py"
          BASE="$JOB/physics9_acceleration_graph_galileo_v2_base.py"
          STYLE="$JOB/jp_classroom_style.py"

          python -m py_compile "$FILE" "$BASE" "$STYLE"
          python "$JOB/tools/check_manim_style.py" "$FILE" | tee style_qa.log
          grep -q "PASS: no structural/style issues detected." style_qa.log

          python - <<'PY'
          from pathlib import Path

          p = Path("render_jobs/physics9_acceleration_graph_galileo_v3_opusvisual_20260928/physics9_acceleration_graph_galileo_v3_opusvisual.py")
          s = p.read_text(encoding="utf-8")

          required = [
              "class Physics9AccelerationGraphGalileoV3OpusVisual",
              "make_vehicle(",
              "velocity_kmh_at(",
              "distance_km_at(",
              "always_redraw(",
              "TransformFromCopy(",
              "REPLAY THE TRIP",
              "ACCELERATION IS WHAT THE SLOPE OF v(t) LOOKS LIKE AS A NEW GRAPH",
              "BUILD a(t) — INTERVALS 01 TO 06",
              "COMPLETE a(t) — INTERVALS 07 TO 12",
              "Sign of a is not direction of motion.",
              r"\boxed{v=v_0+at}",
              r"\boxed{x=x_0+v_0t+\frac12at^2}",
              "GALILEO'S MEASUREMENT TRICK",
              "1 : 4 : 9 : 16",
              r"x-x_0=\frac12at^2",
              "x versus t²",
              "free fall is the constant-acceleration case a = g",
          ]
          missing = [item for item in required if item not in s]
          assert not missing, f"Missing V3 visual/physics contract elements: {missing}"

          assert s.count("always_redraw(") >= 8, "Expected synchronized dynamic graph/motion objects"
          assert s.count("TransformFromCopy(") >= 4, "Expected visual graph/geometry-to-equation transformations"
          assert "distance += 0.5 * (v0 + vend) * dt_h" in s, "Vehicle position must come from integral of v(t)"
          assert "DoubleArrow(" in s and 'if abs(d["dv"]) < 1e-12' in s, "Expected explicit Δv visualization including zero-change handling"
          assert "transform_equation_chain(" in s, "Expected morphing algebraic derivation"

          forbidden_spanish = [
              "FUNDAMENTOS", "CIUDAD", "VELOCIDAD DEL AUTO", "IDEA CENTRAL",
              "ACELERA", "PARADA", "ACCIDENTE", "TRÁFICO", "RECUPERA",
              "POSICIÓN", "TIEMPO", "CUANDO", "MODELO IDEAL", "MOVIMIENTO REAL",
          ]
          found = [term for term in forbidden_spanish if term.lower() in s.lower()]
          assert not found, f"Spanish on-screen vocabulary detected: {found}"

          print("v3_source_contract_pass")
          PY

      - name: Install verification tools and pull ManimCE
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          ffprobe -version | head -1

      - name: Fast PQL runtime and safe-layout QA
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_acceleration_graph_galileo_v3_opusvisual_20260928
          rm -rf media_pql qa_out
          mkdir -p qa_out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.18 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $JOB/physics9_acceleration_graph_galileo_v3_opusvisual.py Physics9AccelerationGraphGalileoV3OpusVisual \
                --fps 15 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee qa_out/render_pql.log

          PREVIEW="$(find media_pql -type f -name 'Physics9AccelerationGraphGalileoV3OpusVisual.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          cp "$PREVIEW" qa_out/Physics9_AccelerationGraph_Galileo_V3_OPUS_VISUAL_QA_pql.mp4

      - name: Final literal PQH render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_acceleration_graph_galileo_v3_opusvisual_20260928
          rm -rf media out
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $JOB/physics9_acceleration_graph_galileo_v3_opusvisual.py Physics9AccelerationGraphGalileoV3OpusVisual \
                --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee out/render_pqh.log

          FINAL="$(find media -type f -name 'Physics9AccelerationGraphGalileoV3OpusVisual.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Physics9_AccelerationGraph_Galileo_V3_OPUS_VISUAL_FULL_FINAL_pqh.mp4

      - name: Technical QA, full decode and visual audit frames
        shell: bash
        run: |
          set -euo pipefail
          F=out/Physics9_AccelerationGraph_Galileo_V3_OPUS_VISUAL_FULL_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p

          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log

          python - "$F" <<'PY' | tee out/FRAME_BY_FRAME_BORDER_SCAN.txt
          import json
          import subprocess
          import sys

          path = sys.argv[1]
          w, h = 320, 180
          frame_bytes = w * h
          proc = subprocess.Popen(
              [
                  "ffmpeg", "-nostdin", "-loglevel", "error", "-i", path,
                  "-vf", f"scale={w}:{h},format=gray",
                  "-f", "rawvideo", "-pix_fmt", "gray", "-"
              ],
              stdout=subprocess.PIPE,
          )

          count = 0
          border_violations = []
          max_dark_ratio = 0.0
          while True:
              raw = proc.stdout.read(frame_bytes)
              if not raw:
                  break
              if len(raw) != frame_bytes:
                  raise SystemExit(f"Partial frame read at frame {count}: {len(raw)} bytes")

              dark = 0
              total = 0
              for y in (0, h - 1):
                  start = y * w
                  row = raw[start:start + w]
                  dark += sum(px < 140 for px in row)
                  total += len(row)
              for y in range(1, h - 1):
                  for x in (0, w - 1):
                      dark += raw[y * w + x] < 140
                      total += 1

              ratio = dark / total
              max_dark_ratio = max(max_dark_ratio, ratio)
              if ratio > 0.004:
                  border_violations.append({"frame": count, "dark_ratio": ratio})
              count += 1

          rc = proc.wait()
          if rc != 0:
              raise SystemExit(f"ffmpeg frame scan failed with exit code {rc}")
          if count == 0:
              raise SystemExit("No frames decoded during border scan")

          report = {
              "decoded_frames_scanned": count,
              "max_outer_border_dark_ratio": max_dark_ratio,
              "violations": border_violations[:30],
              "violation_count": len(border_violations),
          }
          print(json.dumps(report, indent=2))
          if border_violations:
              raise SystemExit(
                  f"Frame-boundary QA failed: {len(border_violations)} frames touch the outer border"
              )
          PY

          mkdir -p out/audit_frames
          for P in 0.02 0.06 0.10 0.14 0.18 0.22 0.26 0.30 0.34 0.38 0.42 0.46 0.50 0.54 0.58 0.62 0.66 0.70 0.74 0.78 0.82 0.88 0.94 0.98; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%03d' "$(python -c "print(int(float('$P')*100))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_$TAG.png"
          done

          ffmpeg -nostdin -loglevel error -framerate 1 -pattern_type glob -i 'out/audit_frames/frame_*.png' \
            -vf 'scale=320:-1,tile=6x4' -frames:v 1 out/QA_CONTACT_SHEET.png

          sha256sum "$F" > out/SHA256SUMS.txt

      - name: Package full delivery and QA evidence
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_acceleration_graph_galileo_v3_opusvisual_20260928
          cp "$JOB/physics9_acceleration_graph_galileo_v3_opusvisual.py" out/
          cp "$JOB/physics9_acceleration_graph_galileo_v2_base.py" out/
          cp "$JOB/jp_classroom_style.py" out/
          cp "$JOB/V2_FORENSIC_REVIEW_AND_V3_PLAN.md" out/
          cp style_qa.log out/
          cp qa_out/render_pql.log out/

          cat > out/RENDER_INFO.txt <<'EOF'
          Physics 9 — Acceleration Graph + Galileo V3 OPUS VISUAL
          Real ManimCE rebuild based on forensic review of the verified V2 PQH render
          ManimCE: 0.20.1
          Format: JP Classroom Standard
          Language: English-only on-screen content
          Preview: literal -pql with LESSON_TIME_SCALE=0.18
          Final: literal -pqh with LESSON_TIME_SCALE=1.0
          Resolution: 1920x1080
          FPS: 30

          Visual/physics upgrades:
          1. physical vehicle replay synchronized with v(t)
          2. vehicle position driven by exact integral of piecewise-linear velocity
          3. aligned v(t) and a(t) graphs on one time axis
          4. every local velocity slope transforms into the corresponding a(t) level
          5. geometric Δv and Δt before SI calculation
          6. compact six-step reasoning rail instead of repetitive large cards
          7. complete a(t) replay with live vehicle, v and a readouts
          8. morphing equation derivation tied to a visible slope triangle
          9. rectangle + triangle area under v(t) transformed into displacement algebra
          10. Galileo measurement comparison plus equal-time 1:4:9:16 pulses
          11. x-versus-t² linearity as the experimental signature of constant acceleration

          QA:
          py_compile + V3 source/physics contract + JP style checker +
          runtime safe-layout assertions + PQL + literal PQH + ffprobe +
          full sequential decode + every-frame boundary scan +
          24 audit frames/contact sheet + SHA-256
          EOF

          cd out
          zip -9 -r Physics9_AccelerationGraph_Galileo_V3_OPUS_VISUAL_FULL_FINAL_PQH_Package.zip \
            Physics9_AccelerationGraph_Galileo_V3_OPUS_VISUAL_FULL_FINAL_pqh.mp4 \
            physics9_acceleration_graph_galileo_v3_opusvisual.py \
            physics9_acceleration_graph_galileo_v2_base.py \
            jp_classroom_style.py V2_FORENSIC_REVIEW_AND_V3_PLAN.md \
            VIDEO_TECHNICAL.tsv SHA256SUMS.txt RENDER_INFO.txt style_qa.log \
            render_pqh.log render_pql.log full_decode.log \
            FRAME_BY_FRAME_BORDER_SCAN.txt QA_CONTACT_SHEET.png audit_frames/

      - name: Publish verified V3 delivery to branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliveries/physics9
          cp out/Physics9_AccelerationGraph_Galileo_V3_OPUS_VISUAL_FULL_FINAL_pqh.mp4 deliveries/physics9/
          cp out/Physics9_AccelerationGraph_Galileo_V3_OPUS_VISUAL_FULL_FINAL_PQH_Package.zip deliveries/physics9/
          cp out/QA_CONTACT_SHEET.png deliveries/physics9/Physics9_AccelerationGraph_Galileo_V3_OPUS_VISUAL_QA_CONTACT_SHEET.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliveries/physics9/
          if git diff --cached --quiet; then
            echo "No delivery changes to publish"
          else
            git commit -m "render: publish Physics9 acceleration graph Galileo V3 OPUS VISUAL PQH [skip ci]"
            git push origin HEAD:physics9-acceleration-graph-galileo-v3-opusvisual-20260928
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Physics9-AccelerationGraph-Galileo-V3-OPUS-VISUAL-FULL-FINAL-PQH
          path: |
            out/Physics9_AccelerationGraph_Galileo_V3_OPUS_VISUAL_FULL_FINAL_pqh.mp4
            out/Physics9_AccelerationGraph_Galileo_V3_OPUS_VISUAL_FULL_FINAL_PQH_Package.zip
            out/physics9_acceleration_graph_galileo_v3_opusvisual.py
            out/physics9_acceleration_graph_galileo_v2_base.py
            out/jp_classroom_style.py
            out/V2_FORENSIC_REVIEW_AND_V3_PLAN.md
            out/VIDEO_TECHNICAL.tsv
            out/SHA256SUMS.txt
            out/RENDER_INFO.txt
            out/style_qa.log
            out/FRAME_BY_FRAME_BORDER_SCAN.txt
            out/QA_CONTACT_SHEET.png
            out/audit_frames/
          if-no-files-found: error
          retention-days: 14
