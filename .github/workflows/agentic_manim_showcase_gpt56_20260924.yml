name: Agentic Manim Showcase GPT-5.6 benchmark

on:
  push:
    branches:
      - benchmark/agentic-manim-showcase-gpt56-20260924
    paths:
      - "render_jobs/agentic_manim_showcase_gpt56_20260924/**"
      - ".github/workflows/agentic_manim_showcase_gpt56_20260924.yml"
  pull_request:
    branches:
      - main
    paths:
      - "render_jobs/agentic_manim_showcase_gpt56_20260924/**"
      - ".github/workflows/agentic_manim_showcase_gpt56_20260924.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static Python syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile render_jobs/agentic_manim_showcase_gpt56_20260924/agentic_manim_showcase.py

      - name: PQL runtime preview gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media qa_out
          mkdir -p qa_out
          JOB=render_jobs/agentic_manim_showcase_gpt56_20260924
          docker run --rm --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -v "$PWD:/manim" -w /manim             --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $JOB/agentic_manim_showcase.py AgenticManimShowcase                 --fps 15 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee qa_out/render_pql.log
          PREVIEW="$(find media -type f -name 'AgenticManimShowcase.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media out
          mkdir -p out
          JOB=render_jobs/agentic_manim_showcase_gpt56_20260924
          docker run --rm --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -v "$PWD:/manim" -w /manim             --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $JOB/agentic_manim_showcase.py AgenticManimShowcase                 --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee out/render_pqh.log
          FINAL="$(find media -type f -name 'AgenticManimShowcase.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Agentic_Manim_Showcase_GPT56_FULL_FINAL_pqh.mp4

      - name: Install FFmpeg QA dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Technical QA + full decode + contact sheet
        shell: bash
        run: |
          set -euo pipefail
          F=out/Agentic_Manim_Showcase_GPT56_FULL_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"

          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\n'             "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > out/VIDEO_TECHNICAL.tsv

          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p

          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log

          mkdir -p out/audit_frames
          for P in 0.02 0.06 0.10 0.14 0.18 0.22 0.26 0.30 0.34 0.38 0.42 0.46 0.50 0.54 0.58 0.62 0.66 0.70 0.74 0.78 0.82 0.88 0.94 0.98; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%03d' "$(python -c "print(int(float('$P')*100))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_$TAG.png"
          done

          ffmpeg -nostdin -loglevel error             -framerate 1 -pattern_type glob -i 'out/audit_frames/frame_*.png'             -vf 'scale=320:-1,tile=6x4' -frames:v 1 out/QA_CONTACT_SHEET.png

          sha256sum "$F" > out/SHA256SUMS.txt

      - name: Package source and QA
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/agentic_manim_showcase_gpt56_20260924
          cp "$JOB/agentic_manim_showcase.py" out/
          cp "$JOB/CLAUDE_AGENTIC_ANIMATION_RESEARCH.md" out/
          cp qa_out/render_pql.log out/
          cat > out/RENDER_INFO.txt <<'EOF'
          Agentic Manim Showcase — GPT-5.6 reconstruction benchmark
          ManimCE: 0.20.1
          Render: literal PQL gate, then literal PQH final
          Resolution: 1920x1080
          FPS: 30
          Scene: AgenticManimShowcase
          External assets: none
          QA: py_compile + PQL + PQH + ffprobe + full sequential decode + 24 audit frames + contact sheet + SHA-256
          EOF

          cd out
          zip -9 -r Agentic_Manim_Showcase_GPT56_FULL_FINAL_PQH_Package.zip             Agentic_Manim_Showcase_GPT56_FULL_FINAL_pqh.mp4             agentic_manim_showcase.py             CLAUDE_AGENTIC_ANIMATION_RESEARCH.md             VIDEO_TECHNICAL.tsv SHA256SUMS.txt RENDER_INFO.txt             render_pqh.log render_pql.log full_decode.log QA_CONTACT_SHEET.png audit_frames/

      - name: Publish verified delivery to branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliveries/benchmarks
          cp out/Agentic_Manim_Showcase_GPT56_FULL_FINAL_pqh.mp4 deliveries/benchmarks/
          cp out/Agentic_Manim_Showcase_GPT56_FULL_FINAL_PQH_Package.zip deliveries/benchmarks/
          cp out/QA_CONTACT_SHEET.png deliveries/benchmarks/Agentic_Manim_Showcase_GPT56_QA_CONTACT_SHEET.png
          cp out/VIDEO_TECHNICAL.tsv deliveries/benchmarks/Agentic_Manim_Showcase_GPT56_VIDEO_TECHNICAL.tsv
          cp out/SHA256SUMS.txt deliveries/benchmarks/Agentic_Manim_Showcase_GPT56_SHA256SUMS.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliveries/benchmarks/
          if git diff --cached --quiet; then
            echo "No delivery changes to publish"
          else
            git commit -m "render: publish agentic Manim showcase PQH [skip ci]"
            git push origin HEAD:benchmark/agentic-manim-showcase-gpt56-20260924
          fi

      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agentic-Manim-Showcase-GPT56-FULL-FINAL-PQH
          path: |
            out/Agentic_Manim_Showcase_GPT56_FULL_FINAL_pqh.mp4
            out/Agentic_Manim_Showcase_GPT56_FULL_FINAL_PQH_Package.zip
            out/agentic_manim_showcase.py
            out/CLAUDE_AGENTIC_ANIMATION_RESEARCH.md
            out/VIDEO_TECHNICAL.tsv
            out/SHA256SUMS.txt
            out/RENDER_INFO.txt
            out/render_pqh.log
            out/render_pql.log
            out/full_decode.log
            out/QA_CONTACT_SHEET.png
            out/audit_frames/
          if-no-files-found: error
          retention-days: 14
