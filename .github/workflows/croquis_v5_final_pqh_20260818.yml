name: Croquis V5 FINAL PQH 20260818

on:
  pull_request:
    branches:
      - house-step-v3-render-20260818

permissions:
  contents: read

jobs:
  pqh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build and compile exact V5 source
        run: |
          set -euo pipefail
          python tools/croquis/build_house_v5.py
          python -m py_compile render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V5_CLOSED_CROQUIS_LATEX.py
          mkdir -p delivery/v5_pqh
          cp render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V5_CLOSED_CROQUIS_LATEX.py delivery/v5_pqh/

      - name: Literal PQH final render — ManimCE 0.20.1
        run: |
          set -euo pipefail
          mkdir -p media
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/preview-bin /tmp/manim-home
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/preview-bin/xdg-open
              chmod +x /tmp/preview-bin/xdg-open
              export PATH="/tmp/preview-bin:$PATH"
              manim -pqh render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V5_CLOSED_CROQUIS_LATEX.py HouseExtrusion3D --format=mp4 --disable_caching
            '

      - name: Ensure FFmpeg verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Strict technical QA + semantic audit frames
        run: |
          set -euo pipefail
          MP4=$(find media -type f -name '*.mp4' | grep 'HouseExtrusion3D' | grep -v 'partial_movie_files' | head -n 1)
          test -n "$MP4"
          test -s "$MP4"
          echo "PQH=$MP4"
          cp "$MP4" delivery/v5_pqh/House_Extrusion_3D_STEP_BY_STEP_V5_CLOSED_CROQUIS_LATEX_FULL_PQH.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate -show_entries format=duration,size -of default=noprint_wrappers=1 "$MP4" > delivery/v5_pqh/FFPROBE.txt
          grep -q '^codec_name=h264$' delivery/v5_pqh/FFPROBE.txt
          grep -q '^width=1920$' delivery/v5_pqh/FFPROBE.txt
          grep -q '^height=1080$' delivery/v5_pqh/FFPROBE.txt
          grep -q '^pix_fmt=yuv420p$' delivery/v5_pqh/FFPROBE.txt
          grep -q '^r_frame_rate=30/1$' delivery/v5_pqh/FFPROBE.txt
          ffmpeg -v error -i "$MP4" -f null -
          mkdir -p delivery/v5_pqh/qa_frames
          python - <<'PY'
          import subprocess, pathlib
          mp4=pathlib.Path('delivery/v5_pqh/House_Extrusion_3D_STEP_BY_STEP_V5_CLOSED_CROQUIS_LATEX_FULL_PQH.mp4')
          dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(mp4)], text=True).strip())
          out=pathlib.Path('delivery/v5_pqh/qa_frames')
          for i in range(48):
              t=dur*i/47
              subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',str(mp4),'-frames:v','1','-vf','scale=960:-1',str(out/f'frame_{i:02d}_{t:07.2f}.jpg')],check=True)
          PY
          sha256sum delivery/v5_pqh/House_Extrusion_3D_STEP_BY_STEP_V5_CLOSED_CROQUIS_LATEX_FULL_PQH.mp4 delivery/v5_pqh/House_Extrusion_3D_STEP_BY_STEP_V5_CLOSED_CROQUIS_LATEX.py > delivery/v5_pqh/SHA256SUMS.txt
          cat > delivery/v5_pqh/RENDER_INFO.txt <<'EOF'
          Scene: HouseExtrusion3D
          Source: House_Extrusion_3D_STEP_BY_STEP_V5_CLOSED_CROQUIS_LATEX.py
          Renderer: Manim Community Edition 0.20.1
          Command: manim -pqh render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V5_CLOSED_CROQUIS_LATEX.py HouseExtrusion3D --format=mp4 --disable_caching
          Acceptance: py_compile + PQL visual gate + literal PQH + ffprobe + full FFmpeg decode + semantic audit frames + SHA-256
          V5 focus: closed internal-wall croquis, LaTeX/Write typography, longer semantic pauses, transparent exterior walls.
          EOF

      - name: Upload verified PQH package
        uses: actions/upload-artifact@v4
        with:
          name: House-Croquis-V5-FINAL-PQH
          path: delivery/v5_pqh
          retention-days: 7
