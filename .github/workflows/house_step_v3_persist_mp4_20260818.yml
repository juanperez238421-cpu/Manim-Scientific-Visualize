name: House Step V3 Persist MP4 20260818

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    if: github.event.pull_request.head.ref == 'house-step-v3-render-20260818' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact V3 branch
        uses: actions/checkout@v4
        with:
          ref: house-step-v3-render-20260818

      - name: Compile and render exact PQH
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/house_step_v3/House_Extrusion_3D_ManimCE.py
          OUT=render_jobs/house_step_v3/delivery_final
          python -m py_compile "$SRC"
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          rm -rf media "$OUT"
          mkdir -p "$OUT"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $SRC HouseExtrusion3D --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee "$OUT/render_pqh.log"
          F="$(find media -type f -name 'HouseExtrusion3D.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$F" && test -s "$F"
          cp "$F" "$OUT/House_Extrusion_3D_STEP_BY_STEP_V3_FULL_PQH.mp4"
          cp "$SRC" "$OUT/House_Extrusion_3D_STEP_BY_STEP_V3.py"
          sha256sum "$OUT/House_Extrusion_3D_STEP_BY_STEP_V3_FULL_PQH.mp4" "$OUT/House_Extrusion_3D_STEP_BY_STEP_V3.py" > "$OUT/SHA256SUMS.txt"

      - name: Persist MP4 to render branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add render_jobs/house_step_v3/delivery_final
          git commit -m 'Persist exact House Step V3 full PQH MP4'
          git push origin HEAD:house-step-v3-render-20260818
