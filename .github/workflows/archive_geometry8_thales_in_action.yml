name: Archive Geometry8 Thales In Action PQH

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'archive/geometry8-thales-remaining-container-only-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct sources
        shell: bash
        run: |
          set -euo pipefail
          tr -cd 'A-Za-z0-9+/=' < archive_rerender/thales_in_action_archive.py.gz.b64 | base64 -d | gzip -dc > thales_in_action_archive.py
          tr -cd 'A-Za-z0-9+/=' < archive_rerender/jp_classroom_style.py.gz.b64 | base64 -d | gzip -dc > jp_classroom_style.py
          python -m py_compile thales_in_action_archive.py jp_classroom_style.py
      - name: Pull pinned ManimCE
        run: docker pull manimcommunity/manim:v0.20.1
      - name: PQL gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.20 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'set -euo pipefail; mkdir -p /tmp/bin; printf "#!/usr/bin/env bash\nexit 0\n" >/tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH="/tmp/bin:$PATH"; manim -pql thales_in_action_archive.py ThalesInActionArchive --format=mp4 --disable_caching --fps 30'
          test -n "$(find media -type f -name 'ThalesInActionArchive.mp4' | head -1)"
      - name: Literal PQH + QA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media delivery
          mkdir -p delivery
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'set -euo pipefail; mkdir -p /tmp/bin; printf "#!/usr/bin/env bash\nexit 0\n" >/tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH="/tmp/bin:$PATH"; manim -pqh thales_in_action_archive.py ThalesInActionArchive --format=mp4 --disable_caching --fps 30'
          SRC="$(find media -type f -name 'ThalesInActionArchive.mp4' ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$SRC" && test -s "$SRC"
          OUT='delivery/2026-07-26__ThalesInAction_ARCHIVE_RECONSTRUCTION_pqh.mp4'
          cp "$SRC" "$OUT"
          cp thales_in_action_archive.py jp_classroom_style.py delivery/
          docker run --rm --user "$(id -u):$(id -g)" -e F="$OUT" -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'set -euo pipefail; test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")" = h264; test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")" = 1920; test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")" = 1080; test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")" = 30/1; ffmpeg -nostdin -v error -i "$F" -f null -'
      - uses: actions/upload-artifact@v4
        with:
          name: thales-in-action-2026-07-26-archive-reconstruction
          path: delivery/
          retention-days: 14
          if-no-files-found: error
