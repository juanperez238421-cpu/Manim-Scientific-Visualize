name: Bootstrap Vector Calculus Individual Suite V2 Render

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render/vector-calc-individual-suite-v2-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve render phase
        id: phase
        shell: bash
        run: |
          set -euo pipefail
          PHASE="$(tr -d '[:space:]' < render_jobs/vector_calc_individual_suite_v2_20260808/phase.txt)"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          if [ "$PHASE" = "pql" ]; then
            echo "quality=-pql" >> "$GITHUB_OUTPUT"
            echo "scale=0.055" >> "$GITHUB_OUTPUT"
            echo "artifact_name=VectorCalc_Individual_Suite_V2_pql" >> "$GITHUB_OUTPUT"
          elif [ "$PHASE" = "pqh" ]; then
            echo "quality=-pqh" >> "$GITHUB_OUTPUT"
            echo "scale=1.0" >> "$GITHUB_OUTPUT"
            echo "artifact_name=VectorCalc_Individual_Suite_V2_pqh" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported phase: $PHASE" >&2
            exit 2
          fi

      - name: Validate Python source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile render_jobs/vector_calc_individual_suite_v2_20260808/all_scenes_v2.py

      - name: Install FFmpeg verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Run protocol-compliant native ManimCE suite
        id: suite
        continue-on-error: true
        shell: bash
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          QUALITY: ${{ steps.phase.outputs.quality }}
          SCALE: ${{ steps.phase.outputs.scale }}
        run: |
          set -o pipefail
          JOB=render_jobs/vector_calc_individual_suite_v2_20260808
          SRC=$JOB/all_scenes_v2.py
          IMAGE=manimcommunity/manim:v0.20.1
          rm -rf delivery_suite qa_suite media
          mkdir -p delivery_suite qa_suite
          docker pull "$IMAGE"

          cat > /tmp/scenes.txt <<'EOF'
          VC00FoundationsTracesV2|00_foundations_traces_v2
          VC01CircularCylinderV2|01_circular_cylinder_v2
          VC02ParabolicCylinderV2|02_parabolic_cylinder_v2
          VC03EllipsoidV2|03_ellipsoid_v2
          VC04HyperboloidOneSheetV2|04_hyperboloid_one_sheet_v2
          VC05HyperboloidTwoSheetsV2|05_hyperboloid_two_sheets_v2
          VC06EllipticConeV2|06_elliptic_cone_v2
          VC07EllipticParaboloidV2|07_elliptic_paraboloid_v2
          VC08HyperbolicParaboloidV2|08_hyperbolic_paraboloid_v2
          VC09ClassificationWorkshopV2|09_classification_workshop_v2
          EOF
          sed -i 's/^          //' /tmp/scenes.txt

          while IFS='|' read -r SCENE SLUG; do
            echo "===== RENDER $SLUG / $PHASE ====="
            mkdir -p "delivery_suite/$SLUG" "qa_suite/$SLUG"
            set +e
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/manim-home \
              -e LESSON_TIME_SCALE="$SCALE" \
              -v "$PWD:/manim" \
              -w /manim \
              --entrypoint bash \
              "$IMAGE" \
              -c '
                set -euo pipefail
                mkdir -p /tmp/manim-bin
                printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
                chmod +x /tmp/manim-bin/xdg-open
                export PATH="/tmp/manim-bin:$PATH"
                manim --version
                manim '"$QUALITY"' '"$SRC"' '"$SCENE"' --format=mp4 --disable_caching
              ' 2>&1 | tee "delivery_suite/$SLUG/render_${PHASE}.log"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -ne 0 ]; then
              echo "Render failed for $SLUG with status $STATUS" >&2
              exit "$STATUS"
            fi

            VIDEO="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            test -n "$VIDEO"
            test -s "$VIDEO"
            cp "$VIDEO" "delivery_suite/$SLUG/${SLUG}_${PHASE}.mp4"
            cp "$SRC" "delivery_suite/$SLUG/all_scenes_v2.py"

            ffprobe -v error \
              -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 \
              "delivery_suite/$SLUG/${SLUG}_${PHASE}.mp4" \
              | tee "delivery_suite/$SLUG/ffprobe.txt"

            ffmpeg -nostdin -v error -i "delivery_suite/$SLUG/${SLUG}_${PHASE}.mp4" -f null - \
              2> "delivery_suite/$SLUG/full_decode.log"

            DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "delivery_suite/$SLUG/${SLUG}_${PHASE}.mp4")"
            FPS_SAMPLE="$(python - <<PY
          D=float("$DURATION")
          print(max(0.001, 15.0/max(D,0.001)))
          PY
          )"
            ffmpeg -nostdin -y -v error -i "delivery_suite/$SLUG/${SLUG}_${PHASE}.mp4" \
              -vf "fps=$FPS_SAMPLE,scale=480:-1,tile=5x3:padding=8:margin=8" \
              -frames:v 1 "qa_suite/$SLUG/contact_sheet.jpg"

            sha256sum "delivery_suite/$SLUG/${SLUG}_${PHASE}.mp4" \
              > "delivery_suite/$SLUG/SHA256SUMS.txt"

            cat > "delivery_suite/$SLUG/RENDER_INFO.txt" <<EOF
          Scene: $SCENE
          Source: $SRC
          ManimCE image: $IMAGE
          Phase: $PHASE
          Command: manim $QUALITY $SRC $SCENE --format=mp4 --disable_caching
          LESSON_TIME_SCALE: $SCALE
          EOF
            sed -i 's/^          //' "delivery_suite/$SLUG/RENDER_INFO.txt"
          done < /tmp/scenes.txt

          cp "$SRC" delivery_suite/all_scenes_v2.py
          sha256sum delivery_suite/*/*.mp4 > delivery_suite/ALL_VIDEOS_SHA256.txt

      - name: Upload native suite or diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.phase.outputs.artifact_name }}
          path: |
            delivery_suite/
            qa_suite/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve failure status after diagnostic upload
        if: steps.suite.outcome == 'failure'
        shell: bash
        run: exit 1
