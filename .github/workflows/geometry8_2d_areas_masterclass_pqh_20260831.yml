name: Geometry 8 2D Areas Masterclass FINAL PQH 20260831

on:
  pull_request:
    branches: [main]
    paths:
      - 'render_jobs/geometry8_2d_areas_masterclass_20260831/**'
      - '.github/workflows/geometry8_2d_areas_masterclass_pqh_20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-geometry8-areas:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Static and mathematical QA
        shell: bash
        run: |
          set -euo pipefail
          BASE=render_jobs/geometry8_2d_areas_masterclass_20260831/Geometry8_2D_Areas_Masterclass_FINAL.py
          SRC=render_jobs/geometry8_2d_areas_masterclass_20260831/Geometry8_2D_Areas_Masterclass_FINAL_QA.py
          python -m py_compile "$BASE" "$SRC"
          grep -Fq 'class Geometry8Areas2DMasterclassFinal' "$BASE"
          grep -Fq 'def validate_lesson_data' "$BASE"
          grep -Fq 'def parallelogram' "$BASE"
          grep -Fq 'def triangle' "$BASE"
          grep -Fq 'def composite' "$BASE"
          grep -Fq 'def shaded_simple' "$BASE"
          grep -Fq 'def scaling' "$BASE"
          grep -Fq 'class Geometry8Areas2DMasterclassFinalQA' "$SRC"
          grep -Fq 'radius=1.75' "$SRC"
          grep -Fq 'radius=2.35' "$SRC"
          mkdir -p out qa_out media qa_media /tmp/manim-bin /tmp/manim-home
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home

      - name: Literal PQL full-timeline gate
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/geometry8_2d_areas_masterclass_20260831/Geometry8_2D_Areas_Masterclass_FINAL_QA.py
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=0.045
          manim -pql "$SRC" Geometry8Areas2DMasterclassFinalQA \
            --fps 15 --format=mp4 --media_dir qa_media --disable_caching \
            2>&1 | tee qa_out/Geometry8_2D_Areas_Masterclass_PQL.log
          PQL="$(find qa_media -type f -name 'Geometry8Areas2DMasterclassFinalQA.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" qa_out/Geometry8_2D_Areas_Masterclass_FINAL_pql.mp4
          python - "$PQL" <<'PY'
          import av, sys
          frames=0
          with av.open(sys.argv[1]) as c:
              for _ in c.decode(c.streams.video[0]): frames += 1
          print('PQL decoded frames:', frames)
          assert frames > 0
          PY

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/geometry8_2d_areas_masterclass_20260831/Geometry8_2D_Areas_Masterclass_FINAL_QA.py
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=1.0
          manim -pqh "$SRC" Geometry8Areas2DMasterclassFinalQA \
            --fps 30 --format=mp4 --media_dir media --disable_caching \
            2>&1 | tee out/Geometry8_2D_Areas_Masterclass_PQH.log
          FINAL="$(find media -type f -name 'Geometry8Areas2DMasterclassFinalQA.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Geometry8_2D_Areas_Masterclass_FINAL_pqh.mp4

      - name: Technical video QA and full decode
        shell: bash
        run: |
          set -euo pipefail
          F=out/Geometry8_2D_Areas_Masterclass_FINAL_pqh.mp4
          python - "$F" <<'PY' | tee out/VIDEO_TECHNICAL_QA.txt
          import av, os, sys
          p=sys.argv[1]
          frames=0
          with av.open(p) as c:
              s=c.streams.video[0]
              codec=s.codec_context.name
              width=s.codec_context.width
              height=s.codec_context.height
              fmt=s.codec_context.format.name if s.codec_context.format else ''
              fps=float(s.average_rate) if s.average_rate else 0.0
              duration=float(c.duration)/float(av.time_base) if c.duration else 0.0
              for _ in c.decode(s): frames += 1
          print(f'codec_name={codec}')
          print(f'width={width}')
          print(f'height={height}')
          print(f'pix_fmt={fmt}')
          print(f'fps={fps:.6f}')
          print(f'duration={duration:.6f}')
          print(f'frames_decoded={frames}')
          print(f'size={os.path.getsize(p)}')
          assert codec == 'h264'
          assert width == 1920 and height == 1080
          assert fmt == 'yuv420p'
          assert abs(fps-30.0) < 0.01
          assert duration > 80
          assert frames > 0
          PY
          ffmpeg -v error -i "$F" -f null -
          sha256sum "$F" | tee out/SHA256SUMS.txt

      - name: Distributed visual audit frames and contact sheet
        shell: bash
        run: |
          set -euo pipefail
          F=out/Geometry8_2D_Areas_Masterclass_FINAL_pqh.mp4
          mkdir -p out/audit_frames
          python - "$F" <<'PY'
          import av, math, os, sys
          from PIL import Image, ImageDraw
          p=sys.argv[1]; saved=[]; count=48
          with av.open(p) as c:
              s=c.streams.video[0]
              duration=float(c.duration)/float(av.time_base)
              targets=[duration*i/(count+1) for i in range(1,count+1)]
              ti=0
              for frame in c.decode(s):
                  if ti>=len(targets): break
                  t=float(frame.pts*frame.time_base) if frame.pts is not None else 0.0
                  if t>=targets[ti]:
                      fp=f'out/audit_frames/frame_{ti+1:02d}_{targets[ti]:07.2f}.jpg'
                      frame.to_image().convert('RGB').save(fp,quality=92)
                      saved.append(fp); ti+=1
          cards=[]
          for fp in saved:
              im=Image.open(fp).convert('RGB'); im.thumbnail((480,270))
              card=Image.new('RGB',(500,300),'white'); card.paste(im,((500-im.width)//2,8))
              ImageDraw.Draw(card).text((10,280),os.path.basename(fp),fill='black'); cards.append(card)
          cols=4; rows=math.ceil(len(cards)/cols); sheet=Image.new('RGB',(cols*500,rows*300),'white')
          for i,im in enumerate(cards): sheet.paste(im,((i%cols)*500,(i//cols)*300))
          sheet.save('out/Geometry8_2D_Areas_Masterclass_FINAL_contact_sheet.jpg',quality=92)
          print('audit_frames=',len(saved))
          assert len(saved)>=45
          PY
          cp render_jobs/geometry8_2d_areas_masterclass_20260831/Geometry8_2D_Areas_Masterclass_FINAL.py out/
          cp render_jobs/geometry8_2d_areas_masterclass_20260831/Geometry8_2D_Areas_Masterclass_FINAL_QA.py out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Geometry8-2D-Areas-Masterclass-FINAL-PQH-20260831
          path: |
            out/
            qa_out/
          if-no-files-found: error
          retention-days: 14
