name: Geometry 8 Circle FINAL TOTAL PQH 20260818

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/geometry8-circle-final-total-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and statically validate FINAL sources
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_circle_20260818
          cat "$JOB"/f_*.b64 | base64 -d | gzip -dc > "$JOB/Geometry8_Circle_Fundamentals_FINAL.py"
          cat "$JOB"/w_*.b64 | base64 -d | gzip -dc > "$JOB/Geometry8_Circle_Workshop_FINAL.py"
          cat "$JOB"/s_*.b64 | base64 -d | gzip -dc > "$JOB/jp_classroom_style.py"
          cat "$JOB"/q_*.b64 | base64 -d | gzip -dc > "$JOB/CURRENT_V4_FORENSIC_QA.md"
          python -m py_compile "$JOB/Geometry8_Circle_Fundamentals_FINAL.py" "$JOB/Geometry8_Circle_Workshop_FINAL.py" "$JOB/jp_classroom_style.py"
          grep -q 'class Geometry8CircleFundamentalsFinal' "$JOB/Geometry8_Circle_Fundamentals_FINAL.py"
          grep -q 'class Geometry8CircleWorkshopFinal' "$JOB/Geometry8_Circle_Workshop_FINAL.py"
          ! grep -E 'Senior_V[124]|Week3_Class1' "$JOB/Geometry8_Circle_Fundamentals_FINAL.py" "$JOB/Geometry8_Circle_Workshop_FINAL.py"

      - name: Install verification tools and exact ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL runtime QA — both videos
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_circle_20260818
          rm -rf qa_media qa_out && mkdir -p qa_out
          for SPEC in \
            'Geometry8_Circle_Fundamentals_FINAL.py Geometry8CircleFundamentalsFinal' \
            'Geometry8_Circle_Workshop_FINAL.py Geometry8CircleWorkshopFinal'; do
            set -- $SPEC
            SRC=$1; SCENE=$2
            docker run --rm --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.08 -e JP_QA_PREVIEW=1 \
              -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
                set -euo pipefail
                mkdir -p /tmp/manim-bin
                printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
                chmod +x /tmp/manim-bin/xdg-open
                export PATH=/tmp/manim-bin:\$PATH
                manim -pql $JOB/$SRC $SCENE --fps 15 --format=mp4 --media_dir qa_media --disable_caching
              " 2>&1 | tee "qa_out/${SCENE}_pql.log"
          done

      - name: Literal PQH final renders — pedagogical timing
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_circle_20260818
          rm -rf media out && mkdir -p out
          for SPEC in \
            'Geometry8_Circle_Fundamentals_FINAL.py Geometry8CircleFundamentalsFinal Geometry8_Circle_Fundamentals_FINAL_pqh.mp4' \
            'Geometry8_Circle_Workshop_FINAL.py Geometry8CircleWorkshopFinal Geometry8_Circle_Workshop_FINAL_pqh.mp4'; do
            set -- $SPEC
            SRC=$1; SCENE=$2; OUTNAME=$3
            docker run --rm --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
              -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
                set -euo pipefail
                mkdir -p /tmp/manim-bin
                printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
                chmod +x /tmp/manim-bin/xdg-open
                export PATH=/tmp/manim-bin:\$PATH
                manim -pqh $JOB/$SRC $SCENE --fps 30 --format=mp4 --media_dir media --disable_caching
              " 2>&1 | tee "out/${SCENE}_pqh.log"
            FINAL="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            test -n "$FINAL" && test -s "$FINAL"
            cp "$FINAL" "out/$OUTNAME"
          done

      - name: Verify MP4s, concatenate master, export audit frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/frame_samples
          : > out/VIDEO_TECHNICAL.tsv
          printf 'file\twidth\theight\tfps\tcodec\tpix_fmt\tduration\n' >> out/VIDEO_TECHNICAL.tsv
          for F in out/Geometry8_Circle_Fundamentals_FINAL_pqh.mp4 out/Geometry8_Circle_Workshop_FINAL_pqh.mp4; do
            W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
            H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
            FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
            CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
            PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
            DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$(basename "$F")" "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" >> out/VIDEO_TECHNICAL.tsv
            test "$W" = 1920
            test "$H" = 1080
            test "$FPS" = 30/1
            test "$CODEC" = h264
            test "$PIX" = yuv420p
            ffmpeg -nostdin -v error -i "$F" -f null -
            STEM="$(basename "$F" .mp4)"
            for P in 0.03 0.10 0.18 0.26 0.34 0.42 0.50 0.58 0.66 0.74 0.82 0.90 0.97; do
              T="$(python -c "print(float('$DUR')*float('$P'))")"
              TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
              ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/frame_samples/${STEM}_${TAG}.png"
            done
          done
          printf "file '%s'\nfile '%s'\n" "$PWD/out/Geometry8_Circle_Fundamentals_FINAL_pqh.mp4" "$PWD/out/Geometry8_Circle_Workshop_FINAL_pqh.mp4" > out/concat.txt
          ffmpeg -nostdin -v error -f concat -safe 0 -i out/concat.txt -c copy out/Geometry8_Circle_Fundamentals_Workshop_COMBINED_pqh.mp4
          ffmpeg -nostdin -v error -i out/Geometry8_Circle_Fundamentals_Workshop_COMBINED_pqh.mp4 -f null -
          sha256sum out/*.mp4 > out/SHA256SUMS.txt

      - name: Build auditable FINAL TOTAL package
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_circle_20260818
          PKG=out/Geometry8_Circle_FINAL_TOTAL
          mkdir -p "$PKG/01_VIDEO" "$PKG/02_SOURCE" "$PKG/03_QA/frame_samples"
          cp out/Geometry8_Circle_Fundamentals_FINAL_pqh.mp4 "$PKG/01_VIDEO/"
          cp out/Geometry8_Circle_Workshop_FINAL_pqh.mp4 "$PKG/01_VIDEO/"
          cp out/Geometry8_Circle_Fundamentals_Workshop_COMBINED_pqh.mp4 "$PKG/01_VIDEO/"
          cp "$JOB/Geometry8_Circle_Fundamentals_FINAL.py" "$PKG/02_SOURCE/"
          cp "$JOB/Geometry8_Circle_Workshop_FINAL.py" "$PKG/02_SOURCE/"
          cp "$JOB/jp_classroom_style.py" "$PKG/02_SOURCE/"
          cp "$JOB/CURRENT_V4_FORENSIC_QA.md" "$PKG/03_QA/"
          cp out/frame_samples/* "$PKG/03_QA/frame_samples/"
          cp out/VIDEO_TECHNICAL.tsv out/SHA256SUMS.txt "$PKG/03_QA/"
          cp qa_out/*_pql.log out/*_pqh.log "$PKG/03_QA/"
          cat > "$PKG/03_QA/render_commands.txt" <<'EOF'
          manim -pqh Geometry8_Circle_Fundamentals_FINAL.py Geometry8CircleFundamentalsFinal --format=mp4 --disable_caching
          manim -pqh Geometry8_Circle_Workshop_FINAL.py Geometry8CircleWorkshopFinal --format=mp4 --disable_caching
          EOF
          cat > "$PKG/03_QA/FINAL_QA_REPORT.md" <<'EOF'
          # FINAL QA REPORT

          Automated gates passed in GitHub Actions:
          - Python syntax/import/runtime construction through literal PQL;
          - literal PQH render for both primary scenes;
          - 1920×1080, 30 fps, H.264, yuv420p;
          - full FFmpeg decode;
          - frame sampling across each video;
          - SHA-256 generation;
          - combined master concatenation.

          Manual frame-by-frame pedagogical/visual audit is performed after artifact retrieval before the package is declared final to the user.
          EOF
          cat > "$PKG/README.md" <<'EOF'
          # Geometry 8 — Circle FINAL TOTAL

          Period II consolidation/recovery package with a controlled bridge toward Period III area work.
          Includes Circle Fundamentals, guided Circle Workshop, source, technical QA, sampled frames, and a combined master video.
          EOF
          (cd out && zip -9 -r Geometry8_Circle_FINAL_TOTAL.zip Geometry8_Circle_FINAL_TOTAL >/dev/null)

      - uses: actions/upload-artifact@v4
        with:
          name: Geometry8-Circle-FINAL-TOTAL-PQH
          path: |
            out/Geometry8_Circle_FINAL_TOTAL.zip
            out/Geometry8_Circle_FINAL_TOTAL/
          if-no-files-found: error
          retention-days: 7
