name: Bootstrap Geometry 8 Week 4 3D Solids Senior V1 Render

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render/geometry8-week4-solids-senior-v1-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg and recover source payload
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          BRANCH=render/geometry8-week4-solids-senior-v1-20260810
          JOB=render_jobs/geometry8_week4_solids_senior_v1_20260810
          git fetch --depth=1 origin "$BRANCH"
          : > /tmp/week4_payload.b64
          git show "FETCH_HEAD:$JOB/payload_00.b64" >> /tmp/week4_payload.b64
          git show "FETCH_HEAD:$JOB/payload_tail.b64" >> /tmp/week4_payload.b64
          test "$(wc -c < /tmp/week4_payload.b64)" -eq 22304
          base64 -d /tmp/week4_payload.b64 > /tmp/week4_payload.tar.xz
          xz -t /tmp/week4_payload.tar.xz
          rm -rf /tmp/week4 && mkdir -p /tmp/week4
          tar -xJf /tmp/week4_payload.tar.xz -C /tmp/week4
          cd /tmp/week4

          python - <<'PY'
          from pathlib import Path
          p = Path('Geometry8_Period3_Week4_3DSolids_Senior_V1_FINAL.py')
          s = p.read_text()
          old = '    def triangular_prism(self, *, center: np.ndarray = ORIGIN, scale: float = 1.0) -> VGroup:'
          new = '    def triangular_prism_model(self, *, center: np.ndarray = ORIGIN, scale: float = 1.0) -> VGroup:'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old2 = '        prism = self.triangular_prism(center=LEFT * 3.65 + DOWN * 0.55, scale=1.0)'
          new2 = '        prism = self.triangular_prism_model(center=LEFT * 3.65 + DOWN * 0.55, scale=1.0)'
          assert s.count(old2) == 1
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY

          python -m py_compile Geometry8_Period3_Week4_3DSolids_Senior_V1_FINAL.py jp_classroom_style.py check_manim_style.py
          python check_manim_style.py Geometry8_Period3_Week4_3DSolids_Senior_V1_FINAL.py
          ! grep -nE '([A-Za-z]:\\\\|/Users/|/home/[^/]+/Desktop)' Geometry8_Period3_Week4_3DSolids_Senior_V1_FINAL.py jp_classroom_style.py
          sha256sum Geometry8_Period3_Week4_3DSolids_Senior_V1_FINAL.py > /tmp/source_sha.txt

      - name: Pull ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Render PQL and literal PQH, validate, and generate QA
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/week4/Geometry8_Period3_Week4_3DSolids_Senior_V1_FINAL.py .
          cp /tmp/week4/jp_classroom_style.py .
          cp /tmp/week4/check_manim_style.py .
          IMAGE=manimcommunity/manim:v0.20.1
          FILE=Geometry8_Period3_Week4_3DSolids_Senior_V1_FINAL.py
          SCENE=Geometry8Period3Week4SolidsSeniorV1Final
          SLUG=Geometry8_Period3_Week4_3DSolids_Senior_V1_FINAL
          rm -rf media delivery_week4 qa_week4
          mkdir -p delivery_week4 qa_week4

          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.12 \
            -v "$PWD:/manim" -w /manim --entrypoint bash "$IMAGE" -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql Geometry8_Period3_Week4_3DSolids_Senior_V1_FINAL.py Geometry8Period3Week4SolidsSeniorV1Final --format=mp4 --disable_caching
            ' 2>&1 | tee delivery_week4/render_pql.log

          PQL="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" "delivery_week4/${SLUG}_pql.mp4"

          rm -rf media
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim --entrypoint bash "$IMAGE" -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh Geometry8_Period3_Week4_3DSolids_Senior_V1_FINAL.py Geometry8Period3Week4SolidsSeniorV1Final --format=mp4 --disable_caching
            ' 2>&1 | tee delivery_week4/render_pqh.log

          FINAL="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          OUT="delivery_week4/${SLUG}_pqh.mp4"
          cp "$FINAL" "$OUT"
          cp "$FILE" jp_classroom_style.py check_manim_style.py delivery_week4/
          cp /tmp/source_sha.txt delivery_week4/SOURCE_SHA256.txt

          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 "$OUT" > delivery_week4/ffprobe.txt

          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$OUT")" = 1920
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT")" = 1080
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$OUT")" = 30/1
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$OUT")" = h264
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$OUT")" = yuv420p

          ffmpeg -nostdin -v error -i "$OUT" -f null - 2> delivery_week4/full_decode.log
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT")"
          RATE="$(python -c "d=float('$DUR'); print(max(0.001,48.0/max(d,0.001)))")"
          ffmpeg -nostdin -y -v error -i "$OUT" \
            -vf "fps=$RATE,scale=480:-1,tile=6x8:padding=8:margin=8" \
            -frames:v 1 qa_week4/contact_sheet.jpg

          for P in 8 15 22 30 38 46 54 62 70 78 86 94; do
            T="$(python -c "d=float('$DUR'); print(d*$P/100.0)")"
            ffmpeg -nostdin -y -v error -ss "$T" -i "$OUT" -frames:v 1 "qa_week4/frame_${P}pct.png"
          done

          sha256sum "$OUT" > delivery_week4/SHA256SUMS.txt
          printf 'ManimCE 0.20.1\nCommand: manim -pqh %s %s --format=mp4 --disable_caching\n' "$FILE" "$SCENE" > delivery_week4/RENDER_INFO.txt

      - name: Upload final delivery
        uses: actions/upload-artifact@v4
        with:
          name: Geometry8_Period3_Week4_3DSolids_Senior_V1_FINAL
          path: |
            delivery_week4/
            qa_week4/
          if-no-files-found: error
          retention-days: 7
