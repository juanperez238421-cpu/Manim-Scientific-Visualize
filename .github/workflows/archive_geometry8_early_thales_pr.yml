name: Archive Geometry8 Early Thales PR Rerender

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'archive/geometry8-early-thales-rerender-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source and exact JP style
        shell: bash
        run: |
          set -euo pipefail
          base64 -d archive_rerender/thales_early_archive_reconstructed.py.gz.b64 | gzip -dc > thales_early_archive_reconstructed.py
          base64 -d archive_rerender/jp_classroom_style.py.gz.b64 | gzip -dc > jp_classroom_style.py
          python -m py_compile thales_early_archive_reconstructed.py jp_classroom_style.py

      - name: Install QA tools and ManimCE
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          docker pull manimcommunity/manim:v0.20.1

      - name: Render eight historical Thales families PQL then literal PQH
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final media
          mkdir -p final
          cat > /tmp/scenes.tsv <<'EOF'
          ThalesPyramidMasterclassArchive|2026-07-11|ThalesPyramidMasterclass_ARCHIVE_RERENDER
          ThalesTheoremArchive|2026-07-11|ThalesTheorem_ARCHIVE_RERENDER
          ThalesTheoremFullArchive|2026-07-11|ThalesTheoremFull_ARCHIVE_RERENDER
          ThalesTheoremGeometry8Archive|2026-07-11|ThalesTheoremGeometry8_ARCHIVE_RERENDER
          Geometry8SecondTermVisualRoadmapArchive|2026-07-13|Geometry8SecondTermVisualRoadmap_ARCHIVE_RERENDER
          Geometry8CongruenceThalesArchive|2026-07-15|Geometry8CongruenceThales_ARCHIVE_RERENDER
          TriangleRatiosSimilarityThalesArchive|2026-07-21|TriangleRatiosSimilarityThales_ARCHIVE_RERENDER
          UnitCircleThalesBridgeArchive|2026-07-22|UnitCircleThalesBridge_ARCHIVE_RERENDER
          EOF
          while IFS='|' read -r SCENE DATE STEM; do
            rm -rf media
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.20 -e SCENE="$SCENE" -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/bin/xdg-open
              chmod +x /tmp/bin/xdg-open
              export PATH="/tmp/bin:$PATH"
              manim -pql thales_early_archive_reconstructed.py "$SCENE" --format=mp4 --disable_caching --fps 30
            '
            test -n "$(find media -type f -name "${SCENE}.mp4" | head -1)"

            rm -rf media
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 -e SCENE="$SCENE" -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/bin/xdg-open
              chmod +x /tmp/bin/xdg-open
              export PATH="/tmp/bin:$PATH"
              manim -pqh thales_early_archive_reconstructed.py "$SCENE" --format=mp4 --disable_caching --fps 30
            '
            SRC="$(find media -type f -name "${SCENE}.mp4" ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            test -n "$SRC" && test -s "$SRC"
            OUT="final/${DATE}__${STEM}_pqh.mp4"
            cp "$SRC" "$OUT"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$OUT")" = h264
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$OUT")" = 1920
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT")" = 1080
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$OUT")" = 30/1
            ffmpeg -nostdin -v error -i "$OUT" -f null -
          done < /tmp/scenes.tsv
          cp thales_early_archive_reconstructed.py final/
          cp jp_classroom_style.py final/
          test "$(find final -maxdepth 1 -name '*.mp4' | wc -l)" -eq 8
          sha256sum final/*.mp4 > final/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Geometry8_Early_Thales_Proportional_Triangles_Archive_Rerenders
          path: final/
          retention-days: 14
          if-no-files-found: error
