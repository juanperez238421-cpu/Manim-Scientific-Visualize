name: Inventor Mirror Simetria Senior FINAL QA PQH 20260826

on:
  push:
    branches:
      - render-inventor-symmetry-senior-20260826
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inventor-mirror-simetria-senior-20260826
  cancel-in-progress: true

env:
  JOB_ROOT: render_jobs/inventor_dedicated_20260826
  MANIM_IMAGE: manimcommunity/manim:v0.20.1

jobs:
  render_mirror_senior:
    if: github.actor != 'github-actions[bot]'
    name: Render Mirror Simetria Senior Final QA
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout exact symmetry render branch
        uses: actions/checkout@v4
        with:
          ref: render-inventor-symmetry-senior-20260826
          fetch-depth: 0

      - name: Static Python and lesson-contract QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$JOB_ROOT/library/inventor_pro_ui.py" "$JOB_ROOT/scenes/03_mirror_simetria_senior.py"
          grep -q 'class InventorMirrorSimetriaSenior' "$JOB_ROOT/scenes/03_mirror_simetria_senior.py"
          grep -q 'YZ Plane' "$JOB_ROOT/scenes/03_mirror_simetria_senior.py"
          grep -q 'EDIT BOSS1' "$JOB_ROOT/scenes/03_mirror_simetria_senior.py"
          grep -q 'VERIFY EQUAL DISTANCE' "$JOB_ROOT/scenes/03_mirror_simetria_senior.py"

      - name: Prepare ManimCE 0.20.1 and QA tools
        shell: bash
        run: |
          set -euo pipefail
          command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          command -v zip >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zip >/dev/null)
          docker pull "$MANIM_IMAGE" >/dev/null

      - name: Literal PQL smoke render
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          rm -rf media_pql_mirror media_mirror delivery_mirror
          mkdir -p delivery_mirror/audit_frames
          chmod -R a+rwX .
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home \
            -v "$GITHUB_WORKSPACE:/manim" -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql scenes/03_mirror_simetria_senior.py InventorMirrorSimetriaSenior \
                --fps 15 --format=mp4 --media_dir media_pql_mirror --disable_caching
            " 2>&1 | tee delivery_mirror/render_pql.log
          PQL="$(find media_pql_mirror -type f -name 'InventorMirrorSimetriaSenior.mp4' ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home \
            -v "$GITHUB_WORKSPACE:/manim" -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh scenes/03_mirror_simetria_senior.py InventorMirrorSimetriaSenior \
                --fps 30 --format=mp4 --media_dir media_mirror --disable_caching
            " 2>&1 | tee delivery_mirror/render_pqh.log
          FINAL="$(find media_mirror -type f -name 'InventorMirrorSimetriaSenior.mp4' ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" delivery_mirror/Inventor_Mirror_Simetria_Senior_FINAL_PQH.mp4
          cp scenes/03_mirror_simetria_senior.py delivery_mirror/03_mirror_simetria_senior.py
          cp scenes/03_mirror_simetria.py delivery_mirror/03_mirror_simetria_previous_base.py
          cp library/inventor_pro_ui.py delivery_mirror/inventor_pro_ui.py

      - name: Senior automated technical and frame QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          F=delivery_mirror/Inventor_Mirror_Simetria_Senior_FINAL_PQH.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F" | tr -d '[:space:]')"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F" | tr -d '[:space:]')"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F" | tr -d '[:space:]')"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F" | tr -d '[:space:]')"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F" | tr -d '[:space:]')"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F" | tr -d '[:space:]')"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F" | tr -d '[:space:]')"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          python - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert 55 <= d <= 220, f"Unexpected lesson duration: {d}"
          PY
          ffmpeg -nostdin -v error -i "$F" -f null - 2> delivery_mirror/full_decode.log
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of json "$F" > delivery_mirror/VIDEO_TECHNICAL.json
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > delivery_mirror/VIDEO_TECHNICAL.tsv
          for P in 0.03 0.08 0.13 0.18 0.23 0.28 0.33 0.38 0.43 0.48 0.53 0.58 0.63 0.68 0.73 0.78 0.83 0.88 0.93 0.97; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "delivery_mirror/audit_frames/frame_${TAG}.png"
          done
          ffmpeg -y -loglevel error -pattern_type glob -i 'delivery_mirror/audit_frames/*.png' -vf 'scale=384:-1,tile=5x4' -frames:v 1 delivery_mirror/QA_CONTACT_SHEET.jpg
          sha256sum "$F" delivery_mirror/03_mirror_simetria_senior.py > delivery_mirror/SHA256SUMS.txt
          cat > delivery_mirror/QA_AUTOMATED_REPORT.txt <<EOF
          MIRROR / SIMETRÍA SENIOR — AUTOMATED QA PASS
          ManimCE: 0.20.1
          Final render: literal -pqh
          Resolution: $W x $H
          Frame rate: $FPS
          Codec: $CODEC
          Pixel format: $PIX
          Duration: $DUR s
          Full FFmpeg decode: PASS
          Static Python compile: PASS
          Narrative: concept -> base sketch/extrusion -> seed sketch -> Boss1 -> YZ plane -> Mirror preview -> equal-distance verification -> robust/fragile references -> parametric edit -> final orbit.
          Audit frames: 20
          Contact sheet: generated
          EOF
          zip -9 -j delivery_mirror/Inventor_Mirror_Simetria_Senior_FULL_PACKAGE.zip \
            delivery_mirror/Inventor_Mirror_Simetria_Senior_FINAL_PQH.mp4 \
            delivery_mirror/03_mirror_simetria_senior.py \
            delivery_mirror/03_mirror_simetria_previous_base.py \
            delivery_mirror/inventor_pro_ui.py \
            delivery_mirror/VIDEO_TECHNICAL.json delivery_mirror/VIDEO_TECHNICAL.tsv \
            delivery_mirror/QA_AUTOMATED_REPORT.txt delivery_mirror/QA_CONTACT_SHEET.jpg \
            delivery_mirror/SHA256SUMS.txt delivery_mirror/render_pql.log \
            delivery_mirror/render_pqh.log delivery_mirror/full_decode.log

      - name: Upload verified Mirror package
        uses: actions/upload-artifact@v4
        with:
          name: inventor-mirror-simetria-senior-final-pqh
          path: |
            ${{ env.JOB_ROOT }}/delivery_mirror/Inventor_Mirror_Simetria_Senior_FINAL_PQH.mp4
            ${{ env.JOB_ROOT }}/delivery_mirror/03_mirror_simetria_senior.py
            ${{ env.JOB_ROOT }}/delivery_mirror/03_mirror_simetria_previous_base.py
            ${{ env.JOB_ROOT }}/delivery_mirror/inventor_pro_ui.py
            ${{ env.JOB_ROOT }}/delivery_mirror/Inventor_Mirror_Simetria_Senior_FULL_PACKAGE.zip
            ${{ env.JOB_ROOT }}/delivery_mirror/VIDEO_TECHNICAL.json
            ${{ env.JOB_ROOT }}/delivery_mirror/VIDEO_TECHNICAL.tsv
            ${{ env.JOB_ROOT }}/delivery_mirror/QA_AUTOMATED_REPORT.txt
            ${{ env.JOB_ROOT }}/delivery_mirror/QA_CONTACT_SHEET.jpg
            ${{ env.JOB_ROOT }}/delivery_mirror/SHA256SUMS.txt
            ${{ env.JOB_ROOT }}/delivery_mirror/audit_frames/
          if-no-files-found: error
          retention-days: 7

      - name: Persist final MP4 and QA files on render branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$JOB_ROOT/delivery_mirror/Inventor_Mirror_Simetria_Senior_FINAL_PQH.mp4" \
                  "$JOB_ROOT/delivery_mirror/03_mirror_simetria_senior.py" \
                  "$JOB_ROOT/delivery_mirror/VIDEO_TECHNICAL.json" \
                  "$JOB_ROOT/delivery_mirror/VIDEO_TECHNICAL.tsv" \
                  "$JOB_ROOT/delivery_mirror/QA_AUTOMATED_REPORT.txt" \
                  "$JOB_ROOT/delivery_mirror/QA_CONTACT_SHEET.jpg" \
                  "$JOB_ROOT/delivery_mirror/SHA256SUMS.txt"
          git commit -m 'Persist verified Inventor Mirror Simetria Senior PQH delivery' || true
          git push origin HEAD:render-inventor-symmetry-senior-20260826
