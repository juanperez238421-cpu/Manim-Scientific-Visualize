name: House Extrusion PQH Commitback 20260818

on:
  push:
    branches:
      - render-house-extrusion-20260818
    paths:
      - 'render_jobs/house_extrusion/TRIGGER_RENDER.txt'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render-house-extrusion-20260818

      - name: Render, verify, and commit result back to branch
        shell: bash
        run: |
          set -uo pipefail
          JOB=render_jobs/house_extrusion
          SRC="$JOB/House_Extrusion_3D_ManimCE.py"
          OUT="$JOB/delivery_committed"
          rm -rf "$OUT" media_pql media
          mkdir -p "$OUT/audit_frames"

          fail_and_commit() {
            CODE="$1"
            printf 'FAILED\ncode=%s\n' "$CODE" > "$OUT/STATUS.txt"
            cp "$SRC" "$OUT/" 2>/dev/null || true
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$OUT"
            git commit -m "House extrusion render failure: $CODE" || true
            git push origin HEAD:render-house-extrusion-20260818 || true
            exit 1
          }

          # Correct the facade-normal direction: front wall normal is the Y axis.
          sed -i 's/door_cutter.shift(IN \* 0.75)/door_cutter.shift(DOWN * 0.75)/' "$SRC"
          sed -i 's/door_cutter.animate.shift(OUT \* 0.75)/door_cutter.animate.shift(UP * 0.75)/' "$SRC"
          sed -i 's/win_cutter.shift(IN \* 0.75)/win_cutter.shift(DOWN * 0.75)/' "$SRC"
          sed -i 's/win_cutter.animate.shift(OUT \* 0.75)/win_cutter.animate.shift(UP * 0.75)/' "$SRC"

          python -m py_compile "$SRC" > "$OUT/py_compile.log" 2>&1 || fail_and_commit PY_COMPILE
          grep -n 'cutter.shift\|cutter.animate' "$SRC" > "$OUT/AXIS_QA.txt"

          docker pull manimcommunity/manim:v0.20.1 > "$OUT/docker_pull.log" 2>&1 || fail_and_commit DOCKER_PULL

          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $SRC HouseExtrusion3D \
                --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee "$OUT/render_pql.log"
          PQL_STATUS=${PIPESTATUS[0]}
          set -e
          [ "$PQL_STATUS" -eq 0 ] || fail_and_commit PQL_RENDER

          PREVIEW="$(find media_pql -type f -name 'HouseExtrusion3D.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          [ -n "$PREVIEW" ] && [ -s "$PREVIEW" ] || fail_and_commit PQL_OUTPUT

          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $SRC HouseExtrusion3D \
                --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee "$OUT/render_pqh.log"
          PQH_STATUS=${PIPESTATUS[0]}
          set -e
          [ "$PQH_STATUS" -eq 0 ] || fail_and_commit PQH_RENDER

          FINAL="$(find media -type f -name 'HouseExtrusion3D.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          [ -n "$FINAL" ] && [ -s "$FINAL" ] || fail_and_commit PQH_OUTPUT
          cp "$FINAL" "$OUT/House_Extrusion_3D_PQH.mp4"
          cp "$SRC" "$OUT/House_Extrusion_3D_ManimCE.py"

          F="$OUT/House_Extrusion_3D_PQH.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"

          [ "$W" = 1920 ] || fail_and_commit WIDTH
          [ "$H" = 1080 ] || fail_and_commit HEIGHT
          [ "$FPS" = 30/1 ] || fail_and_commit FPS
          [ "$CODEC" = h264 ] || fail_and_commit CODEC
          [ "$PIX" = yuv420p ] || fail_and_commit PIX_FMT

          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/full_decode.log" || fail_and_commit DECODE

          for P in 0.04 0.16 0.30 0.44 0.58 0.72 0.86 0.97; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "$OUT/audit_frames/frame_${TAG}.png" || fail_and_commit QA_FRAME
          done

          sha256sum "$F" "$OUT/House_Extrusion_3D_ManimCE.py" > "$OUT/SHA256SUMS.txt"
          cat > "$OUT/RENDER_INFO.txt" <<'EOF'
Scene: HouseExtrusion3D
ManimCE: 0.20.1
Preview: literal -pql
Final: literal -pqh, 1920x1080, 30 fps
QA: py_compile + axis check + PQL + PQH + ffprobe + full FFmpeg decode + 8 audit frames + SHA-256
Sequence: terrain -> 2D footprint -> positive slab -> positive columns -> positive walls -> negative door -> negative window -> positive roof -> final camera orbit.
EOF
          printf 'SUCCESS\n' > "$OUT/STATUS.txt"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT" "$SRC"
          git commit -m 'Render HouseExtrusion3D verified PQH MP4'
          git push origin HEAD:render-house-extrusion-20260818
