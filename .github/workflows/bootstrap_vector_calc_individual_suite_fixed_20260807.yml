name: Bootstrap Vector Calculus Individual Suite Fixed Render

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render/vector-calc-individual-suite-20260807'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Resolve render phase
        id: phase
        shell: bash
        run: |
          set -euo pipefail
          PHASE="$(tr -d '[:space:]' < render_jobs/vector_calc_individual_suite_20260807/phase.txt)"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          if [ "$PHASE" = "pql" ]; then
            echo "quality=-pql" >> "$GITHUB_OUTPUT"
            echo "scale=0.065" >> "$GITHUB_OUTPUT"
            echo "artifact_name=VectorCalc_Individual_Suite_FIXED_pql" >> "$GITHUB_OUTPUT"
          elif [ "$PHASE" = "pqh" ]; then
            echo "quality=-pqh" >> "$GITHUB_OUTPUT"
            echo "scale=1.0" >> "$GITHUB_OUTPUT"
            echo "artifact_name=VectorCalc_Individual_Suite_FIXED_pqh" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported phase: $PHASE" >&2
            exit 2
          fi

      - name: Validate all Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile render_jobs/vector_calc_masterclass_v3_20260807/main.py
          python -m py_compile render_jobs/vector_calc_individual_suite_20260807/individual_base.py
          for f in render_jobs/vector_calc_individual_suite_20260807/[0-9][0-9]_*.py; do
            python -m py_compile "$f"
          done

      - name: Install FFmpeg verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Run protocol-compliant native ManimCE suite
        id: render
        continue-on-error: true
        shell: bash
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          QUALITY: ${{ steps.phase.outputs.quality }}
          SCALE: ${{ steps.phase.outputs.scale }}
        run: |
          set -o pipefail
          JOB=render_jobs/vector_calc_individual_suite_20260807
          IMAGE=manimcommunity/manim:v0.20.1
          rm -rf delivery_suite qa_suite media
          mkdir -p delivery_suite qa_suite
          docker pull "$IMAGE"

          ENTRIES=(
            '00_foundations_traces.py|VC00FoundationsTraces|00_foundations_traces'
            '01_circular_cylinder.py|VC01CircularCylinder|01_circular_cylinder'
            '02_parabolic_cylinder.py|VC02ParabolicCylinder|02_parabolic_cylinder'
            '03_ellipsoid.py|VC03Ellipsoid|03_ellipsoid'
            '04_hyperboloid_one_sheet.py|VC04HyperboloidOneSheet|04_hyperboloid_one_sheet'
            '05_hyperboloid_two_sheets.py|VC05HyperboloidTwoSheets|05_hyperboloid_two_sheets'
            '06_elliptic_cone.py|VC06EllipticCone|06_elliptic_cone'
            '07_elliptic_paraboloid.py|VC07EllipticParaboloid|07_elliptic_paraboloid'
            '08_hyperbolic_paraboloid.py|VC08HyperbolicParaboloid|08_hyperbolic_paraboloid'
            '09_classification_workshop.py|VC09ClassificationWorkshop|09_classification_workshop'
          )

          for ENTRY in "${ENTRIES[@]}"; do
            IFS='|' read -r FILE SCENE SLUG <<< "$ENTRY"
            echo "===== RENDER $SLUG / $PHASE ====="
            mkdir -p "delivery_suite/$SLUG" "qa_suite/$SLUG"

            set +e
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/manim-home \
              -e LESSON_TIME_SCALE="$SCALE" \
              -v "$PWD:/manim" \
              -w /manim \
              --entrypoint bash \
              "$IMAGE" \
              -c '
                set -euo pipefail
                mkdir -p /tmp/manim-bin
                printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
                chmod +x /tmp/manim-bin/xdg-open
                export PATH="/tmp/manim-bin:$PATH"
                manim --version
                manim '"$QUALITY"' '"$JOB"'/'"$FILE"' '"$SCENE"' --format=mp4 --disable_caching
              ' 2>&1 | tee "delivery_suite/$SLUG/render_${PHASE}.log"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -ne 0 ]; then
              echo "Render failed for $SLUG with status $STATUS" >&2
              exit "$STATUS"
            fi

            VIDEO="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            test -n "$VIDEO"
            test -s "$VIDEO"
            cp "$VIDEO" "delivery_suite/$SLUG/${SLUG}_${PHASE}.mp4"
            cp "$JOB/$FILE" "delivery_suite/$SLUG/$FILE"
            cp "$JOB/individual_base.py" "delivery_suite/$SLUG/individual_base.py"

            ffprobe -v error \
              -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 \
              "delivery_suite/$SLUG/${SLUG}_${PHASE}.mp4" \
              > "delivery_suite/$SLUG/ffprobe.txt"

            ffmpeg -nostdin -v error \
              -i "delivery_suite/$SLUG/${SLUG}_${PHASE}.mp4" \
              -f null - 2> "delivery_suite/$SLUG/full_decode.log"

            DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "delivery_suite/$SLUG/${SLUG}_${PHASE}.mp4")"
            FPS_SAMPLE="$(python -c "d=float('$DURATION'); print(max(0.001,12.0/max(d,0.001)))")"
            ffmpeg -nostdin -y -v error \
              -i "delivery_suite/$SLUG/${SLUG}_${PHASE}.mp4" \
              -vf "fps=$FPS_SAMPLE,scale=480:-1,tile=4x3:padding=8:margin=8" \
              -frames:v 1 "qa_suite/$SLUG/contact_sheet.jpg" || true

            sha256sum "delivery_suite/$SLUG/${SLUG}_${PHASE}.mp4" \
              > "delivery_suite/$SLUG/SHA256SUMS.txt"

            printf 'Scene: %s\nSource: %s\nBase library: render_jobs/vector_calc_masterclass_v3_20260807/main.py\nManimCE image: %s\nPhase: %s\nCommand: manim %s %s/%s %s --format=mp4 --disable_caching\nLESSON_TIME_SCALE: %s\n' \
              "$SCENE" "$FILE" "$IMAGE" "$PHASE" "$QUALITY" "$JOB" "$FILE" "$SCENE" "$SCALE" \
              > "delivery_suite/$SLUG/RENDER_INFO.txt"
          done

          cp "$JOB/individual_base.py" delivery_suite/
          cp render_jobs/vector_calc_masterclass_v3_20260807/main.py delivery_suite/V3_BASE_LIBRARY.py
          sha256sum delivery_suite/*/*.mp4 > delivery_suite/ALL_VIDEOS_SHA256.txt

      - name: Upload native suite or diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.phase.outputs.artifact_name }}
          path: |
            delivery_suite/
            qa_suite/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve failure status after diagnostic upload
        if: steps.render.outcome != 'success'
        shell: bash
        run: exit 1
