name: Statistics10 IQR Class02 SENIOR QA V5 FINAL PQH 20260831

on:
  push:
    branches:
      - render/statistics10-iqr-class02-senior-qa-v5-20260831
    paths:
      - 'render_jobs/statistics10_iqr_class02_compare_boxplots_20260831/**'
      - '.github/workflows/statistics10_iqr_class02_senior_qa_v5_pqh_20260831.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact Senior QA V5 branch
        uses: actions/checkout@v4
        with:
          ref: render/statistics10-iqr-class02-senior-qa-v5-20260831

      - name: Generate V5 from persisted V3 source and run source QA
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics10_iqr_class02_compare_boxplots_20260831
          BASE="$JOB/Statistics10_IQR_Class02_Compare_Boxplots_SENIOR_QA_V3.py"
          PATCH="$JOB/apply_senior_qa_v5.py"
          V5="$JOB/Statistics10_IQR_Class02_Compare_Boxplots_SENIOR_QA_V5.py"
          STYLE="$JOB/jp_classroom_style.py"
          CHECK="$JOB/check_manim_style.py"
          for f in "$BASE" "$PATCH" "$STYLE" "$CHECK"; do test -s "$f"; done
          python "$PATCH" "$BASE" "$V5"
          python -m py_compile "$BASE" "$PATCH" "$V5" "$STYLE" "$CHECK"
          python "$CHECK" "$V5" | tee static_style_qa_v5.txt
          grep -q 'assert_no_bbox_overlap' "$V5"
          grep -q 'scene 08 IQR annotations' "$V5"
          grep -q 'scene 09 whisker callouts' "$V5"
          grep -q 'outlier_mark = self.compare_plot_b\[6\]\[0\]' "$V5"
          if grep -q 'out_circle = Circle' "$V5"; then echo 'FAIL: duplicate outlier circle survived'; exit 1; fi
          mkdir -p qa_preview final_out final_out/audit_frames package
          sha256sum "$BASE" "$PATCH" "$V5" "$STYLE" > qa_preview/SOURCE_SHA256SUMS_V5.txt

      - name: Prepare pinned ManimCE and QA environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip imagemagick
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL complete-timeline runtime gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics10_iqr_class02_compare_boxplots_20260831
          rm -rf media_pql_v5
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.07 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" >/tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql Statistics10_IQR_Class02_Compare_Boxplots_SENIOR_QA_V5.py \
                Statistics10IQRClass02CompareBoxplotsFinal \
                --format=mp4 --media_dir=/manim/media_pql_v5 --disable_caching
            ' 2>&1 | tee qa_preview/render_pql_v5.log
          PQL="$(find media_pql_v5 -type f -name 'Statistics10IQRClass02CompareBoxplotsFinal.mp4' -print -quit)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH Senior QA V5 final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics10_iqr_class02_compare_boxplots_20260831
          rm -rf media_pqh_v5
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" >/tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh Statistics10_IQR_Class02_Compare_Boxplots_SENIOR_QA_V5.py \
                Statistics10IQRClass02CompareBoxplotsFinal \
                --format=mp4 --media_dir=/manim/media_pqh_v5 --disable_caching
            ' 2>&1 | tee final_out/render_pqh_v5.log
          FINAL="$(find media_pqh_v5 -type f -name 'Statistics10IQRClass02CompareBoxplotsFinal.mp4' -print -quit)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" final_out/Statistics10_IQR_Class02_Compare_Boxplots_SENIOR_QA_V5_FINAL_pqh.mp4

      - name: Strict technical media QA and complete decode
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Statistics10_IQR_Class02_Compare_Boxplots_SENIOR_QA_V5_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tframes\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$FRAMES" "$SIZE" > final_out/VIDEO_TECHNICAL_V5.tsv
          test "$W" = 1920; test "$H" = 1080; test "$FPS" = 30/1; test "$CODEC" = h264; test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> final_out/full_decode_v5.log
          test ! -s final_out/full_decode_v5.log

      - name: Every-frame blank sparse and border scan
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Statistics10_IQR_Class02_Compare_Boxplots_SENIOR_QA_V5_FINAL_pqh.mp4
          ffmpeg -nostdin -v error -i "$F" -vf scale=320:180 -pix_fmt gray -f rawvideo final_out/all_frames_gray_v5.raw
          python - <<'PY'
          from pathlib import Path
          import csv
          W,H=320,180; B=W*H
          raw=Path('final_out/all_frames_gray_v5.raw').read_bytes(); assert len(raw)%B==0
          n=len(raw)//B
          border_idx=[y*W+x for y in range(H) for x in range(W) if x<5 or x>=W-5 or y<5 or y>=H-5]
          blank=sparse=border_heavy=0; rows=[]
          for i in range(n):
              fr=raw[i*B:(i+1)*B]
              dark_n=sum(p<245 for p in fr); frac=dark_n/B
              if dark_n==0: blank+=1
              if frac<0.004: sparse+=1
              border=sum(fr[j]<235 for j in border_idx); bfrac=border/max(dark_n,1)
              if bfrac>0.20 and dark_n>200: border_heavy+=1
              rows.append((i,frac,bfrac))
          with open('final_out/FRAME_BY_FRAME_SCAN_V5.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['frame','dark_fraction','border_dark_fraction']); w.writerows(rows)
          Path('final_out/FRAME_SCAN_SUMMARY_V5.txt').write_text(f'frames_scanned={n}\nblank_frames={blank}\nvery_sparse_frames={sparse}\nborder_heavy_frames={border_heavy}\n')
          assert blank < n*0.10
          assert sparse < n*0.16
          assert border_heavy < n*0.02
          PY
          rm final_out/all_frames_gray_v5.raw

      - name: Dense 180-frame senior visual audit
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Statistics10_IQR_Class02_Compare_Boxplots_SENIOR_QA_V5_FINAL_pqh.mp4
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          rm -rf final_out/audit_frames && mkdir -p final_out/audit_frames
          for INDEX in $(seq -w 0 179); do
            T="$(python -c "print(float('$DUR')*(int('$INDEX')+0.5)/180.0)")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "final_out/audit_frames/frame_${INDEX}.png"
          done
          test "$(find final_out/audit_frames -type f -name '*.png' | wc -l)" -eq 180
          montage final_out/audit_frames/*.png -thumbnail 320x180 -tile 10x18 -geometry +6+10 -background white -quality 90 final_out/CONTACT_SHEET_180_V5.jpg
          test -s final_out/CONTACT_SHEET_180_V5.jpg

      - name: Assemble QA evidence and package
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/statistics10_iqr_class02_compare_boxplots_20260831
          F=final_out/Statistics10_IQR_Class02_Compare_Boxplots_SENIOR_QA_V5_FINAL_pqh.mp4
          sha256sum "$F" "$JOB/Statistics10_IQR_Class02_Compare_Boxplots_SENIOR_QA_V5.py" "$JOB/apply_senior_qa_v5.py" > final_out/SHA256SUMS_V5.txt
          {
            echo '# Statistics 10 IQR Class 2 - Senior QA V5 result'
            echo
            echo '- Persisted V3 Manim source used as base: PASS'
            echo '- Source-level V3 -> V5 correction: PASS'
            echo '- Runtime critical-overlap assertions: PASS'
            echo '- Scene 08 IQR lane separation: PASS'
            echo '- Scene 09 Group-B whisker-label separation: PASS'
            echo '- Scene 11 duplicate outlier ring removal: PASS'
            echo '- Literal PQL complete-timeline gate: PASS'
            echo '- Literal PQH final render: PASS'
            echo '- H.264 / 1920x1080 / 30 fps / yuv420p: PASS'
            echo '- Full FFmpeg decode: PASS'
            echo '- Every-frame scan: PASS'
            echo '- 180 distributed audit frames/contact sheet: generated'
            echo '- SHA-256 manifest: generated'
            echo
            cat final_out/VIDEO_TECHNICAL_V5.tsv
            echo
            cat final_out/FRAME_SCAN_SUMMARY_V5.txt
          } > final_out/SENIOR_QA_RESULT_V5.md
          ROOT=package/Statistics10_IQR_Class02_SENIOR_QA_V5_FINAL_PQH
          mkdir -p "$ROOT/src" "$ROOT/qa" "$ROOT/render"
          cp "$JOB/Statistics10_IQR_Class02_Compare_Boxplots_SENIOR_QA_V5.py" "$JOB/apply_senior_qa_v5.py" "$JOB/jp_classroom_style.py" "$ROOT/src/"
          cp "$F" "$ROOT/render/"
          cp final_out/CONTACT_SHEET_180_V5.jpg final_out/SENIOR_QA_RESULT_V5.md final_out/VIDEO_TECHNICAL_V5.tsv final_out/FRAME_SCAN_SUMMARY_V5.txt final_out/FRAME_BY_FRAME_SCAN_V5.csv final_out/SHA256SUMS_V5.txt "$ROOT/qa/"
          (cd package && zip -qr ../Statistics10_IQR_Class02_SENIOR_QA_V5_FULL_PACKAGE.zip Statistics10_IQR_Class02_SENIOR_QA_V5_FINAL_PQH)
          test -s Statistics10_IQR_Class02_SENIOR_QA_V5_FULL_PACKAGE.zip

      - name: Persist Senior QA V5 delivery to branch
        shell: bash
        run: |
          set -euo pipefail
          DEST=deliveries/statistics10_iqr_class02_senior_qa_v5_20260831
          mkdir -p "$DEST"
          cp final_out/Statistics10_IQR_Class02_Compare_Boxplots_SENIOR_QA_V5_FINAL_pqh.mp4 "$DEST/"
          cp final_out/CONTACT_SHEET_180_V5.jpg final_out/SENIOR_QA_RESULT_V5.md final_out/VIDEO_TECHNICAL_V5.tsv final_out/FRAME_SCAN_SUMMARY_V5.txt final_out/SHA256SUMS_V5.txt "$DEST/"
          cp Statistics10_IQR_Class02_SENIOR_QA_V5_FULL_PACKAGE.zip "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST" render_jobs/statistics10_iqr_class02_compare_boxplots_20260831/Statistics10_IQR_Class02_Compare_Boxplots_SENIOR_QA_V5.py
          if ! git diff --cached --quiet; then
            git commit -m 'render: publish Statistics 10 IQR Class 2 Senior QA V5'
            git push origin HEAD:render/statistics10-iqr-class02-senior-qa-v5-20260831
          fi

      - name: Upload final Senior QA V5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10-IQR-Class02-SENIOR-QA-V5-FINAL-PQH-20260831
          path: |
            final_out/Statistics10_IQR_Class02_Compare_Boxplots_SENIOR_QA_V5_FINAL_pqh.mp4
            final_out/CONTACT_SHEET_180_V5.jpg
            final_out/SENIOR_QA_RESULT_V5.md
            final_out/VIDEO_TECHNICAL_V5.tsv
            final_out/FRAME_SCAN_SUMMARY_V5.txt
            final_out/SHA256SUMS_V5.txt
            Statistics10_IQR_Class02_SENIOR_QA_V5_FULL_PACKAGE.zip
          if-no-files-found: error
          retention-days: 14
