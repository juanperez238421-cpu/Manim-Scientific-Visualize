name: OpenAI Asset Demo Short
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/openai-asset-manim-pqh-demo-20260815'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Render and verify
        run: bash render_jobs/openai_asset_demo_20260815/run_short.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAIAssetDemo-PQH
          path: delivery/
          if-no-files-found: error
          retention-days: 7
