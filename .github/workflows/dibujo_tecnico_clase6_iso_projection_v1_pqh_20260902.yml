name: Dibujo Tecnico Clase 6 ISO Projection Systems V1 SENIOR FINAL PQH

on:
  push:
    branches:
      - render/dibujo-tecnico-clase6-iso-projection-v1-20260902
    paths:
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/**'
      - '.github/workflows/dibujo_tecnico_clase6_iso_projection_v1_pqh_20260902.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  render-dibujo-tecnico-clase6-iso-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Materialize source and static gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          mkdir -p out qa_out media pql_media /tmp/manim-bin /tmp/manim-home
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          python "$JOB/materialize_source.py"
          SCENE="$JOB/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR.py"
          python -m py_compile "$SCENE"
          python - <<'PY'
          from pathlib import Path
          p=Path('render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR.py')
          s=p.read_text(encoding='utf-8')
          required=['SISTEMA DIEDRICO','ISO A','ISO E','THIRD-ANGLE','FIRST-ANGLE','TOP','BOTTOM','LEFT','RIGHT','REAR','NTC1777','EJEMPLO ISO A','EJEMPLO ISO E','REFERENCIAS']
          missing=[x for x in required if x not in s]
          assert not missing, missing
          assert 'config.pixel_width = 1920' in s
          assert 'config.pixel_height = 1080' in s
          assert 'config.frame_rate = 30' in s
          print('Static source gate: PASS')
          PY

      - name: Literal PQL complete timeline gate
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=0.06
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pql Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR.py \
            TechnicalDrawingClass6ISO \
            --fps 15 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/pql_media" \
            2>&1 | tee "$GITHUB_WORKSPACE/qa_out/PQL.log"
          cd "$GITHUB_WORKSPACE"
          PQL="$(find pql_media -type f -name 'TechnicalDrawingClass6ISO.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" qa_out/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR_pql.mp4

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=1.0
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pqh Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR.py \
            TechnicalDrawingClass6ISO \
            --fps 30 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/media" \
            2>&1 | tee "$GITHUB_WORKSPACE/out/PQH.log"
          cd "$GITHUB_WORKSPACE"
          VIDEO="$(find media -type f -name 'TechnicalDrawingClass6ISO.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"
          cp "$VIDEO" out/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR_FINAL_pqh.mp4
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR.py out/

      - name: Technical full-decode QA
        id: tech
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR_FINAL_pqh.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/VIDEO_TECHNICAL_QA.txt
          import av, os, sys
          p=sys.argv[1]; frames=0
          with av.open(p) as c:
              s=c.streams.video[0]
              codec=s.codec_context.name
              width=s.codec_context.width
              height=s.codec_context.height
              fmt=s.codec_context.format.name if s.codec_context.format else ''
              fps=float(s.average_rate) if s.average_rate else 0.0
              duration=float(c.duration)/float(av.time_base) if c.duration else 0.0
              for _ in c.decode(s): frames += 1
          size=os.path.getsize(p)
          print(f'codec_name={codec}')
          print(f'width={width}')
          print(f'height={height}')
          print(f'pix_fmt={fmt}')
          print(f'average_fps={fps:.6f}')
          print(f'duration={duration:.6f}')
          print(f'frames_decoded={frames}')
          print(f'size={size}')
          assert codec == 'h264'
          assert (width,height) == (1920,1080)
          assert fmt == 'yuv420p'
          assert 29.8 <= fps <= 30.2
          assert duration > 70
          assert frames > 2000
          assert size > 750_000
          PY
          SHA="$(sha256sum "$VIDEO" | awk '{print $1}')"
          SIZE="$(stat -c%s "$VIDEO")"
          echo "$SHA  $VIDEO" | tee qa_out/SHA256SUMS.txt
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: 72-frame visual audit contact sheet
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR_FINAL_pqh.mp4
          mkdir -p qa_out/audit_frames
          python - "$VIDEO" <<'PY' | tee qa_out/VISUAL_AUDIT.txt
          import av, math, os, sys
          from PIL import Image, ImageDraw
          p=sys.argv[1]; count=72; saved=[]
          with av.open(p) as c:
              s=c.streams.video[0]
              duration=float(c.duration)/float(av.time_base)
              targets=[duration*i/(count+1) for i in range(1,count+1)]
              ti=0
              for frame in c.decode(s):
                  if ti >= len(targets): break
                  t=float(frame.pts*frame.time_base) if frame.pts is not None else 0.0
                  if t >= targets[ti]:
                      im=Image.fromarray(frame.to_ndarray(format='rgb24'))
                      fp=f'qa_out/audit_frames/frame_{ti+1:02d}_{targets[ti]:07.2f}.jpg'
                      im.save(fp,quality=92); saved.append(fp); ti += 1
          assert len(saved) >= 68
          cards=[]
          for fp in saved:
              im=Image.open(fp).convert('RGB'); im.thumbnail((480,270))
              card=Image.new('RGB',(500,300),'white'); card.paste(im,((500-im.width)//2,8))
              ImageDraw.Draw(card).text((10,280),os.path.basename(fp),fill='black'); cards.append(card)
          cols=4; rows=math.ceil(len(cards)/cols)
          sheet=Image.new('RGB',(cols*500,rows*300),'white')
          for i,im in enumerate(cards): sheet.paste(im,((i%cols)*500,(i//cols)*300))
          sheet.save('qa_out/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR_FINAL_contact_sheet.jpg',quality=92)
          print('audit_frames=',len(saved)); print('contact_sheet=PASS')
          PY

      - name: Publish validated MP4 and exact source directly to GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.tech.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.tech.outputs.size }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.parse, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']
          parent=os.environ['GITHUB_SHA']; branch=os.environ['GITHUB_REF_NAME']
          video_source='out/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR_FINAL_pqh.mp4'
          source_file='out/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR.py'
          video_target='published_renders/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR_FINAL_pqh.mp4'
          source_target='render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR.py'
          expected_sha=os.environ['EXPECTED_SHA']; expected_size=int(os.environ['EXPECTED_SIZE'])
          api=f'https://api.github.com/repos/{repo}'
          video=open(video_source,'rb').read(); source=open(source_file,'rb').read()
          assert hashlib.sha256(video).hexdigest() == expected_sha
          assert len(video) == expected_size
          assert len(video) < 100_000_000
          def request(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,method=method)
              req.add_header('Authorization',f'Bearer {token}')
              req.add_header('Accept','application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version','2022-11-28')
              if data is not None: req.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(req,timeout=180) as r:
                      body=r.read(); return json.loads(body) if body else {}
              except urllib.error.HTTPError as e:
                  print(e.read().decode(errors='replace')); raise
          base_commit=request('GET',f'{api}/git/commits/{parent}')
          vb=request('POST',f'{api}/git/blobs',{'content':base64.b64encode(video).decode(),'encoding':'base64'})
          sb=request('POST',f'{api}/git/blobs',{'content':base64.b64encode(source).decode(),'encoding':'base64'})
          tree=request('POST',f'{api}/git/trees',{'base_tree':base_commit['tree']['sha'],'tree':[
              {'path':video_target,'mode':'100644','type':'blob','sha':vb['sha']},
              {'path':source_target,'mode':'100644','type':'blob','sha':sb['sha']},
          ]})
          commit=request('POST',f'{api}/git/commits',{'message':'Publish Dibujo Tecnico Clase 6 ISO V1 senior PQH + source [skip ci]','tree':tree['sha'],'parents':[parent]})
          ref=urllib.parse.quote(branch,safe='/')
          request('PATCH',f'{api}/git/refs/heads/{ref}',{'sha':commit['sha'],'force':False})
          print('published_commit=',commit['sha'])
          print('published_size=',len(video))
          print('published_sha256=',expected_sha)
          print('direct_download=',f'https://raw.githubusercontent.com/{repo}/{branch}/{video_target}')
          print('source_url=',f'https://raw.githubusercontent.com/{repo}/{branch}/{source_target}')
          PY

      - name: Verify direct GitHub publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SIZE: ${{ steps.tech.outputs.size }}
        run: |
          set -euo pipefail
          sleep 2
          python - <<'PY' | tee qa_out/DIRECT_GITHUB_PUBLICATION.txt
          import json, os, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; branch=os.environ['GITHUB_REF_NAME']
          target='published_renders/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR_FINAL_pqh.mp4'
          expected=int(os.environ['EXPECTED_SIZE'])
          url=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(target,safe="/")}?ref={urllib.parse.quote(branch,safe="/")}'
          req=urllib.request.Request(url)
          req.add_header('Authorization',f'Bearer {os.environ["GH_TOKEN"]}')
          req.add_header('Accept','application/vnd.github+json')
          req.add_header('X-GitHub-Api-Version','2022-11-28')
          with urllib.request.urlopen(req,timeout=60) as r: obj=json.load(r)
          print('path=',obj['path']); print('size=',obj['size']); print('download_url=',obj['download_url'])
          assert obj['size'] == expected; assert obj['download_url'].endswith('.mp4')
          print('DIRECT_GITHUB_DELIVERY=PASS')
          PY

      - name: Upload render and QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dibujo-Tecnico-Clase6-ISO-Projection-Systems-V1-SENIOR-FINAL-PQH-20260902
          path: |
            out/
            qa_out/
          if-no-files-found: warn
          retention-days: 14
