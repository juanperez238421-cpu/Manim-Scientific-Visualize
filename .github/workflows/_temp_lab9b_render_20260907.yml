name: TEMP Lab9B full render 20260907

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp_lab9b_render_20260907.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout target Lab9B branch
        uses: actions/checkout@v4
        with:
          ref: manim/lab9b-seating-no-pc07-20260907
          fetch-depth: 0

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/lab9b_seating_no_pc07_20260907/lab9b_seating.py
          PDFBUILDER=render_jobs/lab9b_seating_no_pc07_20260907/build_pdf_from_video.py
          python -m py_compile "$SRC" "$PDFBUILDER"
          grep -q "GROUP='NOVENO B'" "$SRC"
          grep -q "len(STUDENTS)==18" "$SRC"
          grep -q "USED=(1,2,3,4,5,6)" "$SRC"
          grep -q "BLOCKED=7" "$SRC"

      - name: Install rendering and PDF tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip poppler-utils python3-pip
          python -m pip install --quiet reportlab pillow
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL QA render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/lab9b_seating_no_pc07_20260907/lab9b_seating.py
          SCENE=Lab9BFixedSeatingNoPC07
          rm -rf media_pql qa_out
          mkdir -p qa_out
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.06 \
            -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pql $SRC $SCENE --fps 15 --format=mp4 --media_dir media_pql --disable_caching" \
            2>&1 | tee qa_out/pql.log
          PQL="$(find media_pql -type f -name "${SCENE}.mp4" | head -1)"
          test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/lab9b_seating_no_pc07_20260907/lab9b_seating.py
          SCENE=Lab9BFixedSeatingNoPC07
          OUT=deliverables/lab9b_seating_no_pc07
          rm -rf media "$OUT"
          mkdir -p "$OUT"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pqh $SRC $SCENE --fps 30 --format=mp4 --media_dir media --disable_caching" \
            2>&1 | tee "$OUT/pqh.log"
          FINAL="$(find media -type f -name "${SCENE}.mp4" | head -1)"
          test -s "$FINAL"
          cp "$FINAL" "$OUT/Lab9B_Fixed_Seating_NO_PC07_SENIOR_FINAL_pqh.mp4"

      - name: Technical QA and PDF from real video frames
        shell: bash
        run: |
          set -euo pipefail
          OUT=deliverables/lab9b_seating_no_pc07
          F="$OUT/Lab9B_Fixed_Seating_NO_PC07_SENIOR_FINAL_pqh.mp4"
          PDF="$OUT/Lab9B_Fixed_Seating_NO_PC07_PRESENTACION.pdf"
          BUILDER=render_jobs/lab9b_seating_no_pc07_20260907/build_pdf_from_video.py
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          R="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          C="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          P="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          D="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$R" "$C" "$P" "$D" > "$OUT/VIDEO_TECHNICAL.tsv"
          test "$W" = 1920
          test "$H" = 1080
          test "$R" = 30/1
          test "$C" = h264
          test "$P" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/decode.log"
          mkdir -p "$OUT/pdf_frames"
          python "$BUILDER" "$F" "$PDF" --frames-dir "$OUT/pdf_frames" | tee "$OUT/pdf_build.log"
          test -s "$PDF"
          PAGES="$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')"
          test "$PAGES" -ge 12
          printf 'pages\t%s\n' "$PAGES" > "$OUT/PDF_TECHNICAL.tsv"
          mkdir -p "$OUT/qa_frames"
          for FRACTION in 0.05 0.18 0.32 0.46 0.60 0.74 0.88 0.97; do
            T="$(awk -v d="$D" -v f="$FRACTION" 'BEGIN{printf "%.2f",d*f}')"
            TAG="$(printf '%s' "$FRACTION" | tr -d '.')"
            ffmpeg -y -ss "$T" -i "$F" -frames:v 1 "$OUT/qa_frames/frame_${TAG}.png" >/dev/null 2>&1
          done
          ffmpeg -y -pattern_type glob -i "$OUT/qa_frames/frame_*.png" -vf 'scale=480:-1,tile=4x2:padding=8:margin=8:color=white' -frames:v 1 "$OUT/qa_contact_sheet.jpg" >/dev/null 2>&1
          sha256sum "$F" "$PDF" > "$OUT/SHA256SUMS.txt"
          cp render_jobs/lab9b_seating_no_pc07_20260907/lab9b_seating.py "$OUT/Lab9B_source.py"
          cp "$BUILDER" "$OUT/build_pdf_from_video.py"
          cat > "$OUT/RENDER_INFO.txt" <<'EOF'
Noveno B fixed seating by official list order
ManimCE 0.20.1
Literal PQL then literal PQH
1920x1080 30 fps H.264 yuv420p
PDF built from real frames extracted from final MP4
18 students
PC01 1-3
PC02 4-6
PC03 7-9
PC04 10-12
PC05 13-15
PC06 16-18
PC07 BLOCKED
PC08 NO ASSIGNMENT
PC09 NO ASSIGNMENT
EOF

      - name: Build full ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUT=deliverables/lab9b_seating_no_pc07
          (cd "$OUT" && zip -9 -r Lab9B_NO_PC07_FULL_TOTAL_PACKAGE.zip \
            Lab9B_Fixed_Seating_NO_PC07_SENIOR_FINAL_pqh.mp4 \
            Lab9B_Fixed_Seating_NO_PC07_PRESENTACION.pdf \
            Lab9B_source.py build_pdf_from_video.py \
            VIDEO_TECHNICAL.tsv PDF_TECHNICAL.tsv SHA256SUMS.txt RENDER_INFO.txt \
            decode.log pqh.log pdf_build.log qa_contact_sheet.jpg qa_frames pdf_frames)
          test -s "$OUT/Lab9B_NO_PC07_FULL_TOTAL_PACKAGE.zip"

      - name: Persist delivery on target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/lab9b_seating_no_pc07
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "render: persist Noveno B seating MP4 PDF ZIP"
            git push origin HEAD:manim/lab9b-seating-no-pc07-20260907
          fi

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Lab9B-NO-PC07-FULL-TOTAL
          path: deliverables/lab9b_seating_no_pc07/
          if-no-files-found: error
          retention-days: 7
