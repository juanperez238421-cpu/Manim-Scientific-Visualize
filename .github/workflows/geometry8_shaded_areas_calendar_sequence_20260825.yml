name: Geometry 8 Shaded Areas Calendar Sequence 20260825

on:
  pull_request:
    branches: [agent/geometry8-circle-exercises-workshop-v4-large-text-20260824]
    paths:
      - 'render_jobs/geometry8_shaded_areas_sequence_20260825/**'
      - '.github/workflows/geometry8_shaded_areas_calendar_sequence_20260825.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-complete-calendar-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Render four lessons, build PDFs, audit and package
        shell: bash
        run: bash render_jobs/geometry8_shaded_areas_sequence_20260825/run_full_protocol_v2.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Geometry8-Shaded-Areas-Calendar-Sequence-20260825-COMPLETE-PQH
          path: |
            out/
            qa_out/
          if-no-files-found: error
          retention-days: 14
