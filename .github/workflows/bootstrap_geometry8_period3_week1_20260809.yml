name: Bootstrap Geometry 8 Period 3 Week 1 Render

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render/geometry8-period3-week1-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Recover Week 1 source package
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_period3_week1_20260809
          mkdir -p "$JOB/project"
          BASE="https://raw.githubusercontent.com/juanperez238421-cpu/ijr-geometria-8-2026-2/render-payload-week1-20260809/manim_temp"
          : > /tmp/week1_payload.tar.gz.b64
          for N in 1 2 3 4; do
            curl -fL --retry 3 "$BASE/week1_payload.part${N}.b64" -o "/tmp/part${N}.b64"
            cat "/tmp/part${N}.b64" >> /tmp/week1_payload.tar.gz.b64
          done
          test "$(wc -c < /tmp/week1_payload.tar.gz.b64)" -eq 25368
          base64 -d /tmp/week1_payload.tar.gz.b64 > /tmp/week1_payload.tar.gz
          tar -xzf /tmp/week1_payload.tar.gz -C "$JOB/project"
          find "$JOB/project" -maxdepth 3 -type f -print

      - name: Validate Python sources and JP style
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_period3_week1_20260809/project
          python -m py_compile "$JOB/geometry8_period3_week1_class1_theory.py" "$JOB/geometry8_period3_week1_class2_practice.py"
          python "$JOB/tools/check_manim_style.py" "$JOB/geometry8_period3_week1_class1_theory.py"
          python "$JOB/tools/check_manim_style.py" "$JOB/geometry8_period3_week1_class2_practice.py"

      - name: Pull official ManimCE 0.20.1 image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Render -pql then literal -pqh and verify
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          JOB=render_jobs/geometry8_period3_week1_20260809/project
          IMAGE=manimcommunity/manim:v0.20.1
          rm -rf delivery_geometry8_week1 qa_geometry8_week1 media
          mkdir -p delivery_geometry8_week1 qa_geometry8_week1
          ENTRIES=(
            'geometry8_period3_week1_class1_theory.py|Geometry8Week1Theory|class1_theory'
            'geometry8_period3_week1_class2_practice.py|Geometry8Week1Practice|class2_practice'
          )
          for ENTRY in "${ENTRIES[@]}"; do
            IFS='|' read -r FILE SCENE SLUG <<< "$ENTRY"
            mkdir -p "delivery_geometry8_week1/$SLUG" "qa_geometry8_week1/$SLUG"
            for QUALITY in -pql -pqh; do
              if [ "$QUALITY" = '-pql' ]; then SCALE=0.12; TAG=pql; else SCALE=1.0; TAG=pqh; fi
              echo "===== $SLUG $QUALITY ====="
              docker run --rm \
                --user "$(id -u):$(id -g)" \
                -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE="$SCALE" \
                -e FILE="$FILE" -e SCENE="$SCENE" -e JOB="$JOB" \
                -v "$PWD:/manim" -w /manim --entrypoint bash "$IMAGE" \
                -c '
                  set -euo pipefail
                  mkdir -p /tmp/manim-bin
                  printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
                  chmod +x /tmp/manim-bin/xdg-open
                  export PATH="/tmp/manim-bin:$PATH"
                  manim "$QUALITY" "$JOB/$FILE" "$SCENE" --format=mp4 --disable_caching
                ' 2>&1 | tee "delivery_geometry8_week1/$SLUG/render_${TAG}.log"
              VIDEO="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
              test -n "$VIDEO" && test -s "$VIDEO"
              cp "$VIDEO" "delivery_geometry8_week1/$SLUG/${SLUG}_${TAG}.mp4"
            done
            FINAL="delivery_geometry8_week1/$SLUG/${SLUG}_pqh.mp4"
            cp "$JOB/$FILE" "delivery_geometry8_week1/$SLUG/"
            cp "$JOB/library/jp_classroom_style.py" "delivery_geometry8_week1/$SLUG/"
            ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 "$FINAL" > "delivery_geometry8_week1/$SLUG/ffprobe.txt"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$FINAL")" = 1920
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$FINAL")" = 1080
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$FINAL")" = 30/1
            ffmpeg -nostdin -v error -i "$FINAL" -f null - 2> "delivery_geometry8_week1/$SLUG/full_decode.log"
            DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$FINAL")"
            SAMPLE="$(python -c "d=float('$DUR'); print(max(0.001,12.0/max(d,0.001)))")"
            ffmpeg -nostdin -y -v error -i "$FINAL" -vf "fps=$SAMPLE,scale=480:-1,tile=4x3:padding=8:margin=8" -frames:v 1 "qa_geometry8_week1/$SLUG/contact_sheet.jpg" || true
            sha256sum "$FINAL" > "delivery_geometry8_week1/$SLUG/SHA256SUMS.txt"
          done
          cp "$JOB/README_RENDER.md" delivery_geometry8_week1/
          sha256sum delivery_geometry8_week1/*/*_pqh.mp4 > delivery_geometry8_week1/ALL_FINAL_VIDEOS_SHA256.txt

      - name: Upload package and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Geometry8_Period3_Week1_ManimCE_PQH
          path: |
            delivery_geometry8_week1/
            qa_geometry8_week1/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve failure status
        if: steps.render.outcome != 'success'
        run: exit 1
