name: Diedric ISO NTC1777 V4 Senior Total PQH 20260908

on:
  push:
    branches:
      - manim/diedric-iso-ntc1777-v4-senior-total-20260908
    paths:
      - .github/workflows/diedric_iso_ntc1777_v4_senior_total_pqh_20260908.yml
      - render_jobs/technical_drawing_diedric_iso_v4_20260908/diedric_iso_ntc1777_v4.py
      - Core/technical_drawing_tools.py

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout V4 branch
        uses: actions/checkout@v4
        with:
          ref: manim/diedric-iso-ntc1777-v4-senior-total-20260908
          fetch-depth: 0

      - name: Validate V4 source and engineering library
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v4_20260908/diedric_iso_ntc1777_v4.py
          LIB=Core/technical_drawing_tools.py
          python -m py_compile "$SRC" "$LIB"
          grep -q 'class DiedricISOProjectionV4SeniorTotal' "$SRC"
          grep -q 'ThreeDScene' "$SRC"
          grep -q 'PROYECCIÓN ORTOGONAL' "$SRC"
          grep -q 'PRIMER DIEDRO' "$SRC"
          grep -q 'TERCER DIEDRO' "$SRC"
          grep -q 'NTC 1777:2001' "$SRC"
          grep -q 'mechanical_bracket_3d' "$LIB"
          grep -q 'projection_symbol' "$LIB"
          grep -q 'dimension_line' "$LIB"
          ! grep -Eq '[A-Za-z]:\\|/Users/|/home/[^/]+/' "$SRC" "$LIB"

      - name: Install render and QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip zip
          python -m pip install --quiet pillow
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL QA render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v4_20260908/diedric_iso_ntc1777_v4.py
          SCENE=DiedricISOProjectionV4SeniorTotal
          rm -rf media_pql qa_pql
          mkdir -p qa_pql
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.05 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pql $SRC $SCENE --fps 15 --format=mp4 --media_dir media_pql --disable_caching" \
            2>&1 | tee qa_pql/pql.log
          PQL="$(find media_pql -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$PQL"
          test -s "$PQL"
          ffmpeg -nostdin -v error -i "$PQL" -f null - 2> qa_pql/pql_decode.log

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v4_20260908/diedric_iso_ntc1777_v4.py
          SCENE=DiedricISOProjectionV4SeniorTotal
          OUT=deliverables/technical_drawing_diedric_iso_v4_20260908
          rm -rf media "$OUT"
          mkdir -p "$OUT"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pqh $SRC $SCENE --fps 30 --format=mp4 --media_dir media --disable_caching" \
            2>&1 | tee "$OUT/pqh.log"
          FINAL="$(find media -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$FINAL"
          test -s "$FINAL"
          cp "$FINAL" "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V4_SENIOR_TOTAL_FINAL_pqh.mp4"

      - name: Senior technical QA and distributed frame inspection
        shell: bash
        run: |
          set -euo pipefail
          OUT=deliverables/technical_drawing_diedric_iso_v4_20260908
          F="$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V4_SENIOR_TOTAL_FINAL_pqh.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          awk -v d="$DUR" 'BEGIN { if (d < 200 || d > 420) exit 1; }'
          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/decode.log"

          mkdir -p "$OUT/qa_frames"
          for FRAC in 0.02 0.055 0.09 0.125 0.16 0.195 0.23 0.265 0.30 0.335 0.37 0.405 0.44 0.475 0.51 0.545 0.58 0.615 0.65 0.685 0.72 0.755 0.79 0.825 0.86 0.895 0.93 0.97; do
            T="$(awk -v d="$DUR" -v f="$FRAC" 'BEGIN{printf "%.2f",d*f}')"
            TAG="$(printf '%s' "$FRAC" | tr -d '.')"
            ffmpeg -y -ss "$T" -i "$F" -frames:v 1 "$OUT/qa_frames/frame_${TAG}.png" >/dev/null 2>&1
          done

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('deliverables/technical_drawing_diedric_iso_v4_20260908')
          frames=sorted((root/'qa_frames').glob('*.png'))
          if len(frames)!=28: raise SystemExit(f'Expected 28 QA frames, found {len(frames)}')
          rows=[]; populated=0
          for p in frames:
              im=Image.open(p).convert('RGB').resize((320,180))
              pix=list(im.getdata())
              changed=sum(1 for r,g,b in pix if abs(r-246)+abs(g-248)+abs(b-251)>38)
              ratio=changed/len(pix); rows.append((p.name,ratio))
              if ratio>0.018: populated+=1
          (root/'VISUAL_DENSITY_QA.tsv').write_text('frame\tnonbackground_ratio\n'+'\n'.join(f'{n}\t{r:.6f}' for n,r in rows)+'\n',encoding='utf-8')
          print('Visually populated samples:',populated,'/',len(frames))
          if populated<26: raise SystemExit('Too many nearly blank sampled frames')
          thumbs=[]
          for p in frames:
              im=Image.open(p).convert('RGB'); im.thumbnail((384,216))
              canvas=Image.new('RGB',(400,246),'white'); canvas.paste(im,((400-im.width)//2,8)); ImageDraw.Draw(canvas).text((12,224),p.stem,fill=(35,45,58)); thumbs.append(canvas)
          sheet=Image.new('RGB',(1600,1722),'white')
          for i,im in enumerate(thumbs): sheet.paste(im,((i%4)*400,(i//4)*246))
          sheet.save(root/'qa_contact_sheet.jpg',quality=91)
          PY

          sha256sum "$F" > "$OUT/SHA256SUMS.txt"
          cp render_jobs/technical_drawing_diedric_iso_v4_20260908/diedric_iso_ntc1777_v4.py "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V4_source.py"
          cp Core/technical_drawing_tools.py "$OUT/technical_drawing_tools.py"
          cat > "$OUT/RENDER_INFO.txt" <<'EOF'
          V4 Senior Total: full engineering-graphics redesign of the diedric-system lesson.
          Architecture: ManimCE ThreeDScene + reusable Core/technical_drawing_tools.py.
          Visual improvements: real 3D bracket, ambient camera orbit, six camera directions, physical projection plane, parallel rays, 3D trace, dihedral PV/PH hinge and 90-degree unfolding, visible/hidden/center line hierarchy, dimension lines, first-angle and third-angle physical order, direct view-placement comparison, ISO projection symbols, six-step reading algorithm, timed student challenge.
          Language: Spanish with ISO E / First-angle and ISO A / Third-angle labels.
          Colombia: NTC 1777:2001 described as a technical standard, not legislation by itself; lesson states that it recognizes first- and third-angle methods.
          ManimCE 0.20.1; 1920x1080; 30 fps; H.264; yuv420p.
          QA: Python compile, literal PQL, literal PQH, ffprobe gates, full decode, 28 distributed frame samples, visual-density gate, contact sheet, SHA-256.
          EOF
          (cd "$OUT" && zip -9 -r TechnicalDrawing_Diedric_V4_SENIOR_TOTAL_PACKAGE.zip \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V4_SENIOR_TOTAL_FINAL_pqh.mp4 \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V4_source.py technical_drawing_tools.py \
            VIDEO_TECHNICAL.tsv VISUAL_DENSITY_QA.tsv SHA256SUMS.txt RENDER_INFO.txt decode.log pqh.log qa_contact_sheet.jpg qa_frames)
          test -s "$OUT/TechnicalDrawing_Diedric_V4_SENIOR_TOTAL_PACKAGE.zip"

      - name: Persist final V4 delivery to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/technical_drawing_diedric_iso_v4_20260908
          if ! git diff --cached --quiet; then
            git commit -m "render: persist diedric V4 senior total PQH [skip ci]"
            git push origin HEAD:manim/diedric-iso-ntc1777-v4-senior-total-20260908
          fi

      - name: Upload V4 delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIEDRIC-ISO-V4-SENIOR-TOTAL-PQH
          path: deliverables/technical_drawing_diedric_iso_v4_20260908/
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DIEDRIC-ISO-V4-DIAGNOSTICS
          path: |
            qa_pql/
            deliverables/technical_drawing_diedric_iso_v4_20260908/
          if-no-files-found: ignore
          retention-days: 3
