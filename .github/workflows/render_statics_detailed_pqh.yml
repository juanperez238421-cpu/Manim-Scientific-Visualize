name: Render Detailed Statics PQH

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render_pqh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        run: |
          cat render_jobs/statics_detailed.py.gz.b64.part1 render_jobs/statics_detailed.py.gz.b64.part2 | base64 --decode | gzip --decompress > Statics_Week_VectorDecomposition_CameraFocus.py
          python -m py_compile Statics_Week_VectorDecomposition_CameraFocus.py
      - name: Pull Manim
        run: docker pull manimcommunity/manim:v0.20.1
      - name: Render PQH
        run: |
          mkdir -p media
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e JR_REAL_TIMER=0 -e JR_SHOW_ANSWER_KEY=0 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'mkdir -p /tmp/headless-bin; printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/headless-bin/xdg-open; chmod +x /tmp/headless-bin/xdg-open; export PATH="/tmp/headless-bin:$PATH"; manim -pqh Statics_Week_VectorDecomposition_CameraFocus.py Statics_Week_VectorDecomposition_Full --format=mp4 --disable_caching' 2>&1 | tee pqh_render.log
      - name: Verify and stage
        run: |
          mkdir -p delivery
          VIDEO="$(find media -type f -name 'Statics_Week_VectorDecomposition_Full.mp4' -print -quit)"
          test -n "$VIDEO" && test -s "$VIDEO"
          cp "$VIDEO" delivery/Statics_Week_VectorDecomposition_CameraFocus_pqh.mp4
          cp Statics_Week_VectorDecomposition_CameraFocus.py pqh_render.log delivery/
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 delivery/Statics_Week_VectorDecomposition_CameraFocus_pqh.mp4 | tee delivery/FFPROBE.txt
          ffmpeg -v error -i delivery/Statics_Week_VectorDecomposition_CameraFocus_pqh.mp4 -f null -
          sha256sum delivery/* > delivery/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Statics_Week_VectorDecomposition_CameraFocus_pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7
