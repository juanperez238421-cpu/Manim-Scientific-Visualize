name: Render Detailed Statics PQH

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render_pqh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Reconstruct and validate source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            render_jobs/statics_detailed.py.gz.b64.part1 \
            render_jobs/statics_detailed.py.gz.b64.part2 \
            | base64 --decode \
            | gzip --decompress \
            > Statics_Week_VectorDecomposition_CameraFocus.py
          python -m py_compile Statics_Week_VectorDecomposition_CameraFocus.py
          test -s Statics_Week_VectorDecomposition_CameraFocus.py
          wc -c Statics_Week_VectorDecomposition_CameraFocus.py

      - name: Pull official ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Render final scene with literal -pqh
        id: render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media diagnostics
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e JR_REAL_TIMER=0 \
            -e JR_SHOW_ANSWER_KEY=0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/headless-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/headless-bin/xdg-open
              chmod +x /tmp/headless-bin/xdg-open
              export PATH="/tmp/headless-bin:$PATH"
              manim -pqh \
                Statics_Week_VectorDecomposition_CameraFocus.py \
                Statics_Week_VectorDecomposition_Full \
                --format=mp4 \
                --disable_caching
            ' 2>&1 | tee pqh_render.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > render_status.txt
          find media -type f -printf '%s %p\n' | sort -nr | head -100 | tee diagnostics/media_files.txt || true
          cp pqh_render.log render_status.txt diagnostics/ || true
          exit "$status"

      - name: Stage final MP4 before metadata checks
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          VIDEO="$(find media -type f -name 'Statics_Week_VectorDecomposition_Full.mp4' -print -quit)"
          if [ -z "$VIDEO" ]; then
            echo 'Expected scene MP4 not found. Available MP4 files:'
            find media -type f -name '*.mp4' -print || true
            exit 1
          fi
          test -s "$VIDEO"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          cp "$VIDEO" delivery/Statics_Week_VectorDecomposition_CameraFocus_pqh.mp4
          cp Statics_Week_VectorDecomposition_CameraFocus.py delivery/
          cp pqh_render.log delivery/
          cat > delivery/RENDER_INFO.txt <<'EOF'
          Scene: Statics_Week_VectorDecomposition_Full
          Source: Statics_Week_VectorDecomposition_CameraFocus.py
          ManimCE: 0.20.1
          Command: manim -pqh Statics_Week_VectorDecomposition_CameraFocus.py Statics_Week_VectorDecomposition_Full --format=mp4 --disable_caching
          JR_REAL_TIMER=0
          JR_SHOW_ANSWER_KEY=0
          EOF
          sha256sum delivery/* > delivery/SHA256SUMS.txt
          ls -lh delivery/Statics_Week_VectorDecomposition_CameraFocus_pqh.mp4

      - name: Verify final MP4 metadata and full decoding
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="delivery/Statics_Week_VectorDecomposition_CameraFocus_pqh.mp4"
          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error \
              -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 \
              "$VIDEO" | tee delivery/FFPROBE.txt
          else
            echo 'ffprobe unavailable on runner' | tee delivery/FFPROBE.txt
          fi
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -v error -i "$VIDEO" -f null -
          fi
          sha256sum delivery/* > delivery/SHA256SUMS.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Statics_CameraFocus_diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload final PQH artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statics_Week_VectorDecomposition_CameraFocus_pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7
