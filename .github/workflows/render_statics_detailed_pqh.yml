name: Render Detailed Statics PQH

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Reconstruct and validate source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            render_jobs/statics_detailed.py.gz.b64.part1 \
            render_jobs/statics_detailed.py.gz.b64.part2 \
            | base64 --decode \
            | gzip --decompress \
            > Statics_Week_VectorDecomposition_DetailedProblem.py
          python -m py_compile Statics_Week_VectorDecomposition_DetailedProblem.py
          test -s Statics_Week_VectorDecomposition_DetailedProblem.py
          wc -c Statics_Week_VectorDecomposition_DetailedProblem.py

      - name: Pull official ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Render low-quality protocol preview with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e JR_REAL_TIMER=0 \
            -e JR_SHOW_ANSWER_KEY=0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/headless-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/headless-bin/xdg-open
              chmod +x /tmp/headless-bin/xdg-open
              export PATH="/tmp/headless-bin:$PATH"
              manim -pql \
                Statics_Week_VectorDecomposition_DetailedProblem.py \
                Statics_Week_VectorDecomposition_Full \
                --format=mp4 \
                --disable_caching
            ' 2>&1 | tee preview_render.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > preview_status.txt
          exit "$status"

      - name: Verify preview MP4
        id: preview_verify
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find media -type f -name 'Statics_Week_VectorDecomposition_Full.mp4' -path '*480p15*' -print -quit)"
          test -n "$VIDEO"
          test -s "$VIDEO"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          ls -lh "$VIDEO"
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

      - name: Stage preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview_delivery
          cp "${{ steps.preview_verify.outputs.video }}" preview_delivery/Statics_Week_VectorDecomposition_DetailedProblem_preview.mp4
          cp Statics_Week_VectorDecomposition_DetailedProblem.py preview_delivery/
          cp preview_render.log preview_delivery/
          sha256sum preview_delivery/* > preview_delivery/SHA256SUMS.txt

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statics_DetailedProblem_preview
          path: preview_delivery/
          if-no-files-found: error
          retention-days: 7

  render_pqh:
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Reconstruct and validate source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            render_jobs/statics_detailed.py.gz.b64.part1 \
            render_jobs/statics_detailed.py.gz.b64.part2 \
            | base64 --decode \
            | gzip --decompress \
            > Statics_Week_VectorDecomposition_DetailedProblem.py
          python -m py_compile Statics_Week_VectorDecomposition_DetailedProblem.py
          test -s Statics_Week_VectorDecomposition_DetailedProblem.py

      - name: Pull official ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Render final scene with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e JR_REAL_TIMER=0 \
            -e JR_SHOW_ANSWER_KEY=0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/headless-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/headless-bin/xdg-open
              chmod +x /tmp/headless-bin/xdg-open
              export PATH="/tmp/headless-bin:$PATH"
              manim -pqh \
                Statics_Week_VectorDecomposition_DetailedProblem.py \
                Statics_Week_VectorDecomposition_Full \
                --format=mp4 \
                --disable_caching
            ' 2>&1 | tee pqh_render.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > pqh_status.txt
          exit "$status"

      - name: Verify final MP4
        id: final_verify
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find media -type f -name 'Statics_Week_VectorDecomposition_Full.mp4' -path '*1080p30*' -print -quit)"
          test -n "$VIDEO"
          test -s "$VIDEO"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          ls -lh "$VIDEO"
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO"
          ffmpeg -v error -i "$VIDEO" -f null -

      - name: Stage final delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp "${{ steps.final_verify.outputs.video }}" delivery/Statics_Week_VectorDecomposition_DetailedProblem_pqh.mp4
          cp Statics_Week_VectorDecomposition_DetailedProblem.py delivery/
          cp pqh_render.log delivery/
          cat > delivery/RENDER_INFO.txt <<'EOF'
          Scene: Statics_Week_VectorDecomposition_Full
          Source: Statics_Week_VectorDecomposition_DetailedProblem.py
          ManimCE: 0.20.1
          Command: manim -pqh Statics_Week_VectorDecomposition_DetailedProblem.py Statics_Week_VectorDecomposition_Full --format=mp4 --disable_caching
          JR_REAL_TIMER=0
          JR_SHOW_ANSWER_KEY=0
          EOF
          sha256sum delivery/* > delivery/SHA256SUMS.txt

      - name: Upload final PQH artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statics_Week_VectorDecomposition_DetailedProblem_pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7
