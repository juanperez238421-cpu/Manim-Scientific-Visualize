name: Render MVC Month 1 PQH

on:
  pull_request:
    branches:
      - main
    paths:
      - "render_jobs/mvc_month1/**"
      - ".github/workflows/render_mvc_month1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'render-mvc-month1-2026-08-05'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect publication commit
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%B)"
          if [[ "$message" == Publish\ rendered\ MVC\ package* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare and validate source
        if: steps.detect.outputs.skip != 'true'
        working-directory: render_jobs/mvc_month1/source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/render_all.sh
          python -m py_compile mvc_manim_library.py scenes/*.py
          grep -Fx 'manim==0.20.1' requirements.txt

      - name: Pull pinned ManimCE image
        if: steps.detect.outputs.skip != 'true'
        shell: bash
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Run PQL tests and literal PQH renders
        if: steps.detect.outputs.skip != 'true'
        working-directory: render_jobs/mvc_month1/source
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e PYTHONPATH=/manim \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin /tmp/manim-home
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              export PYTHONPATH="/manim:${PYTHONPATH:-}"

              SCENES=(
                "scenes/week1_vectors.py W1_VectorBridge2D3D"
                "scenes/week1_vectors.py W1_DotProductProjection"
                "scenes/week2_geometry3d.py W2_CrossProductArea"
                "scenes/week2_geometry3d.py W2_LinesPlanesIntersection"
                "scenes/week3_functions.py W3_SurfaceToContours"
                "scenes/week3_functions.py W3_PathDependentLimit"
                "scenes/week4_derivatives.py W4_PartialDerivativeSlices"
                "scenes/week4_derivatives.py W4_GradientAndTangentPlane"
              )

              mkdir -p delivery/logs
              : > delivery/pql_commands.txt
              for item in "${SCENES[@]}"; do
                read -r file scene <<<"$item"
                echo "manim -pql $file $scene --format=mp4 --disable_caching" | tee -a delivery/pql_commands.txt
                manim -pql "$file" "$scene" --format=mp4 --disable_caching
              done

              ./scripts/render_all.sh
            ' 2>&1 | tee render_mvc_month1.log
          cp render_mvc_month1.log delivery/logs/

      - name: Verify delivery
        if: steps.detect.outputs.skip != 'true'
        working-directory: render_jobs/mvc_month1/source
        shell: bash
        run: |
          set -euo pipefail
          test -s delivery/videos/00_month1_compilation_pqh.mp4
          count="$(find delivery/videos -maxdepth 1 -type f -name '*_pqh.mp4' | wc -l)"
          test "$count" -eq 9
          test -s delivery/SHA256SUMS.txt
          test -s delivery/render_commands.txt
          test -s delivery/pql_commands.txt
          find delivery/videos -maxdepth 1 -type f -name '*_pqh.mp4' -print -exec ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 {} \;

      - name: Build downloadable packages
        if: steps.detect.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/render_jobs/mvc_month1/source"
          out="$GITHUB_WORKSPACE/deliveries/mvc_month1"
          rm -rf "$out"
          mkdir -p "$out"
          (
            cd "$root"
            zip -qr "$out/MVC_Month1_ManimCE_PQH_complete.zip" delivery
            zip -qr "$out/MVC_Month1_ManimCE_source.zip" mvc_manim_library.py scenes scripts README.md COURSE_MAP.md manim.cfg requirements.txt
          )
          cp "$root/delivery/videos/00_month1_compilation_pqh.mp4" "$out/"
          cp "$root/delivery/SHA256SUMS.txt" "$out/"
          sha256sum "$out"/*.zip "$out"/*.mp4 > "$out/PACKAGE_SHA256SUMS.txt"
          test -s "$out/MVC_Month1_ManimCE_PQH_complete.zip"
          test -s "$out/MVC_Month1_ManimCE_source.zip"
          test -s "$out/00_month1_compilation_pqh.mp4"

      - name: Upload complete package
        if: steps.detect.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MVC-Month1-ManimCE-PQH
          path: |
            render_jobs/mvc_month1/source/delivery/
            deliveries/mvc_month1/
          if-no-files-found: error
          retention-days: 7

      - name: Publish package to temporary branch
        if: steps.detect.outputs.skip != 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliveries/mvc_month1
          if git diff --cached --quiet; then
            echo "No package changes to publish."
            exit 0
          fi
          git commit -m "Publish rendered MVC package [skip render]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
