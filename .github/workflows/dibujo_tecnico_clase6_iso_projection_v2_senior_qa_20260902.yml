name: Dibujo Tecnico Clase 6 ISO Projection Systems V2 SENIOR QA FINAL PQH

on:
  push:
    branches:
      - render/dibujo-tecnico-clase6-iso-projection-v2-senior-qa-20260902
    paths:
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA.py'
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/SENIOR_QA_V1_TO_V2.md'
      - '.github/workflows/dibujo_tecnico_clase6_iso_projection_v2_senior_qa_20260902.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  render-class6-iso-v2-senior:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Senior static geometry gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          mkdir -p out qa_out media pql_media /tmp/manim-bin /tmp/manim-home
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          V1="$JOB/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V1_SENIOR.py"
          V2="$JOB/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA.py"
          test -s "$V1"
          test -s "$V2"
          python -m py_compile "$V1" "$V2"
          python - <<'PY'
          from pathlib import Path
          p=Path('render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA.py')
          s=p.read_text(encoding='utf-8')
          required=[
              'class TechnicalDrawingClass6ISOV2',
              'view_front_step','view_rear_step','view_top_step','view_bottom_step',
              'view_left_step','view_right_step','make_house_solid','projection_rays',
              '1.25','1.10','2.10','1.5','2.2','UNFOLD 90°',
              'ISO A · THIRD-ANGLE / AMERICAN','ISO E · FIRST-ANGLE / EUROPEAN',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          assert 'bottom = self.view_top_step' not in s
          assert 'left = self.view_right_step' not in s
          assert 'rear = self.view_front_step' not in s
          print('Senior static geometry gate: PASS')
          PY

      - name: Literal PQL complete-timeline gate
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=0.055
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pql Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA.py \
            TechnicalDrawingClass6ISOV2 \
            --fps 15 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/pql_media" \
            2>&1 | tee "$GITHUB_WORKSPACE/qa_out/PQL.log"
          cd "$GITHUB_WORKSPACE"
          PQL="$(find pql_media -type f -name 'TechnicalDrawingClass6ISOV2.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" qa_out/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA_pql.mp4

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=1.0
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pqh Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA.py \
            TechnicalDrawingClass6ISOV2 \
            --fps 30 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/media" \
            2>&1 | tee "$GITHUB_WORKSPACE/out/PQH.log"
          cd "$GITHUB_WORKSPACE"
          VIDEO="$(find media -type f -name 'TechnicalDrawingClass6ISOV2.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"
          cp "$VIDEO" out/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA_FINAL_pqh.mp4
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA.py out/
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/SENIOR_QA_V1_TO_V2.md out/

      - name: Full decode plus every-frame safe-edge scan
        id: tech
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA_FINAL_pqh.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/VIDEO_TECHNICAL_AND_EDGE_QA.txt
          import av, os, sys, numpy as np
          p=sys.argv[1]
          frames=0; unsafe=[]; blank=[]; sparse=[]
          with av.open(p) as c:
              s=c.streams.video[0]
              codec=s.codec_context.name
              width=s.codec_context.width
              height=s.codec_context.height
              fmt=s.codec_context.format.name if s.codec_context.format else ''
              fps=float(s.average_rate) if s.average_rate else 0.0
              duration=float(c.duration)/float(av.time_base) if c.duration else 0.0
              for frame in c.decode(s):
                  arr=frame.to_ndarray(format='gray')
                  dark=arr < 235
                  ratio=float(dark.mean())
                  edge=np.concatenate([dark[:8,:].ravel(),dark[-8:,:].ravel(),dark[:, :8].ravel(),dark[:, -8:].ravel()])
                  if edge.mean() > 0.0005: unsafe.append(frames)
                  if ratio < 0.00015: blank.append(frames)
                  elif ratio < 0.00065: sparse.append(frames)
                  frames += 1
          size=os.path.getsize(p)
          print(f'codec_name={codec}')
          print(f'width={width}')
          print(f'height={height}')
          print(f'pix_fmt={fmt}')
          print(f'average_fps={fps:.6f}')
          print(f'duration={duration:.6f}')
          print(f'frames_decoded={frames}')
          print(f'size={size}')
          print(f'unsafe_border_frames={len(unsafe)}')
          print(f'blank_frames={len(blank)}')
          print(f'sparse_frames={len(sparse)}')
          if unsafe[:20]: print('unsafe_samples=',unsafe[:20])
          assert codec == 'h264'
          assert (width,height) == (1920,1080)
          assert fmt == 'yuv420p'
          assert 29.8 <= fps <= 30.2
          assert duration > 90
          assert frames > 2500
          assert size > 900_000
          assert len(unsafe) == 0, f'content touches hard video border in {len(unsafe)} frames'
          PY
          SHA="$(sha256sum "$VIDEO" | awk '{print $1}')"
          SIZE="$(stat -c%s "$VIDEO")"
          echo "$SHA  $VIDEO" | tee qa_out/SHA256SUMS.txt
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: 96-frame senior visual audit contact sheet
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA_FINAL_pqh.mp4
          mkdir -p qa_out/audit_frames
          python - "$VIDEO" <<'PY' | tee qa_out/VISUAL_AUDIT.txt
          import av, math, os, sys
          from PIL import Image, ImageDraw
          p=sys.argv[1]; count=96; saved=[]
          with av.open(p) as c:
              s=c.streams.video[0]
              duration=float(c.duration)/float(av.time_base)
              targets=[duration*i/(count+1) for i in range(1,count+1)]
              ti=0
              for frame in c.decode(s):
                  if ti >= len(targets): break
                  t=float(frame.pts*frame.time_base) if frame.pts is not None else 0.0
                  if t >= targets[ti]:
                      im=Image.fromarray(frame.to_ndarray(format='rgb24'))
                      fp=f'qa_out/audit_frames/frame_{ti+1:03d}_{targets[ti]:07.2f}.jpg'
                      im.save(fp,quality=92); saved.append(fp); ti += 1
          assert len(saved) >= 92
          cards=[]
          for fp in saved:
              im=Image.open(fp).convert('RGB'); im.thumbnail((480,270))
              card=Image.new('RGB',(500,300),'white'); card.paste(im,((500-im.width)//2,8))
              ImageDraw.Draw(card).text((10,280),os.path.basename(fp),fill='black'); cards.append(card)
          cols=4; rows=math.ceil(len(cards)/cols)
          sheet=Image.new('RGB',(cols*500,rows*300),'white')
          for i,im in enumerate(cards): sheet.paste(im,((i%cols)*500,(i//cols)*300))
          sheet.save('qa_out/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA_FINAL_contact_sheet.jpg',quality=92)
          print('audit_frames=',len(saved)); print('contact_sheet=PASS')
          PY

      - name: Publish exact validated V2 MP4 and source to GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.tech.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.tech.outputs.size }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.parse, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']
          parent=os.environ['GITHUB_SHA']; branch=os.environ['GITHUB_REF_NAME']
          video_source='out/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA_FINAL_pqh.mp4'
          source_file='out/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA.py'
          qa_file='out/SENIOR_QA_V1_TO_V2.md'
          video_target='published_renders/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA_FINAL_pqh.mp4'
          source_target='render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA.py'
          qa_target='render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/SENIOR_QA_V1_TO_V2.md'
          expected_sha=os.environ['EXPECTED_SHA']; expected_size=int(os.environ['EXPECTED_SIZE'])
          api=f'https://api.github.com/repos/{repo}'
          video=open(video_source,'rb').read(); source=open(source_file,'rb').read(); qa=open(qa_file,'rb').read()
          assert hashlib.sha256(video).hexdigest() == expected_sha
          assert len(video) == expected_size
          assert len(video) < 100_000_000
          def request(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,method=method)
              req.add_header('Authorization',f'Bearer {token}')
              req.add_header('Accept','application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version','2022-11-28')
              if data is not None: req.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(req,timeout=180) as r:
                      body=r.read(); return json.loads(body) if body else {}
              except urllib.error.HTTPError as e:
                  print(e.read().decode(errors='replace')); raise
          base=request('GET',f'{api}/git/commits/{parent}')
          blobs=[]
          for path,data in [(video_target,video),(source_target,source),(qa_target,qa)]:
              b=request('POST',f'{api}/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              blobs.append({'path':path,'mode':'100644','type':'blob','sha':b['sha']})
          tree=request('POST',f'{api}/git/trees',{'base_tree':base['tree']['sha'],'tree':blobs})
          commit=request('POST',f'{api}/git/commits',{'message':'Publish Class 6 ISO V2 senior QA PQH [skip ci]','tree':tree['sha'],'parents':[parent]})
          ref=urllib.parse.quote(branch,safe='/')
          request('PATCH',f'{api}/git/refs/heads/{ref}',{'sha':commit['sha'],'force':False})
          print('published_commit=',commit['sha'])
          print('published_size=',len(video))
          print('published_sha256=',expected_sha)
          print('direct_download=',f'https://raw.githubusercontent.com/{repo}/{branch}/{video_target}')
          PY

      - name: Verify direct GitHub publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SIZE: ${{ steps.tech.outputs.size }}
        run: |
          set -euo pipefail
          sleep 2
          python - <<'PY' | tee qa_out/DIRECT_GITHUB_PUBLICATION.txt
          import json, os, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; branch=os.environ['GITHUB_REF_NAME']
          target='published_renders/Dibujo_Tecnico_Clase6_ISO_Projection_Systems_V2_SENIOR_QA_FINAL_pqh.mp4'
          expected=int(os.environ['EXPECTED_SIZE'])
          url=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(target,safe="/")}?ref={urllib.parse.quote(branch,safe="/")}'
          req=urllib.request.Request(url)
          req.add_header('Authorization',f'Bearer {os.environ["GH_TOKEN"]}')
          req.add_header('Accept','application/vnd.github+json')
          req.add_header('X-GitHub-Api-Version','2022-11-28')
          with urllib.request.urlopen(req,timeout=60) as r: obj=json.load(r)
          print('path=',obj['path']); print('size=',obj['size']); print('download_url=',obj['download_url'])
          assert obj['size'] == expected
          assert obj['download_url'].endswith('.mp4')
          print('DIRECT_GITHUB_DELIVERY=PASS')
          PY

      - name: Upload render and QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dibujo-Tecnico-Clase6-ISO-Projection-Systems-V2-SENIOR-QA-FINAL-PQH-20260902
          path: |
            out/
            qa_out/
          if-no-files-found: warn
          retention-days: 14
