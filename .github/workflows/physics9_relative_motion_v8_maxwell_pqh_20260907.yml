name: Physics 9 Relative Motion V8 MAXWELL INTUITION FINAL PQH 20260907

on:
  push:
    branches:
      - render/physics9-relative-motion-v8-maxwell-intuition-20260907
    paths:
      - 'render_jobs/physics9_relative_motion_v8_maxwell_20260907/**'
      - '.github/workflows/physics9_relative_motion_v8_maxwell_pqh_20260907.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render/physics9-relative-motion-v8-maxwell-intuition-20260907

      - name: Validate V8 Maxwell source
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_relative_motion_v8_maxwell_20260907
          SRC="$JOB/physics9_relative_motion_v8_maxwell.py"
          python -m py_compile "$SRC"
          grep -q 'class Physics9RelativeMotionV8Maxwell' "$SRC"
          grep -q "MAXWELL'S LIGHT" "$SRC"
          grep -q 'LIGHT IS AN ELECTROMAGNETIC WAVE' "$SRC"
          grep -q '300,000 km/s' "$SRC"
          grep -q 'PASSENGER: SAME LIGHT SPEED' "$SRC"
          grep -q 'ROAD OBSERVER: SAME LIGHT SPEED' "$SRC"
          if grep -q 'MathTex(' "$SRC"; then
            echo 'FAIL: MathTex detected. V8 opener must remain equation-free.'; exit 1
          fi
          if grep -qi 'vertical' "$SRC"; then
            echo 'FAIL: vertical-motion wording detected.'; exit 1
          fi
          mkdir -p qa_preview
          sha256sum "$SRC" > qa_preview/SOURCE_SHA256SUMS.txt

      - name: Prepare pinned ManimCE environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip imagemagick
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL runtime gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_relative_motion_v8_maxwell_20260907
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.08 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql physics9_relative_motion_v8_maxwell.py Physics9RelativeMotionV8Maxwell \
                --format=mp4 --media_dir=/manim/media_pql --disable_caching
            '
          PQL="$(find media_pql -type f -name 'Physics9RelativeMotionV8Maxwell.mp4' -print -quit)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_relative_motion_v8_maxwell_20260907
          rm -rf media_pqh final_out package
          mkdir -p final_out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh physics9_relative_motion_v8_maxwell.py Physics9RelativeMotionV8Maxwell \
                --format=mp4 --media_dir=/manim/media_pqh --disable_caching
            ' 2>&1 | tee final_out/render_pqh.log
          FINAL="$(find media_pqh -type f -name 'Physics9RelativeMotionV8Maxwell.mp4' -print -quit)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" final_out/Physics9_Relative_Motion_V8_MAXWELL_INTUITION_FINAL_pqh.mp4

      - name: Technical QA and full decode
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Relative_Motion_V8_MAXWELL_INTUITION_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tframes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$FRAMES" > final_out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920; test "$H" = 1080; test "$FPS" = 30/1; test "$CODEC" = h264; test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> final_out/full_decode.log
          test ! -s final_out/full_decode.log
          sha256sum "$F" > final_out/SHA256SUMS.txt

      - name: Contact sheet
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Relative_Motion_V8_MAXWELL_INTUITION_FINAL_pqh.mp4
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          mkdir -p final_out/audit_frames
          for INDEX in $(seq -w 0 31); do
            T="$(python -c "print(float('$DUR')*(int('$INDEX')+0.5)/32.0)")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "final_out/audit_frames/frame_${INDEX}.png"
          done
          montage final_out/audit_frames/*.png -thumbnail 480x270 -tile 4x8 -geometry +10+20 -background white -quality 90 final_out/CONTACT_SHEET.jpg

      - name: Publish final delivery to branch
        shell: bash
        run: |
          set -euo pipefail
          DEST=deliveries/physics9_relative_motion_v8_maxwell_20260907
          mkdir -p "$DEST"
          cp final_out/Physics9_Relative_Motion_V8_MAXWELL_INTUITION_FINAL_pqh.mp4 "$DEST/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/SHA256SUMS.txt final_out/CONTACT_SHEET.jpg "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "render: publish Physics 9 relative motion V8 Maxwell intuition"
            git push origin HEAD:render/physics9-relative-motion-v8-maxwell-intuition-20260907
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Physics9-Relative-Motion-V8-MAXWELL-INTUITION-FINAL-PQH
          path: |
            final_out/Physics9_Relative_Motion_V8_MAXWELL_INTUITION_FINAL_pqh.mp4
            final_out/VIDEO_TECHNICAL.tsv
            final_out/SHA256SUMS.txt
            final_out/CONTACT_SHEET.jpg
          if-no-files-found: error
          retention-days: 14
