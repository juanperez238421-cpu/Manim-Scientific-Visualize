name: Inventor Mirror Simetria Senior V2 PQH 20260826

on:
  push:
    branches: [render-inventor-symmetry-senior-20260826]
  workflow_dispatch:

permissions:
  contents: write

env:
  JOB_ROOT: render_jobs/inventor_dedicated_20260826
  MANIM_IMAGE: manimcommunity/manim:v0.20.1

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: inventor-mirror-simetria-senior-v2-20260826
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render-inventor-symmetry-senior-20260826
          fetch-depth: 0

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$JOB_ROOT/library/inventor_pro_ui.py" "$JOB_ROOT/scenes/03_mirror_simetria_senior.py"
          grep -q 'class InventorMirrorSimetriaSenior' "$JOB_ROOT/scenes/03_mirror_simetria_senior.py"

      - name: Prepare renderer
        shell: bash
        run: |
          set -euo pipefail
          command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          command -v zip >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zip >/dev/null)
          docker pull "$MANIM_IMAGE" >/dev/null

      - name: PQL smoke
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          rm -rf media_mirror_pql_v2 media_mirror_pqh_v2 delivery_mirror_v2
          mkdir -p delivery_mirror_v2/audit_frames
          chmod -R a+rwX .
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e PYTHONPATH="/manim/$JOB_ROOT" \
            -v "$GITHUB_WORKSPACE:/manim" -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql scenes/03_mirror_simetria_senior.py InventorMirrorSimetriaSenior --fps 15 --format=mp4 --media_dir media_mirror_pql_v2 --disable_caching
            " 2>&1 | tee delivery_mirror_v2/render_pql.log
          test -s "$(find media_mirror_pql_v2 -type f -name 'InventorMirrorSimetriaSenior.mp4' ! -path '*/partial_movie_files/*' | head -1)"

      - name: PQH final
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e PYTHONPATH="/manim/$JOB_ROOT" \
            -v "$GITHUB_WORKSPACE:/manim" -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh scenes/03_mirror_simetria_senior.py InventorMirrorSimetriaSenior --fps 30 --format=mp4 --media_dir media_mirror_pqh_v2 --disable_caching
            " 2>&1 | tee delivery_mirror_v2/render_pqh.log
          F="$(find media_mirror_pqh_v2 -type f -name 'InventorMirrorSimetriaSenior.mp4' ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$F" && test -s "$F"
          cp "$F" delivery_mirror_v2/Inventor_Mirror_Simetria_Senior_V2_FINAL_PQH.mp4
          cp scenes/03_mirror_simetria_senior.py delivery_mirror_v2/03_mirror_simetria_senior.py
          cp library/inventor_pro_ui.py delivery_mirror_v2/inventor_pro_ui.py

      - name: Technical and frame QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          F=delivery_mirror_v2/Inventor_Mirror_Simetria_Senior_V2_FINAL_PQH.mp4
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F" | tr -d '[:space:]')
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F" | tr -d '[:space:]')
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F" | tr -d '[:space:]')
          CODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F" | tr -d '[:space:]')
          PIX=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F" | tr -d '[:space:]')
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F" | tr -d '[:space:]')
          test "$W" = 1920; test "$H" = 1080; test "$FPS" = 30/1; test "$CODEC" = h264; test "$PIX" = yuv420p
          python - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert 55 <= d <= 220, d
          PY
          ffmpeg -nostdin -v error -i "$F" -f null - 2> delivery_mirror_v2/full_decode.log
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of json "$F" > delivery_mirror_v2/VIDEO_TECHNICAL.json
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > delivery_mirror_v2/VIDEO_TECHNICAL.tsv
          for P in 0.04 0.10 0.16 0.22 0.28 0.34 0.40 0.46 0.52 0.58 0.64 0.70 0.76 0.82 0.89 0.96; do
            T=$(python -c "print(float('$DUR')*float('$P'))")
            TAG=$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "delivery_mirror_v2/audit_frames/frame_${TAG}.png"
          done
          ffmpeg -y -loglevel error -pattern_type glob -i 'delivery_mirror_v2/audit_frames/*.png' -vf 'scale=384:-1,tile=4x4' -frames:v 1 delivery_mirror_v2/QA_CONTACT_SHEET.jpg
          sha256sum "$F" delivery_mirror_v2/03_mirror_simetria_senior.py > delivery_mirror_v2/SHA256SUMS.txt
          cat > delivery_mirror_v2/QA_AUTOMATED_REPORT.txt <<EOF
          MIRROR / SIMETRÍA SENIOR V2 — QA PASS
          Literal final command: manim -pqh
          ManimCE: 0.20.1
          Resolution: $W x $H
          FPS: $FPS
          Codec: $CODEC / $PIX
          Duration: $DUR s
          Full decode: PASS
          Flow: 2D sketch -> extrusion -> seed feature -> YZ plane -> Mirror parameters -> preview -> exact distance -> validation -> parametric edit -> final orbit.
          EOF
          zip -9 -j delivery_mirror_v2/Inventor_Mirror_Simetria_Senior_V2_FULL_PACKAGE.zip delivery_mirror_v2/Inventor_Mirror_Simetria_Senior_V2_FINAL_PQH.mp4 delivery_mirror_v2/03_mirror_simetria_senior.py delivery_mirror_v2/inventor_pro_ui.py delivery_mirror_v2/VIDEO_TECHNICAL.json delivery_mirror_v2/VIDEO_TECHNICAL.tsv delivery_mirror_v2/QA_AUTOMATED_REPORT.txt delivery_mirror_v2/QA_CONTACT_SHEET.jpg delivery_mirror_v2/SHA256SUMS.txt delivery_mirror_v2/render_pql.log delivery_mirror_v2/render_pqh.log delivery_mirror_v2/full_decode.log

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: inventor-mirror-simetria-senior-v2-final-pqh
          path: ${{ env.JOB_ROOT }}/delivery_mirror_v2/
          if-no-files-found: error
          retention-days: 7

      - name: Persist verified MP4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$JOB_ROOT/delivery_mirror_v2/Inventor_Mirror_Simetria_Senior_V2_FINAL_PQH.mp4" "$JOB_ROOT/delivery_mirror_v2/03_mirror_simetria_senior.py" "$JOB_ROOT/delivery_mirror_v2/VIDEO_TECHNICAL.json" "$JOB_ROOT/delivery_mirror_v2/VIDEO_TECHNICAL.tsv" "$JOB_ROOT/delivery_mirror_v2/QA_AUTOMATED_REPORT.txt" "$JOB_ROOT/delivery_mirror_v2/QA_CONTACT_SHEET.jpg" "$JOB_ROOT/delivery_mirror_v2/SHA256SUMS.txt"
          git commit -m 'Persist verified Inventor Mirror Simetria Senior V2 PQH' || true
          git push origin HEAD:render-inventor-symmetry-senior-20260826
