name: Physics 9 City Cars Variable Velocity V5 FINAL PQH 20260919

on:
  push:
    branches:
      - manim/physics9-city-cars-variable-velocity-v5-20260919
    paths:
      - 'render_jobs/physics9_city_cars_variable_velocity_v5_20260919/**'
      - '.github/workflows/physics9_city_cars_variable_velocity_v5_pqh_20260919.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: manim/physics9-city-cars-variable-velocity-v5-20260919

      - name: Reuse audited JP classroom library and validate source
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_city_cars_variable_velocity_v5_20260919
          BASE=render_jobs/physics9_city_cars_jpstyle_v4_20260911
          SRC="$JOB/physics9_city_cars_variable_velocity_v5.py"

          cp "$BASE/jp_classroom_style.py" "$JOB/jp_classroom_style.py"
          cp "$BASE/check_manim_style.py" "$JOB/check_manim_style.py"

          python -m py_compile "$SRC" "$JOB/jp_classroom_style.py" "$JOB/check_manim_style.py"
          python "$JOB/check_manim_style.py" "$SRC"

          grep -q 'class Physics9CityCarsVariableVelocityV5' "$SRC"
          grep -q 'LUNCH STOP' "$SRC"
          grep -q 'ACCIDENT AHEAD' "$SRC"
          grep -q 'HEAVY TRAFFIC' "$SRC"
          grep -q 'AVERAGE VELOCITY' "$SRC"
          grep -q 'a=\\frac{\\Delta v}{\\Delta t}' "$SRC"
          grep -q 'v=v(t)' "$SRC"

          if grep -Eq 'ThreeDScene|ThreeDAxes|Prism\(|Sphere\(|Cylinder\(|set_camera_orientation|ambient_camera_rotation' "$SRC"; then
            echo 'FAIL: 3D API detected; this lesson is intentionally projector-safe 2D.'
            exit 1
          fi

          mkdir -p qa_preview
          sha256sum "$SRC" "$JOB/jp_classroom_style.py" > qa_preview/SOURCE_SHA256SUMS.txt

      - name: Prepare pinned ManimCE environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip imagemagick
          ffprobe -version | head -1
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL full-timeline runtime gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_city_cars_variable_velocity_v5_20260919
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.08 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql physics9_city_cars_variable_velocity_v5.py Physics9CityCarsVariableVelocityV5 \
                --fps 15 --format=mp4 --media_dir=/manim/media_pql --disable_caching
            ' 2>&1 | tee qa_preview/render_pql.log

          PQL="$(find media_pql -type f -name 'Physics9CityCarsVariableVelocityV5.mp4' -print -quit)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" qa_preview/Physics9_City_Cars_Variable_Velocity_V5_QA_pql.mp4

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_city_cars_variable_velocity_v5_20260919
          rm -rf media_pqh final_out package
          mkdir -p final_out

          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh physics9_city_cars_variable_velocity_v5.py Physics9CityCarsVariableVelocityV5 \
                --format=mp4 --media_dir=/manim/media_pqh --disable_caching
            ' 2>&1 | tee final_out/render_pqh.log

          FINAL="$(find media_pqh -type f -name 'Physics9CityCarsVariableVelocityV5.mp4' -print -quit)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" final_out/Physics9_City_Cars_Variable_Velocity_V5_SENIOR_FINAL_pqh.mp4

      - name: Strict technical QA and full decode
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_City_Cars_Variable_Velocity_V5_SENIOR_FINAL_pqh.mp4

          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$F")"

          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tframes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$FRAMES" > final_out/VIDEO_TECHNICAL.tsv

          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p

          python - <<'PY'
          from pathlib import Path
          row=Path('final_out/VIDEO_TECHNICAL.tsv').read_text().splitlines()[1].split('\t')
          dur=float(row[5])
          assert 120 <= dur <= 300, f'Unexpected pedagogical duration: {dur}'
          print('duration_gate_pass', dur)
          PY

          ffmpeg -nostdin -v error -i "$F" -f null - 2> final_out/full_decode.log
          test ! -s final_out/full_decode.log
          sha256sum "$F" > final_out/SHA256SUMS.txt

      - name: Every-frame blank and border scan
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_City_Cars_Variable_Velocity_V5_SENIOR_FINAL_pqh.mp4
          ffmpeg -nostdin -v error -i "$F" -vf scale=320:180 -pix_fmt gray -f rawvideo final_out/all_frames_gray.raw

          python - <<'PY'
          from pathlib import Path
          import csv
          W,H=320,180
          B=W*H
          raw=Path('final_out/all_frames_gray.raw').read_bytes()
          assert len(raw)%B==0
          n=len(raw)//B
          blank=sparse=border_heavy=0
          rows=[]
          border_idx=[y*W+x for y in range(H) for x in range(W) if x<6 or x>=W-6 or y<6 or y>=H-6]
          for i in range(n):
              fr=raw[i*B:(i+1)*B]
              dark_n=sum(p<245 for p in fr)
              frac=dark_n/B
              if dark_n==0:
                  blank+=1
              if frac<0.004:
                  sparse+=1
              border=sum(fr[j]<235 for j in border_idx)
              border_frac=border/max(dark_n,1)
              if border_frac>0.22 and dark_n>200:
                  border_heavy+=1
              rows.append((i,frac,border_frac))
          with open('final_out/FRAME_BY_FRAME_SCAN.csv','w',newline='') as f:
              w=csv.writer(f)
              w.writerow(['frame','dark_fraction','border_dark_fraction'])
              w.writerows(rows)
          Path('final_out/FRAME_SCAN_SUMMARY.txt').write_text(
              f'frames_scanned={n}\nblank_frames={blank}\nvery_sparse_frames={sparse}\nborder_heavy_frames={border_heavy}\n'
          )
          assert blank < n*0.08
          assert sparse < n*0.12
          assert border_heavy < n*0.03
          PY

          rm final_out/all_frames_gray.raw

      - name: Dense distributed visual QA
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_City_Cars_Variable_Velocity_V5_SENIOR_FINAL_pqh.mp4
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          mkdir -p final_out/audit_frames

          for INDEX in $(seq -w 0 47); do
            T="$(python -c "print(float('$DUR')*(int('$INDEX')+0.5)/48.0)")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "final_out/audit_frames/frame_$INDEX.png"
          done

          montage final_out/audit_frames/*.png \
            -thumbnail 480x270 -tile 4x12 -geometry +10+20 -background white -quality 90 \
            final_out/CONTACT_SHEET.jpg

          test -s final_out/CONTACT_SHEET.jpg

      - name: Build QA report and publish verified delivery
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_city_cars_variable_velocity_v5_20260919
          F=final_out/Physics9_City_Cars_Variable_Velocity_V5_SENIOR_FINAL_pqh.mp4
          DEST=deliveries/physics9_city_cars_variable_velocity_v5_20260919

          mkdir -p "$DEST"

          cp "$F" "$DEST/"
          cp "$JOB/physics9_city_cars_variable_velocity_v5.py" "$DEST/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/SHA256SUMS.txt \
             final_out/FRAME_SCAN_SUMMARY.txt final_out/CONTACT_SHEET.jpg "$DEST/"

          cat > "$DEST/Physics9_City_Cars_Variable_Velocity_V5_QA.txt" <<'EOF'
          PHYSICS 9 — CITY CARS VARIABLE VELOCITY V5
          Senior classroom render and QA

          Pedagogical lineage:
          - direct continuation of City Cars V4 constant-velocity model
          - preserves City A = 0 km, City B = 240 km
          - preserves Car B = -40 km/h
          - replaces Car A = constant +80 km/h with:
              0.00–0.75 h : +80 km/h
              0.75–1.25 h : 0 km/h (lunch)
              1.25–1.75 h : +60 km/h (traffic builds)
              1.75–2.00 h : 0 km/h (accident stop)
              2.00–3.00 h : +30 km/h (heavy traffic)
          - new meeting event = 3.00 h, 120 km from City A
          - average velocity of Car A to meeting = 40 km/h
          - braking micro-example = 80 km/h to 0 in 8 s -> a ≈ -2.78 m/s²

          Conceptual objective:
          A more realistic description of motion requires velocity as a function of time.
          Real driving includes repeated velocity changes and continuous transitions during braking/acceleration.
          Acceleration describes the rate at which velocity changes.

          Technical acceptance:
          - Python compile + static style QA
          - literal PQL full-timeline runtime gate
          - literal PQH final render
          - 1920x1080
          - 30 fps
          - H.264 / yuv420p
          - full FFmpeg decode
          - every-frame blank/border scan
          - 48-frame distributed visual QA contact sheet
          - SHA-256
          EOF

          ROOT=package/Physics9_City_Cars_Variable_Velocity_V5_FINAL_PQH_PROJECT
          mkdir -p "$ROOT/src" "$ROOT/qa/audit_frames" "$ROOT/workflow"
          cp "$JOB/physics9_city_cars_variable_velocity_v5.py" "$ROOT/src/"
          cp "$JOB/jp_classroom_style.py" "$ROOT/src/"
          cp "$F" "$ROOT/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/SHA256SUMS.txt final_out/full_decode.log \
             final_out/render_pqh.log final_out/FRAME_SCAN_SUMMARY.txt final_out/FRAME_BY_FRAME_SCAN.csv \
             final_out/CONTACT_SHEET.jpg "$ROOT/qa/"
          cp final_out/audit_frames/*.png "$ROOT/qa/audit_frames/"
          cp .github/workflows/physics9_city_cars_variable_velocity_v5_pqh_20260919.yml "$ROOT/workflow/"
          cp "$DEST/Physics9_City_Cars_Variable_Velocity_V5_QA.txt" "$ROOT/qa/"
          (cd package && zip -qr Physics9_City_Cars_Variable_Velocity_V5_FINAL_PQH_PROJECT.zip Physics9_City_Cars_Variable_Velocity_V5_FINAL_PQH_PROJECT)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "render: publish Physics 9 variable-velocity city cars V5"
            git push origin HEAD:manim/physics9-city-cars-variable-velocity-v5-20260919
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Physics9-City-Cars-Variable-Velocity-V5-FINAL-PQH
          path: |
            package/Physics9_City_Cars_Variable_Velocity_V5_FINAL_PQH_PROJECT.zip
            final_out/Physics9_City_Cars_Variable_Velocity_V5_SENIOR_FINAL_pqh.mp4
            final_out/VIDEO_TECHNICAL.tsv
            final_out/SHA256SUMS.txt
            final_out/FRAME_SCAN_SUMMARY.txt
            final_out/FRAME_BY_FRAME_SCAN.csv
            final_out/CONTACT_SHEET.jpg
            final_out/audit_frames/
          if-no-files-found: error
          retention-days: 14
