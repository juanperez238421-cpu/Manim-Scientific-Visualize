name: Croquis V4 FINAL PQH 20260818

on:
  pull_request:
    branches: [house-step-v3-render-20260818]

permissions:
  contents: write

jobs:
  pqh:
    if: github.event.pull_request.head.ref == 'croquis-protocol-v1-20260818' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout protocol branch
        uses: actions/checkout@v4
        with:
          ref: croquis-protocol-v1-20260818

      - name: Build, compile, and persist exact V4 source
        shell: bash
        run: |
          set -euo pipefail
          python tools/croquis/build_house_v4.py
          SRC=render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V4_CROQUIS_PROTOCOL.py
          python -m py_compile "$SRC"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SRC"
          git commit -m 'Persist House V4 croquis protocol source' || true
          git push origin HEAD:croquis-protocol-v1-20260818 || true

      - name: Literal PQH final render — ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V4_CROQUIS_PROTOCOL.py
          rm -rf media_v4_pqh out_v4_pqh
          mkdir -p out_v4_pqh/audit_frames
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $SRC HouseExtrusion3D --fps 30 --format=mp4 --media_dir media_v4_pqh --disable_caching
            " 2>&1 | tee out_v4_pqh/render_pqh.log
          FINAL="$(find media_v4_pqh -type f -name 'HouseExtrusion3D.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out_v4_pqh/House_Extrusion_3D_STEP_BY_STEP_V4_CROQUIS_PROTOCOL_FULL_PQH.mp4
          cp "$SRC" out_v4_pqh/

      - name: Ensure FFmpeg verification tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -1

      - name: Strict technical QA + semantic audit frames
        shell: bash
        run: |
          set -euo pipefail
          F=out_v4_pqh/House_Extrusion_3D_STEP_BY_STEP_V4_CROQUIS_PROTOCOL_FULL_PQH.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > out_v4_pqh/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out_v4_pqh/full_decode.log

          # Dense semantic samples: phase 04 plan, door/window face views, roof plan, final model.
          for T in 18.5 19.5 20.8 22.5 24.5 27.0 30.0 32.0 34.0 53.5 55.0 56.5 58.0 59.5 61.0 64.0 67.0 68.5 70.0 71.5 73.0 76.0 80.5 82.0 83.5 85.0 86.5 88.0 90.0 94.0 100.0 106.0; do
            TAG="$(printf '%06.1f' "$T" | tr '.' '_')"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out_v4_pqh/audit_frames/frame_${TAG}.png"
          done
          ffmpeg -nostdin -loglevel error -i "$F" -vf "fps=1/8,scale=640:-1,tile=4x4:padding=6:margin=8" -frames:v 1 out_v4_pqh/QA_CONTACT_SHEET.jpg || true
          sha256sum "$F" render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V4_CROQUIS_PROTOCOL.py > out_v4_pqh/SHA256SUMS.txt
          printf 'Scene: HouseExtrusion3D\nVersion: V4 Croquis Protocol\nManimCE: 0.20.1\nPQL gate: visually approved before PQH\nFinal: literal -pqh, 1920x1080, 30 fps, H.264/yuv420p\nCroquis camera states: PLAN_2D + FRONT_FACE_2D\nQA: py_compile + ffprobe + full FFmpeg decode + semantic audit frames + SHA-256\n' > out_v4_pqh/RENDER_INFO.txt

      - name: Upload verified PQH package
        uses: actions/upload-artifact@v4
        with:
          name: House-Croquis-V4-FINAL-PQH
          path: out_v4_pqh/
          if-no-files-found: error
          retention-days: 7
