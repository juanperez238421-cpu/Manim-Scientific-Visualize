name: Physics9 Uniform Motion + Galileo V5.3 Total QA PQH 20260901

on:
  pull_request:
    branches:
      - main
    paths:
      - 'render_jobs/physics9_galileo_inclined_plane_20260901/Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA.py'
      - '.github/workflows/physics9_uniform_motion_galileo_v5_3_total_qa_pqh_20260901.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-v5-3:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Validate source and install tools
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          SRC="$JOB/Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA.py"
          test -s "$SRC"
          python -m py_compile \
            "$JOB/Physics9_Galileo_Inclined_Plane_MUA_FINAL.py" \
            "$JOB/Physics9_Galileo_Uniform_Motion_Fall_Intro_V3.py" \
            "$JOB/Physics9_UniformMotion_Galileo_V5.py" \
            "$JOB/Physics9_UniformMotion_Galileo_V5_1_SENIOR_QA.py" \
            "$JOB/Physics9_UniformMotion_Galileo_V5_2_FINAL_QA.py" \
            "$SRC"
          grep -q '^class Physics9UniformMotionGalileoV53TotalQA' "$SRC"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick zip
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          mkdir -p qa_preview final_out final_out/audit_frames_1s final_out/audit_frames_36 package

      - name: PQL full-timeline gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          rm -rf media_pql_v53
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.06 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA.py Physics9UniformMotionGalileoV53TotalQA \
                --format=mp4 --media_dir=/manim/media_pql_v53 --disable_caching
            ' 2>&1 | tee qa_preview/render_v53_pql.log
          PQL="$(find media_pql_v53 -type f -name 'Physics9UniformMotionGalileoV53TotalQA.mp4' -print -quit)"
          test -n "$PQL" && test -s "$PQL"

      - name: PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          rm -rf media_pqh_v53
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA.py Physics9UniformMotionGalileoV53TotalQA \
                --format=mp4 --media_dir=/manim/media_pqh_v53 --disable_caching
            ' 2>&1 | tee final_out/render_v53_pqh.log
          FINAL="$(find media_pqh_v53 -type f -name 'Physics9UniformMotionGalileoV53TotalQA.mp4' -print -quit)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" final_out/Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA_FINAL_pqh.mp4

      - name: Technical QA and exhaustive visual audit
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          SRC="$JOB/Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA.py"
          F=final_out/Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tduration\tframes\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$DUR" "$FRAMES" "$SIZE" > final_out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$CODEC" = h264
          ffmpeg -nostdin -v error -i "$F" -f null - 2> final_out/full_decode.log
          test ! -s final_out/full_decode.log

          # Every-second audit across the full timeline.
          rm -rf final_out/audit_frames_1s && mkdir -p final_out/audit_frames_1s
          ffmpeg -nostdin -loglevel error -i "$F" -vf fps=1 -q:v 2 final_out/audit_frames_1s/sec_%03d.jpg
          COUNT1="$(find final_out/audit_frames_1s -type f -name '*.jpg' | wc -l)"
          test "$COUNT1" -ge 70
          montage final_out/audit_frames_1s/*.jpg -thumbnail 384x216 -tile 6x -geometry +7+9 -background white -quality 90 final_out/CONTACT_SHEET_1S_ALL.jpg

          # 36 evenly distributed high-resolution audit frames.
          rm -rf final_out/audit_frames_36 && mkdir -p final_out/audit_frames_36
          for INDEX in $(seq -w 0 35); do
            T="$(python -c "print(float('$DUR')*(int('$INDEX')+0.5)/36.0)")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "final_out/audit_frames_36/frame_${INDEX}.png"
          done
          montage final_out/audit_frames_36/*.png -thumbnail 384x216 -tile 6x6 -geometry +8+10 -background white -quality 90 final_out/CONTACT_SHEET_36.jpg

          sha256sum "$F" "$SRC" > final_out/SHA256SUMS.txt
          cat > final_out/FRAME_CODE_QA.md <<'EOF'
          # V5.3 Frame / Code QA map

          The V5.2 source and every one-second frame were reviewed before this rebuild.

          | V5.2 time range | V5.2 source region | Defect identified | V5.3 correction |
          |---|---|---|---|
          | 0-5 s | inherited opening_v5 | reveals t^2 result before the experiment; title/subtitle hierarchy small | opening now reveals only x=x_i+vt and asks the Galileo question |
          | 6-16 s | V5.2 lines 34-111 | physical-motion explanatory text too small; dense left panel; graph labels compressed | two graph cards, larger labels, two-line interpretation, more whitespace |
          | 17-26 s | V5.1 lines 162-205 | operation labels too small and equations concentrated in a narrow block | full-width four-step derivation with 21 pt operation labels and 50-58 pt equations |
          | 27-33 s | inherited V5 graph_equation_connection | graph underuses available space; right cards and delta labels too small | enlarged graph panel, explicit Delta t / Delta x, larger equation map and quick check |
          | 34-40 s | V5.1 lines 210-242 | comparison is readable but sparse and captions remain small | larger panels, 20 pt captions, simplified question |
          | 41-51 s | V5.2 lines 113-186 | t=0/t=1 labels cluster near release; instrument text small; ramp occupies mixed zones | dedicated ramp/instrument panels, alternating label offsets, larger historical timing steps |
          | 52-63 s | V5.2 lines 188-241 | proportional number line clusters t=0 and t=1; interval labels are tiny | number line removed; cumulative-position table + proportional 1/3/5/7 bar rows |
          | 64-68 s | V5.1 lines 383-428 | square-number list and interpretation too small; three-way layout leaves dead space | large square-number panel, large x proportional t^2 card, large graph card |
          | 69-78 s | V5.2 lines 243-281 | fall labels and explanatory note still small | exact 1:3:5 gap diagram, 20 pt labels, simplified two-line preview panel |
          | 79-end | inherited summary_v5 | summary cards too small with excessive unused whitespace | two large 6.4-unit cards, 22-27 pt text, larger final contrast |

          V5.3 also fades out the complete section including the old header before constructing the next section, preventing cross-section merge artifacts.
          EOF
          {
            echo '# Physics 9 Uniform Motion + Galileo V5.3 - Final QA'
            echo '- V5.2 frame-by-frame audit completed before redesign: YES'
            echo '- Every-second final audit generated: YES'
            echo '- 36 distributed final audit frames generated: YES'
            echo '- Reduced simultaneous visual density: YES'
            echo '- Larger typography in all instructional panels: YES'
            echo '- Proportional-number-line label collision removed: YES'
            echo '- Complete-section transition fade implemented: YES'
            echo '- Formal acceleration derivation included: NO'
            echo '- PQL gate: PASS'
            echo '- PQH render: PASS'
            echo '- 1920x1080 H.264: PASS'
            echo '- Full decode: PASS'
            echo
            echo '## Encoded properties'
            cat final_out/VIDEO_TECHNICAL.tsv
          } > final_out/SENIOR_QA_RESULT.md

          ROOT=package/Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA_FINAL_PQH
          mkdir -p "$ROOT/src" "$ROOT/render" "$ROOT/qa"
          cp "$SRC" "$ROOT/src/"
          cp "$F" "$ROOT/render/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/SHA256SUMS.txt final_out/SENIOR_QA_RESULT.md final_out/FRAME_CODE_QA.md final_out/CONTACT_SHEET_1S_ALL.jpg final_out/CONTACT_SHEET_36.jpg "$ROOT/qa/"
          cp -r final_out/audit_frames_1s final_out/audit_frames_36 "$ROOT/qa/"
          (cd package && zip -qr Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA_FINAL_PQH.zip Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA_FINAL_PQH)
          cp package/Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA_FINAL_PQH.zip final_out/

      - name: Upload V5.3 deliverables
        uses: actions/upload-artifact@v4
        with:
          name: Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA_FINAL_PQH
          path: |
            final_out/Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA_FINAL_pqh.mp4
            final_out/Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA_FINAL_PQH.zip
            final_out/SENIOR_QA_RESULT.md
            final_out/FRAME_CODE_QA.md
            final_out/VIDEO_TECHNICAL.tsv
            final_out/CONTACT_SHEET_1S_ALL.jpg
            final_out/CONTACT_SHEET_36.jpg
            final_out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
