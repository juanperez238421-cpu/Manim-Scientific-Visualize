name: Render Solids V5 Rotation Sync

on:
  push:
    branches:
      - render-solids-v5-rotation-sync-20260812

permissions:
  contents: read

jobs:
  validate_pql:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout isolated render branch
        uses: actions/checkout@v4
        with:
          ref: render-solids-v5-rotation-sync-20260812
          fetch-depth: 1

      - name: Restore V4 baseline, exact JP style, and apply audited V5 patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf render_v5_workspace render_v5_pql_delivery
          mkdir -p render_v5_workspace/extracted render_v5_pql_delivery

          test "$(sha256sum render_v5/v4_to_v5_rotation_sync.patch | cut -d' ' -f1)" \
            = "09fbc472d669f86c5c0ac1692263ffcbc1efbd095f6696c4d09a8f3228316005"

          git fetch --depth=1 origin render-solids-v4-bigger-figures-20260811
          git show FETCH_HEAD:render_delivery/SolidsOfRevolution_InventorProfessional_TRANSFORM_V4_BIGGER_FIGURES_FINAL.py \
            > render_v5_workspace/SolidsOfRevolution_InventorProfessional_TRANSFORM_V5_ROTATION_SYNC_FINAL.py
          git show FETCH_HEAD:render_delivery/jp_classroom_style.py \
            > render_v5_workspace/jp_classroom_style_EXACT_RENDER_USED.py

          test "$(sha256sum render_v5_workspace/SolidsOfRevolution_InventorProfessional_TRANSFORM_V5_ROTATION_SYNC_FINAL.py | cut -d' ' -f1)" \
            = "c359547721378bfcb9d4ddb1a485b0e8e039a6379053f6df63b4279a846dc6d4"
          test "$(sha256sum render_v5_workspace/jp_classroom_style_EXACT_RENDER_USED.py | cut -d' ' -f1)" \
            = "3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d"

          patch render_v5_workspace/SolidsOfRevolution_InventorProfessional_TRANSFORM_V5_ROTATION_SYNC_FINAL.py \
            render_v5/v4_to_v5_rotation_sync.patch

          test "$(sha256sum render_v5_workspace/SolidsOfRevolution_InventorProfessional_TRANSFORM_V5_ROTATION_SYNC_FINAL.py | cut -d' ' -f1)" \
            = "d8e15d3c44aea974ab3210f80d900d28b7d985a1ff6333a24b0737e919691c24"

          cp render_v5_workspace/*.py render_v5_pql_delivery/
          cp render_v5/v4_to_v5_rotation_sync.patch render_v5_pql_delivery/
          sha256sum render_v5_workspace/*.py render_v5/v4_to_v5_rotation_sync.patch \
            | tee render_v5_pql_delivery/source_sha256.txt

      - name: Python syntax validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            render_v5_workspace/SolidsOfRevolution_InventorProfessional_TRANSFORM_V5_ROTATION_SYNC_FINAL.py \
            render_v5_workspace/jp_classroom_style_EXACT_RENDER_USED.py
          echo "py_compile: PASS" | tee render_v5_pql_delivery/py_compile.txt

      - name: Pull fixed ManimCE 0.20.1 image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Mandatory low-quality validation literal -pql
        shell: bash
        run: |
          set -euo pipefail
          cd render_v5_workspace
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.12 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin /tmp/manim_pql
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql \
                SolidsOfRevolution_InventorProfessional_TRANSFORM_V5_ROTATION_SYNC_FINAL.py \
                SolidsOfRevolutionInventorSeniorV3 \
                --format=mp4 --disable_caching --fps 30 \
                --media_dir /tmp/manim_pql
              RAW="$(find /tmp/manim_pql -type f -iname "*.mp4" -printf "%s\t%p\n" | sort -nr | head -n 1 | cut -f2-)"
              test -n "$RAW"
              test -s "$RAW"
              cp "$RAW" /manim/extracted/v5_pql.mp4
            '
          test -s extracted/v5_pql.mp4
          echo "literal -pql: PASS" | tee ../render_v5_pql_delivery/pql_validation.txt
          cp extracted/v5_pql.mp4 ../render_v5_pql_delivery/

      - name: Technical probe of preview
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            render_v5_pql_delivery/v5_pql.mp4 \
            | tee render_v5_pql_delivery/ffprobe_pql.txt
          ffmpeg -v error -i render_v5_pql_delivery/v5_pql.mp4 -f null -
          echo "full decode: PASS" | tee render_v5_pql_delivery/full_decode_pql.txt

      - name: Upload mandatory pql preview for visual review
        uses: actions/upload-artifact@v4
        with:
          name: SolidsOfRevolution_V5_ROTATION_SYNC_PQL_REVIEW
          path: render_v5_pql_delivery/
          if-no-files-found: error
          retention-days: 7
