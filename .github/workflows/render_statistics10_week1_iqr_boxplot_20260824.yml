name: Render Statistics10 Week1 IQR Boxplot PQH

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="render_jobs/statistics10_week1_iqr_boxplot_20260824/main.py"
          python -m py_compile "$SOURCE"
          grep -n '^class Statistics10Week1IQRBoxplot' "$SOURCE"
          mkdir -p media_pql media_pqh delivery/audit_frames

      - name: Pull ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Literal PQL classroom QA gate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql \
                render_jobs/statistics10_week1_iqr_boxplot_20260824/main.py \
                Statistics10Week1IQRBoxplot \
                --format=mp4 \
                --disable_caching \
                --media_dir media_pql
            ' 2>&1 | tee pql_render.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          PQL_VIDEO="$(find media_pql -type f -name 'Statistics10Week1IQRBoxplot.mp4' -print -quit)"
          test -n "$PQL_VIDEO"
          test -s "$PQL_VIDEO"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh \
                render_jobs/statistics10_week1_iqr_boxplot_20260824/main.py \
                Statistics10Week1IQRBoxplot \
                --format=mp4 \
                --disable_caching \
                --media_dir media_pqh
            ' 2>&1 | tee pqh_render.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          PQH_VIDEO="$(find media_pqh -type f -name 'Statistics10Week1IQRBoxplot.mp4' -print -quit)"
          test -n "$PQH_VIDEO"
          test -s "$PQH_VIDEO"
          printf '%s\n' "$PQH_VIDEO" > pqh_video_path.txt

      - name: Verify MP4, full decode and extract dense audit frames
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              VIDEO="$(cat pqh_video_path.txt)"
              test -s "$VIDEO"

              ffprobe -v error \
                -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
                -show_entries format=duration,size \
                -of default=noprint_wrappers=1 \
                "$VIDEO" | tee ffprobe.txt

              grep -q "^codec_name=h264$" ffprobe.txt
              grep -q "^width=1920$" ffprobe.txt
              grep -q "^height=1080$" ffprobe.txt
              grep -q "^r_frame_rate=30/1$" ffprobe.txt
              grep -q "^pix_fmt=yuv420p$" ffprobe.txt

              ffmpeg -v error -i "$VIDEO" -f null - 2>&1 | tee full_decode.log

              DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
              python - "$DURATION" > audit_times.txt <<"PY"
import sys
d=float(sys.argv[1])
n=18
for i in range(n):
    print(max(0.2, min(d-0.2, d*(i+0.5)/n)))
PY
              i=1
              while read -r t; do
                ffmpeg -v error -ss "$t" -i "$VIDEO" -frames:v 1 "delivery/audit_frames/frame_$(printf "%02d" "$i").png"
                i=$((i+1))
              done < audit_times.txt
              test "$(find delivery/audit_frames -type f -name "*.png" | wc -l)" -eq 18
            '

      - name: Stage delivery package
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(cat pqh_video_path.txt)"
          SOURCE="render_jobs/statistics10_week1_iqr_boxplot_20260824/main.py"
          cp "$VIDEO" delivery/Statistics10_Week1_IQR_Boxplot_FINAL_PQH.mp4
          cp "$SOURCE" delivery/Statistics10_Week1_IQR_Boxplot.py
          cp pql_render.log pqh_render.log ffprobe.txt full_decode.log delivery/
          cat > delivery/RENDER_INFO.txt <<'EOF'
          Subject: Statistics 10
          Period: Third period, Week 1
          Lesson: IQR & Boxplot Consolidation
          Scene: Statistics10Week1IQRBoxplot
          ManimCE: 0.20.1
          Final render: literal -pqh
          Resolution: 1920x1080
          FPS: 30
          Contents: variance-to-IQR bridge, quartiles, IQR, 1.5 IQR fences, outlier classification, line-by-line boxplot construction, interpretation, same-scale comparison, guided practice, exit ticket.
          EOF
          (
            cd delivery
            sha256sum Statistics10_Week1_IQR_Boxplot_FINAL_PQH.mp4 Statistics10_Week1_IQR_Boxplot.py pql_render.log pqh_render.log ffprobe.txt full_decode.log RENDER_INFO.txt audit_frames/*.png > SHA256SUMS.txt
          )
          ls -lh delivery

      - name: Upload final Week 1 package
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10_Week1_IQR_Boxplot_FINAL_PQH
          path: delivery/
          if-no-files-found: error
          retention-days: 7
