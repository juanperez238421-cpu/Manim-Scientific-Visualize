name: History of Velocity V4 Diagnostic Upload

on:
  push:
    branches: [agent/history-of-velocity-pqh-20260816]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct V3 base and validate V4
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/history_velocity_20260816
          cat "$JOB"/h_*.b64 | base64 -d | gzip -dc > "$JOB/history_of_velocity.py"
          cat "$JOB"/s_*.b64 | base64 -d | gzip -dc > "$JOB/jp_classroom_style.py"
          if [ -f "$JOB/apply_v3_final_layout_patch.py" ]; then
            (cd "$JOB" && python apply_v3_final_layout_patch.py history_of_velocity.py)
          fi
          cp "$JOB/history_of_velocity.py" "$JOB/history_of_velocity_FINAL_V3.py"
          python -m py_compile "$JOB/history_of_velocity_FINAL_V3.py" "$JOB/history_of_velocity_FINAL_V4.py" "$JOB/jp_classroom_style.py"

      - name: Install render tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: PQL runtime QA and timing calibration
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/history_velocity_20260816
          rm -rf media_pql qa && mkdir -p qa
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB" --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql history_of_velocity_FINAL_V4.py HistoryOfVelocityV4 --fps 15 --format=mp4 --media_dir /manim/media_pql --disable_caching
            ' 2>&1 | tee qa/render_pql.log
          P="$(find media_pql -type f -name 'HistoryOfVelocityV4.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$P" && test -s "$P"
          BASE="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$P")"
          SCALE="$(python - <<PY
          b=float('$BASE')
          print(max(0.90,min(1.45,500.0/b)))
          PY
          )"
          printf 'base_duration=%s\nfinal_scale=%s\n' "$BASE" "$SCALE" | tee qa/timing.txt
          echo "FINAL_SCALE=$SCALE" >> "$GITHUB_ENV"

      - name: PQH render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/history_velocity_20260816
          rm -rf media out && mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE="$FINAL_SCALE" \
            -v "$PWD:/manim" -w "/manim/$JOB" --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh history_of_velocity_FINAL_V4.py HistoryOfVelocityV4 --fps 30 --format=mp4 --media_dir /manim/media --disable_caching
            ' 2>&1 | tee out/render_pqh.log
          F="$(find media -type f -name 'HistoryOfVelocityV4.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$F" && test -s "$F"
          cp "$F" out/HistoryOfVelocity_Senior_FINAL_V4_DIAGNOSTIC_pqh.mp4

      - name: Non-aborting verification and frame audit
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p out/audit_frames
          F=out/HistoryOfVelocity_Senior_FINAL_V4_DIAGNOSTIC_pqh.mp4
          : > out/VERIFY_RESULTS.txt
          if [ ! -s "$F" ]; then
            echo 'MP4_EXISTS=FAIL' >> out/VERIFY_RESULTS.txt
          else
            echo 'MP4_EXISTS=PASS' >> out/VERIFY_RESULTS.txt
            W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
            H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
            FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
            C="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
            P="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
            D="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
            printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$C" "$P" "$D" > out/VIDEO_TECHNICAL.tsv
            [ "$W" = 1920 ]; echo "WIDTH_1920=$([ $? -eq 0 ] && echo PASS || echo FAIL)" >> out/VERIFY_RESULTS.txt
            [ "$H" = 1080 ]; echo "HEIGHT_1080=$([ $? -eq 0 ] && echo PASS || echo FAIL)" >> out/VERIFY_RESULTS.txt
            [ "$FPS" = 30/1 ]; echo "FPS_30=$([ $? -eq 0 ] && echo PASS || echo FAIL)" >> out/VERIFY_RESULTS.txt
            [ "$C" = h264 ]; echo "CODEC_H264=$([ $? -eq 0 ] && echo PASS || echo FAIL)" >> out/VERIFY_RESULTS.txt
            [ "$P" = yuv420p ]; echo "PIX_YUV420P=$([ $? -eq 0 ] && echo PASS || echo FAIL)" >> out/VERIFY_RESULTS.txt
            python - <<PY
          d=float('$D')
          print('DURATION_420_620=' + ('PASS' if 420 <= d <= 620 else 'FAIL'))
          PY
            python - <<PY >> out/VERIFY_RESULTS.txt
          d=float('$D')
          print('DURATION_420_620=' + ('PASS' if 420 <= d <= 620 else 'FAIL'))
          PY
            ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
            echo "FULL_DECODE=$([ $? -eq 0 ] && echo PASS || echo FAIL)" >> out/VERIFY_RESULTS.txt
            ffmpeg -nostdin -hide_banner -i "$F" -vf 'freezedetect=n=0.002:d=1.2' -an -f null - 2> out/freezedetect.log
            python - <<'PY'
          import re, os
          tech='out/VIDEO_TECHNICAL.tsv'
          if os.path.exists(tech):
              d=float(open(tech).read().splitlines()[1].split('\t')[-1])
              txt=open('out/freezedetect.log',errors='ignore').read()
              ds=[float(x) for x in re.findall(r'freeze_duration: ([0-9.]+)',txt)]
              f=sum(ds)
              longest=max(ds) if ds else 0.0
              open('out/MOTION_AUDIT.tsv','w').write(
                  'duration\tfrozen_ge_1p2s\tfrozen_ratio\tfreeze_intervals\tlongest_freeze\n'
                  f'{d:.3f}\t{f:.3f}\t{f/d:.4f}\t{len(ds)}\t{longest:.3f}\n'
              )
          PY
            ffmpeg -nostdin -hide_banner -loglevel error -i "$F" -vf 'fps=1/4,scale=960:-2' -q:v 4 out/audit_frames/%04d.jpg
            echo "AUDIT_FRAMES=$([ $? -eq 0 ] && echo PASS || echo FAIL)" >> out/VERIFY_RESULTS.txt
            sha256sum "$F" > out/SHA256SUMS.txt
          fi
          cp qa/timing.txt out/ 2>/dev/null || true
          cp qa/render_pql.log out/ 2>/dev/null || true
          cat out/VERIFY_RESULTS.txt
          cat out/VIDEO_TECHNICAL.tsv 2>/dev/null || true
          cat out/MOTION_AUDIT.tsv 2>/dev/null || true
          exit 0

      - name: Package diagnostic
        if: always()
        shell: bash
        run: |
          set +e
          JOB=render_jobs/history_velocity_20260816
          cp "$JOB/history_of_velocity_FINAL_V4.py" out/ 2>/dev/null || true
          cp "$JOB/history_of_velocity_FINAL_V3.py" out/ 2>/dev/null || true
          cp "$JOB/jp_classroom_style.py" out/ 2>/dev/null || true
          cd out
          zip -9 -r HistoryOfVelocity_Senior_FINAL_V4_DIAGNOSTIC_Package.zip . >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HistoryOfVelocity-V4-DIAGNOSTIC
          path: out/
          if-no-files-found: warn
          retention-days: 7
