name: Bootstrap Geometry 8 Week 3 Workshop Senior V1 Render

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render/geometry8-week3-workshop-senior-v1-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg and recover source payload
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          BRANCH=render/geometry8-week3-workshop-senior-v1-20260810
          JOB=render_jobs/geometry8_week3_workshop_senior_v1_20260810
          git fetch --depth=1 origin "$BRANCH"
          : > /tmp/workshop_payload.b64
          for F in payload_00.b64 payload_01.b64 payload_02.b64 payload_03.b64 payload_04.b64; do
            git show "FETCH_HEAD:$JOB/$F" >> /tmp/workshop_payload.b64
          done
          test "$(wc -c < /tmp/workshop_payload.b64)" -ge 18056
          base64 -d /tmp/workshop_payload.b64 > /tmp/workshop_payload.tar.xz
          xz -t /tmp/workshop_payload.tar.xz
          rm -rf /tmp/week3_workshop && mkdir -p /tmp/week3_workshop
          tar -xJf /tmp/workshop_payload.tar.xz -C /tmp/week3_workshop
          cd /tmp/week3_workshop
          python -m py_compile Geometry8_Week3_Workshop_Senior_V1_FINAL.py jp_classroom_style.py check_manim_style.py
          python check_manim_style.py Geometry8_Week3_Workshop_Senior_V1_FINAL.py
          ! grep -nE '([A-Za-z]:\\\\|/Users/|/home/[^/]+/Desktop)' Geometry8_Week3_Workshop_Senior_V1_FINAL.py jp_classroom_style.py

      - name: Pull ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Render PQL and literal PQH, validate, and generate QA
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/week3_workshop/Geometry8_Week3_Workshop_Senior_V1_FINAL.py .
          cp /tmp/week3_workshop/jp_classroom_style.py .
          cp /tmp/week3_workshop/check_manim_style.py .
          IMAGE=manimcommunity/manim:v0.20.1
          FILE=Geometry8_Week3_Workshop_Senior_V1_FINAL.py
          SCENE=Geometry8Week3WorkshopSeniorV1Final
          SLUG=Geometry8_Week3_Workshop_Senior_V1_FINAL
          rm -rf media delivery_week3_workshop qa_week3_workshop
          mkdir -p delivery_week3_workshop qa_week3_workshop

          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.12 \
            -v "$PWD:/manim" -w /manim --entrypoint bash "$IMAGE" -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql Geometry8_Week3_Workshop_Senior_V1_FINAL.py Geometry8Week3WorkshopSeniorV1Final --format=mp4 --disable_caching
            ' 2>&1 | tee delivery_week3_workshop/render_pql.log

          PQL="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" "delivery_week3_workshop/${SLUG}_pql.mp4"

          rm -rf media
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim --entrypoint bash "$IMAGE" -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh Geometry8_Week3_Workshop_Senior_V1_FINAL.py Geometry8Week3WorkshopSeniorV1Final --format=mp4 --disable_caching
            ' 2>&1 | tee delivery_week3_workshop/render_pqh.log

          FINAL="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          OUT="delivery_week3_workshop/${SLUG}_pqh.mp4"
          cp "$FINAL" "$OUT"
          cp "$FILE" jp_classroom_style.py check_manim_style.py delivery_week3_workshop/

          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 "$OUT" > delivery_week3_workshop/ffprobe.txt

          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$OUT")" = 1920
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT")" = 1080
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$OUT")" = 30/1
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$OUT")" = h264
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$OUT")" = yuv420p

          ffmpeg -nostdin -v error -i "$OUT" -f null - 2> delivery_week3_workshop/full_decode.log
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT")"
          RATE="$(python -c "d=float('$DUR'); print(max(0.001,48.0/max(d,0.001)))")"
          ffmpeg -nostdin -y -v error -i "$OUT" \
            -vf "fps=$RATE,scale=480:-1,tile=6x8:padding=8:margin=8" \
            -frames:v 1 qa_week3_workshop/contact_sheet.jpg

          for P in 10 20 30 40 50 60 70 80 90 96; do
            T="$(python -c "d=float('$DUR'); print(d*$P/100.0)")"
            ffmpeg -nostdin -y -v error -ss "$T" -i "$OUT" -frames:v 1 "qa_week3_workshop/frame_${P}pct.png"
          done

          sha256sum "$OUT" > delivery_week3_workshop/SHA256SUMS.txt

      - name: Upload final delivery
        uses: actions/upload-artifact@v4
        with:
          name: Geometry8_Week3_Workshop_Senior_V1_FINAL
          path: |
            delivery_week3_workshop/
            qa_week3_workshop/
          retention-days: 7
