name: Dibujo Tecnico 3D to 2D Projection V6 FULL TOTAL PQH

on:
  push:
    branches:
      - render/dibujo-tecnico-3d-to-2d-projection-v6-full-total-20260907
    paths:
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V6_FULL_TOTAL.py'
      - '.github/workflows/dibujo_tecnico_3d_to_2d_projection_v6_full_total_20260907.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  render-v6-full-total:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Static source and geometry gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          SRC="$JOB/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V6_FULL_TOTAL.py"
          BASE="$JOB/Dibujo_Tecnico_Sistema_Diedrico_Monge_V5_SENIOR_FAITHFUL.py"
          test -s "$SRC"
          test -s "$BASE"
          python -m py_compile "$BASE" "$SRC"
          python - <<'PY'
          from pathlib import Path
          p=Path('render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V6_FULL_TOTAL.py')
          s=p.read_text(encoding='utf-8')
          required=[
            'class Projection3Dto2DFullTotalV6',
            'right_outline',
            'front_outline',
            'top_outline',
            'projector',
            'angle=-PI / 2',
            'axis=RIGHT',
            'about_point=ORIGIN',
            'FRONT / ALZADO',
            'TOP / PLANTA',
            'RIGHT / PERFIL',
            'MÉTODO PARA PASAR DE 3D A 2D',
            'PROYECCIÓN ORTOGONAL',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          print('V6 source/geometry gate: PASS')
          PY
          mkdir -p /tmp/manim-bin /tmp/manim-home pql_media media out qa_out qa_out/audit_frames
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open

      - name: Literal PQL complete-timeline gate
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=0.08
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pql Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V6_FULL_TOTAL.py \
            Projection3Dto2DFullTotalV6 \
            --fps 15 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/pql_media" \
            2>&1 | tee "$GITHUB_WORKSPACE/qa_out/PQL.log"
          cd "$GITHUB_WORKSPACE"
          PQL="$(find pql_media -type f -name 'Projection3Dto2DFullTotalV6.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" qa_out/Dibujo_Tecnico_3D_to_2D_Projection_V6_FULL_TOTAL_pql.mp4

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=1.0
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pqh Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V6_FULL_TOTAL.py \
            Projection3Dto2DFullTotalV6 \
            --fps 30 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/media" \
            2>&1 | tee "$GITHUB_WORKSPACE/out/PQH.log"
          cd "$GITHUB_WORKSPACE"
          VIDEO="$(find media -type f -name 'Projection3Dto2DFullTotalV6.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"
          cp "$VIDEO" out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V6_FULL_TOTAL_FINAL_pqh.mp4
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V6_FULL_TOTAL.py out/

      - name: Video decode and technical QA
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V6_FULL_TOTAL_FINAL_pqh.mp4
          ffmpeg -v error -i "$VIDEO" -f null -
          python - "$VIDEO" <<'PY' | tee qa_out/VIDEO_QA.txt
          import av, os, sys
          p=sys.argv[1]
          frames=0
          with av.open(p) as c:
              s=c.streams.video[0]
              codec=s.codec_context.name
              width=s.codec_context.width
              height=s.codec_context.height
              fmt=s.codec_context.format.name if s.codec_context.format else ''
              fps=float(s.average_rate) if s.average_rate else 0.0
              duration=float(c.duration)/float(av.time_base) if c.duration else 0.0
              for _ in c.decode(s): frames += 1
          size=os.path.getsize(p)
          print(f'codec_name={codec}')
          print(f'width={width}')
          print(f'height={height}')
          print(f'pix_fmt={fmt}')
          print(f'average_fps={fps:.6f}')
          print(f'duration={duration:.6f}')
          print(f'frames_decoded={frames}')
          print(f'size={size}')
          assert codec == 'h264'
          assert (width,height) == (1920,1080)
          assert fmt == 'yuv420p'
          assert 29.8 <= fps <= 30.2
          assert duration > 45
          assert frames > 1300
          assert size > 700_000
          PY
          SHA="$(sha256sum "$VIDEO" | awk '{print $1}')"
          SIZE="$(stat -c%s "$VIDEO")"
          echo "$SHA  $VIDEO" | tee qa_out/SHA256SUMS.txt
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: 72-frame visual audit contact sheet
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V6_FULL_TOTAL_FINAL_pqh.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/VISUAL_AUDIT.txt
          import av, math, os, sys
          from PIL import Image, ImageDraw
          p=sys.argv[1]; count=72; saved=[]
          with av.open(p) as c:
              s=c.streams.video[0]
              duration=float(c.duration)/float(av.time_base)
              targets=[duration*i/(count+1) for i in range(1,count+1)]
              ti=0
              for frame in c.decode(s):
                  if ti >= len(targets): break
                  t=float(frame.pts*frame.time_base) if frame.pts is not None else 0.0
                  if t >= targets[ti]:
                      im=Image.fromarray(frame.to_ndarray(format='rgb24'))
                      fp=f'qa_out/audit_frames/frame_{ti+1:03d}_{targets[ti]:07.2f}.jpg'
                      im.save(fp,quality=91); saved.append(fp); ti += 1
          assert len(saved) >= 68
          cards=[]
          for fp in saved:
              im=Image.open(fp).convert('RGB'); im.thumbnail((480,270))
              card=Image.new('RGB',(500,300),'white'); card.paste(im,((500-im.width)//2,8))
              ImageDraw.Draw(card).text((10,280),os.path.basename(fp),fill='black'); cards.append(card)
          cols=4; rows=math.ceil(len(cards)/cols)
          sheet=Image.new('RGB',(cols*500,rows*300),'white')
          for i,im in enumerate(cards): sheet.paste(im,((i%cols)*500,(i//cols)*300))
          out='qa_out/Dibujo_Tecnico_3D_to_2D_Projection_V6_FULL_TOTAL_contact_sheet.jpg'
          sheet.save(out,quality=91)
          print('audit_frames=',len(saved))
          print('duration=',duration)
          print('contact_sheet=PASS')
          PY

      - name: Publish exact validated V6 MP4 and source
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.qa.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.qa.outputs.size }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.parse, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']
          parent=os.environ['GITHUB_SHA']; branch=os.environ['GITHUB_REF_NAME']
          items=[
            ('out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V6_FULL_TOTAL_FINAL_pqh.mp4','published_renders/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V6_FULL_TOTAL_FINAL_pqh.mp4'),
            ('out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V6_FULL_TOTAL.py','render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V6_FULL_TOTAL.py'),
          ]
          expected_sha=os.environ['EXPECTED_SHA']; expected_size=int(os.environ['EXPECTED_SIZE'])
          video=open(items[0][0],'rb').read()
          assert hashlib.sha256(video).hexdigest()==expected_sha
          assert len(video)==expected_size
          api=f'https://api.github.com/repos/{repo}'
          def req(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(url,data=data,method=method)
              r.add_header('Authorization',f'Bearer {token}')
              r.add_header('Accept','application/vnd.github+json')
              r.add_header('X-GitHub-Api-Version','2022-11-28')
              if data is not None: r.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(r,timeout=180) as f:
                      b=f.read(); return json.loads(b) if b else {}
              except urllib.error.HTTPError as e:
                  print(e.read().decode(errors='replace')); raise
          base=req('GET',f'{api}/git/commits/{parent}')
          blobs=[]
          for src,target in items:
              data=open(src,'rb').read()
              blob=req('POST',f'{api}/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              blobs.append({'path':target,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=req('POST',f'{api}/git/trees',{'base_tree':base['tree']['sha'],'tree':blobs})
          commit=req('POST',f'{api}/git/commits',{
              'message':'Publish Dibujo Tecnico 3D to 2D V6 FULL TOTAL PQH [skip ci]',
              'tree':tree['sha'],'parents':[parent]
          })
          ref=urllib.parse.quote(branch,safe='/')
          req('PATCH',f'{api}/git/refs/heads/{ref}',{'sha':commit['sha'],'force':False})
          open('qa_out/PUBLISHED_COMMIT.txt','w').write(commit['sha']+'\n')
          print('published_commit=',commit['sha'])
          print('published_sha256=',expected_sha)
          PY
          echo "commit_sha=$(cat qa_out/PUBLISHED_COMMIT.txt)" >> "$GITHUB_OUTPUT"

      - name: Verify exact direct GitHub re-download
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.qa.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.qa.outputs.size }}
          PUBLISHED_COMMIT: ${{ steps.publish.outputs.commit_sha }}
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PUBLISHED_COMMIT}/published_renders/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V6_FULL_TOTAL_FINAL_pqh.mp4"
          curl -L --fail --retry 3 "$URL" -o qa_out/redownload.mp4
          test "$(stat -c%s qa_out/redownload.mp4)" = "$EXPECTED_SIZE"
          test "$(sha256sum qa_out/redownload.mp4 | awk '{print $1}')" = "$EXPECTED_SHA"
          printf 'url=%s\nsize=%s\nsha256=%s\nDIRECT_REDOWNLOAD=PASS\n' "$URL" "$EXPECTED_SIZE" "$EXPECTED_SHA" | tee qa_out/DIRECT_GITHUB_PUBLICATION.txt

      - name: Upload V6 delivery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dibujo_Tecnico_3D_to_2D_Projection_V6_FULL_TOTAL_PQH
          if-no-files-found: warn
          retention-days: 7
          path: |
            out/
            qa_out/
