name: Physics9 Variable Velocity SENIOR V3 ENGLISH PQH 20260920

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    if: github.event.pull_request.head.ref == 'physics9-variable-velocity-senior-v3-english-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: physics9-variable-velocity-senior-v3-english-20260920

      - name: Validate source, English-only contract and classroom style
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_variable_velocity_senior_v3_english_20260920
          FILE="$JOB/physics9_variable_velocity_senior_v3_english.py"
          STYLE="$JOB/jp_classroom_style.py"
          python -m py_compile "$FILE" "$STYLE"
          python "$JOB/tools/check_manim_style.py" "$FILE" | tee style_qa.log
          grep -q "PASS: no structural/style issues detected." style_qa.log

          python - <<'PY'
          from pathlib import Path
          p = Path("render_jobs/physics9_variable_velocity_senior_v3_english_20260920/physics9_variable_velocity_senior_v3_english.py")
          s = p.read_text(encoding="utf-8")
          required = [
              "class Physics9VariableVelocitySeniorV3English(JPMathClassroomScene)",
              "BUILDING THE VELOCITY-TIME GRAPH STEP BY STEP",
              "step_strip(",
              "STEP_DATA",
              "build_velocity_segments(",
              "assert_content_safe(",
              "standard_opening(",
              "set_header(",
              "clear_stage(",
              "a_{\\mathrm{avg}}",
          ]
          missing = [item for item in required if item not in s]
          assert not missing, f"Missing V3 contract elements: {missing}"

          forbidden_spanish = [
              "FUNDAMENTOS", "CIUDAD", "VELOCIDAD DEL AUTO", "IDEA CENTRAL",
              "ACELERA", "PARADA", "ACCIDENTE", "TRÁFICO", "RECUPERA",
              "POSICIÓN", "TIEMPO", "CUANDO", "MODELO IDEAL", "MOVIMIENTO REAL",
          ]
          found = [term for term in forbidden_spanish if term.lower() in s.lower()]
          assert not found, f"Spanish on-screen vocabulary detected: {found}"

          for ch in "áéíóúñÁÉÍÓÚÑ":
              assert ch not in s, f"Spanish accented character detected: {ch}"

          print("english_scene_contract_pass")
          PY

      - name: Install verification tools and pull ManimCE
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          ffprobe -version | head -1

      - name: Fast PQL runtime and safe-layout QA
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_variable_velocity_senior_v3_english_20260920
          rm -rf media_pql qa_out
          mkdir -p qa_out
          docker run --rm --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -e LESSON_TIME_SCALE=0.18             -v "$PWD:/manim" -w /manim             --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $JOB/physics9_variable_velocity_senior_v3_english.py Physics9VariableVelocitySeniorV3English                 --fps 15 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee qa_out/render_pql.log
          PREVIEW="$(find media_pql -type f -name 'Physics9VariableVelocitySeniorV3English.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          cp "$PREVIEW" qa_out/Physics9_VariableVelocity_SENIOR_V3_ENGLISH_QA_pql.mp4

      - name: Final literal PQH render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_variable_velocity_senior_v3_english_20260920
          rm -rf media out
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -e LESSON_TIME_SCALE=1.0             -v "$PWD:/manim" -w /manim             --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $JOB/physics9_variable_velocity_senior_v3_english.py Physics9VariableVelocitySeniorV3English                 --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee out/render_pqh.log
          FINAL="$(find media -type f -name 'Physics9VariableVelocitySeniorV3English.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Physics9_VariableVelocity_SENIOR_V3_ENGLISH_FULL_FINAL_pqh.mp4

      - name: Technical QA, full decode and visual audit frames
        shell: bash
        run: |
          set -euo pipefail
          F=out/Physics9_VariableVelocity_SENIOR_V3_ENGLISH_FULL_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p

          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log

          mkdir -p out/audit_frames
          for P in 0.04 0.12 0.20 0.30 0.40 0.50 0.60 0.70 0.80 0.90 0.97; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%03d' "$(python -c "print(int(float('$P')*100))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_$TAG.png"
          done

          ffmpeg -nostdin -loglevel error -framerate 1 -pattern_type glob -i 'out/audit_frames/frame_*.png'             -vf 'scale=640:-1,tile=4x3' -frames:v 1 out/QA_CONTACT_SHEET.png

          sha256sum "$F" > out/SHA256SUMS.txt

      - name: Package full delivery and QA evidence
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_variable_velocity_senior_v3_english_20260920
          cp "$JOB/physics9_variable_velocity_senior_v3_english.py" out/
          cp "$JOB/jp_classroom_style.py" out/
          cp style_qa.log out/
          cp qa_out/render_pql.log out/
          cat > out/RENDER_INFO.txt <<'EOF'
          Physics 9 — Variable Velocity SENIOR V3 ENGLISH
          ManimCE: 0.20.1
          Format: JP Classroom Standard
          Language: English-only on-screen content
          Preview: literal -pql with LESSON_TIME_SCALE=0.18
          Final: literal -pqh with LESSON_TIME_SCALE=1.0
          Resolution: 1920x1080
          FPS: 30
          Main pedagogy:
          1. constant-velocity recap
          2. five numbered trip events
          3. position-time graph interpretation
          4. velocity-time graph built interval by interval
          5. average-acceleration bridge
          6. numbered synthesis
          QA:
          py_compile + English-only contract + JP style checker +
          runtime safe-layout assertions + PQL + PQH + ffprobe +
          full sequential decode + 11 audit frames + contact sheet + SHA-256
          EOF

          cd out
          zip -9 -r Physics9_VariableVelocity_SENIOR_V3_ENGLISH_FULL_FINAL_PQH_Package.zip             Physics9_VariableVelocity_SENIOR_V3_ENGLISH_FULL_FINAL_pqh.mp4             physics9_variable_velocity_senior_v3_english.py jp_classroom_style.py             VIDEO_TECHNICAL.tsv SHA256SUMS.txt RENDER_INFO.txt style_qa.log             render_pqh.log render_pql.log full_decode.log QA_CONTACT_SHEET.png audit_frames/

      - name: Publish verified V3 delivery to branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliveries/physics9
          cp out/Physics9_VariableVelocity_SENIOR_V3_ENGLISH_FULL_FINAL_pqh.mp4 deliveries/physics9/
          cp out/Physics9_VariableVelocity_SENIOR_V3_ENGLISH_FULL_FINAL_PQH_Package.zip deliveries/physics9/
          cp out/QA_CONTACT_SHEET.png deliveries/physics9/Physics9_VariableVelocity_SENIOR_V3_ENGLISH_QA_CONTACT_SHEET.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliveries/physics9/
          if git diff --cached --quiet; then
            echo "No delivery changes to publish"
          else
            git commit -m "render: publish Physics9 variable velocity senior V3 English PQH [skip ci]"
            git push origin HEAD:physics9-variable-velocity-senior-v3-english-20260920
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Physics9-VariableVelocity-SENIOR-V3-ENGLISH-FULL-FINAL-PQH
          path: |
            out/Physics9_VariableVelocity_SENIOR_V3_ENGLISH_FULL_FINAL_pqh.mp4
            out/Physics9_VariableVelocity_SENIOR_V3_ENGLISH_FULL_FINAL_PQH_Package.zip
            out/physics9_variable_velocity_senior_v3_english.py
            out/jp_classroom_style.py
            out/VIDEO_TECHNICAL.tsv
            out/SHA256SUMS.txt
            out/RENDER_INFO.txt
            out/style_qa.log
            out/QA_CONTACT_SHEET.png
            out/audit_frames/
          if-no-files-found: error
          retention-days: 14
