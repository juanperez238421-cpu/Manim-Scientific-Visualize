name: Inventor Rib Nervio FULL TOTAL PQH 20260826

on:
  pull_request:
    branches:
      - render/inventor-hole-patterns-full-pqh-20260826

permissions:
  contents: read

env:
  JOB_ROOT: render_jobs/inventor_dedicated_20260826
  MANIM_IMAGE: manimcommunity/manim:v0.20.1

jobs:
  render-rib-nervio:
    if: github.event.pull_request.head.ref == 'render/inventor-rib-nervio-full-pqh-trigger-20260826'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Static Python validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            "$JOB_ROOT/library/inventor_pro_ui.py" \
            "$JOB_ROOT/library/sketch_to_3d_helpers.py" \
            "$JOB_ROOT/scenes/04_rib_nervio.py"
          grep -n "class InventorRibDetailed" "$JOB_ROOT/scenes/04_rib_nervio.py"

      - name: Install render and QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip >/dev/null
          docker pull "$MANIM_IMAGE" >/dev/null
          ffprobe -version | head -1

      - name: Literal PQL smoke gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          rm -rf media_pql media delivery_nervio
          mkdir -p delivery_nervio/logs delivery_nervio/qa/audit_frames delivery_nervio/final delivery_nervio/source

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e PYTHONPATH="/manim/$JOB_ROOT" \
            -v "$GITHUB_WORKSPACE:/manim" \
            -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql scenes/04_rib_nervio.py InventorRibDetailed \
                --fps 15 \
                --format=mp4 \
                --media_dir media_pql/rib_nervio \
                --disable_caching
            " 2>&1 | tee delivery_nervio/logs/rib_nervio_pql.log

          test -n "$(find media_pql/rib_nervio -type f -name 'InventorRibDetailed.mp4' -print -quit)"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e PYTHONPATH="/manim/$JOB_ROOT" \
            -v "$GITHUB_WORKSPACE:/manim" \
            -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh scenes/04_rib_nervio.py InventorRibDetailed \
                --fps 30 \
                --format=mp4 \
                --media_dir media/rib_nervio \
                --disable_caching
            " 2>&1 | tee delivery_nervio/logs/rib_nervio_pqh.log

          FINAL="$(find media/rib_nervio -type f -name 'InventorRibDetailed.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" delivery_nervio/final/Inventor_Nervio_Rib_FULL_TOTAL_PQH.mp4

      - name: Strict technical QA and visual audit evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          VIDEO="delivery_nervio/final/Inventor_Nervio_Rib_FULL_TOTAL_PQH.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$VIDEO")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$VIDEO")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of json "$VIDEO" > delivery_nervio/qa/ffprobe.json
          ffmpeg -nostdin -v error -i "$VIDEO" -f null - 2> delivery_nervio/qa/full_decode.log
          test ! -s delivery_nervio/qa/full_decode.log

          for P in 0.06 0.18 0.30 0.42 0.54 0.66 0.78 0.90; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(python -c "print(int(float('$P')*100))")"
            ffmpeg -nostdin -y -v error -ss "$T" -i "$VIDEO" -frames:v 1 \
              "delivery_nervio/qa/audit_frames/nervio_${TAG}.png"
          done

          ffmpeg -nostdin -y -v error -i "$VIDEO" \
            -vf 'fps=1/7,scale=640:-1,tile=3x3' -frames:v 1 \
            delivery_nervio/qa/control_sheet.jpg

          sha256sum "$VIDEO" > delivery_nervio/qa/SHA256SUMS.txt
          printf 'width=%s\nheight=%s\nfps=%s\ncodec=%s\npix_fmt=%s\nduration=%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > delivery_nervio/qa/TECHNICAL.txt
          echo PASS > delivery_nervio/qa/QA_PASS.txt

      - name: Package exact source, logs and QA evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          cp scenes/04_rib_nervio.py delivery_nervio/source/
          cp library/inventor_pro_ui.py delivery_nervio/source/
          cp library/sketch_to_3d_helpers.py delivery_nervio/source/
          cat > delivery_nervio/README_DELIVERY.md <<'EOF'
          # Inventor Nervio / Rib FULL TOTAL PQH

          Pedagogical sequence:
          1. Stable XY plane and constrained rectangle.
          2. Extrusion1 host base.
          3. Vertical host wall.
          4. Stable lateral sketch plane.
          5. Open Sketch2 rib profile.
          6. 3D Model -> Rib.
          7. Thickness = 6 mm, Symmetric.
          8. Extent = To Next.
          9. Preview verification.
          10. OK -> Rib1 and final orbit.

          Render/QA protocol: ManimCE 0.20.1, literal -pql gate, literal -pqh final, 1920x1080, 30 fps, H.264/yuv420p, full FFmpeg decode, distributed audit frames, contact sheet and SHA-256.
          EOF
          (cd delivery_nervio && zip -qr Inventor_Nervio_Rib_FULL_TOTAL_PQH_PACKAGE.zip final source qa logs README_DELIVERY.md)

      - name: Upload verified Nervio package
        uses: actions/upload-artifact@v4
        with:
          name: Inventor-Nervio-Rib-FULL-TOTAL-PQH
          path: render_jobs/inventor_dedicated_20260826/delivery_nervio/
          if-no-files-found: error
          retention-days: 14
