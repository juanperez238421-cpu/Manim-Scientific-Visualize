name: Physics9 Uniform Motion + Galileo V5.6 Final Audit PQH 20260901

on:
  pull_request:
    branches:
      - main
    paths:
      - 'render_jobs/physics9_galileo_inclined_plane_20260901/Physics9_UniformMotion_Galileo_V5_6_FINAL_AUDIT.py'
      - '.github/workflows/physics9_uniform_motion_galileo_v5_6_final_audit_pqh_20260901.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-v5-6:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Validate source and install tools
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          SRC="$JOB/Physics9_UniformMotion_Galileo_V5_6_FINAL_AUDIT.py"
          test -s "$SRC"
          python -m py_compile \
            "$JOB/Physics9_Galileo_Inclined_Plane_MUA_FINAL.py" \
            "$JOB/Physics9_Galileo_Uniform_Motion_Fall_Intro_V3.py" \
            "$JOB/Physics9_UniformMotion_Galileo_V5.py" \
            "$JOB/Physics9_UniformMotion_Galileo_V5_1_SENIOR_QA.py" \
            "$JOB/Physics9_UniformMotion_Galileo_V5_2_FINAL_QA.py" \
            "$JOB/Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA.py" \
            "$JOB/Physics9_UniformMotion_Galileo_V5_4_FINAL_FRAME_QA.py" \
            "$JOB/Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL.py" \
            "$SRC"
          grep -q '^class Physics9UniformMotionGalileoV56FinalAudit' "$SRC"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick zip
          python -m pip install --quiet opencv-python-headless
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          mkdir -p qa_preview final_out final_out/audit_frames_05s final_out/audit_frames_36 package

      - name: Literal PQL full-timeline gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          rm -rf media_pql_v56
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.06 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql Physics9_UniformMotion_Galileo_V5_6_FINAL_AUDIT.py Physics9UniformMotionGalileoV56FinalAudit \
                --format=mp4 --media_dir=/manim/media_pql_v56 --disable_caching
            ' 2>&1 | tee qa_preview/render_v56_pql.log
          PQL="$(find media_pql_v56 -type f -name 'Physics9UniformMotionGalileoV56FinalAudit.mp4' -print -quit)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          rm -rf media_pqh_v56
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh Physics9_UniformMotion_Galileo_V5_6_FINAL_AUDIT.py Physics9UniformMotionGalileoV56FinalAudit \
                --format=mp4 --media_dir=/manim/media_pqh_v56 --disable_caching
            ' 2>&1 | tee final_out/render_v56_pqh.log
          FINAL="$(find media_pqh_v56 -type f -name 'Physics9UniformMotionGalileoV56FinalAudit.mp4' -print -quit)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" final_out/Physics9_UniformMotion_Galileo_V5_6_FINAL_AUDIT_pqh.mp4

      - name: Technical QA and exhaustive visual audit
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          SRC="$JOB/Physics9_UniformMotion_Galileo_V5_6_FINAL_AUDIT.py"
          F=final_out/Physics9_UniformMotion_Galileo_V5_6_FINAL_AUDIT_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tduration\tframes\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$DUR" "$FRAMES" "$SIZE" > final_out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920 && test "$H" = 1080 && test "$CODEC" = h264
          ffmpeg -nostdin -v error -i "$F" -f null - 2> final_out/full_decode.log
          test ! -s final_out/full_decode.log

          VIDEO="$F" python - <<'PY'
          import cv2, os
          cap=cv2.VideoCapture(os.environ['VIDEO']); n=0; hits=[]
          while True:
              ok,frame=cap.read()
              if not ok: break
              gray=cv2.cvtColor(frame,cv2.COLOR_BGR2GRAY); dark=gray < 80
              if dark[:3,:].any() or dark[-3:,:].any() or dark[:,:3].any() or dark[:,-3:].any(): hits.append(n)
              n+=1
          cap.release()
          open('final_out/EVERY_FRAME_SCAN.tsv','w').write(f'frames_scanned\tedge_touch_frames\n{n}\t{len(hits)}\n')
          if hits:
              open('final_out/EVERY_FRAME_EDGE_HITS.txt','w').write('\n'.join(map(str,hits)))
              raise SystemExit(f'outer-edge content detected in {len(hits)} frames')
          PY

          ffmpeg -nostdin -loglevel error -i "$F" -vf fps=2 -q:v 2 final_out/audit_frames_05s/halfsec_%04d.jpg
          montage final_out/audit_frames_05s/*.jpg -thumbnail 384x216 -tile 6x -geometry +7+9 -background white -quality 90 final_out/CONTACT_SHEET_05S_ALL.jpg
          for INDEX in $(seq -w 0 35); do
            T="$(python -c "print(float('$DUR')*(int('$INDEX')+0.5)/36.0)")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "final_out/audit_frames_36/frame_${INDEX}.png"
          done
          montage final_out/audit_frames_36/*.png -thumbnail 384x216 -tile 6x6 -geometry +8+10 -background white -quality 90 final_out/CONTACT_SHEET_36.jpg

          cat > final_out/FRAME_CODE_QA.md <<'EOF'
          # V5.5 -> V5.6 residual frame/code QA

          | V5.5 time | V5.5 code region | Residual defect | V5.6 correction |
          |---|---|---|---|
          | ~33.5 s | `graph_equation_connection`: `ilab.move_to(ax.c2p(0.75,1.55))` | x_i callout still covers the y-axis/start of plotted line | callout moved to empty upper-left graph region with a dedicated leader |
          | ~49.5 s | `galileo_real_apparatus_v5`: `lpos` for t=2 | t=2 text still touches/crosses the ramp | every time label is now clearly above/outside the ramp with leader lines |
          | ~78.5-80.5 s | `falling_equation_preview_v5`: `u=0.32`, circle radius `0.11` | t=0 and t=1 markers remain visually too close | exact 1:3:5 spacing retained with u=0.36 and radius=0.085 |

          V5.6 inherits the V5.5 fixes for the x-t slope badge, ramp-normal ball position, square-time graph annotation strip, larger typography, and section-transition cleanup.
          EOF
          sha256sum "$F" "$SRC" > final_out/SHA256SUMS.txt
          {
            echo '# Physics 9 Uniform Motion + Galileo V5.6 — Final Audit'
            echo '- V5.5 render visually audited after successful PQH: YES'
            echo '- Residual defects corrected in V5.6: YES'
            echo '- Every encoded frame outer-edge scan: PASS'
            echo '- Half-second contact audit generated: YES'
            echo '- 36-frame distributed audit generated: YES'
            echo '- PQL gate: PASS'
            echo '- PQH render: PASS'
            echo '- 1920x1080 H.264: PASS'
            echo '- Full decode: PASS'
            cat final_out/VIDEO_TECHNICAL.tsv
          } > final_out/SENIOR_QA_RESULT.md

          ROOT=package/Physics9_UniformMotion_Galileo_V5_6_FINAL_AUDIT_PQH
          mkdir -p "$ROOT/src" "$ROOT/render" "$ROOT/qa"
          cp "$SRC" "$ROOT/src/"
          cp "$F" "$ROOT/render/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/EVERY_FRAME_SCAN.tsv final_out/FRAME_CODE_QA.md final_out/SENIOR_QA_RESULT.md final_out/SHA256SUMS.txt final_out/CONTACT_SHEET_05S_ALL.jpg final_out/CONTACT_SHEET_36.jpg "$ROOT/qa/"
          cp -r final_out/audit_frames_05s final_out/audit_frames_36 "$ROOT/qa/"
          (cd package && zip -qr Physics9_UniformMotion_Galileo_V5_6_FINAL_AUDIT_PQH.zip Physics9_UniformMotion_Galileo_V5_6_FINAL_AUDIT_PQH)
          cp package/Physics9_UniformMotion_Galileo_V5_6_FINAL_AUDIT_PQH.zip final_out/

      - name: Upload V5.6 deliverables
        uses: actions/upload-artifact@v4
        with:
          name: Physics9_UniformMotion_Galileo_V5_6_FINAL_AUDIT_PQH
          path: |
            final_out/Physics9_UniformMotion_Galileo_V5_6_FINAL_AUDIT_pqh.mp4
            final_out/Physics9_UniformMotion_Galileo_V5_6_FINAL_AUDIT_PQH.zip
            final_out/SENIOR_QA_RESULT.md
            final_out/FRAME_CODE_QA.md
            final_out/EVERY_FRAME_SCAN.tsv
            final_out/VIDEO_TECHNICAL.tsv
            final_out/CONTACT_SHEET_05S_ALL.jpg
            final_out/CONTACT_SHEET_36.jpg
            final_out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
