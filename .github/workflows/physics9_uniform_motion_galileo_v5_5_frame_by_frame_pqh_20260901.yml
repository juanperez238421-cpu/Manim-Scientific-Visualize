name: Physics9 Uniform Motion + Galileo V5.5 Frame-by-Frame PQH 20260901

on:
  pull_request:
    branches:
      - main
    paths:
      - 'render_jobs/physics9_galileo_inclined_plane_20260901/Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL.py'
      - '.github/workflows/physics9_uniform_motion_galileo_v5_5_frame_by_frame_pqh_20260901.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-v5-5:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Validate source and install tools
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          SRC="$JOB/Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL.py"
          test -s "$SRC"
          python -m py_compile \
            "$JOB/Physics9_Galileo_Inclined_Plane_MUA_FINAL.py" \
            "$JOB/Physics9_Galileo_Uniform_Motion_Fall_Intro_V3.py" \
            "$JOB/Physics9_UniformMotion_Galileo_V5.py" \
            "$JOB/Physics9_UniformMotion_Galileo_V5_1_SENIOR_QA.py" \
            "$JOB/Physics9_UniformMotion_Galileo_V5_2_FINAL_QA.py" \
            "$JOB/Physics9_UniformMotion_Galileo_V5_3_TOTAL_QA.py" \
            "$JOB/Physics9_UniformMotion_Galileo_V5_4_FINAL_FRAME_QA.py" \
            "$SRC"
          grep -q '^class Physics9UniformMotionGalileoV55FrameByFrameFinal' "$SRC"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick zip
          python -m pip install --quiet opencv-python-headless
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          mkdir -p qa_preview final_out final_out/audit_frames_05s final_out/audit_frames_36 package

      - name: Literal PQL full-timeline gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          rm -rf media_pql_v55
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.06 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL.py Physics9UniformMotionGalileoV55FrameByFrameFinal \
                --format=mp4 --media_dir=/manim/media_pql_v55 --disable_caching
            ' 2>&1 | tee qa_preview/render_v55_pql.log
          PQL="$(find media_pql_v55 -type f -name 'Physics9UniformMotionGalileoV55FrameByFrameFinal.mp4' -print -quit)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          rm -rf media_pqh_v55
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL.py Physics9UniformMotionGalileoV55FrameByFrameFinal \
                --format=mp4 --media_dir=/manim/media_pqh_v55 --disable_caching
            ' 2>&1 | tee final_out/render_v55_pqh.log
          FINAL="$(find media_pqh_v55 -type f -name 'Physics9UniformMotionGalileoV55FrameByFrameFinal.mp4' -print -quit)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" final_out/Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL_pqh.mp4

      - name: Technical QA, every-frame scan, and visual audit
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          SRC="$JOB/Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL.py"
          F=final_out/Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tduration\tframes\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$DUR" "$FRAMES" "$SIZE" > final_out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920 && test "$H" = 1080 && test "$CODEC" = h264
          ffmpeg -nostdin -v error -i "$F" -f null - 2> final_out/full_decode.log
          test ! -s final_out/full_decode.log

          # Scan every encoded frame for dark content touching the physical frame edge.
          VIDEO="$F" python - <<'PY'
          import cv2, os
          path=os.environ['VIDEO']; cap=cv2.VideoCapture(path); n=0; hits=[]
          while True:
              ok,frame=cap.read()
              if not ok: break
              gray=cv2.cvtColor(frame,cv2.COLOR_BGR2GRAY)
              dark=gray < 80
              edge=dark[:3,:].any() or dark[-3:,:].any() or dark[:,:3].any() or dark[:,-3:].any()
              if edge: hits.append(n)
              n+=1
          cap.release()
          open('final_out/EVERY_FRAME_SCAN.tsv','w').write(f'frames_scanned\tedge_touch_frames\n{n}\t{len(hits)}\n')
          if hits:
              open('final_out/EVERY_FRAME_EDGE_HITS.txt','w').write('\n'.join(map(str,hits)))
              raise SystemExit(f'dark content touches outer 3px in {len(hits)} frames')
          PY

          # Manual-review package: one frame every 0.5 seconds + 36 distributed PNGs.
          rm -rf final_out/audit_frames_05s && mkdir -p final_out/audit_frames_05s
          ffmpeg -nostdin -loglevel error -i "$F" -vf fps=2 -q:v 2 final_out/audit_frames_05s/halfsec_%04d.jpg
          montage final_out/audit_frames_05s/*.jpg -thumbnail 384x216 -tile 6x -geometry +7+9 -background white -quality 90 final_out/CONTACT_SHEET_05S_ALL.jpg
          rm -rf final_out/audit_frames_36 && mkdir -p final_out/audit_frames_36
          for INDEX in $(seq -w 0 35); do
            T="$(python -c "print(float('$DUR')*(int('$INDEX')+0.5)/36.0)")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "final_out/audit_frames_36/frame_${INDEX}.png"
          done
          montage final_out/audit_frames_36/*.png -thumbnail 384x216 -tile 6x6 -geometry +8+10 -background white -quality 90 final_out/CONTACT_SHEET_36.jpg

          cat > final_out/FRAME_CODE_QA.md <<'EOF'
          # V5.4 -> V5.5 frame/code QA

          | V5.4 time | V5.4 source statement | Residual defect | V5.5 correction |
          |---|---|---|---|
          | 14-18 s | inherited V5.3 `slope_label=...move_to(x_box.get_right()+LEFT*1.50+DOWN*0.82)` | slope equation sits on the x-axis/ticks | dedicated slope badge above the plotting region |
          | 31-35 s | inherited V5.3 `ilab=...next_to(intercept,RIGHT+UP,buff=0.14)` | initial-position label intersects the plotted line | boxed x_i callout with leader away from the line |
          | 37-41 s | inherited V5.3 `ball2...move_to(ramp.get_end()+UP*0.18)` | ball floats vertically rather than resting normal to the ramp | ball center offset by the ramp normal |
          | 46-54 s | V5.4 `label_positions` and ramp caption | t=3 crosses the ramp; t=4 is partially hidden by the bottom caption | all t labels moved outside the ramp with leader lines; caption reduced |
          | 68-73 s | V5.4 `steep=...move_to(right.get_bottom()+UP*0.30)` | explanatory sentence overlaps the x-axis/ticks | dedicated annotation strip below a shortened graph |
          | 76-81 s | V5.4 `k=0.36`, radius 0.16 | t=0 and t=1 circles visually touch | exact 1:3:5 spacing with smaller circles and explicit safe gap |

          Additional cleanup replaces text arrows `->` with the proper `→` glyph in corrected scenes.
          EOF
          sha256sum "$F" "$SRC" > final_out/SHA256SUMS.txt
          {
            echo '# Physics 9 Uniform Motion + Galileo V5.5 — Final QA'
            echo '- V5.4 complete timeline reviewed at 0.5-second sampling: YES'
            echo '- V5.4 full-resolution defect spot checks: YES'
            echo '- V5.5 every encoded frame edge scan: PASS'
            echo '- V5.5 half-second contact audit generated: YES'
            echo '- V5.5 36-frame distributed audit generated: YES'
            echo '- PQL gate: PASS'
            echo '- PQH render: PASS'
            echo '- 1920x1080 H.264: PASS'
            echo '- Full decode: PASS'
            cat final_out/VIDEO_TECHNICAL.tsv
          } > final_out/SENIOR_QA_RESULT.md

          ROOT=package/Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL_PQH
          mkdir -p "$ROOT/src" "$ROOT/render" "$ROOT/qa"
          cp "$SRC" "$ROOT/src/"
          cp "$F" "$ROOT/render/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/EVERY_FRAME_SCAN.tsv final_out/FRAME_CODE_QA.md final_out/SENIOR_QA_RESULT.md final_out/SHA256SUMS.txt final_out/CONTACT_SHEET_05S_ALL.jpg final_out/CONTACT_SHEET_36.jpg "$ROOT/qa/"
          cp -r final_out/audit_frames_05s final_out/audit_frames_36 "$ROOT/qa/"
          (cd package && zip -qr Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL_PQH.zip Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL_PQH)
          cp package/Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL_PQH.zip final_out/

      - name: Upload V5.5 deliverables
        uses: actions/upload-artifact@v4
        with:
          name: Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL_PQH
          path: |
            final_out/Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL_pqh.mp4
            final_out/Physics9_UniformMotion_Galileo_V5_5_FRAME_BY_FRAME_FINAL_PQH.zip
            final_out/SENIOR_QA_RESULT.md
            final_out/FRAME_CODE_QA.md
            final_out/EVERY_FRAME_SCAN.tsv
            final_out/VIDEO_TECHNICAL.tsv
            final_out/CONTACT_SHEET_05S_ALL.jpg
            final_out/CONTACT_SHEET_36.jpg
            final_out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
