name: Geometry 8 2D Areas Figure Atlas V3 FINAL PQH 20260901

on:
  push:
    branches:
      - agent/geometry8-2d-areas-figure-atlas-v3-20260901
    paths:
      - 'render_jobs/geometry8_2d_areas_masterclass_20260831/**'
      - '.github/workflows/geometry8_2d_areas_figure_atlas_v3_pqh_20260901.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-v3-final-pqh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Static compile gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_2d_areas_masterclass_20260831
          python -m py_compile \
            "$JOB/Geometry8_2D_Areas_Masterclass_FINAL.py" \
            "$JOB/Geometry8_2D_Areas_Masterclass_FINAL_QA.py" \
            "$JOB/geometry8_area_atlas_helpers_v3.py" \
            "$JOB/geometry8_area_atlas_basic_v3.py" \
            "$JOB/geometry8_area_atlas_quads_v3.py" \
            "$JOB/geometry8_area_atlas_circle_polygon_v3.py" \
            "$JOB/geometry8_area_atlas_circle_parts_v3.py" \
            "$JOB/Geometry8_2D_Areas_FigureByFigure_V3.py"

      - name: Literal PQL full-timeline gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_2d_areas_masterclass_20260831
          mkdir -p pql_media qa_out out
          cd "$JOB"
          LESSON_TIME_SCALE=0.045 manim -pql \
            Geometry8_2D_Areas_FigureByFigure_V3.py \
            Geometry8Areas2DFigureByFigureV3 \
            --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/pql_media"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_2d_areas_masterclass_20260831
          mkdir -p media out qa_out
          cd "$JOB"
          LESSON_TIME_SCALE=1.0 manim -pqh \
            Geometry8_2D_Areas_FigureByFigure_V3.py \
            Geometry8Areas2DFigureByFigureV3 \
            --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/media" \
            -o Geometry8_2D_Areas_FigureByFigure_V3_FINAL_pqh.mp4
          cd "$GITHUB_WORKSPACE"
          VIDEO=$(find media -type f -name 'Geometry8_2D_Areas_FigureByFigure_V3_FINAL_pqh.mp4' | head -n 1)
          test -n "$VIDEO"
          cp "$VIDEO" out/Geometry8_2D_Areas_FigureByFigure_V3_FINAL_pqh.mp4

      - name: Full technical video QA
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Geometry8_2D_Areas_FigureByFigure_V3_FINAL_pqh.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 "$VIDEO" | tee qa_out/ffprobe.txt
          grep -q '^codec_name=h264$' qa_out/ffprobe.txt
          grep -q '^width=1920$' qa_out/ffprobe.txt
          grep -q '^height=1080$' qa_out/ffprobe.txt
          grep -q '^r_frame_rate=30/1$' qa_out/ffprobe.txt
          grep -q '^pix_fmt=yuv420p$' qa_out/ffprobe.txt
          ffmpeg -v error -i "$VIDEO" -f null -
          ffmpeg -y -v error -i "$VIDEO" \
            -vf "fps=1/10,scale=320:-1,tile=4x6" -frames:v 1 qa_out/contact_sheet.jpg
          sha256sum "$VIDEO" | tee qa_out/SHA256SUMS.txt

      - name: Upload final video package
        uses: actions/upload-artifact@v4
        with:
          name: Geometry8-2D-Areas-FigureByFigure-V3-FINAL-PQH-20260901
          path: |
            out/Geometry8_2D_Areas_FigureByFigure_V3_FINAL_pqh.mp4
            qa_out/ffprobe.txt
            qa_out/contact_sheet.jpg
            qa_out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
