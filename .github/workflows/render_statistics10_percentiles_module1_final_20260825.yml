name: Render Statistics10 Percentiles Module1 FINAL PQH 20260825

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/statistics10-percentiles-module1-pqh-20260825'
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Protocol gate 0 - static validation
        shell: bash
        run: |
          set -euo pipefail
          JOB="render_jobs/statistics10_percentiles_module1_20260825"
          BASE="render_jobs/statistics10_week1_iqr_boxplot_20260824/main.py"
          python -m py_compile "$JOB/main.py" "$JOB/render.py" "$BASE"
          grep -n '^class Statistics10QuartilesDecilesPercentilesFinal' "$JOB/render.py"
          test -s "$JOB/TEACHER_ANSWER_KEY.md"
          test -s "$JOB/MODULE_QA.md"
          mkdir -p media_pql media_pqh delivery/audit_frames

      - name: Pull ManimCE 0.20.1 and install media QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          ffprobe -version | head -n 1

      - name: Protocol gate 1 - literal PQL runtime QA
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql \
                render_jobs/statistics10_percentiles_module1_20260825/render.py \
                Statistics10QuartilesDecilesPercentilesFinal \
                --fps 15 \
                --format=mp4 \
                --disable_caching \
                --media_dir media_pql
            ' 2>&1 | tee pql_render.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          PQL_VIDEO="$(find media_pql -type f -name 'Statistics10QuartilesDecilesPercentilesFinal.mp4' -print -quit)"
          test -n "$PQL_VIDEO" && test -s "$PQL_VIDEO"

      - name: Protocol gate 2 - literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh \
                render_jobs/statistics10_percentiles_module1_20260825/render.py \
                Statistics10QuartilesDecilesPercentilesFinal \
                --fps 30 \
                --format=mp4 \
                --disable_caching \
                --media_dir media_pqh
            ' 2>&1 | tee pqh_render.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          PQH_VIDEO="$(find media_pqh -type f -name 'Statistics10QuartilesDecilesPercentilesFinal.mp4' -print -quit)"
          test -n "$PQH_VIDEO" && test -s "$PQH_VIDEO"
          printf '%s\n' "$PQH_VIDEO" > pqh_video_path.txt

      - name: Protocol gate 3 - technical verification and full decode
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(cat pqh_video_path.txt)"
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 "$VIDEO" | tee ffprobe.txt
          grep -q '^codec_name=h264$' ffprobe.txt
          grep -q '^width=1920$' ffprobe.txt
          grep -q '^height=1080$' ffprobe.txt
          grep -q '^r_frame_rate=30/1$' ffprobe.txt
          grep -q '^pix_fmt=yuv420p$' ffprobe.txt
          ffmpeg -v error -i "$VIDEO" -f null - 2>&1 | tee full_decode.log
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
          python -c "d=float('$DURATION'); assert 120 <= d <= 900, f'Unexpected duration: {d}'; print('duration_seconds', d)"

      - name: Export 24 distributed audit frames
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(cat pqh_video_path.txt)"
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
          ffmpeg -v error -i "$VIDEO" -vf "fps=24/${DURATION}" -frames:v 24 delivery/audit_frames/frame_%02d.png
          test "$(find delivery/audit_frames -type f -name '*.png' | wc -l)" -eq 24

      - name: Stage complete PQH delivery package
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(cat pqh_video_path.txt)"
          JOB="render_jobs/statistics10_percentiles_module1_20260825"
          cp "$VIDEO" delivery/Statistics10_Module1_Quartiles_Deciles_Percentiles_FINAL_PQH.mp4
          cp "$JOB/main.py" delivery/Statistics10_Module1_Quartiles_Deciles_Percentiles.py
          cp "$JOB/render.py" delivery/FINAL_RENDER_WRAPPER.py
          cp "$JOB/TEACHER_ANSWER_KEY.md" "$JOB/MODULE_QA.md" delivery/
          cp .github/workflows/render_statistics10_percentiles_module1_final_20260825.yml delivery/GITHUB_ACTIONS_RENDER_WORKFLOW.yml
          cp pql_render.log pqh_render.log ffprobe.txt full_decode.log delivery/
          cat > delivery/RENDER_INFO.txt <<'EOF'
          Subject: Statistics 10
          Module: Quartiles, Deciles and Percentiles in Context
          Scene: Statistics10QuartilesDecilesPercentilesFinal
          Continuity: audited Statistics 10 IQR / boxplot classroom architecture
          Percentile convention: r = 1 + (n-1)k/100 with linear interpolation
          ManimCE: 0.20.1
          Validation: py_compile + literal -pql runtime gate
          Final render: literal -pqh
          Resolution: 1920x1080
          FPS: 30
          QA: H.264/yuv420p ffprobe checks + full FFmpeg decode + 24 distributed audit frames + SHA-256
          EOF
          (cd delivery && sha256sum Statistics10_Module1_Quartiles_Deciles_Percentiles_FINAL_PQH.mp4 Statistics10_Module1_Quartiles_Deciles_Percentiles.py FINAL_RENDER_WRAPPER.py TEACHER_ANSWER_KEY.md MODULE_QA.md GITHUB_ACTIONS_RENDER_WORKFLOW.yml pql_render.log pqh_render.log ffprobe.txt full_decode.log RENDER_INFO.txt audit_frames/*.png > SHA256SUMS.txt)
          zip -9 -r Statistics10_Module1_Quartiles_Deciles_Percentiles_FULL_PQH_PACKAGE.zip delivery >/dev/null
          cp Statistics10_Module1_Quartiles_Deciles_Percentiles_FULL_PQH_PACKAGE.zip delivery/
          ls -lh delivery

      - name: Upload final presentation and QA package
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10-Module1-Quartiles-Deciles-Percentiles-FINAL-PQH
          path: delivery/
          if-no-files-found: error
          retention-days: 7
