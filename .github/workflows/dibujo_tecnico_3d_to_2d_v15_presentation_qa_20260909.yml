name: Dibujo Tecnico 3D to 2D V15 PRESENTATION QA

on:
  push:
    branches:
      - render/dibujo-tecnico-3d-to-2d-v15-presentation-qa-20260909
    paths:
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V15_PRESENTATION_QA.py'
      - '.github/workflows/dibujo_tecnico_3d_to_2d_v15_presentation_qa_20260909.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  render-v15-presentation-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          SRC="$JOB/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V15_PRESENTATION_QA.py"
          test -s "$SRC"
          python -m py_compile "$SRC"
          python - <<'PY'
          from pathlib import Path
          p=Path('render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V15_PRESENTATION_QA.py')
          s=p.read_text(encoding='utf-8')
          required=[
              'class Projection3Dto2DV15PresentationQA',
              'LAS VISTAS SON LAS MISMAS',
              'DE UN OBJETO 3D A UNA HOJA 2D',
              'scale_to_fit_width(14.15)',
              'FadeOut(m) for m in current',
              'pieces = [title, *list(cards.submobjects), note]',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          print('V15_STATIC_QA=PASS')
          PY
          mkdir -p /tmp/manim-bin /tmp/manim-home pql_media media out qa_out qa_out/audit_frames package
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open

      - name: PQL full timeline gate
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH HOME=/tmp/manim-home LESSON_TIME_SCALE=0.10
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pql Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V15_PRESENTATION_QA.py \
            Projection3Dto2DV15PresentationQA --fps 15 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/pql_media" 2>&1 | tee "$GITHUB_WORKSPACE/qa_out/PQL.log"
          cd "$GITHUB_WORKSPACE"
          PQL="$(find pql_media -type f -name 'Projection3Dto2DV15PresentationQA.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          echo 'PQL_FULL_TIMELINE=PASS'

      - name: Literal PQH render 1920x1080 30fps
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH HOME=/tmp/manim-home LESSON_TIME_SCALE=1.0
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pqh Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V15_PRESENTATION_QA.py \
            Projection3Dto2DV15PresentationQA --fps 30 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/media" 2>&1 | tee "$GITHUB_WORKSPACE/qa_out/PQH.log"
          cd "$GITHUB_WORKSPACE"
          VIDEO="$(find media -type f -name 'Projection3Dto2DV15PresentationQA.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"
          cp "$VIDEO" out/Diedrico_3D_to_2D_V15_PRESENTATION_QA.mp4
          cp "$VIDEO" out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V15_PRESENTATION_QA_FINAL_pqh.mp4
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V15_PRESENTATION_QA.py out/
          echo 'PQH_LITERAL_RENDER=PASS'

      - name: Hard technical QA and full decode
        id: tech
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Diedrico_3D_to_2D_V15_PRESENTATION_QA.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/TECHNICAL_QA.txt
          import av, os, sys
          p=sys.argv[1]; frames=0
          with av.open(p) as c:
              s=c.streams.video[0]
              codec=s.codec_context.name
              width=s.codec_context.width; height=s.codec_context.height
              pix=s.codec_context.format.name if s.codec_context.format else ''
              fps=float(s.average_rate) if s.average_rate else 0.0
              duration=float(c.duration)/float(av.time_base) if c.duration else 0.0
              for _ in c.decode(s): frames += 1
          size=os.path.getsize(p)
          print(f'codec_name={codec}')
          print(f'width={width}')
          print(f'height={height}')
          print(f'pix_fmt={pix}')
          print(f'average_fps={fps:.6f}')
          print(f'duration={duration:.6f}')
          print(f'frames_decoded={frames}')
          print(f'file_size={size}')
          assert codec=='h264', codec
          assert (width,height)==(1920,1080), (width,height)
          assert pix=='yuv420p', pix
          assert 29.8 <= fps <= 30.2, fps
          assert duration > 120.0, duration
          assert frames > 3600, frames
          assert size > 2_000_000, size
          print('FULL_DECODE=PASS')
          print('TECHNICAL_QA=PASS')
          PY
          SHA="$(sha256sum "$VIDEO" | awk '{print $1}')"
          SIZE="$(stat -c%s "$VIDEO")"
          echo "$SHA  $VIDEO" | tee qa_out/SHA256SUMS.txt
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Generate 96-frame visual audit
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Diedrico_3D_to_2D_V15_PRESENTATION_QA.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/VISUAL_AUDIT.txt
          import av, math, os, sys
          from PIL import Image, ImageDraw
          p=sys.argv[1]; count=96; saved=[]
          with av.open(p) as c:
              s=c.streams.video[0]
              duration=float(c.duration)/float(av.time_base)
              targets=[duration*i/(count+1) for i in range(1,count+1)]
              ti=0
              for frame in c.decode(s):
                  if ti>=len(targets): break
                  t=float(frame.pts*frame.time_base) if frame.pts is not None else 0.0
                  if t>=targets[ti]:
                      im=Image.fromarray(frame.to_ndarray(format='rgb24'))
                      fp=f'qa_out/audit_frames/frame_{ti+1:03d}_{targets[ti]:07.2f}.jpg'
                      im.save(fp,quality=88); saved.append(fp); ti+=1
          assert len(saved)>=92, len(saved)
          cards=[]
          for fp in saved:
              im=Image.open(fp).convert('RGB'); im.thumbnail((384,216))
              card=Image.new('RGB',(400,245),'white'); card.paste(im,((400-im.width)//2,5))
              ImageDraw.Draw(card).text((8,224),os.path.basename(fp),fill='black'); cards.append(card)
          cols=4; rows=math.ceil(len(cards)/cols)
          sheet=Image.new('RGB',(cols*400,rows*245),'white')
          for i,im in enumerate(cards): sheet.paste(im,((i%cols)*400,(i//cols)*245))
          sheet.save('qa_out/Diedrico_3D_to_2D_V15_contact_sheet.jpg',quality=88)
          print(f'audit_frames={len(saved)}')
          print(f'duration={duration:.6f}')
          print('VISUAL_AUDIT_GENERATED=PASS')
          PY

      - name: Package V15
        shell: bash
        run: |
          set -euo pipefail
          cp out/Diedrico_3D_to_2D_V15_PRESENTATION_QA.mp4 package/
          cp out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V15_PRESENTATION_QA_FINAL_pqh.mp4 package/
          cp out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V15_PRESENTATION_QA.py package/
          cp qa_out/TECHNICAL_QA.txt qa_out/SHA256SUMS.txt qa_out/VISUAL_AUDIT.txt package/
          cp qa_out/Diedrico_3D_to_2D_V15_contact_sheet.jpg package/
          cp qa_out/PQH.log qa_out/PQL.log package/

      - name: Upload full V15 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diedrico_3D_to_2D_V15_PRESENTATION_QA_FULL_TOTAL
          path: package/
          if-no-files-found: error
          retention-days: 7

      - name: Publish exact validated V15 MP4 via Git Data API
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.tech.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.tech.outputs.size }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.parse, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']; branch=os.environ['GITHUB_REF_NAME']
          expected_sha=os.environ['EXPECTED_SHA']; expected_size=int(os.environ['EXPECTED_SIZE'])
          video=open('out/Diedrico_3D_to_2D_V15_PRESENTATION_QA.mp4','rb').read()
          assert len(video)==expected_size
          assert hashlib.sha256(video).hexdigest()==expected_sha
          api=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def req(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(url,data=data,method=method,headers=headers)
              if data is not None: r.add_header('Content-Type','application/json')
              with urllib.request.urlopen(r,timeout=180) as f:
                  body=f.read(); return json.loads(body) if body else {}
          blob=req('POST',f'{api}/git/blobs',{'content':base64.b64encode(video).decode(),'encoding':'base64'})
          ref_path=urllib.parse.quote(branch,safe='/')
          ref=req('GET',f'{api}/git/ref/heads/{ref_path}')
          parent=ref['object']['sha']
          base=req('GET',f'{api}/git/commits/{parent}')
          paths=[
              'published_renders/Diedrico_3D_to_2D_V15_PRESENTATION_QA.mp4',
              'published_renders/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V15_PRESENTATION_QA_FINAL_pqh.mp4',
          ]
          tree=req('POST',f'{api}/git/trees',{'base_tree':base['tree']['sha'],'tree':[
              {'path':p,'mode':'100644','type':'blob','sha':blob['sha']} for p in paths
          ]})
          commit=req('POST',f'{api}/git/commits',{'message':'Publish validated V15 presentation-QA render','tree':tree['sha'],'parents':[parent]})
          req('PATCH',f'{api}/git/refs/heads/{ref_path}',{'sha':commit['sha'],'force':False})
          open('qa_out/PUBLISHED_COMMIT.txt','w').write(commit['sha']+'\n')
          print('PUBLISHED_COMMIT='+commit['sha'])
          PY
          echo "commit=$(cat qa_out/PUBLISHED_COMMIT.txt)" >> "$GITHUB_OUTPUT"

      - name: Verify commit-pinned raw MP4 byte-for-byte
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.tech.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.tech.outputs.size }}
          PUB_COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee qa_out/DIRECT_REDOWNLOAD_QA.txt
          import hashlib, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; commit=os.environ['PUB_COMMIT']
          sha=os.environ['EXPECTED_SHA']; size=int(os.environ['EXPECTED_SIZE'])
          path='published_renders/Diedrico_3D_to_2D_V15_PRESENTATION_QA.mp4'
          url=f'https://raw.githubusercontent.com/{repo}/{commit}/{path}'
          with urllib.request.urlopen(url,timeout=180) as r: data=r.read()
          got=hashlib.sha256(data).hexdigest()
          print(url)
          print(f'bytes={len(data)} sha256={got}')
          assert len(data)==size, (len(data),size)
          assert got==sha, (got,sha)
          print('DIRECT_REDOWNLOAD=PASS')
          PY

      - name: Upload publication proof
        uses: actions/upload-artifact@v4
        with:
          name: Diedrico_3D_to_2D_V15_PUBLICATION_PROOF
          path: |
            qa_out/PUBLISHED_COMMIT.txt
            qa_out/DIRECT_REDOWNLOAD_QA.txt
            qa_out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
