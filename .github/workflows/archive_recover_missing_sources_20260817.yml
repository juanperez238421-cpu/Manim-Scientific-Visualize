name: Recover Exact Sources for Clean PQH Archive

on:
  push:
    branches:
      - archive/clean-pqh-source-recovery-20260817
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout archive branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Recover exact historical sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf recovered_sources tmp_recovery
          mkdir -p recovered_sources tmp_recovery

          git fetch --depth=1 origin render-solids-v4-bigger-figures-20260811:refs/remotes/origin/render-solids-v4-bigger-figures-20260811
          git show origin/render-solids-v4-bigger-figures-20260811:render_delivery/SolidsOfRevolution_InventorProfessional_TRANSFORM_V4_BIGGER_FIGURES_FINAL.py > recovered_sources/SolidsOfRevolution_InventorProfessional_TRANSFORM_V4_BIGGER_FIGURES_FINAL.py
          git show origin/render-solids-v4-bigger-figures-20260811:render_delivery/jp_classroom_style.py > recovered_sources/jp_classroom_style_V4_EXACT.py
          test "$(sha256sum recovered_sources/SolidsOfRevolution_InventorProfessional_TRANSFORM_V4_BIGGER_FIGURES_FINAL.py | cut -d' ' -f1)" = "c359547721378bfcb9d4ddb1a485b0e8e039a6379053f6df63b4279a846dc6d4"
          test "$(sha256sum recovered_sources/jp_classroom_style_V4_EXACT.py | cut -d' ' -f1)" = "3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d"

          git fetch --depth=1 origin render-solids-v5-rotation-sync-20260812:refs/remotes/origin/render-solids-v5-rotation-sync-20260812
          cp recovered_sources/SolidsOfRevolution_InventorProfessional_TRANSFORM_V4_BIGGER_FIGURES_FINAL.py recovered_sources/SolidsOfRevolution_InventorProfessional_TRANSFORM_V5_ROTATION_SYNC_FINAL.py
          git show origin/render-solids-v5-rotation-sync-20260812:render_v5/v4_to_v5_rotation_sync.patch > tmp_recovery/v4_to_v5_rotation_sync.patch
          test "$(sha256sum tmp_recovery/v4_to_v5_rotation_sync.patch | cut -d' ' -f1)" = "09fbc472d669f86c5c0ac1692263ffcbc1efbd095f6696c4d09a8f3228316005"
          patch recovered_sources/SolidsOfRevolution_InventorProfessional_TRANSFORM_V5_ROTATION_SYNC_FINAL.py tmp_recovery/v4_to_v5_rotation_sync.patch
          test "$(sha256sum recovered_sources/SolidsOfRevolution_InventorProfessional_TRANSFORM_V5_ROTATION_SYNC_FINAL.py | cut -d' ' -f1)" = "d8e15d3c44aea974ab3210f80d900d28b7d985a1ff6333a24b0737e919691c24"
          cp recovered_sources/jp_classroom_style_V4_EXACT.py recovered_sources/jp_classroom_style_V5_EXACT.py

          git fetch --depth=1 origin agent/valentina-senior-detailed-v2-20260813:refs/remotes/origin/valentina-senior-v2
          git show origin/valentina-senior-v2:render_jobs/valentina_senior_v2/scene_full.b64 > tmp_recovery/valentina_scene_full.b64
          base64 -d tmp_recovery/valentina_scene_full.b64 | gzip -dc > recovered_sources/valentina_workshop_senior_v2.py
          test "$(sha256sum recovered_sources/valentina_workshop_senior_v2.py | cut -d' ' -f1)" = "30d0f58147048e439e1b05fda5d2f56e685ae96fde03cc94bbf410c50595731f"

          git fetch --depth=1 origin agent/html-github-css-masterclasses-v5:refs/remotes/origin/html-github-css-masterclasses-v5
          git archive origin/html-github-css-masterclasses-v5 vscode_html_tutorial | tar -x -C tmp_recovery
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          root = Path('tmp_recovery/vscode_html_tutorial')
          payload = ''.join((root/'masterclass_v4_parts'/f'part_{i:02d}.txt').read_text(encoding='utf-8') for i in range(7))
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          Path('recovered_sources/GitHubGitMasterclass_V4_exact.py').write_text(source, encoding='utf-8')
          PY

          python -m py_compile recovered_sources/*.py
          sha256sum recovered_sources/*.py | sort > recovered_sources/SOURCE_SHA256.txt

      - name: Upload recovered exact sources
        uses: actions/upload-artifact@v4
        with:
          name: clean-pqh-missing-exact-sources-20260817
          path: recovered_sources/
          if-no-files-found: error
          retention-days: 14
