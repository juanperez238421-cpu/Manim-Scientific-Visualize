name: Inventor Dedicated Operations Parallel PQH 20260826

on:
  push:
    branches:
      - render-inventor-dedicated-20260826
    paths:
      - '.github/workflows/inventor_operations_parallel_pqh_20260826.yml'
      - 'render_jobs/inventor_dedicated_20260826/library/**'
      - 'render_jobs/inventor_dedicated_20260826/scenes/**'
      - 'render_jobs/inventor_dedicated_20260826/README.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  JOB_ROOT: render_jobs/inventor_dedicated_20260826
  MANIM_IMAGE: manimcommunity/manim:v0.20.1

jobs:
  render:
    name: Render ${{ matrix.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - slug: 01_fillet_redondeo
            file: scenes/01_fillet_redondeo.py
            scene: InventorFilletDetailed
          - slug: 02_chamfer_chaflan
            file: scenes/02_chamfer_chaflan.py
            scene: InventorChamferDetailed
          - slug: 03_mirror_simetria
            file: scenes/03_mirror_simetria.py
            scene: InventorMirrorDetailed
          - slug: 04_rib_nervio
            file: scenes/04_rib_nervio.py
            scene: InventorRibDetailed
          - slug: 05_emboss_repujado
            file: scenes/05_emboss_repujado.py
            scene: InventorEmbossDetailed
          - slug: 06_coil_bobina
            file: scenes/06_coil_bobina.py
            scene: InventorCoilDetailed
          - slug: 07_rectangular_pattern_lineal
            file: scenes/07_rectangular_pattern_lineal.py
            scene: InventorRectPatternDetailed
          - slug: 08_circular_pattern
            file: scenes/08_circular_pattern.py
            scene: InventorCircularPatternDetailed

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Static Python validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            "$JOB_ROOT/library/inventor_pro_ui.py" \
            "$JOB_ROOT/${{ matrix.file }}"

      - name: Install verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip >/dev/null
          ffprobe -version | head -1
          docker pull "$MANIM_IMAGE" >/dev/null

      - name: Literal PQL smoke render
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          rm -rf "media_pql/${{ matrix.slug }}"
          mkdir -p "delivery/${{ matrix.slug }}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e PYTHONPATH="/manim/$JOB_ROOT" \
            -v "$GITHUB_WORKSPACE:/manim" \
            -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql '${{ matrix.file }}' '${{ matrix.scene }}' \
                --format=mp4 \
                --media_dir 'media_pql/${{ matrix.slug }}' \
                --disable_caching
            " 2>&1 | tee "delivery/${{ matrix.slug }}/render_pql.log"
          PREVIEW="$(find "media_pql/${{ matrix.slug }}" -type f -name '${{ matrix.scene }}.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW"
          test -s "$PREVIEW"
          cp "$PREVIEW" "delivery/${{ matrix.slug }}/${{ matrix.slug }}_PQL_PREVIEW.mp4"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          rm -rf "media/${{ matrix.slug }}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e PYTHONPATH="/manim/$JOB_ROOT" \
            -v "$GITHUB_WORKSPACE:/manim" \
            -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh '${{ matrix.file }}' '${{ matrix.scene }}' \
                --fps 30 \
                --format=mp4 \
                --media_dir 'media/${{ matrix.slug }}' \
                --disable_caching
            " 2>&1 | tee "delivery/${{ matrix.slug }}/render_pqh.log"
          FINAL="$(find "media/${{ matrix.slug }}" -type f -name '${{ matrix.scene }}.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL"
          test -s "$FINAL"
          cp "$FINAL" "delivery/${{ matrix.slug }}/${{ matrix.slug }}_PQH.mp4"
          cp "${{ matrix.file }}" "delivery/${{ matrix.slug }}/${{ matrix.slug }}.py"
          cp library/inventor_pro_ui.py "delivery/${{ matrix.slug }}/inventor_pro_ui.py"

      - name: Strict technical QA and audit frames
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          OUT="delivery/${{ matrix.slug }}"
          F="$OUT/${{ matrix.slug }}_PQH.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/full_decode.log"
          mkdir -p "$OUT/audit_frames"
          for P in 0.05 0.20 0.38 0.56 0.74 0.92; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "$OUT/audit_frames/frame_${TAG}.png"
          done
          sha256sum "$F" "$OUT/${{ matrix.slug }}.py" "$OUT/inventor_pro_ui.py" > "$OUT/SHA256SUMS.txt"
          cat > "$OUT/RENDER_INFO.txt" <<EOF
          Scene: ${{ matrix.scene }}
          Source: ${{ matrix.file }}
          ManimCE: 0.20.1
          Preview: literal -pql
          Final: literal -pqh
          Output: 1920x1080, 30 fps, H.264, yuv420p
          Visual system: Inventor Professional inspired ribbon + browser + property panel + gray CAD canvas
          QA: py_compile + PQL + PQH + ffprobe + full FFmpeg decode + 6 audit frames + SHA-256
          EOF
          (
            cd "$OUT"
            zip -9 -r "${{ matrix.slug }}_FULL_PACKAGE.zip" \
              "${{ matrix.slug }}_PQH.mp4" \
              "${{ matrix.slug }}.py" \
              inventor_pro_ui.py \
              VIDEO_TECHNICAL.tsv \
              RENDER_INFO.txt \
              SHA256SUMS.txt \
              render_pql.log \
              render_pqh.log \
              full_decode.log \
              audit_frames/ >/dev/null
          )

      - name: Upload verified operation package
        uses: actions/upload-artifact@v4
        with:
          name: inventor-${{ matrix.slug }}
          path: |
            ${{ env.JOB_ROOT }}/delivery/${{ matrix.slug }}/${{ matrix.slug }}_PQH.mp4
            ${{ env.JOB_ROOT }}/delivery/${{ matrix.slug }}/${{ matrix.slug }}.py
            ${{ env.JOB_ROOT }}/delivery/${{ matrix.slug }}/inventor_pro_ui.py
            ${{ env.JOB_ROOT }}/delivery/${{ matrix.slug }}/${{ matrix.slug }}_FULL_PACKAGE.zip
            ${{ env.JOB_ROOT }}/delivery/${{ matrix.slug }}/VIDEO_TECHNICAL.tsv
            ${{ env.JOB_ROOT }}/delivery/${{ matrix.slug }}/RENDER_INFO.txt
            ${{ env.JOB_ROOT }}/delivery/${{ matrix.slug }}/SHA256SUMS.txt
            ${{ env.JOB_ROOT }}/delivery/${{ matrix.slug }}/audit_frames/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Build complete 8-video package
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Download all verified operation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: inventor-*
          path: master
          merge-multiple: false

      - name: Add shared sources and create master ZIP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip >/dev/null
          mkdir -p master/_project_sources
          cp "$JOB_ROOT/README.md" master/_project_sources/README.md
          cp "$JOB_ROOT/library/inventor_pro_ui.py" master/_project_sources/inventor_pro_ui.py
          cp "$JOB_ROOT"/scenes/*.py master/_project_sources/
          find master -type f -name '*_PQH.mp4' | sort > master/VIDEOS_INCLUDED.txt
          find master/_project_sources -type f -name '*.py' | sort > master/SOURCES_INCLUDED.txt
          printf 'Autodesk Inventor dedicated operations package\n8 independent ManimCE scenes and 8 verified PQH MP4 videos\nBranch: render-inventor-dedicated-20260826\n' > master/PACKAGE_INFO.txt
          zip -9 -r Inventor_Professional_Misc_Operations_8Videos_PQH_20260826.zip master >/dev/null
          sha256sum Inventor_Professional_Misc_Operations_8Videos_PQH_20260826.zip > Inventor_Professional_Misc_Operations_8Videos_PQH_20260826.zip.sha256

      - name: Upload final complete package
        uses: actions/upload-artifact@v4
        with:
          name: Inventor-Professional-Misc-Operations-8Videos-PQH-20260826-FINAL
          path: |
            Inventor_Professional_Misc_Operations_8Videos_PQH_20260826.zip
            Inventor_Professional_Misc_Operations_8Videos_PQH_20260826.zip.sha256
            master/VIDEOS_INCLUDED.txt
            master/SOURCES_INCLUDED.txt
            master/PACKAGE_INFO.txt
          if-no-files-found: error
          retention-days: 7
