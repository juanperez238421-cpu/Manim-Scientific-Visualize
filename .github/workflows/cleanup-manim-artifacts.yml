name: Cleanup ManimCE Actions Storage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-manim-artifacts.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete all existing Actions artifacts in parallel
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          ids_file="$(mktemp)"

          gh api --paginate "/repos/${repo}/actions/artifacts?per_page=100" --jq '.artifacts[].id' > "$ids_file"
          total="$(wc -l < "$ids_file" | tr -d ' ')"
          echo "Artifacts found: ${total}"

          if [ "$total" -gt 0 ]; then
            export repo GH_TOKEN
            cat "$ids_file" | xargs -r -n1 -P16 bash -c '
              id="$1"
              gh api --method DELETE "/repos/${repo}/actions/artifacts/${id}" >/dev/null 2>&1 || true
            ' _
          fi

          remaining="$(gh api --paginate "/repos/${repo}/actions/artifacts?per_page=100" --jq '.artifacts[].id' | wc -l | tr -d ' ')"
          deleted=$(( total - remaining ))
          echo "Deleted artifacts: ${deleted}"
          echo "Remaining artifacts: ${remaining}"
          echo "deleted_artifacts=${deleted}" >> "$GITHUB_STEP_SUMMARY"
          echo "remaining_artifacts=${remaining}" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete Actions caches
        shell: bash
        run: |
          set -euo pipefail
          gh cache delete --all --repo "$GITHUB_REPOSITORY" || true
          echo "Actions caches cleanup requested." >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup policy note
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          ## ManimCE storage policy
          - Repository source/protocol files are untouched.
          - GitHub Pages repositories are untouched.
          - Actions artifacts/caches in this ManimCE repository are disposable build outputs and are removed.
          - This housekeeping job runs daily so Actions storage does not accumulate again.
          EOF
