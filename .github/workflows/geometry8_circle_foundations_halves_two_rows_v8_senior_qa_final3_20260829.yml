name: Geometry 8 Circle V8 SENIOR QA FINAL3 PQH 20260829

on:
  push:
    branches: [render/geometry8-circle-foundations-halves-two-rows-v8-senior-qa-20260829]
    paths:
      - 'render_jobs/geometry8_circle_pedagogical_qa_20260819/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA_FINAL3.py'
      - '.github/workflows/geometry8_circle_foundations_halves_two_rows_v8_senior_qa_final3_20260829.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-v8-senior-qa-final3:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Compile full source stack and lifecycle QA contract
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_circle_pedagogical_qa_20260819
          SRC="$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA_FINAL3.py"
          python -Werror -m py_compile \
            "$JOB/Geometry8_Circle_Area_Decomposition_STEP_BY_STEP_20260827.py" \
            "$JOB/Geometry8_Circle_Area_Decomposition_STEP_BY_STEP_20260827_V2.py" \
            "$JOB/Geometry8_Circle_Area_Decomposition_TWO_ROWS_20260827_V3.py" \
            "$JOB/Geometry8_Circle_Area_Decomposition_TWO_ROWS_20260827_V4_POLISHED.py" \
            "$JOB/Geometry8_Circle_Area_Decomposition_TWO_ROWS_20260827_V5_FINAL_QA.py" \
            "$JOB/Geometry8_Circle_Area_TWO_ROWS_ENGLISH_20260827_V6_MASTER.py" \
            "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V7_MASTER.py" \
            "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V7_FINAL_QA.py" \
            "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA.py" \
            "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA_FINAL.py" \
            "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA_FINAL2.py" \
            "$SRC"
          grep -Fq 'residuals = list(self.mobjects)' "$SRC"
          grep -Fq 'Step 01 lifecycle QA failed' "$SRC"
          mkdir -p out qa_out media qa_media

      - name: Literal PQL complete-timeline gate
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/geometry8_circle_pedagogical_qa_20260819/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA_FINAL3.py
          mkdir -p /tmp/manim-bin /tmp/manim-home qa_media qa_out
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=0.06
          manim -pql "$SRC" Geometry8CircleFoundationsHalvesTwoRows20260829V8SeniorQAFinal3 \
            --fps 15 --format=mp4 --media_dir qa_media --disable_caching \
            2>&1 | tee qa_out/CIRCLE_V8_SENIOR_QA_FINAL3_pql.log
          PQL="$(find qa_media -type f -name 'Geometry8CircleFoundationsHalvesTwoRows20260829V8SeniorQAFinal3.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" qa_out/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_V8_SENIOR_QA_FINAL3_20260829_pql.mp4
          python - "$PQL" <<'PY'
          import av, sys
          frames=0
          with av.open(sys.argv[1]) as c:
              for _ in c.decode(c.streams.video[0]): frames += 1
          print('PQL decoded frames:',frames)
          assert frames > 0
          PY

      - name: Literal PQH 1920x1080 final render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/geometry8_circle_pedagogical_qa_20260819/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA_FINAL3.py
          mkdir -p /tmp/manim-bin /tmp/manim-home out media
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=1.0
          manim -pqh "$SRC" Geometry8CircleFoundationsHalvesTwoRows20260829V8SeniorQAFinal3 \
            --fps 30 --format=mp4 --media_dir media --disable_caching \
            2>&1 | tee out/CIRCLE_V8_SENIOR_QA_FINAL3_pqh.log
          FINAL="$(find media -type f -name 'Geometry8CircleFoundationsHalvesTwoRows20260829V8SeniorQAFinal3.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_V8_SENIOR_QA_FINAL3_20260829_FINAL_pqh.mp4

      - name: Full H264 decode, format, duration and visible-edge QA
        shell: bash
        run: |
          set -euo pipefail
          F=out/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_V8_SENIOR_QA_FINAL3_20260829_FINAL_pqh.mp4
          python - "$F" <<'PY' | tee out/VIDEO_TECHNICAL_QA_V8_SENIOR_FINAL3.txt
          import av, os, sys, numpy as np
          p=sys.argv[1]; frames=0; edge_failures=[]
          with av.open(p) as c:
              s=c.streams.video[0]
              codec=s.codec_context.name
              width=s.codec_context.width
              height=s.codec_context.height
              fmt=s.codec_context.format.name if s.codec_context.format else ''
              fps=float(s.average_rate) if s.average_rate else 0.0
              duration=float(c.duration)/float(av.time_base) if c.duration else 0.0
              for frame in c.decode(s):
                  frames += 1
                  if frames % 30 == 0:
                      arr=np.asarray(frame.to_image().convert('L'))
                      strips=(arr[:, :18], arr[:, -18:], arr[:10, :], arr[-10:, :])
                      if any(np.count_nonzero(x < 238) > 8 for x in strips):
                          edge_failures.append(frames)
          print(f'codec_name={codec}')
          print(f'width={width}')
          print(f'height={height}')
          print(f'pix_fmt={fmt}')
          print(f'fps={fps:.6f}')
          print(f'duration={duration:.6f}')
          print(f'frames_decoded={frames}')
          print(f'size={os.path.getsize(p)}')
          print(f'outer_edge_failures={edge_failures[:20]} count={len(edge_failures)}')
          assert codec == 'h264'
          assert width == 1920 and height == 1080
          assert abs(fps-30.0) < 0.01
          assert fmt == 'yuv420p'
          assert duration > 140
          assert frames > 0
          assert not edge_failures
          PY
          sha256sum "$F" | tee out/SHA256SUMS_V8_SENIOR_FINAL3.txt

      - name: Dense 72-frame final human-QA contact sheet
        shell: bash
        run: |
          set -euo pipefail
          F=out/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_V8_SENIOR_QA_FINAL3_20260829_FINAL_pqh.mp4
          mkdir -p out/frame_samples_v8_senior_final3
          python - "$F" <<'PY'
          import av, math, os, sys
          from PIL import Image, ImageDraw
          p=sys.argv[1]; saved=[]
          with av.open(p) as c:
              s=c.streams.video[0]
              duration=float(c.duration)/float(av.time_base)
              targets=[duration*i/73 for i in range(1,73)]
              ti=0
              for frame in c.decode(s):
                  if ti>=len(targets): break
                  t=float(frame.pts*frame.time_base) if frame.pts is not None else 0.0
                  if t>=targets[ti]:
                      fp=f'out/frame_samples_v8_senior_final3/frame_{ti+1:02d}_{targets[ti]:06.2f}.jpg'
                      frame.to_image().convert('RGB').save(fp,quality=93)
                      saved.append(fp); ti+=1
          cards=[]
          for fp in saved:
              im=Image.open(fp).convert('RGB'); im.thumbnail((480,270))
              card=Image.new('RGB',(500,300),'white')
              card.paste(im,((500-im.width)//2,8))
              ImageDraw.Draw(card).text((10,280),os.path.basename(fp),fill='black')
              cards.append(card)
          cols=4; rows=math.ceil(len(cards)/cols)
          sheet=Image.new('RGB',(cols*500,rows*300),'white')
          for i,im in enumerate(cards): sheet.paste(im,((i%cols)*500,(i//cols)*300))
          sheet.save('out/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_V8_SENIOR_QA_FINAL3_contact_sheet.jpg',quality=93)
          print('visual_qa_frames=',len(saved)); assert len(saved)>=68
          PY
          JOB=render_jobs/geometry8_circle_pedagogical_qa_20260819
          cp "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA.py" out/
          cp "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA_FINAL2.py" out/
          cp "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA_FINAL3.py" out/
          cp "$JOB/QA_GEOMETRY8_CIRCLE_V7_TO_V8_SENIOR_20260829.md" out/
          cp qa_out/CIRCLE_V8_SENIOR_QA_FINAL3_pql.log out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Geometry8-Circle-Foundations-HALVES-TWO-ROWS-V8-SENIOR-QA-FINAL3-20260829-PQH
          path: |
            out/
            qa_out/
          if-no-files-found: warn
          retention-days: 7
