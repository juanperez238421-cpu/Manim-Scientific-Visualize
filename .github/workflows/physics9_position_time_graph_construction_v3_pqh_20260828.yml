name: Physics 9 Position-Time Graph Construction V3 SENIOR QA FINAL PQH 20260828

on:
  push:
    branches:
      - render/physics9-position-time-graph-construction-v3-senior-qa-20260828
    paths:
      - 'render_jobs/physics9_position_time_graph_construction_v3_20260828/**'
      - '.github/workflows/physics9_position_time_graph_construction_v3_pqh_20260828.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render/physics9-position-time-graph-construction-v3-senior-qa-20260828

      - name: Validate exact source, QA report and lesson contract
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_position_time_graph_construction_v3_20260828
          SRC="$JOB/position_time_graph_construction_v3.py"
          QA="$JOB/SENIOR_QA_V2_TO_V3.md"
          STORY="$JOB/STORYBOARD.md"
          STYLE=render_jobs/physics9_position_time_velocity_workshop_20260824/jp_classroom_style.py
          test -s "$SRC"; test -s "$QA"; test -s "$STORY"; test -s "$STYLE"
          python -m py_compile "$SRC" "$STYLE"
          grep -q 'class Physics9PositionTimeGraphConstructionV3' "$SRC"
          grep -q 'def axis_numbers' "$SRC"
          grep -q 'def slope_triangle' "$SRC"
          grep -q 'CONNECT ONLY AFTER PLOTTING' "$SRC"
          grep -q 'v=\\text{slope}=\\frac{\\Delta x}{\\Delta t}' "$SRC"
          if grep -q 'ReplacementTransform(state' "$SRC"; then
            echo 'FAIL: semantic state-card glyph morph returned.'; exit 1
          fi
          if grep -q 'VGroup(eqs, box, meaning_card).arrange' "$SRC"; then
            echo 'FAIL: detached answer rectangle regression returned.'; exit 1
          fi
          mkdir -p qa_preview
          sha256sum "$SRC" "$QA" "$STORY" "$STYLE" > qa_preview/SOURCE_SHA256SUMS.txt

      - name: Prepare pinned ManimCE environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip imagemagick
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL runtime gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_position_time_graph_construction_v3_20260828
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.06 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql position_time_graph_construction_v3.py Physics9PositionTimeGraphConstructionV3 \
                --format=mp4 --media_dir=/manim/media_pql --disable_caching
            ' 2>&1 | tee qa_preview/render_pql.log
          PQL="$(find media_pql -type f -name 'Physics9PositionTimeGraphConstructionV3.mp4' -print -quit)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_position_time_graph_construction_v3_20260828
          rm -rf media_pqh final_out package
          mkdir -p final_out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh position_time_graph_construction_v3.py Physics9PositionTimeGraphConstructionV3 \
                --format=mp4 --media_dir=/manim/media_pqh --disable_caching
            ' 2>&1 | tee final_out/render_pqh.log
          FINAL="$(find media_pqh -type f -name 'Physics9PositionTimeGraphConstructionV3.mp4' -print -quit)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" final_out/Physics9_Position_Time_Graph_Construction_V3_SENIOR_QA_FINAL_pqh.mp4

      - name: Strict technical QA and full decode
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Position_Time_Graph_Construction_V3_SENIOR_QA_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tframes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$FRAMES" > final_out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920; test "$H" = 1080; test "$FPS" = 30/1; test "$CODEC" = h264; test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> final_out/full_decode.log
          test ! -s final_out/full_decode.log
          sha256sum "$F" > final_out/SHA256SUMS.txt

      - name: Every-frame blank, border and frame-density scan
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Position_Time_Graph_Construction_V3_SENIOR_QA_FINAL_pqh.mp4
          ffmpeg -nostdin -v error -i "$F" -vf scale=320:180 -pix_fmt gray -f rawvideo final_out/all_frames_gray.raw
          python - <<'PY'
          from pathlib import Path
          import csv
          W,H=320,180; B=W*H
          raw=Path('final_out/all_frames_gray.raw').read_bytes(); assert len(raw)%B==0
          n=len(raw)//B
          blank=sparse=border_heavy=0
          border_idx=[y*W+x for y in range(H) for x in range(W) if x<5 or x>=W-5 or y<5 or y>=H-5]
          rows=[]
          for i in range(n):
              fr=raw[i*B:(i+1)*B]
              dark_n=sum(p<245 for p in fr); frac=dark_n/B
              if dark_n==0: blank+=1
              if frac<0.004: sparse+=1
              border=sum(fr[j]<235 for j in border_idx)
              border_frac=border/max(dark_n,1)
              if border_frac>0.20 and dark_n>200: border_heavy+=1
              rows.append((i,frac,border_frac))
          with open('final_out/FRAME_BY_FRAME_SCAN.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['frame','dark_fraction','border_dark_fraction']); w.writerows(rows)
          Path('final_out/FRAME_SCAN_SUMMARY.txt').write_text(
              f'frames_scanned={n}\nblank_frames={blank}\nvery_sparse_frames={sparse}\nborder_heavy_frames={border_heavy}\n')
          assert blank < n*0.08
          assert sparse < n*0.12
          assert border_heavy < n*0.02
          PY
          rm final_out/all_frames_gray.raw

      - name: Dense 96-frame senior visual audit and contact sheet
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Position_Time_Graph_Construction_V3_SENIOR_QA_FINAL_pqh.mp4
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          mkdir -p final_out/audit_frames
          for INDEX in $(seq -w 0 95); do
            T="$(python -c "print(float('$DUR')*(int('$INDEX')+0.5)/96.0)")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "final_out/audit_frames/frame_${INDEX}.png"
          done
          montage final_out/audit_frames/*.png \
            -thumbnail 384x216 -tile 6x16 -geometry +8+14 -background white -quality 90 final_out/CONTACT_SHEET_96.jpg
          test -s final_out/CONTACT_SHEET_96.jpg

      - name: Build reproducible package and publish delivery
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_position_time_graph_construction_v3_20260828
          ROOT=package/Physics9_Position_Time_Graph_Construction_V3_SENIOR_QA_FINAL_PQH_PROJECT
          mkdir -p "$ROOT/src" "$ROOT/storyboard" "$ROOT/qa/audit_frames" "$ROOT/protocol" "$ROOT/workflow"
          cp "$JOB/position_time_graph_construction_v3.py" "$ROOT/src/"
          cp "$JOB/STORYBOARD.md" "$ROOT/storyboard/"
          cp "$JOB/SENIOR_QA_V2_TO_V3.md" "$ROOT/qa/"
          cp render_jobs/physics9_position_time_velocity_workshop_20260824/jp_classroom_style.py "$ROOT/src/"
          cp final_out/Physics9_Position_Time_Graph_Construction_V3_SENIOR_QA_FINAL_pqh.mp4 "$ROOT/render.mp4"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/SHA256SUMS.txt final_out/full_decode.log final_out/render_pqh.log \
             final_out/FRAME_SCAN_SUMMARY.txt final_out/FRAME_BY_FRAME_SCAN.csv final_out/CONTACT_SHEET_96.jpg "$ROOT/qa/"
          cp final_out/audit_frames/*.png "$ROOT/qa/audit_frames/"
          cp protocols/PROTOCOL_MANIMCE_PQH_PROJECT_PACKAGE_STANDARD.md "$ROOT/protocol/" || true
          cp .github/workflows/physics9_position_time_graph_construction_v3_pqh_20260828.yml "$ROOT/workflow/"
          (cd package && zip -qr Physics9_Position_Time_Graph_Construction_V3_SENIOR_QA_FINAL_PQH_PROJECT.zip Physics9_Position_Time_Graph_Construction_V3_SENIOR_QA_FINAL_PQH_PROJECT)
          sha256sum package/Physics9_Position_Time_Graph_Construction_V3_SENIOR_QA_FINAL_PQH_PROJECT.zip > package/PACKAGE_SHA256.txt

          DEST=deliveries/physics9_position_time_graph_construction_v3_20260828
          mkdir -p "$DEST"
          cp final_out/Physics9_Position_Time_Graph_Construction_V3_SENIOR_QA_FINAL_pqh.mp4 "$DEST/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/SHA256SUMS.txt final_out/FRAME_SCAN_SUMMARY.txt final_out/CONTACT_SHEET_96.jpg "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "render: publish Physics 9 position-time V3 senior QA"
            git push origin HEAD:render/physics9-position-time-graph-construction-v3-senior-qa-20260828
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Physics9-Position-Time-Graph-Construction-V3-SENIOR-QA-FINAL-PQH
          path: |
            package/Physics9_Position_Time_Graph_Construction_V3_SENIOR_QA_FINAL_PQH_PROJECT.zip
            package/PACKAGE_SHA256.txt
            final_out/Physics9_Position_Time_Graph_Construction_V3_SENIOR_QA_FINAL_pqh.mp4
            final_out/VIDEO_TECHNICAL.tsv
            final_out/SHA256SUMS.txt
            final_out/FRAME_SCAN_SUMMARY.txt
            final_out/FRAME_BY_FRAME_SCAN.csv
            final_out/CONTACT_SHEET_96.jpg
            final_out/audit_frames/
          if-no-files-found: error
          retention-days: 14
