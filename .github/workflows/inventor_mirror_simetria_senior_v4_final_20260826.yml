name: Inventor Mirror Simetria Senior V4 FINAL Visual QA PQH 20260826

on:
  push:
    branches: [render-inventor-symmetry-senior-v4-final-20260826]
  workflow_dispatch:

permissions:
  contents: write

env:
  JOB_ROOT: render_jobs/inventor_dedicated_20260826
  MANIM_IMAGE: manimcommunity/manim:v0.20.1

jobs:
  render_mirror_v4_final:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: inventor-mirror-simetria-senior-v4-final-20260826
      cancel-in-progress: true

    steps:
      - name: Checkout exact V4 final branch
        uses: actions/checkout@v4
        with:
          ref: render-inventor-symmetry-senior-v4-final-20260826
          fetch-depth: 0

      - name: Static Python and V4 regression QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            "$JOB_ROOT/library/inventor_pro_ui.py" \
            "$JOB_ROOT/scenes/03_mirror_simetria_senior_v3.py" \
            "$JOB_ROOT/scenes/03_mirror_simetria_senior_v4_final.py"
          grep -q 'class InventorMirrorSimetriaSeniorV4Final' "$JOB_ROOT/scenes/03_mirror_simetria_senior_v4_final.py"
          grep -q 'selection highlight must occupy exactly Boss1' "$JOB_ROOT/scenes/03_mirror_simetria_senior_v4_final.py"
          grep -q 'theta=-90' "$JOB_ROOT/scenes/03_mirror_simetria_senior_v4_final.py" || grep -q 'theta=-90 \* DEGREES' "$JOB_ROOT/scenes/03_mirror_simetria_senior_v4_final.py"
          grep -q 'crecen simultáneamente de Ø16 mm a Ø22 mm' "$JOB_ROOT/scenes/03_mirror_simetria_senior_v4_final.py"
          ! grep -q 'puede cambiar con edits' "$JOB_ROOT/scenes/03_mirror_simetria_senior_v4_final.py"

      - name: Prepare ManimCE renderer and QA tools
        shell: bash
        run: |
          set -euo pipefail
          command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          command -v zip >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zip >/dev/null)
          docker pull "$MANIM_IMAGE" >/dev/null

      - name: Literal PQL smoke render V4
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          rm -rf media_mirror_pql_v4 media_mirror_pqh_v4 delivery_mirror_v4_final
          mkdir -p delivery_mirror_v4_final/audit_frames
          chmod -R a+rwX .
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e PYTHONPATH="/manim/$JOB_ROOT" \
            -v "$GITHUB_WORKSPACE:/manim" -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql scenes/03_mirror_simetria_senior_v4_final.py InventorMirrorSimetriaSeniorV4Final \
                --fps 15 --format=mp4 --media_dir media_mirror_pql_v4 --disable_caching
            " 2>&1 | tee delivery_mirror_v4_final/render_pql.log
          PQL="$(find media_mirror_pql_v4 -type f -name 'InventorMirrorSimetriaSeniorV4Final.mp4' ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render V4
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e PYTHONPATH="/manim/$JOB_ROOT" \
            -v "$GITHUB_WORKSPACE:/manim" -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh scenes/03_mirror_simetria_senior_v4_final.py InventorMirrorSimetriaSeniorV4Final \
                --fps 30 --format=mp4 --media_dir media_mirror_pqh_v4 --disable_caching
            " 2>&1 | tee delivery_mirror_v4_final/render_pqh.log
          F="$(find media_mirror_pqh_v4 -type f -name 'InventorMirrorSimetriaSeniorV4Final.mp4' ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$F" && test -s "$F"
          cp "$F" delivery_mirror_v4_final/Inventor_Mirror_Simetria_Senior_V4_FINAL_PQH.mp4
          cp scenes/03_mirror_simetria_senior_v4_final.py delivery_mirror_v4_final/03_mirror_simetria_senior_v4_final.py
          cp scenes/03_mirror_simetria_senior_v3.py delivery_mirror_v4_final/03_mirror_simetria_senior_v3_audited_core.py
          cp library/inventor_pro_ui.py delivery_mirror_v4_final/inventor_pro_ui.py
          cp qa/MIRROR_V2_TO_V3_QA_REVIEW.md delivery_mirror_v4_final/MIRROR_V2_TO_V3_QA_REVIEW.md

      - name: Technical QA and second dense frame audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT"
          F=delivery_mirror_v4_final/Inventor_Mirror_Simetria_Senior_V4_FINAL_PQH.mp4
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F" | tr -d '[:space:]')
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F" | tr -d '[:space:]')
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F" | tr -d '[:space:]')
          CODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F" | tr -d '[:space:]')
          PIX=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F" | tr -d '[:space:]')
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F" | tr -d '[:space:]')
          SIZE=$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F" | tr -d '[:space:]')
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          python - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert 75 <= d <= 220, f"Unexpected V4 lesson duration: {d}"
          PY
          ffmpeg -nostdin -v error -i "$F" -f null - 2> delivery_mirror_v4_final/full_decode.log
          test ! -s delivery_mirror_v4_final/full_decode.log
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of json "$F" > delivery_mirror_v4_final/VIDEO_TECHNICAL.json
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > delivery_mirror_v4_final/VIDEO_TECHNICAL.tsv

          for P in 0.02 0.06 0.10 0.14 0.18 0.22 0.26 0.30 0.34 0.38 0.42 0.46 0.50 0.54 0.58 0.62 0.66 0.70 0.74 0.78 0.82 0.86 0.90 0.94 0.98; do
            T=$(python -c "print(float('$DUR')*float('$P'))")
            TAG=$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "delivery_mirror_v4_final/audit_frames/frame_${TAG}.png"
          done
          ffmpeg -y -loglevel error -pattern_type glob -i 'delivery_mirror_v4_final/audit_frames/*.png' -vf 'scale=384:-1,tile=5x5' -frames:v 1 delivery_mirror_v4_final/QA_CONTACT_SHEET.jpg

          sha256sum "$F" delivery_mirror_v4_final/03_mirror_simetria_senior_v4_final.py > delivery_mirror_v4_final/SHA256SUMS.txt
          cat > delivery_mirror_v4_final/QA_AUTOMATED_REPORT.txt <<EOF
          MIRROR / SIMETRÍA SENIOR V4 FINAL — AUTOMATED QA PASS
          Literal final command: manim -pqh
          ManimCE: 0.20.1
          Resolution: $W x $H
          FPS: $FPS
          Codec: $CODEC / $PIX
          Duration: $DUR s
          Full FFmpeg decode: PASS
          Dense audit frames: 25
          V4 visual corrections: Boss1 selection halo aligned exactly with source feature; parametric edit camera exposes both symmetric bosses; validation wording normalized to Spanish.
          Inherited approved V3 flow: concept -> Sketch1 -> Extrusion1 -> Sketch2 -> Boss1 -> Mirror Features -> YZ plane -> preview -> 28/28 verification -> reference validation -> OK Mirror1 -> Ø16/Ø22 synchronized edit -> final orbit.
          EOF

          zip -9 -j delivery_mirror_v4_final/Inventor_Mirror_Simetria_Senior_V4_FINAL_FULL_PACKAGE.zip \
            delivery_mirror_v4_final/Inventor_Mirror_Simetria_Senior_V4_FINAL_PQH.mp4 \
            delivery_mirror_v4_final/03_mirror_simetria_senior_v4_final.py \
            delivery_mirror_v4_final/03_mirror_simetria_senior_v3_audited_core.py \
            delivery_mirror_v4_final/inventor_pro_ui.py \
            delivery_mirror_v4_final/MIRROR_V2_TO_V3_QA_REVIEW.md \
            delivery_mirror_v4_final/VIDEO_TECHNICAL.json delivery_mirror_v4_final/VIDEO_TECHNICAL.tsv \
            delivery_mirror_v4_final/QA_AUTOMATED_REPORT.txt delivery_mirror_v4_final/QA_CONTACT_SHEET.jpg \
            delivery_mirror_v4_final/SHA256SUMS.txt delivery_mirror_v4_final/render_pql.log \
            delivery_mirror_v4_final/render_pqh.log delivery_mirror_v4_final/full_decode.log

      - name: Upload final V4 package
        uses: actions/upload-artifact@v4
        with:
          name: inventor-mirror-simetria-senior-v4-final-visual-qa-pqh
          path: ${{ env.JOB_ROOT }}/delivery_mirror_v4_final/
          if-no-files-found: error
          retention-days: 7

      - name: Persist verified V4 final delivery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$JOB_ROOT/delivery_mirror_v4_final/Inventor_Mirror_Simetria_Senior_V4_FINAL_PQH.mp4" \
                  "$JOB_ROOT/delivery_mirror_v4_final/03_mirror_simetria_senior_v4_final.py" \
                  "$JOB_ROOT/delivery_mirror_v4_final/VIDEO_TECHNICAL.json" \
                  "$JOB_ROOT/delivery_mirror_v4_final/VIDEO_TECHNICAL.tsv" \
                  "$JOB_ROOT/delivery_mirror_v4_final/QA_AUTOMATED_REPORT.txt" \
                  "$JOB_ROOT/delivery_mirror_v4_final/QA_CONTACT_SHEET.jpg" \
                  "$JOB_ROOT/delivery_mirror_v4_final/SHA256SUMS.txt"
          git commit -m 'Persist verified Inventor Mirror Simetria Senior V4 final PQH' || true
          git push origin HEAD:render-inventor-symmetry-senior-v4-final-20260826
