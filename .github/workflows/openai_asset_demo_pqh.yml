name: OpenAI Asset ManimCE PQH Demo

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/openai-asset-manim-pqh-demo-20260815'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify exact project
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/openai_asset_demo_20260815
          mkdir -p assets/images delivery qa_frames

          cp "$JOB/main_v2.py" main.py
          base64 -d "$JOB/style_exact.py.gz.b64" | gzip -dc > jp_classroom_style.py
          cat "$JOB"/ap_0[0-8] | base64 -d > assets/images/openai_inclined_plane_block_760_q55.webp

          echo '6407358fd40d379167d816f2fb8b0d360cbb1f937eecc81bcfc8ac992542c759  main.py' | sha256sum -c -
          echo '3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d  jp_classroom_style.py' | sha256sum -c -
          echo 'ee660f75cc495e6c11d8e426c6d971aedfab774a258ca99901f13333f676f43d  assets/images/openai_inclined_plane_block_760_q55.webp' | sha256sum -c -

          python -m py_compile main.py jp_classroom_style.py
          sha256sum main.py jp_classroom_style.py assets/images/openai_inclined_plane_block_760_q55.webp | tee SOURCE_SHA256.txt

      - name: Verification tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -1

      - name: Pull pinned ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Preview validation literal -pql
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.12 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql main.py OpenAIAssetInclinedPlaneLesson --format=mp4 --disable_caching
            ' 2>&1 | tee preview_pql.log

          PREVIEW="$(find media -type f -name 'OpenAIAssetInclinedPlaneLesson.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          ffmpeg -nostdin -v error -i "$PREVIEW" -f null -

      - name: Final render literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh main.py OpenAIAssetInclinedPlaneLesson --format=mp4 --disable_caching
            ' 2>&1 | tee render_pqh.log

      - name: Verify MP4 and stage audited delivery
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find media -type f -name 'OpenAIAssetInclinedPlaneLesson.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"

          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$VIDEO")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$VIDEO")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
          SIZE="$(stat -c '%s' "$VIDEO")"

          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize_bytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" | tee VIDEO_TECHNICAL.tsv

          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          awk -v d="$DUR" 'BEGIN { exit !(d > 0) }'
          ffmpeg -nostdin -v error -i "$VIDEO" -f null - 2> decode.log

          cp "$VIDEO" delivery/OpenAIAssetInclinedPlaneLesson_pqh.mp4
          cp main.py jp_classroom_style.py SOURCE_SHA256.txt VIDEO_TECHNICAL.tsv preview_pql.log render_pqh.log decode.log delivery/
          cp assets/images/openai_inclined_plane_block_760_q55.webp delivery/

          cat > delivery/RENDER_INFO.txt <<EOF
          Scene: OpenAIAssetInclinedPlaneLesson
          Source: main.py
          Style: exact uploaded jp_classroom_style_EXACT_RENDER_USED(1).py
          ManimCE: 0.20.1
          Preview: manim -pql main.py OpenAIAssetInclinedPlaneLesson --format=mp4 --disable_caching
          Final: manim -pqh main.py OpenAIAssetInclinedPlaneLesson --format=mp4 --disable_caching
          Resolution: ${W}x${H}
          FPS: ${FPS}
          Codec: ${CODEC}
          Pixel format: ${PIX}
          Duration: ${DUR}
          Size bytes: ${SIZE}
          EOF

          python - <<'PY'
          import subprocess
          from pathlib import Path
          f = Path('delivery/OpenAIAssetInclinedPlaneLesson_pqh.mp4')
          dur = float(subprocess.check_output([
              'ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(f)
          ], text=True).strip())
          for i, frac in enumerate((0.05, 0.25, 0.50, 0.75, 0.95), 1):
              subprocess.run([
                  'ffmpeg','-y','-v','error','-ss',f'{dur*frac:.3f}','-i',str(f),
                  '-frames:v','1',f'qa_frames/qa_{i:02d}.png'
              ], check=True)
          PY
          cp qa_frames/*.png delivery/
          sha256sum delivery/OpenAIAssetInclinedPlaneLesson_pqh.mp4 > delivery/VIDEO_SHA256.txt
          find delivery -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > delivery/SHA256SUMS.txt

      - name: Upload verified delivery
        uses: actions/upload-artifact@v4
        with:
          name: OpenAIAssetInclinedPlaneLesson-PQH
          path: delivery/
          if-no-files-found: error
          retention-days: 7
