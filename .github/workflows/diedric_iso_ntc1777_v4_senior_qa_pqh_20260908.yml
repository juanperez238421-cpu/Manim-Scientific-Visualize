name: Diedric ISO NTC1777 V4 Senior QA PQH 20260908

on:
  push:
    branches:
      - manim/diedric-iso-ntc1777-v4-senior-qa-20260908
    paths:
      - .github/workflows/diedric_iso_ntc1777_v4_senior_qa_pqh_20260908.yml
      - render_jobs/technical_drawing_diedric_iso_v3_20260908/diedric_iso_ntc1777_v3.py
      - render_jobs/technical_drawing_diedric_iso_v3_20260908/diedric_iso_ntc1777_v4.py

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout V4 branch
        uses: actions/checkout@v4
        with:
          ref: manim/diedric-iso-ntc1777-v4-senior-qa-20260908
          fetch-depth: 0

      - name: Validate V4 source pair
        shell: bash
        run: |
          set -euo pipefail
          BASE=render_jobs/technical_drawing_diedric_iso_v3_20260908/diedric_iso_ntc1777_v3.py
          SRC=render_jobs/technical_drawing_diedric_iso_v3_20260908/diedric_iso_ntc1777_v4.py
          python -m py_compile "$BASE" "$SRC"
          grep -q 'class DiedricISOProjectionV4Senior' "$SRC"
          grep -q 'def mechanical_part' "$SRC"
          grep -q 'def orthographic_projection' "$SRC"
          grep -q 'def first_angle' "$SRC"
          grep -q 'def third_angle' "$SRC"
          grep -q 'def challenge' "$SRC"
          grep -q 'def closing' "$SRC"
          ! grep -Eq '[A-Za-z]:\\|/Users/|/home/[^/]+/' "$SRC"

      - name: Install render and QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip zip
          python -m pip install --quiet pillow
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL QA render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v3_20260908/diedric_iso_ntc1777_v4.py
          SCENE=DiedricISOProjectionV4Senior
          rm -rf media_pql qa_pql
          mkdir -p qa_pql
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.05 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pql $SRC $SCENE --fps 15 --format=mp4 --media_dir media_pql --disable_caching" \
            2>&1 | tee qa_pql/pql.log
          PQL="$(find media_pql -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$PQL"
          test -s "$PQL"
          ffmpeg -nostdin -v error -i "$PQL" -f null - 2> qa_pql/pql_decode.log

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v3_20260908/diedric_iso_ntc1777_v4.py
          SCENE=DiedricISOProjectionV4Senior
          OUT=deliverables/technical_drawing_diedric_iso_v4_20260908
          rm -rf media "$OUT"
          mkdir -p "$OUT"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pqh $SRC $SCENE --fps 30 --format=mp4 --media_dir media --disable_caching" \
            2>&1 | tee "$OUT/pqh.log"
          FINAL="$(find media -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$FINAL"
          test -s "$FINAL"
          cp "$FINAL" "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V4_SENIOR_QA_FINAL_pqh.mp4"

      - name: Technical QA and distributed frame sampling
        shell: bash
        run: |
          set -euo pipefail
          OUT=deliverables/technical_drawing_diedric_iso_v4_20260908
          F="$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V4_SENIOR_QA_FINAL_pqh.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          awk -v d="$DUR" 'BEGIN { if (d < 175 || d > 330) exit 1; }'
          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/decode.log"

          mkdir -p "$OUT/qa_frames"
          for FRAC in 0.02 0.06 0.10 0.14 0.18 0.22 0.26 0.30 0.34 0.38 0.42 0.46 0.50 0.54 0.58 0.62 0.66 0.70 0.74 0.78 0.82 0.86 0.90 0.94 0.98; do
            T="$(awk -v d="$DUR" -v f="$FRAC" 'BEGIN{printf "%.2f",d*f}')"
            TAG="$(printf '%s' "$FRAC" | tr -d '.')"
            ffmpeg -y -ss "$T" -i "$F" -frames:v 1 "$OUT/qa_frames/frame_${TAG}.png" >/dev/null 2>&1
          done

          # Extra targeted frames around the V3 problem zones: orthographic
          # transfer, dihedral final, first-angle final, third-angle final,
          # challenge, and closing.
          for SEC in 39 73 126 145 197 213 217; do
            ffmpeg -y -ss "$SEC" -i "$F" -frames:v 1 "$OUT/qa_frames/target_${SEC}s.png" >/dev/null 2>&1
          done

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root=Path('deliverables/technical_drawing_diedric_iso_v4_20260908')
          distributed=sorted((root/'qa_frames').glob('frame_*.png'))
          all_frames=sorted((root/'qa_frames').glob('*.png'))
          if len(distributed) != 25:
              raise SystemExit(f'Expected 25 distributed QA frames, found {len(distributed)}')

          rows=[]
          populated=0
          for p in distributed:
              im=Image.open(p).convert('RGB').resize((320,180))
              pix=list(im.getdata())
              changed=sum(1 for r,g,b in pix if abs(r-247)+abs(g-249)+abs(b-252) > 38)
              ratio=changed/len(pix)
              rows.append((p.name,ratio))
              populated += ratio > 0.020
          (root/'VISUAL_DENSITY_QA.tsv').write_text(
              'frame\tnonbackground_ratio\n'+'\n'.join(f'{n}\t{r:.6f}' for n,r in rows)+'\n',
              encoding='utf-8'
          )
          print('Visually populated distributed samples:', populated, '/', len(distributed))
          if populated < 23:
              raise SystemExit('Too many nearly blank distributed frames')

          thumbs=[]
          for p in all_frames:
              im=Image.open(p).convert('RGB')
              im.thumbnail((384,216))
              card=Image.new('RGB',(400,246),'white')
              card.paste(im,((400-im.width)//2,8))
              ImageDraw.Draw(card).text((12,224),p.stem,fill=(35,45,58))
              thumbs.append(card)
          cols=4
          rows_n=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(400*cols,246*rows_n),'white')
          for i,im in enumerate(thumbs):
              sheet.paste(im,((i%cols)*400,(i//cols)*246))
          sheet.save(root/'qa_contact_sheet.jpg',quality=91)
          PY

          sha256sum "$F" > "$OUT/SHA256SUMS.txt"
          cp render_jobs/technical_drawing_diedric_iso_v3_20260908/diedric_iso_ntc1777_v4.py "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V4_source.py"
          cp render_jobs/technical_drawing_diedric_iso_v3_20260908/diedric_iso_ntc1777_v3.py "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V3_base.py"
          cat > "$OUT/RENDER_INFO.txt" <<'EOF'
          V4 Senior QA correction over the V3 engineering redesign.
          Manual V3 frame inspection found and V4 corrects: translucent/muddy pseudo-3D shadow geometry, orthographic projection-plane label collision, dihedral ground-line label collision, first-angle panel/text/rule overlap, third-angle plan/header collision, challenge prompt overlap, and final closing-title clipping.
          V4 keeps the strong V3 sections: mechanical-bracket visual narrative, projection rays, dihedral-plane transfer, six-view overview, direct first/third-angle comparison, projection symbols, Colombia NTC context, and timed challenge.
          Terminology: Primer diedro / First-angle / ISO E; Tercer diedro / Third-angle / ISO A.
          Colombia wording: NTC 1777:2001 is a technical standard, not legislation by itself; the lesson presents both first- and third-angle projection methods.
          ManimCE: 0.20.1
          Pipeline: literal -pql QA -> literal -pqh final
          Output: 1920x1080, 30 fps, H.264, yuv420p
          QA: source compile + PQL decode + PQH full decode + ffprobe gates + 25 distributed visual frames + 7 targeted manual-QA frames + contact sheet + density gate.
          EOF
          (cd "$OUT" && zip -9 -r TechnicalDrawing_Diedric_V4_SENIOR_FULL_TOTAL_PACKAGE.zip \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V4_SENIOR_QA_FINAL_pqh.mp4 \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V4_source.py \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V3_base.py \
            VIDEO_TECHNICAL.tsv VISUAL_DENSITY_QA.tsv SHA256SUMS.txt RENDER_INFO.txt decode.log pqh.log qa_contact_sheet.jpg qa_frames)
          test -s "$OUT/TechnicalDrawing_Diedric_V4_SENIOR_FULL_TOTAL_PACKAGE.zip"

      - name: Persist final V4 delivery to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/technical_drawing_diedric_iso_v4_20260908
          if ! git diff --cached --quiet; then
            git commit -m "render: persist diedric V4 senior QA PQH [skip ci]"
            git push origin HEAD:manim/diedric-iso-ntc1777-v4-senior-qa-20260908
          fi

      - name: Upload V4 delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIEDRIC-ISO-V4-SENIOR-QA-PQH
          path: deliverables/technical_drawing_diedric_iso_v4_20260908/
          if-no-files-found: error
          retention-days: 7
