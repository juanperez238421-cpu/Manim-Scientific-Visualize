name: Diedric ISO NTC1777 V8 Lower Large PQH 20260909

on:
  push:
    branches:
      - manim/diedric-iso-ntc1777-v8-lower-large-20260909
    paths:
      - .github/workflows/diedric_iso_ntc1777_v8_lower_large_pqh_20260909.yml
      - render_jobs/technical_drawing_diedric_iso_v8_20260909/diedric_iso_ntc1777_v8.py
      - render_jobs/technical_drawing_diedric_iso_v7_20260909/diedric_iso_ntc1777_v7.py
      - render_jobs/technical_drawing_diedric_iso_v6_20260909/diedric_iso_ntc1777_v6.py
      - render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5.py
      - render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5_final.py
      - Core/technical_drawing_tools.py

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout V8 branch
        uses: actions/checkout@v4
        with:
          ref: manim/diedric-iso-ntc1777-v8-lower-large-20260909
          fetch-depth: 0

      - name: Validate V8 source
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v8_20260909/diedric_iso_ntc1777_v8.py
          python -m py_compile "$SRC" \
            render_jobs/technical_drawing_diedric_iso_v7_20260909/diedric_iso_ntc1777_v7.py \
            render_jobs/technical_drawing_diedric_iso_v6_20260909/diedric_iso_ntc1777_v6.py \
            render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5.py \
            render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5_final.py \
            Core/technical_drawing_tools.py
          grep -q 'class DiedricISOProjectionV8LowerLarge' "$SRC"
          grep -q 'assert_disjoint' "$SRC"
          grep -q 'scale(0.90)' "$SRC"
          grep -q 'part.move_to' "$SRC"
          grep -q '4.35, 2.10' "$SRC"
          ! grep -Eq '[A-Za-z]:\\|/Users/|/home/[^/]+/' "$SRC"

      - name: Install render and QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome*.list || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip zip
          python -m pip install --quiet pillow
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL QA render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v8_20260909/diedric_iso_ntc1777_v8.py
          SCENE=DiedricISOProjectionV8LowerLarge
          rm -rf media_pql qa_pql
          mkdir -p qa_pql
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.04 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pql $SRC $SCENE --fps 15 --format=mp4 --media_dir media_pql --disable_caching" \
            2>&1 | tee qa_pql/pql.log
          PQL="$(find media_pql -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$PQL"
          test -s "$PQL"
          ffmpeg -nostdin -v error -i "$PQL" -f null - 2> qa_pql/pql_decode.log

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v8_20260909/diedric_iso_ntc1777_v8.py
          SCENE=DiedricISOProjectionV8LowerLarge
          OUT=deliverables/technical_drawing_diedric_iso_v8_20260909
          rm -rf media "$OUT"
          mkdir -p "$OUT"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pqh $SRC $SCENE --fps 30 --format=mp4 --media_dir media --disable_caching" \
            2>&1 | tee "$OUT/pqh.log"
          FINAL="$(find media -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$FINAL"
          test -s "$FINAL"
          cp "$FINAL" "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V8_LOWER_LARGE_FINAL_pqh.mp4"

      - name: Technical QA and 72-frame visual report
        shell: bash
        run: |
          set -euo pipefail
          OUT=deliverables/technical_drawing_diedric_iso_v8_20260909
          F="$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V8_LOWER_LARGE_FINAL_pqh.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          awk -v d="$DUR" 'BEGIN { if (d < 320 || d > 570) exit 1; }'
          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/decode.log"

          mkdir -p "$OUT/qa_frames"
          python - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('deliverables/technical_drawing_diedric_iso_v8_20260909')
          f=root/'TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V8_LOWER_LARGE_FINAL_pqh.mp4'
          dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(f)],text=True).strip())
          # 72 uniformly distributed inspection points, deliberately dense enough
          # to revisit observer views, ISO E/A, comparison and algorithm screens.
          for i in range(72):
              frac=0.012 + i*(0.976-0.012)/71
              t=dur*frac
              out=root/'qa_frames'/f'frame_{i:02d}_{t:07.2f}s.png'
              subprocess.run(['ffmpeg','-y','-ss',f'{t:.3f}','-i',str(f),'-frames:v','1',str(out)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=True)
          PY

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('deliverables/technical_drawing_diedric_iso_v8_20260909')
          frames=sorted((root/'qa_frames').glob('*.png'))
          if len(frames) != 72: raise SystemExit(f'Expected 72 QA frames, found {len(frames)}')
          rows=[]; thumbs=[]
          for p in frames:
              im=Image.open(p).convert('RGB')
              small=im.resize((320,180))
              pix=list(small.getdata())
              changed=sum(1 for r,g,b in pix if abs(r-246)+abs(g-248)+abs(b-251)>38)
              rows.append((p.name,changed/len(pix)))
              im.thumbnail((384,216))
              canvas=Image.new('RGB',(400,246),'white')
              canvas.paste(im,((400-im.width)//2,8))
              ImageDraw.Draw(canvas).text((12,224),p.stem,fill=(35,45,58))
              thumbs.append(canvas)
          (root/'VISUAL_DENSITY_QA.tsv').write_text('frame\tnonbackground_ratio\n'+'\n'.join(f'{n}\t{r:.6f}' for n,r in rows)+'\n',encoding='utf-8')
          cols=6; rows_n=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*400,rows_n*246),'white')
          for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*400,(i//cols)*246))
          sheet.save(root/'qa_contact_sheet.jpg',quality=92)
          PY

          sha256sum "$F" > "$OUT/SHA256SUMS.txt"
          cp render_jobs/technical_drawing_diedric_iso_v8_20260909/diedric_iso_ntc1777_v8.py "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V8_source.py"
          cp render_jobs/technical_drawing_diedric_iso_v7_20260909/diedric_iso_ntc1777_v7.py "$OUT/V7_base_source.py"
          cp render_jobs/technical_drawing_diedric_iso_v6_20260909/diedric_iso_ntc1777_v6.py "$OUT/V6_base_source.py"
          cp render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5.py "$OUT/V5_base_source.py"
          cp render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5_final.py "$OUT/V5_final_base_source.py"
          cp Core/technical_drawing_tools.py "$OUT/technical_drawing_tools.py"
          cat > "$OUT/RENDER_INFO.txt" <<'EOF'
          V8 Lower/Large — direct correction of the real V7 PQH render.
          Core condition: vertical clearance is achieved by explicit placement and safe cells, NOT by shrinking the principal educational geometry.
          3D corrections: opening scale restored to 0.90 and centre moved down; observer 3D scale restored from V7 0.74 to 0.90 with per-view world-space centering; projection construction shifted as one coherent unit; closing hero enlarged and lowered.
          2D corrections: enlarged six-view overview, ISO E/A projection cards, direct-comparison tiles, algorithm views and challenge views. Runtime bounding-box disjoint assertions guard critical 2D cells.
          ManimCE 0.20.1; 1920x1080; 30 fps; H.264; yuv420p.
          QA: compile, PQL, PQH, ffprobe gates, full decode, 72 distributed frame samples, contact sheet, SHA-256.
          EOF
          (cd "$OUT" && zip -9 -r TechnicalDrawing_Diedric_V8_LOWER_LARGE_FULL_PACKAGE.zip \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V8_LOWER_LARGE_FINAL_pqh.mp4 \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V8_source.py V7_base_source.py V6_base_source.py V5_base_source.py V5_final_base_source.py technical_drawing_tools.py \
            VIDEO_TECHNICAL.tsv VISUAL_DENSITY_QA.tsv SHA256SUMS.txt RENDER_INFO.txt decode.log pqh.log qa_contact_sheet.jpg qa_frames)
          test -s "$OUT/TechnicalDrawing_Diedric_V8_LOWER_LARGE_FULL_PACKAGE.zip"

      - name: Persist V8 delivery to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/technical_drawing_diedric_iso_v8_20260909
          if ! git diff --cached --quiet; then
            git commit -m "render: persist diedric V8 lower-large PQH [skip ci]"
            git push origin HEAD:manim/diedric-iso-ntc1777-v8-lower-large-20260909
          fi

      - name: Upload V8 delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIEDRIC-ISO-V8-LOWER-LARGE-PQH
          path: deliverables/technical_drawing_diedric_iso_v8_20260909/
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DIEDRIC-ISO-V8-DIAGNOSTICS
          path: |
            qa_pql/
            deliverables/technical_drawing_diedric_iso_v8_20260909/
          if-no-files-found: ignore
          retention-days: 3
