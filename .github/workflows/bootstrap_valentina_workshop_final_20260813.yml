name: Valentina Workshop FINAL 18 PQH

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/valentina-calculo-iii-workshop-pqh-20260813'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scene: [Q01,Q02,Q03,Q04,Q05,Q06,Q07,Q08,Q09,Q10,Q11,Q12,Q13,Q14,Q15,Q16,Q17,Q18]
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact source and validate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/valentina_workshop_20260813
          cat "$JOB"/v_*.b64 | base64 -d | gzip -dc > valentina_workshop.py
          cat "$JOB"/s_*.b64 | base64 -d | gzip -dc > jp_classroom_style.py
          python -m py_compile valentina_workshop.py jp_classroom_style.py
      - name: Install technical verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1
      - name: Render literal PQH at 1920x1080 30 fps
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          rm -rf media out
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh valentina_workshop.py ${{ matrix.scene }} --fps 30 --format=mp4 --disable_caching
            " 2>&1 | tee out/render_${{ matrix.scene }}_pqh.log
          FINAL="$(find media -type f -name '${{ matrix.scene }}.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Valentina_Taller1_Pregunta_${{ matrix.scene }}_pqh.mp4
      - name: Verify MP4 with ffprobe and full decode
        shell: bash
        run: |
          set -euo pipefail
          F=out/Valentina_Taller1_Pregunta_${{ matrix.scene }}_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          printf 'scene\twidth\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' '${{ matrix.scene }}' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > out/technical_${{ matrix.scene }}.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/decode_${{ matrix.scene }}.log
          sha256sum "$F" > out/sha256_${{ matrix.scene }}.txt
      - name: Upload verified question
        uses: actions/upload-artifact@v4
        with:
          name: Valentina-${{ matrix.scene }}-PQH
          path: out/
          if-no-files-found: error
          retention-days: 7

  package:
    if: always() && needs.render.result == 'success'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download all verified question artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Valentina-Q*-PQH
          path: collected
          merge-multiple: true
      - name: Recover exact sources and build package
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/valentina_workshop_20260813
          cat "$JOB"/v_*.b64 | base64 -d | gzip -dc > collected/valentina_workshop.py
          cat "$JOB"/s_*.b64 | base64 -d | gzip -dc > collected/jp_classroom_style.py
          COUNT="$(find collected -maxdepth 1 -name 'Valentina_Taller1_Pregunta_Q*_pqh.mp4' | wc -l)"
          test "$COUNT" = 18
          cat collected/technical_Q*.tsv > collected/VIDEO_TECHNICAL_ALL.tsv
          sha256sum collected/Valentina_Taller1_Pregunta_Q*_pqh.mp4 > collected/SHA256SUMS.txt
          sha256sum collected/valentina_workshop.py collected/jp_classroom_style.py > collected/SOURCE_SHA256.txt
          printf 'Runtime: ManimCE 0.20.1\nFinal command: literal -pqh --fps 30\nResolution: 1920x1080\nCodec: H.264\nPixel format: yuv420p\nQuestions: Q01-Q18\n' > collected/RENDER_INFO.txt
          python - <<'PY'
          from pathlib import Path
          vids=sorted(Path('collected').glob('Valentina_Taller1_Pregunta_Q*_pqh.mp4'))
          Path('collected/VIDEO_INDEX.txt').write_text('\n'.join(f'{i+1:02d}. {p.name}' for i,p in enumerate(vids))+'\n')
          PY
          cd collected
          zip -9 Valentina_CalculoIII_Taller1_18Videos_PQH_Package.zip \
            Valentina_Taller1_Pregunta_Q*_pqh.mp4 \
            valentina_workshop.py jp_classroom_style.py \
            SHA256SUMS.txt SOURCE_SHA256.txt VIDEO_TECHNICAL_ALL.tsv RENDER_INFO.txt VIDEO_INDEX.txt \
            render_Q*_pqh.log technical_Q*.tsv decode_Q*.log sha256_Q*.txt
      - name: Upload complete verified package
        uses: actions/upload-artifact@v4
        with:
          name: Valentina_CalculoIII_Taller1_18Videos_PQH_FINAL
          path: collected/Valentina_CalculoIII_Taller1_18Videos_PQH_Package.zip
          if-no-files-found: error
          retention-days: 7
