name: Solids Revolution Transform V3 PQH Render

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render/solids-revolution-transform-v3-20260811'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Recover and validate V3 source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          BRANCH=render/solids-revolution-transform-v3-20260811
          JOB=render_jobs/solids_revolution_transform_v3_20260811
          git fetch --depth=1 origin "$BRANCH"
          rm -rf /tmp/revolve_v3 && mkdir -p /tmp/revolve_v3
          for F in payload_00.pyfrag payload_01.pyfrag payload_02a.pyfrag payload_02b.pyfrag payload_03a.pyfrag payload_03b.pyfrag; do
            git show "FETCH_HEAD:$JOB/$F" > "/tmp/revolve_v3/$F"
          done
          cat /tmp/revolve_v3/payload_00.pyfrag /tmp/revolve_v3/payload_01.pyfrag /tmp/revolve_v3/payload_02a.pyfrag /tmp/revolve_v3/payload_02b.pyfrag /tmp/revolve_v3/payload_03a.pyfrag /tmp/revolve_v3/payload_03b.pyfrag > /tmp/revolve_v3/SolidsOfRevolution_InventorProfessional_TRANSFORM_V3.py
          git show "FETCH_HEAD:render_jobs/solids_revolution_inventor_senior_v2_20260811/jp_classroom_style.py" > /tmp/revolve_v3/jp_classroom_style.py
          test "$(wc -l < /tmp/revolve_v3/SolidsOfRevolution_InventorProfessional_TRANSFORM_V3.py)" -eq 833
          python -m py_compile /tmp/revolve_v3/SolidsOfRevolution_InventorProfessional_TRANSFORM_V3.py /tmp/revolve_v3/jp_classroom_style.py
          ! grep -nE '([A-Za-z]:\\|/Users/|/home/[^/]+/Desktop)' /tmp/revolve_v3/*.py
          sha256sum /tmp/revolve_v3/SolidsOfRevolution_InventorProfessional_TRANSFORM_V3.py > /tmp/source_sha_v3.txt

      - name: Pull ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Render required PQL then literal PQH
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/revolve_v3/SolidsOfRevolution_InventorProfessional_TRANSFORM_V3.py .
          cp /tmp/revolve_v3/jp_classroom_style.py .
          IMAGE=manimcommunity/manim:v0.20.1
          FILE=SolidsOfRevolution_InventorProfessional_TRANSFORM_V3.py
          SCENE=SolidsOfRevolutionInventorSeniorV3
          SLUG=SolidsOfRevolution_InventorProfessional_TRANSFORM_V3_TOTAL_FINAL
          rm -rf media delivery_revolve_v3 qa_revolve_v3
          mkdir -p delivery_revolve_v3 qa_revolve_v3

          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" -w /manim --entrypoint bash "$IMAGE" -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql SolidsOfRevolution_InventorProfessional_TRANSFORM_V3.py SolidsOfRevolutionInventorSeniorV3 --format=mp4 --disable_caching
            ' 2>&1 | tee delivery_revolve_v3/render_pql.log

          PQL="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" "delivery_revolve_v3/${SLUG}_pql.mp4"

          rm -rf media
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim --entrypoint bash "$IMAGE" -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh SolidsOfRevolution_InventorProfessional_TRANSFORM_V3.py SolidsOfRevolutionInventorSeniorV3 --format=mp4 --disable_caching
            ' 2>&1 | tee delivery_revolve_v3/render_pqh.log

          FINAL="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          OUT="delivery_revolve_v3/${SLUG}_pqh.mp4"
          cp "$FINAL" "$OUT"
          cp "$FILE" jp_classroom_style.py delivery_revolve_v3/
          cp /tmp/source_sha_v3.txt delivery_revolve_v3/SOURCE_SHA256.txt

          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 "$OUT" > delivery_revolve_v3/ffprobe.txt
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$OUT")" = 1920
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT")" = 1080
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$OUT")" = 30/1
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$OUT")" = h264
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$OUT")" = yuv420p
          ffmpeg -nostdin -v error -i "$OUT" -f null - 2> delivery_revolve_v3/full_decode.log

          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT")"
          RATE="$(python -c "d=float('$DUR'); print(max(0.001,48.0/max(d,0.001)))")"
          ffmpeg -nostdin -y -v error -i "$OUT" \
            -vf "fps=$RATE,scale=480:-1,tile=6x8:padding=8:margin=8" \
            -frames:v 1 qa_revolve_v3/contact_sheet.jpg
          for P in 4 10 16 22 28 34 40 46 52 58 64 70 76 82 88 94; do
            T="$(python -c "d=float('$DUR'); print(d*$P/100.0)")"
            ffmpeg -nostdin -y -v error -ss "$T" -i "$OUT" -frames:v 1 "qa_revolve_v3/frame_${P}pct.png"
          done

          sha256sum "$OUT" > delivery_revolve_v3/SHA256SUMS.txt
          printf 'ManimCE 0.20.1\nPreview: manim -pql %s %s --format=mp4 --disable_caching\nFinal: manim -pqh %s %s --format=mp4 --disable_caching\n' "$FILE" "$SCENE" "$FILE" "$SCENE" > delivery_revolve_v3/RENDER_INFO.txt

      - name: Upload V3 final delivery and QA
        uses: actions/upload-artifact@v4
        with:
          name: SolidsOfRevolution_InventorProfessional_TRANSFORM_V3_TOTAL_FINAL_PQH
          path: |
            delivery_revolve_v3/
            qa_revolve_v3/
          if-no-files-found: error
          retention-days: 7
