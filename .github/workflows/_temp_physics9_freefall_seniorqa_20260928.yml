name: TEMP Physics9 FreeFall SeniorQA 20260928

on:
  push:
    branches:
      - manim/physics9-freefall-seniorqa-20260928
    paths:
      - render_jobs/physics9_freefall_seniorqa_20260928/freefall_seniorqa.py
      - .github/workflows/_temp_physics9_freefall_seniorqa_20260928.yml

permissions:
  contents: write

jobs:
  render:
    name: Render and Senior-QA Physics9 free fall
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4
        with:
          ref: manim/physics9-freefall-seniorqa-20260928
          fetch-depth: 0

      - name: Static source validation
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/physics9_freefall_seniorqa_20260928/freefall_seniorqa.py
          python -m py_compile "$SRC"
          grep -q "class Physics9FreeFallSeniorQA" "$SRC"
          grep -q "W = M \* G" "$SRC"
          grep -q "N_DOWN = M \* (G - A_E)" "$SRC"
          grep -q "G_ORBIT" "$SRC"

      - name: Prepare ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          ffmpeg -version | head -1

      - name: Literal PQL smoke render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/physics9_freefall_seniorqa_20260928/freefall_seniorqa.py
          SCENE=Physics9FreeFallSeniorQA
          rm -rf media_pql qa_smoke
          mkdir -p qa_smoke
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.08 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pql $SRC $SCENE --fps 15 --format=mp4 --media_dir media_pql --disable_caching" \
            2>&1 | tee qa_smoke/pql.log
          PQL="$(find media_pql -type f -name "$SCENE.mp4" | head -1)"
          test -n "$PQL"
          test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/physics9_freefall_seniorqa_20260928/freefall_seniorqa.py
          SCENE=Physics9FreeFallSeniorQA
          OUT=deliveries/physics9/freefall_seniorqa_20260928
          rm -rf media_final "$OUT"
          mkdir -p "$OUT"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pqh $SRC $SCENE --fps 30 --format=mp4 --media_dir media_final --disable_caching" \
            2>&1 | tee "$OUT/pqh.log"

          FINAL="$(find media_final -type f -name "$SCENE.mp4" | head -1)"
          test -n "$FINAL"
          test -s "$FINAL"

          ffmpeg -y -v error -i "$FINAL" \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -r 30 \
            -movflags +faststart -an \
            "$OUT/Physics9_FreeFall_Weightlessness_SENIOR_QA_FINAL_pqh.mp4"

          cp "$SRC" "$OUT/Physics9_FreeFall_SeniorQA_source.py"

      - name: Full technical QA and visual sampling
        shell: bash
        run: |
          set -euo pipefail
          OUT=deliveries/physics9/freefall_seniorqa_20260928
          F="$OUT/Physics9_FreeFall_Weightlessness_SENIOR_QA_FINAL_pqh.mp4"

          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"

          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration_s\tsize_bytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"

          test "$W" = "1920"
          test "$H" = "1080"
          test "$FPS" = "30/1"
          test "$CODEC" = "h264"
          test "$PIX" = "yuv420p"
          awk -v d="$DUR" 'BEGIN { exit !(d > 90) }'
          test "$SIZE" -gt 1000000

          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/full_decode.log"

          mkdir -p "$OUT/qa_frames"
          for FRC in 0.04 0.12 0.20 0.28 0.36 0.44 0.52 0.60 0.68 0.76 0.86 0.96; do
            T="$(awk -v d="$DUR" -v f="$FRC" 'BEGIN{printf "%.3f",d*f}')"
            TAG="$(printf '%s' "$FRC" | tr -d '.')"
            ffmpeg -y -ss "$T" -i "$F" -frames:v 1 "$OUT/qa_frames/frame_$TAG.png" >/dev/null 2>&1
          done

          ffmpeg -y -pattern_type glob -i "$OUT/qa_frames/frame_*.png" \
            -vf 'scale=480:-1,tile=4x3:padding=8:margin=8:color=white' \
            -frames:v 1 "$OUT/QA_CONTACT_SHEET.jpg" >/dev/null 2>&1

          sha256sum "$F" > "$OUT/SHA256SUMS.txt"

          {
            echo "# Physics 9 Free Fall — Senior QA"
            echo
            echo "- ManimCE: 0.20.1"
            echo "- Pipeline: literal PQL smoke test -> literal PQH render -> H.264 normalization"
            echo "- Resolution: $W x $H"
            echo "- FPS: $FPS"
            echo "- Codec: $CODEC"
            echo "- Pixel format: $PIX"
            echo "- Duration: $DUR s"
            echo "- Bytes: $SIZE"
            echo "- Full sequential FFmpeg decode: PASS"
            echo
            echo "Physics coverage:"
            echo "- ideal free fall defined by force condition"
            echo "- upward throw still in free fall"
            echo "- v=0 at apex while a=-g"
            echo "- mass independence in vacuum"
            echo "- weight W=mg vs apparent weight N"
            echo "- elevator apparent weight"
            echo "- weightlessness N=0 with W nonzero"
            echo "- signed kinematic equations"
            echo "- 20 m worked fall"
            echo "- position, velocity, acceleration graphs"
            echo "- air drag and terminal velocity"
            echo "- orbital microgravity with nonzero g"
            echo "- misconception checkpoint"
          } > "$OUT/QA_REPORT.md"

      - name: Persist validated video to render branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliveries/physics9/freefall_seniorqa_20260928
          if ! git diff --cached --quiet; then
            git commit -m "render: publish Physics9 free-fall Senior QA PQH [skip ci]"
            git push origin HEAD:manim/physics9-freefall-seniorqa-20260928
          fi

      - name: Upload QA package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Physics9-FreeFall-SeniorQA
          path: deliveries/physics9/freefall_seniorqa_20260928
          if-no-files-found: error
