name: Archive Geometry8 Early Thales Remaining Host

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'archive/geometry8-thales-remaining-container-only-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - scene: ThalesPyramidMasterclassArchive
            date: 2026-07-11
            stem: ThalesPyramidMasterclass_ARCHIVE_RERENDER
          - scene: ThalesTheoremGeometry8Archive
            date: 2026-07-11
            stem: ThalesTheoremGeometry8_ARCHIVE_RERENDER
          - scene: UnitCircleThalesBridgeArchive
            date: 2026-07-22
            stem: UnitCircleThalesBridge_ARCHIVE_RERENDER
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and compile historical source
        shell: bash
        run: |
          set -euo pipefail
          tr -cd 'A-Za-z0-9+/=' < archive_rerender/thales_early_archive_reconstructed.py.gz.b64 | base64 -d | gzip -dc > thales_early_archive_reconstructed.py
          tr -cd 'A-Za-z0-9+/=' < archive_rerender/jp_classroom_style.py.gz.b64 | base64 -d | gzip -dc > jp_classroom_style.py
          python -m py_compile thales_early_archive_reconstructed.py jp_classroom_style.py
      - name: Pull pinned ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1
      - name: PQL gate
        shell: bash
        env:
          SCENE: ${{ matrix.scene }}
        run: |
          set -euo pipefail
          rm -rf media
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.20 -e SCENE="$SCENE" -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'set -euo pipefail; mkdir -p /tmp/bin; printf "#!/usr/bin/env bash\nexit 0\n" >/tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH="/tmp/bin:$PATH"; manim -pql thales_early_archive_reconstructed.py "$SCENE" --format=mp4 --disable_caching --fps 30'
          test -n "$(find media -type f -name "${SCENE}.mp4" | head -1)"
      - name: Literal PQH and stage raw delivery
        shell: bash
        env:
          SCENE: ${{ matrix.scene }}
          DATE: ${{ matrix.date }}
          STEM: ${{ matrix.stem }}
        run: |
          set -euo pipefail
          rm -rf media delivery
          mkdir -p delivery
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 -e SCENE="$SCENE" -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'set -euo pipefail; mkdir -p /tmp/bin; printf "#!/usr/bin/env bash\nexit 0\n" >/tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH="/tmp/bin:$PATH"; manim -pqh thales_early_archive_reconstructed.py "$SCENE" --format=mp4 --disable_caching --fps 30'
          SRC="$(find media -type f -name "${SCENE}.mp4" ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$SRC" && test -s "$SRC"
          cp "$SRC" "delivery/${DATE}__${STEM}_pqh.mp4"
          cp thales_early_archive_reconstructed.py jp_classroom_style.py delivery/
      - name: Upload raw PQH immediately
        uses: actions/upload-artifact@v4
        with:
          name: remaining-host-${{ matrix.date }}-${{ matrix.scene }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
      - name: Non-blocking container QA
        continue-on-error: true
        shell: bash
        env:
          DATE: ${{ matrix.date }}
          STEM: ${{ matrix.stem }}
        run: |
          set -euo pipefail
          F="delivery/${DATE}__${STEM}_pqh.mp4"
          docker run --rm --user "$(id -u):$(id -g)" -e F="$F" -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c '
            set -euo pipefail
            ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 "$F"
            ffmpeg -nostdin -v error -i "$F" -f null -
          '
