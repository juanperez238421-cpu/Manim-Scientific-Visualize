name: Bootstrap Variance Native PQH Render

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render/variance-workshop-pqh-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout pull request render branch
        uses: actions/checkout@v4

      - name: Run protocol-compliant native ManimCE render
        id: native_render
        continue-on-error: true
        shell: bash
        run: bash render_jobs/variance_workshop_20260726/run_render.sh

      - name: Upload native render result or diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VarianceComprehensiveWorkshop_pqh
          path: |
            delivery/
            pql_render.log
            pqh_render.log
            ffprobe.txt
            full_decode.log
            render_jobs/variance_workshop_20260726/main.py
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve failure status after diagnostic upload
        if: steps.native_render.outcome == 'failure'
        shell: bash
        run: exit 1
