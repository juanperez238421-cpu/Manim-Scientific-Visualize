name: Physics9 Galileo Inclined Plane MUA FINAL PQH 20260901

on:
  push:
    branches:
      - render/physics9-galileo-inclined-plane-mua-20260901
    paths:
      - 'render_jobs/physics9_galileo_inclined_plane_20260901/**'
      - '.github/workflows/physics9_galileo_inclined_plane_mua_pqh_20260901.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout exact render branch
        uses: actions/checkout@v4
        with:
          ref: render/physics9-galileo-inclined-plane-mua-20260901

      - name: Static source validation
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          SRC="$JOB/Physics9_Galileo_Inclined_Plane_MUA_FINAL.py"
          test -s "$SRC"
          python -m py_compile "$SRC"
          grep -q '^class Physics9GalileoInclinedPlaneFinal' "$SRC"
          for method in \
            opening bridge_from_previous_class galileo_question galileo_apparatus \
            equal_time_pattern square_time_law velocity_time_meaning \
            derive_first_equation derive_second_equation derive_third_equation \
            worked_lab_example three_graphs_one_motion student_challenge summary; do
            grep -q "def ${method}" "$SRC"
          done
          if grep -Eq '([A-Za-z]:\\\\|/Users/|/home/[^/]+/Desktop)' "$SRC"; then
            echo 'FAIL: non-portable absolute path found'; exit 1
          fi
          mkdir -p qa_preview final_out final_out/audit_frames package
          sha256sum "$SRC" > qa_preview/SOURCE_SHA256SUMS.txt

      - name: Prepare pinned ManimCE 0.20.1 environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick zip
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          ffmpeg -version | head -n 1

      - name: Literal PQL full-timeline runtime gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.06 \
            -v "$PWD:/manim" \
            -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql \
                Physics9_Galileo_Inclined_Plane_MUA_FINAL.py \
                Physics9GalileoInclinedPlaneFinal \
                --format=mp4 \
                --media_dir=/manim/media_pql \
                --disable_caching
            ' 2>&1 | tee qa_preview/render_pql.log
          PQL="$(find media_pql -type f -name 'Physics9GalileoInclinedPlaneFinal.mp4' -print -quit)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          rm -rf media_pqh
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh \
                Physics9_Galileo_Inclined_Plane_MUA_FINAL.py \
                Physics9GalileoInclinedPlaneFinal \
                --format=mp4 \
                --media_dir=/manim/media_pqh \
                --disable_caching
            ' 2>&1 | tee final_out/render_pqh.log
          FINAL="$(find media_pqh -type f -name 'Physics9GalileoInclinedPlaneFinal.mp4' -print -quit)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" final_out/Physics9_Galileo_Inclined_Plane_MUA_FINAL_pqh.mp4

      - name: Strict video QA
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Galileo_Inclined_Plane_MUA_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tframes\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$FRAMES" "$SIZE" > final_out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> final_out/full_decode.log
          test ! -s final_out/full_decode.log

      - name: Distributed visual audit frames
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Galileo_Inclined_Plane_MUA_FINAL_pqh.mp4
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          rm -rf final_out/audit_frames
          mkdir -p final_out/audit_frames
          for INDEX in $(seq -w 0 35); do
            T="$(python -c "print(float('$DUR')*(int('$INDEX')+0.5)/36.0)")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "final_out/audit_frames/frame_${INDEX}.png"
          done
          test "$(find final_out/audit_frames -type f -name '*.png' | wc -l)" -eq 36
          montage final_out/audit_frames/*.png \
            -thumbnail 384x216 -tile 6x6 -geometry +8+10 -background white -quality 90 \
            final_out/CONTACT_SHEET_36.jpg
          test -s final_out/CONTACT_SHEET_36.jpg

      - name: Build QA report and package
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_galileo_inclined_plane_20260901
          F=final_out/Physics9_Galileo_Inclined_Plane_MUA_FINAL_pqh.mp4
          SRC="$JOB/Physics9_Galileo_Inclined_Plane_MUA_FINAL.py"
          sha256sum "$F" "$SRC" > final_out/SHA256SUMS.txt
          {
            echo '# Physics 9 Galileo Inclined Plane - Senior QA Result'
            echo
            echo '- Python compile: PASS'
            echo '- Scene architecture check: PASS'
            echo '- Literal PQL full-timeline gate: PASS'
            echo '- Literal PQH final render: PASS'
            echo '- Full FFmpeg decode: PASS'
            echo '- 36-frame distributed visual audit: generated'
            echo '- SHA-256 manifest: generated'
            echo
            cat final_out/VIDEO_TECHNICAL.tsv
          } > final_out/SENIOR_QA_RESULT.md

          ROOT=package/Physics9_Galileo_Inclined_Plane_MUA_FINAL_PQH
          mkdir -p "$ROOT/src" "$ROOT/render" "$ROOT/qa"
          cp "$SRC" "$ROOT/src/"
          cp "$F" "$ROOT/render/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/SHA256SUMS.txt final_out/SENIOR_QA_RESULT.md final_out/CONTACT_SHEET_36.jpg "$ROOT/qa/"
          cp -r final_out/audit_frames "$ROOT/qa/"
          (cd package && zip -qr Physics9_Galileo_Inclined_Plane_MUA_FINAL_PQH.zip Physics9_Galileo_Inclined_Plane_MUA_FINAL_PQH)
          cp package/Physics9_Galileo_Inclined_Plane_MUA_FINAL_PQH.zip final_out/

      - name: Upload final MP4 and complete package
        uses: actions/upload-artifact@v4
        with:
          name: Physics9_Galileo_Inclined_Plane_MUA_FINAL_PQH
          path: |
            final_out/Physics9_Galileo_Inclined_Plane_MUA_FINAL_pqh.mp4
            final_out/Physics9_Galileo_Inclined_Plane_MUA_FINAL_PQH.zip
            final_out/SENIOR_QA_RESULT.md
            final_out/VIDEO_TECHNICAL.tsv
            final_out/CONTACT_SHEET_36.jpg
            final_out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
