name: Render Solids V4 Bigger Figures

on:
  push:
    branches:
      - render-solids-v4-bigger-figures-20260811

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout temporary render branch
        uses: actions/checkout@v4
        with:
          ref: render-solids-v4-bigger-figures-20260811
          fetch-depth: 0

      - name: Restore exact uploaded source and style
        shell: bash
        run: |
          set -euo pipefail
          rm -rf render_workspace render_output render_delivery
          mkdir -p render_workspace render_output render_delivery \
                   render_workspace/media_pql render_workspace/media_pqh

          cat render_payload/code_*.b64 | tr -d '\n' | base64 -d | gzip -dc \
            > render_workspace/SolidsOfRevolution_InventorProfessional_TRANSFORM_V4_BIGGER_FIGURES_FINAL.py
          cat render_payload/style_*.b64 | tr -d '\n' | base64 -d | gzip -dc \
            > render_workspace/jp_classroom_style.py

          test "$(sha256sum render_workspace/SolidsOfRevolution_InventorProfessional_TRANSFORM_V4_BIGGER_FIGURES_FINAL.py | cut -d' ' -f1)" \
            = "c359547721378bfcb9d4ddb1a485b0e8e039a6379053f6df63b4279a846dc6d4"
          test "$(sha256sum render_workspace/jp_classroom_style.py | cut -d' ' -f1)" \
            = "3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d"

          sha256sum render_workspace/SolidsOfRevolution_InventorProfessional_TRANSFORM_V4_BIGGER_FIGURES_FINAL.py \
                    render_workspace/jp_classroom_style.py \
            | tee render_output/source_sha256.txt
          chmod 777 render_workspace/media_pql render_workspace/media_pqh

      - name: Python syntax validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            render_workspace/SolidsOfRevolution_InventorProfessional_TRANSFORM_V4_BIGGER_FIGURES_FINAL.py \
            render_workspace/jp_classroom_style.py
          echo "py_compile: PASS" | tee render_output/py_compile.txt

      - name: Pull fixed ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Mandatory low-quality validation (-pql)
        shell: bash
        run: |
          set -euo pipefail
          cd render_workspace
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql \
                SolidsOfRevolution_InventorProfessional_TRANSFORM_V4_BIGGER_FIGURES_FINAL.py \
                SolidsOfRevolutionInventorSeniorV3 \
                --format=mp4 --disable_caching --fps 30 \
                --media_dir /manim/media_pql
            '
          echo "literal -pql: PASS" | tee ../render_output/pql_validation.txt

      - name: Final literal high-quality render (-pqh)
        shell: bash
        run: |
          set -euo pipefail
          cd render_workspace
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pqh \
                SolidsOfRevolution_InventorProfessional_TRANSFORM_V4_BIGGER_FIGURES_FINAL.py \
                SolidsOfRevolutionInventorSeniorV3 \
                --format=mp4 --disable_caching --fps 30 \
                --media_dir /manim/media_pqh
            '

      - name: Preserve exact raw pqh MP4 in branch-safe chunks
        shell: bash
        run: |
          set -euo pipefail
          find render_workspace/media_pqh -type f -iname '*.mp4' -printf '%s\t%p\n' | sort -nr \
            | tee render_output/all_pqh_mp4s.txt
          test "$(wc -l < render_output/all_pqh_mp4s.txt)" -ge 1
          RAW="$(head -n 1 render_output/all_pqh_mp4s.txt | cut -f2-)"
          test -n "$RAW"
          test -s "$RAW"

          cp "$RAW" render_output/raw_pqh.mp4
          sha256sum render_output/raw_pqh.mp4 | tee render_output/raw_video_sha256.txt
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate,avg_frame_rate \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 render_output/raw_pqh.mp4 \
            | tee render_output/ffprobe_raw.txt

          cp render_output/raw_video_sha256.txt render_delivery/
          cp render_output/ffprobe_raw.txt render_delivery/
          cp render_output/pql_validation.txt render_delivery/
          cp render_output/py_compile.txt render_delivery/
          cp render_output/source_sha256.txt render_delivery/
          cp render_workspace/SolidsOfRevolution_InventorProfessional_TRANSFORM_V4_BIGGER_FIGURES_FINAL.py render_delivery/
          cp render_workspace/jp_classroom_style.py render_delivery/
          printf '%s\n' \
            'manim -pqh SolidsOfRevolution_InventorProfessional_TRANSFORM_V4_BIGGER_FIGURES_FINAL.py SolidsOfRevolutionInventorSeniorV3 --format=mp4 --disable_caching --fps 30 --media_dir /manim/media_pqh' \
            > render_delivery/render_command.txt

          # Always split so every committed blob remains well below GitHub's 100 MB limit.
          split -b 40M -d -a 3 render_output/raw_pqh.mp4 \
            render_delivery/SolidsOfRevolution_InventorProfessional_TRANSFORM_V4_BIGGER_FIGURES_FINAL_pqh.mp4.part.
          find render_delivery -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort \
            | tee render_delivery/MANIFEST.txt

      - name: Commit raw render delivery to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f render_delivery
          git commit -m "Preserve exact Solids V4 pqh render [skip ci]"
          git push origin HEAD:render-solids-v4-bigger-figures-20260811

      - name: Upload raw pqh artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolidsOfRevolution_V4_BiggerFigures_RAW_pqh
          path: render_output/
          if-no-files-found: error
