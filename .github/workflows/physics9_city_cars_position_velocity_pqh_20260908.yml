name: Physics 9 City Cars Position Velocity V2 SENIOR FINAL PQH 20260908

on:
  push:
    branches:
      - manim/physics9-city-cars-position-velocity-20260908
    paths-ignore:
      - 'published_renders/**'

permissions:
  contents: write
  actions: read

jobs:
  render_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      JOB: render_jobs/physics9_city_cars_20260908
      SOURCE: physics9_city_cars_position_velocity_v2.py
      SCENE: Physics9CityCarsV2
      FINAL_NAME: Physics9_City_Cars_Position_Velocity_V2_SENIOR_FINAL_pqh.mp4
      ARTIFACT_NAME: Physics9-City-Cars-Position-Velocity-V2-SENIOR-FINAL-PQH

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile and validate lesson source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$JOB/physics9_city_cars_position_velocity.py" "$JOB/$SOURCE"
          grep -q 'class Physics9CityCarsV2' "$JOB/$SOURCE"
          grep -q 'CITY_DISTANCE_KM = 240.0' "$JOB/physics9_city_cars_position_velocity.py"
          grep -q 'V_A_KMH = 80.0' "$JOB/physics9_city_cars_position_velocity.py"
          grep -q 'V_B_KMH = -40.0' "$JOB/physics9_city_cars_position_velocity.py"

      - name: Install QA tools and ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Full-timeline PQL smoke render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media_pql qa_pql && mkdir -p qa_pql
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.08 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $JOB/$SOURCE $SCENE --fps 15 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee qa_pql/render_pql.log
          PREVIEW="$(find media_pql -type f -name "$SCENE.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf media out && mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $JOB/$SOURCE $SCENE --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee out/render_pqh.log
          FINAL="$(find media -type f -name "$SCENE.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" "out/$FINAL_NAME"

      - name: Technical QA and sampled-frame visual evidence
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          F="out/$FINAL_NAME"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          python - <<PY
          d=float('$DUR')
          assert 100 <= d <= 190, f'unexpected lesson duration: {d}'
          print('duration_pass', d)
          PY
          test "$SIZE" -gt 1000000
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log

          INTERVAL="$(python - <<PY
          d=float('$DUR')
          print(max(d/12.0, 1.0))
          PY
          )"
          ffmpeg -nostdin -loglevel error -i "$F" \
            -vf "fps=1/$INTERVAL,scale=480:-1,tile=4x3:padding=6:margin=6" \
            -frames:v 1 -q:v 2 out/contact_sheet.jpg

          sha256sum "$F" | tee out/SHA256SUMS.txt
          SHA="$(awk '{print $1}' out/SHA256SUMS.txt)"
          {
            echo "file=$FINAL_NAME"
            echo "width=$W"
            echo "height=$H"
            echo "fps=$FPS"
            echo "codec=$CODEC"
            echo "pix_fmt=$PIX"
            echo "duration=$DUR"
            echo "size_bytes=$SIZE"
            echo "sha256=$SHA"
            echo "full_decode=PASS"
            echo "visual_evidence=contact_sheet.jpg"
            echo "layout_revision=V2 dynamic long-header fit + final takeaway safe-width fit"
          } > out/VIDEO_QA.txt
          cp "$JOB/physics9_city_cars_position_velocity.py" out/
          cp "$JOB/$SOURCE" out/
          cp qa_pql/render_pql.log out/
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "duration=$DUR" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            out/${{ env.FINAL_NAME }}
            out/physics9_city_cars_position_velocity.py
            out/${{ env.SOURCE }}
            out/VIDEO_QA.txt
            out/SHA256SUMS.txt
            out/contact_sheet.jpg
            out/full_decode.log
            out/render_pqh.log
            out/render_pql.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish exact validated MP4 to GitHub branch
        shell: bash
        run: |
          set -euo pipefail
          F="out/$FINAL_NAME"
          SIZE="$(stat -c%s "$F")"
          test "$SIZE" -lt $((95 * 1024 * 1024))
          mkdir -p published_renders
          cp "$F" "published_renders/$FINAL_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "published_renders/$FINAL_NAME"
          git commit -m "Publish Physics 9 city cars V2 SENIOR FINAL PQH [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Verify direct raw MP4 URL
        shell: bash
        run: |
          set -euo pipefail
          DIRECT="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/published_renders/${FINAL_NAME}"
          echo "DIRECT_URL=$DIRECT" | tee out/DIRECT_DOWNLOAD_URL.txt
          curl -L --fail --retry 6 --retry-delay 3 -o /tmp/verified.mp4 "$DIRECT"
          test -s /tmp/verified.mp4
          EXPECTED="${{ steps.qa.outputs.sha }}"
          ACTUAL="$(sha256sum /tmp/verified.mp4 | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          echo "Direct download verified: $DIRECT"
          echo "SHA-256: $ACTUAL"
