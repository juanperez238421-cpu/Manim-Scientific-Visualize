name: Seminar11 OOP V10 PR Render 20260818

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render-sem11-oop-v10-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact V10 sources and static QA
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/sem11_oop_v10
          CHUNKS="$JOB/chunks"
          BASE='https://raw.githubusercontent.com/juanperez238421-cpu/IJR---Seminario/render-sem11-oop-v10-20260818/render_jobs/sem11_oop_v10'
          mkdir -p "$CHUNKS" out
          for I in 00 01 02 03 04; do
            curl -fsSL "$BASE/chunks/scene_$I" -o "$CHUNKS/scene_$I"
            curl -fsSL "$BASE/chunks/style_$I" -o "$CHUNKS/style_$I"
          done
          curl -fsSL "$BASE/check_manim_style.py" -o "$JOB/check_manim_style.py"
          cat "$CHUNKS"/scene_* > "$JOB/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10.py"
          cat "$CHUNKS"/style_* > "$JOB/jp_classroom_style.py"
          python -m py_compile "$JOB/Semar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10.py" 2>/dev/null || true
          python -m py_compile "$JOB/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10.py" "$JOB/jp_classroom_style.py" "$JOB/check_manim_style.py"
          python "$JOB/check_manim_style.py" "$JOB/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10.py" | tee out/STYLE_QA.txt
          sha256sum "$JOB/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10.py" "$JOB/jp_classroom_style.py" > out/SOURCE_SHA256.txt

      - name: Prepare ManimCE 0.20.1 and verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Accelerated literal PQL layout gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/sem11_oop_v10
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.18 \
            -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $JOB/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10.py Seminar11OOPImmersiveV10 \
                --fps 15 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee out/render_pql.log
          P="$(find media_pql -type f -name 'Seminar11OOPImmersiveV10.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$P" && test -s "$P"
          cp "$P" out/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10_QA_pql.mp4

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/sem11_oop_v10
          rm -rf media
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $JOB/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10.py Seminar11OOPImmersiveV10 \
                --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee out/render_pqh.log
          F="$(find media -type f -name 'Seminar11OOPImmersiveV10.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$F" && test -s "$F"
          cp "$F" out/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10_pqh.mp4
          cp "$JOB/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10.py" out/
          cp "$JOB/jp_classroom_style.py" out/

      - name: Strict technical QA and audit frames
        shell: bash
        run: |
          set -euo pipefail
          F=out/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          mkdir -p out/audit_frames
          for P in 0.03 0.10 0.18 0.26 0.34 0.42 0.50 0.58 0.66 0.74 0.82 0.90 0.97; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_${TAG}.png"
          done
          ffmpeg -nostdin -loglevel error -i "$F" -vf "fps=1/10,scale=640:-1,tile=4x3:padding=6:margin=8" -frames:v 1 out/QA_CONTACT_SHEET.jpg
          sha256sum "$F" out/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10.py out/jp_classroom_style.py > out/SHA256SUMS.txt
          cat > out/RENDER_INFO.txt <<'EOF'
Scene: Seminar11OOPImmersiveV10
Version: Senior QA V10
ManimCE: 0.20.1
Preview: literal -pql with LESSON_TIME_SCALE=0.18
Final: literal -pqh, 1920x1080, 30 fps, H.264/yuv420p
QA focus: remove V9 camera clipping/overlap, enforce persistent header lane and content floor, enlarge underused scenes, runtime safe-frame assertions.
QA: py_compile + JP style checker + PQL + PQH + ffprobe + full FFmpeg decode + 13 audit frames + contact sheet + SHA-256.
EOF
          cd out
          zip -9 -r Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10_PQH_Package.zip \
            Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10_pqh.mp4 \
            Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10_QA_pql.mp4 \
            Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10.py jp_classroom_style.py \
            VIDEO_TECHNICAL.tsv SHA256SUMS.txt SOURCE_SHA256.txt RENDER_INFO.txt STYLE_QA.txt \
            render_pql.log render_pqh.log full_decode.log QA_CONTACT_SHEET.jpg audit_frames/

      - uses: actions/upload-artifact@v4
        with:
          name: Seminar11-OOP-V10-PQH-20260818
          path: |
            out/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10_pqh.mp4
            out/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10_QA_pql.mp4
            out/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10_PQH_Package.zip
            out/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10.py
            out/jp_classroom_style.py
            out/VIDEO_TECHNICAL.tsv
            out/SHA256SUMS.txt
            out/RENDER_INFO.txt
            out/STYLE_QA.txt
            out/QA_CONTACT_SHEET.jpg
            out/audit_frames/
          if-no-files-found: error
          retention-days: 7
