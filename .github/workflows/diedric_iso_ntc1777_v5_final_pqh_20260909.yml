name: Diedric ISO NTC1777 V5 FINAL PQH 20260909

on:
  push:
    branches:
      - manim/diedric-iso-ntc1777-v5-senior-qa-20260909
    paths:
      - .github/workflows/diedric_iso_ntc1777_v5_final_pqh_20260909.yml
      - render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5.py
      - render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5_final.py
      - Core/technical_drawing_tools.py
      - Core/technical_drawing_tools_v5.py

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout V5 final branch
        uses: actions/checkout@v4
        with:
          ref: manim/diedric-iso-ntc1777-v5-senior-qa-20260909
          fetch-depth: 0

      - name: Validate V5 final source
        shell: bash
        run: |
          set -euo pipefail
          BASE=render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5.py
          SRC=render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5_final.py
          LIB=Core/technical_drawing_tools_v5.py
          python -m py_compile "$BASE" "$SRC" "$LIB" Core/technical_drawing_tools.py
          grep -q 'class DiedricISOProjectionV5FinalQA' "$SRC"
          grep -q 'collision-free' "$SRC"
          grep -q 'PAUSE_VIEW' "$BASE"
          grep -q 'large_view_card' "$BASE"
          grep -q 'observer_sequence_strip' "$BASE"
          grep -q 'PRIMER DIEDRO' "$BASE"
          grep -q 'TERCER DIEDRO' "$BASE"
          grep -q 'NTC 1777:2001' "$BASE"
          ! grep -Eq '[A-Za-z]:\\|/Users/|/home/[^/]+/' "$BASE" "$SRC" "$LIB"

      - name: Install render and QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip zip
          python -m pip install --quiet pillow
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL final-layout QA render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5_final.py
          SCENE=DiedricISOProjectionV5FinalQA
          rm -rf media_pql_final qa_pql_final
          mkdir -p qa_pql_final
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.035 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pql $SRC $SCENE --fps 15 --format=mp4 --media_dir media_pql_final --disable_caching" \
            2>&1 | tee qa_pql_final/pql.log
          PQL="$(find media_pql_final -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$PQL"
          test -s "$PQL"
          ffmpeg -nostdin -v error -i "$PQL" -f null - 2> qa_pql_final/pql_decode.log

      - name: Literal PQH V5 final render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5_final.py
          SCENE=DiedricISOProjectionV5FinalQA
          OUT=deliverables/technical_drawing_diedric_iso_v5_final_20260909
          rm -rf media_v5_final "$OUT"
          mkdir -p "$OUT"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "mkdir -p /tmp/manim-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open; chmod +x /tmp/manim-bin/xdg-open; export PATH=/tmp/manim-bin:\$PATH; manim -pqh $SRC $SCENE --fps 30 --format=mp4 --media_dir media_v5_final --disable_caching" \
            2>&1 | tee "$OUT/pqh.log"
          FINAL="$(find media_v5_final -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$FINAL"
          test -s "$FINAL"
          cp "$FINAL" "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_SENIOR_FINAL_pqh.mp4"

      - name: Senior QA, frame sampling and package
        shell: bash
        run: |
          set -euo pipefail
          OUT=deliverables/technical_drawing_diedric_iso_v5_final_20260909
          F="$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_SENIOR_FINAL_pqh.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          awk -v d="$DUR" 'BEGIN { if (d < 300 || d > 540) exit 1; }'
          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/decode.log"

          mkdir -p "$OUT/qa_frames"
          for FRAC in 0.015 0.045 0.075 0.105 0.135 0.165 0.195 0.225 0.255 0.285 0.315 0.345 0.375 0.405 0.435 0.465 0.495 0.525 0.555 0.585 0.615 0.645 0.675 0.705 0.735 0.765 0.795 0.825 0.855 0.885 0.915 0.945 0.975; do
            T="$(awk -v d="$DUR" -v f="$FRAC" 'BEGIN{printf "%.2f",d*f}')"
            TAG="$(printf '%s' "$FRAC" | tr -d '.')"
            ffmpeg -y -ss "$T" -i "$F" -frames:v 1 "$OUT/qa_frames/frame_${TAG}.png" >/dev/null 2>&1
          done

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('deliverables/technical_drawing_diedric_iso_v5_final_20260909')
          frames=sorted((root/'qa_frames').glob('*.png'))
          if len(frames)!=33:
              raise SystemExit(f'Expected 33 frames; got {len(frames)}')
          rows=[]; populated=0
          for p in frames:
              im=Image.open(p).convert('RGB').resize((320,180))
              pix=list(im.getdata())
              changed=sum(1 for r,g,b in pix if abs(r-246)+abs(g-248)+abs(b-251)>42)
              ratio=changed/len(pix)
              rows.append((p.name,ratio))
              populated += ratio>0.025
          (root/'VISUAL_DENSITY_QA.tsv').write_text(
              'frame\tnonbackground_ratio\n'+'\n'.join(f'{n}\t{r:.6f}' for n,r in rows)+'\n',encoding='utf-8')
          if populated<30:
              raise SystemExit(f'Insufficient populated frames: {populated}/33')
          thumbs=[]
          for p in frames:
              im=Image.open(p).convert('RGB'); im.thumbnail((384,216))
              c=Image.new('RGB',(400,246),'white'); c.paste(im,((400-im.width)//2,8))
              ImageDraw.Draw(c).text((12,224),p.stem,fill=(35,45,58)); thumbs.append(c)
          cols=4; rows_n=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(400*cols,246*rows_n),'white')
          for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*400,(i//cols)*246))
          sheet.save(root/'qa_contact_sheet.jpg',quality=92)
          PY

          sha256sum "$F" > "$OUT/SHA256SUMS.txt"
          cp render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5.py "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_base.py"
          cp render_jobs/technical_drawing_diedric_iso_v5_20260909/diedric_iso_ntc1777_v5_final.py "$OUT/TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_final.py"
          cp Core/technical_drawing_tools_v5.py "$OUT/technical_drawing_tools_v5.py"
          cat > "$OUT/RENDER_INFO.txt" <<'EOF'
          V5 FINAL — full senior rendered lesson based on the successful V4.
          Targeted corrections: text/figure collision removal, measured card gaps, larger single-view projections, slower camera transitions, 3.25 s holds at each of six principal observer perspectives, more 3D→2D reveal animations, separated first-angle and third-angle stages, and collision-free algorithm/challenge boards.
          ManimCE 0.20.1 · literal -pql QA -> literal -pqh final.
          Output: 1920x1080 · 30 fps · H.264 · yuv420p.
          QA: compile + PQL full render/decode + PQH full render/decode + ffprobe + 33 distributed frames + contact sheet.
          EOF
          (cd "$OUT" && zip -9 -r TechnicalDrawing_Diedric_V5_SENIOR_FINAL_FULL_PACKAGE.zip \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_SENIOR_FINAL_pqh.mp4 \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_base.py \
            TechnicalDrawing_Diedric_ISO_A_E_NTC1777_V5_final.py \
            technical_drawing_tools_v5.py VIDEO_TECHNICAL.tsv VISUAL_DENSITY_QA.tsv \
            SHA256SUMS.txt RENDER_INFO.txt decode.log pqh.log qa_contact_sheet.jpg qa_frames)
          test -s "$OUT/TechnicalDrawing_Diedric_V5_SENIOR_FINAL_FULL_PACKAGE.zip"

      - name: Persist V5 final delivery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin manim/diedric-iso-ntc1777-v5-senior-qa-20260909
          git add deliverables/technical_drawing_diedric_iso_v5_final_20260909
          if ! git diff --cached --quiet; then
            git commit -m "render: persist diedric V5 FINAL PQH [skip ci]"
            git push origin HEAD:manim/diedric-iso-ntc1777-v5-senior-qa-20260909
          fi

      - name: Upload V5 final artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIEDRIC-ISO-V5-SENIOR-FINAL-PQH
          path: deliverables/technical_drawing_diedric_iso_v5_final_20260909/
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DIEDRIC-ISO-V5-FINAL-DIAGNOSTICS
          path: |
            qa_pql_final/
            deliverables/technical_drawing_diedric_iso_v5_final_20260909/
          if-no-files-found: ignore
          retention-days: 3
