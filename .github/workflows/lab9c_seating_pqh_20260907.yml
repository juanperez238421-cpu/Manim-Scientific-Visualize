name: Lab9C Seating FULL TOTAL PQH 20260907

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  render:
    if: github.event.pull_request.head.ref == 'manim/lab9c-seating-no-pc07-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Noveno C branch
        uses: actions/checkout@v4
        with:
          ref: manim/lab9c-seating-no-pc07-20260907
          fetch-depth: 0

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/lab9c_seating_no_pc07_20260907/lab9c_seating.py
          PDFBUILDER=render_jobs/lab9c_seating_no_pc07_20260907/build_pdf_from_video.py
          python -m py_compile "$SRC" "$PDFBUILDER"
          grep -q 'GROUP = "NOVENO C"' "$SRC"
          grep -q 'len(STUDENTS) == 20' "$SRC"
          grep -q 'BLOCKED = 7' "$SRC"
          grep -q 'ASSIGN\[18\].*8, "A"' "$SRC"
          grep -q 'ASSIGN\[19\].*8, "B"' "$SRC"

      - name: Install render and PDF tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip poppler-utils python3-pip
          python -m pip install --quiet reportlab pillow
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL runtime QA
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/lab9c_seating_no_pc07_20260907/lab9c_seating.py
          SCENE=Lab9CFixedSeatingNoPC07
          rm -rf media_pql qa_out
          mkdir -p qa_out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.06 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $SRC $SCENE --fps 15 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee qa_out/render_pql.log
          PQL="$(find media_pql -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$PQL"
          test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/lab9c_seating_no_pc07_20260907/lab9c_seating.py
          SCENE=Lab9CFixedSeatingNoPC07
          OUT=deliverables/lab9c_seating_no_pc07
          rm -rf media "$OUT"
          mkdir -p "$OUT"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $SRC $SCENE --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee "$OUT/render_pqh.log"
          FINAL="$(find media -type f -name "${SCENE}.mp4" | head -1)"
          test -n "$FINAL"
          test -s "$FINAL"
          cp "$FINAL" "$OUT/Lab9C_Fixed_Seating_NO_PC07_SENIOR_FINAL_pqh.mp4"

      - name: Technical QA and PDF from real stable MP4 frames
        shell: bash
        run: |
          set -euo pipefail
          OUT=deliverables/lab9c_seating_no_pc07
          F="$OUT/Lab9C_Fixed_Seating_NO_PC07_SENIOR_FINAL_pqh.mp4"
          PDF="$OUT/Lab9C_Fixed_Seating_NO_PC07_PRESENTACION.pdf"
          BUILDER=render_jobs/lab9c_seating_no_pc07_20260907/build_pdf_from_video.py

          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"

          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > "$OUT/VIDEO_TECHNICAL.tsv"

          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/full_decode.log"

          mkdir -p "$OUT/pdf_frames"
          python "$BUILDER" "$F" "$PDF" --frames-dir "$OUT/pdf_frames" | tee "$OUT/pdf_build.log"
          test -s "$PDF"
          PAGES="$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')"
          test "$PAGES" -ge 12
          printf 'pages\t%s\n' "$PAGES" > "$OUT/PDF_TECHNICAL.tsv"

          mkdir -p "$OUT/qa_frames"
          for FRACTION in 0.04 0.14 0.25 0.36 0.48 0.60 0.72 0.84 0.94 0.985; do
            T="$(awk -v d="$DUR" -v f="$FRACTION" 'BEGIN{printf "%.2f", d*f}')"
            TAG="$(printf '%s' "$FRACTION" | tr -d '.')"
            ffmpeg -y -ss "$T" -i "$F" -frames:v 1 "$OUT/qa_frames/frame_${TAG}.png" >/dev/null 2>&1
          done
          ffmpeg -y -pattern_type glob -i "$OUT/qa_frames/frame_*.png" \
            -vf 'scale=480:-1,tile=5x2:padding=8:margin=8:color=white' \
            -frames:v 1 "$OUT/qa_contact_sheet.jpg" >/dev/null 2>&1

          sha256sum "$F" "$PDF" > "$OUT/SHA256SUMS.txt"
          cp render_jobs/lab9c_seating_no_pc07_20260907/lab9c_seating.py "$OUT/Lab9C_source.py"
          cp "$BUILDER" "$OUT/build_pdf_from_video.py"
          cp qa_out/render_pql.log "$OUT/render_pql.log"

          printf '%s\n' \
            'NOVENO C · Fundamentos de Física · 07/09/2026' \
            'Official list order only; grades are not used.' \
            '20 students.' \
            'PC01 1-3; PC02 4-6; PC03 7-9; PC04 10-12; PC05 13-15; PC06 16-18.' \
            'PC07 BLOCKED / NO USAR.' \
            'PC08 students 19-20; seat C remains free.' \
            'PC09 no assignment.' \
            'ManimCE 0.20.1 · literal PQL QA then literal PQH.' \
            '1920x1080 · 30 fps · H.264 · yuv420p.' \
            'PDF generated only from real stable frames extracted from the final MP4.' \
            > "$OUT/RENDER_INFO.txt"

      - name: Build FULL TOTAL ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUT=deliverables/lab9c_seating_no_pc07
          (cd "$OUT" && zip -9 -r Lab9C_NO_PC07_FULL_TOTAL_PACKAGE.zip \
            Lab9C_Fixed_Seating_NO_PC07_SENIOR_FINAL_pqh.mp4 \
            Lab9C_Fixed_Seating_NO_PC07_PRESENTACION.pdf \
            Lab9C_source.py build_pdf_from_video.py \
            VIDEO_TECHNICAL.tsv PDF_TECHNICAL.tsv SHA256SUMS.txt RENDER_INFO.txt \
            full_decode.log render_pqh.log render_pql.log pdf_build.log \
            qa_contact_sheet.jpg qa_frames pdf_frames)
          test -s "$OUT/Lab9C_NO_PC07_FULL_TOTAL_PACKAGE.zip"

      - name: Persist delivery on branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/lab9c_seating_no_pc07
          if ! git diff --cached --quiet; then
            git commit -m "render: persist Noveno C MP4 PDF ZIP delivery"
            git push origin HEAD:manim/lab9c-seating-no-pc07-20260907
          fi

      - name: Upload full package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab9C-NO-PC07-FULL-TOTAL
          path: deliverables/lab9c_seating_no_pc07/
          if-no-files-found: error
          retention-days: 7
