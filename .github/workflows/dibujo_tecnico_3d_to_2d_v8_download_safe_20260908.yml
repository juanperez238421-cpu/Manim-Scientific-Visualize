name: Dibujo Tecnico 3D to 2D V8 FULL TOTAL DOWNLOAD SAFE

on:
  push:
    branches:
      - render/dibujo-tecnico-3d-to-2d-v8-download-safe-20260908
    paths:
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_FULL_TOTAL_DOWNLOAD_SAFE.py'
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/QA_V7_TO_V8_FRESH_REVIEW_AND_DOWNLOAD_FIX.md'
      - '.github/workflows/dibujo_tecnico_3d_to_2d_v8_download_safe_20260908.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  render-v8-full-total:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Static source QA and environment setup
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          V5="$JOB/Dibujo_Tecnico_Sistema_Diedrico_Monge_V5_SENIOR_FAITHFUL.py"
          V7="$JOB/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V7_SENIOR_QA.py"
          V8="$JOB/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_FULL_TOTAL_DOWNLOAD_SAFE.py"
          REPORT="$JOB/QA_V7_TO_V8_FRESH_REVIEW_AND_DOWNLOAD_FIX.md"
          test -s "$V5" && test -s "$V7" && test -s "$V8" && test -s "$REPORT"
          python -m py_compile "$V5" "$V7" "$V8"
          python - <<'PY'
          from pathlib import Path
          p=Path('render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_FULL_TOTAL_DOWNLOAD_SAFE.py')
          s=p.read_text(encoding='utf-8')
          required=[
              'class Projection3Dto2DFullTotalV8',
              'Projection3Dto2DSeniorV7',
              '_fixed_backed_label',
              'font_size=26',
              'font_size=25',
              'front_view_2d',
              'top_view_2d',
              'right_view_2d',
              'view_panel',
              'method_bar',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          print('V8 static source QA: PASS')
          PY
          mkdir -p /tmp/manim-bin /tmp/manim-home pql_media media out qa_out qa_out/audit_frames
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open

      - name: Full-timeline PQL smoke render
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=0.10
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pql Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_FULL_TOTAL_DOWNLOAD_SAFE.py \
            Projection3Dto2DFullTotalV8 \
            --fps 15 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/pql_media" \
            2>&1 | tee "$GITHUB_WORKSPACE/qa_out/PQL.log"
          cd "$GITHUB_WORKSPACE"
          PQL="$(find pql_media -type f -name 'Projection3Dto2DFullTotalV8.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" qa_out/Diedrico_3D_to_2D_V8_pql.mp4

      - name: Literal PQH final render 1920x1080 30fps
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=1.0
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pqh Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_FULL_TOTAL_DOWNLOAD_SAFE.py \
            Projection3Dto2DFullTotalV8 \
            --fps 30 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/media" \
            2>&1 | tee "$GITHUB_WORKSPACE/out/PQH.log"
          cd "$GITHUB_WORKSPACE"
          VIDEO="$(find media -type f -name 'Projection3Dto2DFullTotalV8.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"
          cp "$VIDEO" out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_FULL_TOTAL_DOWNLOAD_SAFE_FINAL_pqh.mp4
          cp "$VIDEO" out/Diedrico_3D_to_2D_V8.mp4
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_FULL_TOTAL_DOWNLOAD_SAFE.py out/
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/QA_V7_TO_V8_FRESH_REVIEW_AND_DOWNLOAD_FIX.md out/

      - name: Full decode and technical QA
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Diedrico_3D_to_2D_V8.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/VIDEO_QA.txt
          import av, os, sys
          p=sys.argv[1]
          frames=0
          with av.open(p) as c:
              s=c.streams.video[0]
              codec=s.codec_context.name
              width=s.codec_context.width
              height=s.codec_context.height
              fmt=s.codec_context.format.name if s.codec_context.format else ''
              fps=float(s.average_rate) if s.average_rate else 0.0
              duration=float(c.duration)/float(av.time_base) if c.duration else 0.0
              for _ in c.decode(s):
                  frames += 1
          size=os.path.getsize(p)
          print(f'codec_name={codec}')
          print(f'width={width}')
          print(f'height={height}')
          print(f'pix_fmt={fmt}')
          print(f'average_fps={fps:.6f}')
          print(f'duration={duration:.6f}')
          print(f'frames_decoded={frames}')
          print(f'size={size}')
          assert codec == 'h264'
          assert (width,height) == (1920,1080)
          assert fmt == 'yuv420p'
          assert 29.8 <= fps <= 30.2
          assert duration > 60.0
          assert frames > 1800
          assert size > 900_000
          print('VIDEO_QA=PASS')
          PY
          SHA="$(sha256sum "$VIDEO" | awk '{print $1}')"
          SIZE="$(stat -c%s "$VIDEO")"
          echo "$SHA  $VIDEO" | tee qa_out/SHA256SUMS.txt
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Whole-video occupancy and blank-frame audit
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Diedrico_3D_to_2D_V8.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/FRAME_BY_FRAME_QA.txt
          import av, numpy as np, statistics, sys
          p=sys.argv[1]
          widths=[]; heights=[]; dark_fracs=[]; near_blank=0; total=0
          with av.open(p) as c:
              s=c.streams.video[0]
              for frame in c.decode(s):
                  total += 1
                  if total % 6:
                      continue
                  arr=frame.to_ndarray(format='gray')
                  roi=arr[90:1015,:]
                  mask=roi < 242
                  frac=float(mask.mean())
                  dark_fracs.append(frac)
                  ys,xs=np.where(mask)
                  if len(xs):
                      widths.append(int(xs.max()-xs.min()+1))
                      heights.append(int(ys.max()-ys.min()+1))
                  else:
                      widths.append(0); heights.append(0)
                  if frac < 0.0015:
                      near_blank += 1
          medw=float(statistics.median(widths))
          medh=float(statistics.median(heights))
          p10w=float(np.percentile(widths,10))
          medf=float(statistics.median(dark_fracs))
          print('audited_samples=',len(widths))
          print('median_bbox_width=',medw)
          print('p10_bbox_width=',p10w)
          print('median_bbox_height=',medh)
          print('median_dark_fraction=',medf)
          print('near_blank_samples=',near_blank)
          assert len(widths) > 250
          assert medw > 760
          assert p10w > 430
          assert medh > 260
          assert near_blank < 25
          print('FRAME_BY_FRAME_QA=PASS')
          PY

      - name: Generate 96-frame visual audit contact sheet
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Diedrico_3D_to_2D_V8.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/VISUAL_AUDIT.txt
          import av, math, os, sys
          from PIL import Image, ImageDraw
          p=sys.argv[1]; count=96; saved=[]
          with av.open(p) as c:
              s=c.streams.video[0]
              duration=float(c.duration)/float(av.time_base)
              targets=[duration*i/(count+1) for i in range(1,count+1)]
              ti=0
              for frame in c.decode(s):
                  if ti >= len(targets):
                      break
                  t=float(frame.pts*frame.time_base) if frame.pts is not None else 0.0
                  if t >= targets[ti]:
                      im=Image.fromarray(frame.to_ndarray(format='rgb24'))
                      fp=f'qa_out/audit_frames/frame_{ti+1:03d}_{targets[ti]:07.2f}.jpg'
                      im.save(fp,quality=90)
                      saved.append(fp)
                      ti += 1
          assert len(saved) >= 92
          cards=[]
          for fp in saved:
              im=Image.open(fp).convert('RGB')
              im.thumbnail((480,270))
              card=Image.new('RGB',(500,300),'white')
              card.paste(im,((500-im.width)//2,8))
              ImageDraw.Draw(card).text((10,280),os.path.basename(fp),fill='black')
              cards.append(card)
          cols=4; rows=math.ceil(len(cards)/cols)
          sheet=Image.new('RGB',(cols*500,rows*300),'white')
          for i,im in enumerate(cards):
              sheet.paste(im,((i%cols)*500,(i//cols)*300))
          out='qa_out/Diedrico_3D_to_2D_V8_contact_sheet.jpg'
          sheet.save(out,quality=90)
          print('audit_frames=',len(saved))
          print('duration=',duration)
          print('contact_sheet=PASS')
          PY

      - name: Publish exact validated V8 MP4 under long and short names
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.qa.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.qa.outputs.size }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.parse, urllib.request
          token=os.environ['GH_TOKEN']
          repo=os.environ['GITHUB_REPOSITORY']
          parent=os.environ['GITHUB_SHA']
          branch=os.environ['GITHUB_REF_NAME']
          expected_sha=os.environ['EXPECTED_SHA']
          expected_size=int(os.environ['EXPECTED_SIZE'])
          source='out/Diedrico_3D_to_2D_V8.mp4'
          video=open(source,'rb').read()
          assert hashlib.sha256(video).hexdigest()==expected_sha
          assert len(video)==expected_size
          targets=[
              'published_renders/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_FULL_TOTAL_DOWNLOAD_SAFE_FINAL_pqh.mp4',
              'published_renders/Diedrico_3D_to_2D_V8.mp4',
          ]
          api=f'https://api.github.com/repos/{repo}'
          def req(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(url,data=data,method=method)
              r.add_header('Authorization',f'Bearer {token}')
              r.add_header('Accept','application/vnd.github+json')
              r.add_header('X-GitHub-Api-Version','2022-11-28')
              if data is not None:
                  r.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(r,timeout=180) as f:
                      b=f.read()
                      return json.loads(b) if b else {}
              except urllib.error.HTTPError as e:
                  print(e.read().decode(errors='replace'))
                  raise
          base=req('GET',f'{api}/git/commits/{parent}')
          blob=req('POST',f'{api}/git/blobs',{
              'content':base64.b64encode(video).decode(),
              'encoding':'base64',
          })
          entries=[{'path':t,'mode':'100644','type':'blob','sha':blob['sha']} for t in targets]
          tree=req('POST',f'{api}/git/trees',{'base_tree':base['tree']['sha'],'tree':entries})
          commit=req('POST',f'{api}/git/commits',{
              'message':'Publish Dibujo Tecnico V8 real MP4 [skip ci]',
              'tree':tree['sha'],
              'parents':[parent],
          })
          ref=urllib.parse.quote(branch,safe='/')
          req('PATCH',f'{api}/git/refs/heads/{ref}',{'sha':commit['sha'],'force':False})
          open('qa_out/PUBLISHED_COMMIT.txt','w').write(commit['sha']+'\n')
          print('published_commit=',commit['sha'])
          print('published_blob=',blob['sha'])
          print('published_sha256=',expected_sha)
          PY
          echo "commit_sha=$(cat qa_out/PUBLISHED_COMMIT.txt)" >> "$GITHUB_OUTPUT"

      - name: Verify both direct GitHub MP4 re-downloads byte-for-byte
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.qa.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.qa.outputs.size }}
          PUB_COMMIT: ${{ steps.publish.outputs.commit_sha }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee qa_out/DIRECT_REDOWNLOAD_QA.txt
          import hashlib, os, time, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          commit=os.environ['PUB_COMMIT']
          expected_sha=os.environ['EXPECTED_SHA']
          expected_size=int(os.environ['EXPECTED_SIZE'])
          targets=[
              'published_renders/Diedrico_3D_to_2D_V8.mp4',
              'published_renders/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_FULL_TOTAL_DOWNLOAD_SAFE_FINAL_pqh.mp4',
          ]
          lines=[]
          for target in targets:
              url=f'https://raw.githubusercontent.com/{repo}/{commit}/{target}'
              data=None
              last=None
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(url,timeout=120) as r:
                          data=r.read()
                      break
                  except Exception as e:
                      last=e
                      time.sleep(5)
              if data is None:
                  raise last
              sha=hashlib.sha256(data).hexdigest()
              print('url=',url)
              print('bytes=',len(data))
              print('sha256=',sha)
              assert len(data)==expected_size
              assert sha==expected_sha
              lines.append(url)
          short_raw=lines[0]
          short_blob=f'https://github.com/{repo}/blob/{commit}/published_renders/Diedrico_3D_to_2D_V8.mp4?raw=1'
          with open('qa_out/DIRECT_URLS.txt','w') as f:
              f.write('RAW_PLAYBACK_AND_DOWNLOAD='+short_raw+'\n')
              f.write('GITHUB_FILE_PAGE_RAW='+short_blob+'\n')
          print('DIRECT_REDOWNLOAD=PASS')
          print('short_raw=',short_raw)
          print('short_blob=',short_blob)
          PY

      - name: Upload compact V8 render package
        uses: actions/upload-artifact@v4
        with:
          name: Diedrico_3D_to_2D_V8_FULL_TOTAL_REAL_MP4
          retention-days: 3
          compression-level: 0
          path: |
            out/Diedrico_3D_to_2D_V8.mp4
            out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_FULL_TOTAL_DOWNLOAD_SAFE_FINAL_pqh.mp4
            out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_FULL_TOTAL_DOWNLOAD_SAFE.py
            out/QA_V7_TO_V8_FRESH_REVIEW_AND_DOWNLOAD_FIX.md
            qa_out/VIDEO_QA.txt
            qa_out/FRAME_BY_FRAME_QA.txt
            qa_out/VISUAL_AUDIT.txt
            qa_out/Diedrico_3D_to_2D_V8_contact_sheet.jpg
            qa_out/SHA256SUMS.txt
            qa_out/PUBLISHED_COMMIT.txt
            qa_out/DIRECT_REDOWNLOAD_QA.txt
            qa_out/DIRECT_URLS.txt
