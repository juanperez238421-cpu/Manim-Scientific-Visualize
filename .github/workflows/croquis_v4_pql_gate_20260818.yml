name: Croquis V4 PQL Gate 20260818

on:
  pull_request:
    branches: [house-step-v3-render-20260818]

permissions:
  contents: write

jobs:
  pql:
    if: github.event.pull_request.head.ref == 'croquis-protocol-v1-20260818' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout protocol branch
        uses: actions/checkout@v4
        with:
          ref: croquis-protocol-v1-20260818

      - name: Build exact V4 source from decoded V3
        shell: bash
        run: |
          set -euo pipefail
          python tools/croquis/build_house_v4.py
          python -m py_compile render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V4_CROQUIS_PROTOCOL.py
          sha256sum render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V4_CROQUIS_PROTOCOL.py > V4_SOURCE_SHA256.txt

      - name: Literal PQL render
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          rm -rf media_v4_pql out_v4_pql
          mkdir -p out_v4_pql
          SRC=render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V4_CROQUIS_PROTOCOL.py
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $SRC HouseExtrusion3D --format=mp4 --media_dir media_v4_pql --disable_caching
            " 2>&1 | tee out_v4_pql/render_pql.log
          PQL="$(find media_v4_pql -type f -name 'HouseExtrusion3D.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" out_v4_pql/House_Extrusion_3D_STEP_BY_STEP_V4_CROQUIS_PROTOCOL_pql.mp4
          cp "$SRC" out_v4_pql/
          cp V4_SOURCE_SHA256.txt out_v4_pql/

      - name: Upload PQL gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: House-Croquis-V4-PQL-Gate
          path: out_v4_pql/
          if-no-files-found: error
          retention-days: 7

      - name: Persist exact V4 source on protocol branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add render_jobs/house_step_v3/House_Extrusion_3D_STEP_BY_STEP_V4_CROQUIS_PROTOCOL.py
          git commit -m 'Generate House V4 croquis protocol source' || true
          git push origin HEAD:croquis-protocol-v1-20260818
