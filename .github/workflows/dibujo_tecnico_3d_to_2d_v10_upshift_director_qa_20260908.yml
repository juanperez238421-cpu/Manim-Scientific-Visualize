name: Dibujo Tecnico 3D to 2D V10 UPSHIFT DIRECTOR QA

on:
  push:
    branches:
      - render/dibujo-tecnico-3d-to-2d-v10-upshift-director-qa-20260908
    paths:
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/build_v10_upshift_director.py'
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/QA_V9_TO_V10_DIRECTOR_SAFE_AREA_REVIEW.md'
      - '.github/workflows/dibujo_tecnico_3d_to_2d_v10_upshift_director_qa_20260908.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  render-v10-director-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Generate full V10 source and static QA
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          python "$JOB/build_v10_upshift_director.py"
          V10="$JOB/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V10_UPSHIFT_DIRECTOR_QA.py"
          test -s "$V10"
          python -m py_compile "$V10"
          python - <<'PY'
          from pathlib import Path
          p=Path('render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V10_UPSHIFT_DIRECTOR_QA.py')
          s=p.read_text(encoding='utf-8')
          required=[
              'class Projection3Dto2DV10UpShiftDirectorQA',
              'CAMERA_Z_UPSHIFT = 1.55',
              'CHIP_UPSHIFT = 0.75',
              'FOLD_EXTRA_UPSHIFT = 1.20',
              'FINAL_UPSHIFT = 1.20',
              'fold_center = self.lifted_center',
              'zoom=0.94, frame_center=fold_center',
              'sheet_title.move_to(np.array([0.0, 3.72, 0]))',
              't_panel.move_to(np.array([-1.65,  1.82, 0]))',
              'f_panel.move_to(np.array([-1.65, -1.05, 0]))',
              'final = VGroup(synthesis, note).shift(UP * FINAL_UPSHIFT)',
              'angle=-PI / 2',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          print('V10_STATIC_QA=PASS')
          PY
          mkdir -p /tmp/manim-bin /tmp/manim-home pql_media media out qa_out qa_out/audit_frames
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open

      - name: Full-timeline PQL smoke render
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH HOME=/tmp/manim-home LESSON_TIME_SCALE=0.10
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pql Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V10_UPSHIFT_DIRECTOR_QA.py \
            Projection3Dto2DV10UpShiftDirectorQA --fps 15 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/pql_media" 2>&1 | tee "$GITHUB_WORKSPACE/qa_out/PQL.log"
          cd "$GITHUB_WORKSPACE"
          PQL="$(find pql_media -type f -name 'Projection3Dto2DV10UpShiftDirectorQA.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" qa_out/Diedrico_3D_to_2D_V10_pql.mp4

      - name: Literal PQH final render 1920x1080 30fps
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH HOME=/tmp/manim-home LESSON_TIME_SCALE=1.0
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pqh Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V10_UPSHIFT_DIRECTOR_QA.py \
            Projection3Dto2DV10UpShiftDirectorQA --fps 30 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/media" 2>&1 | tee "$GITHUB_WORKSPACE/out/PQH.log"
          cd "$GITHUB_WORKSPACE"
          VIDEO="$(find media -type f -name 'Projection3Dto2DV10UpShiftDirectorQA.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"
          cp "$VIDEO" out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V10_UPSHIFT_DIRECTOR_QA_FINAL_pqh.mp4
          cp "$VIDEO" out/Diedrico_3D_to_2D_V10.mp4
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V10_UPSHIFT_DIRECTOR_QA.py out/
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/QA_V9_TO_V10_DIRECTOR_SAFE_AREA_REVIEW.md out/

      - name: Technical decode plus director safe-area QA
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Diedrico_3D_to_2D_V10.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/FULL_TOTAL_QA.txt
          import av, numpy as np, statistics, os, sys
          p=sys.argv[1]
          all_w=[]; all_h=[]; main_cy=[]; fold_y1=[]; fold_y0=[]; final_cy=[]
          edge_hits=0; near_blank=0; frames=0; audited=0
          with av.open(p) as c:
              s=c.streams.video[0]
              codec=s.codec_context.name
              width=s.codec_context.width; height=s.codec_context.height
              fmt=s.codec_context.format.name if s.codec_context.format else ''
              fps=float(s.average_rate) if s.average_rate else 0.0
              duration=float(c.duration)/float(av.time_base) if c.duration else 0.0
              for frame in c.decode(s):
                  frames += 1
                  if frames % 6: continue
                  audited += 1
                  t=frames/fps
                  arr=frame.to_ndarray(format='gray')
                  mask=arr < 242
                  ys,xs=np.where(mask)
                  if len(xs):
                      all_w.append(int(xs.max()-xs.min()+1)); all_h.append(int(ys.max()-ys.min()+1))
                  else:
                      all_w.append(0); all_h.append(0)
                  if float(mask.mean()) < 0.0015: near_blank += 1

                  # Ignore first title beat for edge-touch QA.
                  if t >= 4.0:
                      edge_pixels=int((arr[:6,:] < 220).sum() + (arr[-6:,:] < 220).sum())
                      if edge_pixels > 120: edge_hits += 1

                  # Core 3D phase excluding bottom caption strip.
                  if 5.0 <= t <= 59.0:
                      my,mx=np.where(arr[:930,:] < 235)
                      if len(mx) > 200:
                          y0=float(np.percentile(my,1)); y1=float(np.percentile(my,99))
                          main_cy.append((y0+y1)/2)

                  # Literal PH fold: must remain fully framed throughout transition.
                  if 58.0 <= t <= 66.5:
                      fy,fx=np.where(arr < 235)
                      if len(fx) > 200:
                          fold_y0.append(float(np.percentile(fy,0.5)))
                          fold_y1.append(float(np.percentile(fy,99.5)))

                  # Closing synthesis: only nonblank frames near the end.
                  if t >= max(0.0,duration-7.0):
                      fy,fx=np.where(arr < 235)
                      if len(fx) > 500:
                          y0=float(np.percentile(fy,1)); y1=float(np.percentile(fy,99))
                          final_cy.append((y0+y1)/2)

          size=os.path.getsize(p)
          medw=float(statistics.median(all_w)); p10w=float(np.percentile(all_w,10)); medh=float(statistics.median(all_h))
          med_main=float(statistics.median(main_cy))
          fold_max_y1=float(max(fold_y1)); fold_min_y0=float(min(fold_y0))
          final_med=float(statistics.median(final_cy))
          print(f'codec_name={codec}')
          print(f'width={width}')
          print(f'height={height}')
          print(f'pix_fmt={fmt}')
          print(f'average_fps={fps:.6f}')
          print(f'duration={duration:.6f}')
          print(f'frames_decoded={frames}')
          print(f'size={size}')
          print(f'audited_samples={audited}')
          print(f'median_bbox_width={medw}')
          print(f'p10_bbox_width={p10w}')
          print(f'median_bbox_height={medh}')
          print(f'near_blank_samples={near_blank}')
          print(f'median_main_cy={med_main}')
          print(f'fold_max_y1={fold_max_y1}')
          print(f'fold_min_y0={fold_min_y0}')
          print(f'final_median_cy={final_med}')
          print(f'edge_hit_samples={edge_hits}')
          assert codec=='h264' and (width,height)==(1920,1080) and fmt=='yuv420p'
          assert 29.8 <= fps <= 30.2
          assert duration > 90.0 and frames > 2700 and size > 1_000_000
          assert audited > 430 and medw > 750 and p10w > 400 and medh > 250 and near_blank < 30
          assert len(main_cy) > 200 and med_main < 660
          assert len(fold_y1) > 30 and fold_max_y1 < 1072, f'fold touches lower frame: {fold_max_y1}'
          assert fold_min_y0 > 8, f'fold touches upper frame: {fold_min_y0}'
          assert len(final_cy) > 8 and final_med < 620, f'closing still too low: {final_med}'
          assert edge_hits < 10, f'persistent top/bottom clipping samples: {edge_hits}'
          print('TECHNICAL_QA=PASS')
          print('VERTICAL_COMPOSITION_QA=PASS')
          print('FOLD_SAFE_AREA_QA=PASS')
          print('FINAL_UPSHIFT_QA=PASS')
          PY
          SHA="$(sha256sum "$VIDEO" | awk '{print $1}')"
          SIZE="$(stat -c%s "$VIDEO")"
          echo "$SHA  $VIDEO" | tee qa_out/SHA256SUMS.txt
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Generate 120-frame visual contact sheet
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Diedrico_3D_to_2D_V10.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/VISUAL_AUDIT.txt
          import av, math, os, sys
          from PIL import Image, ImageDraw
          p=sys.argv[1]; count=120; saved=[]
          with av.open(p) as c:
              s=c.streams.video[0]; duration=float(c.duration)/float(av.time_base)
              targets=[duration*i/(count+1) for i in range(1,count+1)]; ti=0
              for frame in c.decode(s):
                  if ti>=len(targets): break
                  t=float(frame.pts*frame.time_base) if frame.pts is not None else 0.0
                  if t>=targets[ti]:
                      im=Image.fromarray(frame.to_ndarray(format='rgb24'))
                      fp=f'qa_out/audit_frames/frame_{ti+1:03d}_{targets[ti]:07.2f}.jpg'
                      im.save(fp,quality=90); saved.append(fp); ti+=1
          assert len(saved)>=116
          cards=[]
          for fp in saved:
              im=Image.open(fp).convert('RGB'); im.thumbnail((480,270))
              card=Image.new('RGB',(500,300),'white'); card.paste(im,((500-im.width)//2,8))
              ImageDraw.Draw(card).text((10,280),os.path.basename(fp),fill='black'); cards.append(card)
          cols=4; rows=math.ceil(len(cards)/cols); sheet=Image.new('RGB',(cols*500,rows*300),'white')
          for i,im in enumerate(cards): sheet.paste(im,((i%cols)*500,(i//cols)*300))
          sheet.save('qa_out/Diedrico_3D_to_2D_V10_contact_sheet.jpg',quality=90)
          print('audit_frames=',len(saved)); print('duration=',duration); print('contact_sheet=PASS')
          PY

      - name: Publish validated V10 MP4 and generated full source
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.qa.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.qa.outputs.size }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.parse, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']; parent=os.environ['GITHUB_SHA']; branch=os.environ['GITHUB_REF_NAME']
          expected_sha=os.environ['EXPECTED_SHA']; expected_size=int(os.environ['EXPECTED_SIZE'])
          video=open('out/Diedrico_3D_to_2D_V10.mp4','rb').read()
          assert hashlib.sha256(video).hexdigest()==expected_sha and len(video)==expected_size
          source_path='render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V10_UPSHIFT_DIRECTOR_QA.py'
          source=open(source_path,'rb').read()
          api=f'https://api.github.com/repos/{repo}'
          def req(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(url,data=data,method=method)
              r.add_header('Authorization',f'Bearer {token}'); r.add_header('Accept','application/vnd.github+json'); r.add_header('X-GitHub-Api-Version','2022-11-28')
              if data is not None: r.add_header('Content-Type','application/json')
              with urllib.request.urlopen(r,timeout=180) as f:
                  b=f.read(); return json.loads(b) if b else {}
          base=req('GET',f'{api}/git/commits/{parent}')
          vblob=req('POST',f'{api}/git/blobs',{'content':base64.b64encode(video).decode(),'encoding':'base64'})
          sblob=req('POST',f'{api}/git/blobs',{'content':base64.b64encode(source).decode(),'encoding':'base64'})
          entries=[
              {'path':'published_renders/Diedrico_3D_to_2D_V10.mp4','mode':'100644','type':'blob','sha':vblob['sha']},
              {'path':'published_renders/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V10_UPSHIFT_DIRECTOR_QA_FINAL_pqh.mp4','mode':'100644','type':'blob','sha':vblob['sha']},
              {'path':source_path,'mode':'100644','type':'blob','sha':sblob['sha']},
          ]
          tree=req('POST',f'{api}/git/trees',{'base_tree':base['tree']['sha'],'tree':entries})
          commit=req('POST',f'{api}/git/commits',{'message':'Publish Dibujo Tecnico V10 upshift director QA [skip ci]','tree':tree['sha'],'parents':[parent]})
          ref=urllib.parse.quote(branch,safe='/'); req('PATCH',f'{api}/git/refs/heads/{ref}',{'sha':commit['sha'],'force':False})
          open('qa_out/PUBLISHED_COMMIT.txt','w').write(commit['sha']+'\n')
          print('published_commit=',commit['sha'])
          PY
          echo "commit_sha=$(cat qa_out/PUBLISHED_COMMIT.txt)" >> "$GITHUB_OUTPUT"

      - name: Verify raw GitHub re-download byte-for-byte
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.qa.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.qa.outputs.size }}
          PUB_COMMIT: ${{ steps.publish.outputs.commit_sha }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee qa_out/DIRECT_REDOWNLOAD_QA.txt
          import hashlib, os, time, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; commit=os.environ['PUB_COMMIT']; sha0=os.environ['EXPECTED_SHA']; size0=int(os.environ['EXPECTED_SIZE'])
          for target in ['published_renders/Diedrico_3D_to_2D_V10.mp4','published_renders/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V10_UPSHIFT_DIRECTOR_QA_FINAL_pqh.mp4']:
              url=f'https://raw.githubusercontent.com/{repo}/{commit}/{target}'; data=None
              for _ in range(8):
                  try:
                      with urllib.request.urlopen(url,timeout=120) as r: data=r.read()
                      break
                  except Exception: time.sleep(3)
              assert data is not None
              sha=hashlib.sha256(data).hexdigest(); print(target,'size=',len(data),'sha256=',sha)
              assert len(data)==size0 and sha==sha0
          print('DIRECT_REDOWNLOAD=PASS')
          PY

      - name: Package outputs
        if: always()
        shell: bash
        run: |
          mkdir -p package
          cp -a out/. package/ 2>/dev/null || true
          cp -a qa_out/. package/ 2>/dev/null || true

      - name: Upload V10 real MP4 and full QA package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diedrico_3D_to_2D_V10_UPSHIFT_DIRECTOR_QA_REAL_MP4
          path: package/
          if-no-files-found: error
          retention-days: 3
