name: Statistics10 Normal Distribution Reviewed V3 FINAL PQH 20260922

on:
  push:
    branches:
      - render/stat10-normal-distribution-reviewed-v3-20260922
    paths:
      - 'render_jobs/stat10_normal_distribution_reviewed_v3_20260922/**'
      - '.github/workflows/stat10_normal_distribution_reviewed_v3_pqh_20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout exact V3 branch
        uses: actions/checkout@v4
        with:
          ref: render/stat10-normal-distribution-reviewed-v3-20260922

      - name: Reconstruct V2 base and reviewed V3 source
        shell: bash
        run: |
          set -euo pipefail
          BASE=render_jobs/stat10_normal_distribution_detailed_v2_20260922
          JOB=render_jobs/stat10_normal_distribution_reviewed_v3_20260922

          python "$BASE/bootstrap/decode_source.py" "$BASE"
          python "$JOB/bootstrap/decode_v3.py" "$JOB"
          cp "$BASE/stat10_normal_distribution_class1_detailed_v2.py" "$JOB/"

          git fetch --depth=1 origin render/statistics10-iqr-class02-compare-boxplots-20260831
          git show FETCH_HEAD:render_jobs/statistics10_iqr_class02_compare_boxplots_20260831/jp_classroom_style.py > "$JOB/jp_classroom_style.py"
          git show FETCH_HEAD:render_jobs/statistics10_iqr_class02_compare_boxplots_20260831/check_manim_style.py > "$JOB/check_manim_style.py"

          test -s "$JOB/stat10_normal_distribution_reviewed_v3.py"
          test -s "$JOB/stat10_normal_distribution_class1_detailed_v2.py"
          test -s "$JOB/jp_classroom_style.py"

      - name: Static validation and readability contract
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/stat10_normal_distribution_reviewed_v3_20260922
          SRC="$JOB/stat10_normal_distribution_reviewed_v3.py"

          python -m py_compile             "$SRC"             "$JOB/stat10_normal_distribution_class1_detailed_v2.py"             "$JOB/jp_classroom_style.py"             "$JOB/check_manim_style.py"

          python "$JOB/check_manim_style.py" "$SRC" | tee static_style_qa.txt

          grep -q '^class Statistics10NormalDistributionReviewedV3' "$SRC"
          for method in             opening_v3 roadmap_v3 step1_collect_v3 step2_plot_v3 step3_group_v3             step4_histogram_v3 step5_shape_v3 step6_curve_v3 step7_center_v3             step8_sigma_v3 step8_empirical_v3 glossary_v3_1 glossary_v3_2             glossary_v3_3 glossary_v3_4 shape_check_ab_v3 shape_check_cd_v3             shape_answer_v3 summary_v3 exit_v3; do
            grep -q "def ${method}" "$SRC"
          done

          grep -q 'BODY = 28' "$SRC"
          grep -q 'ACTION = 27' "$SRC"
          grep -q 'STEP_TITLE = 40' "$SRC"
          grep -q 'Glossary — 3 terms per page' "$SRC"
          grep -q 'FadeOut(current_area)' "$SRC"

          if grep -Eq '([A-Za-z]:\\\\|/Users/|/home/[^/]+/Desktop)' "$SRC"; then
            echo 'FAIL: non-portable absolute path found'; exit 1
          fi

          mkdir -p qa_preview final_out/qa package
          sha256sum "$SRC" "$JOB/stat10_normal_distribution_class1_detailed_v2.py" > qa_preview/SOURCE_SHA256SUMS.txt

      - name: Install pinned render and QA environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip imagemagick
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          ffmpeg -version | head -n 1

      - name: Literal PQL complete-timeline runtime gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/stat10_normal_distribution_reviewed_v3_20260922
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -e LESSON_TIME_SCALE=0.05             -v "$PWD:/manim"             -w "/manim/$JOB"             --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql                 stat10_normal_distribution_reviewed_v3.py                 Statistics10NormalDistributionReviewedV3                 --format=mp4                 --media_dir=/manim/media_pql                 --disable_caching
            ' 2>&1 | tee qa_preview/render_pql.log
          PQL="$(find media_pql -type f -name 'Statistics10NormalDistributionReviewedV3.mp4' -print -quit)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render 1080p60
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/stat10_normal_distribution_reviewed_v3_20260922
          rm -rf media_pqh
          docker run --rm --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -e LESSON_TIME_SCALE=1.0             -v "$PWD:/manim"             -w "/manim/$JOB"             --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh                 stat10_normal_distribution_reviewed_v3.py                 Statistics10NormalDistributionReviewedV3                 --format=mp4                 --media_dir=/manim/media_pqh                 --disable_caching
            ' 2>&1 | tee final_out/render_pqh.log
          FINAL="$(find media_pqh -type f -name 'Statistics10NormalDistributionReviewedV3.mp4' -print -quit)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" final_out/Stat10_Normal_Distribution_REVIEWED_V3_FINAL_1080p60.mp4

      - name: Strict technical media QA and complete decode
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Stat10_Normal_Distribution_REVIEWED_V3_FINAL_1080p60.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"

          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tframes\tbytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n'             "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$FRAMES" "$SIZE" > final_out/VIDEO_TECHNICAL.tsv

          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 60/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p

          ffmpeg -nostdin -v error -i "$F" -f null - 2> final_out/full_decode.log
          test ! -s final_out/full_decode.log

      - name: Every-frame blank and border scan
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Stat10_Normal_Distribution_REVIEWED_V3_FINAL_1080p60.mp4
          ffmpeg -nostdin -v error -i "$F" -vf scale=240:135 -pix_fmt gray -f rawvideo final_out/all_frames_gray.raw
          python - <<'PY'
          from pathlib import Path
          import csv
          W,H=240,135
          B=W*H
          raw=Path('final_out/all_frames_gray.raw').read_bytes()
          assert len(raw)%B==0
          n=len(raw)//B
          border=[y*W+x for y in range(H) for x in range(W) if x<4 or x>=W-4 or y<4 or y>=H-4]
          blank=0
          sparse=0
          border_heavy=0
          rows=[]
          for i in range(n):
              fr=raw[i*B:(i+1)*B]
              dark=sum(p<245 for p in fr)
              frac=dark/B
              if dark < 35:
                  blank += 1
              if frac < 0.002:
                  sparse += 1
              bd=sum(fr[j]<235 for j in border)
              br=bd/max(dark,1)
              if br>0.22 and dark>120:
                  border_heavy += 1
              rows.append((i,frac,br))
          with open('final_out/FRAME_BY_FRAME_SCAN.csv','w',newline='') as f:
              w=csv.writer(f)
              w.writerow(['frame','dark_fraction','border_dark_fraction'])
              w.writerows(rows)
          Path('final_out/FRAME_SCAN_SUMMARY.txt').write_text(
              f'frames_scanned={n}\nblank_frames={blank}\nvery_sparse_frames={sparse}\nborder_heavy_frames={border_heavy}\n'
          )
          assert blank < n*0.08
          assert border_heavy < n*0.03
          PY
          rm final_out/all_frames_gray.raw

      - name: Distributed 48-frame visual audit
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Stat10_Normal_Distribution_REVIEWED_V3_FINAL_1080p60.mp4
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          RATE="$(python -c "print(48.0/float('$DUR'))")"
          rm -rf final_out/qa
          mkdir -p final_out/qa
          ffmpeg -nostdin -v error -i "$F" -vf "fps=$RATE,scale=480:270" -q:v 3 final_out/qa/frame_%02d.jpg
          COUNT="$(find final_out/qa -type f -name 'frame_*.jpg' | wc -l)"
          test "$COUNT" -ge 47
          test "$COUNT" -le 49
          montage final_out/qa/frame_*.jpg             -thumbnail 320x180 -tile 6x8 -geometry +6+10 -background white -quality 90             final_out/CONTACT_SHEET_48.jpg
          test -s final_out/CONTACT_SHEET_48.jpg

      - name: Assemble senior QA report and reproducible package
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/stat10_normal_distribution_reviewed_v3_20260922
          F=final_out/Stat10_Normal_Distribution_REVIEWED_V3_FINAL_1080p60.mp4

          sha256sum             "$F"             "$JOB/stat10_normal_distribution_reviewed_v3.py"             "$JOB/stat10_normal_distribution_class1_detailed_v2.py"             "$JOB/V2_REVIEW_AND_V3_FIXES.md"             > final_out/SHA256SUMS.txt

          {
            echo '# Statistics 10 Normal Distribution Reviewed V3 — Senior QA'
            echo
            echo '- V2 scene-by-scene review: COMPLETE'
            echo '- V3 readability redesign: COMPLETE'
            echo '- Python compile: PASS'
            echo '- Static style QA: PASS / warnings reviewed'
            echo '- Literal PQL full-timeline gate: PASS'
            echo '- Literal PQH 1080p60 render: PASS'
            echo '- Full FFmpeg decode: PASS'
            echo '- Every-frame blank/border scan: PASS'
            echo '- Distributed 48-frame visual audit sheet: generated'
            echo '- Dense 6-row glossary pages replaced by 3-term pages: PASS'
            echo '- Four-chart crowded classification replaced by split comparisons: PASS'
            echo '- Empirical-rule morph/merge transitions replaced by isolated fades: PASS'
            echo
            cat final_out/VIDEO_TECHNICAL.tsv
            echo
            cat final_out/FRAME_SCAN_SUMMARY.txt
          } > final_out/SENIOR_QA_RESULT.md

          ROOT=package/Stat10_Normal_Distribution_REVIEWED_V3_FINAL_PROJECT
          mkdir -p "$ROOT/src" "$ROOT/qa" "$ROOT/render" "$ROOT/docs"
          cp "$JOB/stat10_normal_distribution_reviewed_v3.py" "$ROOT/src/"
          cp "$JOB/stat10_normal_distribution_class1_detailed_v2.py" "$ROOT/src/"
          cp "$JOB/jp_classroom_style.py" "$JOB/check_manim_style.py" "$ROOT/src/"
          cp "$JOB/V2_REVIEW_AND_V3_FIXES.md" "$ROOT/docs/"
          cp "$F" "$ROOT/render/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/FRAME_SCAN_SUMMARY.txt              final_out/FRAME_BY_FRAME_SCAN.csv final_out/CONTACT_SHEET_48.jpg              final_out/SENIOR_QA_RESULT.md final_out/SHA256SUMS.txt final_out/full_decode.log              "$ROOT/qa/"
          cp qa_preview/render_pql.log qa_preview/SOURCE_SHA256SUMS.txt static_style_qa.txt "$ROOT/qa/"
          cp final_out/qa/frame_*.jpg "$ROOT/qa/"

          (cd package && zip -qr Stat10_Normal_Distribution_REVIEWED_V3_FULL_PACKAGE.zip Stat10_Normal_Distribution_REVIEWED_V3_FINAL_PROJECT)
          sha256sum package/Stat10_Normal_Distribution_REVIEWED_V3_FULL_PACKAGE.zip > package/PACKAGE_SHA256.txt

      - name: Upload reviewed V3 final artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stat10-Normal-Distribution-REVIEWED-V3-FINAL-1080p60-20260922
          path: |
            final_out/Stat10_Normal_Distribution_REVIEWED_V3_FINAL_1080p60.mp4
            final_out/VIDEO_TECHNICAL.tsv
            final_out/FRAME_SCAN_SUMMARY.txt
            final_out/FRAME_BY_FRAME_SCAN.csv
            final_out/CONTACT_SHEET_48.jpg
            final_out/SENIOR_QA_RESULT.md
            final_out/SHA256SUMS.txt
            final_out/qa/
            package/Stat10_Normal_Distribution_REVIEWED_V3_FULL_PACKAGE.zip
            package/PACKAGE_SHA256.txt
            render_jobs/stat10_normal_distribution_reviewed_v3_20260922/stat10_normal_distribution_reviewed_v3.py
            render_jobs/stat10_normal_distribution_reviewed_v3_20260922/V2_REVIEW_AND_V3_FIXES.md
          if-no-files-found: error
          retention-days: 14
