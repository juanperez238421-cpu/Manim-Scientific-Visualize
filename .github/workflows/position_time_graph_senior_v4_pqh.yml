name: Position-Time Graph Senior V4 Full Protocol PQH

on:
  push:
    branches: [agent/position-time-graph-senior-20260816]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Prepare audited source and exact JP style
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/position_time_graph_20260816
          mkdir -p "$JOB/build_v4" qa_v4 out_v4
          cp "$JOB/position_time_graph_senior_v2.py" "$JOB/build_v4/position_time_graph_senior.py"
          base64 -d "$JOB/style.py.gz.b64" | gzip -dc > "$JOB/build_v4/jp_classroom_style.py"
          python - <<'PY'
          from pathlib import Path
          p=Path('render_jobs/position_time_graph_20260816/build_v4/position_time_graph_senior.py')
          s=p.read_text()
          old='''        cursor = Dot(axes.c2p(0, 0), radius=0.12, color=BLACK)\n        vertical = always_redraw(lambda: DashedLine(axes.c2p(self._story_t.get_value(), 0), axes.c2p(self._story_t.get_value(), position_at(self._story_t.get_value())), color=MID_GRAY, stroke_width=1.6))\n        self._story_t = ValueTracker(0)\n'''
          new='''        self._story_t = ValueTracker(0)\n        cursor = Dot(axes.c2p(0, 0), radius=0.12, color=BLACK)\n        vertical = always_redraw(lambda: DashedLine(axes.c2p(self._story_t.get_value(), 0), axes.c2p(self._story_t.get_value(), position_at(self._story_t.get_value())), color=MID_GRAY, stroke_width=1.6))\n'''
          if old not in s:
              raise SystemExit('expected scene-11 tracker block not found')
          p.write_text(s.replace(old,new,1))
          PY
          python -m py_compile "$JOB/build_v4/position_time_graph_senior.py" "$JOB/build_v4/jp_classroom_style.py"
          STYLE_SHA="$(sha256sum "$JOB/build_v4/jp_classroom_style.py" | awk '{print $1}')"
          test "$STYLE_SHA" = "3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d"
          ! grep -Eq '[A-Za-z]:\\|/Users/|/home/[^/]+/' "$JOB/build_v4/position_time_graph_senior.py"
          cp "$JOB/PRE_RENDER_SENIOR_QA.md" qa_v4/
          printf 'STYLE_SHA256=%s\nPY_COMPILE=PASS\nSCENE11_TRACKER_ORDER=PASS\n' "$STYLE_SHA" > qa_v4/STATIC_QA.txt

      - name: Install render tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL runtime QA and timing calibration
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/position_time_graph_20260816
          rm -rf media_pql_v4
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB/build_v4" --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql position_time_graph_senior.py PositionTimeGraphSenior --fps 15 --format=mp4 --media_dir /manim/media_pql_v4 --disable_caching
            ' 2>&1 | tee qa_v4/render_pql.log
          P="$(find media_pql_v4 -type f -name 'PositionTimeGraphSenior.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$P" && test -s "$P"
          BASE="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$P")"
          SCALE="$(python - <<PY
          b=float('$BASE'); print(max(0.90,min(2.10,330.0/b)))
          PY
          )"
          printf 'PQL_DURATION=%s\nFINAL_LESSON_TIME_SCALE=%s\nTARGET_DURATION=330\n' "$BASE" "$SCALE" | tee qa_v4/TIMING_CALIBRATION.txt
          echo "FINAL_SCALE=$SCALE" >> "$GITHUB_ENV"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/position_time_graph_20260816
          rm -rf media_pqh_v4 out_v4 && mkdir -p out_v4
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE="$FINAL_SCALE" \
            -v "$PWD:/manim" -w "/manim/$JOB/build_v4" --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh position_time_graph_senior.py PositionTimeGraphSenior --fps 30 --format=mp4 --media_dir /manim/media_pqh_v4 --disable_caching
            ' 2>&1 | tee out_v4/render_pqh.log
          F="$(find media_pqh_v4 -type f -name 'PositionTimeGraphSenior.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$F" && test -s "$F"
          cp "$F" out_v4/PositionTimeGraph_Senior_FINAL_V4_pqh.mp4

      - name: Strict technical verification
        shell: bash
        run: |
          set -euo pipefail
          F=out_v4/PositionTimeGraph_Senior_FINAL_V4_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          C="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          P="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          D="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          S="$(stat -c%s "$F")"
          test "$W" = 1920; test "$H" = 1080; test "$FPS" = 30/1; test "$C" = h264; test "$P" = yuv420p
          python - <<PY
          d=float('$D'); assert 240 <= d <= 420, d
          PY
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out_v4/FULL_DECODE.log
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize_bytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$C" "$P" "$D" "$S" > out_v4/VIDEO_TECHNICAL.tsv
          sha256sum "$F" > out_v4/SHA256SUMS.txt
          echo STRICT_TECHNICAL_QA=PASS > out_v4/VERIFY_RESULTS.txt

      - name: Dense frame and motion audit
        shell: bash
        run: |
          set -euo pipefail
          F=out_v4/PositionTimeGraph_Senior_FINAL_V4_pqh.mp4
          mkdir -p out_v4/audit_frames
          ffmpeg -nostdin -hide_banner -loglevel error -i "$F" -vf 'fps=1/4,scale=960:-2' -q:v 3 out_v4/audit_frames/%04d.jpg
          COUNT="$(find out_v4/audit_frames -name '*.jpg' | wc -l)"; test "$COUNT" -ge 60
          ffmpeg -nostdin -hide_banner -i "$F" -vf 'freezedetect=n=0.002:d=1.5' -an -f null - 2> out_v4/FREEZEDETECT.log || true
          python - <<'PY'
          import re
          from pathlib import Path
          d=float(Path('out_v4/VIDEO_TECHNICAL.tsv').read_text().splitlines()[1].split('\t')[5])
          xs=[float(x) for x in re.findall(r'freeze_duration: ([0-9.]+)',Path('out_v4/FREEZEDETECT.log').read_text(errors='ignore'))]
          total=sum(xs); longest=max(xs) if xs else 0.0
          Path('out_v4/MOTION_AUDIT.tsv').write_text('duration\tfreeze_total_ge_1p5s\tfreeze_ratio\tintervals\tlongest_freeze\n'+f'{d:.3f}\t{total:.3f}\t{total/d:.4f}\t{len(xs)}\t{longest:.3f}\n')
          PY
          echo AUDIT_FRAME_COUNT=$COUNT > out_v4/AUDIT_INFO.txt

      - name: Build audited package
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/position_time_graph_20260816
          cp "$JOB/build_v4/position_time_graph_senior.py" out_v4/
          cp "$JOB/build_v4/jp_classroom_style.py" out_v4/
          cp qa_v4/PRE_RENDER_SENIOR_QA.md out_v4/
          cp qa_v4/STATIC_QA.txt out_v4/
          cp qa_v4/TIMING_CALIBRATION.txt out_v4/
          cp qa_v4/render_pql.log out_v4/
          D="$(awk 'NR==2 {print $6}' out_v4/VIDEO_TECHNICAL.tsv)"
          SHA="$(awk '{print $1}' out_v4/SHA256SUMS.txt)"
          STYLE_SHA="$(awk -F= '/STYLE_SHA256/ {print $2}' qa_v4/STATIC_QA.txt)"
          MOTION="$(tail -n1 out_v4/MOTION_AUDIT.tsv)"
          cat > out_v4/POST_RENDER_SENIOR_QA.md <<EOF
          # Position-Time Graph — Senior Post-Render QA

          ## Full protocol result
          **PASS**

          - ManimCE 0.20.1
          - literal -pql: PASS
          - literal -pqh: PASS
          - 1920x1080 @ 30 fps
          - H.264 / yuv420p
          - duration: ${D} s
          - full FFmpeg decode: PASS
          - exact JP style SHA-256: ${STYLE_SHA}
          - MP4 SHA-256: ${SHA}

          ## Senior design review
          The lesson is structured as physical motion -> data -> axes -> ordered pairs -> graph trace -> coordinate reading -> slope/velocity -> graph-to-motion reconstruction -> tangent preview -> summary method.

          ## Motion audit
          ${MOTION}
          EOF
          (cd out_v4 && zip -9 -r PositionTimeGraph_Senior_FINAL_V4_FULL_PROTOCOL_Package.zip . >/dev/null)

      - uses: actions/upload-artifact@v4
        with:
          name: PositionTimeGraph-Senior-FINAL-V4-FULL-PROTOCOL
          path: out_v4/
          retention-days: 7
