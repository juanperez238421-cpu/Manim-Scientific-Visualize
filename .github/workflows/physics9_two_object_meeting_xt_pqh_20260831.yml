name: Physics 9 Two-Object Position-Time Meeting SENIOR QA PQH 20260831

on:
  push:
    branches:
      - render/physics9-two-object-meeting-xt-20260831
    paths:
      - 'render_jobs/physics9_two_object_meeting_xt_20260831/**'
      - '.github/workflows/physics9_two_object_meeting_xt_pqh_20260831.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render/physics9-two-object-meeting-xt-20260831

      - name: Validate exact source and lesson contract
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_two_object_meeting_xt_20260831
          SRC="$JOB/two_object_meeting_xt.py"
          STORY="$JOB/STORYBOARD.md"
          QA="$JOB/SENIOR_QA_TARGETS.md"
          V3=render_jobs/physics9_position_time_graph_construction_v3_20260828/position_time_graph_construction_v3.py
          STYLE=render_jobs/physics9_position_time_velocity_workshop_20260824/jp_classroom_style.py
          test -s "$SRC"; test -s "$STORY"; test -s "$QA"; test -s "$V3"; test -s "$STYLE"
          python -m py_compile "$SRC" "$V3" "$STYLE"
          grep -q 'class Physics9TwoObjectMeetingXT' "$SRC"
          grep -q 'x=x_0+vt' "$SRC"
          grep -q 'x_A=1+2t' "$SRC"
          grep -q 'x_B=13-t' "$SRC"
          grep -q 't_{meet}=4' "$SRC"
          grep -q 'x_{meet}=9' "$SRC"
          grep -q 'STUDENT CHECK' "$SRC"
          grep -q 'SAME MEETING, TWO REPRESENTATIONS' "$SRC"
          if grep -q 'ReplacementTransform(state' "$SRC"; then
            echo 'FAIL: semantic state-card morph regression.'; exit 1
          fi
          mkdir -p qa_preview
          sha256sum "$SRC" "$STORY" "$QA" "$V3" "$STYLE" > qa_preview/SOURCE_SHA256SUMS.txt

      - name: Prepare pinned ManimCE environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip imagemick
        continue-on-error: true

      - name: Ensure QA dependencies and Docker image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip imagemagick
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL runtime gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_two_object_meeting_xt_20260831
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.06 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql two_object_meeting_xt.py Physics9TwoObjectMeetingXT \
                --format=mp4 --media_dir=/manim/media_pql --disable_caching
            ' 2>&1 | tee qa_preview/render_pql.log
          PQL="$(find media_pql -type f -name 'Physics9TwoObjectMeetingXT.mp4' -print -quit)"
          test -n "$PQL" && test -s "$PQL"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_two_object_meeting_xt_20260831
          rm -rf media_pqh final_out package
          mkdir -p final_out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh two_object_meeting_xt.py Physics9TwoObjectMeetingXT \
                --format=mp4 --media_dir=/manim/media_pqh --disable_caching
            ' 2>&1 | tee final_out/render_pqh.log
          FINAL="$(find media_pqh -type f -name 'Physics9TwoObjectMeetingXT.mp4' -print -quit)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" final_out/Physics9_Two_Object_Position_Time_Meeting_SENIOR_QA_FINAL_pqh.mp4

      - name: Strict technical QA and full decode
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Two_Object_Position_Time_Meeting_SENIOR_QA_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tframes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$FRAMES" > final_out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920; test "$H" = 1080; test "$FPS" = 30/1; test "$CODEC" = h264; test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> final_out/full_decode.log
          test ! -s final_out/full_decode.log
          sha256sum "$F" > final_out/SHA256SUMS.txt

      - name: Every-frame blank border and density scan
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Two_Object_Position_Time_Meeting_SENIOR_QA_FINAL_pqh.mp4
          ffmpeg -nostdin -v error -i "$F" -vf scale=320:180 -pix_fmt gray -f rawvideo final_out/all_frames_gray.raw
          python - <<'PY'
          from pathlib import Path
          import csv
          W,H=320,180; B=W*H
          raw=Path('final_out/all_frames_gray.raw').read_bytes(); assert len(raw)%B==0
          n=len(raw)//B
          blank=sparse=border_heavy=0
          border_idx=[y*W+x for y in range(H) for x in range(W) if x<5 or x>=W-5 or y<5 or y>=H-5]
          rows=[]
          for i in range(n):
              fr=raw[i*B:(i+1)*B]
              dark_n=sum(p<245 for p in fr); frac=dark_n/B
              if dark_n==0: blank+=1
              if frac<0.004: sparse+=1
              border=sum(fr[j]<235 for j in border_idx)
              border_frac=border/max(dark_n,1)
              if border_frac>0.20 and dark_n>200: border_heavy+=1
              rows.append((i,frac,border_frac))
          with open('final_out/FRAME_BY_FRAME_SCAN.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['frame','dark_fraction','border_dark_fraction']); w.writerows(rows)
          Path('final_out/FRAME_SCAN_SUMMARY.txt').write_text(
              f'frames_scanned={n}\nblank_frames={blank}\nvery_sparse_frames={sparse}\nborder_heavy_frames={border_heavy}\n')
          assert blank < n*0.08
          assert sparse < n*0.12
          assert border_heavy < n*0.02
          PY
          rm final_out/all_frames_gray.raw

      - name: Dense 96-frame visual audit and targeted meeting frames
        shell: bash
        run: |
          set -euo pipefail
          F=final_out/Physics9_Two_Object_Position_Time_Meeting_SENIOR_QA_FINAL_pqh.mp4
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          mkdir -p final_out/audit_frames final_out/targeted_frames
          for INDEX in $(seq -w 0 95); do
            T="$(python -c "print(float('$DUR')*(int('$INDEX')+0.5)/96.0)")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "final_out/audit_frames/frame_${INDEX}.png"
          done
          for PCT in 48 52 56 60 64 68 72 76; do
            T="$(python -c "print(float('$DUR')*$PCT/100.0)")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "final_out/targeted_frames/pct_${PCT}.png"
          done
          montage final_out/audit_frames/*.png \
            -thumbnail 384x216 -tile 6x16 -geometry +8+14 -background white -quality 90 final_out/CONTACT_SHEET_96.jpg
          montage final_out/targeted_frames/*.png \
            -thumbnail 480x270 -tile 4x2 -geometry +8+14 -background white -quality 90 final_out/CONTACT_SHEET_TARGETED.jpg
          test -s final_out/CONTACT_SHEET_96.jpg
          test -s final_out/CONTACT_SHEET_TARGETED.jpg

      - name: Build reproducible package and publish delivery
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_two_object_meeting_xt_20260831
          ROOT=package/Physics9_Two_Object_Position_Time_Meeting_SENIOR_QA_FINAL_PQH_PROJECT
          mkdir -p "$ROOT/src" "$ROOT/storyboard" "$ROOT/qa/audit_frames" "$ROOT/qa/targeted_frames" "$ROOT/protocol" "$ROOT/workflow"
          cp "$JOB/two_object_meeting_xt.py" "$ROOT/src/"
          cp "$JOB/STORYBOARD.md" "$ROOT/storyboard/"
          cp "$JOB/SENIOR_QA_TARGETS.md" "$ROOT/qa/"
          cp render_jobs/physics9_position_time_graph_construction_v3_20260828/position_time_graph_construction_v3.py "$ROOT/src/"
          cp render_jobs/physics9_position_time_velocity_workshop_20260824/jp_classroom_style.py "$ROOT/src/"
          cp final_out/Physics9_Two_Object_Position_Time_Meeting_SENIOR_QA_FINAL_pqh.mp4 "$ROOT/render.mp4"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/SHA256SUMS.txt final_out/full_decode.log final_out/render_pqh.log \
             final_out/FRAME_SCAN_SUMMARY.txt final_out/FRAME_BY_FRAME_SCAN.csv final_out/CONTACT_SHEET_96.jpg final_out/CONTACT_SHEET_TARGETED.jpg "$ROOT/qa/"
          cp final_out/audit_frames/*.png "$ROOT/qa/audit_frames/"
          cp final_out/targeted_frames/*.png "$ROOT/qa/targeted_frames/"
          cp protocols/PROTOCOL_MANIMCE_PQH_PROJECT_PACKAGE_STANDARD.md "$ROOT/protocol/" || true
          cp .github/workflows/physics9_two_object_meeting_xt_pqh_20260831.yml "$ROOT/workflow/"
          (cd package && zip -qr Physics9_Two_Object_Position_Time_Meeting_SENIOR_QA_FINAL_PQH_PROJECT.zip Physics9_Two_Object_Position_Time_Meeting_SENIOR_QA_FINAL_PQH_PROJECT)
          sha256sum package/Physics9_Two_Object_Position_Time_Meeting_SENIOR_QA_FINAL_PQH_PROJECT.zip > package/PACKAGE_SHA256.txt

          DEST=deliveries/physics9_two_object_meeting_xt_20260831
          mkdir -p "$DEST"
          cp final_out/Physics9_Two_Object_Position_Time_Meeting_SENIOR_QA_FINAL_pqh.mp4 "$DEST/"
          cp final_out/VIDEO_TECHNICAL.tsv final_out/SHA256SUMS.txt final_out/FRAME_SCAN_SUMMARY.txt final_out/CONTACT_SHEET_96.jpg final_out/CONTACT_SHEET_TARGETED.jpg "$DEST/"
          cp package/Physics9_Two_Object_Position_Time_Meeting_SENIOR_QA_FINAL_PQH_PROJECT.zip "$DEST/"
          cp package/PACKAGE_SHA256.txt "$DEST/"

          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m 'render: publish Physics 9 two-object meeting senior QA'
            git push origin HEAD:render/physics9-two-object-meeting-xt-20260831
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Physics9-Two-Object-Position-Time-Meeting-SENIOR-QA-FINAL-PQH
          path: |
            final_out/Physics9_Two_Object_Position_Time_Meeting_SENIOR_QA_FINAL_pqh.mp4
            package/Physics9_Two_Object_Position_Time_Meeting_SENIOR_QA_FINAL_PQH_PROJECT.zip
            package/PACKAGE_SHA256.txt
            final_out/VIDEO_TECHNICAL.tsv
            final_out/SHA256SUMS.txt
            final_out/FRAME_SCAN_SUMMARY.txt
            final_out/CONTACT_SHEET_96.jpg
            final_out/CONTACT_SHEET_TARGETED.jpg
          if-no-files-found: error
          retention-days: 14
