name: History of Velocity V6 Full Protocol PQH

on:
  push:
    branches: [agent/history-of-velocity-pqh-20260816]
    paths:
      - 'render_jobs/history_velocity_20260816/history_of_velocity_FINAL_V6.py'
      - '.github/workflows/history_velocity_v6_full_protocol_pqh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact lesson stack and compile
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/history_velocity_20260816
          cat "$JOB"/h_*.b64 | base64 -d | gzip -dc > "$JOB/history_of_velocity.py"
          cat "$JOB"/s_*.b64 | base64 -d | gzip -dc > "$JOB/jp_classroom_style.py"
          if [ -f "$JOB/apply_v3_final_layout_patch.py" ]; then
            (cd "$JOB" && python apply_v3_final_layout_patch.py history_of_velocity.py)
          fi
          cp "$JOB/history_of_velocity.py" "$JOB/history_of_velocity_FINAL_V3.py"
          python -m py_compile \
            "$JOB/history_of_velocity_FINAL_V3.py" \
            "$JOB/history_of_velocity_FINAL_V4.py" \
            "$JOB/history_of_velocity_FINAL_V5.py" \
            "$JOB/history_of_velocity_FINAL_V6.py" \
            "$JOB/jp_classroom_style.py"
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('render_jobs/history_velocity_20260816/history_of_velocity_FINAL_V6.py')
          s=p.read_text(encoding='utf-8')
          bad=[r'[A-Za-z]:\\', r'/Users/', r'/home/[^/]+/Desktop']
          assert not any(re.search(x,s) for x in bad), 'absolute path detected in V6'
          assert 'class HistoryOfVelocityV6' in s
          print('STATIC_QA_PASS')
          PY
          sha256sum "$JOB/jp_classroom_style.py" "$JOB/history_of_velocity_FINAL_V6.py" | tee SOURCE_SHA256.txt

      - name: Install verification tools and ManimCE Docker image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip imagemagick
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL runtime QA and timing calibration
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/history_velocity_20260816
          rm -rf media_pql qa && mkdir -p qa
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pql history_of_velocity_FINAL_V6.py HistoryOfVelocityV6 \
                --fps 15 --format=mp4 --media_dir /manim/media_pql --disable_caching
            ' 2>&1 | tee qa/render_pql.log
          P="$(find media_pql -type f -name 'HistoryOfVelocityV6.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$P" && test -s "$P"
          BASE="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$P")"
          SCALE="$(python - <<PY
          b=float('$BASE')
          target=540.0
          s=target/b
          print(max(1.0,min(1.85,s)))
          PY
          )"
          printf 'base_duration=%s\nfinal_scale=%s\ntarget_duration=540\n' "$BASE" "$SCALE" | tee qa/timing.txt
          echo "FINAL_SCALE=$SCALE" >> "$GITHUB_ENV"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/history_velocity_20260816
          rm -rf media out && mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE="$FINAL_SCALE" \
            -v "$PWD:/manim" -w "/manim/$JOB" \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:$PATH
              manim -pqh history_of_velocity_FINAL_V6.py HistoryOfVelocityV6 \
                --fps 30 --format=mp4 --media_dir /manim/media --disable_caching
            ' 2>&1 | tee out/render_pqh.log
          F="$(find media -type f -name 'HistoryOfVelocityV6.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$F" && test -s "$F"
          cp "$F" out/HistoryOfVelocity_Senior_FINAL_V6_FULL_PROTOCOL_pqh.mp4

      - name: Strict technical verification
        shell: bash
        run: |
          set -euo pipefail
          F=out/HistoryOfVelocity_Senior_FINAL_V6_FULL_PROTOCOL_pqh.mp4
          test -s "$F"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          C="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          P="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          D="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          S="$(stat -c%s "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize_bytes\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$C" "$P" "$D" "$S" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$C" = h264
          test "$P" = yuv420p
          python - <<PY
          d=float('$D')
          assert 480.0 <= d <= 720.0, f'duration outside 8-12 min: {d}'
          print(f'DURATION_PASS={d:.3f}s')
          PY
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          echo FULL_DECODE_PASS
          sha256sum "$F" > out/SHA256SUMS.txt
          cp SOURCE_SHA256.txt out/SOURCE_SHA256.txt
          cp qa/timing.txt out/timing.txt
          cp qa/render_pql.log out/render_pql.log

      - name: Dense motion and frame audit
        shell: bash
        run: |
          set -euo pipefail
          F=out/HistoryOfVelocity_Senior_FINAL_V6_FULL_PROTOCOL_pqh.mp4
          mkdir -p out/audit_frames
          ffmpeg -nostdin -hide_banner -i "$F" \
            -vf 'freezedetect=n=0.002:d=1.5' -an -f null - 2> out/freezedetect.log || true
          ffmpeg -nostdin -hide_banner -loglevel error -i "$F" \
            -vf 'fps=1/12,scale=960:-2' -q:v 3 out/audit_frames/%04d.jpg
          python - <<'PY'
          import re
          from pathlib import Path
          txt=Path('out/freezedetect.log').read_text(errors='ignore')
          ds=[float(x) for x in re.findall(r'freeze_duration: ([0-9.]+)',txt)]
          tech=Path('out/VIDEO_TECHNICAL.tsv').read_text().splitlines()[1].split('\t')
          d=float(tech[5])
          frozen=sum(ds)
          longest=max(ds) if ds else 0.0
          Path('out/MOTION_AUDIT.tsv').write_text(
              'duration\tfrozen_ge_1p5s\tfrozen_ratio\tfreeze_intervals\tlongest_freeze\n'
              f'{d:.3f}\t{frozen:.3f}\t{frozen/d:.4f}\t{len(ds)}\t{longest:.3f}\n'
          )
          frames=sorted(Path('out/audit_frames').glob('*.jpg'))
          assert len(frames) >= 35, f'not enough audit frames: {len(frames)}'
          print('AUDIT_FRAMES_PASS', len(frames))
          PY

      - name: Build audited delivery package
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/history_velocity_20260816
          cp "$JOB/history_of_velocity_FINAL_V3.py" out/
          cp "$JOB/history_of_velocity_FINAL_V4.py" out/
          cp "$JOB/history_of_velocity_FINAL_V5.py" out/
          cp "$JOB/history_of_velocity_FINAL_V6.py" out/
          cp "$JOB/jp_classroom_style.py" out/
          cat > out/RENDER_INFO.txt <<EOF
          ManimCE: 0.20.1
          Preview command: manim -pql history_of_velocity_FINAL_V6.py HistoryOfVelocityV6 --fps 15 --format=mp4 --disable_caching
          Final command: manim -pqh history_of_velocity_FINAL_V6.py HistoryOfVelocityV6 --fps 30 --format=mp4 --disable_caching
          Final LESSON_TIME_SCALE: $FINAL_SCALE
          EOF
          cd out
          zip -9 -r HistoryOfVelocity_Senior_FINAL_V6_FULL_PROTOCOL_Package.zip \
            HistoryOfVelocity_Senior_FINAL_V6_FULL_PROTOCOL_pqh.mp4 \
            history_of_velocity_FINAL_V3.py history_of_velocity_FINAL_V4.py \
            history_of_velocity_FINAL_V5.py history_of_velocity_FINAL_V6.py \
            jp_classroom_style.py VIDEO_TECHNICAL.tsv MOTION_AUDIT.tsv \
            SHA256SUMS.txt SOURCE_SHA256.txt RENDER_INFO.txt timing.txt \
            full_decode.log freezedetect.log audit_frames >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: HistoryOfVelocity-V6-FULL-PROTOCOL-PQH
          path: out/
          if-no-files-found: error
          retention-days: 7
