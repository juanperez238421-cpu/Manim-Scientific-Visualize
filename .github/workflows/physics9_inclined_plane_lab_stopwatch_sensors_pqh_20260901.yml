name: Physics9 Inclined Plane Lab Stopwatch + Sensors PQH 20260901

on:
  pull_request:
    paths:
      - 'render_jobs/physics9_inclined_plane_lab_20260901/**'
      - '.github/workflows/physics9_inclined_plane_lab_stopwatch_sensors_pqh_20260901.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-lab-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout branch / PR head
        uses: actions/checkout@v4

      - name: Validate source and install QA tools
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_inclined_plane_lab_20260901
          SRC="$JOB/Physics9_Inclined_Plane_Lab_Stopwatch_Sensors_FINAL.py"
          test -s "$SRC"
          python -m py_compile "$SRC"
          grep -q '^class Physics9InclinedPlaneLabMaster' "$SRC"
          grep -q '^class Physics9InclinedPlaneLabStopwatch' "$SRC"
          grep -q '^class Physics9InclinedPlaneLabSensors' "$SRC"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick zip
          python -m pip install --quiet opencv-python-headless
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          mkdir -p qa_preview final_out package

      - name: Literal PQL full-timeline gate — all three scenes
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_inclined_plane_lab_20260901
          rm -rf media_pql_lab
          for SCENE in Physics9InclinedPlaneLabMaster Physics9InclinedPlaneLabStopwatch Physics9InclinedPlaneLabSensors; do
            docker run --rm --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.07 \
              -v "$PWD:/manim" -w "/manim/$JOB" \
              --entrypoint bash manimcommunity/manim:v0.20.1 -c "
                set -euo pipefail
                mkdir -p /tmp/manim-bin
                printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
                chmod +x /tmp/manim-bin/xdg-open
                export PATH=/tmp/manim-bin:\$PATH
                manim -pql Physics9_Inclined_Plane_Lab_Stopwatch_Sensors_FINAL.py $SCENE \\
                  --format=mp4 --media_dir=/manim/media_pql_lab --disable_caching
              " 2>&1 | tee "qa_preview/${SCENE}_pql.log"
          done
          for SCENE in Physics9InclinedPlaneLabMaster Physics9InclinedPlaneLabStopwatch Physics9InclinedPlaneLabSensors; do
            F="$(find media_pql_lab -type f -name "${SCENE}.mp4" -print -quit)"
            test -n "$F" && test -s "$F"
          done

      - name: Literal PQH final render — master + stopwatch + sensors
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_inclined_plane_lab_20260901
          rm -rf media_pqh_lab
          for SCENE in Physics9InclinedPlaneLabMaster Physics9InclinedPlaneLabStopwatch Physics9InclinedPlaneLabSensors; do
            docker run --rm --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
              -v "$PWD:/manim" -w "/manim/$JOB" \
              --entrypoint bash manimcommunity/manim:v0.20.1 -c "
                set -euo pipefail
                mkdir -p /tmp/manim-bin
                printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
                chmod +x /tmp/manim-bin/xdg-open
                export PATH=/tmp/manim-bin:\$PATH
                manim -pqh Physics9_Inclined_Plane_Lab_Stopwatch_Sensors_FINAL.py $SCENE \\
                  --format=mp4 --media_dir=/manim/media_pqh_lab --disable_caching
              " 2>&1 | tee "final_out/${SCENE}_pqh.log"
            F="$(find media_pqh_lab -type f -name "${SCENE}.mp4" -print -quit)"
            test -n "$F" && test -s "$F"
            cp "$F" "final_out/${SCENE}_FINAL_pqh.mp4"
          done

      - name: Technical QA, decode, edge scan, and visual contact sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final_out/qa
          for SCENE in Physics9InclinedPlaneLabMaster Physics9InclinedPlaneLabStopwatch Physics9InclinedPlaneLabSensors; do
            V="final_out/${SCENE}_FINAL_pqh.mp4"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 "$V" | tee "final_out/qa/${SCENE}_ffprobe.txt"
            grep -q '^codec_name=h264$' "final_out/qa/${SCENE}_ffprobe.txt"
            grep -q '^width=1920$' "final_out/qa/${SCENE}_ffprobe.txt"
            grep -q '^height=1080$' "final_out/qa/${SCENE}_ffprobe.txt"
            ffmpeg -v error -i "$V" -f null -

            mkdir -p "final_out/qa/${SCENE}_frames"
            ffmpeg -v error -i "$V" -vf "fps=1/1,scale=480:-1" \
              "final_out/qa/${SCENE}_frames/sec_%03d.jpg"
            mapfile -t FRAMES < <(find "final_out/qa/${SCENE}_frames" -type f -name '*.jpg' | sort)
            N=${#FRAMES[@]}
            if [ "$N" -gt 36 ]; then
              SEL=()
              for i in $(seq 0 35); do
                idx=$(( i * (N - 1) / 35 ))
                SEL+=("${FRAMES[$idx]}")
              done
            else
              SEL=("${FRAMES[@]}")
            fi
            montage "${SEL[@]}" -tile 6x -geometry +3+3 -background white \
              "final_out/qa/${SCENE}_CONTACT_SHEET_36.jpg"
          done

          python - <<'PY'
          import cv2, os, glob, json
          out = {}
          for path in sorted(glob.glob('final_out/*_FINAL_pqh.mp4')):
              cap = cv2.VideoCapture(path)
              frames = 0
              edge_hits = 0
              worst = 0
              while True:
                  ok, frame = cap.read()
                  if not ok:
                      break
                  frames += 1
                  gray = cv2.cvtColor(frame, cv2.COLOR_BGR2GRAY)
                  border = 5
                  strips = [gray[:border,:], gray[-border:,:], gray[:,:border], gray[:,-border:]]
                  dark = sum(int((s < 235).sum()) for s in strips)
                  worst = max(worst, dark)
                  if dark > 20:
                      edge_hits += 1
              cap.release()
              out[os.path.basename(path)] = {'frames_scanned': frames, 'edge_hit_frames': edge_hits, 'worst_dark_border_pixels': worst}
          with open('final_out/qa/EDGE_SCAN.json','w') as f:
              json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if any(v['edge_hit_frames'] for v in out.values()):
              raise SystemExit('Content touched video boundary in one or more frames')
          PY

          cat > final_out/qa/SENIOR_QA_RESULT.md <<'EOF'
          # Physics 9 Inclined Plane Lab — Senior QA

          - Dedicated Galileo-inspired inclined-plane laboratory: INCLUDED
          - No-sensor stopwatch version: INCLUDED
          - Sensor / photogate version: INCLUDED
          - Motion-sensor alternative: INCLUDED
          - Three repeated trials for stopwatch timing: INCLUDED
          - Position measured along the ramp: INCLUDED
          - Fixed release point / no push: INCLUDED
          - x vs t and x vs t² experimental logic: INCLUDED
          - Illustrative data explicitly labeled as example data: INCLUDED
          - Formal acceleration derivation: EXCLUDED / postponed
          - Literal PQL gate: PASS
          - Literal PQH final render: PASS
          - 1920×1080 H.264 technical gate: PASS
          - Full FFmpeg decode: PASS
          - Every encoded frame border scan: PASS
          - Distributed visual contact sheets: GENERATED
          EOF

      - name: Package and upload laboratory deliverables
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_inclined_plane_lab_20260901
          cp "$JOB/Physics9_Inclined_Plane_Lab_Stopwatch_Sensors_FINAL.py" package/
          cp final_out/Physics9InclinedPlaneLabMaster_FINAL_pqh.mp4 package/
          cp final_out/Physics9InclinedPlaneLabStopwatch_FINAL_pqh.mp4 package/
          cp final_out/Physics9InclinedPlaneLabSensors_FINAL_pqh.mp4 package/
          cp final_out/qa/*_CONTACT_SHEET_36.jpg package/
          cp final_out/qa/*_ffprobe.txt package/
          cp final_out/qa/EDGE_SCAN.json package/
          cp final_out/qa/SENIOR_QA_RESULT.md package/
          cat > package/README.txt <<'EOF'
          PHYSICS 9 — GALILEO-INSPIRED INCLINED-PLANE LAB

          Deliverables:
          1) Physics9InclinedPlaneLabMaster_FINAL_pqh.mp4
             Full classroom video containing stopwatch and sensor versions.
          2) Physics9InclinedPlaneLabStopwatch_FINAL_pqh.mp4
             Standalone version requiring no timing sensors.
          3) Physics9InclinedPlaneLabSensors_FINAL_pqh.mp4
             Standalone photogate/sensor version.

          Important: numerical datasets shown in the animation are explicitly
          illustrative. Students must collect and analyze their own measurements.
          EOF
          zip -r Physics9_Inclined_Plane_Lab_Stopwatch_Sensors_FINAL_PQH.zip package >/dev/null
          cp Physics9_Inclined_Plane_Lab_Stopwatch_Sensors_FINAL_PQH.zip final_out/

      - name: Upload final PQH package
        uses: actions/upload-artifact@v4
        with:
          name: Physics9_Inclined_Plane_Lab_Stopwatch_Sensors_FINAL_PQH
          path: |
            final_out/Physics9InclinedPlaneLabMaster_FINAL_pqh.mp4
            final_out/Physics9InclinedPlaneLabStopwatch_FINAL_pqh.mp4
            final_out/Physics9InclinedPlaneLabSensors_FINAL_pqh.mp4
            final_out/Physics9_Inclined_Plane_Lab_Stopwatch_Sensors_FINAL_PQH.zip
            final_out/qa/
          if-no-files-found: error
          retention-days: 30
