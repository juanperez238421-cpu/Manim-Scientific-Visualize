name: Geometry 8 Circle Exercises FINAL2 TOTAL QA PQH 20260831

on:
  push:
    branches: [render/geometry8-circle-exercises-v1-20260831]
    paths:
      - 'render_jobs/geometry8_circle_pedagogical_qa_20260819/Geometry8_Circle_Exercises_AREA_PERIMETER_PARTS_20260831_V1_TOTAL_QA_FINAL2.py'
      - '.github/workflows/geometry8_circle_exercises_area_perimeter_parts_v1_total_qa_final2_20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-circle-exercises-final2-total-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Compile full V10 exercise stack and FINAL2 assertions
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_circle_pedagogical_qa_20260819
          BASE="$JOB/Geometry8_Circle_Exercises_AREA_PERIMETER_PARTS_20260831_V1_TOTAL_QA.py"
          FINAL1="$JOB/Geometry8_Circle_Exercises_AREA_PERIMETER_PARTS_20260831_V1_TOTAL_QA_FINAL.py"
          SRC="$JOB/Geometry8_Circle_Exercises_AREA_PERIMETER_PARTS_20260831_V1_TOTAL_QA_FINAL2.py"
          python -Werror -m py_compile \
            "$JOB/Geometry8_Circle_Area_Decomposition_STEP_BY_STEP_20260827.py" \
            "$JOB/Geometry8_Circle_Area_Decomposition_STEP_BY_STEP_20260827_V2.py" \
            "$JOB/Geometry8_Circle_Area_Decomposition_TWO_ROWS_20260827_V3.py" \
            "$JOB/Geometry8_Circle_Area_Decomposition_TWO_ROWS_20260827_V4_POLISHED.py" \
            "$JOB/Geometry8_Circle_Area_Decomposition_TWO_ROWS_20260827_V5_FINAL_QA.py" \
            "$JOB/Geometry8_Circle_Area_TWO_ROWS_ENGLISH_20260827_V6_MASTER.py" \
            "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V7_MASTER.py" \
            "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V7_FINAL_QA.py" \
            "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA.py" \
            "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA_FINAL.py" \
            "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA_FINAL2.py" \
            "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA_FINAL3.py" \
            "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260829_V8_SENIOR_QA_FINAL4.py" \
            "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260830_V9_PROJECTOR_MAX.py" \
            "$JOB/Geometry8_Circle_Foundations_HALVES_TWO_ROWS_20260830_V10_TOTAL_QA.py" \
            "$BASE" "$FINAL1" "$SRC"
          python - "$BASE" "$FINAL1" "$SRC" <<'PY'
          from pathlib import Path
          import sys
          base=Path(sys.argv[1]).read_text(encoding='utf-8')
          f1=Path(sys.argv[2]).read_text(encoding='utf-8')
          f2=Path(sys.argv[3]).read_text(encoding='utf-8')
          required=[
              'A circle has area 49π cm². Find its perimeter.',
              'The area is 81π m². Determine the diameter and perimeter.',
              'A circle has perimeter 20π cm. Find its diameter, radius and area.',
              'If OA = 6 cm, identify OA and AB, then find AB, perimeter and area.',
              r'A_{1/2}=\frac{1}{2}\pi r^2',
              'A semicircle has area 50π cm².',
              r'A_{1/4}=\frac{1}{4}\pi r^2',
              'A quarter-circle region has area 25π m².',
              'No arc length',
              'YOUR TURN — calculate before the solution appears',
          ]
          missing=[x for x in required if x not in base]
          print('missing content assertions:', missing)
          assert not missing
          assert 'scale_to_fit_width(14.55)' in f1
          assert 'Sector(' in f2 and 'radius=radius' in f2
          assert 'outer_radius=radius' not in f2
          assert ').shift(center)' in f2
          PY
          mkdir -p out qa_out media qa_media

      - name: Literal PQL complete-timeline FINAL2 gate
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/geometry8_circle_pedagogical_qa_20260819/Geometry8_Circle_Exercises_AREA_PERIMETER_PARTS_20260831_V1_TOTAL_QA_FINAL2.py
          mkdir -p /tmp/manim-bin /tmp/manim-home qa_media qa_out
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=0.045
          manim -pql "$SRC" Geometry8CircleExercisesAreaPerimeterParts20260831V1TotalQAFinal2 \
            --fps 15 --format=mp4 --media_dir qa_media --disable_caching \
            2>&1 | tee qa_out/CIRCLE_EXERCISES_FINAL2_pql.log
          PQL="$(find qa_media -type f -name 'Geometry8CircleExercisesAreaPerimeterParts20260831V1TotalQAFinal2.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" qa_out/Geometry8_Circle_Exercises_FINAL2_20260831_pql.mp4
          python - "$PQL" <<'PY'
          import av,sys
          frames=0
          with av.open(sys.argv[1]) as c:
              for _ in c.decode(c.streams.video[0]): frames += 1
          print('PQL decoded frames=',frames)
          assert frames>0
          PY

      - name: Literal PQH final render 1920x1080 30fps
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/geometry8_circle_pedagogical_qa_20260819/Geometry8_Circle_Exercises_AREA_PERIMETER_PARTS_20260831_V1_TOTAL_QA_FINAL2.py
          mkdir -p /tmp/manim-bin /tmp/manim-home out media
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=1.0
          manim -pqh "$SRC" Geometry8CircleExercisesAreaPerimeterParts20260831V1TotalQAFinal2 \
            --fps 30 --format=mp4 --media_dir media --disable_caching \
            2>&1 | tee out/CIRCLE_EXERCISES_FINAL2_pqh.log
          FINAL="$(find media -type f -name 'Geometry8CircleExercisesAreaPerimeterParts20260831V1TotalQAFinal2.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Geometry8_Circle_Exercises_AREA_PERIMETER_PARTS_FINAL2_20260831_FINAL_pqh.mp4

      - name: Full H264 decode format duration and edge QA
        shell: bash
        run: |
          set -euo pipefail
          F=out/Geometry8_Circle_Exercises_AREA_PERIMETER_PARTS_FINAL2_20260831_FINAL_pqh.mp4
          python - "$F" <<'PY' | tee out/VIDEO_TECHNICAL_QA_CIRCLE_EXERCISES_FINAL2.txt
          import av,os,sys,numpy as np
          p=sys.argv[1]; frames=0; edge_failures=[]
          with av.open(p) as c:
              s=c.streams.video[0]
              codec=s.codec_context.name; width=s.codec_context.width; height=s.codec_context.height
              fmt=s.codec_context.format.name if s.codec_context.format else ''
              fps=float(s.average_rate) if s.average_rate else 0.0
              duration=float(c.duration)/float(av.time_base) if c.duration else 0.0
              for frame in c.decode(s):
                  frames += 1
                  if frames % 30 == 0:
                      arr=np.asarray(frame.to_image().convert('L'))
                      strips=(arr[:, :18],arr[:, -18:],arr[:10,:],arr[-10:,:])
                      if any(np.count_nonzero(x<238)>8 for x in strips): edge_failures.append(frames)
          print(f'codec_name={codec}')
          print(f'width={width}')
          print(f'height={height}')
          print(f'pix_fmt={fmt}')
          print(f'fps={fps:.6f}')
          print(f'duration={duration:.6f}')
          print(f'frames_decoded={frames}')
          print(f'size={os.path.getsize(p)}')
          print(f'outer_edge_failures={edge_failures[:20]} count={len(edge_failures)}')
          assert codec=='h264'
          assert width==1920 and height==1080
          assert abs(fps-30.0)<0.01
          assert fmt=='yuv420p'
          assert duration>220
          assert frames>0
          assert not edge_failures
          PY
          sha256sum "$F" | tee out/SHA256SUMS_CIRCLE_EXERCISES_FINAL2.txt

      - name: Dense 160-frame visual QA plus fractional-region burst
        shell: bash
        run: |
          set -euo pipefail
          F=out/Geometry8_Circle_Exercises_AREA_PERIMETER_PARTS_FINAL2_20260831_FINAL_pqh.mp4
          mkdir -p out/frame_samples_general out/frame_samples_fractional
          python - "$F" <<'PY'
          import av,math,os,sys
          from PIL import Image,ImageDraw
          p=sys.argv[1]
          with av.open(p) as c:
              duration=float(c.duration)/float(av.time_base)
          def extract(targets,outdir,prefix):
              saved=[]
              with av.open(p) as c:
                  s=c.streams.video[0]; ti=0
                  for frame in c.decode(s):
                      if ti>=len(targets): break
                      t=float(frame.pts*frame.time_base) if frame.pts is not None else 0.0
                      if t>=targets[ti]:
                          fp=f'{outdir}/{prefix}_{ti+1:03d}_{targets[ti]:07.2f}.jpg'
                          frame.to_image().convert('RGB').save(fp,quality=94)
                          saved.append(fp); ti+=1
              return saved
          general=extract([duration*i/161 for i in range(1,161)],'out/frame_samples_general','frame')
          fractional_targets=[duration*(0.48+0.47*i/59) for i in range(60)]
          fractional_targets=[t for t in fractional_targets if t<duration-0.4]
          fractional=extract(fractional_targets,'out/frame_samples_fractional','fraction')
          def sheet(files,path,cols=4):
              cards=[]
              for fp in files:
                  im=Image.open(fp).convert('RGB'); im.thumbnail((480,270))
                  card=Image.new('RGB',(500,300),'white'); card.paste(im,((500-im.width)//2,8))
                  ImageDraw.Draw(card).text((10,280),os.path.basename(fp),fill='black'); cards.append(card)
              rows=math.ceil(len(cards)/cols); out=Image.new('RGB',(cols*500,rows*300),'white')
              for i,im in enumerate(cards): out.paste(im,((i%cols)*500,(i//cols)*300))
              out.save(path,quality=94)
          sheet(general,'out/Geometry8_Circle_Exercises_FINAL2_contact_sheet_160.jpg')
          sheet(fractional,'out/Geometry8_Circle_Exercises_FINAL2_fractional_sheet.jpg')
          print('general_frames=',len(general)); print('fractional_frames=',len(fractional))
          assert len(general)>=156
          assert len(fractional)>=50
          PY
          JOB=render_jobs/geometry8_circle_pedagogical_qa_20260819
          cp "$JOB/Geometry8_Circle_Exercises_AREA_PERIMETER_PARTS_20260831_V1_TOTAL_QA.py" out/
          cp "$JOB/Geometry8_Circle_Exercises_AREA_PERIMETER_PARTS_20260831_V1_TOTAL_QA_FINAL.py" out/
          cp "$JOB/Geometry8_Circle_Exercises_AREA_PERIMETER_PARTS_20260831_V1_TOTAL_QA_FINAL2.py" out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Geometry8-Circle-Exercises-AREA-PERIMETER-PARTS-FINAL2-TOTAL-QA-20260831-PQH
          path: |
            out/
            qa_out/
          if-no-files-found: warn
          retention-days: 7
