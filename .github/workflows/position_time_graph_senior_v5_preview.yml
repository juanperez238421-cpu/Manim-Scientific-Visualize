name: Position-Time Graph Senior V5 PQL Visual Gate

on:
  push:
    branches:
      - agent/position-time-graph-senior-v5-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct V5 source and exact JP style
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_v5
          cat \
            render_jobs/position_time_graph_v5_20260817/source_parts/v5d_00.b64 \
            render_jobs/position_time_graph_v5_20260817/source_parts/v5d_01.b64 \
            render_jobs/position_time_graph_v5_20260817/source_parts/v5c_01.b64 \
            render_jobs/position_time_graph_v5_20260817/source_parts/v5c_02.b64 \
            render_jobs/position_time_graph_v5_20260817/source_parts/v5c_03.b64 \
            render_jobs/position_time_graph_v5_20260817/source_parts/v5c_04.b64 \
            | base64 -d | gzip -dc > build_v5/position_time_graph_senior_v5.py
          base64 -d render_jobs/position_time_graph_20260816/style.py.gz.b64 | gzip -dc > build_v5/jp_classroom_style.py
          test -s build_v5/position_time_graph_senior_v5.py
          test -s build_v5/jp_classroom_style.py
          python -m py_compile build_v5/position_time_graph_senior_v5.py build_v5/jp_classroom_style.py
          grep -q 'class PositionTimeGraphSenior' build_v5/position_time_graph_senior_v5.py
          grep -q 'camera_begin_focus' build_v5/position_time_graph_senior_v5.py
          if grep -q 'ReplacementTransform(old_header' build_v5/position_time_graph_senior_v5.py; then
            echo 'V5 source unexpectedly contains morphing header transition' >&2
            exit 1
          fi
          SOURCE_SHA=$(sha256sum build_v5/position_time_graph_senior_v5.py | awk '{print $1}')
          test "$SOURCE_SHA" = '8929d88553562099eb62dd57e7a592c80416e7c8babec51cf78895370f5f8bcf'
          STYLE_SHA=$(sha256sum build_v5/jp_classroom_style.py | awk '{print $1}')
          test "$STYLE_SHA" = '3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d'
          echo "V5 source SHA-256: $SOURCE_SHA"
          echo "Exact JP style SHA-256: $STYLE_SHA"

      - name: Pull ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Literal PQL runtime and layout QA
        shell: bash
        run: |
          set -euo pipefail
          cd build_v5
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.45 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/preview-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/preview-bin/xdg-open
              chmod +x /tmp/preview-bin/xdg-open
              export PATH="/tmp/preview-bin:$PATH"
              manim -pql position_time_graph_senior_v5.py PositionTimeGraphSenior \
                --format=mp4 --fps 15 --disable_caching
            ' 2>&1 | tee ../pql_v5.log

      - name: Verify PQL and export dense audit frames
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          VIDEO=$(find build_v5/media -type f -name 'PositionTimeGraphSenior.mp4' -print | head -1)
          test -n "$VIDEO"
          test -s "$VIDEO"
          mkdir -p preview_delivery/audit_frames
          cp "$VIDEO" preview_delivery/PositionTimeGraph_Senior_V5_pql.mp4
          cp build_v5/position_time_graph_senior_v5.py preview_delivery/
          cp build_v5/jp_classroom_style.py preview_delivery/
          cp render_jobs/position_time_graph_v5_20260817/PRE_RENDER_QA_V5.md preview_delivery/
          cp pql_v5.log preview_delivery/
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO" | tee preview_delivery/PQL_TECHNICAL.txt
          ffmpeg -v error -i "$VIDEO" -f null -
          ffmpeg -hide_banner -loglevel error -i "$VIDEO" -vf "fps=1/2.5,scale=960:-2" -q:v 3 preview_delivery/audit_frames/frame_%04d.jpg
          sha256sum preview_delivery/PositionTimeGraph_Senior_V5_pql.mp4 preview_delivery/position_time_graph_senior_v5.py preview_delivery/jp_classroom_style.py > preview_delivery/SHA256SUMS.txt

      - name: Upload PQL visual-gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: PositionTimeGraph-Senior-V5-PQL-VISUAL-GATE
          path: preview_delivery/
          if-no-files-found: error
          retention-days: 7
