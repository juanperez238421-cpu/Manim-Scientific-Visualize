name: Render ITM activity cover only

on:
  push:
    branches:
      - agent/itm-activity-cover-only
    paths:
      - "render_jobs/itm_activity_cover_only/**"
      - ".github/workflows/itm_activity_cover_only.yml"
  workflow_dispatch:

jobs:
  render-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Render only the independent cover
        run: |
          mkdir -p render_jobs/itm_activity_cover_only/media
          chmod -R a+rwx render_jobs/itm_activity_cover_only
          docker run --rm \
            -v "$PWD/render_jobs/itm_activity_cover_only:/manim" \
            manimcommunity/manim:v0.20.1 \
            manim -qh itm_activity_cover.py ITMActivityCover --media_dir media

      - name: Normalize final cover file
        run: |
          COVER="$(find render_jobs/itm_activity_cover_only/media -type f -name 'ITMActivityCover.mp4' -print -quit)"
          test -n "$COVER"
          cp "$COVER" ITM_Activity_Cover_10Percent_PQH.mp4

      - name: Technical validation
        run: |
          test -s ITM_Activity_Cover_10Percent_PQH.mp4
          docker run --rm \
            -v "$PWD:/work:ro" \
            manimcommunity/manim:v0.20.1 \
            ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            /work/ITM_Activity_Cover_10Percent_PQH.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: itm-activity-cover-only-pqh
          path: ITM_Activity_Cover_10Percent_PQH.mp4
          if-no-files-found: error
          retention-days: 7
