name: Geometry 8 Circle Senior QA V2 PQH 20260818

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render-circle-senior-qa-v2:
    if: github.event.pull_request.head.ref == 'agent/geometry8-circle-final-total-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact QA V2 sources
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_circle_qa_v2
          mkdir -p "$JOB"
          base64 -d < "$JOB/source.b64" | gzip -dc > "$JOB/Geometry8_Circle_Fundamentals_SENIOR_QA_V2.py"
          cat render_jobs/geometry8_circle_20260818/s_*.b64 | base64 -d | gzip -dc > "$JOB/jp_classroom_style.py"
          python -m py_compile "$JOB/Geometry8_Circle_Fundamentals_SENIOR_QA_V2.py" "$JOB/jp_classroom_style.py"
          grep -q 'class Geometry8CircleFundamentalsFinal' "$JOB/Geometry8_Circle_Fundamentals_SENIOR_QA_V2.py"
          sha256sum "$JOB/Geometry8_Circle_Fundamentals_SENIOR_QA_V2.py" "$JOB/jp_classroom_style.py" > "$JOB/SOURCE_SHA256.txt"

      - name: Literal PQL runtime QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/manim-bin qa_media qa_out
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=0.08
          manim -pql render_jobs/geometry8_circle_qa_v2/Geometry8_Circle_Fundamentals_SENIOR_QA_V2.py Geometry8CircleFundamentalsFinal --fps 15 --format=mp4 --media_dir qa_media --disable_caching 2>&1 | tee qa_out/CircleSeniorQAV2_pql.log

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/manim-bin out media
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=1.0
          manim -pqh render_jobs/geometry8_circle_qa_v2/Geometry8_Circle_Fundamentals_SENIOR_QA_V2.py Geometry8CircleFundamentalsFinal --fps 30 --format=mp4 --media_dir media --disable_caching 2>&1 | tee out/CircleSeniorQAV2_pqh.log
          FINAL="$(find media -type f -name 'Geometry8CircleFundamentalsFinal.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Geometry8_Circle_Fundamentals_SENIOR_QA_V2_pqh.mp4

      - name: Verify and package final MP4
        shell: bash
        run: |
          set -euo pipefail
          F=out/Geometry8_Circle_Fundamentals_SENIOR_QA_V2_pqh.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size,bit_rate -of default=noprint_wrappers=1 "$F" | tee out/VIDEO_TECHNICAL.txt
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")" = 1920
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")" = 1080
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          case "$FPS" in 30/1|60/1) ;; *) echo "Unexpected FPS: $FPS"; exit 1 ;; esac
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")" = h264
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null -
          mkdir -p out/frame_samples
          ffmpeg -nostdin -y -v error -i "$F" -vf 'fps=1/15,scale=960:-2' -q:v 3 out/frame_samples/frame_%03d.jpg
          sha256sum "$F" > out/SHA256SUMS.txt
          cp render_jobs/geometry8_circle_qa_v2/Geometry8_Circle_Fundamentals_SENIOR_QA_V2.py out/
          cp render_jobs/geometry8_circle_qa_v2/jp_classroom_style.py out/
          cp render_jobs/geometry8_circle_qa_v2/SOURCE_SHA256.txt out/
          cp qa_out/CircleSeniorQAV2_pql.log out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Geometry8-Circle-Senior-QA-V2-PQH
          path: out/
          if-no-files-found: error
          retention-days: 7
