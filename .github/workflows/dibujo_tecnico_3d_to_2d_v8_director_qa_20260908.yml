name: Dibujo Tecnico 3D to 2D V8 DIRECTOR QA PQH

on:
  push:
    branches:
      - render/dibujo-tecnico-3d-to-2d-v8-director-qa-20260908
    paths:
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA.py'
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/QA_V7_TO_V8_FULL_FRAME_AND_DIRECTOR_REVIEW.md'
      - '.github/workflows/dibujo_tecnico_3d_to_2d_v8_director_qa_20260908.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  render-v8-director-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static source and director QA gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          V7="$JOB/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V7_SENIOR_QA.py"
          V8="$JOB/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA.py"
          REPORT="$JOB/QA_V7_TO_V8_FULL_FRAME_AND_DIRECTOR_REVIEW.md"
          test -s "$V7" && test -s "$V8" && test -s "$REPORT"
          python -m py_compile "$V7" "$V8"
          python - <<'PY'
          from pathlib import Path
          p=Path('render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA.py')
          s=p.read_text(encoding='utf-8')
          required=[
              'class Projection3Dto2DDirectorV8',
              'zoom=1.42', 'zoom=1.22',
              'build_projection',
              'FadeTransform(arrow, plane)',
              'run_time=T(4.60)',
              'angle=-PI/2', 'axis=RIGHT', 'about_point=ORIGIN',
              'LAS VISTAS CONSERVAN DIMENSIONES COMUNES',
              'UN OBJETO · TRES DESCRIPCIONES 2D',
              'MÉTODO PARA PASAR DE 3D A 2D',
              'self.wait(T(5.40))',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          forbidden=['phi=90 * DEGREES, theta=90 * DEGREES', 'section_chip(']
          bad=[x for x in forbidden if x in s]
          assert not bad, bad
          print('V8 static director QA gate: PASS')
          PY
          mkdir -p /tmp/manim-bin /tmp/manim-home pql_media media out qa_out qa_out/audit_frames
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open

      - name: Literal PQL full-timeline render gate
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=0.08
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pql Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA.py \
            Projection3Dto2DDirectorV8 \
            --fps 15 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/pql_media" \
            2>&1 | tee "$GITHUB_WORKSPACE/qa_out/PQL.log"
          cd "$GITHUB_WORKSPACE"
          PQL="$(find pql_media -type f -name 'Projection3Dto2DDirectorV8.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" qa_out/Dibujo_Tecnico_3D_to_2D_V8_DIRECTOR_QA_pql.mp4

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=1.0
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pqh Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA.py \
            Projection3Dto2DDirectorV8 \
            --fps 30 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/media" \
            2>&1 | tee "$GITHUB_WORKSPACE/out/PQH.log"
          cd "$GITHUB_WORKSPACE"
          VIDEO="$(find media -type f -name 'Projection3Dto2DDirectorV8.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"
          cp "$VIDEO" out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA_FINAL_pqh.mp4
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA.py out/
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/QA_V7_TO_V8_FULL_FRAME_AND_DIRECTOR_REVIEW.md out/

      - name: Full decode and technical QA
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA_FINAL_pqh.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/VIDEO_QA.txt
          import av, os, sys
          p=sys.argv[1]; frames=0
          with av.open(p) as c:
              s=c.streams.video[0]
              codec=s.codec_context.name
              width=s.codec_context.width
              height=s.codec_context.height
              fmt=s.codec_context.format.name if s.codec_context.format else ''
              fps=float(s.average_rate) if s.average_rate else 0.0
              duration=float(c.duration)/float(av.time_base) if c.duration else 0.0
              for _ in c.decode(s): frames += 1
          size=os.path.getsize(p)
          print(f'codec_name={codec}')
          print(f'width={width}')
          print(f'height={height}')
          print(f'pix_fmt={fmt}')
          print(f'average_fps={fps:.6f}')
          print(f'duration={duration:.6f}')
          print(f'frames_decoded={frames}')
          print(f'size={size}')
          assert codec == 'h264'
          assert (width,height) == (1920,1080)
          assert fmt == 'yuv420p'
          assert 29.8 <= fps <= 30.2
          assert duration > 120
          assert frames > 3600
          assert size > 1_200_000
          PY
          SHA="$(sha256sum "$VIDEO" | awk '{print $1}')"
          SIZE="$(stat -c%s "$VIDEO")"
          echo "$SHA  $VIDEO" | tee qa_out/SHA256SUMS.txt
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Full-timeline spatial QA excluding header strip
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA_FINAL_pqh.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/FRAME_BY_FRAME_QA.txt
          import av, numpy as np, statistics, sys
          p=sys.argv[1]
          widths=[]; heights=[]; fracs=[]; near_blank=0; decoded=0; samples=0
          with av.open(p) as c:
              s=c.streams.video[0]
              for frame in c.decode(s):
                  decoded += 1
                  if decoded % 6:  # 5 samples/s across entire final video
                      continue
                  samples += 1
                  arr=frame.to_ndarray(format='gray')
                  # Ignore fixed stage header and outer border; audit lesson content itself.
                  roi=arr[155:1010,35:1885]
                  mask=roi < 242
                  frac=float(mask.mean()); fracs.append(frac)
                  ys,xs=np.where(mask)
                  if len(xs):
                      widths.append(int(xs.max()-xs.min()+1))
                      heights.append(int(ys.max()-ys.min()+1))
                  else:
                      widths.append(0); heights.append(0)
                  if frac < 0.0015:
                      near_blank += 1
          medw=float(statistics.median(widths))
          medh=float(statistics.median(heights))
          p10w=float(np.percentile(widths,10))
          p10h=float(np.percentile(heights,10))
          print('decoded_frames=',decoded)
          print('audited_samples=',samples)
          print('median_content_width=',medw)
          print('p10_content_width=',p10w)
          print('median_content_height=',medh)
          print('p10_content_height=',p10h)
          print('median_dark_fraction=',statistics.median(fracs))
          print('near_blank_samples=',near_blank)
          assert samples > 600
          assert medw > 850
          assert p10w > 420
          assert medh > 360
          assert near_blank < 35
          print('FRAME_BY_FRAME_QA=PASS')
          PY

      - name: 120-frame visual audit contact sheet
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA_FINAL_pqh.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/VISUAL_AUDIT.txt
          import av, math, os, sys
          from PIL import Image, ImageDraw
          p=sys.argv[1]; count=120; saved=[]
          with av.open(p) as c:
              s=c.streams.video[0]
              duration=float(c.duration)/float(av.time_base)
              targets=[duration*i/(count+1) for i in range(1,count+1)]
              ti=0
              for frame in c.decode(s):
                  if ti >= len(targets): break
                  t=float(frame.pts*frame.time_base) if frame.pts is not None else 0.0
                  if t >= targets[ti]:
                      im=Image.fromarray(frame.to_ndarray(format='rgb24'))
                      fp=f'qa_out/audit_frames/frame_{ti+1:03d}_{targets[ti]:07.2f}.jpg'
                      im.save(fp,quality=90); saved.append(fp); ti += 1
          assert len(saved) >= 116
          cards=[]
          for fp in saved:
              im=Image.open(fp).convert('RGB'); im.thumbnail((480,270))
              card=Image.new('RGB',(500,300),'white'); card.paste(im,((500-im.width)//2,8))
              ImageDraw.Draw(card).text((10,280),os.path.basename(fp),fill='black'); cards.append(card)
          cols=4; rows=math.ceil(len(cards)/cols)
          sheet=Image.new('RGB',(cols*500,rows*300),'white')
          for i,im in enumerate(cards): sheet.paste(im,((i%cols)*500,(i//cols)*300))
          out='qa_out/Dibujo_Tecnico_3D_to_2D_V8_DIRECTOR_QA_contact_sheet.jpg'
          sheet.save(out,quality=90)
          print('audit_frames=',len(saved))
          print('duration=',duration)
          print('contact_sheet=PASS')
          PY

      - name: Publish exact validated V8 MP4
        id: publish
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.qa.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.qa.outputs.size }}
        run: |
          set -euo pipefail
          VIDEO=out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA_FINAL_pqh.mp4
          TARGET=published_renders/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA_FINAL_pqh.mp4
          test "$(sha256sum "$VIDEO" | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(stat -c%s "$VIDEO")" = "$EXPECTED_SIZE"
          cp "$VIDEO" "$TARGET"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET"
          git commit -m 'Publish Dibujo Tecnico 3D to 2D V8 DIRECTOR QA PQH [skip ci]'
          git push origin "HEAD:$GITHUB_REF_NAME"
          COMMIT="$(git rev-parse HEAD)"
          echo "$COMMIT" | tee qa_out/PUBLISHED_COMMIT.txt
          echo "commit_sha=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Verify exact direct GitHub re-download
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.qa.outputs.sha256 }}
          PUBLISHED_COMMIT: ${{ steps.publish.outputs.commit_sha }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee qa_out/DIRECT_DOWNLOAD_QA.txt
          import hashlib, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          commit=os.environ['PUBLISHED_COMMIT']
          expected=os.environ['EXPECTED_SHA']
          path='published_renders/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA_FINAL_pqh.mp4'
          url=f'https://raw.githubusercontent.com/{repo}/{commit}/{path}'
          with urllib.request.urlopen(url,timeout=180) as r:
              data=r.read()
          actual=hashlib.sha256(data).hexdigest()
          print('url=',url)
          print('bytes=',len(data))
          print('sha256=',actual)
          assert actual == expected
          print('DIRECT_GITHUB_DOWNLOAD=PASS')
          PY

      - name: Upload V8 final artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dibujo_Tecnico_3D_to_2D_V8_DIRECTOR_QA_PQH
          path: |
            out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA_FINAL_pqh.mp4
            out/Dibujo_Tecnico_3D_to_2D_Orthographic_Projection_V8_DIRECTOR_QA.py
            out/QA_V7_TO_V8_FULL_FRAME_AND_DIRECTOR_REVIEW.md
            qa_out/VIDEO_QA.txt
            qa_out/FRAME_BY_FRAME_QA.txt
            qa_out/VISUAL_AUDIT.txt
            qa_out/Dibujo_Tecnico_3D_to_2D_V8_DIRECTOR_QA_contact_sheet.jpg
            qa_out/SHA256SUMS.txt
            qa_out/DIRECT_DOWNLOAD_QA.txt
            qa_out/PUBLISHED_COMMIT.txt
          retention-days: 7
