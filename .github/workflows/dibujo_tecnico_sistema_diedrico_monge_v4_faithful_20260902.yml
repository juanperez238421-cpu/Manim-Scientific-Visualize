name: Dibujo Tecnico Sistema Diedrico Monge V4 FAITHFUL PQH

on:
  push:
    branches:
      - render/dibujo-tecnico-clase6-iso-projection-v2-senior-qa-20260902
    paths:
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL.py'
      - 'render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/RESEARCH_SISTEMA_DIEDRICO_MONGE_V4.md'
      - '.github/workflows/dibujo_tecnico_sistema_diedrico_monge_v4_faithful_20260902.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  render-diedrico-v4-faithful:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Source and research gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          SRC="$JOB/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL.py"
          NOTE="$JOB/RESEARCH_SISTEMA_DIEDRICO_MONGE_V4.md"
          test -s "$SRC" && test -s "$NOTE"
          python -m py_compile "$SRC"
          python - <<'PY'
          from pathlib import Path
          p=Path('render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL.py')
          s=p.read_text(encoding='utf-8')
          required=[
              'class DihedralSystemMongeFaithfulV4(ThreeDScene)',
              'PV ⟂ PH', 'PV ∩ PH = LT',
              'angle=-PI / 2', 'axis=RIGHT', 'about_point=ORIGIN',
              'front_step_outline', 'top_step_view', 'make_stepped_solid',
              'ALZADO', 'PLANTA', 'LÍNEA DE TIERRA',
              'PRIMER DIEDRO', 'PROYECCIONES ALINEADAS',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          print('Source geometry/research gate: PASS')
          PY
          mkdir -p /tmp/manim-bin /tmp/manim-home pql_media media out qa_out
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open

      - name: Literal PQL complete scene gate
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=0.08
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pql Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL.py \
            DihedralSystemMongeFaithfulV4 \
            --fps 15 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/pql_media" \
            2>&1 | tee "$GITHUB_WORKSPACE/qa_out/PQL.log"
          cd "$GITHUB_WORKSPACE"
          PQL="$(find pql_media -type f -name 'DihedralSystemMongeFaithfulV4.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" qa_out/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL_pql.mp4

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=1.0
          cd render_jobs/dibujo_tecnico_clase6_iso_projection_20260902
          manim -pqh Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL.py \
            DihedralSystemMongeFaithfulV4 \
            --fps 30 --format=mp4 --disable_caching \
            --media_dir "$GITHUB_WORKSPACE/media" \
            2>&1 | tee "$GITHUB_WORKSPACE/out/PQH.log"
          cd "$GITHUB_WORKSPACE"
          VIDEO="$(find media -type f -name 'DihedralSystemMongeFaithfulV4.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"
          cp "$VIDEO" out/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL_FINAL_pqh.mp4
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL.py out/
          cp render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/RESEARCH_SISTEMA_DIEDRICO_MONGE_V4.md out/

      - name: Full decode and every-frame hard-border QA
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL_FINAL_pqh.mp4
          python - "$VIDEO" <<'PY' | tee qa_out/VIDEO_QA.txt
          import av, os, sys, numpy as np
          p=sys.argv[1]; frames=0; unsafe=[]; blank=[]
          with av.open(p) as c:
              s=c.streams.video[0]
              codec=s.codec_context.name
              width=s.codec_context.width; height=s.codec_context.height
              fmt=s.codec_context.format.name if s.codec_context.format else ''
              fps=float(s.average_rate) if s.average_rate else 0.0
              duration=float(c.duration)/float(av.time_base) if c.duration else 0.0
              for frame in c.decode(s):
                  arr=frame.to_ndarray(format='gray')
                  dark=arr < 235
                  edge=np.concatenate([dark[:8,:].ravel(),dark[-8:,:].ravel(),dark[:,:8].ravel(),dark[:,-8:].ravel()])
                  if edge.mean() > 0.0005: unsafe.append(frames)
                  if dark.mean() < 0.00010: blank.append(frames)
                  frames += 1
          size=os.path.getsize(p)
          print(f'codec_name={codec}')
          print(f'width={width}')
          print(f'height={height}')
          print(f'pix_fmt={fmt}')
          print(f'average_fps={fps:.6f}')
          print(f'duration={duration:.6f}')
          print(f'frames_decoded={frames}')
          print(f'size={size}')
          print(f'unsafe_border_frames={len(unsafe)}')
          print(f'blank_transition_frames={len(blank)}')
          if unsafe[:20]: print('unsafe_samples=',unsafe[:20])
          assert codec == 'h264'
          assert (width,height) == (1920,1080)
          assert fmt == 'yuv420p'
          assert 29.8 <= fps <= 30.2
          assert duration > 20
          assert frames > 600
          assert size > 500_000
          assert len(unsafe) == 0
          PY
          SHA="$(sha256sum "$VIDEO" | awk '{print $1}')"
          SIZE="$(stat -c%s "$VIDEO")"
          echo "$SHA  $VIDEO" | tee qa_out/SHA256SUMS.txt
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: 72-frame visual audit contact sheet
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=out/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL_FINAL_pqh.mp4
          mkdir -p qa_out/audit_frames
          python - "$VIDEO" <<'PY' | tee qa_out/VISUAL_AUDIT.txt
          import av, math, os, sys
          from PIL import Image, ImageDraw
          p=sys.argv[1]; count=72; saved=[]
          with av.open(p) as c:
              s=c.streams.video[0]
              duration=float(c.duration)/float(av.time_base)
              targets=[duration*i/(count+1) for i in range(1,count+1)]
              ti=0
              for frame in c.decode(s):
                  if ti >= len(targets): break
                  t=float(frame.pts*frame.time_base) if frame.pts is not None else 0.0
                  if t >= targets[ti]:
                      im=Image.fromarray(frame.to_ndarray(format='rgb24'))
                      fp=f'qa_out/audit_frames/frame_{ti+1:03d}_{targets[ti]:07.2f}.jpg'
                      im.save(fp,quality=92); saved.append(fp); ti += 1
          assert len(saved) >= 70
          cards=[]
          for fp in saved:
              im=Image.open(fp).convert('RGB'); im.thumbnail((480,270))
              card=Image.new('RGB',(500,300),'white'); card.paste(im,((500-im.width)//2,8))
              ImageDraw.Draw(card).text((10,280),os.path.basename(fp),fill='black'); cards.append(card)
          cols=4; rows=math.ceil(len(cards)/cols)
          sheet=Image.new('RGB',(cols*500,rows*300),'white')
          for i,im in enumerate(cards): sheet.paste(im,((i%cols)*500,(i//cols)*300))
          out='qa_out/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL_contact_sheet.jpg'
          sheet.save(out,quality=92)
          print('audit_frames=',len(saved))
          print('duration=',duration)
          print('contact_sheet=PASS')
          PY

      - name: Publish exact validated MP4 to GitHub
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.qa.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.qa.outputs.size }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.parse, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']
          parent=os.environ['GITHUB_SHA']; branch=os.environ['GITHUB_REF_NAME']
          items=[
            ('out/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL_FINAL_pqh.mp4','published_renders/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL_FINAL_pqh.mp4'),
            ('out/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL.py','render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL.py'),
            ('out/RESEARCH_SISTEMA_DIEDRICO_MONGE_V4.md','render_jobs/dibujo_tecnico_clase6_iso_projection_20260902/RESEARCH_SISTEMA_DIEDRICO_MONGE_V4.md'),
          ]
          expected_sha=os.environ['EXPECTED_SHA']; expected_size=int(os.environ['EXPECTED_SIZE'])
          video=open(items[0][0],'rb').read()
          assert hashlib.sha256(video).hexdigest()==expected_sha and len(video)==expected_size
          api=f'https://api.github.com/repos/{repo}'
          def req(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(url,data=data,method=method)
              r.add_header('Authorization',f'Bearer {token}')
              r.add_header('Accept','application/vnd.github+json')
              r.add_header('X-GitHub-Api-Version','2022-11-28')
              if data is not None: r.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(r,timeout=180) as f:
                      body=f.read(); return json.loads(body) if body else {}
              except urllib.error.HTTPError as e:
                  print(e.read().decode(errors='replace')); raise
          base=req('GET',f'{api}/git/commits/{parent}')
          blobs=[]
          for src,target in items:
              data=open(src,'rb').read()
              b=req('POST',f'{api}/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              blobs.append({'path':target,'mode':'100644','type':'blob','sha':b['sha']})
          tree=req('POST',f'{api}/git/trees',{'base_tree':base['tree']['sha'],'tree':blobs})
          commit=req('POST',f'{api}/git/commits',{
              'message':'Publish faithful Monge dihedral-system V4 PQH [skip ci]',
              'tree':tree['sha'],'parents':[parent]
          })
          ref=urllib.parse.quote(branch,safe='/')
          req('PATCH',f'{api}/git/refs/heads/{ref}',{'sha':commit['sha'],'force':False})
          open('qa_out/PUBLISHED_COMMIT.txt','w').write(commit['sha']+'\n')
          print('published_commit=',commit['sha'])
          print('published_sha256=',expected_sha)
          PY
          echo "commit_sha=$(cat qa_out/PUBLISHED_COMMIT.txt)" >> "$GITHUB_OUTPUT"

      - name: Verify exact direct GitHub download
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.qa.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.qa.outputs.size }}
          PUBLISHED_COMMIT: ${{ steps.publish.outputs.commit_sha }}
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PUBLISHED_COMMIT}/published_renders/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL_FINAL_pqh.mp4"
          curl -L --fail --retry 3 "$URL" -o qa_out/redownload.mp4
          test "$(stat -c%s qa_out/redownload.mp4)" = "$EXPECTED_SIZE"
          test "$(sha256sum qa_out/redownload.mp4 | awk '{print $1}')" = "$EXPECTED_SHA"
          printf 'url=%s\nsize=%s\nsha256=%s\nDIRECT_REDOWNLOAD=PASS\n' "$URL" "$EXPECTED_SIZE" "$EXPECTED_SHA" | tee qa_out/DIRECT_GITHUB_PUBLICATION.txt

      - name: Upload V4 faithful artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dibujo-Tecnico-Sistema-Diedrico-Monge-V4-FAITHFUL-FINAL-PQH-20260902
          path: |
            out/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL_FINAL_pqh.mp4
            out/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL.py
            out/RESEARCH_SISTEMA_DIEDRICO_MONGE_V4.md
            qa_out/VIDEO_QA.txt
            qa_out/VISUAL_AUDIT.txt
            qa_out/Dibujo_Tecnico_Sistema_Diedrico_Monge_V4_FAITHFUL_contact_sheet.jpg
            qa_out/SHA256SUMS.txt
            qa_out/PUBLISHED_COMMIT.txt
            qa_out/DIRECT_GITHUB_PUBLICATION.txt
          if-no-files-found: error
          retention-days: 14
