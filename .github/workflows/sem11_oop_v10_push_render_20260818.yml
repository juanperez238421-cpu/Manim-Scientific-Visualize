name: Seminar11 OOP V10 Push Render 20260818

on:
  push:
    branches:
      - render-sem11-oop-v10-20260818

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4
        with:
          ref: render-sem11-oop-v10-20260818
          fetch-depth: 0

      - name: Persist STARTED
        shell: bash
        run: |
          set -euo pipefail
          OUT=render_jobs/sem11_oop_v10/delivery
          mkdir -p "$OUT"
          printf 'STARTED\n' > "$OUT/STATUS.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT/STATUS.txt"
          git commit -m 'Seminar11 OOP V10 render started' || true
          git push origin HEAD:render-sem11-oop-v10-20260818

      - name: Assemble source, render PQL/PQH, verify, commit delivery
        shell: bash
        run: |
          set -uo pipefail
          JOB=render_jobs/sem11_oop_v10
          SRC="$JOB/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10.py"
          STYLE="$JOB/jp_classroom_style.py"
          CHECK="$JOB/check_manim_style.py"
          OUT="$JOB/delivery"
          CHUNKS="$JOB/chunks"
          BASE='https://raw.githubusercontent.com/juanperez238421-cpu/IJR---Seminario/render-sem11-oop-v10-20260818/render_jobs/sem11_oop_v10'
          rm -rf media_pql media "$OUT/audit_frames" "$CHUNKS"
          mkdir -p "$OUT/audit_frames" "$CHUNKS"

          persist_fail() {
            CODE="$1"
            printf 'FAILED\ncode=%s\n' "$CODE" > "$OUT/STATUS.txt"
            git add "$JOB" || true
            git commit -m "Seminar11 OOP V10 render failed $CODE" || true
            git push origin HEAD:render-sem11-oop-v10-20260818 || true
            exit 1
          }

          for I in 00 01 02 03 04; do
            curl -fsSL "$BASE/chunks/scene_$I" -o "$CHUNKS/scene_$I" || persist_fail FETCH_SCENE_$I
            curl -fsSL "$BASE/chunks/style_$I" -o "$CHUNKS/style_$I" || persist_fail FETCH_STYLE_$I
          done
          curl -fsSL "$BASE/check_manim_style.py" -o "$CHECK" || persist_fail FETCH_CHECKER
          cat "$CHUNKS"/scene_* > "$SRC"
          cat "$CHUNKS"/style_* > "$STYLE"
          python -m py_compile "$SRC" "$STYLE" "$CHECK" > "$OUT/py_compile.log" 2>&1 || persist_fail PY_COMPILE
          python "$CHECK" "$SRC" > "$OUT/STYLE_QA.txt" 2>&1 || persist_fail STYLE_QA
          sha256sum "$SRC" "$STYLE" > "$OUT/SOURCE_SHA256.txt"

          docker pull manimcommunity/manim:v0.20.1 > "$OUT/docker_pull.log" 2>&1 || persist_fail DOCKER_PULL

          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $SRC Seminar11OOPImmersiveV10 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee "$OUT/render_pql.log"
          PQL=${PIPESTATUS[0]}
          set -e
          [ "$PQL" -eq 0 ] || persist_fail PQL_RENDER
          PREVIEW="$(find media_pql -type f -name 'Seminar11OOPImmersiveV10.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          [ -n "$PREVIEW" ] && [ -s "$PREVIEW" ] || persist_fail PQL_OUTPUT

          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $SRC Seminar11OOPImmersiveV10 --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee "$OUT/render_pqh.log"
          PQH=${PIPESTATUS[0]}
          set -e
          [ "$PQH" -eq 0 ] || persist_fail PQH_RENDER

          FINAL="$(find media -type f -name 'Seminar11OOPImmersiveV10.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          [ -n "$FINAL" ] && [ -s "$FINAL" ] || persist_fail PQH_OUTPUT
          cp "$FINAL" "$OUT/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10_pqh.mp4"
          cp "$SRC" "$OUT/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10.py"
          cp "$STYLE" "$OUT/jp_classroom_style.py"

          F="$OUT/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10_pqh.mp4"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"
          [ "$W" = 1920 ] || persist_fail WIDTH
          [ "$H" = 1080 ] || persist_fail HEIGHT
          [ "$FPS" = 30/1 ] || persist_fail FPS
          [ "$CODEC" = h264 ] || persist_fail CODEC
          [ "$PIX" = yuv420p ] || persist_fail PIX_FMT
          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/full_decode.log" || persist_fail FULL_DECODE

          for P in 0.03 0.10 0.18 0.26 0.34 0.42 0.50 0.58 0.66 0.74 0.82 0.90 0.97; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "$OUT/audit_frames/frame_${TAG}.png" || persist_fail QA_FRAME
          done
          ffmpeg -nostdin -loglevel error -i "$F" -vf "fps=1/10,scale=640:-1,tile=4x3:padding=6:margin=8" -frames:v 1 "$OUT/QA_CONTACT_SHEET.jpg" || persist_fail CONTACT_SHEET
          sha256sum "$F" "$SRC" "$STYLE" > "$OUT/SHA256SUMS.txt"
          cat > "$OUT/RENDER_INFO.txt" <<'EOF'
Scene: Seminar11OOPImmersiveV10
Version: Senior QA V10
ManimCE: 0.20.1
Preview: literal -pql
Final: literal -pqh, 1920x1080, 30 fps, H.264/yuv420p
Visual architecture: JP Classroom monochrome safe-frame system.
QA focus: remove V9 camera clipping/overlap, preserve header lane, enlarge underused scenes, runtime safe-frame assertions.
Sequence: opening -> real object -> blueprint/instances -> encapsulation -> inheritance -> polymorphism -> composition -> object-first project thinking -> closing.
QA: py_compile + style checker + runtime safe-frame assertions + PQL + PQH + ffprobe + full decode + 13 audit frames + contact sheet + SHA-256.
EOF
          printf 'SUCCESS\n' > "$OUT/STATUS.txt"
          (cd "$OUT" && zip -9 -r Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10_PQH_Package.zip \
            Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10_pqh.mp4 \
            Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V10.py jp_classroom_style.py \
            VIDEO_TECHNICAL.tsv SHA256SUMS.txt SOURCE_SHA256.txt RENDER_INFO.txt STYLE_QA.txt \
            render_pql.log render_pqh.log full_decode.log QA_CONTACT_SHEET.jpg audit_frames/)

          git add "$JOB"
          git commit -m 'Seminar11 OOP V10 verified PQH delivery'
          git push origin HEAD:render-sem11-oop-v10-20260818
