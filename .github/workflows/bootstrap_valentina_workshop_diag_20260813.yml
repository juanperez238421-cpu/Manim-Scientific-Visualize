name: Valentina Workshop PQH Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diag:
    if: github.event.pull_request.head.ref == 'agent/valentina-calculo-iii-workshop-pqh-20260813'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scene: [Q01,Q02,Q03,Q04,Q05,Q06,Q07,Q08,Q09,Q10,Q11,Q12,Q13,Q14,Q15,Q16,Q17,Q18]
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact sources
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/valentina_workshop_20260813
          cat "$JOB"/v_*.b64 | base64 -d | gzip -dc > valentina_workshop.py
          cat "$JOB"/s_*.b64 | base64 -d | gzip -dc > jp_classroom_style.py
          python -m py_compile valentina_workshop.py jp_classroom_style.py
      - name: Render diagnostic literal PQH
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          rm -rf media diag
          mkdir -p diag
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh valentina_workshop.py ${{ matrix.scene }} --fps 30 --format=mp4 --disable_caching
            "
          FINAL="$(find media -type f -name '${{ matrix.scene }}.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" diag/${{ matrix.scene }}.mp4
      - name: Probe and decode
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          F=diag/${{ matrix.scene }}.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          ffmpeg -nostdin -v error -i "$F" -f null - 2> diag/decode.log
          SAFE_FPS="${FPS//\//_}"
          echo "name=${{ matrix.scene }}-${W}x${H}-${SAFE_FPS}-${CODEC}-${PIX}" >> "$GITHUB_OUTPUT"
          printf 'scene=%s\nwidth=%s\nheight=%s\nfps=%s\ncodec=%s\npix_fmt=%s\nduration=%s\n' '${{ matrix.scene }}' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > diag/meta.txt
      - name: Upload diagnostic metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            diag/meta.txt
            diag/decode.log
          retention-days: 1
