name: Inventor Thread Profile Triangle SENIOR PQH 20260930

on:
  push:
    branches:
      - render/inventor-thread-profile-triangle-pqh-20260930

permissions:
  contents: write

env:
  BASE_JOB: render_jobs/inventor_dedicated_20260826
  JOB_ROOT: render_jobs/inventor_thread_profile_20260930
  MANIM_IMAGE: manimcommunity/manim:v0.20.1
  SCENE_NAME: InventorThreadProfileTriangleSenior
  OUTPUT_NAME: Inventor_Thread_Profile_Triangle_SENIOR_FINAL_PQH.mp4
  PUBLISHED_PATH: published_renders/Inventor_Thread_Profile_Triangle_SENIOR_FINAL_PQH.mp4

concurrency:
  group: inventor-thread-profile-triangle-pqh-20260930
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout exact render branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconstruct source and validate Python
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$JOB_ROOT/source"
          base64 -d "$JOB_ROOT/thread_profile_coil_triangle_senior.py.gz.b64" | gzip -dc > "$JOB_ROOT/thread_profile_coil_triangle_senior.py"
          python -m py_compile \
            "$BASE_JOB/library/inventor_pro_ui.py" \
            "$BASE_JOB/library/sketch_to_3d_helpers.py" \
            "$JOB_ROOT/thread_profile_coil_triangle_senior.py"
          grep -q 'class InventorThreadProfileTriangleSenior' "$JOB_ROOT/thread_profile_coil_triangle_senior.py"
          grep -q 'SECTION VIEW A-A' "$JOB_ROOT/thread_profile_coil_triangle_senior.py"
          grep -q 'AXIAL VIEW' "$JOB_ROOT/thread_profile_coil_triangle_senior.py"
          grep -q 'b = 2h' "$JOB_ROOT/thread_profile_coil_triangle_senior.py"

      - name: Install render and QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip >/dev/null
          docker pull "$MANIM_IMAGE" >/dev/null
          ffprobe -version | head -1

      - name: Literal PQL smoke render - accelerated timing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$JOB_ROOT/media_pql" "$JOB_ROOT/delivery"
          mkdir -p "$JOB_ROOT/delivery/logs" "$JOB_ROOT/delivery/qa/audit_frames" "$JOB_ROOT/delivery/final" "$JOB_ROOT/delivery/source"
          chmod -R a+rwX "$JOB_ROOT"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.12 \
            -e PYTHONPATH="/manim/$BASE_JOB" \
            -v "$GITHUB_WORKSPACE:/manim" \
            -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql thread_profile_coil_triangle_senior.py '$SCENE_NAME' \
                --fps 15 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee "$JOB_ROOT/delivery/logs/render_pql.log"

          PREVIEW="$(find "$JOB_ROOT/media_pql" -type f -name "${SCENE_NAME}.mp4" ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          cp "$PREVIEW" "$JOB_ROOT/delivery/qa/Inventor_Thread_Profile_Triangle_QA_PQL.mp4"

      - name: Literal PQH final render - full pedagogical timing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$JOB_ROOT/media"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -e PYTHONPATH="/manim/$BASE_JOB" \
            -v "$GITHUB_WORKSPACE:/manim" \
            -w "/manim/$JOB_ROOT" \
            --entrypoint bash "$MANIM_IMAGE" -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh thread_profile_coil_triangle_senior.py '$SCENE_NAME' \
                --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee "$JOB_ROOT/delivery/logs/render_pqh.log"

          FINAL="$(find "$JOB_ROOT/media" -type f -name "${SCENE_NAME}.mp4" ! -path '*/partial_movie_files/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" "$JOB_ROOT/delivery/final/$OUTPUT_NAME"
          cp "$JOB_ROOT/thread_profile_coil_triangle_senior.py" "$JOB_ROOT/delivery/source/"
          cp "$BASE_JOB/library/inventor_pro_ui.py" "$JOB_ROOT/delivery/source/"
          cp "$BASE_JOB/library/sketch_to_3d_helpers.py" "$JOB_ROOT/delivery/source/"

      - name: Senior technical QA, full decode and dense frame audit
        shell: bash
        run: |
          set -euo pipefail
          F="$JOB_ROOT/delivery/final/$OUTPUT_NAME"
          OUT="$JOB_ROOT/delivery/qa"

          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F" | tr -d '[:space:]')"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F" | tr -d '[:space:]')"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F" | tr -d '[:space:]')"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F" | tr -d '[:space:]')"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F" | tr -d '[:space:]')"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F" | tr -d '[:space:]')"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F" | tr -d '[:space:]')"

          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > "$OUT/VIDEO_TECHNICAL.tsv"

          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p

          python - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert 48 <= d <= 105, f"Unexpected lesson duration: {d}"
          print("duration QA PASS", d)
          PY

          ffmpeg -nostdin -v error -i "$F" -f null - 2> "$OUT/full_decode.log"
          test ! -s "$OUT/full_decode.log"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of json "$F" > "$OUT/VIDEO_TECHNICAL.json"

          for P in 0.03 0.10 0.17 0.24 0.31 0.38 0.45 0.52 0.59 0.66 0.73 0.80 0.87 0.94 0.985; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -y -v error -ss "$T" -i "$F" -frames:v 1 "$OUT/audit_frames/frame_${TAG}.png"
          done

          ffmpeg -nostdin -y -v error \
            -pattern_type glob -i "$OUT/audit_frames/frame_*.png" \
            -vf "scale=480:-1,tile=5x3" -frames:v 1 "$OUT/QA_CONTACT_SHEET.jpg"

          sha256sum "$F" "$JOB_ROOT/delivery/source/thread_profile_coil_triangle_senior.py" > "$OUT/SHA256SUMS.txt"
          cat > "$OUT/QA_AUTOMATED_REPORT.txt" <<EOF
          INVENTOR THREAD PROFILE TRIANGLE — SENIOR QA PASS
          ManimCE: 0.20.1
          Render gates: literal -pql -> literal -pqh
          Resolution: $W x $H
          Frame rate: $FPS
          Codec: $CODEC
          Pixel format: $PIX
          Duration: $DUR s
          Full FFmpeg decode: PASS
          Static Python compile: PASS
          Professional views: isometric + section A-A + axial + final isometric
          CAD UI: inherited Inventor Professional 2026 HUD
          Geometry: h=(Dext-Dint)/2; 60-degree flank angle; b=2h*tan(30deg); P used as helical repeat
          Audit frames: 15 + contact sheet
          EOF

      - name: Build full delivery package
        shell: bash
        run: |
          set -euo pipefail
          cat > "$JOB_ROOT/delivery/README_DELIVERY.md" <<'EOF'
          # Inventor Thread Profile Triangle — SENIOR FINAL PQH

          Professional CAD/Inventor-style ManimCE lesson explaining how pitch, major diameter and minor diameter determine the triangular Coil profile.

          Core derivation:
          - radial depth: h = (Dmajor - Dminor) / 2
          - metric flank angle used in the lesson: 60 degrees
          - simplified sharp-V profile width: b = 2 h tan(30 degrees)
          - pitch P is the axial repeat distance, not automatically the triangle base

          Advanced views included:
          - isometric diameter-envelope view
          - sketch / section derivation view
          - 3D profile placement
          - helical path preview
          - triangular swept surface
          - section A-A
          - axial view
          - final isometric orbit

          Render/QA protocol:
          ManimCE 0.20.1; literal -pql smoke gate; literal -pqh final; 1920x1080 @ 30 fps; H.264/yuv420p; FFprobe validation; full FFmpeg decode; dense audit frames; SHA-256.
          EOF

          cd "$JOB_ROOT"
          zip -9 -r Inventor_Thread_Profile_Triangle_SENIOR_FINAL_PQH_PACKAGE.zip delivery >/dev/null

      - name: Publish validated MP4 and canonical source to render branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PUBLISHED_PATH")"
          cp "$JOB_ROOT/delivery/final/$OUTPUT_NAME" "$PUBLISHED_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PUBLISHED_PATH" "$JOB_ROOT/thread_profile_coil_triangle_senior.py"
          if git diff --cached --quiet; then
            echo "Nothing new to publish"
          else
            git commit -m "Publish validated thread-profile triangle PQH render [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Upload verified FULL TOTAL package
        uses: actions/upload-artifact@v4
        with:
          name: Inventor-Thread-Profile-Triangle-SENIOR-FINAL-PQH
          path: |
            ${{ env.JOB_ROOT }}/delivery
            ${{ env.JOB_ROOT }}/Inventor_Thread_Profile_Triangle_SENIOR_FINAL_PQH_PACKAGE.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
