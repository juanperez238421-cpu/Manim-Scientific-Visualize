name: Geometry 8 Circle Measurement to Area V3 Cinematic PQH 20260823

on:
  pull_request:
    branches: [agent/geometry8-circle-pedagogical-senior-qa-20260819]
  push:
    branches: [agent/geometry8-circle-measurement-area-20260823]
    paths:
      - 'render_jobs/geometry8_circle_pedagogical_qa_20260819/**'
      - '.github/workflows/geometry8_circle_measurement_area_20260823.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-circle-measurement-area-v3:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/geometry8-circle-measurement-area-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct audited Circle source stack and compile V3
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_circle_pedagogical_qa_20260819
          mkdir -p "$JOB" out qa_media qa_out media

          cat render_jobs/geometry8_circle_20260818/f_*.b64 | base64 -d | gzip -dc > "$JOB/Geometry8_Circle_Fundamentals_FINAL.py"
          cat render_jobs/geometry8_circle_20260818/w_*.b64 | base64 -d | gzip -dc > "$JOB/Geometry8_Circle_Workshop_FINAL.py"
          cat render_jobs/geometry8_circle_20260818/s_*.b64 | base64 -d | gzip -dc > "$JOB/jp_classroom_style.py"
          cp render_jobs/geometry8_circle_class2_20260818/Geometry8_Circle_Class2_Parts_Arcs.py "$JOB/Geometry8_Circle_Class2_Parts_Arcs.py"

          python -Werror -m py_compile \
            "$JOB/jp_classroom_style.py" \
            "$JOB/Geometry8_Circle_Fundamentals_FINAL.py" \
            "$JOB/Geometry8_Circle_Class2_Parts_Arcs.py" \
            "$JOB/Geometry8_Circle_Workshop_FINAL.py" \
            "$JOB/Geometry8_Circle_PEDAGOGICAL_SEQUENCE_SENIOR_QA.py" \
            "$JOB/Geometry8_Circle_PEDAGOGICAL_SEQUENCE_SENIOR_QA_V2.py" \
            "$JOB/Geometry8_Circle_Measurement_To_Area_20260823.py" \
            "$JOB/Geometry8_Circle_Measurement_To_Area_20260823_V2.py" \
            "$JOB/Geometry8_Circle_V3_Primitives.py" \
            "$JOB/Geometry8_Circle_V3_Measurement.py" \
            "$JOB/Geometry8_Circle_V3_Area.py" \
            "$JOB/Geometry8_Circle_V3_Exercises.py" \
            "$JOB/Geometry8_Circle_Measurement_To_Area_20260823_V3.py"

          grep -Fq 'class Geometry8CircleMeasurementArea20260823V3' "$JOB/Geometry8_Circle_Measurement_To_Area_20260823_V3.py"
          grep -Fq 'MoveAlongPath' "$JOB/Geometry8_Circle_V3_Measurement.py"
          grep -Fq 'AnnularSector' "$JOB/Geometry8_Circle_V3_Area.py"
          grep -Fq 'exercise_inverse_and_context_v3' "$JOB/Geometry8_Circle_V3_Exercises.py"

      - name: PQL full-timeline runtime and safe-frame gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/manim-bin /tmp/manim-home qa_media qa_out
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=0.08

          manim -pql \
            render_jobs/geometry8_circle_pedagogical_qa_20260819/Geometry8_Circle_Measurement_To_Area_20260823_V3.py \
            Geometry8CircleMeasurementArea20260823V3 \
            --fps 15 --format=mp4 --media_dir qa_media --disable_caching \
            2>&1 | tee qa_out/MEASUREMENT_TO_AREA_V3_pql.log

          PQL="$(find qa_media -type f -name 'Geometry8CircleMeasurementArea20260823V3.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PQL" && test -s "$PQL"
          cp "$PQL" qa_out/Geometry8_Circle_Measurement_To_Area_20260823_V3_pql.mp4
          ffmpeg -nostdin -v error -i "$PQL" -f null -

      - name: PQH final render after PQL acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/manim-bin /tmp/manim-home out media
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=1.0

          manim -pqh \
            render_jobs/geometry8_circle_pedagogical_qa_20260819/Geometry8_Circle_Measurement_To_Area_20260823_V3.py \
            Geometry8CircleMeasurementArea20260823V3 \
            --fps 30 --format=mp4 --media_dir media --disable_caching \
            2>&1 | tee out/MEASUREMENT_TO_AREA_V3_pqh.log

          FINAL="$(find media -type f -name 'Geometry8CircleMeasurementArea20260823V3.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Geometry8_Circle_Measurement_To_Area_20260823_V3_FINAL_pqh.mp4

      - name: Mandatory technical verification
        shell: bash
        run: |
          set -euo pipefail
          F=out/Geometry8_Circle_Measurement_To_Area_20260823_V3_FINAL_pqh.mp4

          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 "$F" | tee out/VIDEO_TECHNICAL.txt

          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")" = 1920
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")" = 1080
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")" = 30/1
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")" = h264
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null -
          sha256sum "$F" > out/SHA256SUMS.txt

      - name: Build visual QA evidence and source bundle
        if: always()
        shell: bash
        run: |
          set +e
          F=out/Geometry8_Circle_Measurement_To_Area_20260823_V3_FINAL_pqh.mp4
          mkdir -p out/frame_samples
          if test -s "$F"; then
            DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
            python - "$DURATION" <<'PY' > /tmp/times.txt
          import sys
          d=float(sys.argv[1])
          for i in range(1,25):
              print(f"{d*i/25:.3f}")
          PY
            i=1
            while read -r t; do
              ffmpeg -nostdin -v error -ss "$t" -i "$F" -frames:v 1 -q:v 2 \
                "out/frame_samples/frame_$(printf '%02d' "$i").jpg" || true
              i=$((i+1))
            done < /tmp/times.txt
          fi

          JOB=render_jobs/geometry8_circle_pedagogical_qa_20260819
          cp "$JOB/Geometry8_Circle_Measurement_To_Area_20260823.py" out/ 2>/dev/null || true
          cp "$JOB/Geometry8_Circle_Measurement_To_Area_20260823_V2.py" out/ 2>/dev/null || true
          cp "$JOB/Geometry8_Circle_Measurement_To_Area_20260823_V3.py" out/ 2>/dev/null || true
          cp "$JOB/Geometry8_Circle_V3_Primitives.py" out/ 2>/dev/null || true
          cp "$JOB/Geometry8_Circle_V3_Measurement.py" out/ 2>/dev/null || true
          cp "$JOB/Geometry8_Circle_V3_Area.py" out/ 2>/dev/null || true
          cp "$JOB/Geometry8_Circle_V3_Exercises.py" out/ 2>/dev/null || true
          cp "$JOB/jp_classroom_style.py" out/ 2>/dev/null || true
          cp qa_out/MEASUREMENT_TO_AREA_V3_pql.log out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Geometry8-Circle-Measurement-To-Area-20260823-V3-CINEMATIC-FINAL-PQH
          path: |
            out/
            qa_out/
          if-no-files-found: error
          retention-days: 7
