name: Bootstrap Geometry 8 Week 3 Shaded Areas V1 Render

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render/geometry8-week3-shaded-v1-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4

      - name: Install FFmpeg verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Recover exact lesson source and style
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_week3_shaded_v1_20260810
          mkdir -p /tmp/week3_project
          base64 -d "$JOB/payload.tar.xz.b64" > /tmp/week3_payload.tar.xz
          tar -xJf /tmp/week3_payload.tar.xz -C /tmp/week3_project
          test -s /tmp/week3_project/Geometry8_Week3_Class1_ShadedAreas_SimpleCases_Senior_V1.py
          test -s /tmp/week3_project/jp_classroom_style.py
          test -s /tmp/week3_project/check_manim_style.py

      - name: Validate Python and JP style
        shell: bash
        run: |
          set -euo pipefail
          JOB=/tmp/week3_project
          python -m py_compile "$JOB/Geometry8_Week3_Class1_ShadedAreas_SimpleCases_Senior_V1.py" "$JOB/jp_classroom_style.py"
          python "$JOB/check_manim_style.py" "$JOB/Geometry8_Week3_Class1_ShadedAreas_SimpleCases_Senior_V1.py"
          ! grep -nE '([A-Za-z]:\\\\|/Users/|/home/[^/]+/Desktop)' "$JOB/Geometry8_Week3_Class1_ShadedAreas_SimpleCases_Senior_V1.py" "$JOB/jp_classroom_style.py"

      - name: Pull official ManimCE 0.20.1 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Render PQL then literal PQH
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          FILE=Geometry8_Week3_Class1_ShadedAreas_SimpleCases_Senior_V1.py
          SCENE=Geometry8Week3ShadedAreasSeniorV1
          SLUG=Geometry8_Week3_Class1_ShadedAreas_SimpleCases_Senior_V1
          IMAGE=manimcommunity/manim:v0.20.1
          rm -rf delivery_geometry8_week3_shaded_v1 qa_geometry8_week3_shaded_v1 media
          mkdir -p delivery_geometry8_week3_shaded_v1 qa_geometry8_week3_shaded_v1
          cp /tmp/week3_project/* .

          set +e
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.12 -v "$PWD:/manim" -w /manim --entrypoint bash "$IMAGE" -c '
            set -euo pipefail
            mkdir -p /tmp/manim-bin
            printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
            chmod +x /tmp/manim-bin/xdg-open
            export PATH="/tmp/manim-bin:$PATH"
            manim -pql "'$FILE'" "'$SCENE'" --format=mp4 --disable_caching
          ' 2>&1 | tee delivery_geometry8_week3_shaded_v1/render_pql.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi
          PREVIEW="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          cp "$PREVIEW" "delivery_geometry8_week3_shaded_v1/${SLUG}_pql.mp4"

          rm -rf media
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 -v "$PWD:/manim" -w /manim --entrypoint bash "$IMAGE" -c '
            set -euo pipefail
            mkdir -p /tmp/manim-bin
            printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
            chmod +x /tmp/manim-bin/xdg-open
            export PATH="/tmp/manim-bin:$PATH"
            manim -pqh "'$FILE'" "'$SCENE'" --format=mp4 --disable_caching
          ' 2>&1 | tee delivery_geometry8_week3_shaded_v1/render_pqh.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi

          FINAL="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" "delivery_geometry8_week3_shaded_v1/${SLUG}_pqh.mp4"
          cp "$FILE" jp_classroom_style.py check_manim_style.py delivery_geometry8_week3_shaded_v1/
          OUT="delivery_geometry8_week3_shaded_v1/${SLUG}_pqh.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 "$OUT" > delivery_geometry8_week3_shaded_v1/ffprobe.txt
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$OUT")" = 1920
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT")" = 1080
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$OUT")" = 30/1
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$OUT")" = h264
          ffmpeg -nostdin -v error -i "$OUT" -f null - 2> delivery_geometry8_week3_shaded_v1/full_decode.log
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT")"
          SAMPLE="$(python -c "d=float('$DUR'); print(max(0.001,48.0/max(d,0.001)))")"
          ffmpeg -nostdin -y -v error -i "$OUT" -vf "fps=$SAMPLE,scale=480:-1,tile=8x6:padding=8:margin=8" -frames:v 1 qa_geometry8_week3_shaded_v1/contact_sheet.jpg || true
          sha256sum "$OUT" > delivery_geometry8_week3_shaded_v1/SHA256SUMS.txt
          printf 'Scene: %s\nSource: %s\nManimCE: 0.20.1\nFinal: manim -pqh %s %s --format=mp4 --disable_caching\n' "$SCENE" "$FILE" "$FILE" "$SCENE" > delivery_geometry8_week3_shaded_v1/RENDER_INFO.txt

      - name: Upload package and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Geometry8_Period3_Week3_ShadedAreas_SimpleCases_V1_PQH
          path: |
            delivery_geometry8_week3_shaded_v1/
            qa_geometry8_week3_shaded_v1/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve failure status
        if: steps.render.outcome != 'success'
        shell: bash
        run: exit 1
