name: Physics9 Variable Velocity REALISTIC PQH 20260919

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    if: github.event.pull_request.head.ref == 'physics9-variable-velocity-realistic-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: physics9-variable-velocity-realistic-20260919

      - name: Validate Python source
        shell: bash
        run: |
          set -euo pipefail
          FILE=render_jobs/physics9_variable_velocity_20260919/physics9_variable_velocity_realistic.py
          python -m py_compile "$FILE"
          grep -q "class VariableVelocityRealWorld(Scene)" "$FILE"
          grep -q "a=\\frac" "$FILE"
          grep -q "v=v(t)" "$FILE"

      - name: Install verification tools and pull ManimCE
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          ffprobe -version | head -1

      - name: Fast PQL runtime QA
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_variable_velocity_20260919
          rm -rf media_pql qa_out
          mkdir -p qa_out
          docker run --rm --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -v "$PWD:/manim" -w /manim             --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $JOB/physics9_variable_velocity_realistic.py VariableVelocityRealWorld                 --fps 15 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee qa_out/render_pql.log
          PREVIEW="$(find media_pql -type f -name 'VariableVelocityRealWorld.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          cp "$PREVIEW" qa_out/Physics9_VariableVelocity_REALISTIC_QA_pql.mp4

      - name: Final literal PQH render
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_variable_velocity_20260919
          rm -rf media out
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -v "$PWD:/manim" -w /manim             --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $JOB/physics9_variable_velocity_realistic.py VariableVelocityRealWorld                 --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee out/render_pqh.log
          FINAL="$(find media -type f -name 'VariableVelocityRealWorld.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Physics9_VariableVelocity_RealisticMotion_FULL_FINAL_pqh.mp4

      - name: Technical video QA and audit frames
        shell: bash
        run: |
          set -euo pipefail
          F=out/Physics9_VariableVelocity_RealisticMotion_FULL_FINAL_pqh.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\n%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          mkdir -p out/audit_frames
          for P in 0.05 0.18 0.32 0.48 0.64 0.80 0.95; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%03d' "$(python -c "print(int(float('$P')*100))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_${TAG}.png"
          done
          sha256sum "$F" > out/SHA256SUMS.txt

      - name: Package source and QA evidence
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/physics9_variable_velocity_20260919
          cp "$JOB/physics9_variable_velocity_realistic.py" out/
          cp qa_out/render_pql.log out/
          cat > out/RENDER_INFO.txt <<'EOF'
          Physics 9 — Variable Velocity / Realistic Motion
          ManimCE: 0.20.1
          Preview: literal -pql
          Final: literal -pqh
          Resolution: 1920x1080
          FPS: 30
          QA: py_compile + runtime PQL + final PQH + ffprobe + full decode + audit frames + SHA-256
          Pedagogy: MRU baseline -> realistic route -> x(t) -> v(t) -> acceleration -> summary
          Scenario events: food stop, accident slowdown, heavy traffic, later speed recovery
          EOF
          cd out
          zip -9 -r Physics9_VariableVelocity_RealisticMotion_FULL_FINAL_PQH_Package.zip             Physics9_VariableVelocity_RealisticMotion_FULL_FINAL_pqh.mp4             physics9_variable_velocity_realistic.py VIDEO_TECHNICAL.tsv             SHA256SUMS.txt RENDER_INFO.txt render_pqh.log render_pql.log             full_decode.log audit_frames/

      - name: Publish verified MP4 to branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliveries/physics9
          cp out/Physics9_VariableVelocity_RealisticMotion_FULL_FINAL_pqh.mp4 deliveries/physics9/
          cp out/Physics9_VariableVelocity_RealisticMotion_FULL_FINAL_PQH_Package.zip deliveries/physics9/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliveries/physics9/
          if git diff --cached --quiet; then
            echo "No delivery changes to publish"
          else
            git commit -m "render: publish Physics9 variable velocity PQH [skip ci]"
            git push origin HEAD:physics9-variable-velocity-realistic-20260919
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Physics9-VariableVelocity-RealisticMotion-FULL-FINAL-PQH
          path: |
            out/Physics9_VariableVelocity_RealisticMotion_FULL_FINAL_pqh.mp4
            out/Physics9_VariableVelocity_RealisticMotion_FULL_FINAL_PQH_Package.zip
            out/physics9_variable_velocity_realistic.py
            out/VIDEO_TECHNICAL.tsv
            out/SHA256SUMS.txt
            out/RENDER_INFO.txt
            out/audit_frames/
          if-no-files-found: error
          retention-days: 14
