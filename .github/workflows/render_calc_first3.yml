name: Render Multivariable Calculus Problems 1-3 Senior V2 PQH

on:
  push:
    branches:
      - calc-mv-workshop-p1-first3-20260811
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip render]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STYLE_GZIP_BLOB: 420ff71e7513c1ed7be5585a8482ac9ad18d8403
      EXPECTED_SOURCE_SHA256: 254451ec2747ff01cafb21dea0575d3287b49ca0ed01296e918d8556bab4e31e
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4
        with:
          ref: calc-mv-workshop-p1-first3-20260811
          fetch-depth: 0

      - name: Recover Senior V2 source and validate Python
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p render_jobs/calc_mv_first3_senior_v2 delivery_senior_v2 /tmp/calc_sources

          base64 -d render_jobs/calc_mv_first3/first3_senior_v2.py.gz.b64 \
            | gzip -dc \
            > render_jobs/calc_mv_first3_senior_v2/first3_senior_v2.py

          ACTUAL_SOURCE_SHA256="$(sha256sum render_jobs/calc_mv_first3_senior_v2/first3_senior_v2.py | awk '{print $1}')"
          test "$ACTUAL_SOURCE_SHA256" = "$EXPECTED_SOURCE_SHA256"

          STYLE_GZ="/tmp/calc_sources/${STYLE_GZIP_BLOB}.gz"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${STYLE_GZIP_BLOB}" \
            | jq -r '.content' | tr -d '\n' | base64 -d > "$STYLE_GZ"
          gzip -t "$STYLE_GZ"
          gzip -dc "$STYLE_GZ" > render_jobs/calc_mv_first3_senior_v2/jp_classroom_style.py

          python -m py_compile \
            render_jobs/calc_mv_first3_senior_v2/first3_senior_v2.py \
            render_jobs/calc_mv_first3_senior_v2/jp_classroom_style.py

          grep -q '^class FirstThreeProblems' render_jobs/calc_mv_first3_senior_v2/first3_senior_v2.py
          cp render_jobs/calc_mv_first3_senior_v2/first3_senior_v2.py \
            delivery_senior_v2/Multivariable_Calculus_Workshop_Problems_1_2_3_SENIOR_V2.py
          cp render_jobs/calc_mv_first3_senior_v2/jp_classroom_style.py \
            delivery_senior_v2/jp_classroom_style.py
          sha256sum \
            render_jobs/calc_mv_first3_senior_v2/first3_senior_v2.py \
            render_jobs/calc_mv_first3_senior_v2/jp_classroom_style.py \
            | tee delivery_senior_v2/source_sha256.txt

      - name: Pull ManimCE 0.20.1 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: QA literal -pql render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf render_jobs/calc_mv_first3_senior_v2/media_pql
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim/render_jobs/calc_mv_first3_senior_v2 \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin /manim/delivery_senior_v2/qa_pql
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"

              manim -pql first3_senior_v2.py FirstThreeProblems \
                --format=mp4 --disable_caching \
                --media_dir media_pql

              QA="$(find media_pql -type f -name "FirstThreeProblems.mp4" -printf "%T@ %p\n" | sort -nr | head -n 1 | cut -d" " -f2-)"
              test -n "$QA"
              test -s "$QA"
              ffprobe -v error "$QA" >/dev/null

              DUR="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$QA")"
              MID="$(awk -v d="$DUR" 'BEGIN{printf "%.3f", d/2}')"
              ffmpeg -y -v error -ss 5 -i "$QA" -frames:v 1 /manim/delivery_senior_v2/qa_pql/start.png
              ffmpeg -y -v error -ss "$MID" -i "$QA" -frames:v 1 /manim/delivery_senior_v2/qa_pql/middle.png
              ffmpeg -y -v error -sseof -5 -i "$QA" -frames:v 1 /manim/delivery_senior_v2/qa_pql/end.png
            '
          test -s delivery_senior_v2/qa_pql/start.png
          test -s delivery_senior_v2/qa_pql/middle.png
          test -s delivery_senior_v2/qa_pql/end.png

      - name: Clean QA media before final render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf render_jobs/calc_mv_first3_senior_v2/media_pql
          docker system df || true

      - name: Final literal -pqh render 1920x1080 30fps
        shell: bash
        run: |
          set -euo pipefail
          rm -rf render_jobs/calc_mv_first3_senior_v2/media_pqh
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim/render_jobs/calc_mv_first3_senior_v2 \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin /manim/delivery_senior_v2/control_frames
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"

              manim -pqh first3_senior_v2.py FirstThreeProblems \
                --format=mp4 --disable_caching --fps 30 -r 1920,1080 \
                --media_dir media_pqh

              FINAL="$(find media_pqh -type f -name "FirstThreeProblems.mp4" -printf "%T@ %p\n" | sort -nr | head -n 1 | cut -d" " -f2-)"
              test -n "$FINAL"
              test -s "$FINAL"

              ffprobe -v error \
                -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
                -show_entries format=duration,size \
                -of default=noprint_wrappers=1 \
                "$FINAL" \
                | tee /manim/delivery_senior_v2/ffprobe.txt

              grep -q '^width=1920$' /manim/delivery_senior_v2/ffprobe.txt
              grep -q '^height=1080$' /manim/delivery_senior_v2/ffprobe.txt
              grep -q '^r_frame_rate=30/1$' /manim/delivery_senior_v2/ffprobe.txt
              grep -q '^codec_name=h264$' /manim/delivery_senior_v2/ffprobe.txt
              grep -q '^pix_fmt=yuv420p$' /manim/delivery_senior_v2/ffprobe.txt

              ffmpeg -v error -i "$FINAL" -f null -

              DUR="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$FINAL")"
              MID="$(awk -v d="$DUR" 'BEGIN{printf "%.3f", d/2}')"
              ffmpeg -y -v error -ss 5 -i "$FINAL" -frames:v 1 /manim/delivery_senior_v2/control_frames/start.png
              ffmpeg -y -v error -ss "$MID" -i "$FINAL" -frames:v 1 /manim/delivery_senior_v2/control_frames/middle.png
              ffmpeg -y -v error -sseof -5 -i "$FINAL" -frames:v 1 /manim/delivery_senior_v2/control_frames/end.png

              cp "$FINAL" /manim/delivery_senior_v2/Multivariable_Calculus_Workshop_Problems_1_2_3_SENIOR_V2_pqh.mp4
            '

          test -s delivery_senior_v2/Multivariable_Calculus_Workshop_Problems_1_2_3_SENIOR_V2_pqh.mp4
          test -s delivery_senior_v2/control_frames/start.png
          test -s delivery_senior_v2/control_frames/middle.png
          test -s delivery_senior_v2/control_frames/end.png
          sha256sum delivery_senior_v2/Multivariable_Calculus_Workshop_Problems_1_2_3_SENIOR_V2_pqh.mp4 \
            | tee delivery_senior_v2/video_sha256.txt

          cat > delivery_senior_v2/RENDER_INFO.txt <<'EOF'
          Scene: FirstThreeProblems
          Source: Multivariable_Calculus_Workshop_Problems_1_2_3_SENIOR_V2.py
          ManimCE: 0.20.1
          QA command: manim -pql first3_senior_v2.py FirstThreeProblems --format=mp4 --disable_caching
          Final command: manim -pqh first3_senior_v2.py FirstThreeProblems --format=mp4 --disable_caching --fps 30 -r 1920,1080
          EOF

          ls -lh delivery_senior_v2/Multivariable_Calculus_Workshop_Problems_1_2_3_SENIOR_V2_pqh.mp4

      - name: Upload Senior V2 PQH delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: multivariable-calculus-problems-1-3-senior-v2-pqh
          path: delivery_senior_v2/
          if-no-files-found: error
          retention-days: 7

      - name: Commit Senior V2 delivery back to render branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add delivery_senior_v2/
          if git diff --cached --quiet; then
            echo 'No delivery changes to commit.'
            exit 0
          fi
          git commit -m 'Add Senior V2 literal 1080p PQH calculus render [skip render]'
          git pull --rebase origin calc-mv-workshop-p1-first3-20260811
          git push origin HEAD:calc-mv-workshop-p1-first3-20260811
