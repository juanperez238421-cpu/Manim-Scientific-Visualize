name: Render Multivariable Calculus Problems 1-3 PQH

on:
  push:
    branches:
      - calc-mv-workshop-p1-first3-20260811

permissions:
  contents: write

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[skip render]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LESSON_GZIP_BLOB: d06b9ecd0a50a68538c40d452ef0213484eb9587
      STYLE_GZIP_BLOB: 420ff71e7513c1ed7be5585a8482ac9ad18d8403
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: calc-mv-workshop-p1-first3-20260811
          fetch-depth: 0

      - name: Recover exact reviewed source blobs and validate Python
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p render_jobs/calc_mv_first3 delivery /tmp/calc_sources
          get_gzip_blob() {
            local sha="$1"
            local out="$2"
            local gz="/tmp/calc_sources/${sha}.gz"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
            | jq -r '.content' | tr -d '\n' | base64 -d > "$gz"
            gzip -t "$gz"
            gzip -dc "$gz" > "$out"
          }
          get_gzip_blob "$LESSON_GZIP_BLOB" render_jobs/calc_mv_first3/first3_full.py
          get_gzip_blob "$STYLE_GZIP_BLOB" render_jobs/calc_mv_first3/jp_classroom_style.py
          python -m py_compile render_jobs/calc_mv_first3/first3_full.py render_jobs/calc_mv_first3/jp_classroom_style.py
          sha256sum render_jobs/calc_mv_first3/first3_full.py render_jobs/calc_mv_first3/jp_classroom_style.py | tee delivery/source_sha256.txt

      - name: Pull ManimCE 0.20.1 image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Low-quality QA render (-pql)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim/render_jobs/calc_mv_first3 \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/bin/xdg-open
              chmod +x /tmp/bin/xdg-open
              export PATH="/tmp/bin:$PATH"
              manim -pql first3_full.py FirstThreeProblems --disable_caching --format=mp4
            '

      - name: Final high-quality render (-pqh)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim/render_jobs/calc_mv_first3 \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/bin/xdg-open
              chmod +x /tmp/bin/xdg-open
              export PATH="/tmp/bin:$PATH"
              manim -pqh first3_full.py FirstThreeProblems --disable_caching --format=mp4
            '

      - name: Collect and verify final MP4
        shell: bash
        run: |
          set -euo pipefail
          FINAL=$(find render_jobs/calc_mv_first3/media -type f -name 'FirstThreeProblems.mp4' | sort | tail -n 1)
          test -n "$FINAL"
          cp "$FINAL" delivery/Multivariable_Calculus_Workshop_Problems_1_2_3_pqh.mp4
          cp render_jobs/calc_mv_first3/first3_full.py delivery/Multivariable_Calculus_Workshop_Problems_1_2_3.py
          cp render_jobs/calc_mv_first3/jp_classroom_style.py delivery/jp_classroom_style.py
          ffprobe -v error \
            -show_entries stream=codec_name,pix_fmt,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            delivery/Multivariable_Calculus_Workshop_Problems_1_2_3_pqh.mp4 | tee delivery/ffprobe.txt
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 delivery/Multivariable_Calculus_Workshop_Problems_1_2_3_pqh.mp4)" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 delivery/Multivariable_Calculus_Workshop_Problems_1_2_3_pqh.mp4)" = "1080"
          sha256sum \
            delivery/Multivariable_Calculus_Workshop_Problems_1_2_3_pqh.mp4 \
            delivery/Multivariable_Calculus_Workshop_Problems_1_2_3.py \
            delivery/jp_classroom_style.py | tee delivery/delivery_sha256.txt

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: multivariable-calculus-problems-1-3-pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified delivery back to render branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            delivery/Multivariable_Calculus_Workshop_Problems_1_2_3_pqh.mp4 \
            delivery/Multivariable_Calculus_Workshop_Problems_1_2_3.py \
            delivery/jp_classroom_style.py \
            delivery/source_sha256.txt delivery/ffprobe.txt delivery/delivery_sha256.txt
          git commit -m 'Add verified PQH render for calculus workshop problems 1-3 [skip render]'
          git push origin HEAD:calc-mv-workshop-p1-first3-20260811
