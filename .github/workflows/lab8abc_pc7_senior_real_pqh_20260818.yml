name: Lab 8A 8B 8C PC07 Senior REAL PQH 20260818

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/lab8abc-pc7-senior-real-pqh-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Recover the accepted professional Manim sources
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/lab8abc_pc7_senior_real_20260818
          mkdir -p "$JOB/library" out qa_out

          curl -fsSL "https://raw.githubusercontent.com/juanperez238421-cpu/Manim-Scientific-Visualize/agent/lab8a-fixed-seating-pqh-20260818/render_jobs/lab8a_seating_20260818/lab8a_seating.py" -o "$JOB/lab8a_seating.py"
          curl -fsSL "https://raw.githubusercontent.com/juanperez238421-cpu/Manim-Scientific-Visualize/agent/lab8b-fixed-seating-pqh-20260818/render_jobs/lab8b_seating_20260818/lab8b_seating.py" -o "$JOB/lab8b_seating.py"
          curl -fsSL "https://raw.githubusercontent.com/juanperez238421-cpu/Manim-Scientific-Visualize/agent/lab8c-fixed-seating-pqh-20260818/render_jobs/lab8c_seating_20260818/lab8c_seating.py" -o "$JOB/lab8c_seating.py"

          curl -fsSL "https://raw.githubusercontent.com/juanperez238421-cpu/Manim-Scientific-Visualize/agent/lab8a-fixed-seating-pqh-20260818/render_jobs/lab8a_seating_20260818/style_00.b64" -o "$JOB/style_00.b64"
          curl -fsSL "https://raw.githubusercontent.com/juanperez238421-cpu/Manim-Scientific-Visualize/agent/lab8a-fixed-seating-pqh-20260818/render_jobs/lab8a_seating_20260818/style_01.b64" -o "$JOB/style_01.b64"
          cat "$JOB"/style_*.b64 | base64 -d | gzip -dc > "$JOB/library/jp_classroom_style.py"
          touch "$JOB/library/__init__.py"

          python "$JOB/patch_pc7.py"
          python -m py_compile "$JOB/lab8a_seating.py" "$JOB/lab8b_seating.py" "$JOB/lab8c_seating.py" "$JOB/library/jp_classroom_style.py"

          grep -q 'SEATS_BY_PC\[7\] = ("A", "B")' "$JOB/lab8a_seating.py"
          grep -q 'SEATS_BY_PC\[7\] = ("A", "B")' "$JOB/lab8b_seating.py"
          grep -q 'SEATS_BY_PC\[7\] = ("A", "B")' "$JOB/lab8c_seating.py"
          grep -q 'PC07 · SOLO 2 SILLAS' "$JOB/lab8a_seating.py"
          grep -q 'PC07 · SOLO 2 SILLAS' "$JOB/lab8b_seating.py"
          grep -q 'PC07 · SOLO 2 SILLAS' "$JOB/lab8c_seating.py"

      - name: Install verification tools and exact ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Literal PQL accelerated QA for all three groups
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/lab8abc_pc7_senior_real_20260818
          rm -rf media_pql qa_out
          mkdir -p qa_out

          for spec in \
            "8A lab8a_seating.py Lab8AFixedSeating" \
            "8B lab8b_seating.py Lab8BFixedSeating" \
            "8C lab8c_seating.py Lab8CFixedSeating"
          do
            set -- $spec
            GROUP="$1"; FILE="$2"; SCENE="$3"
            docker run --rm --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.06 \
              -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
                set -euo pipefail
                mkdir -p /tmp/manim-bin
                printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
                chmod +x /tmp/manim-bin/xdg-open
                export PATH=/tmp/manim-bin:\$PATH
                manim -pql $JOB/$FILE $SCENE --fps 15 --format=mp4 --media_dir media_pql/$GROUP --disable_caching
              " 2>&1 | tee "qa_out/render_${GROUP}_pql.log"
            PREVIEW="$(find "media_pql/$GROUP" -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            test -n "$PREVIEW" && test -s "$PREVIEW"
            cp "$PREVIEW" "qa_out/Lab${GROUP}_PC07_QA_pql.mp4"
          done

      - name: Literal PQH final renders from real ManimCE scenes
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/lab8abc_pc7_senior_real_20260818
          rm -rf media out
          mkdir -p out

          for spec in \
            "8A lab8a_seating.py Lab8AFixedSeating" \
            "8B lab8b_seating.py Lab8BFixedSeating" \
            "8C lab8c_seating.py Lab8CFixedSeating"
          do
            set -- $spec
            GROUP="$1"; FILE="$2"; SCENE="$3"
            docker run --rm --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
              -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
                set -euo pipefail
                mkdir -p /tmp/manim-bin
                printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
                chmod +x /tmp/manim-bin/xdg-open
                export PATH=/tmp/manim-bin:\$PATH
                manim -pqh $JOB/$FILE $SCENE --fps 30 --format=mp4 --media_dir media/$GROUP --disable_caching
              " 2>&1 | tee "out/render_${GROUP}_pqh.log"
            FINAL="$(find "media/$GROUP" -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            test -n "$FINAL" && test -s "$FINAL"
            cp "$FINAL" "out/Lab${GROUP}_Fixed_Seating_PC07_2Seats_SENIOR_FINAL_pqh.mp4"
          done

      - name: Full technical and visual QA
        shell: bash
        run: |
          set -euo pipefail
          printf 'group\twidth\theight\tfps\tcodec\tpix_fmt\tduration\n' > out/VIDEO_TECHNICAL.tsv
          mkdir -p out/qa_frames

          for GROUP in 8A 8B 8C; do
            F="out/Lab${GROUP}_Fixed_Seating_PC07_2Seats_SENIOR_FINAL_pqh.mp4"
            W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
            H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
            FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
            CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
            PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
            DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$GROUP" "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" >> out/VIDEO_TECHNICAL.tsv

            test "$W" = 1920
            test "$H" = 1080
            test "$FPS" = 30/1
            test "$CODEC" = h264
            test "$PIX" = yuv420p
            python - "$DUR" <<'PY'
import sys
d=float(sys.argv[1])
assert 50 <= d <= 220, d
PY
            ffmpeg -nostdin -v error -i "$F" -f null - 2> "out/full_decode_${GROUP}.log"

            T1="$(awk -v d="$DUR" 'BEGIN{printf "%.2f", d*0.18}')"
            T2="$(awk -v d="$DUR" 'BEGIN{printf "%.2f", d*0.52}')"
            T3="$(awk -v d="$DUR" 'BEGIN{printf "%.2f", d*0.84}')"
            ffmpeg -y -ss "$T1" -i "$F" -frames:v 1 "out/qa_frames/${GROUP}_01_orientation.png" >/dev/null 2>&1
            ffmpeg -y -ss "$T2" -i "$F" -frames:v 1 "out/qa_frames/${GROUP}_02_assignment.png" >/dev/null 2>&1
            ffmpeg -y -ss "$T3" -i "$F" -frames:v 1 "out/qa_frames/${GROUP}_03_final.png" >/dev/null 2>&1
          done

          sha256sum out/Lab8*_Fixed_Seating_PC07_2Seats_SENIOR_FINAL_pqh.mp4 > out/SHA256SUMS.txt

      - name: Package the three verified final videos
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/lab8abc_pc7_senior_real_20260818
          cp "$JOB/lab8a_seating.py" out/Lab8A_PC07_2Seats_source.py
          cp "$JOB/lab8b_seating.py" out/Lab8B_PC07_2Seats_source.py
          cp "$JOB/lab8c_seating.py" out/Lab8C_PC07_2Seats_source.py
          cp "$JOB/library/jp_classroom_style.py" out/jp_classroom_style.py
          cp qa_out/render_*_pql.log out/
          printf 'Engine: ManimCE 0.20.1\nFinal command: literal -pqh\nResolution: 1920x1080\nFPS: 30\nCodec: H.264 / yuv420p\nPhysical correction: PC07 has exactly two seats, A and B.\n8A: students 19-20 PC07; student 21 moves to PC08-A.\n8B: students 19-20 PC07; students 21-23 PC08.\n8C: students 19-20 PC07; students 21-23 PC08; students 24-25 PC09-A/B.\n' > out/RENDER_INFO.txt

          cd out
          zip -9 Lab8_ABC_PC07_2Seats_SENIOR_REAL_MANIM_PQH_PACKAGE.zip \
            Lab8A_Fixed_Seating_PC07_2Seats_SENIOR_FINAL_pqh.mp4 \
            Lab8B_Fixed_Seating_PC07_2Seats_SENIOR_FINAL_pqh.mp4 \
            Lab8C_Fixed_Seating_PC07_2Seats_SENIOR_FINAL_pqh.mp4 \
            Lab8A_PC07_2Seats_source.py Lab8B_PC07_2Seats_source.py Lab8C_PC07_2Seats_source.py \
            jp_classroom_style.py VIDEO_TECHNICAL.tsv SHA256SUMS.txt RENDER_INFO.txt \
            render_8A_pqh.log render_8B_pqh.log render_8C_pqh.log \
            render_8A_pql.log render_8B_pql.log render_8C_pql.log \
            full_decode_8A.log full_decode_8B.log full_decode_8C.log qa_frames/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: Lab8-ABC-PC07-2Seats-SENIOR-REAL-MANIM-PQH
          path: |
            out/Lab8A_Fixed_Seating_PC07_2Seats_SENIOR_FINAL_pqh.mp4
            out/Lab8B_Fixed_Seating_PC07_2Seats_SENIOR_FINAL_pqh.mp4
            out/Lab8C_Fixed_Seating_PC07_2Seats_SENIOR_FINAL_pqh.mp4
            out/Lab8_ABC_PC07_2Seats_SENIOR_REAL_MANIM_PQH_PACKAGE.zip
            out/VIDEO_TECHNICAL.tsv
            out/SHA256SUMS.txt
            out/RENDER_INFO.txt
            out/qa_frames/*.png
          if-no-files-found: error
          retention-days: 7
