name: Physics 9 City Cars V4 JP Classroom PQH 20260909

on:
  push:
    branches:
      - manim/physics9-city-cars-v4-jp-classroom-20260909
    paths:
      - 'render_jobs/physics9_city_cars_20260908/physics9_city_cars_position_velocity_v4.py'
      - '.github/workflows/physics9_city_cars_v4_jp_classroom_20260909.yml'

permissions:
  contents: write
  actions: read

jobs:
  render_publish_v4:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB: render_jobs/physics9_city_cars_20260908
      SOURCE: physics9_city_cars_position_velocity_v4.py
      SCENE: Physics9CityCarsV4
      FINAL_NAME: Physics9_City_Cars_Position_Velocity_V4_JP_CLASSROOM_FINAL_pqh.mp4
      ARTIFACT_NAME: Physics9-City-Cars-V4-JP-Classroom-FINAL-PQH

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile and structurally validate V4 JP classroom source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$JOB/$SOURCE"
          grep -q 'class Physics9CityCarsV4(JPMathClassroomScene)' "$JOB/$SOURCE"
          grep -q 'class JPMathClassroomScene(MovingCameraScene)' "$JOB/$SOURCE"
          grep -q 'def directional_car' "$JOB/$SOURCE"
          grep -q 'Headlight stays at the physical nose' "$JOB/$SOURCE"
          grep -q 'def set_header' "$JOB/$SOURCE"
          grep -q 'def assert_content_safe' "$JOB/$SOURCE"
          grep -q 'def process_map' "$JOB/$SOURCE"
          grep -q 'ValueTracker' "$JOB/$SOURCE"
          echo 'V4 JP classroom structural QA: PASS'

      - name: Install stable QA tools and pull ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*chrome*' -o -iname '*google*' \) -print -delete || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1
          docker pull manimcommunity/manim:v0.20.1

      - name: Accelerated full-timeline V4 smoke render
        shell: bash
        run: |
          set -uo pipefail
          rm -rf media_pql qa_pql && mkdir -p qa_pql
          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.06 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              manim -ql $JOB/$SOURCE $SCENE --fps 15 --format=mp4 --media_dir media_pql --disable_caching
            " > qa_pql/render_pql.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "--- V4 SMOKE FAILURE: last 200 log lines ---"
            tail -n 200 qa_pql/render_pql.log
            exit "$STATUS"
          fi
          tail -n 30 qa_pql/render_pql.log
          PREVIEW="$(find media_pql -type f -name "$SCENE.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$PREVIEW" && test -s "$PREVIEW"
          cp "$PREVIEW" qa_pql/Physics9_City_Cars_V4_JP_CLASSROOM_FULL_TIMELINE_QA_pql.mp4

      - name: Render literal PQH V4 JP classroom final
        shell: bash
        run: |
          set -uo pipefail
          rm -rf media_v4 out && mkdir -p out
          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              manim -qh $JOB/$SOURCE $SCENE --fps 30 --format=mp4 --media_dir media_v4 --disable_caching
            " > out/render_pqh.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "--- V4 PQH FAILURE: last 200 log lines ---"
            tail -n 200 out/render_pqh.log
            exit "$STATUS"
          fi
          tail -n 30 out/render_pqh.log
          FINAL="$(find media_v4 -type f -name "$SCENE.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" "out/$FINAL_NAME"

      - name: Senior technical QA and distributed visual evidence
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          F="out/$FINAL_NAME"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(stat -c%s "$F")"
          echo "probe=$W x $H | $FPS | $CODEC | $PIX | duration=$DUR | bytes=$SIZE"
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          python - <<PY
          d=float('$DUR')
          assert 90 <= d <= 420, f'Unexpected V4 classroom duration: {d}'
          print('duration_pass', d)
          PY
          test "$SIZE" -gt 1000000
          test "$SIZE" -lt $((95 * 1024 * 1024))
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          test ! -s out/full_decode.log

          mkdir -p out/audit_frames
          for P in 0.02 0.07 0.12 0.17 0.22 0.27 0.32 0.37 0.42 0.47 0.52 0.57 0.62 0.67 0.72 0.77 0.82 0.87 0.92 0.97; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_${TAG}.png"
          done
          INTERVAL="$(python -c "print(max(float('$DUR')/20.0,1.0))")"
          ffmpeg -nostdin -loglevel error -i "$F" \
            -vf "fps=1/$INTERVAL,scale=384:-1,tile=5x4:padding=5:margin=5" \
            -frames:v 1 -q:v 2 out/contact_sheet.jpg

          sha256sum "$F" | tee out/SHA256SUMS.txt
          SHA="$(awk '{print $1}' out/SHA256SUMS.txt)"
          {
            echo "file=$FINAL_NAME"
            echo "width=$W"
            echo "height=$H"
            echo "fps=$FPS"
            echo "codec=$CODEC"
            echo "pix_fmt=$PIX"
            echo "duration=$DUR"
            echo "size_bytes=$SIZE"
            echo "sha256=$SHA"
            echo "full_decode=PASS"
            echo "style=JP Classroom Standard: white canvas, numbered persistent headers, monochrome UI, safe zones, consistent panels"
            echo "semantic_accents=Car A blue, Car B red, meeting/check result green only"
            echo "diagram_preserved=V3 asymmetric mirrored car bodies, nose/headlight direction, road/city model, live meeting"
            echo "pedagogy=physical model -> signs -> x(t) -> stepwise solve -> live motion -> x-t -> v-t -> independent checks -> method map"
            echo "visual_evidence=20 distributed frames + 5x4 contact sheet"
          } > out/VIDEO_QA_V4.txt
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "duration=$DUR" >> "$GITHUB_OUTPUT"

      - name: Upload complete V4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            out/${{ env.FINAL_NAME }}
            out/VIDEO_QA_V4.txt
            out/SHA256SUMS.txt
            out/contact_sheet.jpg
            out/audit_frames/
            out/full_decode.log
            out/render_pqh.log
            qa_pql/render_pql.log
            qa_pql/Physics9_City_Cars_V4_JP_CLASSROOM_FULL_TIMELINE_QA_pql.mp4
            ${{ env.JOB }}/${{ env.SOURCE }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish validated V4 MP4, source, and QA evidence to branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published_renders
          cp "out/$FINAL_NAME" "published_renders/$FINAL_NAME"
          cp out/VIDEO_QA_V4.txt published_renders/Physics9_City_Cars_Position_Velocity_V4_JP_CLASSROOM_QA.txt
          cp out/contact_sheet.jpg published_renders/Physics9_City_Cars_Position_Velocity_V4_JP_CLASSROOM_contact_sheet.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "published_renders/$FINAL_NAME" \
            published_renders/Physics9_City_Cars_Position_Velocity_V4_JP_CLASSROOM_QA.txt \
            published_renders/Physics9_City_Cars_Position_Velocity_V4_JP_CLASSROOM_contact_sheet.jpg \
            "$JOB/$SOURCE"
          git commit -m "Publish Physics 9 city cars V4 JP classroom FINAL PQH [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Verify real GitHub raw MP4 URL and byte identity
        shell: bash
        run: |
          set -euo pipefail
          DIRECT="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/${GITHUB_REF_NAME}/published_renders/${FINAL_NAME}"
          SOURCE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/${GITHUB_REF_NAME}/${JOB}/${SOURCE}"
          curl -L --fail --retry 8 --retry-delay 2 -o /tmp/verified_v4.mp4 "$DIRECT"
          EXPECTED="${{ steps.qa.outputs.sha }}"
          ACTUAL="$(sha256sum /tmp/verified_v4.mp4 | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          curl -L --fail --retry 4 --retry-delay 2 -o /tmp/verified_v4.py "$SOURCE_URL"
          python -m py_compile /tmp/verified_v4.py
          echo "DIRECT_URL=$DIRECT"
          echo "SOURCE_URL=$SOURCE_URL"
          echo "SHA256=$ACTUAL"
