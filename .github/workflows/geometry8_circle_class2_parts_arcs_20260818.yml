name: Geometry 8 Circle Class 2 Parts Arcs PQH 20260818

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render-circle-class2:
    if: github.event.pull_request.head.ref == 'agent/geometry8-circle-final-total-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: manimcommunity/manim:v0.20.1
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact source and style
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/geometry8_circle_class2_20260818
          mkdir -p "$JOB"
          base64 -d "$JOB/class2_full.b64" | gzip -dc > "$JOB/Geometry8_Circle_Class2_Parts_Arcs.py"
          cat render_jobs/geometry8_circle_20260818/s_*.b64 | base64 -d | gzip -dc > "$JOB/jp_classroom_style.py"
          python -Werror -m py_compile "$JOB/Geometry8_Circle_Class2_Parts_Arcs.py" "$JOB/jp_classroom_style.py"
          grep -q 'class Geometry8CircleClass2PartsArcs' "$JOB/Geometry8_Circle_Class2_Parts_Arcs.py"

      - name: Literal PQL visual runtime QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/manim-bin qa_media qa_out
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=0.08
          manim -pql render_jobs/geometry8_circle_class2_20260818/Geometry8_Circle_Class2_Parts_Arcs.py Geometry8CircleClass2PartsArcs --fps 15 --format=mp4 --media_dir qa_media --disable_caching 2>&1 | tee qa_out/Geometry8CircleClass2PartsArcs_pql.log

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/manim-bin out media
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          export PATH=/tmp/manim-bin:$PATH
          export HOME=/tmp/manim-home
          export LESSON_TIME_SCALE=1.0
          manim -pqh render_jobs/geometry8_circle_class2_20260818/Geometry8_Circle_Class2_Parts_Arcs.py Geometry8CircleClass2PartsArcs --fps 30 --format=mp4 --media_dir media --disable_caching 2>&1 | tee out/Geometry8CircleClass2PartsArcs_pqh.log
          FINAL="$(find media -type f -name 'Geometry8CircleClass2PartsArcs.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL" && test -s "$FINAL"
          cp "$FINAL" out/Geometry8_Circle_Class2_PARTS_ARCS_FINAL_pqh.mp4

      - name: Verify final MP4 and preserve exact sources
        shell: bash
        run: |
          set -euo pipefail
          F=out/Geometry8_Circle_Class2_PARTS_ARCS_FINAL_pqh.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 "$F" | tee out/VIDEO_TECHNICAL.txt
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")" = 1920
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")" = 1080
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")" = 30/1
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")" = h264
          ffmpeg -nostdin -v error -i "$F" -f null -
          sha256sum "$F" > out/SHA256SUMS.txt
          cp render_jobs/geometry8_circle_class2_20260818/Geometry8_Circle_Class2_Parts_Arcs.py out/
          cp render_jobs/geometry8_circle_class2_20260818/jp_classroom_style.py out/
          cp qa_out/Geometry8CircleClass2PartsArcs_pql.log out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Geometry8-Circle-Class2-PARTS-ARCS-FINAL-PQH
          path: out/
          if-no-files-found: error
          retention-days: 7
