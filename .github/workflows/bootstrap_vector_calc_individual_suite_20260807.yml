name: Bootstrap Vector Calculus Individual Suite Native Render

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'render/vector-calc-individual-suite-20260807'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - slug: 00_foundations_traces
            file: 00_foundations_traces.py
            scene: VC00FoundationsTraces
          - slug: 01_circular_cylinder
            file: 01_circular_cylinder.py
            scene: VC01CircularCylinder
          - slug: 02_parabolic_cylinder
            file: 02_parabolic_cylinder.py
            scene: VC02ParabolicCylinder
          - slug: 03_ellipsoid
            file: 03_ellipsoid.py
            scene: VC03Ellipsoid
          - slug: 04_hyperboloid_one_sheet
            file: 04_hyperboloid_one_sheet.py
            scene: VC04HyperboloidOneSheet
          - slug: 05_hyperboloid_two_sheets
            file: 05_hyperboloid_two_sheets.py
            scene: VC05HyperboloidTwoSheets
          - slug: 06_elliptic_cone
            file: 06_elliptic_cone.py
            scene: VC06EllipticCone
          - slug: 07_elliptic_paraboloid
            file: 07_elliptic_paraboloid.py
            scene: VC07EllipticParaboloid
          - slug: 08_hyperbolic_paraboloid
            file: 08_hyperbolic_paraboloid.py
            scene: VC08HyperbolicParaboloid
          - slug: 09_classification_workshop
            file: 09_classification_workshop.py
            scene: VC09ClassificationWorkshop

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Restore source bundle
        shell: bash
        run: |
          set -euo pipefail
          JOB=render_jobs/vector_calc_individual_suite_20260807
          base64 -d "$JOB/sources.b64" > /tmp/vector_calc_suite_sources.zip
          unzip -q -o /tmp/vector_calc_suite_sources.zip -d "$JOB"
          test -s "$JOB/src/common.py"
          test -s "$JOB/src/${{ matrix.file }}"

      - name: Resolve phase
        id: phase
        shell: bash
        run: |
          set -euo pipefail
          PHASE="$(tr -d '[:space:]' < render_jobs/vector_calc_individual_suite_20260807/phase.txt)"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          if [ "$PHASE" = "pql" ]; then
            echo "quality=-pql" >> "$GITHUB_OUTPUT"
            echo "scale=0.065" >> "$GITHUB_OUTPUT"
          elif [ "$PHASE" = "pqh" ]; then
            echo "quality=-pqh" >> "$GITHUB_OUTPUT"
            echo "scale=1.0" >> "$GITHUB_OUTPUT"
          else
            exit 2
          fi

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile render_jobs/vector_calc_individual_suite_20260807/src/common.py
          python -m py_compile "render_jobs/vector_calc_individual_suite_20260807/src/${{ matrix.file }}"

      - name: Install FFmpeg QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Native ManimCE render
        shell: bash
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          QUALITY: ${{ steps.phase.outputs.quality }}
          SCALE: ${{ steps.phase.outputs.scale }}
          SLUG: ${{ matrix.slug }}
          FILE: ${{ matrix.file }}
          SCENE: ${{ matrix.scene }}
        run: |
          set -euo pipefail
          JOB=render_jobs/vector_calc_individual_suite_20260807
          mkdir -p "delivery/$SLUG" "qa/$SLUG"
          docker pull manimcommunity/manim:v0.20.1
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE="$SCALE" \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim --version
              manim '"$QUALITY"' '"$JOB"'/src/'"$FILE"' '"$SCENE"' --format=mp4 --disable_caching
            ' 2>&1 | tee "delivery/$SLUG/render_${PHASE}.log"

          VIDEO="$(find media -type f -name "${SCENE}.mp4" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO"
          test -s "$VIDEO"
          cp "$VIDEO" "delivery/$SLUG/${SLUG}_${PHASE}.mp4"
          cp "$JOB/src/$FILE" "delivery/$SLUG/$FILE"
          cp "$JOB/src/common.py" "delivery/$SLUG/common.py"

          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "delivery/$SLUG/${SLUG}_${PHASE}.mp4" | tee "delivery/$SLUG/ffprobe.txt"

          ffmpeg -v error -i "delivery/$SLUG/${SLUG}_${PHASE}.mp4" -f null - 2> "delivery/$SLUG/full_decode.log"
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "delivery/$SLUG/${SLUG}_${PHASE}.mp4")"
          FPS_SAMPLE="$(python - <<PY
D=float("$DURATION")
print(max(0.001, 12.0/max(D,0.001)))
PY
)"
          ffmpeg -y -v error -i "delivery/$SLUG/${SLUG}_${PHASE}.mp4" \
            -vf "fps=$FPS_SAMPLE,scale=480:-1,tile=4x3:padding=8:margin=8" \
            -frames:v 1 "qa/$SLUG/contact_sheet.jpg" || true

          sha256sum "delivery/$SLUG/${SLUG}_${PHASE}.mp4" > "delivery/$SLUG/SHA256SUMS.txt"
          cat > "delivery/$SLUG/RENDER_INFO.txt" <<EOF
Scene: $SCENE
Source: $FILE
Shared library: common.py
ManimCE: 0.20.1
Phase: $PHASE
Command: manim $QUALITY $JOB/src/$FILE $SCENE --format=mp4 --disable_caching
LESSON_TIME_SCALE: $SCALE
EOF

      - name: Upload scene artifact
        uses: actions/upload-artifact@v4
        with:
          name: VectorCalc_${{ matrix.slug }}_${{ steps.phase.outputs.phase }}
          path: |
            delivery/${{ matrix.slug }}/
            qa/${{ matrix.slug }}/contact_sheet.jpg
          if-no-files-found: error
          retention-days: 7
