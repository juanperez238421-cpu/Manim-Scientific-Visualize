name: House Step V3 FINAL Delivery 20260818

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'house-step-v3-render-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact V3 branch
        uses: actions/checkout@v4
        with:
          ref: house-step-v3-render-20260818

      - name: Prepare verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1
          docker pull manimcommunity/manim:v0.20.1 >/dev/null

      - name: Compile source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile render_jobs/house_step_v3/House_Extrusion_3D_ManimCE.py

      - name: Literal PQL QA render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/house_step_v3/House_Extrusion_3D_ManimCE.py
          rm -rf media_pql qa_out && mkdir -p qa_out
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $SRC HouseExtrusion3D --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee qa_out/render_pql.log
          P="$(find media_pql -type f -name 'HouseExtrusion3D.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$P" && test -s "$P"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          SRC=render_jobs/house_step_v3/House_Extrusion_3D_ManimCE.py
          rm -rf media out && mkdir -p out/audit_frames
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $SRC HouseExtrusion3D --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee out/render_pqh.log
          F="$(find media -type f -name 'HouseExtrusion3D.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$F" && test -s "$F"
          cp "$F" out/House_Extrusion_3D_STEP_BY_STEP_V3_FINAL_PQH.mp4
          cp "$SRC" out/House_Extrusion_3D_STEP_BY_STEP_V3.py

      - name: Strict MP4 QA
        shell: bash
        run: |
          set -euo pipefail
          F=out/House_Extrusion_3D_STEP_BY_STEP_V3_FINAL_PQH.mp4
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log
          for P in 0.05 0.15 0.25 0.35 0.45 0.55 0.65 0.75 0.85 0.95; do
            T="$(python -c "print(float('$DUR')*float('$P'))")"
            TAG="$(printf '%04d' "$(python -c "print(int(float('$P')*1000))")")"
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/frame_${TAG}.png"
          done
          sha256sum "$F" out/House_Extrusion_3D_STEP_BY_STEP_V3.py > out/SHA256SUMS.txt
          printf 'SUCCESS\n' > out/STATUS.txt

      - name: Upload verified final MP4
        uses: actions/upload-artifact@v4
        with:
          name: House-Step-V3-FINAL-PQH-20260818
          path: |
            out/House_Extrusion_3D_STEP_BY_STEP_V3_FINAL_PQH.mp4
            out/House_Extrusion_3D_STEP_BY_STEP_V3.py
            out/VIDEO_TECHNICAL.tsv
            out/SHA256SUMS.txt
            out/STATUS.txt
            out/audit_frames/
          if-no-files-found: error
          retention-days: 7
