name: Render Calculus Problems 1-3 Senior V2

on:
  push:
    branches:
      - calc-mv-workshop-p1-first3-20260811
    paths:
      - ".github/workflows/render_calc_first3_senior_v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: calc-mv-workshop-p1-first3-20260811
          fetch-depth: 0

      - name: Recover Senior V2 source and validate
        shell: bash
        env:
          SOURCE_GZIP_B64: 
        run: |
          set -euo pipefail
          mkdir -p render_jobs/calc_mv_first3_senior_v2 delivery
          printf '%s' "$SOURCE_GZIP_B64" | base64 -d | gzip -dc > render_jobs/calc_mv_first3_senior_v2/first3_senior_v2.py
          cp delivery/jp_classroom_style.py render_jobs/calc_mv_first3_senior_v2/jp_classroom_style.py
          python -m py_compile render_jobs/calc_mv_first3_senior_v2/first3_senior_v2.py render_jobs/calc_mv_first3_senior_v2/jp_classroom_style.py
          test "$(sha256sum render_jobs/calc_mv_first3_senior_v2/first3_senior_v2.py | awk '{print $1}')" = "254451ec2747ff01cafb21dea0575d3287b49ca0ed01296e918d8556bab4e31e"
          cp render_jobs/calc_mv_first3_senior_v2/first3_senior_v2.py delivery/Multivariable_Calculus_Workshop_Problems_1_2_3_SENIOR_V2.py
          sha256sum render_jobs/calc_mv_first3_senior_v2/first3_senior_v2.py render_jobs/calc_mv_first3_senior_v2/jp_classroom_style.py | tee delivery/SENIOR_V2_source_sha256.txt

      - name: Pull ManimCE 0.20.1 image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: QA literal -pql render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf render_jobs/calc_mv_first3_senior_v2/media_pql
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim/render_jobs/calc_mv_first3_senior_v2 \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/bin/xdg-open
              chmod +x /tmp/bin/xdg-open
              export PATH="/tmp/bin:$PATH"
              manim -pql first3_senior_v2.py FirstThreeProblems \
                --disable_caching --format=mp4 --fps 15 -r 854,480 \
                --media_dir media_pql
              QA=$(find media_pql -type f -name "FirstThreeProblems.mp4" -printf "%T@ %p\n" | sort -nr | head -n1 | cut -d" " -f2-)
              test -n "$QA"
              test -s "$QA"
            '

      - name: Final literal -pqh render 1920x1080 30fps
        shell: bash
        run: |
          set -euo pipefail
          rm -rf render_jobs/calc_mv_first3_senior_v2/media_pqh
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.88 \
            -v "$PWD:/manim" -w /manim/render_jobs/calc_mv_first3_senior_v2 \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/bin /manim/delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/bin/xdg-open
              chmod +x /tmp/bin/xdg-open
              export PATH="/tmp/bin:$PATH"
              manim -pqh first3_senior_v2.py FirstThreeProblems \
                --disable_caching --format=mp4 --fps 30 -r 1920,1080 \
                --media_dir media_pqh
              FINAL=$(find media_pqh -type f -name "FirstThreeProblems.mp4" -printf "%T@ %p\n" | sort -nr | head -n1 | cut -d" " -f2-)
              test -n "$FINAL"
              test -s "$FINAL"
              cp "$FINAL" /manim/delivery/Multivariable_Calculus_Workshop_Problems_1_2_3_SENIOR_V2_pqh.mp4
              ffprobe -v error \
                -show_entries stream=codec_name,pix_fmt,width,height,r_frame_rate \
                -show_entries format=duration,size \
                -of default=noprint_wrappers=1 \
                /manim/delivery/Multivariable_Calculus_Workshop_Problems_1_2_3_SENIOR_V2_pqh.mp4 \
                | tee /manim/delivery/SENIOR_V2_ffprobe.txt
            '
          sha256sum delivery/Multivariable_Calculus_Workshop_Problems_1_2_3_SENIOR_V2_pqh.mp4 | tee delivery/SENIOR_V2_video_sha256.txt

      - name: Upload Senior V2 PQH artifact
        uses: actions/upload-artifact@v4
        with:
          name: multivariable-calculus-problems-1-3-senior-v2-pqh
          path: |
            delivery/Multivariable_Calculus_Workshop_Problems_1_2_3_SENIOR_V2_pqh.mp4
            delivery/Multivariable_Calculus_Workshop_Problems_1_2_3_SENIOR_V2.py
            delivery/jp_classroom_style.py
            delivery/SENIOR_V2_source_sha256.txt
            delivery/SENIOR_V2_video_sha256.txt
            delivery/SENIOR_V2_ffprobe.txt
          if-no-files-found: error
          retention-days: 7
