[project]
name = "animotionpdf-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psycopg[binary,pool]>=3.1",
  "pyjwt[crypto]>=2.8",
  "pypdf>=4.0",
  "boto3>=1.34",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "openapi-spec-validator>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
