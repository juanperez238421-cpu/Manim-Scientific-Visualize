[project]
name = "scianim-adapter"
version = "0.1.0"
description = "Safe adapter between AniMotionPDF and the pdf2video engine (PDF -> verified solution video)"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "reportlab>=4.0"]

[tool.setuptools]
packages = ["scianim_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
